</td><td>親愛的弟兄</td><td>三個稱呼的第一個</td></tr><tr><td>πιστὸς διάκονος</td><td>pistos diakonos</td><td>忠心的執事</td><td>1:7 以巴弗、1:23 保羅也用這個字</td></tr><tr><td>σύνδουλος ἐν κυρίῳ</td><td>syndoulos en kyriō</td><td>在主裡一同作奴僕的</td><td>同工的「同」，不收入追蹤二</td></tr><tr><td>ἔπεμψα</td><td>epempsa</td><td>我差了</td><td>書信式不定過去式：讀信時他已經到了</td></tr></table>","gram":"<p><strong>4:7 起是書信的結尾：近況、送信人、問安、囑咐、親筆。保羅不在信裡寫自己的近況，Τὰ κατʼ ἐμὲ πάντα（Ta kat' eme panta） 交給推基古親口說。</strong></p><p>γνωρίσει（gnōrisei） 是未來式，「他要讓你們知道」。推基古有三個稱呼：ὁ ἀγαπητὸς ἀδελφὸς（ho agapētos adelphos）、πιστὸς διάκονος（pistos diakonos）、σύνδουλος ἐν κυρίῳ（syndoulos en kyriō）。同一個字在 1:7 以 συνδούλου（syndoulou） 的形式用在以巴弗身上，在這裡用在推基古身上——保羅剛在 3:22 對 δοῦλοι（douloi） 說話，轉身就把自己和同工都放進「奴僕」那一欄。ἔπεμψα（epempsa） 是書信式的不定過去式，站在讀信人的時間說話：「我已經差他來了」。</p><p>◆ 4:8 的經文鑑別：SBLGNT 作 ἵνα γνῶτε τὰ περὶ ἡμῶν（hina gnōte ta peri hēmōn），「好叫你們知道我們的事」；RP（拜占庭本）作 ἵνα γνῷ τὰ περὶ ὑμῶν（hina gnō ta peri hymōn），「好叫他知道你們的事」。兩個讀法只差幾個字母。弗 6:22 一字不差地用了前者，和合本也跟批判本，本講義從之。παρακαλέσῃ τὰς καρδίας ὑμῶν（parakalesē tas kardias hymōn） 回應 2:2：「要叫他們的心得安慰」（2:2）。</p>","exp":"<p>〔弗〕弗 6:21--22（以弗所書講義第 6 章）</p><p><strong>「有我親愛的兄弟推基古要將我一切的事都告訴你們。他是忠心的執事，和我一同作主的僕人。」（4:7）</strong></p><p>推基古是亞細亞人（徒 20:4），跟著保羅走過好幾趟路。這一趟他帶著三封信上路：以弗所書、歌羅西書、腓利門書，還帶著一個逃跑過的奴僕回家。以弗所書講義第 6 章已經介紹過這位送信人；歌羅西書多出來的一筆，是「一同作主的僕人」。保羅剛對奴僕們說完話，就用同一個字稱呼自己的同工：在主面前，使徒和送信的都是奴僕。</p><p>保羅把自己的近況留給推基古說，不寫在信裡。有些事不適合寫成文字，要用一張臉、一頓飯、一個晚上慢慢說。推基古的任務有兩個：讓他們知道，讓他們得安慰。教會裡總有這樣的人：不站講台，名字不常被提，卻把消息、把關心、把一封信送到。福音靠這些腳走路。</p>"},{"a":9,"z":9,"star":2,"grk":"<p lang=\"grc\">σὺν Ὀνησίμῳ τῷ πιστῷ καὶ ἀγαπητῷ ἀδελφῷ, ὅς ἐστιν ἐξ ὑμῶν· πάντα ὑμῖν γνωρίσουσιν τὰ ὧδε.</p>","lit":"<p>與阿尼西謀一起，那忠心、親愛的弟兄，他是從你們中間出來的；他們要把這裡的一切事都讓你們知道。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>σὺν Ὀνησίμῳ</td><td>syn Onēsimō</td><td>與阿尼西謀一起</td><td>追蹤二的最後一站</td></tr><tr><td>τῷ πιστῷ καὶ ἀγαπητῷ ἀδελφῷ</td><td>tō pistō kai agapētō adelphō</td><td>那忠心、親愛的弟兄</td><td>與推基古同樣的稱呼</td></tr><tr><td>ὅς ἐστιν ἐξ ὑμῶν</td><td>hos estin ex hymōn</td><td>他是從你們中間出來的</td><td>4:12 以巴弗也是 ὁ ἐξ ὑμῶν</td></tr><tr><td>γνωρίσουσιν</td><td>gnōrisousin</td><td>他們要讓你們知道</td><td>複數：阿尼西謀也是報信的人</td></tr></table>","gram":"<p><strong>4:9 只有一句，卻藏著另一封信的故事。σὺν Ὀνησίμῳ（syn Onēsimō） 接在 4:8 的 ἔπεμψα（epempsa） 後面：推基古不是一個人來的。</strong></p><p>阿尼西謀得到的形容詞和推基古一樣——τῷ πιστῷ καὶ ἀγαπητῷ ἀδελφῷ（tō pistō kai agapētō adelphō），只是次序對調。保羅一個字也沒提「奴僕」，也沒提他逃跑的事；那些留給另一封信（門 10–16）。這個名字是當時奴僕常用的名字，意思是「有益處的」；保羅在腓利門書用它作了一個文字遊戲，ἄχρηστον（achrēston） 與 εὔχρηστον（euchrēston）：「他從前與你沒有益處，但如今與你我都有益處」（門 1:11）。</p><p>ὅς ἐστιν ἐξ ὑμῶν（hos estin ex hymōn） 和 4:12 稱以巴弗的 ὁ ἐξ ὑμῶν（ho ex hymōn） 是同一個說法：建立教會的人和逃跑的奴僕，都是「你們那裡的人」。γνωρίσουσιν（gnōrisousin） 是複數，與 4:7 的 γνωρίσει（gnōrisei） 呼應：阿尼西謀不再只是被帶回來的人，他也是報消息的人。介詞 σὺν（syn） 在本卷追蹤二多半是「與基督同」（2:12–3:4），最後一站落在這裡：與基督同死的人，才擠得進彼此的生命裡。</p>","exp":"<p>〔門〕門 1:10--16</p><p><strong>「我又打發一位親愛忠心的兄弟阿尼西謀同去；他也是你們那裡的人。」（4:9）</strong></p><p>歌羅西的會眾聽到這個名字，有人會愣一下。阿尼西謀是腓利門家的奴僕，從主人家逃走，後來遇見了保羅，信了主。保羅稱他是「我在捆鎖中所生的兒子」（門 1:10）。現在他要回家了——回到那個他逃離的家，回到那個依法可以處置他的主人面前。</p><p>保羅在公開宣讀的信裡，稱他「親愛忠心的兄弟」，和稱呼推基古一樣。這是一種保護，也是一種宣告：在教會的眼中，他首先是弟兄。腓利門書說得更明白：「不再是奴僕，乃是高過奴僕，是親愛的兄弟」（門 1:16）。三封信同一天送到；4:1「你們作主人的」被宣讀時，主人和他的奴僕坐在同一間屋子裡。福音沒有一夕推翻奴隸制，但它把主人和奴僕放在同一張主的桌子上；那張桌子，日後一點一點鬆動了那個制度的根。</p><p>「他也是你們那裡的人。」一個曾經讓教會裡一位弟兄蒙受損失的人，保羅要教會接納他為自己人。今天也有人回來：曾經離開的、曾經犯錯的。接納不等於假裝甚麼都沒發生——腓利門書裡保羅願意替他賠償（門 18–19）——但接納意味著，他的名字可以重新被叫作「弟兄」。這是 321「屬靈父母兒女」的一張照片：保羅在鎖鍊中生了一個兒子，又親手把他送回家。</p>"},{"a":10,"z":11,"star":2,"grk":"<p lang=\"grc\">Ἀσπάζεται ὑμᾶς Ἀρίσταρχος ὁ συναιχμάλωτός μου, καὶ Μᾶρκος ὁ ἀνεψιὸς Βαρναβᾶ (περὶ οὗ ἐλάβετε ἐντολάς, ἐὰν ἔλθῃ πρὸς ὑμᾶς δέξασθε αὐτόν),</p><p lang=\"grc\">καὶ Ἰησοῦς ὁ λεγόμενος Ἰοῦστος, οἱ ὄντες ἐκ περιτομῆς, οὗτοι μόνοι συνεργοὶ εἰς τὴν βασιλείαν τοῦ θεοῦ, οἵτινες ἐγενήθησάν μοι παρηγορία.</p>","lit":"<p>與我一同作戰俘的亞里達古問你們安，還有巴拿巴的表兄弟馬可（關於他，你們已經領受了吩咐；他若到你們那裡，你們要接待他），</p><p>還有那被稱為猶士都的耶數；這些是出於割禮的人，惟獨這幾位是為神的國一同做工的，他們成了我的安慰。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ὁ συναιχμάλωτός μου</td><td>ho synaichmalōtos mou</td><td>我的同囚</td><td>字根是「被槍矛擄去的」戰俘</td></tr><tr><td>ὁ ἀνεψιὸς Βαρναβᾶ</td><td>ho anepsios Barnaba</td><td>巴拿巴的表兄弟</td><td>不是外甥</td></tr><tr><td>δέξασθε αὐτόν</td><td>dexasthe auton</td><td>你們要接待他</td><td>不定過去式命令：確確實實地接納</td></tr><tr><td>οἱ ὄντες ἐκ περιτομῆς</td><td>hoi ontes ek peritomēs</td><td>出於割禮的</td><td>猶太出身的同工</td></tr><tr><td>οὗτοι μόνοι συνεργοὶ</td><td>houtoi monoi synergoi</td><td>惟獨這幾位是同工</td><td>一句帶著痛的統計</td></tr><tr><td>παρηγορία</td><td>parēgoria</td><td>安慰</td><td>新約只此一次；醫學用語，「舒緩」</td></tr></table>","gram":"<p><strong>4:10–14 是六個問安的名字，分成兩組：4:10–11 是「奉割禮的」三人，4:12–14 是外邦的三人。</strong></p><p>Ἀσπάζεται（Aspazetai） 是單數動詞，後面卻接了好幾個主詞，希臘文常這樣讓動詞配合最近的主詞。亞里達古是 ὁ συναιχμάλωτός μου（ho synaichmalōtos mou），字根原指被槍矛擄去的戰俘，保羅借軍事的字形容坐監。學者有兩種讀法：一說亞里達古真的和保羅一同被拘禁；一說是比喻，同為基督作「俘虜」。門 23 節把這個稱號給了以巴弗，亞里達古則列為同工；可能同工們輪流陪保羅坐監。本講義讀為實指，但不排除輪流。</p><p>Μᾶρκος ὁ ἀνεψιὸς Βαρναβᾶ（Markos ho anepsios Barnaba）：ἀνεψιὸς（anepsios） 在古典與蒲草紙文獻中指表兄弟或堂兄弟，不是外甥；和合本「表弟」可取。括號裡的 περὶ οὗ ἐλάβετε ἐντολάς（peri hou elabete entolas） 指先前已有的吩咐，內容不詳；δέξασθε αὐτόν（dexasthe auton） 是不定過去式命令式。4:11 Ἰησοῦς ὁ λεγόμενος Ἰοῦστος（Iēsous ho legomenos Ioustos）：耶穌（約書亞）在當時是常見的名字，他另有拉丁名猶士都。οἱ ὄντες ἐκ περιτομῆς（hoi ontes ek peritomēs） 之後緊接 οὗτοι μόνοι συνεργοὶ εἰς τὴν βασιλείαν τοῦ θεοῦ（houtoi monoi synergoi eis tēn basileian tou theou），μόνοι（monoi） 是「惟獨」；學者多由此推論，接下去的以巴弗、路加、底馬是外邦人。παρηγορία（parēgoria） 在新約只此一次，是醫學與慰問書信常用的字，「舒緩、止痛」。</p>","exp":"<p>〔背景〕徒 28:16--31（使徒行傳講義第 28 章）</p><p><strong>「與我一同坐監的亞里達古問你們安。巴拿巴的表弟馬可也問你們安。」（4:10）</strong></p><p>亞里達古是帖撒羅尼迦人。以弗所暴動時，眾人把他拖進戲園（徒 19:29）；保羅被押解往羅馬，他上了同一條船（徒 27:2）。現在他在羅馬陪著保羅。有些朋友只在順境裡出現；亞里達古出現的地方，都是暴動、海難和監牢。這是 321 所說「屬靈同伴」最結實的樣子。</p><p>馬可的名字要慢慢讀。多年前，他在第一次宣教旅程半途離開（徒 13:13），保羅因此不肯再帶他，與巴拿巴「起了爭論，甚至彼此分開」（徒 15:39）。現在保羅在信裡替他寫推薦：「他若到了你們那裡，你們就接待他」（4:10）。幾年後保羅在最後一封信裡說：「要把馬可帶來，因為他在傳道的事上於我有益處」（提後 4:11）。半途而廢不是一個人的結局。被保羅拒絕過的人，後來成了保羅點名要的人；這中間有巴拿巴不肯放手，也有保羅肯改變看法。</p><p>「奉割禮的人中，只有這三個人……」（4:11）這句話有痛。保羅一生為自己的同胞憂愁，到了羅馬，猶太出身的同工只剩三位。他沒有數落誰離開，只說這三個人「是叫我心裡得安慰的」（4:11）。一個被鎖在屋裡的使徒，靠幾個朋友止痛。今天的同工團隊也常是這樣：人數不多，但有人在，就撐得下去。</p>"},{"a":12,"z":13,"star":2,"grk":"<p lang=\"grc\">ἀσπάζεται ὑμᾶς Ἐπαφρᾶς ὁ ἐξ ὑμῶν, δοῦλος Χριστοῦ πάντοτε ἀγωνιζόμενος ὑπὲρ ὑμῶν ἐν ταῖς προσευχαῖς, ἵνα σταθῆτε τέλειοι καὶ πεπληροφορημένοι ἐν παντὶ θελήματι τοῦ θεοῦ.</p><p lang=\"grc\">μαρτυρῶ γὰρ αὐτῷ ὅτι ἔχει πολὺν πόνον ὑπὲρ ὑμῶν καὶ τῶν ἐν Λαοδικείᾳ καὶ τῶν ἐν Ἱεραπόλει.</p>","lit":"<p>以巴弗問你們安，他是從你們中間出來的，基督的奴僕，常常在禱告中為你們摔跤角力，好叫你們在神一切的旨意中站立得穩，是成熟的，並且被充分確信的。</p><p>因為我為他作見證：他為你們和那些在老底嘉的、和那些在希拉坡里的，有許多的勞苦。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>δοῦλος Χριστοῦ</td><td>doulos Christou</td><td>基督的奴僕</td><td>保羅常用來稱自己的稱號</td></tr><tr><td>ἀγωνιζόμενος ὑπὲρ ὑμῶν</td><td>agōnizomenos hyper hymōn</td><td>為你們摔跤角力</td><td>1:29 保羅「盡心竭力」同一個字</td></tr><tr><td>ἵνα σταθῆτε</td><td>hina stathēte</td><td>好叫你們站立得穩</td><td>被動不定過去式；回指弗 6:13</td></tr><tr><td>τέλειοι</td><td>teleioi</td><td>成熟的</td><td>1:28「完完全全地」同字根</td></tr><tr><td>πεπληροφορημένοι</td><td>peplērophorēmenoi</td><td>被充分確信的</td><td>完成式被動分詞：滿到確定</td></tr><tr><td>πολὺν πόνον</td><td>polyn ponon</td><td>許多的勞苦</td><td>πόνος 帶著疼痛；RP 作「熱心」</td></tr></table>","gram":"<p><strong>以巴弗是建立歌羅西教會的人（1:7），4:12 是他第二次出場。上一次保羅稱他 συνδούλου（syndoulou），這一次稱他 δοῦλος Χριστοῦ（doulos Christou）——保羅書信裡，除了保羅自己和提摩太，只有以巴弗得到這個稱號。</strong></p><p>πάντοτε ἀγωνιζόμενος ὑπὲρ ὑμῶν ἐν ταῖς προσευχαῖς（pantote agōnizomenos hyper hymōn en tais proseuchais）：ἀγωνίζομαι（agōnizomai） 是運動場上摔跤、賽跑的字，1:29 保羅說自己「盡心竭力」用的也是 ἀγωνιζόμενος（agōnizomenos），2:1 的「盡心竭力」是同字根的 ἀγῶνα（agōna）。保羅為他們角力，以巴弗也為他們角力；兩個不在歌羅西的人，在禱告裡出力。和合本「基督耶穌僕人」多了「耶穌」，SBLGNT 只作 Χριστοῦ（Christou）。</p><p>ἵνα（hina） 子句說明禱告的內容：σταθῆτε（stathēte） 是被動不定過去式，「被立定」，這使我們想起弗 6:13 的「站立得住」；τέλειοι（teleioi） 回應 1:28 的 τέλειον（teleion），「成熟、長成」；πεπληροφορημένοι（peplērophorēmenoi） 是完成式被動分詞，字面是「被裝滿到確定」，與 2:2 的 πληροφορίας（plērophorias） 同字根。ἐν παντὶ θελήματι τοῦ θεοῦ（en panti thelēmati tou theou） 回到 1:9 保羅自己的禱告。4:13 μαρτυρῶ γὰρ αὐτῷ（martyrō gar autō） 是保羅出面作見證；πόνος（ponos） 在新約其他地方只出現在啟示錄，指「疼痛」。RP 作 ζῆλον πολὺν（zēlon polyn），「多多地熱心」；和合本「勞苦」跟批判本。</p>","exp":"<p><strong>「他在禱告之間，常為你們竭力地祈求，願你們在神一切的旨意上得以完全，信心充足，能站立得穩。」（4:12）</strong></p><p>以巴弗把福音帶到歌羅西（1:7），然後遇到了麻煩：有人要在基督以外再加一點。他走了很遠的路到保羅那裡，於是有了這封信。現在他留在保羅身邊，不能馬上回去，能做的是禱告。保羅說他的禱告是摔跤：不是坐著念一張清單，是用力、會流汗、會痛的。</p><p>他求甚麼？不是求錯謬的教師消失，也不是求教會人數增長，是求他們「站立得穩」，長大成熟，信心充足。這正是全卷要的：在基督裡已經滿了（2:10），所以不必再加；站穩，就是不被搖動去加。一位牧者最深的心願，不是會友依賴他，是會友在他不在的時候也站得住。</p><p>「他為你們和老底嘉並希拉坡里的弟兄多多地勞苦。」（4:13）呂克斯河谷的三座城，彼此相距不過半天路程，以巴弗把三間教會都背在身上。勞苦原文帶著疼痛的意思。為人禱告是工作，而且是會累的工作。有些弟兄姊妹年紀大了、身體弱了，以為自己甚麼都不能做；以巴弗告訴我們，在遠處跪著的人，也在前線上。這是 321「得勝者」的一個樣子：不是自己站在台前，是讓別人「能站立得穩」。</p>"},{"a":14,"z":14,"star":1,"grk":"<p lang=\"grc\">ἀσπάζεται ὑμᾶς Λουκᾶς ὁ ἰατρὸς ὁ ἀγαπητὸς καὶ Δημᾶς.</p>","lit":"<p>那醫生、那親愛的路加問你們安，還有底馬。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Λουκᾶς ὁ ἰατρὸς</td><td>Loukas ho iatros</td><td>醫生路加</td><td>新約唯一說路加是醫生的一句</td></tr><tr><td>ὁ ἀγαπητὸς</td><td>ho agapētos</td><td>那親愛的</td><td>冠詞加形容詞，給了路加</td></tr><tr><td>καὶ Δημᾶς</td><td>kai Dēmas</td><td>還有底馬</td><td>只有名字，沒有形容詞</td></tr></table>","gram":"<p><strong>4:14 是一節很短的問安，兩個名字的分量卻很不一樣。</strong></p><p>Λουκᾶς ὁ ἰατρὸς ὁ ἀγαπητὸς（Loukas ho iatros ho agapētos）：兩個帶冠詞的稱謂並列，「那醫生，那親愛的」。這是新約唯一告訴我們路加職業的經文。由「奉割禮的人中，只有這三個人」（4:11）推論，路加很可能是外邦人；若是，路加福音與使徒行傳這兩卷佔新約篇幅四分之一以上的書，出自一位外邦醫生之手。使徒行傳裡的「我們」段落，也與這份同行的記錄吻合。</p><p>καὶ Δημᾶς（kai Dēmas） 只有名字。腓利門書把底馬和馬可、亞里達古、路加一起稱為「與我同工的」（門 1:24），所以這裡的簡短不必過度解讀；有學者注意到兩封信的差別，但經文本身沒有說明原因。</p>","exp":"<p><strong>「所親愛的醫生路加和底馬問你們安。」（4:14）</strong></p><p>路加是那位陪保羅走過海難、走進監牢的醫生。保羅最後一封信寫道：「獨有路加在我這裡。」（提後 4:11）一個醫生，跟著一個囚犯，把耶穌和教會的故事「按著次序」寫了下來（路 1:3）。本系列路加福音與使徒行傳兩卷講義，讀的就是這位「所親愛的」人寫下的書。</p><p>底馬此時也在名單裡，也問你們安，也是同工。這使我們想起幾年後保羅寫的一句：「因為底馬貪愛現今的世界，就離棄我往帖撒羅尼迦去了」（提後 4:10）。經文沒有告訴我們他後來怎樣，我們也不替他下結論。同一份名單裡，有一個被接回來的馬可，也有一個後來走掉的底馬；這不是拿來嚇人的故事，是一個安靜的問題：今天在名單裡的我，靠甚麼留在名單裡？答案不在我們夠不夠火熱，而在 4:17 那一句託付，和 4:18 最後那一句恩惠。</p>"},{"a":15,"z":16,"star":2,"grk":"<p lang=\"grc\">ἀσπάσασθε τοὺς ἐν Λαοδικείᾳ ἀδελφοὺς καὶ Νύμφαν καὶ τὴν κατʼ οἶκον αὐτῆς ἐκκλησίαν.</p><p lang=\"grc\">καὶ ὅταν ἀναγνωσθῇ παρʼ ὑμῖν ἡ ἐπιστολή, ποιήσατε ἵνα καὶ ἐν τῇ Λαοδικέων ἐκκλησίᾳ ἀναγνωσθῇ, καὶ τὴν ἐκ Λαοδικείας ἵνα καὶ ὑμεῖς ἀναγνῶτε.</p>","lit":"<p>你們要問在老底嘉的弟兄們安，也問寧法和按著她家的教會安。</p><p>並且當這封信在你們那裡被宣讀之後，你們要使它也在老底嘉人的教會中被宣讀；那從老底嘉來的，你們也要讀。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Νύμφαν</td><td>Nymphan</td><td>寧法</td><td>SBLGNT 讀為女性名</td></tr><tr><td>τὴν κατʼ οἶκον αὐτῆς ἐκκλησίαν</td><td>tēn kat' oikon autēs ekklēsian</td><td>她家裡的教會</td><td>αὐτῆς 是女性代名詞</td></tr><tr><td>ἀναγνωσθῇ</td><td>anagnōsthē</td><td>被宣讀</td><td>在聚會中出聲朗讀</td></tr><tr><td>ἐν τῇ Λαοδικέων ἐκκλησίᾳ</td><td>en tē Laodikeōn ekklēsia</td><td>在老底嘉人的教會</td><td>一封信，兩間教會</td></tr><tr><td>τὴν ἐκ Λαοδικείας</td><td>tēn ek Laodikeias</td><td>那從老底嘉來的</td><td>是「從」，不是「寫給」</td></tr></table>","gram":"<p><strong>◆ 4:15 的經文鑑別。SBLGNT 作 Νύμφαν（Nymphan）……κατʼ οἶκον αὐτῆς（kat' oikon autēs），女性，「寧法並她家裡的教會」，和合本同。</strong></p><p>早期抄本沒有重音符號，Νύμφαν（Nymphan） 與 Νυμφᾶν（Nymphan） 寫出來一模一樣：前者是女性名的受格，後者是男性名的受格。分辨要看後面的代名詞，而抄本傳統有三種讀法：αὐτῆς（autēs）「她的」（梵諦岡抄本等，SBLGNT 從之）；αὐτοῦ（autou）「他的」，RP 拜占庭本，配合男性的 Νυμφᾶν（Nymphan）；αὐτῶν（autōn）「他們的」（Tregelles，把「老底嘉的弟兄」也算進去）。本講義判斷：女性讀法是較難的讀法——抄寫的人把一位女性家主改成男性，比反過來容易理解——所以從 SBLGNT 與和合本，寧法是一位姊妹，教會在她家裡聚集。</p><p>4:16 ὅταν ἀναγνωσθῇ παρʼ ὑμῖν ἡ ἐπιστολή（hotan anagnōsthē par' hymin hē epistolē）：ἀναγινώσκω（anaginōskō） 指在聚會中出聲宣讀（並見帖前 5:27）。ποιήσατε ἵνα（poiēsate hina） 是「要使……」，第二個 ἀναγνωσθῇ（anagnōsthē） 對應第一個。Λαοδικέων（Laodikeōn） 是複數所有格「老底嘉人的」。τὴν ἐκ Λαοδικείας（tēn ek Laodikeias） 省略了「書信」，介詞是 ἐκ（ek），「從老底嘉來的」——是一封先送到老底嘉、再轉過來的信。</p>","exp":"<p><strong>「請問老底嘉的弟兄和寧法，並她家裡的教會安。」（4:15）</strong></p><p>初期教會沒有禮拜堂，教會在家裡。呂底亞的家（徒 16:40）、百基拉和亞居拉的家（羅 16:5）、腓利門的家（門 1:2），現在還有寧法的家。一位姊妹打開家門，接待一群人來敬拜、擘餅、聽信。名單到這裡，從使徒的同工轉向一個家：福音不只走在路上，也住在客廳裡。至於這節經文與今天女性帶領的討論，本章議題頁另有陳列；這裡只看見一件事：保羅點名問候的，是一位打開家的姊妹。</p><p>「你們念了這書信，便交給老底嘉的教會，叫他們也念；你們也要念從老底嘉來的書信。」（4:16）這是全本新約唯一明說「念完了傳給下一間教會」的經文。保羅的信不是私人信件，是要在聚會裡出聲讀、讀完再傳下去的。這是新約書信被收集、流傳的起點，也是 321 改變觀念八大步驟的最後一步：繁殖。領受的人，把領受的交出去。</p><p>「從老底嘉來的書信」在哪裡？我們不知道。有人以為是一封遺失的信；有人以為就是以弗所書——它可能是一封傳閱各教會的信，由推基古同一趟帶到亞細亞，先到老底嘉，再轉到歌羅西；後世也有偽託的《老底嘉書》，教會從來沒有接納。本講義的判斷是：以弗所書之說有可能，但不能確定。神保守了他的教會所需要的；遺失的那一封，不使我們手上這一封少一分權威。幾十年後，老底嘉教會收到另一封信，說他們「不冷也不熱」（啟 3:15）——這使我們想起，一間讀過使徒書信的教會，仍要一代一代讀下去。</p>"},{"a":17,"z":17,"star":3,"grk":"<p lang=\"grc\">καὶ εἴπατε Ἀρχίππῳ· Βλέπε τὴν διακονίαν ἣν παρέλαβες ἐν κυρίῳ, ἵνα αὐτὴν πληροῖς.</p>","lit":"<p>並且你們要對亞基布說：要留意你在主裡所領受的服事，好叫你把它做滿。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>εἴπατε Ἀρχίππῳ</td><td>eipate Archippō</td><td>你們要對亞基布說</td><td>全會眾一起轉告</td></tr><tr><td>Βλέπε</td><td>Blepe</td><td>要留意</td><td>現在命令式單數：一直看著</td></tr><tr><td>τὴν διακονίαν</td><td>tēn diakonian</td><td>職分、服事</td><td>與 4:7 推基古的「執事」同字根</td></tr><tr><td>ἣν παρέλαβες ἐν κυρίῳ</td><td>hēn parelabes en kyriō</td><td>你在主裡所領受的</td><td>2:6「接受了主」同一個動詞</td></tr><tr><td>ἵνα αὐτὴν πληροῖς</td><td>hina autēn plērois</td><td>好叫你把它做滿</td><td>現在假設語氣；「滿」的動詞</td></tr></table>","gram":"<p><strong>4:17 是全卷最後一個命令，也是唯一一個只對一個人說的命令；保羅卻用複數 εἴπατε（eipate），叫全會眾去對他說。</strong></p><p>Βλέπε（Blepe） 是現在命令式單數，字面是「看」，在新約常作「留意、小心」；2:8「你們要謹慎」用的是複數 Βλέπετε（Blepete）。τὴν διακονίαν（tēn diakonian） 是服事、職分，與 4:7 推基古的 διάκονος（diakonos）、1:23、25 保羅作「執事」同字根。ἣν παρέλαβες ἐν κυρίῳ（hēn parelabes en kyriō） 的 παρέλαβες（parelabes） 是不定過去式，「你已經領受了」；這個動詞在 2:6 用過：παρελάβετε τὸν Χριστὸν Ἰησοῦν τὸν κύριον（parelabete ton Christon Iēsoun ton kyrion），「你們既然接受了主基督耶穌」（2:6）。領受了主的人，也領受了職分；κύριος（kyrios） 追蹤在這裡落定：職分的來源是主。</p><p>ἵνα αὐτὴν πληροῖς（hina autēn plērois）：πληροῖς（plērois） 是 πληρόω（plēroō） 的現在假設語氣，「持續地把它做滿」。本卷「滿」的字一路走來：1:9 的 πληρωθῆτε（plērōthēte） 是滿心知道，1:19 與 2:9 的 πλήρωμα（plērōma） 是一切的豐盛，2:10 的 πεπληρωμένοι（peplērōmenoi） 是你們也得了豐盛，1:25 的 πληρῶσαι（plērōsai） 是把神的道理傳得全備，到這裡落在一個人的職分上。亞基布在腓利門書被稱為「與我們同當兵的」（門 1:2），可能屬於腓利門的家，也有學者以為他在老底嘉服事；他的職分是甚麼，經文沒有說。</p>","exp":"<p>〔門〕門 1:1--2</p><p><strong>「要對亞基布說：『務要謹慎，盡你從主所受的職分。』」（4:17）一封寫給整間教會的信，最後一個命令落在一個人身上。</strong></p><p>全卷從宇宙開始：萬有都是靠他造的，他在萬有之先（1:16–17）。最後一個命令卻不是對萬有說，是對亞基布說。基督的豐盛有多大，信的開頭講過了；這豐盛最後要落到哪裡，結尾講了：落在一個人把他領受的服事做滿。這是全卷地勢圖最後一個高點，不是頂峰，是一個人的忠心。</p><p>職分是領受來的，不是自己選的，也不是爭來的。就像他們在 2:6「接受了主」，亞基布也「從主」領受了職分；同一個動詞。所以職分的大小不由人決定，做滿的標準也不由人決定。有人的職分是建立教會，像以巴弗；有人是送信，像推基古；有人是打開家門，像寧法；有人是在禱告裡摔跤。321「一個目的，建立屬神的體系」，最小、也最真的一塊磚，就是一個人把自己那一份做滿。</p><p>「務要謹慎」是一直看著，不讓它從手中滑走。為甚麼保羅要特別提醒亞基布？經文沒有說，我們也不猜他失職。值得注意的是方式：保羅叫全教會一起對他說。這不是公開羞辱，是一個群體共同的託付——我們看見你領受的，我們和你一起看著它。今天的教會也需要這樣的話：不是「你做得不夠」，而是「我們記得主交給你的，你不是一個人在做」。</p><p>這節經文也對每一個讀者說話。在 4:7–14 那份名單裡，我們都找得到自己可能的位置；不論是哪一個位置，那一句都是對我說的。基督的滿，最後落成一個人的忠心。</p>"},{"a":18,"z":18,"star":1,"grk":"<p lang=\"grc\">Ὁ ἀσπασμὸς τῇ ἐμῇ χειρὶ Παύλου. μνημονεύετέ μου τῶν δεσμῶν. ἡ χάρις μεθʼ ὑμῶν</p>","lit":"<p>這問安是我保羅親手寫的。你們要記念我的捆鎖。恩典與你們同在。</p>","key":"","gram":"<p><strong>4:18 是保羅從代筆人手中接過筆。Ὁ ἀσπασμὸς τῇ ἐμῇ χειρὶ Παύλου（Ho aspasmos tē emē cheiri Paulou）：「這問安是我的手——保羅的——寫的」，Παύλου（Paulou） 是所有格，與 ἐμῇ（emē） 同位，說明「我」是誰。</strong></p><p>保羅的信多半由人代筆，到最後才親筆問安，作為真實的記號：「我－保羅親筆問你們安。凡我的信都以此為記」（帖後 3:17；並見加 6:11）。μνημονεύετέ μου τῶν δεσμῶν（mnēmoneuete mou tōn desmōn） 是現在命令式，「要一直記念」；δεσμῶν（desmōn） 與 4:3 的 δέδεμαι（dedemai） 同字根，本章禱告的開頭與全信的結尾都是鎖鍊。ἡ χάρις μεθʼ ὑμῶν（hē charis meth' hymōn） 沒有動詞，是保羅書信裡最短的祝福之一；「常」是和合本小字補的。全信從 1:2 的 χάρις ὑμῖν（charis hymin） 開始，經過 4:6 的 ἐν χάριτι（en chariti），在這裡結束。批判本沒有 Ἀμήν（Amēn），和合本也沒有「阿們」。</p>","exp":"<p>〔背景〕徒 28:30--31（使徒行傳講義第 28 章）</p><p><strong>「我－保羅親筆問你們安。你們要記念我的捆鎖。願恩惠常與你們同在！」（4:18）</strong></p><p>想像那個畫面：代筆的人寫完最後一行，把筆遞過去；保羅接過來，手腕上的鍊子碰到桌面。他寫過全卷最高的那一句——「使他可以在凡事上居首位」（1:18）——現在用一隻被鎖住的手簽名。高舉基督居首位的人，自己坐在監裡。這不矛盾，這正是 321「讓耶穌得著一切的榮耀」的樣子：榮耀歸他，鎖鍊歸我。</p><p>「記念我的捆鎖」不是要人同情，是要人禱告（4:3），也要人記得這封信的價錢：他們手上的信，是一個失去自由的人寫的。1:24 他說「現在我為你們受苦，倒覺歡樂」（1:24）；那不是基督的救恩不夠，是傳福音的人為福音付的代價。最後一句是恩惠。不是「要更努力」，不是「別像誰一樣」，是恩惠與你們同在。全卷講完了首、根、上、鹽，最後交到他們手上的，仍是恩典。</p>"}]},"serm":{"1":{"min":17,"blocks":[["h","《使他可以在凡事上居首位》"],["p","弟兄姊妹平安，今天我們開始讀一卷新的書信，歌羅西書。"],["p","請你跟我去一個地方。"],["q","羅馬城，一間租來的房子。門口站著一個看守的兵。"],["p","屋子裡坐著一個老人，手上有鎖鍊。他叫保羅。"],["p","這一天，門外來了一個風塵僕僕的人。"],["p","鞋底磨薄了，衣服上還有路上的塵土。"],["p","他從呂克斯河谷一座小城來。那座城叫歌羅西。"],["p","從歌羅西到羅馬，走陸路，再搭船，將近兩千公里。"],["q","這個人叫以巴弗。"],["p","保羅一生沒有去過歌羅西。那間教會，是以巴弗建立的。"],["p","以巴弗帶來的消息，一半是好的。"],["p","弟兄姊妹彼此相愛，信心沒有退，福音還在城裡結果子。"],["p","另一半，讓人擔心。"],["p","城裡來了一些教師。他們沒有叫人離開耶穌。"],["p","他們只是說：耶穌很好。可是還不夠。"],["p","你還要加上一套哲學，加上一些節期，加上天使和異象。"],["q","不是反對基督。是基督，再加一點。"],["p","如果你是保羅，聽完這些話，你第一件事會做甚麼？"],["p","我大概會馬上寫一篇文章，一條一條駁回去。"],["p","可是保羅沒有。這封信的第一章，他做了兩件事。"],["p","他先感謝，再禱告。然後，他唱了一首詩。"],["q","保羅沒有先駁斥錯誤。他先唱了一首詩。"],["p","因為他知道，人看見基督有多大，錯謬自然就變小了。"],["p","這一章有三個字：像，首，和。"],["p","我們今天走三步：一間沒去過的教會；居首位；基督在你們心裡。"],["q","第一步：一間沒去過的教會。"],["q","「寫信給歌羅西的聖徒，在基督裡有忠心的弟兄。」（1:2）"],["p","請你聽這一句裡的兩個地址。"],["p","一個是「在歌羅西」。一個是「在基督裡」。"],["p","歌羅西在保羅的時代已經沒落了。"],["p","下游有熱鬧的老底嘉，對岸有溫泉城希拉坡里。歌羅西夾在中間，越來越小。"],["p","第一個地址，決定你住在哪裡。第二個地址，決定你屬於誰。"],["q","你的第一個地址也許很小。你的第二個地址，是在基督裡。"],["p","然後保羅開口，第一個字是感謝。"],["q","「我們感謝神我們主耶穌基督的父，常常為你們禱告」（1:3）"],["p","問題還沒有提，感謝先說。"],["p","這不是客套話。這是保羅看人的次序：先看神在他們身上已經做成的。"],["q","「因聽見你們在基督耶穌裡的信心，並向眾聖徒的愛心，是為那給你們存在天上的盼望」（1:4–5）"],["p","信，向上。愛，向旁邊。盼望，向前。"],["p","保羅說，信和愛是「為」那盼望。盼望是根，信和愛是從根上長出來的。"],["p","一個知道自己在天上有存款的人，在地上就不必搶。"],["p","有人跟歌羅西人說：你們還缺一樣。"],["p","保羅先提醒他們：你們該有的，早就存好了。"],["q","「這福音傳到你們那裡，也傳到普天之下，並且結果，增長」（1:6）"],["p","請你留意這句話的主詞。結果子、在生長的，是福音。"],["p","保羅沒有去歌羅西種，樹卻長到了歌羅西。"],["p","使徒行傳講義第十九章講過：保羅在以弗所的學房講了兩年。是學房裡的人，走回自己的城。"],["p","以巴弗大概就是其中一位。他在以弗所聽了福音，回到家鄉，開始教別人。"],["q","「正如你們從我們所親愛、一同作僕人的以巴弗所學的。」（1:7）"],["p","保羅還說，以巴弗「為我們」作了基督的執事。"],["p","保羅去不了的地方，以巴弗替他去了。"],["q","一個好牧人向別人介紹自己的羊，先說他們的好。"],["p","感謝完了，保羅開始禱告。"],["q","「因此，我們自從聽見的日子，也就為你們不住地禱告祈求，願你們在一切屬靈的智慧悟性上，滿心知道神的旨意」（1:9）"],["p","智慧，悟性，知道神。這正是那些教師兜售的東西。"],["p","保羅沒有說：不要追求智慧。他說：真的智慧，我替你們向神求。"],["p","問題從來不是你想得太多，是你在基督以外去找。"],["p","「滿心知道」，原文是被充滿，被動的。是神來充滿你。"],["q","「好叫你們行事為人對得起主，凡事蒙他喜悅，在一切善事上結果子，漸漸地多知道神」（1:10）"],["p","知識的終點不是腦袋，是腳。"],["p","還有「漸漸地」三個字。屬靈的長進，是樹的速度，不是煙火的速度。"],["q","「又感謝父，叫我們能與眾聖徒在光明中同得基業。」（1:12）"],["p","「叫我們能」，原文的意思是使我們夠資格。"],["p","錯謬的教導，最常用的一招，就是讓你覺得自己不夠格。"],["p","保羅說：資格已經給了。給的是父。"],["q","「他救了我們脫離黑暗的權勢，把我們遷到他愛子的國裡」（1:13）"],["p","「遷」這個字，原文 μετέστησεν，是從一處挪到另一處。"],["p","古代戰勝的王，會把一整座城的人，搬到自己的國土上。"],["p","神不是把我們一個一個撈出來，放在邊境上自己看著辦。"],["q","神是把我們整批搬進他愛子的國，換了國籍。"],["p","我們華人基督徒，常常身在新國，心在舊國。"],["p","信了耶穌，看日子、怕犯沖、遇到事情先去問一問的習慣，還在。"],["p","保羅不是叫你搬家。他說，你已經搬了。"],["q","「我們在愛子裡得蒙救贖，罪過得以赦免。」（1:14）"],["p","住在這個國裡的人，不必每天重新申請居留。"],["p","這一段在原文裡，是一條一路接下去的長句。"],["p","然後，說到愛子，保羅就停不下來了。"],["p","他開始唱歌。"],["q","第二步：居首位。"],["q","「愛子是那不能看見之神的像，是首生的，在一切被造的以先。」（1:15）"],["p","這首詩有兩節。第一節唱創造，第二節唱和好。"],["p","六節之內，「萬有」「凡事」「一切」，原文同一個字出現八次。"],["p","從來沒有人看見過神。歌羅西人想接近那位看不見的神，就靠廟宇、偶像、天使、異象。"],["p","保羅說：你想知道神是甚麼樣子，看基督就夠了。"],["p","創世記講義第一章講過，人是照神的形像造的。基督，是那形像本身。"],["p","在拿撒勒人耶穌身上，看不見的神，有了一張臉。"],["p","然後是這一章最常被爭論的一個詞：首生的。"],["p","有人讀成：耶穌是神造的第一個。最高、最早，可是仍然是被造的。"],["q","「因為萬有都是靠他造的」（1:16）"],["p","「因為」。"],["p","保羅說他是首生的，理由是甚麼？理由是萬有都是他造的。"],["p","造萬有的那一位，不會是萬有當中的一個。"],["p","那「首生」是甚麼意思？在舊約，首生常常是一個名分，不是出生的次序。"],["p","大衛是耶西的第八個兒子，么子。神卻說："],["q","「我也要立他為長子，為世上最高的君王。」（詩 89:27）"],["p","這使我們想起，首生是長子的名分。家業歸他。"],["q","首生不是第一個被造的，是一切被造的都歸他承受。"],["p","有時候敲我們家門、想和我們談聖經的，就是讀成另一種意思的朋友。"],["p","我們不嘲笑，也不攻擊。"],["p","我們只是請他坐下來，和我們一起，把第十六節開頭那兩個字讀出來。"],["p","保羅在這封信的最後說：「好像用鹽調和，就可知道該怎樣回答各人。」（4:6）"],["p","首生的爭論，最後的落點不是贏了一場辯論，是在這一位面前下拜。"],["q","「無論是天上的，地上的；能看見的，不能看見的；或是有位的，主治的，執政的，掌權的」（1:16）"],["p","歌羅西人怕的、拜的、想討好的，都在這張清單上。"],["p","而這張清單的標題是：他造的。"],["p","弟兄姊妹，這對在拜拜文化裡長大的人，是天大的好消息。"],["p","你從小被教要怕的那些看不見的東西，沒有一樣在基督之上，也沒有一樣在基督之外。"],["p","造了一切權勢的那一位，就是你所信的那一位。"],["q","「一概都是藉著他造的，又是為他造的。」（1:16）"],["p","宇宙有起點，也有目的地。目的地，就是他。"],["p","你的工作，你的天分，你的時間，你的錢，原本就是為他造的。"],["q","「他在萬有之先；萬有也靠他而立。」（1:17）"],["p","「立」，原文 συνέστηκεν，意思是凝聚，維繫在一起。"],["p","宇宙沒有散掉，不是因為它自己夠堅固，是因為有一位在維繫它。"],["p","有沒有哪一個早上，你醒過來，覺得自己的生命四分五裂？"],["p","你可以從這一節開始禱告：主啊，萬有靠你而立。今天，請你把我也維繫在一起。"],["p","現在，詩唱到第二節。"],["q","「他也是教會全體之首。他是元始，是從死裡首先復生的，使他可以在凡事上居首位。」（1:18）"],["p","請你聽，「首生」又出現了一次：從死裡首先復生的。"],["p","在他以前，拉撒路就從墳墓裡出來過了。可是他仍然是首生的。"],["p","所以首生，是地位，不是次序。"],["p","「居首位」，原文 πρωτεύων，全本新約只出現這一次。作第一。"],["p","請你聽那四個字：在凡事上。"],["p","歌羅西的問題，從來不是有人反對基督。"],["p","是有人要讓基督在某些事上居首。"],["p","救恩給基督，智慧給哲學，節期給規條，靈界給天使。"],["p","主日給基督，平日給成功學。救恩給基督，婚姻問八字，開店看風水。"],["q","這不是不信。這是把基督放在一排神明和方法當中，成為「其中一個」。"],["p","保羅說，他不是其中一個。他是第一個。在每一件事上，都是第一個。"],["q","「因為父喜歡叫一切的豐盛在他裡面居住。」（1:19）"],["p","這一句的「父」字，和合本是小字補的。"],["p","原文也可以讀成：一切的豐盛，樂意住在他裡面。"],["p","怎麼讀，意思都一樣。神沒有把自己的一部分放在基督裡，"],["p","另一部分，分散在天使、異象、哲學、苦修裡，讓人自己去收集。"],["p","全部，都在他裡面。「居住」，是定居，不是暫住。"],["p","最後一句。"],["q","「既然藉著他在十字架上所流的血成就了和平，便藉著他叫萬有－無論是地上的、天上的－都與自己和好了。」（1:20）"],["p","這首詩唱到最高的地方，不是寶座，是十字架上的血。"],["q","維繫萬有的那雙手，讓自己被釘住了。"],["p","這首詩唱完了。萬有，寶座，豐盛，十字架。"],["p","然後保羅突然把鏡頭轉過來，對準了坐在下面聽信的人。"],["q","第三步：基督在你們心裡。"],["q","「你們從前與神隔絕，因著惡行，心裡與他為敵。」（1:21）"],["p","這一句，是整卷歌羅西書最低的地方。"],["p","最高的地方，就在三節以前：居首位。居首位的那一位，和從前與神為敵的我們，只隔著三節。"],["p","很多人以為，自己只是對神不感興趣。"],["p","可是經文說，不感興趣的底下，常常是一顆不要神來管的心。"],["p","可是請聽下一句的頭兩個字。"],["q","「但如今他藉著基督的肉身受死，叫你們與自己和好」（1:22）"],["q","但如今。"],["p","這和好，是誰先伸手的？和合本說「他」。是神主動。"],["p","不是我們先爬過去。是神先跨過來。"],["p","請你記住，這個和好已經完成了。等一下讀到第二十四節，我們會需要這一句。"],["p","第二十三節，保羅提醒他們不要被「引動」，就是一點一點被推離根基。"],["p","錯謬的教導很少叫人放棄基督。它只是說：基督很好，可是你還需要……"],["q","每加一樣，就離開一點。"],["q","「現在我為你們受苦，倒覺歡樂；並且為基督的身體，就是為教會，要在我肉身上補滿基督患難的缺欠。」（1:24）"],["p","寫這句話的人，手上有鎖鍊。"],["p","可是這一句，是全卷最容易被誤用的一句。"],["p","基督患難的缺欠？難道基督的救恩還不夠，要我們用受苦去補？"],["p","不是。兩節以前，保羅才說和好已經作成了。"],["p","十字架上那一句「成了」，不需要任何人再補上一筆。"],["p","保羅用的「患難」這個字，在新約裡從來不是指基督贖罪的受苦。"],["p","它指的是傳福音的人，在路上所受的苦。"],["p","基督受苦，完成了救恩。他的使者受苦，把救恩送到人那裡。"],["p","保羅坐監。以巴弗走了將近兩千公里。"],["q","缺的不是救恩，是路程。保羅在走他那一段路。"],["p","可是這一節，我還要守住一條界線。"],["p","保羅的苦，是為福音、為教會受的，是他自己甘心的。"],["p","如果你今天在家裡被打，被罵，被冷暴力；在公司被霸凌，"],["p","那不是在補滿基督的患難。請不要有人對你說：這是你的十字架，忍下去。"],["p","那樣的苦，需要被保護，需要被帶到安全的地方。"],["p","教會的責任，是陪你走出來，不是勸你留下。"],["q","「這道理就是歷世歷代所隱藏的奧祕；但如今向他的聖徒顯明了。」（1:26）"],["p","歌羅西城裡，有很多所謂的奧祕。"],["p","保羅說：真正的奧祕，不是藏起來給少數人的。"],["p","基督的家裡，沒有內圈和外圈，沒有只給高階同工知道的祕密。"],["q","「就是基督在你們心裡成了有榮耀的盼望。」（1:27）"],["p","剛才那首詩裡，造萬有的那一位，維繫萬有的那一位，在凡事上居首的那一位，"],["p","不是遠遠地待在宇宙的上面。"],["p","他住進了歌羅西一個奴隸、一個婦人、一個商人的心裡。"],["q","宇宙的頭，住進了一個人的心裡。"],["p","所以盼望不在別處，不需要再去找。他已經在你裡面了。"],["q","「我們傳揚他，是用諸般的智慧，勸戒各人，教導各人，要把各人在基督裡完完全全地引到神面前。」（1:28）"],["p","保羅傳的，不是一套方法，不是一個系統。是一個人。「我們傳揚他」。"],["p","然後請你數一數：各人，各人，各人。一節裡面三次。"],["p","唱完了萬有，下一個畫面卻是一個一個的人。神的體系，單位是一個人。"],["q","「我也為此勞苦，照著他在我裡面運用的大能盡心竭力。」（1:29）"],["p","保羅很累。「勞苦」是做到筋疲力盡。可是後半句說：照著他在我裡面運用的大能。"],["p","他拚命，可是力氣是基督給的。累得有方向，也累得有來源。"],["p","弟兄姊妹，我們回到羅馬那間租來的房子。"],["p","以巴弗走了將近兩千公里，帶來一半好、一半讓人擔心的消息。"],["p","保羅給他的，是一首詩。"],["p","不是一張「基督再加一點」的清單，是一個名字。"],["p","那位不能看見之神的像，在凡事上居首位的主。"],["p","可是請你記得，他是怎樣坐上那個首位的。"],["p","不是踩著別人爬上去的。是被釘在木頭上，流了自己的血。"],["q","在凡事上居首位的那一位，先在十字架上，把自己放在最低的地方。"],["p","而這一位，現在住在你心裡。"],["p","你不必更佩服保羅，也不必記得今天的講員。"],["p","請你更愛這一位，那位為你流血、又住進你心裡的主。"],["p","國度321空中團契常說：讓耶穌作王。"],["p","這句話的根，不在我們的口號裡，在這一節：使他可以在凡事上居首位。"],["p","讓他作王，不是在生活裡替他保留一個角落。"],["p","是讓他在每一個角落裡，排第一。"],["p","這個禮拜，請你做兩件小事。"],["p","第一件，每天早上，讀一次第十五節到第二十節。慢慢讀，當一首詩來讀。"],["p","讀到「在凡事上」，停下來問：今天有哪一件事，我從來沒有讓他排第一？"],["p","第二件，想一想，你的生活裡，有沒有一樣是「基督，再加一點」。"],["p","把它帶到主面前，對他說：主啊，你已經夠了。"],["p","我們一起低頭禱告。"]]},"2":{"min":18,"blocks":[["h","《在他裡面生根建造》"],["p","弟兄姊妹平安，今天我們一起讀歌羅西書第二章。"],["p","我先說一句話。我猜，你一定聽過。"],["q","不可拿、不可嘗、不可摸。"],["p","講到喝酒、抽煙，最後總是一句：聖經說，不可拿、不可嘗、不可摸。"],["p","很多弟兄姊妹到今天，都以為這是神給我們的一條命令。"],["q","「你們若是與基督同死，脫離了世上的小學，為甚麼仍像在世俗中活著、服從那『不可拿、不可嘗、不可摸』等類的規條呢？」（2:20）"],["p","請你看見那一對引號。"],["p","這句話不是保羅說的。是保羅引別人說的。"],["p","而且他引它，是為了問一句：你們為甚麼還要聽這個？"],["q","華人教會最常被當成聖經命令的一句話，原來是錯謬教師的口號。"],["q","「這都是照人所吩咐、所教導的。」（2:22）"],["p","我說這些，不是要你明天就去做那些事。"],["p","節制是好的，戒酒、戒賭都是好的。只是理由不在這一句。"],["p","歌羅西的教會，沒有人叫他們離開基督。"],["p","只是有人說：信基督很好，可是還要再加一點。"],["p","加一點規條，加一點節期，加一點異象，加一點苦修。"],["p","這一章有三個詞：根，滿，影。"],["p","我們走三步：花言巧語，已經滿了，影兒與形體。"],["q","第一步：花言巧語。"],["q","「我願意你們曉得，我為你們和老底嘉人，並一切沒有與我親自見面的人，是何等地盡心竭力」（2:1）"],["p","保羅從來沒有去過歌羅西。他們沒見過他的臉，他也沒見過他們的臉。"],["p","「盡心竭力」，原文是運動場和戰場的字。選手拚到最後一口氣。"],["p","他能禱告。他是在監牢裡，為一群陌生人打仗。"],["p","屬靈的關係，不靠見面的次數，靠代禱的分量。"],["q","「要叫他們的心得安慰，因愛心互相聯絡」（2:2）"],["p","請你留意，對付錯謬，保羅開的第一帖藥，不是辯論。"],["p","「互相聯絡」，原文的意思是被編織在一起。"],["p","被編織在愛裡的人，不容易被拉走。"],["p","最容易被叼走的，是那一隻孤單的羊。"],["p","保羅接著求，要他們真知神的奧祕。奧祕是甚麼？就是基督。"],["q","「所積蓄的一切智慧知識，都在他裡面藏著。」（2:3）"],["p","那些錯謬教師說：真正的秘密在我們這裡。"],["p","保羅說：寶藏是藏著的，這沒錯。可是地址已經公開了。"],["p","寶藏不在某一套秘訣裡，在一個人裡面。"],["q","「我說這話，免得有人用花言巧語迷惑你們。」（2:4）"],["p","「花言巧語」，原文在新約只出現這一次，是修辭學的字。"],["p","錯謬最危險的地方，從來不是粗糙，是動聽。"],["p","所以判斷一套說法，不能只問動不動聽、有沒有效。"],["p","要問：它把我帶到哪裡？是更靠近基督，還是更需要這一套？"],["p","可是保羅在警告之前，先做了一件很溫暖的事。"],["q","「見你們循規蹈矩，信基督的心也堅固，我就歡喜了。」（2:5）"],["p","「循規蹈矩」是軍隊的字，隊伍排得很整齊，陣線站得很穩。"],["p","原來歌羅西不是一間出了大事的教會。"],["p","危險就在這裡：敵人不從正門攻城，從旁邊滲進來。"],["p","不叫你離開基督，只叫你在基督旁邊，多放一樣東西。"],["p","然後，全卷第一個「所以」出現了。"],["q","「你們既然接受了主基督耶穌，就當遵他而行」（2:6）"],["p","第一章，保羅唱了一首基督之歌：他是神的像，他在凡事上居首位。"],["p","可是奇怪，傳下來的不是一套道理，是一個人：主基督耶穌。"],["p","你怎樣開始，就怎樣走下去。"],["p","我們很多人信主那天，是白白的恩典。"],["p","信主以後，卻一層一層加功課，好像要爬到某個等級才算數。"],["q","恩典開的門，不會變成功德走的路。"],["q","「在他裡面生根建造，信心堅固，正如你們所領的教訓，感謝的心也更增長了。」（2:7）"],["p","今天的章題，就在這一節。"],["p","「生根」，原文是完成式：根已經扎下去了，到今天還扎著。"],["p","「建造」，原文是現在式：房子一直在往上蓋。"],["p","根是定的，所以你不必怕。樓是活的，所以你不停。"],["p","而且請你看，扎根、建造、堅固，原文都是被動的。作工的是神。"],["p","只有最後一句是我們的：感謝的心更增長。"],["p","一個滿溢感謝的人，不覺得自己缺甚麼。"],["q","一間教會覺得「我們還少一樣」的時候，常常是先少了感謝。"],["q","「你們要謹慎，恐怕有人用他的理學和虛空的妄言，不照著基督，乃照人間的遺傳和世上的小學就把你們擄去。」（2:8）"],["p","「擄去」，原文是把人當成戰利品，綁著帶走。"],["p","這是第二章的谷底。"],["p","被擄的人，通常不知道自己被擄了。"],["p","這一節常被讀成：基督徒不要讀哲學，不要念太多書。"],["p","經文不是這樣說的。"],["p","保羅在第一章才為他們禱告，要他們在一切屬靈的智慧悟性上滿心知道神的旨意。"],["p","既然寶藏都在他裡面，基督徒最有理由讀書、思考、研究。"],["p","問題不在思考。問題在這一節最後的那把尺："],["q","不照著基督。"],["p","一門學問讓基督居首位，它就是在挖他裡面的寶藏。"],["p","一套說法要基督讓位，再高深，也是虛空的。"],["p","「世上的小學」，原文的意思是基本元素。"],["p","學者有兩種讀法：一說是基本原則，像字母表的ABC；"],["p","一說是古人以為管著命運的地水火風、星宿和背後的靈界勢力。"],["p","今天的小學在哪裡？古老的有擇日、風水、命盤；摩登的有成功學、領導力模型。"],["p","工具可以用。可是當工具開始決定你怎樣看基督，"],["p","而不是基督決定你怎樣用工具的時候，你已經被帶走了。"],["p","那麼，保羅怎樣對付這些「再加一點」？"],["p","他先把基督有多大，擺在桌上。"],["q","第二步：已經滿了。"],["q","「因為神本性一切的豐盛都有形有體地居住在基督裡面」（2:9）"],["p","「神本性」這個字，在新約只出現這一次。"],["p","它不是說神的某些特徵，是說神之為神的全部。"],["p","神的全部，住在這一位有身體的人裡面。"],["q","你所需要的神，全部在你所認識的這一位耶穌裡面。"],["p","然後是這一章平地上的最高處。"],["q","「你們在他裡面也得了豐盛。他是各樣執政掌權者的元首。」（2:10）"],["p","「得了豐盛」，原文是完成式：已經被充滿了，現在仍是滿的。"],["p","保羅說：你不缺。"],["p","不是因為你的感覺滿了。是因為你的位置在他裡面，而他裡面甚麼都不缺。"],["q","我們是在豐盛裡長大，不是為了得到豐盛才拚命長大。"],["p","而且他是各樣執政掌權者的元首。王已經坐在最高處。"],["p","跟從他的人，不必向王底下的任何東西低頭。"],["q","「你們在他裡面也受了不是人手所行的割禮」（2:11）"],["p","你要的那個記號，在基督裡已經發生了。發生在比皮肉更深的地方。"],["p","「脫去肉體」，不是叫人跟自己的身體作對。"],["q","「你們既受洗與他一同埋葬，也就在此與他一同復活」（2:12）"],["p","嬰兒洗禮和信徒浸禮的弟兄姊妹，都讀這一節，議題頁有並陳。"],["p","洗禮是記號，信心是管道，神的大能是源頭。"],["p","洗禮不是魔法，也不是可有可無。"],["p","請你聽那兩個「一同」：不是我努力把自己埋掉，是我已經與他同埋。"],["p","不是我努力爬出墳墓，是神叫我與他一同起來。"],["q","「神赦免了你們一切過犯，便叫你們與基督一同活過來」（2:13）"],["p","原文前面說「你們」，講到赦免的時候，保羅改口說「我們」。"],["p","講到被饒恕，他把自己也算了進去。"],["p","接著，歌羅西書多出了一個以弗所書沒有的畫面。"],["q","「又塗抹了在律例上所寫、攻擊我們、有礙於我們的字據，把它撤去，釘在十字架上。」（2:14）"],["p","「字據」，在古代的文獻裡，就是親筆寫的欠條。"],["p","欠條上的簽名，是我們自己的。欠的，是真的。還不起，也是真的。"],["p","釘十字架的時候，耶穌頭上那塊牌子，寫的是他的罪名。"],["q","保羅說，那一天真正釘上去的，是我們的欠條。"],["p","弟兄姊妹，我們華人很會記帳。"],["p","很多人信了主，心裡還留著一本帳。"],["p","總覺得自己還欠神一點，要多做一點，才敢靠近他。"],["p","第十四節說：帳已經結清了，而且是釘死的。"],["p","律法被廢了嗎？被撤去的是那張定罪的帳，不是神良善的心意。"],["q","「既將一切執政的、掌權的擄來，明顯給眾人看，就仗著十字架誇勝。」（2:15）"],["p","「誇勝」，原文是羅馬將軍的凱旋式。"],["p","將軍打了勝仗，坐車進城，敗軍的俘虜被押在隊伍裡，給全城看。"],["p","那一天在各各他，看起來是耶穌被押著示眾。"],["p","保羅說，真正被押著遊行的，是另一方。"],["p","這一節要讀得平安，不要讀得害怕。"],["p","鬼月不敢搬家，長輩拜過的東西不敢碰，運氣不好就懷疑被下了符。"],["p","經文承認權勢是真的。可是它們已經是戰俘，武裝已經被卸下了。"],["p","所以身體不舒服，看醫生；心裡不平安，禱告。兩樣都做，不必害怕。"],["p","而且請你看他是怎樣贏的：不是用更大的力量，是被釘、被剝去。"],["q","撒但最怕的，不是一個更強的人，是一個肯死在十字架上的人。"],["p","既然你在他裡面已經滿了，欠條已經釘死，權勢已經被擄，"],["p","保羅就說出第二個「所以」。"],["q","第三步：影兒與形體。"],["q","「所以，不拘在飲食上，或節期、月朔、安息日都不可讓人論斷你們。」（2:16）"],["p","這一節在華人教會裡，常常被拿來論斷人。正好和它的意思相反。"],["p","守安息日，不是得救的條件。"],["p","在星期六敬拜、休息的弟兄姊妹，也不因此就是律法主義。"],["p","主日也不是一條新的律法，不是拿來量誰屬靈、誰不屬靈的尺。"],["p","保羅在羅馬書說得更直接："],["q","「有人看這日比那日強；有人看日日都是一樣。」（羅 14:5）"],["q","「守日的人是為主守的。」（羅 14:6）"],["p","所以這個命令有兩面：不要讓人論斷你，你也不要成為論斷人的那一個。"],["p","我們不點名任何一間教會。基督的身體只有一個。"],["q","「這些原是後事的影兒；那形體卻是基督。」（2:17）"],["p","這是全卷的鉸鏈。請你想像一個畫面。"],["q","傍晚，巷口，一個影子先轉過來，拉得很長。"],["p","你看見影子，就知道有人要來了。"],["p","影子不是壞東西。它是真的，而且是神親手設立、先到的。"],["p","可是人已經站在你面前了，你還蹲在地上抱著影子，"],["p","你就錯過了那個人。"],["q","歌羅西的錯，不在追求屬靈，在抱著影兒不放。"],["p","安息的原則仍在。身體要休息，這是神的恩典。"],["p","我們很多人一週七天停不下來，連主日也在趕場服事。"],["p","第十七節不是給你一條新規矩，是一個邀請：你可以停下來，因為形體已經是你的了。"],["q","「不可讓人因著故意謙虛和敬拜天使，就奪去你們的獎賞。」（2:18）"],["p","這個畫面是一場比賽：有人在場邊自封裁判，宣布你出局。"],["p","因為你沒有他的禁食功夫，沒有他看見的異象，沒有走過他那一套屬靈階梯。"],["p","神可以給人異象，聖經裡有。保羅沒有否認經驗本身。"],["p","他給了一個檢驗，就寫在這一節和下一節："],["q","「無故地自高自大，不持定元首。」（2:18–19）"],["p","「自高自大」，原文是被吹脹。像一個氣球，看起來很大，裡面是空的。"],["p","一個經驗、一位屬靈導師，若讓你覺得「我比他屬靈」，"],["p","若讓你非經過某個人才能聽見神，若讓基督退到後面，"],["p","就要被察驗。屬靈經驗不分等級，也不是一枚勳章。"],["p","第三章說，真正的裁判，是基督的平安在你心裡作主。"],["p","被場邊的人判出局的弟兄姊妹，請你聽：你的獎賞，不在他手裡。"],["q","「全身既然靠著他，筋節得以相助聯絡，就因神大得長進。」（2:19）"],["p","那位追求異象的人，高高在上，不需要別的肢體。"],["p","健康的身體正好相反：每一個關節都接著旁邊那一個。"],["p","一個肢體若常問「我看見了甚麼」，就容易高過別人。"],["p","若常問「我和旁邊的人接上了沒有」，就在神的生長裡。"],["p","現在，我們回到開頭那一句話。"],["p","和合本把第二十節和第二十一節合在一起譯，所以那句口號，就在第二十節的問句裡。"],["p","保羅的問題很尖銳：你們已經與基督同死了。"],["p","你已經從那個世界的管轄裡死出來了，為甚麼又回去排隊領規條？"],["p","原文那三個字，從「抓」到「嘗」到「碰」，越說越細。"],["p","還記得第十四節嗎？神已經把條例寫成的欠條釘死了。"],["q","欠條已經釘在十字架上，為甚麼又讓人拿一張新的叫你簽名？"],["p","保羅說，這些規條管的，是一用就壞的東西。"],["q","「這些規條使人徒有智慧之名，用私意崇拜，自表謙卑，苦待己身，其實在克制肉體的情慾上是毫無功效。」（2:23）"],["p","這一節，是全本新約公認最難譯的一節之一。"],["p","最後一句有兩種譯法，結論一樣：苦待己身，勝不過肉體。"],["p","它看起來很屬靈。吃得少，睡得少，對自己很狠，旁人都很佩服。"],["p","可是它治不了罪，反而讓人更以自己為中心。"],["q","全本新約只有這一節直接說：苦待己身，毫無功效。"],["p","弟兄姊妹，這一節是寫給我們團契的。"],["p","我們常講「無己」。可是無己，不是苦待己身。"],["p","不是不吃不睡，不是看輕自己的身體，不是用痛苦懲罰自己。"],["p","無己，是不再以自己為中心，把中心還給基督。"],["p","第三章會說「要治死」。可是請你看次序。"],["q","「所以，你們若真與基督一同復活，就當求在上面的事」（3:1）"],["q","「所以，要治死你們在地上的肢體」（3:5）"],["p","先同復活，才治死。治死的是罪的行為和私慾，不是身體，也不是情緒。"],["p","活的人才能治死罪。死人不能靠折磨自己活過來。"],["p","如果你曾經傷害過自己，或者在吃東西這件事上掙扎，"],["p","請你聽清楚：你不是治死得不夠。你需要的是溫柔的陪伴，和專業的幫助。"],["p","請你找一位信得過的同工說出來，也去找專業的人。教會願意陪你走。"],["p","禁食和節制仍有它的位置。那是尋求神的方法，不是屬靈的成績單。"],["p","哲學，割禮，節期，安息日，天使，異象，規條，苦修。"],["p","保羅說，這些都是影兒。"],["p","那麼形體在哪裡？"],["p","請你回想第九節那一個詞：有形有體。"],["p","神的一切豐盛，不是飄在空中的一套秘訣。"],["p","是住在一個有身體的人裡面。"],["p","我們的欠條，就是和這個身體一起，被釘在那裡的。"],["q","影子拉得再長，也抱不住。形體，是一位可以抱住的主。"],["p","是一個人。主基督耶穌。"],["p","你已經接受了他。根，已經扎在他裡面。你在他裡面，已經滿了。"],["p","國度321空中團契常說：讓耶穌作王。"],["p","讓他作王，意思是不在他旁邊再擺一個寶座。"],["p","也不在他的恩典上，再加一張你自己寫的欠條。"],["p","所以你不必更佩服今天的講員。請你更確知，你在他裡面已經滿了。"],["p","這個禮拜，請你做兩件很小的事。"],["p","第一件，每天晚上，對主說三句感謝。只要感謝，不要另外求甚麼。"],["p","第二件，想一想，你心裡有沒有一本帳，或者一條你給自己定的規條。"],["p","把它寫下來，帶到主面前，說：主啊，這張欠條，你已經釘上去了。"],["p","我們一起低頭禱告。"]]},"3":{"min":18,"blocks":[["h","《惟有基督是包括一切》"],["p","弟兄姊妹平安，今天我們一起讀歌羅西書第三章。"],["p","今天我只帶一個希臘字進來。它在第三節。"],["q","κέκρυπται。"],["p","和合本把它譯成一個字：藏。"],["q","「你們的生命與基督一同藏在神裡面。」（3:3）"],["p","這個字是完成式。"],["p","完成式的意思是：過去做完了，結果到今天還在。"],["p","所以這一句，可以這樣念給你聽："],["q","你的生命已經藏好了，而且現在仍藏著。"],["p","請你想一想，這個禮拜，你最怕失去的是甚麼。"],["p","也許是工作，也許是一段關係。保羅說，你的生命不在那裡。"],["p","你的生命，藏在一個誰都拿不走的地方。"],["p","而且藏它的，不是你。"],["p","這個字也是被動的。是神親手藏的：藏在基督裡，基督又在神裡面。"],["q","不是你把自己藏好，是神把你藏好了。"],["p","這一章有三個詞：上，藏，衣。"],["p","我們今天走三步：上面的事，治死與穿上，凡事感謝。"],["q","第一步：上面的事。"],["q","「所以，你們若真與基督一同復活，就當求在上面的事；那裡有基督坐在神的右邊。」（3:1）"],["p","這是全卷第三個「所以」。保羅下命令以前，總先放一個「已經」。"],["p","這裡的「已經」是：你們已經與基督一同復活了。"],["q","命令之前，先有一個事實。"],["p","第二章的錯謬教師，要人守一條一條的規條，一級一級爬上去。"],["p","他們遞給你一把梯子。保羅說，你已經被抱上去了。"],["p","那麼，上面在哪裡？"],["p","經文說：那裡有基督坐在神的右邊。上面不是一個方位，是一個人。"],["p","一個確知王坐在寶座上的人，心就不慌了。"],["q","「你們要思念上面的事，不要思念地上的事。」（3:2）"],["p","有人擔心：太屬天，會不會對地上沒用？請你往下讀，保羅講到妻子、丈夫、兒女、僕人。全是地上的事。"],["p","思念地上的事，是讓房子、成績、別人的眼光來定義我。"],["p","思念上面的事，是讓坐在神右邊的那一位來定義我。"],["p","然後帶著這個身分，回到廚房，回到辦公室，回到孩子的書桌前。"],["q","思念上面的事的人，最會在家裡溫柔。"],["p","第三節說「已經死了」，這也是過去的一件事。"],["p","保羅沒有叫你努力去死。他說，你已經死了。"],["p","那一場死，已經發生在基督的十字架上。今天要做的，是活在那個事實裡面。"],["p","藏，也表示今天還看不見。"],["p","所以保羅接著說："],["q","「基督是我們的生命，他顯現的時候，你們也要與他一同顯現在榮耀裡。」（3:4）"],["p","基督不是我生命裡很重要的一部分。基督就是那個生命。"],["p","被忽略的忠心，沒有人按讚的付出，那一天都要一同顯現。"],["q","一個有顯現日子的人，今天可以安靜地忠心。"],["p","治死，要等到第五節才出現。先讓藏在神裡面的生命安靜下來，治死和穿上，才從那裡長出來。"],["p","第二步，只有一個已經活過來的人，才走得動。"],["q","第二步：治死與穿上。"],["q","「所以，要治死你們在地上的肢體，就如淫亂、污穢、邪情、惡慾，和貪婪（貪婪就與拜偶像一樣）。」（3:5）"],["p","這是全卷第四個「所以」。它接在「藏在神裡面」後面，不是接在苦修後面。"],["q","先同復活，才治死。"],["p","這一節最容易被讀錯。一個方向，是讀成苦修：少吃、少睡，責打自己，越痛就越屬靈。"],["q","「苦待己身，其實在克制肉體的情慾上是毫無功效。」（2:23）"],["p","苦待自己，對付不了罪。毫無功效。"],["q","治死，不是苦待己身。更不是懲罰自己、傷害自己。"],["p","上一章那「不可拿、不可嘗、不可摸」，是錯謬教師的口號，不是聖經的命令。保羅說，那都是照人所吩咐的。"],["p","另一個讀錯的方向，是讀成壓抑情緒：不准難過，不准害怕，把感覺都按下去。"],["p","可是第五節列的，是罪的行為和私慾。不是你的身體，也不是你的情緒。"],["q","神沒有叫你治死眼淚。"],["p","第五節說的是「惡慾」。慾望本身是神造的；被扭曲的那一部分，才要治死。"],["p","那麼怎樣治死？活人才能治死，死人不能治死自己。"],["p","治死，是一個已經活在基督裡的人，對不屬於新生命的東西說不。"],["p","就像一個已經搬進新家的人，不再把舊屋的垃圾，一袋一袋搬進來。"],["p","如果今天坐在這裡的你，曾經因為罪疚，傷害過自己的身體，或者不肯讓自己吃飯、睡覺。"],["p","請你聽清楚：那不是你治死得不夠。"],["p","那是你需要被溫柔地照顧。請你告訴一位信得過的人，也請你尋求專業的幫助。"],["p","教會願意陪你。藏在神裡面的那一個你，是神所寶貝的。"],["q","一個藏在神裡面的人，反而更會愛惜這個身體，因為它是主的。"],["p","保羅說，貪婪就與拜偶像一樣。"],["p","一個人不燒香，可是讓帳戶的數字決定他睡不睡得著，他其實也在拜。"],["p","我們華人很看重多賺一點才安心。教會裡也有人，把成功學包裝成信心。"],["p","第六節說，神的忿怒必臨到這些事。那不是脾氣，是聖潔的神對罪的認真。"],["p","保羅也說，你們從前也曾這樣行過。所以治死不是好人去管壞人，是蒙恩的罪人不再回到舊路。"],["p","第八節的清單，從身體轉到嘴巴。你在家裡、在群組裡、在背後說的話，也在這張單子上。"],["p","「棄絕」原文是脫衣服的字。於是保羅換了一個畫面：換衣服。"],["q","「不要彼此說謊；因你們已經脫去舊人和舊人的行為，」（3:9）"],["q","「穿上了新人。這新人在知識上漸漸更新，正如造他主的形像。」（3:10）"],["p","以弗所書講義第四章講過舊人新人。這裡多出來的一筆，是時態。"],["p","以弗所書說「要脫去」「要穿上」。這裡說：已經脫了，已經穿了。"],["p","衣服已經換上了，所以每天早上，要照著這件衣服的樣子出門。"],["q","已經，是身分；還要，是生活。"],["p","穿上新衣服以後，第一個命令竟然是：不要彼此說謊。藏在神裡面的人，不需要靠假象保護自己。"],["p","「漸漸更新」是神一直在作的事。更新的標準是造他主的形像，這使我們想起創世記第一章。"],["p","然後，我們來到這一章的山頂。"],["q","「在此並不分希臘人、猶太人，受割禮的、未受割禮的，化外人、西古提人，為奴的、自主的，惟有基督是包括一切，又住在各人之內。」（3:11）"],["p","這是當時的人用來分高低的名單。其中最刺耳的，是西古提人。"],["p","在希臘人眼中，西古提人是野蠻的代名詞。"],["p","還有「為奴的」。送這封信的隊伍裡，就有一個曾經逃走的奴隸，阿尼西謀。他很可能就站在旁邊。"],["p","今天的歌羅西在哪裡？國語堂、粵語堂，專業人士小組、藍領小組，老一輩和年輕人。"],["p","分堂分組可能是牧養的智慧。可是若讓人覺得哪一群比較重要，這一節就要說話了。"],["p","原文最後一個字是「基督」，像一記定音鼓。"],["q","基督是一切，又在一切之中。"],["p","歌羅西的問題，是有人要在基督之外加一點：加哲學，加節期，加天使，加苦修。"],["p","這一節給的答案，是減法。分高低的記號全部拿掉，剩下的只有基督。"],["p","焦點一旦從基督移到「我是哪一種人」，教會就開始分。"],["p","焦點回到基督，人和人之間的牆，就變矮了。"],["p","在他裡面你已經滿了，不必再靠身分、背景、成績，替自己加分。"],["p","牆變矮了，衣服就可以一件一件穿上。"],["q","「所以，你們既是神的選民，聖潔蒙愛的人，就要存憐憫、恩慈、謙虛、溫柔、忍耐的心。」（3:12）"],["p","這個「存」字，原文是穿。五樣美德，是五件衣服。"],["p","可是保羅先叫你的名字：選民，聖潔，蒙愛的人。然後才把衣服遞給你。"],["p","最有意思的是「謙虛」。第二章的錯謬教師也很謙虛，用的是同一個字。"],["p","他們的謙虛向內，用苦待自己來證明自己。"],["p","真的謙虛向外。它的記號，在下一節。"],["q","「倘若這人與那人有嫌隙，總要彼此包容，彼此饒恕；主怎樣饒恕了你們，你們也要怎樣饒恕人。」（3:13）"],["p","可是我也要說清楚。饒恕，不等於假裝沒事，也不等於馬上恢復原來的關係。"],["p","饒恕，是把討債的權利交給主。和好，需要對方的悔改，需要信任慢慢重建，有時還需要界線和保護。"],["p","被傷害的人，如果心裡還沒有放下，不必因此再責備自己。"],["q","「在這一切之外，要存著愛心，愛心就是聯絡全德的。」（3:14）"],["p","愛是最外面的那一件。像一條腰帶，把所有的衣服繫在一起。"],["p","衣服穿好了，心裡卻還會有爭執。那麼，誰來吹哨子？"],["q","第三步：凡事感謝。"],["q","「又要叫基督的平安在你們心裡作主；你們也為此蒙召，歸為一體；且要存感謝的心。」（3:15）"],["p","「作主」這個字，原文是運動場上的字。裁判，吹哨子的人。"],["p","每一個人心裡都坐著一個裁判。有人讓恐懼吹哨，有人讓別人的眼光吹哨。"],["p","保羅說：讓基督的平安當裁判。"],["p","當一個決定使你越來越不安、越來越需要隱瞞，裁判在吹哨。"],["p","當一條路雖然艱難，心裡卻有一種安靜的確定，裁判在說：可以。"],["q","不再需要自己當裁判的人，就有空看見神給了他多少。"],["q","「當用各樣的智慧，把基督的道理豐豐富富地存在心裡，用詩章、頌詞、靈歌，彼此教導，互相勸戒，心被恩感，歌頌神。」（3:16）"],["p","「存在心裡」這個動詞，原文的字根是「家」。"],["p","基督的話不是偶爾來訪的客人。是住下來，當家的。"],["p","以弗所書講義第五章說，被聖靈充滿的人會唱詩、會感謝。這裡的源頭，是基督的道理。"],["p","聖靈不會帶人離開基督的話。"],["q","「無論做甚麼，或說話或行事，都要奉主耶穌的名，藉著他感謝父神。」（3:17）"],["p","第十一節說，基督是一切。所以一切，都奉他的名。"],["p","凡不能奉他的名做的，就不該做。凡能奉他的名做的，再小也是敬拜。"],["q","感謝不是做完事以後附加的，是做一切事的方式。"],["p","然後，保羅走進了家門。"],["p","這很重要。思念上面的事，第一站不是修道院，是廚房。"],["q","「你們作妻子的，當順服自己的丈夫，這在主裡面是相宜的。」（3:18）"],["q","「你們作丈夫的，要愛你們的妻子，不可苦待她們。」（3:19）"],["p","這兩節，一定要一起讀。"],["p","妻子的順服、丈夫的愛，以弗所書講義第五章已經講過。"],["p","我只講歌羅西書多出來的那一句：不可苦待她們。"],["p","「苦待」，原文的字根是苦。不要心懷苦毒，不要讓她的日子變苦。"],["p","苦待，不只是動手。"],["p","一個丈夫可以從來不打人，卻天天用話刺人，在孩子面前數落她。"],["p","也可以一句話都不說，冷戰好幾個禮拜，用沉默懲罰她。"],["q","言語的苛刻是苦待，冷暴力也是苦待。"],["p","我們常說那是個性、是脾氣。經文說，那是罪。所以我要說得非常清楚："],["q","順服，不包括忍受暴力。"],["p","如果你今天在家裡正受著傷害，請你先保護自己和孩子的安全。"],["p","告訴一位信得過的人，告訴教會的同工。必要的時候，報警，尋求專業的協助和庇護。"],["p","教會的責任，是站在你旁邊。不是勸你回家更順服一點，也不是叫你為了孩子忍一忍。"],["p","一個引用第十八節、卻不行第十九節的丈夫，已經先離開了這段經文。"],["q","「你們作兒女的，要凡事聽從父母，因為這是主所喜悅的。」（3:20）"],["p","「凡事」也有界線：父母若要孩子說謊，那不在主所喜悅的範圍裡。"],["q","「你們作父親的，不要惹兒女的氣，恐怕他們失了志氣。」（3:21）"],["p","以弗所書擔心的，是孩子被激怒。歌羅西書擔心的，是孩子放棄。"],["p","「失了志氣」這個字，在新約只出現這一次。字面的意思是：心裡的火熄了。"],["p","一個常被比較、常被罵、從來得不到一句肯定的孩子，最後不是生氣，是放棄。"],["p","我們華人有一句話：打是情，罵是愛。還有一個習慣：不要誇獎，免得孩子驕傲。"],["q","打罵不是愛的證明，往往是失志的開始。"],["p","管教是需要的。可是只有糾正沒有擁抱，孩子心裡那團火，會一點一點熄掉。"],["p","第二十一節是對父親說的。今天，它也寫給每一位母親、祖父母，和每一個帶孩子的人。"],["p","最後，保羅對僕人說了最長的一段話。"],["p","因為送信的隊伍裡有阿尼西謀，一個從腓利門家裡逃走的奴隸；而腓利門，就在這間教會裡。"],["q","「無論做甚麼，都要從心裡做，像是給主做的，不是給人做的，」（3:23）"],["p","這是職場基督徒的一節。而它最先，是寫給一個奴隸的。"],["p","前一節說「不要只在眼前事奉」。原文是一個字：眼睛加上服事。"],["p","今天很好認：老闆在線上就回訊息，老闆不在就滑手機。"],["p","保羅的解藥，不是更嚴的監督。是換一個觀眾。"],["p","可是這不是叫人忍受一切。為主做工，不包括配合違法、作假，或默默承受霸凌。"],["p","正因為我們的主在天上，我們才不必向不義的命令低頭。"],["q","「因你們知道從主那裡必得著基業為賞賜；你們所事奉的乃是主基督。」（3:24）"],["p","在羅馬的法律下，奴隸不能承受產業。保羅卻說，你們要從主那裡得著基業。"],["p","這又回到第三節。他的生命藏在神裡面；今天怎樣被對待，不是他最終的身分。"],["p","保羅另外寫了一封短信給腓利門，請他把阿尼西謀接回來："],["q","「不再是奴僕，乃是高過奴僕，是親愛的兄弟。」（門 1:16）"],["p","福音沒有在一夜之間推翻奴隸制。可是它把主人和奴隸，放在同一張主的桌子前。"],["p","弟兄姊妹，請你回頭看保羅今天走的路。"],["p","他先講位置：你已經與基督一同復活。再講心思：思念上面的事。"],["p","然後是生命、生活，然後是家裡和工作上的人；下一章，是從主所受的職分。"],["p","我們團契常講由內而外五重的改變：觀念、生命、生活、關係、事工。"],["p","今天我們不是從那句話開始的。是經文自己走出了這個次序，我們只在末端認出它來。"],["p","我們常講無己。無己不是把自己磨掉，更不是傷害自己。是生命有了一個新的地址。"],["p","我們常講焦點在耶穌。第十一節說：惟有基督是包括一切。"],["p","我們常講讓耶穌得著一切的榮耀。第十七節說：凡事奉主耶穌的名。"],["p","可是最後，我想帶你回到那個字。藏。"],["p","你的生命已經藏好了，而且現在仍藏著。"],["p","藏在哪裡？與基督一同，藏在神裡面。"],["p","那麼，基督自己呢？"],["p","上一章說，我們受洗，是與他一同埋葬，也與他一同復活。"],["p","他也曾經被藏起來過。被放進一座墳墓，門口擋著一塊石頭。"],["p","那一次，墳墓沒有留住他。"],["p","所以今天藏在他裡面的生命，也不會一直藏著。"],["q","「他顯現的時候，你們也要與他一同顯現在榮耀裡。」（3:4）"],["p","那一天，廚房裡的溫柔，沒有人看見的誠實，都要顯出來。"],["p","可是那一天，最亮的不是我們。"],["p","是他。"],["q","惟有基督是包括一切。"],["p","你不必更佩服保羅，也不必更佩服今天的講員。"],["p","請你更愛那一位，把你的生命藏在他自己裡面的主。"],["p","這個禮拜，我想請你做兩件很小的事。"],["p","第一件，每天早上念一次第三節：我的生命與基督一同藏在神裡面。"],["p","第二件，回到家，對一位家人說一句感謝的話。對孩子，說一句真心的肯定。"],["p","如果你在家裡正受著傷害，或者正在傷害自己，這個禮拜就找一個人說出來。"],["p","我們一起低頭禱告。"]]},"4":{"min":18,"blocks":[["h","《盡你從主所受的職分》"],["p","弟兄姊妹平安，今天我們一起讀歌羅西書第四章，這卷書的最後一章。"],["p","今天我想請你先聽一段對話。"],["p","這段對話，經文沒有記下來。是我照著第七到第九節，想像出來的。"],["q","從以弗所往東的大路上，兩個人已經走了好幾天。再翻過前面那座山，就是歌羅西。"],["p","走在前面的，叫推基古。他背著一個皮袋，袋子裡有三封信。"],["p","走在後面的，叫阿尼西謀。他越走越慢。"],["p","推基古回頭說：「快到了。今天晚上，我們就住在腓利門家。」"],["p","阿尼西謀停下來：「推基古弟兄，你知道我上一次走這條路，是往哪個方向走的嗎？」"],["p","推基古說：「我知道。你是從那個家逃出來的。」"],["p","「我還拿了他的東西。照法律，他可以打我，可以在我身上烙印，可以把我賣掉。」"],["p","推基古沒有回答。他把手伸進皮袋，拿出一封很短的信。"],["p","「這一封是寫給腓利門的。保羅說，你若欠他甚麼，都算在保羅的帳上。」"],["p","然後他又拿出一封長一點的。"],["p","「這一封，要在歌羅西的教會裡念出來。你聽，保羅在裡面怎麼稱呼你。」"],["q","「我又打發一位親愛忠心的兄弟阿尼西謀同去；他也是你們那裡的人。」（4:9）"],["p","阿尼西謀愣住了：「兄弟？他寫的是兄弟？不是奴僕？」"],["p","「是兄弟。和他稱呼我的，是同一個字。」"],["p","過了一會兒，阿尼西謀又問：「那對主人呢？信裡有沒有對主人說甚麼？」"],["p","推基古打開信，找到一行字，念給他聽。"],["q","「你們作主人的，要公公平平地待僕人，因為知道你們也有一位主在天上。」（4:1）"],["p","阿尼西謀沒有再問。兩個人又往前走。"],["p","一個是送信的人，一個是要回家的逃奴。"],["p","皮袋裡，一封信寫給教會，一封信寫給他的主人。"],["p","弟兄姊妹，今天這一章，就是那個皮袋裡的東西。"],["p","這一章有三個詞：鹽、門、名。"],["p","我們走三步：禱告與話語，十個名字，做滿職分。"],["q","第一步：禱告與話語。"],["p","很多人讀第四章，是從第二節開始讀的。可是第一節，其實屬於上一章。"],["p","章的分界是後來的人加上去的。保羅寫的時候，這一句緊接在三章二十五節後面。"],["q","「主並不偏待人。」（3:25）"],["p","剛說完主不偏待人，他就轉過身對主人們說：你們頭上，也有一位主。"],["p","上一章，保羅對作僕人的說了整整四節。對主人，只有這一節。"],["p","可是這一節，收在最重的地方。"],["p","「公公平平」，原文是兩個字。一個是公道，一個是對等。"],["p","公道，是該給的要給足。對等，是把那個人當人看。"],["p","在一個人可以被買賣的世界，「對等」這兩個字，幾乎是聽不見的。"],["p","請你記得那一天。信在腓利門家裡念出來的時候，阿尼西謀就站在門邊。"],["q","主人和他的逃奴，坐在同一間屋子裡，聽同一封信。"],["p","福音沒有一夜之間推翻奴隸制。可是它把主人和奴僕，放在同一張主的桌子上。"],["p","那張桌子，後來一點一點，鬆動了那個制度的根。"],["p","今天的主人，是老闆，是主管，是店長，是家裡請了幫傭的人。"],["p","公道，是工資、工時、加班費，按時、按約、按法給足。"],["p","對等，是記得這個人和我，站在同一位主面前。"],["p","我也要對作員工的說一句。上一章叫我們從心裡做，像是給主做的。"],["p","可是從心裡做，不包括配合違法，不包括忍受霸凌，也不包括替公司作假。"],["p","那位在天上的主，同時看著兩邊。"],["p","家規講完了。你以為保羅接下來要教我們方法了。"],["p","沒有。他接下來講的，是禱告。"],["q","「你們要恆切禱告，在此警醒感恩。」（4:2）"],["p","「恆切」這個字，有黏住不放的意思。"],["p","重點不在你一次禱告多久，在你肯不肯放手。"],["p","「警醒」，是主耶穌在客西馬尼園對門徒說的字。"],["q","「總要警醒禱告，免得入了迷惑。」（可 14:38）"],["p","那一晚，門徒睡著了。不是因為不愛主，是因為太累了。"],["p","保羅知道人會累。所以他在警醒裡面，放了兩個字：感恩。"],["p","一個邊禱告、邊數算恩典的人，比較不容易睡著。"],["p","也比較不容易，把禱告變成一張抱怨的清單。"],["p","這卷書一共四章，每一章都有感謝。這裡是最後一次。"],["p","全卷最後一次感謝，落在禱告裡。"],["p","接著，保羅請他們為他自己禱告。"],["q","「也要為我們禱告，求神給我們開傳道的門」（4:3）"],["p","請你想像，他寫這一句的時候，手上是有鍊子的。"],["p","照常理，他該求的是監獄的門打開。"],["p","他求的，卻是話語的門。"],["p","而且請你注意，這一句的主詞是神。門，是神開的。"],["q","我們不必把門撞開，也不必用話術把門撬開。"],["p","我們禱告，神開門。門開了，我們走進去。"],["p","所以傳福音不是業績。不是「這個月每個人要帶三個人決志」。"],["p","初期教會最會傳福音的那個人，他的第一個動作，是請人為他禱告。"],["q","「你們要愛惜光陰，用智慧與外人交往。」（4:5）"],["p","「愛惜光陰」，原文是把時機買回來。"],["p","這個時間，不是時鐘上的時間，是那一個合宜的時刻。"],["p","同事在茶水間嘆了一口氣。鄰居的孩子住院了。老同學忽然問你：你最近在忙甚麼？"],["p","這種時刻不常來。來了，也不會等你。"],["p","把它買回來，就是付一點代價把它留住。多坐十分鐘，改一個行程，把手機放下。"],["p","這不是效率主義。一個被行事曆塞滿的人，反而甚麼時機都買不到。"],["p","我們團契常講「920」，要我們找出神放在身邊的那一個「2」。"],["p","很多時候，你的那一個「2」，就是經文說的「外人」。"],["q","「你們的言語要常常帶著和氣，好像用鹽調和，就可知道該怎樣回答各人。」（4:6）"],["p","「和氣」這兩個字，原文是恩典。"],["p","先有恩典，才有鹽。次序不能倒過來。"],["p","鹽不是辣椒。辣椒是刺激人、壓倒人。鹽是讓食物出味，讓它不壞。"],["p","可是鹽放多了，整鍋菜都不能吃。"],["q","有鹽的話，不尖酸，也不乏味。"],["p","「回答各人」，有兩層意思。"],["p","一層是：對方先開口，我們才回答。"],["p","另一層是：每一個人都不一樣。"],["p","對那位按你家門鈴、手上拿著小冊子的耶和華見證人，回答也不一樣。"],["p","你不必嘲笑他，也不必把門甩上。倒一杯水給他，用調了鹽的話回答他。"],["p","沒有一份背好的稿子，可以套在所有人身上。"],["p","所以，不要抓住人逼他當場禱告。尊重一個人，本身就是福音的味道。"],["p","今天的網路留言區，也是一張餐桌。在那裡，鹽也比辣椒有用。"],["p","說到這裡，保羅的信差不多寫完了。"],["p","他沒有在信裡寫自己的近況。他說：讓送信的人親口告訴你們。"],["p","然後，他寫下了一串名字。"],["q","第二步：十個名字。"],["q","「他們要把這裡一切的事都告訴你們。」（4:9）"],["p","很多人讀聖經，讀到名單就跳過去。"],["p","今天請你慢一點。因為這卷書最後，福音落成了一份名單。"],["p","第一個名字，是推基古。"],["q","「他是忠心的執事，和我一同作主的僕人。」（4:7）"],["p","「一同作主的僕人」，那個「僕人」，原文就是奴僕。"],["p","保羅剛對奴僕們說完話，轉身就把自己和同工，都放進奴僕那一欄。"],["p","在主面前，使徒和送信的，都是奴僕。"],["p","推基古的任務有兩個：讓他們知道，讓他們得安慰。"],["q","福音，是靠這些腳走路的。"],["p","第二個名字，就是阿尼西謀。"],["p","這個名字的意思，是「有益處的」。這是當時奴僕常取的名字。"],["p","保羅在寫給腓利門的信裡，就拿這個名字說了一句話。"],["q","「他從前與你沒有益處，但如今與你我都有益處。」（門 1:11）"],["p","可是在歌羅西書裡，保羅一個字也沒提他逃跑的事。"],["p","他只說：他也是你們那裡的人。"],["p","第十二節說到以巴弗，用的是同一個說法。"],["p","建立這間教會的人，和那個逃跑的奴僕，都是「你們那裡的人」。"],["p","接納，不等於假裝甚麼都沒發生。保羅願意替他賠。"],["p","可是接納的意思是：他的名字，可以重新被叫作「弟兄」。"],["q","「與我一同坐監的亞里達古問你們安。」（4:10）"],["p","亞里達古這個人，你在使徒行傳裡找得到。"],["p","以弗所暴動，他被群眾拖進戲園。保羅被押往羅馬，他上了同一條船。現在，他陪著坐監。"],["p","有些朋友只在順境裡出現。亞里達古出現的地方，都是暴動、海難和監牢。"],["p","然後是馬可。這個名字，要慢慢讀。"],["p","多年前，馬可在第一次宣教的路上，半途回家了。"],["p","後來巴拿巴要再帶他去，保羅不肯。"],["q","「於是二人起了爭論，甚至彼此分開。」（徒 15:39）"],["p","現在，保羅親手替這個人寫推薦。"],["q","「他若到了你們那裡，你們就接待他。」（4:10）"],["p","幾年後，保羅在他最後一封信裡說："],["q","「要把馬可帶來，因為他在傳道的事上於我有益處。」（提後 4:11）"],["p","半途而廢，不是一個人的結局。"],["p","這中間，有一個不肯放手的巴拿巴，也有一個肯改變看法的保羅。"],["p","第十一節，有一句帶著痛的話。"],["q","「奉割禮的人中，只有這三個人是為神的國與我一同做工的」（4:11）"],["p","只有三個。保羅沒有數落誰離開了。"],["p","他只說，這幾個人「是叫我心裡得安慰的」。"],["p","「安慰」這個字，是當時醫生常用的字，意思是止痛。"],["p","一個被鎖在屋子裡的使徒，靠幾個朋友止痛。"],["p","再來是以巴弗。歌羅西教會，就是他建立的。"],["q","「他在禱告之間，常為你們竭力地祈求」（4:12）"],["p","「竭力」，原文是運動場上摔跤的字。"],["p","以巴弗的禱告，不是坐著念一張清單。是用力的，會流汗的，會痛的。"],["p","他求的不是錯謬的教師消失，也不是教會人數增長。"],["p","他求的是，他們「能站立得穩」。"],["p","有些弟兄姊妹年紀大了，身體弱了，以為自己甚麼都不能做了。"],["q","在遠處跪著的人，也在前線上。"],["q","「所親愛的醫生路加和底馬問你們安。」（4:14）"],["p","路加，就是寫路加福音和使徒行傳的那一位。一個醫生，跟著一個囚犯，走了很遠的路。"],["p","然後是最後一個問安的名字：底馬。"],["p","此時，他還在名單裡。他也問安，也是同工。"],["p","這使我們想起，幾年後保羅寫的一句話。"],["q","「因為底馬貪愛現今的世界，就離棄我往帖撒羅尼迦去了」（提後 4:10）"],["p","經文沒有告訴我們他後來怎樣。我們也不替他下結論。"],["p","我也不會站在這裡對你說：你若不夠火熱，就會像底馬一樣。"],["p","同一份名單裡，有一個被接回來的馬可，也有一個後來走掉的底馬。"],["p","這不是拿來嚇人的。這是一個安靜的問題：今天在名單裡的我，是靠甚麼留在名單裡？"],["p","答案不在我夠不夠熱心。答案在這一章的最後兩節。"],["p","弟兄姊妹，你有沒有發現，這份名單，其實是一張照片。"],["p","我們團契常講「235」。"],["p","「2」，是屬靈的同伴。推基古和亞里達古，一個陪著走路，一個陪著坐監。"],["p","「3」，是屬靈的父母與兒女。保羅在捆鎖中生了阿尼西謀這個兒子，又親手把他送回家。"],["p","馬可，是一個被重新接回來的兒子。"],["p","「5」，是五重職份的團隊。以巴弗建立教會、為人代禱，路加照顧、記錄，推基古送信、牧養。"],["p","可是請你注意次序。不是保羅先畫好一張圖表，再找人把格子填滿。"],["p","是福音先在這些人身上做了工。我們今天回頭看，才認出這張照片。"],["p","名單還沒有完。問安的人說完了，保羅開始請他們去問候別人。"],["q","第三步：做滿職分。"],["q","「請問老底嘉的弟兄和寧法，並她家裡的教會安。」（4:15）"],["p","寧法是一位姊妹。和合本跟著較可靠的抄本，寫的是「她」。"],["p","初期教會沒有禮拜堂。教會，就在家裡。"],["p","一位姊妹打開家門，接待一群人來敬拜、擘餅、聽信。"],["p","福音不只走在路上，也住在客廳裡。"],["q","「你們念了這書信，便交給老底嘉的教會，叫他們也念」（4:16）"],["p","這是全本新約，唯一明說「念完了，傳給下一間教會」的一句話。"],["p","領受的人，要把領受的交出去。321 說，這叫繁殖。"],["p","然後，保羅寫下了全卷最後一個命令。"],["q","「要對亞基布說：『務要謹慎，盡你從主所受的職分。』」（4:17）"],["p","一封寫給整間教會的信，最後一個命令，只對一個人說。"],["p","可是保羅用的是複數：你們要對他說。全教會一起去對亞基布說。"],["p","這不是公開羞辱。經文沒有說他失職，我們也不猜。"],["p","這是一群人的託付：我們看見你從主領受的，我們和你一起看著它。"],["p","「從主所受」的「受」字，原文和第二章第六節，是同一個動詞。"],["q","「你們既然接受了主基督耶穌，就當遵他而行」（2:6）"],["p","接受了主的人，也從主接受了職分。"],["p","所以職分不是自己選的，也不是爭來的。它的大小，不由人決定。"],["p","「盡」這個字，原文是「滿」的動詞。把它做滿。"],["p","這卷書，一路都在講滿。"],["q","「你們在他裡面也得了豐盛。」（2:10）"],["p","到了最後一個命令，這個「滿」，落在一個人身上。"],["q","基督的滿，最後落成一個人的忠心。"],["p","有人的職分是建立教會，像以巴弗。有人是送信，像推基古。"],["p","有人是打開家門，像寧法。有人是在禱告裡摔跤。"],["p","你的那一份，也許很小。可是在神的家裡，最小、也最真的一塊磚，就是一個人把自己那一份做滿。"],["p","最後，保羅從代筆的人手中，把筆接了過來。"],["q","「我－保羅親筆問你們安。你們要記念我的捆鎖。願恩惠常與你們同在！」（4:18）"],["p","請你想像那個畫面。"],["q","筆遞過去。保羅接過來。手腕上的鍊子，碰到了桌面。"],["p","寫下「使他可以在凡事上居首位」的那隻手，是一隻被鎖住的手。"],["p","高舉基督居首位的人，自己坐在監裡。"],["p","這不矛盾。榮耀歸他，鎖鍊歸我。"],["p","「記念我的捆鎖」，不是要人同情他。是要人為他禱告，也要人記得這封信的價錢。"],["p","而全卷最後一句，不是「要更努力」，也不是「別像誰一樣」。是恩惠。"],["p","弟兄姊妹，我們回到那條路上。"],["q","天黑以前，推基古和阿尼西謀，走到了腓利門家的門口。"],["p","阿尼西謀站在門外，手裡捏著那封很短的信。"],["p","他沒有辦法替自己還清欠下的。他能帶回去的，只有一封信。信上寫著："],["q","「他若虧負你，或欠你甚麼，都歸在我的帳上」（門 1:18）"],["p","弟兄姊妹，我們每一個人，都曾經是那個站在門外的阿尼西謀。"],["p","保羅在這封信的第二章，已經告訴我們，我們的帳記在哪裡。"],["q","「又塗抹了在律例上所寫、攻擊我們、有礙於我們的字據，把它撤去，釘在十字架上。」（2:14）"],["p","阿尼西謀的帳，保羅說他來還。我們的帳，基督在十字架上已經還清了。"],["p","所以我們可以敲門，可以回家，可以被叫作弟兄、姊妹。"],["p","這一週，請你把這一章帶回去，照它的次序走。"],["p","先禱告。恆切禱告，在此警醒感恩。每天晚上，在禱告裡數三件要感謝的事。"],["p","然後說話。好像用鹽調和。對你的那一個「2」，說一句帶著恩典的話。不催他，也不逼他。"],["p","然後回到你的職分。盡你從主所受的職分。問自己：主交給我的那一份，我做滿了嗎？"],["p","最後，記念我的捆鎖。為今天還戴著鎖鍊傳福音的人禱告。"],["p","他願意被鎖住，因為有一位主，先為他付清了帳。"],["p","你不必更佩服保羅，也不必佩服今天的講員。請你更愛那位在凡事上居首位的主。"],["q","「願恩惠常與你們同在！」（4:18）"],["p","我們一起低頭禱告。"]]}},"issues":[{"id":"ISS00_1","t":"書信的處境與原則——一間「什麼都不缺，只多了一點」的教會；今天的歌羅西在哪裡？","r":"1:4--8；2:4--8；2:16--23","ch":[],"why":"一、原則照守、落點隨處境——沿用哥林多前書立場一（林前 ISS00_1），本卷補述：一間保羅沒去過、由以巴弗建立的教會，在多神、多哲學的小城裡，基督很容易被放進一排神明與方法當中。歌羅西書和哥林多前書、加拉太書不一樣：教會沒有分黨、沒有離開福音、沒有逼迫，保羅聽見的是好消息。於是有人把它讀成一篇抽象的基督論，有人又把 2:8–23 讀成一場已經燒起來的大異端。這封信的處境到底是危機還是誘惑、今天的歌羅西在哪裡，必須在開卷講定，全卷四章的落點才不會飄在半空。","pos":[["【一】經文問的是甚麼","","<p>書信的總原則，本講義沿用哥林多前書立場一，不重寫：保羅寫信給特定地區、特定年代、遇到特定問題的教會；讀信的人要先找出他的「因為」，原則照守，落點隨處境，判斷的理由一定要講出來。全卷每一章照「書信」三問來讀：歌羅西人遇到甚麼？保羅從福音推出甚麼原則？今天這原則落在哪裡？</p><p>本卷要補的只有一段：<strong>這是一封寫給保羅沒去過的教會的信。</strong>他說自己是為「老底嘉人，並一切沒有與我親自見面的人」（2:1）盡心竭力；這教會的福音是從以巴弗學的：「正如你們從我們所親愛、一同作僕人的以巴弗所學的」（1:7），以巴弗「是你們那裡的人」，又在禱告中「常為你們竭力地祈求」（4:12）。保羅聽見的消息是好的：「因聽見你們在基督耶穌裡的信心，並向眾聖徒的愛心」（1:4），甚至說「見你們循規蹈矩，信基督的心也堅固，我就歡喜了」（2:5）。</p><p>可是同一封信又一再警告：「我說這話，免得有人用花言巧語迷惑你們」（2:4），「你們要謹慎，恐怕有人用他的理學和虛空的妄言……就把你們擄去」（2:8），「不可讓人論斷你們」（2:16），「不可讓人……奪去你們的獎賞」（2:18）。<strong>經文問的是：一間信心堅固、愛心有名的教會，為甚麼需要這樣的警告？它的處境是一場危機，還是一個誘惑？今天的讀者要把這封信放在哪一座城市裡讀？</strong></p>"],["全面危機說（歌羅西教會已經被一套成形的異端攻佔，整封信是一場緊急的反擊）","","<p>認為 2:8–23 描寫的是一個已經在教會裡成形、有領袖、有教義、有儀式的錯謬團體，教會正處在被拉走的邊緣；所以保羅先在 1:15–20 立起基督至高的教義，再在第 2 章逐條反駁。十九世紀的萊特富（J. B. Lightfoot）以來，許多註釋都花很大的篇幅重建這個「歌羅西異端」的面貌。這派抓住了一件真實的事：第 2 章的警告非常具體——飲食、節期、月朔、安息日、敬拜天使、「不可拿、不可嘗、不可摸」（2:21），不是空泛的道德勸勉。</p><p><strong>難處：</strong>保羅自己的口氣不像在救火。他為他們感謝（1:3），稱讚他們的信心與愛心（1:4），說福音在他們中間「結果，增長」（1:6），還說「見你們循規蹈矩，信基督的心也堅固，我就歡喜了」（2:5）。對照加拉太書一開頭的「我希奇你們這麼快離開那藉著基督之恩召你們的」（加 1:6），歌羅西書的警告更像是預防：「你們要謹慎」（2:8）、「不可讓人」（2:16、18）。把整封信讀成一場危機，容易把這間好教會講成一間壞教會，也把第 1 章的頌讚讀成只是反駁的前奏。</p>"],["沒有具體對手說（2:8–23 只是一般性的提醒，不必重建任何錯謬）","","<p>認為歌羅西書背後未必有一個具體的錯謬團體；保羅只是提醒一群剛從外邦宗教出來的信徒，不要被周圍環境裡的各種宗教習俗拉回去。胡克（Morna Hooker）在一篇著名的文章裡就問過：歌羅西真的有假教師嗎？這派的優點是貼近 1:4–6 與 2:5 的好消息，也提醒讀者不要過度想像一個書裡沒有明說的對手。它也讓這封信更容易落到今天：每一個信徒都活在宗教與文化的拉扯裡。</p><p><strong>難處：</strong>第 2 章有幾處讀起來確實像在引用某些人的話：「不可拿、不可嘗、不可摸」（2:21）像一句口號；「故意謙虛和敬拜天使」「拘泥在所見過的」（2:18）像是某種特定的屬靈操練；「恐怕有人用他的理學」（2:8）裡的「有人」（τις）是單數，像是在指某一類具體的人。若完全不承認有具體的教導在流傳，這些細節就很難解釋；而且讀者會失去辨認今天版本的那份敏銳。</p>"],["誘惑說（處境不是一場危機，是一個誘惑：基督被放進一排神明與方法當中）","","<p>認為歌羅西教會的處境介在兩者之間：教會本身是健康的，但在呂克斯河谷這個多神、多宗教、多哲學的小城裡，有人開始帶來一套「加一點」的教導——加一點哲學、加一點節期與飲食的規條、加一點天使與異象的經驗、加一點苦修。河谷裡有不小的猶太社群，有弗呂家地區祈求天使與神靈保護的民間宗教，有希臘哲學，也有各種神秘宗教；<strong>在這樣的城裡，最自然的事不是拒絕基督，而是把基督放進一排神明與方法當中，成為「其中一個」。</strong></p><p>這派的優點是同時接住前面兩派的長處：它承認警告是具體的，也承認教會是好的；它也解釋了保羅為甚麼不是一開口就責備，而是先唱一首基督居首位的詩（1:15–20），再說「你們在他裡面也得了豐盛」（2:10）。<strong>難處</strong>是「誘惑」容易講得太籠統，變成「哪裡都有誘惑」而失去落點；所以每一章仍要照「書信」三問，把原則落到今天一個具體的「加一點」上（見 ISS00_3）。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：沿用哥林多前書立場一——原則照守、落點隨處境，判斷的理由要講出來。本卷補一段：歌羅西書寫給一間保羅沒去過、由以巴弗建立的教會；它的處境不是一場危機，是一個誘惑——在多神、多哲學、多宗教的小城裡，基督很容易被放進一排神明與方法當中，成為「其中一個」。</strong>第 2 章的錯謬本講義照實陳列各家重建（見 ISS00_3），但不把這間教會講成一間已經失落的教會。</p><p>所以全卷的四個意象都有地方落腳：<strong>首</strong>——在一排神明當中，「使他可以在凡事上居首位」（1:18）；<strong>根</strong>——在各樣「加一點」的風裡，「在他裡面生根建造」（2:7）；<strong>上</strong>——在一座眼睛盯著地上規條的城裡，「你們要思念上面的事」（3:2）；<strong>鹽</strong>——在一座不信的城裡，「你們的言語要常常帶著和氣，好像用鹽調和」（4:6）。</p><p><strong>今天的歌羅西，就是每一個什麼都可以「加一點」的華人城市</strong>：信耶穌，也拜拜；信耶穌，也算命、看風水、擇日子；信耶穌，也加一套成功學、一套養生秘訣、一位「更有恩膏」的屬靈導師。321 說「焦點在耶穌」；歌羅西書說：焦點一旦從耶穌移到「耶穌加上……」，就已經偏了。全卷四章的落點，都照這一條量：<strong>讓基督在凡事上居首位的人，怎樣在今天不再在基督以外加甚麼？</strong></p>"],["【四】這件事該不該影響你的信心","","<p>不該——反過來說，這封信的處境本身就是一種安慰。保羅從來沒有見過這間教會，卻為他們「不住地禱告祈求」（1:9），為他們「是何等地盡心竭力」（2:1）；建立這間教會的以巴弗，人在遠方，仍然「在禱告之間，常為你們竭力地祈求」（4:12）。<strong>一間沒有見過使徒的小城教會，一直被人放在禱告裡。</strong>今天讀這封信的你，也不例外。</p><p>它也告訴我們：好教會也需要被提醒。「你們既然接受了主基督耶穌，就當遵他而行」（2:6）——開始得好不是問題，問題是開始之後，會不會慢慢在基督旁邊多擺一樣東西。<strong>你住的城市再多神、再多方法，也不會比歌羅西更擠；那位居首位的基督，在那裡照樣是足夠的。</strong></p>"]],"con":[],"say":"本講義的全卷立場：沿用哥林多前書立場一——原則照守、落點隨處境，判斷的理由要講出來。歌羅西書寫給一間保羅沒去過、由以巴弗建立的教會，處境不是一場危機，是一個誘惑：在多神、多哲學的小城裡，基督被放進一排神明與方法當中，成為「其中一個」。今天的歌羅西，就是每一個什麼都可以「加一點」的華人城市。","care":"牧養底線：講「今天的歌羅西」時，不嘲笑或醜化會眾家人的民間信仰，也不點名羞辱任何宗教、教會或宗派——席上有剛信主、全家仍在拜拜的人，他回家要面對的是愛他的父母，不是講台上的漫畫。也不要讓「加一點」變成一種新的猜疑，叫弟兄姊妹彼此檢查誰比較純正；保羅自己是先感謝、先稱讚，才提醒。席上若有曾經被教會指為「混合信仰」而受傷、離開的人，對他講 1:4 與 2:5——保羅看見的先是信心與愛心。講完，會眾帶走的應該是「基督在我的城市裡也是足夠的」，而不是更怕這座城、或更瞧不起城裡的人。"},{"id":"ISS00_2","t":"基督的神性與「首生」——1:15 是說基督是第一個被造的嗎？","r":"1:15--20；2:9","ch":[],"why":"二、站在尼西亞信經與歷代正統教會的立場：基督是真神也是真人；首生是地位與承受權——本講義的全卷立場之二（本卷新立）。1:15「是首生的」是兩千年來最常被拿來證明「基督是第一個被造物」的一節；從第四世紀的亞流，到今天按門鈴、在捷運站擺書攤的耶和華見證人，用的都是這幾個字。講台上又常常落成兩種失誤：一種是講不清楚，讓會眾以為「首生」就是第一個生的；另一種是講得太兇，嘲笑、攻擊那些來敲門的人。這一題是基督教信仰的核心，必須在開卷講定。","pos":[["【一】經文問的是甚麼","","<p>「愛子是那不能看見之神的像，是首生的，在一切被造的以先」（1:15）；「因為神本性一切的豐盛都有形有體地居住在基督裡面」（2:9）。經文問的是：基督是神嗎？還是最高的受造者？「首生的」是甚麼意思？「神本性一切的豐盛」又是甚麼意思？</p><p>在進入各家之前，先讓經文自己說五件事。<strong>一、他是創造者</strong>：「因為萬有都是靠他造的……一概都是藉著他造的，又是為他造的」（1:16）。<strong>二、他是維持者</strong>：「萬有也靠他而立」（1:17）——原文 συνέστηκεν，萬有靠他凝聚在一起，此刻仍是如此。<strong>三、他是神的像</strong>：「那不能看見之神的像」（1:15）——看見他，就看見了神（這使我們想起「人看見了我，就是看見了父」，約 14:9）。<strong>四、神的本性全部在他裡面</strong>：2:9 的「神本性」原文 θεότης，是神性本身，不是 θειότης（神的特性、像神的樣子）；「有形有體地」（σωματικῶς）——道成肉身，而且現在仍是，「居住」（κατοικεῖ）是現在式。<strong>五、他是和好的成就者</strong>：「既然藉著他在十字架上所流的血成就了和平」（1:20）——創造萬有的，為萬有流血。</p><p>原文 πρωτότοκος πάσης κτίσεως，直譯「一切被造之物的首生者」。各家的爭論就在這幾個字：這個屬格是「被造物當中的一個」，還是「在一切被造物之上」？「首生」是次序，還是地位？</p>"],["亞流派與耶和華見證人（子是第一個被造、最高的受造者）","","<p>第四世紀的亞流（Arius）主張：子是父在萬有之先所造的第一個受造者，「曾有一個時候，子不存在」；父藉著子創造其餘的萬物。今天的耶和華見證人承接了這個讀法：πάσης κτίσεως 讀作部分屬格（被造物中的一個），「首生」就是第一個生的；他們的《新世界譯本》並在 1:16–17 加上「其他」，讀成「萬有其他一切都是靠他造的」。這派抓住了一件真實的事：在日常用語裡，「首生」確實常指家中第一個出生的孩子；它也很認真地想保護「只有一位神」的信仰。</p><p><strong>難處：</strong>決定性的經文就在下一節。1:16 開頭是 ὅτι，「因為萬有都是靠他造的」（1:16）——保羅給「首生」的理由，正是他是創造者；若他自己是被造的，就必須說他創造了自己。原文 1:16–17 沒有「其他」這個字，譯本必須加字才能維持這個讀法。而且 2:9 說「神本性一切的豐盛」都居住在他裡面——一個受造者裡面，不可能住著神性的全部。1:18 第二次用「首生」：「是從死裡首先復生的」（1:18）——拉撒路比他先從死裡出來，他卻是「首生」，可見這個字在保羅筆下是地位，不是次序。</p>"],["嗣子論（耶穌是一個人，在受洗或復活時被神「收養」為神子）","","<p>二、三世紀的拜占庭人狄奧多徒（Theodotus）、撒摩撒他的保羅等人主張：耶穌本是一位極其敬虔的人，神在他受洗或復活的時候收養他、高舉他，賜他神子的地位。這派可以引 1:18「是從死裡首先復生的，使他可以在凡事上居首位」（1:18），說他是因為復活才得著首位；它也很看重耶穌真實的人性與順服，這一點是對的。</p><p><strong>難處：</strong>歌羅西書的次序剛好相反。1:13 他在被提到之前，就已經是父的「愛子」；1:15–17 講的是他在創造以先、創造之中、創造之後的身分——「他在萬有之先」（1:17）；1:18 的復活是他「顯明」首位，不是他「得到」神性。2:9 的「居住」又是現在式：神本性的豐盛不是某一天才搬進一個人裡面，而是一直住在他裡面。嗣子論把一首從創造唱到十字架的詩，剪成了只剩下後半段。</p>"],["近代自由派（耶穌是最像神的人，「神的像」是道德的榜樣）","","<p>十九世紀以來，有些神學家（例如施萊爾馬赫 Schleiermacher 一路下來的傳統）把耶穌理解為對神有最完全意識、最完全活出神的樣式的人；1:15「那不能看見之神的像」就是說：在耶穌身上，我們看見一個人可以像神到甚麼地步。這派的優點是認真對待「像」（εἰκών）這個字和創世記「照著我們的形像」的回聲，也提醒讀者：基督不只是要被相信的教義，也是要被效法的生命。</p><p><strong>難處：</strong>1:16–17 說的不是道德，是創造與維持——一個「最像神的人」，不可能是「萬有都是靠他造的」那一位，萬有也不會「靠他而立」。這裡的「像」更接近希伯來書說的「是神本體的真像，常用他權能的命令托住萬有」（來 1:3）：不是仿製品，是那不能看見的神親自顯現出來。把基督講成最好的榜樣，就拿走了 1:20 的十字架：榜樣可以感動人，卻不能叫萬有與神和好。</p>"],["尼西亞正統（子與父同質；首生是地位與承受權）","","<p>主後 325 年尼西亞會議以來，正統教會承認子是「從真神所出的真神，受生而非被造，與父同質」；今天的福音派、天主教、東正教，在這一點上是同一個信仰。這派讀 1:15 的「首生」為地位與承受權：舊約「首生」常指地位，不是出生次序——神論到大衛的後裔說「我也要立他為長子，為世上最高的君王」（詩 89:27），以法蓮明明不是約瑟的長子，神卻說「以法蓮是我的長子」（耶 31:9）（這使我們想起這兩處，歌羅西書沒有明文引用）。πάσης κτίσεως 讀作從屬或比較的屬格：他是在一切被造之上的那一位，一切被造的都歸他承受。</p><p><strong>難處：</strong>它需要誠實面對兩件事。一、和合本譯作「在一切被造的以先」，把 πρωτότοκος 的時間意義與 1:17「他在萬有之先」連讀——這不錯，但「以先」若只講成時間，讀者又容易滑回「第一個被造」；所以講台上必須把 1:16 的「因為」與 1:18 的第二次「首生」一起讀。二、三位一體是一個奧祕，不是一道可以算完的數學題；正統教會兩千年來能說清楚的是界線（不是三位神、不是一位神換三個面具、子不是被造的），而不是把奧祕完全說盡。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：站在尼西亞信經與歷代正統教會的立場——基督是真神，也是真人；1:15 的「首生」是地位與承受權，不是第一個被造的。</strong>這不是本講義的一家之言，是全世界福音派、天主教、東正教共同的信仰。第 1 章的原文解經處理 πρωτότοκος 時三種讀法並陳，並且一定指出 1:16 開頭的 ὅτι 與 1:18 的第二次用法。</p><p>講台的落點一句：<strong>首生不是第一個被造的，是一切被造的都歸他承受。</strong>第二句也要一起說：<strong>2:9「有形有體地」——基督是神，並沒有取消他是人；他今天仍有一個復活的身體。</strong>所以我們不只在教義上說「基督是神」，也在禱告裡知道：坐在神右邊的那一位，懂得一個人的身體與眼淚。</p><p>這一條也是 321「讓耶穌作王」最寬的根基。他本來就是王——萬有是他造的、為他造的、靠他立的；<strong>我們讓他作王，不是把一個位子讓給他，是把我們佔了的位子還給他。</strong>「使他可以在凡事上居首位」（1:18），就是全宇宙回到本位。</p>"],["【四】這件事該不該影響你的信心","","<p><strong>這一條影響</strong>——這是基督教信仰的核心，不是次要的爭議。若基督只是最高的受造者，那「神本性一切的豐盛」就不在他裡面，我們「在他裡面也得了豐盛」（2:10）也就落空了；一個受造者的血，不能叫萬有與神和好。</p><p><strong>但影響的方式是敬拜，不是辯論。</strong>1:15–20 原是一首詩歌，保羅先唱給我們聽，才在第 2 章講道理。你不必先把三位一體講到無懈可擊，才可以安心；你可以像多馬那樣，在復活的主面前說「我的主！我的神！」（約 20:28）。<strong>你看見基督，就看見了神；你擁有基督，就擁有了一切。</strong></p>"]],"con":[],"say":"本講義的全卷立場：站在尼西亞信經與歷代正統教會的立場——基督是真神也是真人；1:15 的「首生」是地位與承受權，不是第一個被造的：1:16 開頭的「因為」說明他是創造者，1:18 第二次「首生」是地位。首生不是第一個被造的，是一切被造的都歸他承受。這一條影響信心，但影響的方式是敬拜，不是辯論。","care":"牧養底線：講台上不嘲笑、不攻擊耶和華見證人或其他一神論的朋友（紅線一）——他們常常就是敲你家門的那一位，4:5–6「用智慧與外人交往」「好像用鹽調和，就可知道該怎樣回答各人」正是寫給這種時刻的。席上可能有從耶和華見證人或其他團體出來、家人仍在其中的人，他們最怕的是聽見自己的父母被當成笑話；也可能有被敲門的人問倒、從此懷疑自己信仰的年輕人，對他們先肯定願意思考，再陪他讀 1:15–20 與 2:9。不把三位一體講成數學題，也不讓這一題變成辯論技巧課；講完，會眾應當更想敬拜，而不是更想去吵贏人。"},{"id":"ISS00_3","t":"「基督加上……」：哲學、規條、節期、安息日與天使——2:8--23 今天怎樣讀？","r":"2:8--23","ch":[],"why":"三、錯謬的共同特徵是「基督＋」；基督已經足夠；守日的與不守日的都不可彼此論斷——本講義的全卷立場之三（本卷新立）。2:8–23 是全卷最容易被兩個方向誤用的一段：一邊拿它來反智、反哲學、禁一切，把 2:21 的口號當成聖經命令；另一邊拿 2:16 來論斷守星期六的教會，或反過來被守星期六的人論斷。華人教會今天最常見的偏差，又正是這一段描寫的：不是不信耶穌，是「信耶穌，再加上一個方法、一套規矩、一個經驗、一位導師」。這一題講錯，會眾不是被規條綁住，就是學會論斷別人，必須在開卷講定。","pos":[["【一】經文問的是甚麼","","<p>2:8–23 警告四件事：「理學和虛空的妄言」（2:8）；「不拘在飲食上，或節期、月朔、安息日都不可讓人論斷你們」（2:16）；「不可讓人因著故意謙虛和敬拜天使，就奪去你們的獎賞」（2:18）；「不可拿、不可嘗、不可摸」（2:21）。經文問的是：這些今天還有嗎？基督徒可以讀哲學嗎？要守安息日嗎？可以有異象嗎？禁戒對不對？</p><p>在進入各家之前，先讓經文自己說五件事。<strong>一、錯的標準不是「新不新」「難不難」，是「照不照著基督」</strong>：「不照著基督，乃照人間的遺傳和世上的小學」（2:8）。<strong>二、基督已經足夠</strong>：「你們在他裡面也得了豐盛」（2:10）——原文 ἐστὲ πεπληρωμένοι，完成式，已經被充滿了，而且一直是滿的；任何「加上」，都是在說「還不夠」。<strong>三、影兒不是壞的，但抱著影兒不放就錯過了形體</strong>：「這些原是後事的影兒；那形體卻是基督」（2:17）。<strong>四、假屬靈的記號是自高自大</strong>：「無故地自高自大」（2:18），結果是「不持定元首」（2:19）。<strong>五、規條治不了肉體</strong>：「其實在克制肉體的情慾上是毫無功效」（2:23）。</p><p>還要注意 2:16 開頭的「所以」：它接在 2:14–15 十字架的勝利後面——字據已經撤去、執政掌權的已經被擄來，<strong>所以</strong>不要讓人拿這些來論斷你。各家的爭論，一在「歌羅西異端」到底是甚麼，二在安息日今天怎樣守。</p>"],["「歌羅西異端」：猶太神秘主義說","","<p>認為錯謬來自猶太教裡的一股神秘傳統：守節期、月朔、安息日與飲食規條（2:16），又藉著禁食、苦修預備自己升天，在異象中「與天使一同敬拜」。有學者（如 Fred Francis）指出，2:18 的「敬拜天使」原文可以讀作「天使所獻的敬拜」，也就是在異象中看見、參與天上天使的敬拜；「拘泥在所見過的」正是這種異象經驗。這派的優點是同時解釋了割禮（2:11）、安息日（2:16）、天使（2:18）與苦修（2:23）四件事。</p><p><strong>難處：</strong>歌羅西書沒有一處提到摩西律法、也沒有一次用「律法」這個字；保羅稱這套教導為「理學」「世上的小學」（2:8、20），聽起來比純猶太的背景更混雜。而且第一世紀猶太神秘傳統的細節，多半來自較晚的文獻，用來重建歌羅西要很小心。</p>"],["「歌羅西異端」：早期諾斯底說","","<p>認為錯謬是後來諾斯底主義的早期形態：神與物質世界之間隔著一層層的靈界勢力，人要靠秘密的知識、苦待身體，才能一層一層上升；所以保羅刻意使用「豐盛」（πλήρωμα，2:9）、「智慧知識都在他裡面藏著」（2:3）、「有位的，主治的，執政的，掌權的」（1:16）這些字，說基督就是那全部的豐盛，靈界的一切都是他造的。這派的優點是解釋了全卷為甚麼這麼強調「一切」「萬有」與「豐盛」。</p><p><strong>難處：</strong>成形的諾斯底體系是二世紀的事，把它讀回第一世紀的歌羅西有時代錯置的危險；而且諾斯底派輕看物質與身體，卻不太在意安息日與月朔，2:16 的猶太色彩很難用這一說解釋。今天多數學者只說歌羅西的錯謬「帶有」一些後來諾斯底思想的元素。</p>"],["「歌羅西異端」：弗呂家民間宗教與混合主義說","","<p>認為錯謬是呂克斯河谷當地的混合信仰：弗呂家地區的民間宗教盛行祈求天使與神靈保護、配戴護身符、以禁戒與儀式求平安，當地的猶太人有些也吸收了這些做法。阿諾德（Clinton Arnold）根據出土的碑文與咒語，主張 2:18 的「敬拜天使」就是呼求天使保護、驅邪；所以保羅說基督「既將一切執政的、掌權的擄來，明顯給眾人看，就仗著十字架誇勝」（2:15）——不必再求別的保護。這派又稱混合主義：一點猶太的節期、一點民間的天使、一點希臘的哲學、一點苦修，全部拌在一起。</p><p><strong>難處：</strong>它的範圍很寬，容易變成「甚麼都有一點」，而失去解釋力；碑文多半比歌羅西書晚，也不一定代表歌羅西城本身。不過它最接近保羅自己的處理方式：他沒有給這套教導一個名字，只指出它的共同特徵——不照著基督。</p>"],["安息日：第七日安息日派（第七日安息日是永久的誡命）","","<p>華人自立教會中有守星期六安息日的教會，世界各地也有基督復臨安息日會，許多是愛主、敬虔的弟兄姊妹。他們認為第七日安息日是創造時就設立、寫在十誡裡的永久誡命；2:16 的「安息日」原文是複數（σαββάτων），與節期、月朔並列，指的是猶太曆法中儀式性的特別安息日，不包括每週的第七日。這派的心志是認真對待神的誡命，也提醒教會不要輕看安息與敬拜的節奏。</p><p><strong>難處：</strong>σαββάτων 在新約經常用複數來指每週的安息日；「節期、月朔、安息日」是舊約年、月、週三種聖日的固定組合（這使我們想起代上 23:31；何 2:11），保羅把三者一起列，看起來是把整套聖日放在「影兒」底下（2:17），不是只講某一種。而且若守第七日成為真教會或得救的記號，就正好碰到 2:16「不可讓人論斷你們」。</p>"],["安息日：主日安息日派（安息日轉移到主日，清教徒傳統）","","<p>認為十誡的安息日原則永遠有效，但在新約裡因主的復活轉移到七日的頭一日；威斯敏斯德信條與清教徒傳統都這樣教導，許多華人教會也把主日當成「新約的安息日」來守。這派的優點是保住了安息的原則與每週敬拜的節奏，也讓忙碌的城市人有一天停下來歸給神。</p><p><strong>難處：</strong>新約沒有一處把主日稱為安息日，2:16 也沒有說安息日轉移了；實踐上更常見的危險是把主日變成一條新的律法——「主日去旅行就是干犯安息日」「主日沒去教會就不屬靈」，這正是 2:16–17 要保護人脫離的那一種論斷。主日的寶貴，在於它紀念復活，不在於它是一條新規條。</p>"],["安息日：新約成全派（安息的原則在基督裡成全，日子不是條件）","","<p>認為安息日是「後事的影兒」，形體是基督（2:17）；真正的安息是在基督裡歇了自己的工：「這樣看來，必另有一安息日的安息為神的子民存留」（來 4:9），主耶穌也說「凡勞苦擔重擔的人可以到我這裡來，我就使你們得安息」（太 11:28）。所以守哪一天不是得救的條件，各人可以按良心選擇；保羅自己作了這個連結：「有人看這日比那日強；有人看日日都是一樣。只是各人心裡要意見堅定」（羅 14:5）。</p><p><strong>難處：</strong>這派若處理不好，容易變成「天天都一樣，所以哪一天都不必停」，結果在城市裡七天都在工作，把安息的恩典也一起丟掉了；也容易反過來看不起守日的人，說他們是「律法主義」——那同樣是在論斷。影兒指向形體，不等於影兒指向的那份安息不重要。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：歌羅西的錯謬不必找到確切的名字——保羅自己也沒有給它名字；它的共同特徵是「基督＋」。基督已經足夠：「你們在他裡面也得了豐盛」（2:10）。</strong>本講義照這個特徵，辨認今天的版本。</p><p><strong>哲學與學問</strong>：2:8 的「理學」是「照人間的遺傳」的那一種；不是反對思考、讀書、科學——保羅自己禱告他們「在一切屬靈的智慧悟性上」長進（1:9），又說「所積蓄的一切智慧知識，都在他裡面藏著」（2:3）。所有學問都歡迎，只要基督居首位（紅線六）。<strong>安息日與節期</strong>：守不守安息日不是得救的條件；選擇在星期六或星期日敬拜、休息的弟兄姊妹，都不可以被論斷——「守日的人是為主守的」（羅 14:6）。2:16 說「不可讓人論斷你們」，<strong>我們也不要成為論斷人的那一個</strong>（紅線二）。安息的原則仍在：不是律法，是恩典——一個藏在神裡面的生命（3:3），不必靠不停工作來證明自己。</p><p><strong>異象與屬靈經驗</strong>：神可以給人異象；但任何經驗、任何屬靈導師，若讓人「不持定元首」（2:19）、讓人覺得自己高人一等（2:18），就要被察驗（回指以弗所書立場五）。<strong>2:21 的口號</strong>：「不可拿、不可嘗、不可摸」是錯謬教師的口號，保羅引它是為了否定它——「這都是照人所吩咐、所教導的」（2:22）；講台上不可以把它當成聖經命令（紅線三）。</p><p><strong>華人處境的「基督＋」</strong>：基督＋民間信仰（擇日、風水、護身符、「也拜一下比較安心」）——2:15 基督已經誇勝，不必再求別的保護（回指以弗所書立場四）；基督＋成功學（「信耶穌再加這七個秘訣就會成功」）；基督＋教會規條（衣著、飲食、節日的規矩變成得救或屬靈的記號）；基督＋屬靈階級（「要經過某位導師的遮蓋才能聽見神」）。321 說「焦點在耶穌」：焦點一旦變成「耶穌加上……」，就已經偏了。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。<strong>各派都同意：基督是足夠的；節期、哲學、經驗都在他之下。</strong>學者爭的是歌羅西的錯謬叫甚麼名字，守星期六與守星期日的弟兄姊妹爭的是哪一天，卻沒有一派說「基督還不夠，要再加上我們這一套才得救」——說這種話的，正是保羅要我們小心的。</p><p>如果你曾經被規條壓得喘不過氣——吃的、穿的、哪一天、哪一種禱告方式、哪一位屬靈導師——請聽 2:14：那「攻擊我們、有礙於我們的字據」，神已經「把它撤去，釘在十字架上」（2:14）。<strong>一個已經滿了的杯子，不需要再加；你在基督裡，已經滿了。</strong></p>"]],"con":[],"say":"本講義的全卷立場：歌羅西的錯謬各家重建並陳，不必找到確切名字，它的共同特徵是「基督＋」；錯的標準是「照不照著基督」，基督已經足夠。學問都歡迎，只要基督居首位；守不守安息日不是得救的條件，守日的與不守日的都不可彼此論斷，安息的原則是恩典不是律法；異象與經驗要被 2:19 察驗；2:21 是錯謬的口號，不是聖經命令。","care":"牧養底線：不點名攻擊任何教會或宗派——席上可能有從守安息日的教會來的弟兄姊妹，也可能有家人仍在那裡，2:16 的重點是「不可讓人論斷你們」，講台不可以自己成為論斷人的那一個（紅線二）。不把 2:21 的口號當成禁煙、禁酒、禁一切的經文；要勸人節制，引的是愛弟兄的原則（這使我們想起羅 14:21），不是 2:21。不用「你家裡有拜拜的東西，所以被轄制」嚇唬剛信主、仍與拜拜的家人同住的人（紅線七）——2:15 是平安，不是恐慌。也要想到曾被某位「屬靈導師」或某套規條控制過的人，他們聽到這一段可能又痛又怕，會後單獨關心，不急著要他回到任何團體。先讓會眾看見基督多大，錯謬自然變小；不讓「破除錯謬」變成講台的主菜。"},{"id":"ISS00_4","t":"與基督同死同活：洗禮、割禮、治死與苦待己身——321 的「無己」站在哪一邊？","r":"2:11--13；2:20--23；3:1--10","ch":[],"why":"四、先同復活，才治死；治死的是罪，不是身體；無己不是苦待己身——本講義的全卷立場之四（本卷新立）。這是專屬本卷、也專屬我們團契的一題：321 強調「捨己」「無己」，最容易被聽成「越苦待自己越屬靈」；讀到 3:5「要治死你們在地上的肢體」，又很容易以為讀到了「無己」的苦修版。而 2:23 是全本新約唯一直接說「苦待己身……毫無功效」的一節，它保護人，也保護 321。同一段又牽涉嬰兒洗禮與信徒浸禮的兩派傳統。這一題講錯，傷的是會眾席上最容易責怪自己的人，必須在開卷講定。","pos":[["【一】經文問的是甚麼","","<p>「你們既受洗與他一同埋葬，也就在此與他一同復活，都因信那叫他從死裡復活神的功用」（2:12）；「你們在他裡面也受了不是人手所行的割禮」（2:11）；「所以，要治死你們在地上的肢體」（3:5）；「這些規條使人徒有智慧之名，用私意崇拜，自表謙卑，苦待己身，其實在克制肉體的情慾上是毫無功效」（2:23）。經文問的是：洗禮是甚麼？嬰兒洗禮對嗎？「不是人手所行的割禮」是甚麼？「治死」怎樣治死？和「苦待己身」有甚麼不同？321 的「無己」站在哪一邊？</p><p>先讓經文自己說五件事。<strong>一、與基督同死同活是一件已經發生的事</strong>：2:12「一同埋葬」「一同復活」都是過去式；「因為你們已經死了，你們的生命與基督一同藏在神裡面」（3:3）——不是我努力死，是我已經死了。<strong>二、它是「因信」發生的</strong>：「都因信那叫他從死裡復活神的功用」（2:12）——洗禮是記號，信心是管道，神的大能是源頭。<strong>三、「治死」是在「同復活」之後</strong>：3:1 先說「你們若真與基督一同復活」，3:5 才說「所以，要治死」——次序不能顛倒：活的人才能治死；死人不能治死自己。<strong>四、治死的對象是罪，不是身體</strong>：3:5 列的是「淫亂、污穢、邪情、惡慾，和貪婪」，3:8 是「惱恨、忿怒、惡毒、毀謗，並口中污穢的言語」——沒有一樣是身體本身，也沒有一樣是人的正常需要或情緒的存在。<strong>五、苦待己身毫無功效</strong>：2:23 的「苦待己身」原文 ἀφειδίᾳ σώματος，「不愛惜身體」——對付罪最失敗的方法，就是對付自己的身體。</p>"],["洗禮：嬰兒洗禮派（洗禮是新約的立約記號，可施於信徒的兒女）","","<p>改革宗、路德宗、聖公會、循道會等傳統認為：2:11–12 把割禮與洗禮並排——「受了不是人手所行的割禮」緊接著「受洗與他一同埋葬」；舊約的割禮施於立約百姓的男嬰，新約的洗禮作為立約的記號，也可以施於信徒的兒女。使徒行傳裡有「全家」受洗的記載（〔背景〕徒 16:33），這派也看重神的應許是給「你們和你們的兒女」。這派的優點是把洗禮放在神的約與恩典底下：先有神的應許，才有人的回應。</p><p><strong>難處：</strong>2:12 明說是「都因信」——嬰兒還不能表達信心，所以這派必須說明信心怎樣與嬰兒洗禮相連（多半以父母與教會的信心、以及孩子日後的堅振或公開認信來回答）。新約也沒有一處明文記載為嬰兒施洗；「全家」裡是否有嬰兒，經文沒有說。實踐上的危險，是讓人以為「小時候受過洗就沒事了」，而不再追求個人的信心。</p>"],["洗禮：信徒浸禮派（洗禮是信的人自己的宣告）","","<p>浸信會、許多靈恩派與多數華人獨立教會認為：2:12「都因信」說明洗禮是信的人自己對信仰的公開宣告；「一同埋葬」「一同復活」的畫面支持全身浸入水中的浸禮，正如「我們藉著洗禮歸入死，和他一同埋葬」（羅 6:4）。所以洗禮應當施於能夠自己表明信心的人。這派的優點是緊貼新約「先信，後受洗」的次序，也讓每一個受洗的人親口說出自己的信。</p><p><strong>難處：</strong>2:11–12 割禮與洗禮的並排是真的，這派需要說明它的意義；實踐上也有兩種危險：一是把洗禮的方式（浸、點、灑）講成得救的條件，論斷別的教會；二是把洗禮只當成「我的宣告」，忘了它首先是神的作為——是神「叫你們與基督一同活過來」（2:13）。<strong>兩派都是福音派、都敬重聖經權威。</strong></p>"],["禁慾：修道傳統（禁食與節制是操練，可以幫助人對付私慾）","","<p>從沙漠教父到本篤會規，修道傳統一直認為禁食、節制、儉樸的生活，是幫助人專心尋求神、對付私慾的操練；主耶穌自己說「你們禁食的時候」（太 6:16），不是「你們若禁食」，可見禁食是門徒生活的一部分。這派的優點是認真對待罪的頑強，也提醒今天過度安逸的教會：屬靈生命需要操練，不是自動長大的。</p><p><strong>難處：</strong>歷史上這條路常常滑出界線：操練變成功德，節制變成等級，中世紀甚至有鞭打自己的團體，以為身體越痛，罪就越輕。2:23 正是對這種方向說話：「自表謙卑，苦待己身」看起來很有智慧，「其實在克制肉體的情慾上是毫無功效」。而且主耶穌講禁食的那一段，重點正是「不叫人看出你禁食來」（太 6:18）——不是為了成績，更不是為了懲罰自己。</p>"],["禁慾：新教的批判（因信稱義，不靠苦修）","","<p>宗教改革從因信稱義出發，批判以苦修、守齋、修道誓願來換取恩典的做法；路德自己在修道院裡苦待己身多年，卻越做越害怕，直到在羅馬書裡看見「義人必因信得生」。這派的優點是把 2:23 讀活了：我們不是靠對付自己的身體來得著神的喜悅，而是因信與基督同死同活（2:12）。</p><p><strong>難處：</strong>它有時矯枉過正，連禁食、靜默、節制這些有益的操練也一起丟掉，以為「因信」就是「不必操練」；結果 3:5 的「治死」與 3:12 的「存……忍耐的心」也被講得很輕。恩典不是叫人不用力，是叫人從一個已經活過來的地方用力——「操練身體，益處還少；惟獨敬虔，凡事都有益處」（提前 4:8），保羅說的是「還少」，不是「沒有」。</p>"],["今天的極端：以自我懲罰證明屬靈","","<p>今天在一些團體與個人身上，還可以看見一種更危險的方向：把長時間禁食、剝奪睡眠、拒絕休息與醫療、責罵自己、懲罰自己，當成「治死肉體」「捨己」「無己」的證明；甚至教導人「你的感受不重要」「你這個人不重要」，或「你有這種念頭，就要懲罰自己」。持這種看法的人，往往是非常認真、非常想討神喜悅的人，這一點不可輕看。</p><p><strong>難處：</strong>這正是歌羅西的錯謬本身——「這都是照人所吩咐、所教導的」（2:22），「苦待己身，其實在克制肉體的情慾上是毫無功效」（2:23）。它把治死的對象從罪換成了身體與情緒，把次序從「先同復活」換成了「先證明自己」，結果不是更像基督，而是更焦慮、更自責、更遠離那一句「如今，那些在基督耶穌裡的就不定罪了」（羅 8:1）。</p>"],["【三】本講義站在哪裡","","<p><strong>洗禮</strong>：兩派並陳，本講義不替各教會決定洗禮的方式與對象。兩派都必須同意的落點：洗禮不是魔法——受了洗不等於得救，沒受洗也不因此失去救恩（這使我們想起十字架上的強盜：「今日你要同我在樂園裡了」，路 23:43）；但洗禮也不是可有可無——它是一個人公開宣告「我已經與基督同死同活」。不用嬰兒洗禮或浸禮論斷其他教會。</p><p><strong>321 的「無己」與 3:5 的「治死」同一邊，與 2:23 的「苦待己身」相反。</strong>本講義在這裡把「無己」定義清楚：<strong>無己是不以自己為中心，把中心還給基督；不是沒有自己，不是「你不重要、你的感受不重要」，不是看輕自己、傷害自己、懲罰自己。</strong>（回指腓立比書立場二：無己不是沒有自己，是不以自己為中心。）<strong>治死是對付罪的行為與私慾（3:5、8），不是對付身體或情緒。</strong>無己的人更能愛惜自己的身體——因為這身體是主的（這使我們想起林前 6:19–20）；保羅說「從來沒有人恨惡自己的身子，總是保養顧惜，正像基督待教會一樣」（弗 5:29）。</p><p>判斷一個操練是「治死」還是「苦待己身」，本講義用三個問題：<strong>一、它是從 3:1 出發的嗎</strong>——是因為我已經與基督一同復活，還是為了證明自己夠屬靈？<strong>二、它對付的是 3:5、8 列出的罪嗎</strong>——還是對付我的身體、睡眠、吃飯、休息、情緒？<strong>三、它的果子是 3:15「存感謝的心」嗎</strong>——還是更多的自責、恐懼與比較？<strong>禁食與節制</strong>仍有價值，但它是尋求神的方法，不是證明屬靈的成績，更不是懲罰自己。</p><p>這就是 321「舊人有己的生命變成新人無己的生命」在歌羅西書的文法：同埋、同復活、同活、同死、同藏、同顯現——<strong>無己不是一個人關起門來把自己磨掉，是「與基督同」：我的死在他的死裡，我的生命「與基督一同藏在神裡面」（3:3）。</strong>一個已經藏好了的生命，不需要靠傷害自己來證明甚麼。</p>"],["【四】這件事該不該影響你的信心","","<p>洗禮的方式不該。嬰兒洗禮派與信徒浸禮派爭的是記號怎樣施行，不是基督的死與復活夠不夠；兩派都同意，「你們從前在過犯……中死了，神赦免了你們一切過犯，便叫你們與基督一同活過來」（2:13）。</p><p><strong>「無己」與「苦待己身」的分別該——因為它保護人。</strong>如果你曾經以為越苦待自己越屬靈，曾經用不吃、不睡、責罵自己來對付罪，請聽 2:23：神說那是「毫無功效」的——不是因為你不夠努力，是因為那從來不是神的方法。神的方法是先告訴你：「你們的生命與基督一同藏在神裡面」（3:3）。<strong>從那個安全的地方，治死才會長出來；也只有從那裡，你才會學會愛惜這個主所買回來的身體。</strong></p>"]],"con":[],"say":"本講義的全卷立場：與基督同死同活是已經發生、因信發生的事；治死在同復活之後（3:1→3:5），對象是罪的行為與私慾，不是身體或情緒。洗禮兩派並陳：不是魔法，也不是可有可無。321「無己」與 3:5「治死」同一邊、與 2:23「苦待己身」相反：無己是不以自己為中心，不是看輕、傷害、懲罰自己；禁食與節制是尋求神的方法，不是屬靈成績。","care":"牧養底線：任何時候都不可以把「治死」「捨己」「無己」講成傷害自己的身體或心靈（紅線三）；不說「越苦越屬靈」「你的感受不重要」「你有這種念頭就要懲罰自己」。席上可能有正在自我傷害、或有飲食困擾經驗的弟兄姊妹，也可能有長期失眠、極度自責的人：這是需要溫柔關懷與專業協助的事，不是「治死得不夠」，也不是信心不夠。不在公開場合追問細節，不要求他立刻「交託就好」，會後單獨關心、陪他，協助他尋求醫師、心理諮商等專業協助；若有立即的危險，先確保安全、陪他連結緊急協助，並且不讓他一個人。不用嬰兒洗禮或浸禮論斷其他教會；也不把「已經死了」講成「所以不會再犯罪」，但命令是寫給已經活過來的人的，不是用來製造焦慮的。"},{"id":"ISS00_5","t":"家與職場——3:18--4:1 與以弗所書的家規有甚麼不同？","r":"3:18--4:1；4:9","ch":[],"why":"五、沿用以弗所書立場三（弗 ISS00_3），本卷補三筆：不可苦待妻子、恐怕兒女失了志氣、僕人段與阿尼西謀。歌羅西書的家規只有九節，比以弗所書短得多，所以最容易被抽出一句單獨講：「作妻子的，當順服」講了，緊接著的「不可苦待她們」卻沒講；「作兒女的，要凡事聽從父母」講了，「恐怕他們失了志氣」卻跳過。僕人段又佔了五節，背後是一個正在回家的逃奴阿尼西謀。這一題講錯，傷的是家裡、職場裡最沒有力量說話的人，必須在開卷講定。","pos":[["【一】經文問的是甚麼","","<p>家與職場的總原則，本講義沿用以弗所書立場三，不重寫：整段家規在「存敬畏基督的心，彼此順服」（弗 5:21）底下；每一組都是雙向的，對上面那一方的要求更重；每一組都有一位更高的主，所以任何人的權柄都不是絕對的；順服絕不包括忍受暴力，遇到家暴先保護安全。歌羅西書這一段放在 3:17 後面：「無論做甚麼，或說話或行事，都要奉主耶穌的名，藉著他感謝父神」（3:17）——家規是 3:17 落在家裡和工作上的樣子。</p><p>本卷要補的是以弗所書沒有、或說得不一樣的三筆。<strong>一</strong>、「你們作丈夫的，要愛你們的妻子，不可苦待她們」（3:19）——原文 μὴ πικραίνεσθε πρὸς αὐτάς，「不要對她們苦毒、不要讓她們的日子變苦」。<strong>二</strong>、「你們作父親的，不要惹兒女的氣，恐怕他們失了志氣」（3:21）——ἵνα μὴ ἀθυμῶσιν，「免得他們心灰意冷」；以弗所書說的是怒氣（弗 6:4），歌羅西書說的是失志。<strong>三</strong>、僕人段（3:22–25）在九節裡佔了四節，主人一節（4:1），比以弗所書更長；而 4:9 告訴我們，送信的隊伍裡有一位「親愛忠心的兄弟阿尼西謀……他也是你們那裡的人」（4:9）。<strong>經文問的是：這三筆今天落在哪裡？家規是單向的權力，還是彼此的保護？</strong></p>"],["夫妻：互補派（夫妻在神面前平等，丈夫的帶領是捨己的帶領）","","<p>認為「這在主裡面是相宜的」（3:18）說明妻子的順服不只是第一世紀的文化安排，而是「在主裡」合宜的回應；丈夫負起帶領的責任，但這帶領的定義由 3:19 與以弗所書的「為教會捨己」來決定：愛、保護、供應，不是發號施令。這派的優點是認真對待經文，並且在歌羅西書裡看見：丈夫的命令不只是一個「要」（要愛），還有一個「不可」（不可苦待）。</p><p><strong>難處：</strong>實踐上，互補派的教會常常有人只讀 3:18，把「頭」講成權力、把順服講成無條件；3:19 的「不可苦待」若沒有講出來，言語的苛刻、冷暴力、經濟控制就被藏在「家庭秩序」底下。這是這一派自己的優秀學者也明確反對的，但講台必須主動把它說出來。</p>"],["夫妻：平等派（彼此順服是原則，3:18 是處境性的應用）","","<p>認為 3:18 是保羅在第一世紀父權家庭結構裡的應用；原則是彼此順服（弗 5:21）、彼此相愛，既然同一段的主僕關係今天不再照字面實行，夫妻的分工也應當隨處境調整，共同決定。這派指出 3:11「在此並不分……為奴的、自主的」，與加拉太書「或男或女，因為你們在基督耶穌裡都成為一了」（加 3:28）都提醒我們：在基督裡，身分的高低已經被重新排列。</p><p><strong>難處：</strong>「這在主裡面是相宜的」（3:18）把妻子的回應放在「主」底下，不容易只說成文化；若處理不慎，容易變成「凡不合我們時代的經文都是處境」。<strong>兩派都是福音派、都敬重聖經權威</strong>（回指以弗所書立場三）；兩派也都同意：丈夫不可苦待妻子。</p>"],["親子：嚴管說（「不打不成器」「不誇獎免得驕傲」）","","<p>華人家庭常有一種很深的教養觀：打是情、罵是愛，不打不成器；孩子做得好不要誇，免得驕傲；常拿別人家的孩子比較，激他上進。持這種看法的父母，多半是真心愛孩子、自己也是這樣被養大的，並且可以引 3:20「你們作兒女的，要凡事聽從父母，因為這是主所喜悅的」（3:20），強調孩子要聽話。</p><p><strong>難處：</strong>同一段緊接著就對父親說：「不要惹兒女的氣，恐怕他們失了志氣」（3:21）。ἐρεθίζετε（惹氣）是一再刺激、挑撥；ἀθυμῶσιν（失志）是心裡的火滅了。一個常被比較、常被罵、從來得不到肯定的孩子，<strong>最後不是生氣，是放棄</strong>——放棄努力、放棄說話、有時也放棄自己。3:21 是寫給我們這種文化的。而且 3:20 的「凡事聽從」是對在家中受養育的孩子說的，成年兒女孝敬父母，但婚姻、信仰、呼召在主面前自己負責（回指以弗所書立場三）。</p>"],["主僕：「聖經接受奴隸制」說","","<p>認為保羅既然吩咐「你們作僕人的，要凡事聽從你們肉身的主人」（3:22），又沒有下令廢除奴隸制，就等於接受了這個制度；十九世紀美國南方的奴隸主正是這樣用這段經文的，今天也有批評者據此說聖經不道德。這個讀法誠實地面對了一件事實：保羅沒有在信裡要求主人立刻釋放所有奴隸。</p><p><strong>難處：</strong>它忽略了這段話是在甚麼信封裡送出去的。對奴隸，保羅說「你們所事奉的乃是主基督」（3:24）——他們不是物件，是有尊嚴、直接向主負責的人；對主人，保羅說「要公公平平地待僕人，因為知道你們也有一位主在天上」（4:1）——「公公平平」原文 τὸ δίκαιον καὶ τὴν ἰσότητα，「公義與平等」，對第一世紀的主人來說是很重的一句話。而同一個郵包裡，還有一封給腓利門的信，請他把逃跑的奴隸阿尼西謀收回來，「不再是奴僕，乃是高過奴僕，是親愛的兄弟」（門 1:16）。後來廢奴運動的基督徒，正是從這些經文得著動力的。</p>"],["主僕：「與今天無關」說","","<p>認為 3:22–4:1 是寫給古代奴隸制的，今天沒有奴隸，所以這一段可以跳過，或只當作歷史資料。這派的心志是不想讓這段經文再被用來替任何壓迫辯護，這份敏感是好的。</p><p><strong>難處：</strong>今天的僱傭關係雖然不是奴隸制，但上下權力不對等的處境到處都是；「無論做甚麼，都要從心裡做，像是給主做的，不是給人做的」（3:23）正是職場基督徒最需要的一節，「那行不義的必受不義的報應；主並不偏待人」（3:25）也同時對兩方說話。跳過這一段，職場上的基督徒就失去了一個最實際的提醒：每一份工作，頭上都有一位主。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：沿用以弗所書立場三——家規在彼此順服底下，每一組都是雙向的，對上面那一方的要求更重，每一組都有一位更高的主；順服絕不包括忍受暴力，遇到暴力先保護安全。本卷補三筆。</strong></p><p><strong>一、3:19「不可苦待她們」</strong>：丈夫的命令不只是「要愛」，還有一個「不可」——<strong>言語的苛刻、冷暴力、長期的冷落與羞辱，也是「苦待」</strong>。講 3:18 一定讀到 3:19（紅線四）。<strong>二、3:21「恐怕他們失了志氣」</strong>：失志的孩子是華人家庭最常見、也最常被忽略的傷；父母的責任不只是管教，還有肯定、鼓勵、讓孩子知道自己被愛。<strong>三、3:22–4:1 與阿尼西謀</strong>：一個逃跑的奴隸，正要回到他主人腓利門那裡；腓利門就在歌羅西教會（〔門〕門 1–2、10–16）。保羅對奴隸說「像是給主做的」（3:23），同時對主人說「你們也有一位主在天上」（4:1），又另寫一封信請腓利門把阿尼西謀當作「親愛的兄弟」接回去——<strong>這三封信是同一天送到的</strong>。<strong>福音沒有一夕之間推翻奴隸制，但它把主人和奴隸放在同一張主的桌子上；這就是後來廢奴的種子。</strong></p><p><strong>職場</strong>：員工「從心裡做，像是給主做的」（3:23），雇主「公公平平地待」人（4:1）；<strong>這不包括忍受違法、霸凌、性騷擾或被要求作假。</strong>3:23 可與職場得勝的事工銜接。321 說「由內而外五重的改變」：3:1 的位置、3:2 的觀念、3:5–10 的生命、3:12–17 的生活，最後才落到 3:18–4:1 的關係——<strong>思念上面的事的人，最會在家裡溫柔。</strong></p>"],["【四】這件事該不該影響你的信心","","<p>不該。<strong>各派都同意：基督是家庭與職場的主；丈夫不可苦待妻子，父親不可叫兒女失志，主人頭上也有主。</strong>互補派與平等派爭的是家庭分工的形式，不是丈夫可不可以讓妻子的日子變苦——兩派都說不可以。</p><p>如果你曾經被這段經文傷過——被要求忍受冷暴力、從小被罵到失了志氣、在職場被以「順服」為名欺壓——請知道：傷害你的不是這段經文，是有人只讀了一半。這段經文從頭到尾在保護比較沒有力量的那一方。也請記得阿尼西謀：一個在當時社會裡最沒有地位的人，在這封信裡被稱為「親愛忠心的兄弟」（4:9）。<strong>在主的桌子上，沒有人是多餘的。</strong></p>"]],"con":[],"say":"本講義的全卷立場：沿用以弗所書立場三——家規在彼此順服底下，每一組都是雙向的，順服絕不包括忍受暴力，遇到暴力先保護安全。本卷補三筆：3:19「不可苦待她們」，言語的苛刻與冷暴力也算；3:21「恐怕他們失了志氣」，不要叫孩子心灰意冷；3:22–4:1 主人頭上也有主，阿尼西謀在送信的隊伍裡——福音把主人和奴隸放在同一張主的桌子上。","care":"牧養底線：講 3:18 一定讀到 3:19，講 3:20 一定讀到 3:21（紅線四）。不對受暴或長期被冷暴力對待的人說「你要更順服」「為了孩子忍一忍」「你要饒恕他」——先安全，再談其他；不追問細節，不要求立刻原諒或和好，會後單獨關心，必要時協助報警、尋求專業協助與庇護（饒恕與受害者回指哥林多後書立場四）。席上會有從小被打罵、被比較、至今仍覺得自己不夠好的成年人，講 3:21 時不要只對父母說話，也要讓他們聽見：那不是你的錯。也會有正在用嚴厲方式教養孩子、聽了會內疚的父母，不羞辱他們，陪他們學習肯定孩子。職場的弟兄姊妹若被霸凌、被要求作假，不用 3:22 叫他無條件忍受，也不用 4:1 煽動對立——講台要同時對兩方說話。"},{"id":"ISS00_6","t":"作者、寫作地點與年代——歌羅西書是誰寫的？在哪裡寫的？","r":"1:1；4:3；4:10；4:18","ch":[],"why":"全卷通用：作者與寫作地點。歌羅西書自稱是保羅與提摩太所寫（1:1），信末又說「我保羅親筆問你們安」（4:18）；但近兩百年來，有學者因為它的長句、用字、基督論與以弗所書的相似，主張是保羅的門生託名寫成的。信中三次提到捆鎖（4:3、10、18），保羅卻沒有說自己在哪裡坐監。這些問題不改變福音，卻會改變讀者怎樣聽「你們要記念我的捆鎖」這些第一人稱的話，也決定了全卷怎樣把歌羅西書與使徒行傳、以弗所書、腓利門書放在一起讀，必須在開卷交代清楚。","pos":[["【一】經文問的是甚麼","","<p>信一開頭說：「奉神旨意，作基督耶穌使徒的保羅和兄弟提摩太」（1:1）；信中說自己在捆鎖中：「求神給我們開傳道的門，能以講基督的奧祕（我為此被捆鎖）」（4:3），又提到「與我一同坐監的亞里達古」（4:10）；信末說「我－保羅親筆問你們安。你們要記念我的捆鎖」（4:18）——前面的部分很可能是書記筆錄，最後一句是保羅自己拿起筆寫的。</p><p>但有兩個問題。<strong>一、作者</strong>：歌羅西書的句子比保羅公認的書信長，有些用字只在這裡出現，基督論（1:15–20）與教會論（基督是身體的頭）又比早期書信更寬；它與以弗所書約三分之一的內容平行（見 ISS00_7）。<strong>二、寫作地點</strong>：保羅在新約裡至少有三段可以考慮的監禁——羅馬、該撒利亞，以及推測中的以弗所。<strong>經文問的是：這封信是誰寫的？寫於何時何地？</strong></p>"],["作者：保羅所寫說（與提摩太同署名，可能由書記筆錄）","","<p>認為歌羅西書是保羅在監獄中寫的，這是教會兩千年的傳統看法；二世紀的教父已經引用它，馬吉安的保羅書信集與穆拉多利經目都收了它。信中有大量具體的個人細節：以巴弗（1:7；4:12–13）、推基古與阿尼西謀（4:7–9）、亞里達古、馬可、耶數、路加、底馬（4:10–14）、寧法（4:15）、亞基布（4:17）。風格的不同可以用題材與書記來解釋：一首基督之歌（1:15–20）與一段反駁錯謬的話，本來就和回答具體問題的書信不同。</p><p><strong>難處：</strong>它需要正面處理用字、長句與神學重點的差異，也需要說明與以弗所書的高度相似；不能只用「傳統如此」帶過。這些差異都不是不能解釋，但需要一一面對，本講義在相關章節照實交代。</p>"],["作者：提摩太代筆說（保羅授意、提摩太起草，保羅親筆收尾）","","<p>認為 1:1 同署名的提摩太，可能是實際起草這封信的人；保羅在監中授意、審閱，最後親筆寫下 4:18。鄧恩（James Dunn）等學者採取接近的看法：這樣既可以解釋風格的差異，又保住信中真實的個人細節與保羅的權威。這派的優點是把古代書信的寫作方式考慮進來——當時的書信常常由書記或同工起草，作者再確認。</p><p><strong>難處：</strong>它是一個合理的推測，卻沒有直接的證據；信中自稱「我」的地方（1:23–2:5；4:7–18）讀起來都是保羅自己的聲音。而且若要用「代筆」解釋差異，就要說明為甚麼在其他同署名提摩太的書信（例如腓立比書、帖撒羅尼迦前後書）沒有同樣的差異。</p>"],["作者：門徒託名說（保羅過世後，他的門生以他的名義寫成）","","<p>十九世紀以來，不少批判學者認為歌羅西書是保羅死後，他的門生把老師的思想發展、整理，以保羅的名義寫給下一代教會的；理由是風格、用字、更「發展」的基督論與教會論，以及「已經」與基督一同復活（2:12；3:1）比羅馬書的口氣更強。這派的優點是認真看待文本上的差異。</p><p><strong>難處：</strong>歌羅西書的問安名單幾乎和腓利門書一模一樣（〔門〕門 23–24 也有以巴弗、馬可、亞里達古、底馬、路加），而且腓利門書是學界公認保羅親筆的書信；託名者必須照著腓利門書複製這份名單，還加上新的細節（4:9「他也是你們那裡的人」、4:17 對亞基布的話）。4:18「我－保羅親筆問你們安」若是虛構，道德上的張力很大。而且「發展」與否的判斷，常常預設了學者自己對保羅思想應該長甚麼樣子的設定。</p>"],["寫作地點：羅馬監獄說","","<p>傳統看法：保羅在羅馬受軟禁的兩年，「在自己所租的房子裡住了足足兩年。凡來見他的人，他全都接待」（〔背景〕徒 28:30），所以同工可以來去，他也還能請人為他禱告「開傳道的門」（4:3）。年代約在主後 60–62 年，與以弗所書、腓利門書同時。路加與亞里達古都曾陪保羅往羅馬（〔背景〕徒 27:2）。</p><p><strong>難處：</strong>羅馬離歌羅西很遠，一個逃跑的奴隸跑到羅馬、又被差回來，路程很長；腓利門書裡保羅請腓利門「給我預備住處」（門 1:22），像是打算不久就去探訪，從羅馬說起來比較遠。這些不是不能解釋（逃奴本來就常往大城躲藏），但需要說明。</p>"],["寫作地點：以弗所監獄說","","<p>認為保羅在以弗所三年期間曾經被囚（根據林後 1:8–10 與林後 11:23「下監更多」的記載），歌羅西書寫於以弗所，年代約在主後 54–55 年。以弗所離歌羅西只有約一百多公里，以巴弗、阿尼西謀往返都容易，保羅預備前去探訪也很自然。這派的優點是解釋了距離與探訪計畫。</p><p><strong>難處：</strong>新約沒有任何一處明文記載保羅在以弗所坐監；使徒行傳第 19 章講以弗所的兩年，也沒有提到監禁。而且路加是否在以弗所與保羅同在，也不清楚。還有學者提出該撒利亞說（〔背景〕徒 23–26 章的兩年），但同樣沒有信中的明文支持。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的判斷：歌羅西書是保羅所寫（與提摩太同署名，或由同工筆錄，4:18 是保羅親筆），寫於羅馬監獄，約主後 60–62 年，與以弗所書、腓利門書由同一趟送信人帶去。</strong>以弗所監獄說列為可能的另一說，在第 4 章交代；這個判斷不影響解經。</p><p>理由有三：一、信中的自我陳述與個人細節（1:1、23；4:3、7–18），若當作虛構，比當作真實難解釋得多；二、與腓利門書幾乎相同的名單，最自然的解釋是兩封信同時寫成；三、初期教會一致把它歸給保羅。門徒託名說的觀察——風格、用字、神學重點——本講義照實陳列，不迴避；但不採它的結論。</p><p>各章碰到作者與寫作地點的問題，一句帶過，回指這裡；保羅在以弗所的事工見本系列使徒行傳講義第 19 章，羅馬的監禁見使徒行傳講義第 28 章，同一段監禁的另外兩封信，見以弗所書講義與腓立比書講義。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。這封信是保羅口述還是提摩太起草、寫於羅馬還是以弗所，爭的是這封信怎樣寫成、怎樣送到，不是這封信說了甚麼。不論在哪一座監獄，歌羅西人聽到的都是同一句話：「你們在他裡面也得了豐盛」（2:10）。</p><p>這一題還有一層溫柔：寫信的人手上綁著鎖鍊。他最後親手寫下的一句不是抱怨，而是一個請求和一個祝福：「你們要記念我的捆鎖。願恩惠常與你們同在」（4:18）。<strong>一封從監獄寄出、由一位逃奴陪同送到的信，今天也送到了你手上。</strong></p>"]],"con":[],"say":"本講義的判斷：歌羅西書是保羅所寫（與提摩太同署名，或由同工筆錄，4:18 是保羅親筆），寫於羅馬監獄，約主後 60–62 年，與以弗所書、腓利門書同時送出；以弗所監獄說列為可能的另一說。門徒託名說的觀察照實陳列，但不採它的結論。這個判斷不影響解經。","care":"這一題容易在查經班裡變成考據課，讓不熟悉學術的弟兄姊妹覺得自己讀不懂聖經，也可能讓剛接觸「有學者說不是保羅寫的」的年輕人突然不安。講台上一兩句帶過就好，不要把學者的名字當成炫耀的資本；遇到真心被這些問題困擾的人，會後單獨陪他讀，先肯定他願意誠實發問，再陪他看信中那些真實的名字與細節。也可以帶會眾留意 4:18：寫信的人在坐監——教會裡正在受限制、病著、困在家裡，覺得自己不能再事奉的人，需要聽見這一點。"},{"id":"ISS00_7","t":"歌羅西書、以弗所書與腓利門書——三封信、同一位送信人，是甚麼關係？","r":"4:7--9；4:16--17","ch":[],"why":"全卷通用：三封同一天送到的信。歌羅西書與以弗所書由同一位送信人推基古帶去，交代送信人的那兩節在和合本裡幾乎一字不差；同行的阿尼西謀，又正是腓利門書的主角。4:16 還提到一封「從老底嘉來的書信」，至今沒有人確定是哪一封。這三封信的關係決定了全卷許多平行經文怎樣讀，也決定了第 4 章的名單與家規怎樣講；本系列以弗所書講義已經詳細處理了以弗所書與歌羅西書的關係，本卷要補的是腓利門書與老底嘉的書信，必須在開卷交代清楚。","pos":[["【一】經文問的是甚麼","","<p>4:7–9 說：「有我親愛的兄弟推基古要將我一切的事都告訴你們。他是忠心的執事，和我一同作主的僕人。我特意打發他到你們那裡去，好叫你們知道我們的光景，又叫他安慰你們的心。我又打發一位親愛忠心的兄弟阿尼西謀同去」（4:7–9）。以弗所書幾乎用同樣的話交代推基古（弗 6:21–22）。腓利門書則是保羅為阿尼西謀寫給主人腓利門的私信，信裡的問安名單——以巴弗、馬可、亞里達古、底馬、路加——和歌羅西書第 4 章幾乎一樣，收信人裡還有「與我們同當兵的亞基布」（門 1:2），正是西 4:17 那一位。</p><p>4:16 又說：「你們念了這書信，便交給老底嘉的教會，叫他們也念；你們也要念從老底嘉來的書信」（4:16）。<strong>經文問的是：這三封信是甚麼關係？「從老底嘉來的書信」是哪一封？讀歌羅西書時，要怎樣對照另外兩封？</strong></p>"],["同時寄出說（三封信由同一趟送信人帶去）","","<p>認為保羅在同一段監禁中，同時寫了三封信：給歌羅西教會的歌羅西書、給亞細亞眾教會傳閱的以弗所書、給腓利門個人的腓利門書；推基古帶著三封信、帶著阿尼西謀一同上路。這派最自然地解釋了三件事：推基古那兩節的逐字相同、兩份幾乎相同的問安名單、以及亞基布同時出現在兩封信裡。它也讓讀者看見保羅怎樣作牧者：同一趟路，一封給一間教會、一封給眾教會、一封給一個家。</p><p><strong>難處：</strong>這個說法建立在三封信都寫於同一段監禁的判斷上（見 ISS00_6）；若以弗所書是後人仿作（見下一說），三封信同時寄出的畫面就要修改。而且以弗所書沒有提到阿尼西謀，需要說明——最自然的解釋是個人的事放在寫給當地教會與當事人的信裡。</p>"],["後人仿作說（以弗所書照著歌羅西書寫成，與腓利門書無關）","","<p>認為以弗所書是保羅的門生拿著歌羅西書作範本，擴充、重組而成；弗 6:21–22 照抄西 4:7–8，正是仿作者借用真實書信細節的痕跡。這派與 ISS00_6 的門徒託名說是同一套論證，優點是認真解釋了兩封信在字句上的高度重疊。本系列以弗所書講義已經陳列這一說（弗 ISS00_7），本卷不重寫。</p><p><strong>難處：</strong>兩封信相近的段落，很少是成段照抄，多半是相同的字詞以不同的次序、在不同的上下文中出現，比較像同一個人的口頭習慣。而且若歌羅西書本身也被視為託名，那它與腓利門書幾乎相同的名單就更難解釋——腓利門書是公認保羅親筆的。所以這一說在歌羅西書這一邊，比在以弗所書那一邊更難成立。</p>"],["「從老底嘉來的書信」：以弗所書說","","<p>認為 4:16 那封「從老底嘉來的書信」，就是以弗所書——一封在亞細亞眾教會傳閱的信，傳到老底嘉，再從老底嘉傳到歌羅西。二世紀的馬吉安稱以弗所書為「致老底嘉人書」；以弗所書 1:1 的「在以弗所」在最早的幾份抄本中沒有（見弗 ISS00_6）。這派把兩封信、兩間教會、同一位送信人連成一條路線，也說明了保羅為甚麼要兩間教會交換讀信。</p><p><strong>難處：</strong>4:16 說的是「從老底嘉來的」，不一定是「寫給老底嘉的」，也不一定是傳閱信；若推基古同時帶著以弗所書經過，為甚麼要歌羅西人等它從老底嘉傳過來？這可以用送信的路線解釋，但仍是推測。</p>"],["「從老底嘉來的書信」：失傳說與其他推測","","<p>認為那是保羅寫給老底嘉教會、後來失傳的一封信；新約裡保羅提到的書信不一定都保存下來（這使我們想起林前 5:9 提到的「我先前寫信給你們」）。也有學者（如古斯匹 Goodspeed、諾克斯 Knox）推測那就是腓利門書，腓利門可能住在老底嘉。後來出現過一封《老底嘉書》，是拼湊保羅書信字句的後期作品，古代教會已經不把它當作正典。</p><p><strong>難處：</strong>失傳說無法證明，也無法否證；腓利門書說要說明為甚麼 4:9 說阿尼西謀「是你們那裡的人」——這比較像腓利門一家在歌羅西。而後期的《老底嘉書》正好提醒我們：教會沒有把每一份冠上保羅之名的文件都收進正典，而是小心地分辨。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：歌羅西書、以弗所書、腓利門書是保羅在同一段監禁中寫的，由推基古與阿尼西謀同一趟帶去；歌羅西書寫給一間面對「基督＋」誘惑的教會，以弗所書寫給亞細亞眾教會傳閱，腓利門書寫給一個家。「從老底嘉來的書信」各說並陳，以弗所書說較可能，但不作定論。</strong></p><p>一個簡單的記法：<strong>歌羅西書的重心是「基督是教會的頭」，以弗所書的重心是「教會是基督的身體」，腓利門書是這個身體在一張飯桌上的樣子。</strong>讀歌羅西書遇到平行經文，凡以弗所書已詳講的，本卷只講歌羅西書多出來的那一筆，不重講——例如家規，本卷只補 3:19、3:21 與僕人段（見 ISS00_5）。本系列尚無腓利門書講義，引用時寫「〔門〕」與出處。</p><p>這三封信也是 321「235」最真實的一張照片：一位被囚的屬靈父親、一群屬靈同伴、一個在捆鎖中「所生的兒子」（〔門〕門 10），一封為教會、一封為眾教會、一封為一個人。<strong>同一個福音，從宇宙的頭講到一個逃奴的回家。</strong></p>"],["【四】這件事該不該影響你的信心","","<p>不該——反過來說，三封信放在一起讀，正好讓我們看見福音有多寬、又有多近。歌羅西書說「萬有也靠他而立」（1:17），腓利門書卻在為一個奴隸求情；同一位基督，管著宇宙，也管著一個家裡的饒恕。</p><p>4:16 的交換讀信也是一種提醒：教會彼此需要。歌羅西人要念老底嘉的信，老底嘉人要念歌羅西的信——沒有一間教會可以只讀寫給自己的那一封。<strong>推基古帶著三封信上路，也帶著三種安慰：給教會的、給眾教會的、給一個要回家的人的。</strong></p>"]],"con":[],"say":"本講義的立場：歌羅西書、以弗所書、腓利門書是保羅在同一段監禁中寫的，由推基古與阿尼西謀同一趟帶去；歌羅西書的重心是「基督是教會的頭」，以弗所書是「教會是基督的身體」，腓利門書是這身體在一個家裡的樣子。凡以弗所書已詳講的，本卷只講多出來的那一筆；「從老底嘉來的書信」各說並陳，不作定論。","care":"這一題容易讓信徒以為「聖經是互相抄來抄去的」而不安，或讓查經變成三欄對照的文字遊戲；講台上不需要展開學術爭論，只要讓會眾看見同一位牧者怎樣對不同的人說話。也要想到會眾裡那些覺得自己「只是送信的」「只是幫忙的」、看不見自己事奉價值的人——推基古被稱為「親愛的兄弟」「忠心的執事」；也要想到那些有過不光彩過去、怕回到從前關係裡去的人——阿尼西謀被差回去時，手上帶著一封替他求情的信。不要用這一題製造「哪一封信比較深」的比較。"},{"id":"ISS00_8","t":"歌羅西、老底嘉、希拉坡里——呂克斯河谷的三座城，三間教會是甚麼關係？","r":"2:1；4:13--16","ch":[],"why":"全卷通用：一個河谷裡的三間教會。歌羅西書提到老底嘉與希拉坡里（2:1；4:13–16），以巴弗為三城的弟兄多多勞苦，保羅又要兩間教會交換讀信。三十多年後，老底嘉教會出現在啟示錄 3:14–22，被說是「不冷也不熱」。講台上常把這兩段連成一條「教會衰退」的故事，甚至用來恐嚇會眾；也常把「溫水」講成靈性的溫度而忽略當地的地理。河谷的背景會影響第 2 章與第 4 章怎樣讀，也會影響我們怎樣講一間教會的未來，必須在開卷交代清楚。","pos":[["【一】經文問的是甚麼","","<p>保羅說他為「老底嘉人，並一切沒有與我親自見面的人」（2:1）盡心竭力；以巴弗「為你們和老底嘉並希拉坡里的弟兄多多地勞苦」（4:13）；他還請歌羅西人「問老底嘉的弟兄和寧法，並她家裡的教會安」（4:15）。這三座城都在亞細亞省的呂克斯河谷，彼此相距不過十幾公里：老底嘉是富裕的商業與銀行之城，有醫學校、出產眼藥，以黑羊毛紡織聞名；希拉坡里以溫泉與神廟著稱；歌羅西曾經是大城，到第一世紀已經是一座逐漸沒落的小城。史家塔西佗記載，老底嘉約在主後 60 年遭大地震，城裡的人不靠羅馬資助自己重建；歌羅西此後更加衰微，遺址長期以來是一座未經大規模發掘的土丘。</p><p>三十多年後，老底嘉教會出現在啟示錄：「我知道你的行為，你也不冷也不熱」（啟 3:15），「你說：我是富足，已經發了財，一樣都不缺」（啟 3:17）。<strong>經文問的是：這個河谷的背景，怎樣幫助我們讀歌羅西書？啟示錄的老底嘉，和歌羅西書的老底嘉有甚麼關係？</strong></p>"],["衰退說（從「交換讀信」到「不冷也不熱」，一間教會的下坡）","","<p>認為歌羅西書與啟示錄 3 章合起來，是一間教會三十年的下坡：保羅時代的老底嘉還在聽使徒的信、與鄰近教會彼此代禱，到了約翰的時代，已經富足自滿、不冷不熱；所以保羅在歌羅西書裡的警告，老底嘉後來沒有聽進去。這派的優點是嚴肅看待教會可能失去起初的熱心，也讓 4:17「務要謹慎」有了真實的重量。</p><p><strong>難處：</strong>這中間隔了三十多年、一整代人，經文沒有告訴我們老底嘉是怎樣變的，也沒有說和歌羅西的錯謬有任何因果關係；硬把兩段接成一條線，是在替經文補一個它沒有寫的故事。而且啟示錄給老底嘉的話，結尾不是判決，是邀請：「凡我所疼愛的，我就責備管教他；所以你要發熱心，也要悔改」（啟 3:19）。</p>"],["地理背景說（「不冷也不熱」是無用，不是靈性溫度）","","<p>認為啟示錄的「冷」「熱」要照河谷的地理來讀：希拉坡里的溫泉是熱的，可以治病；歌羅西一帶據說有清涼的水，可以解渴；老底嘉的水由引水道從遠處引來，到城裡已經溫溫的、帶著礦物質，喝了想吐。所以「不冷也不熱」不是說「冷淡比溫溫好」，而是說：既不能醫治、也不能解渴——<strong>沒有用</strong>。這派的優點是讓經文回到它的城市裡，也避免了「寧可冷淡，不要溫溫」這種奇怪的講法。</p><p><strong>難處：</strong>這個讀法很受歡迎，但考古細節仍有爭論——歌羅西的「冷水」證據並不充分，老底嘉引水的水質也有不同的研究；若講得太確定，就把一個可能的背景講成了事實。所以本講義用這一說時，一律說「學者觀察到」。</p>"],["持續說（河谷的教會沒有消失，啟示錄的呼召有了回應）","","<p>認為不要只把老底嘉讀成失敗的例子：啟示錄之後，河谷的教會仍然存在；第四世紀還有一次在老底嘉召開的地方教會會議，希拉坡里在後來的世代也有基督徒的紀念與聚會。主對老底嘉說「看哪，我站在門外叩門，若有聽見我聲音就開門的，我要進到他那裡去」（啟 3:20），這個邀請在歷史上有人回應。這派的優點是讓讀者看見神對一間教會的耐心，而不是只看見警告。</p><p><strong>難處：</strong>後來的教會歷史並不能證明每一個時代的教會都是健康的；一間教會仍然存在，不等於它仍然把基督放在首位。這一說若講得太樂觀，又會減輕啟示錄真實的責備。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：呂克斯河谷是一個多神、多宗教、富裕又不安定的地方；歌羅西、老底嘉、希拉坡里三間教會由以巴弗的勞苦連在一起，彼此代禱、交換讀信。啟示錄 3:14–22 這使我們想起老底嘉後來的光景，但本講義不把兩段硬接成一條因果的線，也不用它來恐嚇會眾。</strong>地理背景說用時一律說「學者觀察到」。</p><p>兩段經文放在一起，最值得講的是兩種「滿」：歌羅西書說「你們在他裡面也得了豐盛」（2:10）——在基督裡被充滿；啟示錄的老底嘉說「我是富足，已經發了財，一樣都不缺」（啟 3:17）——在自己裡面覺得滿。<strong>同一個河谷，一種滿是基督給的，一種滿是自己以為的；前一種讓人感謝，後一種讓人把門關上。</strong></p><p>這也是 321「235」最地上的一張圖：以巴弗不只為自己的教會禱告，還為鄰城的弟兄「多多地勞苦」（4:13）；寧法在自己家裡開放一間教會（4:15）。各章碰到河谷三城的背景，一句帶過，回指這裡。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。三城的地理、地震的年份、引水道的水溫，都是幫助我們讀經的背景，不是信仰的根基；考古的細節會一直更新，信心建立在那位「萬有也靠他而立」（1:17）的基督身上。</p><p>但這個河谷的故事可以溫柔地提醒我們：一間今天信心堅固的教會，三十年後會怎樣？答案不在於恐懼，而在於每一代都重新「接受了主基督耶穌，就當遵他而行」（2:6）。<strong>站在門外叩門的，是同一位主；他沒有放棄老底嘉，也不會放棄你的教會。</strong></p>"]],"con":[],"say":"本講義的立場：呂克斯河谷三城——歌羅西、老底嘉、希拉坡里——由以巴弗的勞苦與交換讀信連在一起；啟示錄 3:14–22 這使我們想起老底嘉後來的光景，但不把兩段硬接成因果，也不用來恐嚇會眾；「不冷也不熱」的地理背景說用時一律說「學者觀察到」。兩段放在一起，講的是兩種「滿」：基督給的，與自己以為的。","care":"這一題最容易被講成恐嚇：「你們教會再這樣下去就是老底嘉」「你不熱心，主就要把你吐出去」——席上會有正處在信仰低谷、疲憊、憂鬱或長期無望感裡的人，他們聽到的不是警醒，是被丟棄。對他們先講啟 3:20 的叩門與 3:19 的「凡我所疼愛的」，不要只講 3:16；若伴隨長期的無望感，會後單獨關心，必要時協助尋求專業協助。也不要把小城、沒落、教會人少講成失敗——歌羅西是一座正在沒落的小城，保羅卻寫給它一首宇宙的詩。講河谷的地理時，不讓它變成考古知識比賽。"},{"id":"ISS00_9","t":"這些爭議該不該影響一個人的信心？","r":"2:6--7；3:15--17","ch":[],"why":"全卷通用：爭議與信心。這一卷的議題頁會陳列許多爭論：首生、歌羅西異端、安息日、洗禮、禁慾、家規、作者、寫作地點、老底嘉的書信。對有些人，這是讀經的樂趣；對另一些人，這是信心的試探——「連這個都有爭議，還有甚麼是確定的？」歌羅西書本身又警告「免得有人用花言巧語迷惑你們」（2:4），叫人在真理上站穩。甚麼不能讓、甚麼可以彼此寬容、知道了這麼多爭議以後信心該建立在哪裡，必須在開卷講定。","pos":[["【一】經文問的是甚麼","","<p>歌羅西書同時給了兩幅圖。一幅是站穩：「你們既然接受了主基督耶穌，就當遵他而行，在他裡面生根建造，信心堅固，正如你們所領的教訓，感謝的心也更增長了」（2:6–7）。另一幅是彼此包容：「倘若這人與那人有嫌隙，總要彼此包容，彼此饒恕」（3:13），「又要叫基督的平安在你們心裡作主；你們也為此蒙召，歸為一體；且要存感謝的心」（3:15）。站穩不是甚麼都要爭；包容也不是甚麼都可以。</p><p>3:15 的「作主」原文 βραβευέτω，是運動場上的裁判——在心裡有不同聲音拉扯的時候，讓基督的平安來判定。<strong>經文問的是：甚麼是「生根」的那一部分，不能讓？甚麼是可以有不同看法的事，要彼此包容？一個人知道了這麼多爭議以後，信心該建立在哪裡？</strong></p>"],["完美答案說（每一題都必須有唯一的標準答案，信心才站得住）","","<p>認為一位真正信靠聖經的人，在每一個議題上都應當有清楚而唯一的答案；承認有爭議，就是承認聖經不清楚，信心就會動搖。所以教會應當在安息日、洗禮、家庭分工、作者等每一題上都立好標準答案，要信徒照著相信，才不會被「花言巧語」迷惑（2:4）。這派的心志是保護信徒，這份心是好的。</p><p><strong>難處：</strong>它很容易自己變成歌羅西的錯謬——「基督＋我們這一套答案」。2:16 說的正是：不要讓人在飲食、節期、安息日的事上論斷你們；把每一題都升格成信仰的根基，結果是合一只剩下和自己意見完全相同的人。保羅在某些事上也說「只是各人心裡要意見堅定」（羅 14:5）。而且信心若建立在每一題都答對上，任何一題的答案一動，整個信仰就跟著倒。</p>"],["爭議即不可靠說（既然甚麼都有爭論，信仰就只剩個人意見）","","<p>認為既然學者們連首生、安息日、洗禮、作者都意見分歧，那就表示聖經沒有確定的教導，每個人照自己的感覺讀就好；合一就是不談真理、彼此不要說對錯。這派誠實地面對了爭議的存在，也提醒教會不要假裝一切都很簡單、不要用自己的答案壓人。</p><p><strong>難處：</strong>它把爭議的「細節」與爭議的「範圍」混在一起了。嬰兒洗禮派與信徒浸禮派爭的是記號怎樣施行，卻沒有人否認我們「與他一同埋葬」「與他一同復活」（2:12）；安息日派與主日派爭的是哪一天，卻沒有人否認「那形體卻是基督」（2:17）。而且歌羅西書明說有人要用「理學和虛空的妄言」把人「擄去」（2:8）——真理不是可有可無的；首生的問題也不是邊緣的問題（見 ISS00_2）。</p>"],["中心與邊緣說（根不能讓，其餘的事可以有不同看法）","","<p>認為歌羅西書本身就劃出了一條線。<strong>不能讓的</strong>，是這封信的「根」：基督是那不能看見之神的像，萬有是靠他造、為他造、靠他立的（1:15–17）；「神本性一切的豐盛都有形有體地居住在基督裡面」（2:9）；他藉著十字架的血使萬有與神和好（1:20）；「我們在愛子裡得蒙救贖，罪過得以赦免」（1:14）；我們在他裡面已經得了豐盛（2:10），已經與他同死同活（2:12–13；3:1–3）。<strong>可以有不同看法的</strong>，是在這中心之外的解釋、歷史與實踐的問題：歌羅西異端的名字、守哪一天、洗禮的方式與對象、家庭的分工形式、作者與寫作地點。</p><p><strong>難處：</strong>中心與邊緣的界線本身有時也會被爭論——有人會說安息日或洗禮方式就是中心。所以劃線的時候，要以經文自己最清楚、最反覆強調的事為中心，而不是以某一個宗派最在意的事為中心；並且要記得，這條線不是用來把人分成兩邊，而是用來讓人知道：在哪些事上可以安心地彼此包容。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：採中心與邊緣的讀法，以歌羅西書的「根」為中心——基督在凡事上居首位（1:18）、神本性一切的豐盛在他裡面（2:9）、我們在他裡面已經滿了（2:10）、與他同死同活（2:12–13；3:1–3）。</strong>這幾件事各派都同意，兩千年沒有被任何學術爭論動搖；ISS00_2 的首生與基督的神性屬於這個中心。</p><p>其餘的事，本講義照鐵律三：先陳列各家、說出各自的難處、再給判斷，並且把判斷的理由講出來；講台與教學場上一句帶過，指向議題頁與 ISS00_1–5。2:20–21 和合本合併節、2:23 難譯的原文、1:8「聖靈」的「聖」字是和合本補的，都照實交代，不講成懷疑。爭議的時候，讓 3:15 的裁判作主：讓基督的平安在心裡作判定，而不是讓勝負作判定。</p><p>全卷的地勢最高點是 3:11，引它時一律引全句：「在此並不分希臘人、猶太人，受割禮的、未受割禮的，化外人、西古提人，為奴的、自主的，惟有基督是包括一切，又住在各人之內」（3:11）。爭議可以留在議題頁裡，這一節要帶回家。321 說「讓耶穌得著一切的榮耀」，歌羅西書說：「無論做甚麼，或說話或行事，都要奉主耶穌的名，藉著他感謝父神」（3:17）——連我們怎樣面對爭議，也包括在內。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。信心不是建立在「我對每一題都有答案」上，而是建立在那一位「救了我們脫離黑暗的權勢，把我們遷到他愛子的國裡」（1:13）的神身上。學者的爭論會一直持續下去；但你可以在不知道歌羅西異端叫甚麼名字、不確定這封信寫於羅馬還是以弗所的情況下，完全確定自己的生命「與基督一同藏在神裡面」（3:3）。</p><p>這一卷要讀完的人，<strong>不是更會辯論，而是更會感謝</strong>——歌羅西書四章，每一章都有感謝（1:3、12；2:7；3:15、17；4:2）。在不同意彼此的時候，仍然「彼此包容，彼此饒恕」（3:13）；在必須回答人的時候，仍然讓言語「好像用鹽調和」（4:6）。<strong>讀完這一卷的人，是更愛主，還是更佩服作者？</strong>若是更愛主，爭議就各歸其位了。</p>"]],"con":[],"say":"本講義的立場：以歌羅西書的「根」為中心——基督在凡事上居首位、神本性一切的豐盛在他裡面、我們在他裡面已經滿了、與他同死同活；其餘解釋、歷史與實踐的問題，先陳列各家、說出難處、再給判斷，講台一句帶過、指向議題頁與 ISS00_1–5。不把邊緣升格成中心，也不用包容取消真理：讓基督的平安在心裡作主。","care":"席上會有正在信仰危機裡、問題多到不敢說出口的人，也會有一聽到「學者有爭論」「和合本補了一個字」就不安、覺得教會怎麼甚麼都不確定的人，還有曾經在某一題上——安息日、洗禮、苦修、順服——被教會論斷或傷過、因此連神也不敢信的人。對第一種人，不要說「你就是信心不夠」，也不要急著用一堆答案堵住他，先陪他；對第二種人，指給他看 1:15–20 與 2:9–10 那幾件從來沒有被任何爭議動搖的事；對第三種人，讓他知道傷他的是人錯用了經文，不是那位為他在十字架上成就了和平的基督（1:20）。疑惑若伴隨長期的失眠、無望感或輕生念頭，會後單獨關心，必要時協助尋求專業協助。"},{"id":"ISS01_1","t":"1:7「以巴弗」——保羅沒去過歌羅西，教會是誰建立的？","r":"1:7--8；2:1；4:12--13；徒 19:10","ch":[1],"why":"歌羅西書是少數寫給「沒有與我親自見面」的人的書信（2:1）。教會到底是誰建立的？以巴弗和腓立比書的以巴弗提是不是同一個人？這一題看似只是背景，卻決定我們怎樣讀這封信的語氣：保羅不是在責備自己的學生，是在扶持一位同工建立的教會；也讓今天默默在小城、小教會服事的人看見自己的位置。","pos":[["【一】經文問的是甚麼","","<p>保羅說歌羅西人的福音，是「正如你們從我們所親愛、一同作僕人的以巴弗所學的」（1:7）；又說他為「一切沒有與我親自見面的人」盡心竭力（2:1）；信末再提「有你們那裡的人……以巴弗問你們安」，他為歌羅西、老底嘉、希拉坡里的弟兄多多勞苦（4:12–13）。問題是：教會的建立者是以巴弗嗎？保羅自己有沒有去過？以巴弗是誰？</p>"],["以巴弗建立說","","<p>多數註釋認為：保羅在以弗所推喇奴學房講論兩年，「叫一切住在亞細亞的……都聽見主的道」（徒 19:10）；以巴弗是歌羅西本地人（4:12「你們那裡的人」），在以弗所信主受教，回到家鄉建立了教會，也照顧鄰近的老底嘉與希拉坡里。1:7 的「為我們」（SBLGNT ἡμῶν）說明他是代替保羅去的。</p><p><strong>難處：</strong>經文沒有一句明說「以巴弗建立了教會」，這是從「從以巴弗所學的」與 4:12–13 推出來的；1:7 另有古卷讀作「為你們」，意思就變成以巴弗是他們的執事。</p>"],["保羅曾經路過說","","<p>少數學者指出：使徒行傳記載保羅兩次經過弗呂家地方（徒 16:6；18:23），歌羅西就在弗呂家；也許保羅曾經路過，只是沒有在那裡停留建立教會。這一說試圖解釋保羅為甚麼對這間教會這麼熟悉、又這麼關心。</p><p><strong>難處：</strong>2:1 明說歌羅西人「沒有與我親自見面」；而且從徒 16:6 的路線看，保羅經過的可能是弗呂家北部，不在呂克斯河谷。這一說與書信本身的說法不容易調和。</p>"],["以巴弗即以巴弗提說","","<p>有人認為「以巴弗」是「以巴弗提」的縮寫，兩人是同一位——都
