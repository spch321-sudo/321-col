<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<meta name="theme-color" content="#1F4D3D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="321歌羅西書講義">
<meta name="application-name" content="321歌羅西書講義">
<meta name="description" content="321歌羅西書講義：全書四章逐節原文解經、講章逐字稿與321生命應用。">
<title>321歌羅西書講義</title>
<link rel="manifest" id="MF" href="./manifest.webmanifest">
<style>
:root{
  --ink:#12181B; --paper:#EEF0EB; --card:#FFFFFF; --line:#D6DAD2;
  --pine:#1F4D3D; --pine2:#2E6B55; --brass:#9C6B18; --clay:#8C3A2E; --dusk:#54636B;
  --fs:17px; --r:14px;
  --hl-gold:rgba(156,107,24,.32);
  --hl-green:#CFE6CC; --hl-blue:#CFDFF4; --hl-pink:#F7D3DC; --hl-purple:#E3D5F1;
  --hl-maroon:#EBD0D0; --hl-brown:#E9D9BF; --hl-charcoal:#DBDAD4;
  --hb-green:#5E9E63; --hb-blue:#5583C7; --hb-pink:#DB7A90; --hb-purple:#9377C0;
  --hb-maroon:#8C4A4E; --hb-brown:#8A6740; --hb-charcoal:#54534E;
  --hl-now:#FFE9A8;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","Source Han Serif TC","Songti TC",serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
}
html[data-dark="1"]{
  --ink:#E8EDE9; --paper:#0E1412; --card:#161E1A; --line:#28332D;
  --pine:#7FBFA4; --pine2:#9BD3BA; --brass:#D6A250; --clay:#D98A78; --dusk:#93A29A;
  --hl-gold:rgba(214,162,80,.34);
  --hl-green:#22402A; --hl-blue:#1F3350; --hl-pink:#45222E; --hl-purple:#332A48;
  --hl-maroon:#3D2525; --hl-brown:#3B3020; --hl-charcoal:#34342F;
  --hb-green:#7BC28C; --hb-blue:#7FA0DE; --hb-pink:#E58FA0; --hb-purple:#A48AC9;
  --hb-maroon:#C08084; --hb-brown:#B99168; --hb-charcoal:#8E8D86;
  --hl-now:#4A3C16;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:var(--fs); line-height:1.85;
  padding-bottom:calc(66px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}

/* ── 頁首 ── */
header.top{
  position:sticky;top:0;z-index:40;background:var(--paper);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
header .bar{display:flex;align-items:center;gap:8px;height:52px;max-width:720px;margin:0 auto;padding:0 12px}
header h1{font-family:var(--serif);font-size:17px;font-weight:700;margin:0;flex:1;letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{
  width:40px;height:40px;border:0;background:transparent;color:var(--ink);
  font-size:17px;border-radius:10px;cursor:pointer;display:grid;place-items:center;flex:0 0 auto;
}
.ico:active{background:var(--line)}
.ico.hide{display:none}
.ico.lang{font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:0}
.ico.lang.on{color:var(--pine)}

/* ── 分頁 ── */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav.tabs button{
  flex:1;border:0;background:transparent;color:var(--dusk);
  font-family:var(--sans);font-size:11px;padding:8px 0 7px;cursor:pointer;line-height:1.3;
}
nav.tabs button b{display:block;font-family:var(--serif);font-size:17px;font-weight:600;margin-bottom:1px}
nav.tabs button.on{color:var(--pine)}

/* ── 通用 ── */
.eyebrow{
  font-size:11px;letter-spacing:.22em;color:var(--dusk);
  margin:0 0 6px;text-transform:none;font-weight:600;
}
h2.big{font-family:var(--serif);font-size:25px;line-height:1.5;margin:0 0 14px;font-weight:700}
h3.sec{font-family:var(--serif);font-size:19px;margin:26px 0 10px;font-weight:700;color:var(--pine)}
.sect{padding:20px 0}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin:12px 0;
}
.muted{color:var(--dusk)}
.sm{font-size:calc(var(--fs) * .82)}
.xs{font-size:calc(var(--fs) * .74)}
.btn{
  display:inline-block;border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:9px 14px;border-radius:10px;font:inherit;font-size:14px;cursor:pointer;
}
.btn.pri{background:var(--pine);border-color:var(--pine);color:#fff}
html[data-dark="1"] .btn.pri{color:#0E1412}
.btn:active{transform:translateY(1px)}
.bigbtn{
  display:block;width:100%;text-align:left;background:var(--pine);color:#fff;
  border:0;border-radius:var(--r);padding:16px 18px;cursor:pointer;font:inherit;
}
html[data-dark="1"] .bigbtn{color:#0E1412}
.bigbtn small{display:block;font-size:12px;opacity:.82;letter-spacing:.1em}
.bigbtn b{display:block;font-family:var(--serif);font-size:19px;margin:5px 0 0;line-height:1.5}
.row{display:flex;gap:8px;flex-wrap:wrap}
.pill{
  border:1px solid var(--line);background:var(--card);color:var(--dusk);
  border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;font:inherit;
}
.pill.on{background:var(--pine);border-color:var(--pine);color:#fff}
html[data-dark="1"] .pill.on{color:#0E1412}

/* ── 地形圖（招牌元素）── */
.terrain{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px 6px;margin:6px 0 0}
.terrain svg{display:block;width:100%;height:auto}
.tlab{font-family:var(--mono);font-size:8.5px;fill:var(--dusk)}
.tlab.hi{fill:var(--brass);font-weight:700}
.tpath{fill:none;stroke:var(--pine);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tdot{fill:var(--brass)}
.tdot.low{fill:var(--clay)}
.tnow{fill:none;stroke:var(--ink);stroke-width:1.5}

/* ── 章清單 ── */
.chrow{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:13px 14px;margin:8px 0;cursor:pointer;font:inherit;color:inherit;
}
.chn{
  font-family:var(--mono);font-size:12px;color:var(--dusk);
  min-width:26px;padding-top:3px;letter-spacing:-.04em
}
.chrow b{font-family:var(--serif);font-size:17px;display:block;line-height:1.45}
.chrow .s{font-size:13px;color:var(--dusk);display:block;margin-top:2px;line-height:1.6}
.chrow .done{color:var(--pine);font-size:12px}

/* ── 經文 ── */
.vs{
  display:flex;gap:9px;padding:7px 0 7px 10px;border-left:2px solid transparent;
  cursor:pointer;align-items:flex-start;
}
.vs:active{background:var(--card)}
.vs.has{border-left-color:var(--pine)}
.vs.star{border-left-color:var(--brass);border-left-width:3px}
.vs.warn{border-left-color:var(--clay);border-left-width:3px}
.vn{font-family:var(--mono);font-size:11.5px;color:var(--dusk);min-width:20px;padding-top:5px;text-align:right}
.vt{flex:1;line-height:1.95}
.vs .flag{font-size:11px;color:var(--clay);margin-left:4px}

/* ── 六層 ── */
.layer{border-top:1px solid var(--line);padding:12px 0}
.layer:first-child{border-top:0}
.lh{
  display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;
  letter-spacing:.14em;color:var(--dusk);font-weight:600;user-select:none
}
.lh .n{font-family:var(--mono);color:var(--pine)}
.lh .caret{margin-left:auto;font-size:11px;opacity:.6}
.lb{margin-top:8px}
.lb.grk{font-family:var(--serif);font-size:16px;line-height:2.05;color:var(--pine)}
.lb.lit{font-family:var(--serif)}
.kw{
  display:inline-block;border:1px solid var(--line);border-radius:8px;
  padding:3px 9px;margin:3px 5px 3px 0;font-size:13px;cursor:pointer;background:var(--card)
}
.kw i{font-style:normal;font-family:var(--serif);color:var(--pine)}

/* ── 表 ── */
table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
th{color:var(--dusk);font-weight:600;font-size:12.5px}

/* ── 軌跡 ── */
.track{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:10px 0}
.track .gk{font-family:var(--serif);font-size:22px;color:var(--pine)}
.stops{margin:12px 0 4px;padding-left:0;list-style:none}
.stop{display:flex;gap:10px;align-items:baseline;padding:5px 0}
.stop .r{font-family:var(--mono);font-size:12px;min-width:44px;color:var(--dusk)}
.stop .d{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--dusk);margin-top:6px}
.stop.dark .d{background:var(--clay)} .stop.light .d{background:var(--brass)}
.insight{border-left:3px solid var(--brass);padding:8px 0 8px 12px;margin:10px 0 0;font-family:var(--serif);font-size:16px}

/* ── 爭議 ── */
.iss{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:10px 0}
.pos{border:1px solid var(--line);border-radius:10px;padding:11px;margin:8px 0;font-size:14px}
.pos b{color:var(--pine)}
.consensus{background:rgba(156,107,24,.09);border-radius:10px;padding:11px;margin:10px 0;font-size:14px}
.say{border-left:3px solid var(--pine);padding-left:12px;margin:10px 0;font-family:var(--serif)}

/* ── 分級 ── */
.lv{display:inline-block;font-size:11px;padding:2px 7px;border-radius:6px;font-weight:700;margin-right:6px}
.lv.g{background:rgba(31,77,61,.13);color:var(--pine)}
.lv.y{background:rgba(156,107,24,.16);color:var(--brass)}
.lv.r{background:rgba(140,58,46,.14);color:var(--clay)}

/* ── 打卡 ── */
.chk{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-child{border-bottom:0}
.box{
  width:21px;height:21px;border:1.5px solid var(--line);border-radius:6px;flex:0 0 auto;margin-top:3px;
  display:grid;place-items:center;font-size:13px;color:#fff
}
.chk.on .box{background:var(--pine);border-color:var(--pine)}
.chk.on .t{color:var(--dusk);text-decoration:line-through}
.chk .t{flex:1;font-size:15px;line-height:1.7}

/* ── 底部抽屜 ── */
.sheet{
  position:fixed;inset:0;z-index:90;background:rgba(10,16,14,.42);
  display:none;align-items:flex-end;
}
.sheet.on{display:flex}
.sheet .inner{
  background:var(--paper);width:100%;max-height:88vh;overflow:auto;
  border-radius:20px 20px 0 0;padding:8px 18px calc(28px + env(safe-area-inset-bottom));
  animation:up .22s ease;
}
@keyframes up{from{transform:translateY(24px);opacity:.5}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 12px}
.sheet h4{font-family:var(--serif);font-size:20px;margin:4px 0 2px}

/* ── 其他 ── */
.toast{
  position:fixed;left:50%;bottom:88px;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;
  font-size:13.5px;z-index:120;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap
}
.toast.on{opacity:1}
.note{
  width:100%;border:1px solid var(--line);border-radius:10px;background:var(--card);
  color:inherit;font:inherit;font-size:15px;padding:11px;min-height:88px;resize:vertical
}
.q{font-family:var(--serif);font-size:var(--fs);line-height:1.75;margin:0 0 4px}
.tip{font-size:calc(var(--fs) * .8);color:var(--dusk);background:rgba(31,77,61,.07);border-radius:9px;padding:9px 11px;margin-top:8px}
.blank i{font-style:normal;color:var(--clay);letter-spacing:.05em}

/* ── 教學講義逐字稿（長文閱讀）── */
.les p{font-family:var(--serif);font-size:var(--fs);line-height:1.95;margin:0 0 15px;text-align:justify}
.les h4{
  font-family:var(--serif);font-size:calc(var(--fs) * 1.18);font-weight:700;color:var(--pine);
  margin:30px 0 12px;padding-top:14px;border-top:1px solid var(--line);scroll-margin-top:64px
}
.les h4:first-child{margin-top:6px;padding-top:0;border-top:0}
.les p.dec{color:var(--pine);font-weight:600;margin-bottom:9px}
/* 想更深：收起來的一問一答 */
.les details.deeper{
  border:1px solid var(--line);border-radius:12px;background:var(--card);
  padding:10px 13px;margin:0 0 16px
}
.les details.deeper summary{
  font-family:var(--serif);font-size:calc(var(--fs) * .92);line-height:1.65;color:var(--pine);
  font-weight:600;cursor:pointer;list-style:none
}
.les details.deeper summary::-webkit-details-marker{display:none}
.les details.deeper summary::before{content:"＋　";opacity:.6}
.les details.deeper[open] summary::before{content:"−　"}
.les details.deeper[open] summary{margin-bottom:8px}
.les .deeper-a p{font-size:calc(var(--fs) * .95);line-height:1.9;margin:0;color:var(--dusk)}
/* 三個化 */
.les p.t3s{
  font-family:var(--serif);font-size:calc(var(--fs) * 1.06);font-weight:700;color:var(--pine);
  margin:26px 0 10px
}
.les p.t3t{font-family:var(--serif);font-size:calc(var(--fs) * .95);font-weight:700;color:var(--brass);margin:16px 0 6px}
.les p.t3m{
  font-size:calc(var(--fs) * .85);line-height:1.8;color:var(--dusk);background:rgba(31,77,61,.07);
  border-radius:11px;padding:10px 13px;margin:0 0 13px;text-align:left
}
.les p.t3n{margin:0 0 12px}
.toc button{
  display:block;width:100%;text-align:left;border:0;background:transparent;color:inherit;
  font-family:var(--serif);font-size:16px;line-height:1.6;padding:7px 0;cursor:pointer;
  border-bottom:1px solid var(--line)
}
.toc button:last-child{border-bottom:0}
.toc button:active{color:var(--pine)}
.hr{height:1px;background:var(--line);margin:22px 0}
.center{text-align:center}
a{color:var(--pine)}
.foot{padding:26px 0 8px;font-size:12px;color:var(--dusk);line-height:1.9}

/* ── 全螢幕模式（講台／小組）── */
.full{position:fixed;inset:0;z-index:200;background:var(--paper);display:none;flex-direction:column}
.full.on{display:flex}
html[data-tele="1"]{--paper:#0C1210;--ink:#EDF2EE;--card:#141C18;--line:#26332C;--dusk:#8FA098;--pine:#7FBFA4;--brass:#D9A94F;--clay:#D98A78}
.fbar{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid var(--line)}
.fbar .clock{font-family:var(--mono);font-size:15px;color:var(--dusk);letter-spacing:-.02em}
.fbar .clock.over{color:var(--clay)}
.fbar b{font-family:var(--serif);font-size:15px;flex:1;text-align:center}
.fbody{flex:1;overflow:auto;padding:22px 20px 30px;-webkit-overflow-scrolling:touch}
.ffoot{display:flex;gap:8px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.rail{height:3px;background:var(--line)}
.rail i{display:block;height:3px;background:var(--brass);width:0;transition:width .3s}
/* 提詞機 */
.tele p{font-size:calc(var(--fs) * 1.45);line-height:2.05;margin:0 0 20px;font-weight:600}
.tele .qq{font-family:var(--serif);color:var(--brass);border-left:3px solid var(--brass);padding-left:14px}
.tele h5{font-family:var(--serif);color:var(--pine);font-size:calc(var(--fs) * 1.1);margin:34px 0 18px;letter-spacing:.04em}
.tele .pause{color:var(--dusk);font-family:var(--mono);font-size:13px;letter-spacing:.2em;margin:26px 0;text-align:center}
.tele .pause b{color:var(--brass)}
/* 小組 */
.live h5{font-family:var(--serif);font-size:15px;color:var(--pine);letter-spacing:.1em;margin:0 0 18px}
.live .qq{font-family:var(--serif);font-size:calc(var(--fs) * 1.5);line-height:1.85;margin:0 0 20px}
.live .tipbox{background:rgba(156,107,24,.12);border-radius:12px;padding:14px;font-size:15px;line-height:1.8}
/* 搜尋 */
.sbox{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card);color:inherit;font:inherit;font-size:16px;padding:12px 14px}
mark{background:rgba(156,107,24,.3);color:inherit;padding:0 2px;border-radius:3px}

/* ── 品牌與啟動畫面 ── */
.brand{width:26px;height:26px;border-radius:7px;flex:0 0 auto;display:block}
.brand.hide{display:none}
#splash{
  position:fixed;inset:0;z-index:300;background:#12305E;color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:opacity .45s ease;
}
#splash.gone{opacity:0;pointer-events:none}
#splash img{width:132px;height:132px;border-radius:28px;box-shadow:0 12px 40px rgba(0,0,0,.4);margin-bottom:20px}
#splash h2{font-family:var(--serif);font-size:25px;margin:0;letter-spacing:.06em;font-weight:700}
#splash p{margin:4px 0 0;font-size:15px;opacity:.85;letter-spacing:.3em}
#splash small{margin-top:26px;font-size:11.5px;opacity:.55;letter-spacing:.16em}

/* ── 畫線與領受 ── */
.vs.hl .vt{background:linear-gradient(transparent 58%, rgba(156,107,24,.32) 58%)}
.mkw{margin:0 0 14px}
.mks{
  cursor:pointer;border-radius:5px;transition:background .12s;
  -webkit-tap-highlight-color:transparent;box-decoration-break:clone;-webkit-box-decoration-break:clone
}
.mks:active{background:var(--line)}
.mks.hl{background:linear-gradient(transparent 60%, var(--hl-gold) 60%)}
.mks.hl[data-c="green"]{background:linear-gradient(transparent 60%, var(--hl-green) 60%)}
.mks.hl[data-c="blue"]{background:linear-gradient(transparent 60%, var(--hl-blue) 60%)}
.mks.hl[data-c="pink"]{background:linear-gradient(transparent 60%, var(--hl-pink) 60%)}
.mks.hl[data-c="purple"]{background:linear-gradient(transparent 60%, var(--hl-purple) 60%)}
.mks.hl[data-c="maroon"]{background:linear-gradient(transparent 60%, var(--hl-maroon) 60%)}
.mks.hl[data-c="brown"]{background:linear-gradient(transparent 60%, var(--hl-brown) 60%)}
.mks.hl[data-c="charcoal"]{background:linear-gradient(transparent 60%, var(--hl-charcoal) 60%)}
/* 正在朗讀的那一句 */
.spk-now{
  background:var(--hl-now)!important;border-radius:4px;
  box-shadow:0 0 0 3px var(--hl-now);transition:background .2s
}
.les h4 .spk-now,.les details.deeper.spk-now{box-shadow:none}
.les details.deeper.spk-now{background:var(--hl-now)!important}
.mkp{cursor:pointer;border-radius:5px;transition:background .12s}
.mkp.hl{background:linear-gradient(transparent 62%, var(--hl-gold) 62%)}
.mkp.hl[data-c="green"]{background:linear-gradient(transparent 62%, var(--hl-green) 62%)}
.mkp.hl[data-c="blue"]{background:linear-gradient(transparent 62%, var(--hl-blue) 62%)}
.mkp.hl[data-c="pink"]{background:linear-gradient(transparent 62%, var(--hl-pink) 62%)}
.mkp.hl[data-c="purple"]{background:linear-gradient(transparent 62%, var(--hl-purple) 62%)}
.mkp.hl[data-c="maroon"]{background:linear-gradient(transparent 62%, var(--hl-maroon) 62%)}
.mkp.hl[data-c="brown"]{background:linear-gradient(transparent 62%, var(--hl-brown) 62%)}
.mkp.hl[data-c="charcoal"]{background:linear-gradient(transparent 62%, var(--hl-charcoal) 62%)}
.mknote{display:block}
.mknote{
  border-left:3px solid var(--brass);background:rgba(156,107,24,.08);
  border-radius:0 10px 10px 0;padding:10px 12px;margin:8px 0 12px;font-size:calc(var(--fs) * .85);line-height:1.8
}
.mknote[data-c="green"]{border-left-color:var(--hb-green)}

window.__booted = false;
function bootReset(){
  try {
    if (window.caches) caches.keys().then(ks => Promise.all(ks.map(k => caches.delete(k)))).then(go);
    else go();
  } catch(e){ go(); }
  function go(){
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations)
      navigator.serviceWorker.getRegistrations().then(rs => {
        Promise.all(rs.map(r => r.unregister())).then(() => location.reload(true));
      }).catch(() => location.reload(true));
    else location.reload(true);
  }
}

<script id="DATA" type="application/json">{"ch":[{"n":1,"t":"使他可以在凡事上居首位","sub":"像、首、和","lv":"A","arc":"首","sec":[["1:1--8","寫信給歌羅西的聖徒：信心、愛心、盼望"],["1:9--14","為你們不住地禱告祈求：遷到他愛子的國裡"],["1:15--20","愛子是那不能看見之神的像：基督之歌"],["1:21--23","你們從前與神隔絕：如今和好"],["1:24--29","現在我為你們受苦，倒覺歡樂：基督在你們心裡"]],"serm":{"pts":[["一間沒去過的教會","1:1--14","「這福音傳到你們那裡，也傳到普天之下，並且結果，增長」——以巴弗帶回來的消息一半好、一半讓人擔心；保羅的第一個反應是感謝與禱告"],["居首位","1:15--20","「使他可以在凡事上居首位」——萬有是靠他造、藉著他造、為他造，也靠他而立；首生不是第一個被造的，是一切被造的都歸他承受"],["基督在你們心裡","1:21--29","「就是基督在你們心裡成了有榮耀的盼望」——從前與神隔絕的人被和好；歷世歷代隱藏的奧祕，如今住進一個人的心裡"]]},"q":"孩子考試前，你有沒有在他書包裡塞過一個平安符，說「信耶穌也沒關係，多一層保護」？公司開工那天，你有沒有跟著大家一起拜一下，心想「只是禮貌」？你早上醒來第一個打開的，是聖經、股票軟體，還是工作群組？\n我們很少說「我不要耶穌」。我們說的是：耶穌很好，可是還要再加一點——加一點運氣、加一套方法、加一個比較靈的管道。\n這一章要問的是：如果萬有都是他造的、靠他而立，而且一切的豐盛都住在他裡面，你的生活裡，還有哪一格沒有讓他排第一？","truth":"那不能看見之神的像，是萬有的創造者與維繫者，又藉著十字架的血叫萬有與神和好；神要他在凡事上居首位，而不是在某些事上（1:15–20）。\n這一位不是遠遠地居首，他已經把從前與神隔絕的人和好、遷進他的國，而且住進他們心裡——在他以外，不必再加甚麼。","mv":{"t":"他也是教會全體之首。他是元始，是從死裡首先復生的，使他可以在凡事上居首位。","r":"西1:18"},"card":["這一章是一封寫給沒去過的教會的信的第一頁：保羅先感謝、再禱告，然後停不下來地唱了一首詩。詩的第一節說，那不能看見之神的像，是萬有的創造者與維繫者；第二節說，他是教會的頭、從死裡首先復生，並藉著十字架的血叫萬有和好。下半章，鏡頭從宇宙轉到從前與神隔絕的人身上：如今被和好，而且基督住進了他們心裡。","這一章的動詞，幾乎都是神在做。是父使我們夠資格、救我們脫離黑暗的權勢、把我們遷到他愛子的國裡；是愛子造了萬有、維繫萬有、從死裡首先復生；是神喜歡叫一切的豐盛住在他裡面，藉著他十字架的血成就了和平；是神藉著基督的肉身受死，叫仇敵與自己和好，把我們引到自己面前；是神願意叫人知道那隱藏的奧祕。連保羅的勞苦，也是照著「他」在裡面運用的大能。","1:5 說盼望是「存在天上的」，原文 τὴν ἀποκειμένην（tēn apokeimenēn），是「被存放著、有人看守」的東西，像一筆已經寫上你名字、鎖在庫房裡的產業。保羅說信與愛是「為」這盼望長出來的。這改變今天的讀法：一個知道自己該有的已經存好的人，不必在地上搶位子、搶功勞、搶一個更靈的方法；你不是因為缺，才去加；是因為已經存好了，所以空得出手來愛人。","這一章照出來的我，很少公開反對基督，卻常常把他放在「其中一個」的位置：救恩交給他，健康交給養生節目，孩子的前途交給補習班和平安符，生意交給人脈與時辰。我也常覺得自己還缺一樣——少一次特別的經歷、少一個進階課程、少一位更有恩膏的人替我禱告。這不是不信，是心裡還沒有承認：豐盛全部住在他裡面。","「你們從前與神隔絕，因著惡行，心裡與他為敵。但如今他藉著基督的肉身受死，叫你們與自己和好」（1:21–22）全章最該被記住的動作，是「但如今」。居首位的那一位，沒有站在最高處等我們爬上去；他用自己的肉身受死，跨過了最低的那一段距離。所以讓他居首位，不是一個勉強的要求，是一個被和好的人，終於把家裡的主位還給那位先跨過來的人。","這一週，拿出你的行事曆或手機，找出一格你從來沒有讓基督排第一的地方：也許是理財、也許是孩子的升學、也許是某一段關係、也許是一個暗暗留著「多一層保護」的東西。選定一天的早上，把 1:15–20 讀出聲來，然後把那一格的事，具體地說給主聽，問他：這一件事，你要怎樣排在第一？如果有一樣東西該拿掉，就在那一天拿掉。","最終整合：歌羅西，一間屋子，晚上。\n以巴弗還在羅馬，沒有回來。帶信回來的是推基古，旁邊站著一個年輕人，阿尼西謀——幾個月前，他是從這座城逃走的。\n屋子裡坐著奴僕和主人，坐著在市場賣羊毛的，坐著從小在神廟旁邊長大的人。\n最後一排，一位老婦人手裡握著一個小小的護身符。信耶穌以後，她沒有丟掉它。只是多一層保護。\n推基古開始讀。讀到「感謝」，有人笑了；讀到「遷到他愛子的國裡」，有人低下頭。\n然後讀信的人放慢了聲音：\n「因為萬有都是靠他造的，無論是天上的，地上的；能看見的，不能看見的」（1:16）\n老婦人的手指動了一下。\n「他在萬有之先；萬有也靠他而立。」（1:17）\n「使他可以在凡事上居首位。」（1:18）\n她慢慢鬆開手，看著掌心裡那個東西。原來她怕了一輩子的，在這封信裡，只是一張清單上的一行字，清單的標題是：他造的。\n讀到「就是基督在你們心裡成了有榮耀的盼望」（1:27），她把護身符放在桌上，沒有人說話。\n站在門邊的阿尼西謀也在聽。他知道，這間屋子的主位，從今天起不屬於坐在裡面的任何一個人。\n如果你今夜手裡也還握著一樣「多一層保護」，請記得：維繫萬有的那雙手，為你被釘過。\n然後，把手打開。"],"self":"這一章照出來的「有己」，第一個樣子是加法：我不反對基督，只是把他當成我人生拼圖的其中一塊——救恩那一塊給他，其他的我自己配：運氣、方法、人脈、更靈的管道，好像我比神更清楚我還缺甚麼。\n第二個樣子是自己作頭：我願意他是教會的頭，卻不願意他是我行事曆、錢包、婚姻與脾氣的頭；我讓他在「屬靈的事上」居首位，凡事的其餘部分，主位仍然留給我自己。","t321":{"k":"耶穌是我的榜樣：那位萬有都是靠他造的、在凡事上居首位的主，在地上的時候說：「子憑著自己不能做甚麼，惟有看見父所做的，子才能做」（約 5:19）。他是神的像，卻從來不替自己爭第一；他在客西馬尼園說「不要從我的意思，只要從你的意思」（可 14:36），最後藉著十字架的血成就了和平。他的居首，是從最低的地方得著的。學他，不是先爭一個位置，而是在每一件事上，先問父要甚麼，再動手。","g":"讓耶穌作王：這一章要人讓出來的位置，是「分配者」——我替基督劃好範圍：救恩歸他，其餘的我自己決定要不要再加一點。1:13 說神已經把我們遷到他愛子的國裡，1:18 說要他在凡事上居首位；讓耶穌作王，不是在生活裡替他保留一個角落，是承認每一個角落本來就是他造的、為他造的。可以自己檢查：這一週，我做了哪一個決定，是從來沒有問過他、也從來沒有打算讓他排第一的？那一格裡，是誰在作王？","p":"建立屬神的體系：第 1 章給教會的，是一張很樸素的繁殖照片。保羅在以弗所教了一群人，以巴弗回到自己的小城，教會就在那裡長出來；保羅稱他為「一同作僕人的」，不是下屬。第一，體系的單位是一個人：1:28 一節裡三次「各人」，勸戒一個、教導一個、把一個人帶到神面前。第二，回報從感謝開始：以巴弗先講他們的愛，保羅先感謝再禱告，同工之間的消息先說神已經做成的。第三，不設內圈：奧祕已經顯明給所有聖徒，沒有只給高階同工的祕密課程，每一個人都可以在基督裡完完全全。"},"grp":["【一、破冰】說一樣你家裡或你自己曾經留著「多一層保護」的東西或習慣：平安符、看日子、開工拜拜、出門前的小動作……那時候你心裡想的是甚麼？","【二、扎心】經文說：「使他可以在凡事上居首位」（1:18）。說出你生活裡一個具體的領域（理財、孩子升學、婚姻、工作、身體），到今天為止，你其實沒有讓基督在那裡排第一。上一次在那件事上作決定，是甚麼時候、你最先問的是誰？","【三、福音】「你們從前與神隔絕，因著惡行，心裡與他為敵。但如今他藉著基督的肉身受死，叫你們與自己和好」（1:21–22）。說一次你覺得自己「還不夠格」、要再多做一點才能靠近神的經驗。如果和好是他先跨過來作成的，那一刻的你，其實站在哪裡？","【四、行動】說出這一週你要交出來的一格：哪一件事、哪一天、你要做的那一個具體動作（拿掉一樣東西、改變一個習慣、在作決定前先禱告並讀 1:15–20）。也說出你預計會在甚麼情況下想「再加一點」，以及你打算怎樣回到基督那裡。","【五、代禱】為三種人指名禱告：一位信主多年、卻一直覺得自己少一樣的弟兄姊妹，求主讓他知道在基督裡已經滿了；一位家中長輩仍然倚靠命理、神明與護身符的人，求主讓他看見造萬有的那一位；一位在小城、小教會默默服事、覺得自己不重要的同工，求主讓他像以巴弗一樣，知道自己是「一同作僕人的」。"],"prac":{"main":"這一週，把一格沒有交出來的生活交給他——因為萬有是他造的，一切的豐盛都住在他裡面，我不必再加甚麼。","items":["對神：每天早上把 1:15–20 慢慢讀一次，讀到「在凡事上」時停下來，說出今天行事曆上最重要的一件事，對主說：「這一件，請你排第一。」每晚回想：今天有沒有哪一刻，我在基督以外又去找了「多一層保護」？","對自己：這七天，每當你發現自己在想「我還缺一樣」——缺一個經歷、一門課、一個比較靈的方法——就記下時間與內容；週末把這張單子帶到主面前，讀 1:19，承認一切的豐盛都在他裡面，並為那些「缺」一一感謝他已經給的。","對人：學以巴弗，這一週向你的小組長、牧者或同工回報一位弟兄姊妹的近況時，先說神在他身上已經做成的好，再說需要代禱的地方。也找一位你常常只看見他問題的人，具體地為他感謝神一次，並讓他知道。","對生活：清點你家裡或身上的「多一層保護」：平安符、看日子的習慣、只為求心安的小儀式；和家人商量後，選一樣在主面前拿掉，不必嘲笑過去的自己，只要說：「萬有靠你而立，我不需要它了。」若是長輩的東西，先尊重、先禱告，不要強行處理。","對使命：為一位還在「與神隔絕」的家人、同事或鄰居每天指名禱告，求主讓他看見那不能看見之神的像；這一週找一個自然的機會，不辯論、不施壓，只說一件基督在你生活裡「居首位」以後改變了的小事。"]},"safe":["① 把 1:15「首生的」講成「耶穌是神造的第一個、最高的受造者」，或只講「在一切被造的以先」卻沒有讀到 1:16 開頭的「因為」。","保羅給「首生」的理由正是「因為萬有都是靠他造的」；1:18 第二次「首生」是從死裡首先復生——拉撒路比他先出墳墓，他仍是首生。首生是地位與承受權，不是受造的次序；講錯就是把創造者放回被造的那一邊（紅線一；全卷立場見 ISS00_2）。","檢驗標準：你講到「首生」時，有沒有把 1:16 的「因為」讀出來？會眾聽完，能不能用一句話說出「首生不是第一個被造的，是一切被造的都歸他承受」？","② 講 1:15–16 時嘲笑、模仿或攻擊耶和華見證人等持不同信仰的人，把他們當成講台上的笑料或敵人。","敲我們家門的人，常常是誠懇、勤勞、願意談聖經的人；保羅在同一封信說「好像用鹽調和，就可知道該怎樣回答各人」（4:6）。嘲笑不能幫助任何人看見基督，只會讓會眾更佩服會辯論的人，而不是更敬拜那一位（紅線一）。","檢驗標準：如果一位耶和華見證人、或從那裡出來的朋友坐在台下，他聽完是覺得被尊重、願意再讀一次 1:16，還是覺得被羞辱？","③ 把 1:24「補滿基督患難的缺欠」講成「基督的救恩還不夠，要靠你的受苦、奉獻、犧牲才能補足」。","兩節以前保羅才說「但如今他藉著基督的肉身受死，叫你們與自己和好」（1:22）；1:24 的「患難」θλῖψις 在新約從不指基督贖罪的受苦，是傳福音的人在路上所受的苦。講成救恩不夠，就把恩典變成了功課（紅線五）。","檢驗標準：會眾聽完，是更確知和好已經完成，還是開始盤算自己還要再受多少苦、再交多少才夠？","④ 用 1:24 勸一個正在家裡受暴力、在職場被霸凌、在教會被屬靈控制的人：「你的受苦是在補滿基督的患難，要歡喜忍耐，不要離開。」","保羅的苦是為福音、為教會，自願承擔的；被虐待不是為福音受苦，而是需要被保護、被帶到安全的地方。把受苦美化成留在不安全處境裡的理由，等於用經文把人留在危險裡（紅線五）。","檢驗標準：你講 1:24 時，有沒有明說「為福音受苦」與「留在虐待中」是兩件事？一位正在受傷害的人聽完，是更敢求助，還是更不敢開口？","⑤ 只講一世紀的歌羅西異端，說「那是古代的問題」；或反過來，把今天某一個教派、某一種文化直接等同於歌羅西的錯謬教師，拿來點名攻擊。","書信三問要走完：處境是一座多神、多哲學的小城裡，有人要在基督以外「加一點」；原則是萬有是他造的、豐盛全住在他裡面，他要在凡事上居首位；今天的落點是每一位聽眾自己的「基督＋」——民間信仰、成功學、屬靈階級，而不是別人的教會（全卷立場見 ISS00_1、ISS00_3）。","檢驗標準：你講完，會眾是更清楚自己生活裡哪一格還「加了一點」，還是更確定別人的教會有問題？","⑥ 講 1:16「有位的，主治的，執政的，掌權的」時大談靈界的層級與邪靈的名字，讓會眾回家更怕鬼月、風水與沖煞。","保羅點名這些權勢，是為了說它們的標題是「他造的」，而且 1:20 說天上的也藉十字架與神和好；講成恐怖故事，正好把會眾推回歌羅西人原來的恐懼裡（紅線七；屬靈爭戰回指以弗所書立場四）。","檢驗標準：會眾聽完，是更平安地知道一切權勢都在基督之下，還是更想再找一樣東西來保護自己？","⑦ 把 1:20「叫萬有……都與自己和好」講成「每一個人不論信不信，最後都會得救」；或反過來，因為怕普救論而略過這一節，不敢講十字架的宇宙性。","保羅三節以後就說「只要你們在所信的道上恆心」（1:23），2:15 也說到權勢被擄；萬有和好是受造界歸回秩序、歸在基督底下，進入和好的路是信。略過這一節，則會錯過基督之歌的最高點：十字架上的血。","檢驗標準：你有沒有同時說出「和好的範圍是宇宙」與「進入和好的方法是信」？","⑧ 用 1:23「只要你們在所信的道上恆心」恐嚇會眾：「你若不夠堅定，隨時會失去救恩。」","原文 εἴ γε 是帶著把握的提醒，近似「既然你們是會持續的」；保羅的對象是被一點一點「引動」的人，不是要他們活在恐懼裡。拿這一節製造不安，會叫信心軟弱的人更遠離那位已經把他們引到自己面前的神。","檢驗標準：一位常常懷疑自己是否得救的弟兄姊妹聽完，是更想緊緊靠近基督，還是更焦慮地數算自己的表現？","⑨ 把 1:9「滿心知道神的旨意」講成「神對你的婚姻、工作、搬遷都有一張具體藍圖，你要靠異象、感動或某位屬靈人的話找到它，找錯就毀了」。","保羅求的是「在一切屬靈的智慧悟性上」被充滿，目的是「行事為人對得起主」；旨意的大方向寫在經上，具體的抉擇在禱告、聖經、屬靈同伴的印證與智慧裡慢慢清楚。講成抽籤式的尋找，會叫人焦慮，也會叫人把決定權交給別人（回指以弗所書立場五）。","檢驗標準：會眾聽完，是更願意帶著智慧與禱告作決定，還是更害怕自己「錯過了神的旨意」？","⑩ 把 1:9 的「智慧悟性」與 1:15–20 的「基督居首位」講成反對讀書、反對科學、反對專業：「有基督就好，不必讀那麼多書。」","保羅禱告的內容正是智慧、悟性與知道神；問題從來不是思考太多，是在基督以外去找。把信心講成反智，會讓學生、學者與專業人士以為必須在信仰和頭腦之間二選一（紅線六）。","檢驗標準：一位正在讀研究所、或在醫院、實驗室工作的弟兄姊妹聽完，是更想讓基督在他的專業裡居首位，還是覺得自己的學問不受歡迎？","⑪ 把 1:28「各人」「完完全全」講成人數與業績：多少人決志、多少人受洗、你帶了幾個門徒，數字不夠就是不夠屬靈。","一節裡三次「各人」，是要說體系的單位是一個一個的人，每一個都被勸戒、被教導、被帶到神面前；把「各人」換成數字，就把人變成了報表上的一格，也讓勞苦的同工以為自己的價值等於成果。","檢驗標準：你講完，同工心裡浮現的是一張報表，還是幾張具體的臉、幾個需要被陪伴的名字？","⑫ 把 1:29「勞苦」「盡心竭力」講成「服事就要燒盡自己，不休息、不顧家、不顧身體才叫愛主」。","保羅說的是「照著他在我裡面運用的大能」——力量的來源是基督，不是自己的透支；把服事講成自我消耗，會讓忠心的人燒乾，也讓家人與身體成為事工的代價，正好把基督以外的「我的努力」加了回來。","檢驗標準：一位已經疲憊不堪的同工聽完，是更想回到那位在他裡面運行大能的主那裡，還是更自責自己做得不夠？","⑬ 先講 321 的「讓耶穌作王」，再拿 1:18 來印證；或把「居首位」講成一個要會眾自己努力達成的目標：「你要更奉獻、更委身，耶穌才能在你身上居首。」","經文的次序是神先作：是父把我們遷到愛子的國裡，是神要他在凡事上居首位；讓他作王，是承認一個已經成立的事實，不是我們替他爭取王位。先講口號再引經文，就把經文當成 321 理念的插圖（鐵律五）。","檢驗標準：你講到 321 之前，會眾有沒有先聽完那首基督之歌、先看見十字架上的血？321 是最後才接上去的嗎？","⑭ 講「基督＋民間信仰」時，嘲笑還在拜拜、看日子、戴護身符的家人與長輩，叫信主的年輕人回家「把東西全部丟掉」。","1:21 說「你們從前」也與神隔絕；那些長輩的恐懼是真的，他們需要的是看見造萬有的那一位，不是被羞辱。強行處理別人的東西，常常讓家人更遠離福音。","檢驗標準：一位家人還在拜拜的弟兄姊妹聽完，是更想回家愛他的父母、為他們禱告，還是更想回家和他們吵架？"]},{"n":2,"t":"在他裡面生根建造","sub":"根、滿、影","lv":"A","arc":"根","sec":[["2:1--5","要叫他們的心得安慰：一切智慧知識都在他裡面藏著"],["2:6--7","就當遵他而行：在他裡面生根建造"],["2:8--15","你們要謹慎：仗著十字架誇勝"],["2:16--19","都不可讓人論斷你們：影兒與形體"],["2:20--23","你們若是與基督同死：不可拿、不可嘗、不可摸"]],"serm":{"pts":[["花言巧語","2:1--8","「免得有人用花言巧語迷惑你們」——歌羅西人遇到的不是反對基督的人，是要在基督以外再加一點的人"],["已經滿了","2:9--15","「你們在他裡面也得了豐盛」——神本性一切的豐盛都在基督裡；與他同埋同活的人，不必再加甚麼"],["影兒與形體","2:16--23","「這些原是後事的影兒；那形體卻是基督」——節期、異象、規條與苦待己身都是影兒；抱著影兒不放，就是不持定元首"]]},"q":"你的手腕上、皮夾裡、車子的後照鏡下，有沒有一樣「求個心安」的東西？一條開運手鍊、一張平安符、一個長輩塞給你、你不敢丟的紅包袋。你的書架上、手機裡，有沒有一門接一門的課程、證書、讀書計畫，總覺得再上完這一門，屬靈生命就會到位？\n也許你不是不信耶穌，你只是想「再加一點」——加一點保險、加一點方法、加一點經驗、加一點對自己的狠。\n這一章要問的是：如果神本性一切的豐盛都住在基督裡面，而你在他裡面也已經滿了，你手上抓著的那些「再加一點」，到底是在補甚麼？","truth":"你們既然接受了主基督耶穌，根就已經扎在他裡面了；神本性一切的豐盛都有形有體地住在他裡面，你們在他裡面也得了豐盛，欠條已經釘在十字架上，權勢已經被擄（2:6–15）。\n所以節期、異象、規條與苦待己身都只是影兒，形體是基督——在基督以外再加甚麼，不是更屬靈，是放開了元首的手。","mv":{"t":"在他裡面生根建造，信心堅固，正如你們所領的教訓，感謝的心也更增長了。","r":"西2:7"},"card":["這一章是全卷的樞紐：第一章唱完「基督是誰」，第二章說「所以」——你們怎樣接受了他，就怎樣在他裡面走下去。歌羅西人沒有被叫去離開基督，只是有人要他們再加一點：一套理學、一個割禮、一張節期表、一種天使與異象的經驗、一串不可拿不可嘗不可摸。保羅的回答只有一個：一切都已經在他裡面，你們在他裡面也已經滿了。","這一章幾乎每一個大動作，主詞都是神或基督。是神叫我們與基督一同埋葬、一同復活、一同活過來；是神赦免了我們一切過犯；是神塗抹了那張攻擊我們的字據，把它撤去，釘在十字架上；是基督把一切執政掌權的擄來，公開示眾；是神叫全身靠著元首、筋節相助聯絡，「大得長進」。連 2:7 的扎根、建造、堅固，原文都是被動的——動手的是他，我們負責感謝。","2:19 說那位追求異象的人「不持定元首」，「持定」原文是 κρατῶν（kratōn），抓住、握緊不放的意思，是現在分詞：一直沒有抓住。保羅沒有說他看見的不夠多、禁食的不夠久；他看見了很多，偏偏手放開了。這改變今天的讀法：檢驗一個屬靈經驗、一套方法、一位導師，不是問它多深多新，是問它讓我的手更握緊基督，還是讓我騰出手去抓別的。像人潮裡的孩子，危險從來不是看不見熱鬧，是鬆開了父親的手。","這一章照出來的我，常常不是不信，是不放心。我信耶穌，卻還留著一條手鍊「以防萬一」；我領受了恩典，卻還要再修一門課才覺得夠格；我說基督是我的一切，卻用禁食的天數、讀經的進度、看見的異象去量自己和別人。更隱密的是，我以為對自己越狠越屬靈——少睡、少吃、不許自己累、不許自己難過——其實那個中心，仍然是我自己的表現。","「你們在他裡面也得了豐盛。」（2:10）全章最該被記住的，是這一句的時態：已經被充滿了，現在仍是滿的。整章的「不可讓人論斷你們」「不可讓人奪去你們的獎賞」「為甚麼仍……服從」，都掛在這一句上面。翻過來，這也是一把尺：當我又想在基督以外加一樣東西的時候，先問自己——我是在豐盛裡往上長，還是以為自己不夠，才拚命去補？","這一週，打開你的抽屜、皮夾、手機和行事曆，找出一樣你拿來「再加一點」的東西：一個護身的物件、一份逼著自己的打卡表、一個你一直轉傳的「屬靈秘訣」、一條你給自己定、卻從沒問過基督的規條。選一個晚上，把它帶到主面前，說出它原本想替你補的是甚麼；能丟的就丟，不能丟的就交給一位信得過的同工陪你處理。","最終整合：歌羅西，一間家庭教會，晚上。\n推基古從遠方帶來兩封信。一封給教會，一封給這家的主人。屋裡的人圍著燈坐下，門邊站著一個年輕人，阿尼西謀——幾個月前，他是從這扇門逃出去的。\n信讀到「你們既然接受了主基督耶穌，就當遵他而行」，坐在前面的一位弟兄點點頭；他這一陣子禁食禁得很苦，為的是看見別人說的那個異象。\n讀到「你們在他裡面也得了豐盛」，他抬起頭，好像第一次聽見。\n然後讀信的人放慢了聲音：\n「又塗抹了在律例上所寫、攻擊我們、有礙於我們的字據，把它撤去，釘在十字架上。」（2:14）\n屋子的主人轉過頭，看了門邊一眼。他手上還有另一封信，是同一位保羅寫的，裡面有一句話：「他若虧負你，或欠你甚麼，都歸在我的帳上」（門 18）。\n阿尼西謀不敢抬頭。他知道自己欠的是甚麼。\n讀信的人繼續念：「這些原是後事的影兒；那形體卻是基督。」（2:17）\n燈把每一個人的影子投在牆上，有長有短，有的看起來比人還大。\n可是那一晚，沒有人在看牆上的影子。他們看著彼此——一個逃跑的奴僕、一個收欠條的主人、一個禁食到發抖的弟兄——\n都坐在同一個帳已經結清的屋子裡。\n如果你今夜還在替自己記帳、還在抱著牆上的影子，\n請記得：欠條已經釘上去了。你在他裡面，已經滿了。"],"self":"這一章照出來的「有己」，第一個樣子是加法：我不肯承認基督已經夠了，總要自己再加一點，好讓我心裡有底——加一個保險、一套方法、一種經驗、一個比別人高一點的屬靈等級；那一點，其實是我想自己握著的控制權。\n第二個樣子是苦修：我以為對自己狠就是無己，用少吃、少睡、不許軟弱來證明自己的認真，旁人越佩服，我越停不下來。兩種樣子的中心都是我——一個不放心基督的豐盛，一個要用自己的苦來換取屬靈的分量。","t321":{"k":"耶穌是我的榜樣：主耶穌在安息日醫病、讓門徒掐麥穗，被人論斷的時候，他說「安息日是為人設立的，人不是為安息日設立的」（可 2:27）——他沒有廢掉安息，卻把安息從規條裡還給了人。他在曠野禁食四十天，不是為了累積功夫，是為了單單倚靠父的話；他從不靠秘密的知識、特別的異象抬高自己，反而把自己倒空，在十字架上被剝去，卻在那裡誇勝。學他，是讓我的禁食、守日與一切操練，都只是靠近父的方法，不是拿來量人、也不是拿來折磨自己的尺。","g":"讓耶穌作王：這一章要人讓出來的位置，是「自己加上去的那一張寶座」。2:10 說他是各樣執政掌權者的元首——讓他作王，就是不在他旁邊再擺一個靠山：不靠手鍊、不靠擇日、不靠某一位導師的話來安心。也是把裁判的哨子還給他：3:15 說基督的平安在心裡作主，不是場邊自封的評審，也不是我自己那份嚴苛的成績表。可以自己檢查：這一週我最後一次覺得「還不夠」而去多抓一樣東西，是在甚麼時候？那一刻，是誰在我心裡作王？","p":"建立屬神的體系：第 2 章給教會的不是一份更長的規條，是一個從元首得供應、筋節相助聯絡的身體。第一，教導的內容要能被檢驗：任何課程、方法、屬靈經驗進到教會，先問它是不是照著基督，是不是叫人更持定元首。第二，不讓任何一種屬靈表現成為門檻：禁食、方言、異象、守日的方式，都不可以拿來分等級、決定誰能服事。第三，讓群體保護軟弱的人：小組長要學會辨認對自己過度苛刻、飲食失調、身心耗竭的弟兄姊妹，陪他就醫、陪他休息，讓教會成為一個人可以停下來的地方，而不是另一個要表現的地方。"},"grp":["【一、破冰】你身上或家裡，有沒有一樣東西是「求個心安」留著的——一個平安符、一條手鍊、一張長輩給的紅紙、一件幸運的衣服？它是怎麼來的？如果今天要你把它丟掉，你心裡第一個念頭是甚麼？","【二、扎心】經文說：「你們在他裡面也得了豐盛」（2:10）。說出一樣你最近在基督以外「再加上去」的東西——一門課、一個方法、一個人的話、一份逼自己的打卡表。它原本是想替你補甚麼？是哪一天、在甚麼情況下，你開始覺得基督不太夠？","【三、福音】「又塗抹了在律例上所寫、攻擊我們、有礙於我們的字據，把它撤去，釘在十字架上。」（2:14）說一筆你到今天還覺得欠神的帳——一次失敗、一段過去、一件做不到的事。如果那張欠條已經被釘上去了，你今天靠近神的時候，還需要先付甚麼嗎？","【四、行動】說出這一週你要放下的一條「自己加的規條」（例如：不睡滿四小時不算認真、主日一定要排滿服事、吃了某樣東西就覺得自己失敗），說出哪一天、用甚麼方式把它交給神；如果它牽涉到身體或飲食，也說出你要告訴哪一位信得過的人。","【五、代禱】為三種人指名禱告：一位正被某種「秘訣」「新啟示」或屬靈導師吸引、慢慢離開元首的人，求主讓他重新握緊基督；一位因為守日、飲食或屬靈經驗不同而被論斷、或正在論斷人的弟兄姊妹，求主讓雙方都聽見「不可讓人論斷你們」；一位對自己過度苛刻、在吃東西或身體上掙扎的人，求主讓他被溫柔地陪伴，也得到專業的幫助。"],"prac":{"main":"這一週，放下一樣「再加一點」——因為我在他裡面，已經滿了。","items":["對神：每天早上用 2:9–10 禱告：「主啊，神本性一切的豐盛都在你裡面，我在你裡面也已經滿了。」然後說出一件今天你想額外抓住的東西（一個保證、一個方法、一個人的肯定），把它交給他。晚上回想：今天哪一刻，我是從「已經滿了」的地方出發，而不是從「還不夠」出發？","對自己：這七天，留意你對自己說話的口氣。每當你聽見自己說「還不夠」「你太差了」「不准累」，就記下時間和那件事；週末把這張單子帶到主面前，分辨哪些是聖靈的提醒，哪些只是自己加的規條。如果你發現自己用不吃、不睡或傷害身體的方式對待自己，這一週就找一位信得過的人說出來，並尋求專業協助。","對人：想一位和你守日方式、飲食習慣或屬靈經驗不一樣的弟兄姊妹或鄰居——週六敬拜的、吃素的、不說方言的、說方言的。這一週約他吃一頓飯或喝一杯茶，只問他「你為甚麼這樣守、這樣做？」，認真聽完，不辯論、不論斷，最後為他祝福。","對生活：檢查你的抽屜、手機與行事曆：找出一樣護身的物件、一個你一直轉傳的「屬靈秘訣」、一張排滿到沒有休息的服事表。能丟的丟掉，該刪的刪掉，該空的空出來——這一週刻意留出半天什麼都不做，只是休息、散步、感謝，讓身體知道安息是恩典。","對使命：在小組或服事團隊裡，提出一個具體的檢查：我們最近引進的課程、方法或講員，是不是照著基督、叫人更持定元首？並為一位還在「信耶穌也拜拜、也算命」之間擺盪的家人或朋友，每天指名禱告；找一個機會，不是去拆他的東西，而是讓他看見你在基督裡的平安。"]},"safe":["① 把 2:20「不可拿、不可嘗、不可摸」當成聖經命令來引用，用它勸人戒酒、戒煙、遠離某些食物或娛樂。","和合本給這句加了引號，保羅是在引錯謬教師的口號，而且是為了否定它：「這都是照人所吩咐、所教導的」（2:22）；和合本把 2:20–21 合成一節，原文的口號在 2:21。拿它當命令，正好把保羅拆掉的東西又立起來（紅線三；全卷立場見 ISS00_4）。","檢驗標準：你若要勸人節制，引的是愛人與聖潔的原則和別處的經文，還是 2:21？會眾聽完，記住的是一位主，還是一串「不可」？","② 把 2:23 或 321 的「無己」講成「對自己越狠越屬靈」：少吃、少睡、不許累、不許難過，甚至用身體的痛苦懲罰自己。","2:23 是全本新約唯一直接說苦待己身「毫無功效」的一節；無己是不以自己為中心，不是傷害自己、看輕身體；治死的對象是 3:5 列出的罪，不是身體，也不是情緒，而且先有 3:1 的同復活（紅線三；回指腓立比書立場二）。","檢驗標準：一位有自我傷害或飲食困擾經驗的弟兄姊妹聽完，是覺得「我要再狠一點」，還是覺得自己可以被溫柔地陪伴、去尋求專業幫助？","③ 對正在自我傷害、厭食暴食或身心耗竭的人說：「你就是治死得不夠」「你要更捨己」「多禁食禱告就會好」。","這是把 2:23 說「毫無功效」的方法，當成藥開給最脆弱的人；他需要的是溫柔的關懷與專業的協助，不是更重的屬靈要求。用屬靈語言催逼，會叫人更隱藏、更危險（紅線三）。","檢驗標準：你有沒有明說「這需要醫療與專業的幫助，教會願意陪你」？會後有沒有人單獨關心他，而不是在小組裡公開討論？","④ 把 2:8「理學和虛空的妄言」講成「基督徒不要讀哲學、念太多書、學科學，讀書會讓人失去信仰」。","保羅才禱告他們「在一切屬靈的智慧悟性上，滿心知道神的旨意」（1:9），又說「所積蓄的一切智慧知識，都在他裡面藏著」（2:3）；問題是「不照著基督，乃照人間的遺傳和世上的小學」（2:8），不是思考本身。講成反智，會叫讀書的年輕人以為信仰與理性只能二選一（紅線六）。","檢驗標準：一位念哲學、念科學的大學生聽完，是更有勇氣讓基督居首位地讀書，還是覺得自己必須在教會和書本之間選邊？","⑤ 反過來，把 2:8 講成「所以任何學說、方法、工具都可以照單全收，只要有效就好」，把成功學、領導力模型或心理技巧直接當成屬靈真理。","2:8 的判準是「照不照著基督」：工具可以用，但當它開始決定我們怎樣看基督，而不是基督決定我們怎樣用它，就已經被擄去了。只講不反智、不講判準，就把保羅的警告講沒了（全卷立場見 ISS00_3）。","檢驗標準：你講完，會眾手上有沒有一把可以自己用的尺——「這套說法讓基督居首位，還是要基督讓位」？","⑥ 把 2:16 講成「守安息日的人不得救」，或「在星期六敬拜的都是律法主義」，甚至在講台上點名某一間教會或宗派。","2:16 說「不可讓人論斷你們」——命令有兩面：不讓人論斷你，你也不論斷人；保羅自己在羅 14:5–6 作了同樣的連結。點名攻擊別的教會，正是在 2:19 那個筋節相連的身體上割一刀（紅線二；全卷立場見 ISS00_3）。","檢驗標準：一位在星期六敬拜的基督徒朋友坐在台下，聽完會覺得被尊重，還是被當成辯論的對象？你有沒有點任何一間教會的名？","⑦ 把主日講成新的律法：主日沒來就是不屬靈，主日去探望家人、出遊、加班就要被論斷；或用「守主日」量一個人的信心。","2:17 說節期、安息日都是影兒，形體是基督；安息的原則仍在，但不是律法，是恩典。把主日變成新的規條，等於把 2:16 的論斷從星期六搬到星期日（紅線二）。","檢驗標準：你講主日聚集的時候，用的是「因為形體已經是我們的，所以我們樂意一同敬拜、一同休息」，還是「你不來就是……」？","⑧ 把「安息的原則仍在」講成另一份成績單：休息不夠是屬靈失敗；或反過來，把 2:16–17 講成「安息已經過時，基督徒不必休息、可以一週七天服事」。","形體是基督，所以安息不再是律法逼出來的，卻仍是神給人的恩典；一間連主日也排滿服事的教會，常常是用忙碌來證明自己。兩種講法都把恩典又講回了表現（全卷立場見 ISS00_3）。","檢驗標準：會眾聽完，是更敢停下來休息、把心安靜在神面前，還是多了一條要守的規矩、或多了一個不休息的理由？","⑨ 把 2:15、2:18 講成靈界恐慌：天使、邪靈、符咒、沖煞到處都是，病痛與不順都是被攻擊，要不斷捆綁、驅趕才安全；或反過來，說靈界只是古人的迷信。","經文承認執政掌權的是真實的，但說基督已經把他們擄來、公開示眾、仗著十字架誇勝；在他裡面的人不必再求別的保護。身體不適要就醫，心裡不安要禱告，兩樣都做（紅線七；回指以弗所書立場四）。","檢驗標準：一位從小被鬼月、風水嚇大的弟兄姊妹聽完，是更平安地站在凱旋的基督裡，還是更害怕？","⑩ 把 2:18 的屬靈經驗講成屬靈等級：「沒有看見異象、沒有說方言、沒有被某位導師遮蓋，就不夠屬靈、不能服事」；或反過來，嘲笑一切經驗都是假的。","保羅沒有否認經驗，他給了檢驗：讓人「無故地自高自大」、讓人「不持定元首」的，就要被察驗；真從神來的經驗，果效是更謙卑、更平安、更愛人。把經驗當勳章，正是那位場邊裁判的作法（紅線七；回指以弗所書立場五、哥林多後書立場三）。","檢驗標準：你講完，會眾是更想去追某一種經驗，還是更想握緊元首？一位從未有過特殊經驗的姊妹，聽完會覺得自己被判出局嗎？","⑪ 把 2:14「塗抹了……字據」講成「律法已經作廢，十誡和道德要求都不必理會」；或反過來，講成「帳雖然清了，你還是要多做一點來報答，才配得上」。","被撤去的是那張定罪的帳，不是神良善的心意；誡命不再是追討欠款的帳單，是被饒恕的人學習愛的方向。講成道德作廢，是把恩典講成放縱；講成要報答才配，是在釘死的欠條上又簽了一張新的（回指加拉太書立場二）。","檢驗標準：會眾聽完，是更自由地愛神愛人，還是更自由地放過自己？或者，是心裡又多了一本要還的帳？","⑫ 把 2:11–12 講成「受了洗就自動得救」，或「洗禮可有可無，心裡信就好」；或在講台上嘲笑另一派的洗禮方式。","2:12 的次序是：洗禮是記號，信心是管道，神的大能是源頭；嬰兒洗禮派與信徒浸禮派都是福音派、都敬重聖經，講台不替各教會決定洗禮的方式與對象（全卷立場見 ISS00_4）。","檢驗標準：你有沒有同時說出「洗禮不是魔法」和「洗禮不是可有可無」？一位在另一個傳統受洗的弟兄姊妹，聽完會覺得自己的洗禮被看輕嗎？","⑬ 用處境取消原則：「那是一世紀歌羅西的異端，和我們無關」；或把處境硬搬，把今天某一個教會、宗派或族群直接等同於當年的錯謬教師。","書信三問要走完：處境是一座多神、多哲學的小城，有人要在基督以外再加一點；原則是一切豐盛都在基督裡，你們在他裡面已經滿了；今天的落點是信耶穌也拜拜、也算命、也加一套成功學、一層屬靈階級——但講台指出的是「加法」，不是任何一群人（全卷立場見 ISS00_1、ISS00_3）。","檢驗標準：你有沒有具體說出你自己和你的教會今天在基督以外加了甚麼？會眾聽完，是更想檢查自己的手，還是更確定別人錯了？","⑭ 先講 321 的「讓耶穌作王」「無己」，再拿 2:9–10、2:20–23 來印證；或把「已經滿了」講成「所以要更努力無己，才能活出豐盛」。","經文的次序是：先有基督的豐盛（2:9），再有我們在他裡面已經滿了（2:10），才有不必再服從規條（2:20）；把 321 放在前面，或把豐盛講成努力的成果，就把經文當成理念的插圖，也把 2:23 剛拆掉的苦修又請了回來（鐵律五）。","檢驗標準：你講到 321 之前，會眾有沒有先聽見「你們在他裡面也得了豐盛」？會眾聽完，是更佩服會無己的人，還是更確知自己在基督裡已經滿了？"]},{"n":3,"t":"惟有基督是包括一切","sub":"上、藏、衣","lv":"A","arc":"上","sec":[["3:1--4","當求在上面的事：生命與基督一同藏在神裡面"],["3:5--11","要治死你們在地上的肢體：脫去舊人，穿上新人"],["3:12--17","要存憐憫、恩慈、謙虛、溫柔、忍耐的心：基督的平安與基督的道理"],["3:18--25","你們作妻子的：家裡的人"]],"serm":{"pts":[["上面的事","3:1--4","「你們要思念上面的事，不要思念地上的事」——位置先於命令：已經與基督一同復活的人，心思才轉得過來"],["治死與穿上","3:5--14","「惟有基督是包括一切，又住在各人之內」——治死的是罪，不是身體；脫去舊人、穿上新人，新人裡面不分希臘人、猶太人"],["凡事感謝","3:15--25","「無論做甚麼，或說話或行事，都要奉主耶穌的名，藉著他感謝父神」——基督的平安作主、基督的道理住在心裡，然後走進家裡與工作裡"]]},"q":"如果明天你的名片、職稱、存款和社群頭像全部被拿走，你還能用一句話說出自己是誰嗎？你最近一次在心裡偷偷替自己加分，是靠學歷、靠孩子的成績、靠哪一個教會，還是靠「我比他屬靈」？\n也許你很努力地「對付自己」：少吃一餐、多罵自己一句，以為這樣就是治死老我；也許你在外面溫和有禮，回到家，卻是全家說話最刺人、沉默最可怕的那一位。\n這一章要問的是：一個生命已經藏在神裡面的人，為甚麼還要在基督以外替自己加東西？他的新衣服，有沒有一路穿回家、穿進辦公室、穿到孩子的書桌旁？","truth":"你們已經與基督一同復活，你們的生命已經與基督一同藏在神裡面，而且現在仍藏著；所以心思可以轉向上面，罪可以被治死，新衣服可以一件一件穿上。\n惟有基督是包括一切：不必再靠身分、苦修或成績替自己加分，讓他的平安作主、他的話住下來，然後凡事奉他的名、藉著他感謝父神——從家裡到工作，都是這樣。","mv":{"t":"因為你們已經死了，你們的生命與基督一同藏在神裡面。","r":"西3:3"},"card":["這一章講一個已經被帶到上面的人，怎樣在地上換衣服。先是位置：你已經與基督一同復活，生命藏在神裡面；然後是脫：淫亂、貪婪、怒氣、謊言，一件一件脫掉；然後是穿：憐憫、恩慈、謙虛、溫柔、忍耐，外面繫上愛。最後，這套衣服被穿進家門與工作的地方。全章的山頂只有一句：惟有基督是包括一切。","這一章的主詞，先是神。是神叫我們與基督一同復活（被動語態）；是神把我們的生命藏起來，藏在基督裡、藏在他自己裡面；是神揀選、使人成聖、一直愛著我們（3:12 三個名字）；是神在知識上一直更新新人，照著造他主的形像；是主先饒恕了我們；是基督的平安來作裁判、基督的話住進來。人的每一個「要」，都站在神已經做成的事上面。","3:13「彼此饒恕」原文是 χαριζόμενοι（charizomenoi），字根就是恩典 χάρις（charis）；後半句「主怎樣饒恕了你們」用的是同一個動詞 ἐχαρίσατο（echarisato）。饒恕不是假裝那筆帳不存在，是把那張帳單當作恩典交出去——交給那位先把我的帳單撕掉的主。所以饒恕可以是一次一次交出去的過程；交出去的是討債的權利，不是你的安全，也不是你的界線。","這一章照出來的我，常常把「上面」當成逃離，把「治死」當成自虐。我很會在心裡給人分等級：哪一堂、哪一種學歷、哪一個階層、會不會講我的方言；也很會在家裡用一句話把人刺痛，然後說那是我的個性。我穿著憐憫的外衣服事外人，回到家卻換回舊衣服；老闆在的時候我很盡責，沒有人看的時候，我就只做給自己看。","「惟有基督是包括一切，又住在各人之內。」（3:11）全章翻轉在這裡：人用來替自己加分的一切記號——民族、宗教、文化、階級——在新人裡面全部歸零，剩下的不是一片空白，是基督。所以我不必再向誰證明我夠格，也不必再拿別人的出身墊高自己；我要做的，只是讓他坐在中間，然後在那個人的旁邊坐下來。","這一週做一件事：找一個你最常拿來替自己加分的東西——職稱、成績、身材、存款、孩子的表現——每天早上出門前，在心裡把它放下，說一句：「主啊，我的生命不在這裡，藏在你那裡。」再挑一位家人，每天具體地肯定他一件事（不是「你很棒」，是「謝謝你今天……」）；如果你是常常用沉默懲罰家人的那一位，這一週先打破一次沉默。","最終整合：第二天清早，歌羅西，腓利門的家。\n信昨晚讀完了。屋裡的燈熄了，客人都回去了，只剩下灶裡一點還沒有冷的火。\n亞腓亞第一個起來，生火，燒水。昨晚讀到「不可苦待她們」的時候，她沒有抬頭；今早，她聽見丈夫在院子裡說話，聲音比平常低了一點。\n孩子在門邊磨蹭，怕今天又要背書。父親蹲下來，沒有先問他背到哪裡，先說：昨天你幫忙擺燈，擺得很好。\n阿尼西謀也起來了。他不知道今天該站在哪裡——門邊，還是桌邊。腓利門看了他很久，然後把一碗熱湯推到他面前。\n沒有人看見這間廚房。城裡的人照樣去市場，照樣去神廟，照樣談天上的天使、地上的節期。\n這一家也照樣洗碗、記帳、修屋頂、算今年的羊毛價錢。表面上，甚麼都沒有改變。\n可是有一些東西，在昨晚已經被脫下來了；有一些衣服，今天早上第一次被穿上。\n原來治死，不是把自己打碎，\n是不再把舊屋的東西搬進新家；\n原來思念上面，不是離開廚房，\n是在廚房裡，第一次知道誰坐在寶座上。\n他們的生命藏著，像灶裡的火藏在灰底下——\n看不見，卻一直熱著；\n因為藏它的那一位，不會讓它熄滅。\n有一天，他要顯現。\n那一天，這間廚房、這碗湯、這一句「擺得很好」，都要一同顯現在榮耀裡；\n而那一天最亮的，不是腓利門，不是亞腓亞，不是阿尼西謀，\n是那一位包括一切、又住在他們每一個人裡面的基督。"],"self":"這一章照出來的「有己」，第一個樣子是「加」：我的生命不肯只藏在基督裡，總要再加一點才安心——加一個頭銜、加一筆存款、加一套屬靈的規矩、加一種比別人高一級的身分；甚至加上對自己的懲罰，好像痛一點，神才會算數。\n第二個樣子是「穿兩套衣服」：在教會穿憐憫和溫柔，回到家穿舊人的苦毒和冷漠；在老闆面前穿忠心，在沒有人看的地方穿敷衍。我以為那叫作「懂得分場合」，其實是還沒有讓基督成為包括一切的那一位。","t321":{"k":"耶穌是我的榜樣：主耶穌在地上三十年，大部分的日子是藏著的——在拿撒勒作木匠，順從父母，沒有人替他按讚。他受洗出來，還沒有行過一個神蹟、講過一篇道，天父就從天上說「這是我的愛子，我所喜悅的」（太 3:17）；他的身分先被定了，工作才開始。他思念上面的事，卻蹲下來洗門徒的腳；他被罵不還口，被冤枉也不苦毒；他凡事都向父感謝，連最後的晚餐也是先祝謝。學他，就是讓生命先藏在父那裡，然後在看不見的地方照樣忠心，在最該發怒的時候不讓人的日子變苦。","g":"讓耶穌作王：這一章要人讓出四個位置。第一個是「替自己定價」的位置：3:11 說惟有基督是包括一切——我是哪一種人、讀過甚麼學校、屬哪一堂，都不再由我拿來定價。第二個是「心裡的裁判」：3:15 要基督的平安作主，不是恐懼、不是別人的眼光、也不是我自己的好勝。第三個是「家裡最大的那一位」：3:19、3:21 把限制放在最有權柄的人身上，丈夫與父母先讓位。第四個是「工作的觀眾」：3:23 像是給主做的，不是給人做的。可以自己檢查：這一週我最想被誰看見？那一位，坐的是不是主的位子？","p":"建立屬神的體系：第 3 章給教會四件要建的事。第一，一個「不分」的群體：分堂分組可以是牧養的智慧，但同工會、講台、小組長要刻意跨過語言、世代、職業與階層，讓不同的人在同一張桌子上服事（3:11）。第二，一個彼此教導的會眾：3:16 把教導與勸戒交給全會眾，教會要培養平信徒一起讀經，選詩也要看神學，不只看旋律。第三，一套保護人的流程：饒恕與和好分開談、家暴有求助與轉介名單、自傷有關懷與專業協助的管道。第四，把家庭與職場當作禾場：為父母開「不叫孩子失志」的親職小組，為上班族開職場團契，讓 3:23 在週一發生。"},"grp":["【一、破冰】小時候，你家裡最常聽到的一句稱讚或一句責備是甚麼？是誰說的？那一句話，到今天還在你心裡的哪裡？","【二、扎心】「惟有基督是包括一切，又住在各人之內。」（3:11）說一件具體的事：最近一次你在心裡把一個人放低一級，是因為他的口音、學歷、工作、年紀，還是他屬的那一堂、那一個教會？那時你在替自己加甚麼分？","【三、福音】「因為你們已經死了，你們的生命與基督一同藏在神裡面。」（3:3）說一件你最怕失去的東西（工作、健康、一段關係、別人的肯定）。如果你的生命不在那件東西裡面，而是藏在神裡面，這一週你面對它的方式，會有哪一點不一樣？","【四、行動】說出這一週你要在哪一天、對哪一位家人（說出稱呼或名字），具體肯定他一件事；再說出一件你在工作上「沒有人看就不做」的小事（報表、清潔、回覆、交接），以及你打算哪一天把它做好，像是給主做的。","【五、代禱】為四種人指名禱告：一位常常自責、甚至用傷害自己的方式「對付自己」的人，求主讓他知道治死的是罪，不是他；一對冷戰中的夫妻；一個被比較、被罵到心灰意冷的孩子或青少年；以及一位在職場上被霸凌或被要求作假、不知道該怎麼辦的弟兄姊妹。"],"prac":{"main":"這一週，讓我的生命只藏在基督裡：不再替自己加分，也不再拿自己出氣——把新衣服一路穿回家、穿進工作裡。","items":["對神：每天早上讀一次 3:1--4，然後用一句話禱告：「主啊，我的生命與基督一同藏在你裡面，今天不必再證明甚麼。」晚上睡前讀 3:15--17，回想今天哪一刻是基督的平安在作裁判、哪一刻是恐懼在吹哨，為前者感謝，把後者交給他。","對自己：這七天留意一件你「對付自己」的方式——少吃一餐當懲罰、深夜一直罵自己、拿身材或成績責備自己。那不是 3:5 的治死。把它寫下來，帶到主面前；若它已經傷到你的身體或睡眠，這一週找一位信得過的人或專業人員談一談。","對人：每天具體肯定一位家人一件事；若你是常用沉默懲罰人的那一位，這一週主動打破一次沉默，說一句「剛才我說話太重了，對不起」。若你和誰之間有嫌隙，先把討債的權利交給主；要不要、何時和好，按安全與對方的悔改來判斷。","對生活：檢查你的手機與錢包：這一週打開投資軟體、購物網站或社群的次數，比打開聖經多幾倍？選一個時段，用讀 3:16 或唱一首有內容的詩歌取代它。在工作上，挑一件沒有人看的事，像給主做的一樣做好。","對使命：在你的小組或教會，找一位和你不同語言、世代或職業的人，這一週約他吃一頓飯，聽他說一個他的故事；或為教會提一件具體建議：一份家暴與自傷的求助轉介名單、一次親職分享、一個職場小組。"]},"safe":["① 把 3:5「治死」講成苦待己身：「要治死老我，就要少吃、少睡、多責打自己，越痛越屬靈」。","保羅前一頁才說那些規條「苦待己身，其實在克制肉體的情慾上是毫無功效」（2:23）；3:5 接在 3:1「與基督一同復活」之後，治死的對象是淫亂、污穢、邪情、惡慾、貪婪這些罪的行為與私慾，不是身體（紅線三，全卷立場見 ISS00_4）。","檢驗標準：一位曾經用不吃飯、傷害自己來「對付罪」的人聽完，是更想懲罰自己，還是知道治死的是罪、不是他？","② 把 321「無己」講成看輕自己、懲罰自己、傷害自己，或對正在自我傷害的人說「你就是治死得不夠」。","無己是不以自己為中心，不是沒有自己、更不是傷害自己（回指腓立比書立場二）；3:3 說生命藏在神裡面——藏在神裡面的人，反而更會愛惜這個屬於主的身體。有自我傷害或飲食困擾經驗的人，需要溫柔的關懷與專業協助。","檢驗標準：你講「無己」的時候，有沒有同時說出「不是傷害自己」？會後有沒有一條可以轉介專業協助的管道？","③ 把「治死」講成壓抑情緒：「基督徒不可以難過、不可以生氣、不可以害怕，把感覺都按下去才是屬靈」。","3:5 與 3:8 列的是罪的行為與私慾，以及傷人的怒氣與言語，不是情緒本身；神沒有叫人治死眼淚。把情緒當罪治死，會讓人連向神哀哭都不敢，反而把傷藏到更深的地方。","檢驗標準：會眾聽完，是更敢把真實的感受帶到神面前，還是更會在人前假裝沒事？","④ 只讀 3:18「當順服自己的丈夫」，略過 3:19「不可苦待她們」；或對受苦待的妻子說「多順服、多禱告、為了孩子忍一忍」。","3:19 的苦待原文是讓她的日子變苦——言語的苛刻、當眾數落、冷戰與用沉默懲罰都在其中；順服不包括忍受暴力，遇到暴力，教會第一件事是保護她和孩子的安全（紅線四，全卷立場見 ISS00_5，回指以弗所書立場三）。","檢驗標準：你講 3:18 的時候有沒有讀到 3:19？一位正在被言語或冷暴力折磨的姊妹聽完，是更敢求助，還是更不敢說？","⑤ 拿 3:20「凡事聽從父母」替打罵教育背書，或對孩子說「父母罵你是愛你，你要感恩」，卻跳過 3:21「恐怕他們失了志氣」。","3:21 把限制放在最有權柄的人身上：ἀθυμῶσιν 是心灰意冷，新約只此一次；常被比較、只被糾正不被肯定的孩子，最後不是生氣，是放棄。「凡事」也在「主所喜悅的」裡面，不包括說謊、犯罪或忍受虐待；涉及兒童受虐要依法通報。","檢驗標準：一位在打罵與比較中長大、到今天還不敢相信自己被愛的人聽完，是更自責，還是第一次聽見神站在他這一邊？","⑥ 拿 3:22「凡事聽從你們肉身的主人」要求基督徒員工忍受霸凌、配合作假帳、違法加班，或說「為主忍耐就是見證」。","3:22--23 的重點是換一個觀眾——敬畏主、像是給主做的；正因為主在天上，人不必向不義的命令低頭。3:25「主並不偏待人」同時對主人說話，4:1 說主人頭上也有主（全卷立場見 ISS00_5）。","檢驗標準：一位正在被主管霸凌或被要求作假的弟兄姊妹聽完，是知道可以說不、可以求助，還是覺得忍下去才屬靈？","⑦ 把 3:1--2「思念上面的事」講成逃避地上：不必關心工作、社會與公義，「反正這世界要過去」。","要分清處境與原則：原則是心思朝向坐在神右邊的基督，讓他來定義我；處境是歌羅西人被天使、異象、苦修拉往「上面」。保羅說完這一句，十幾節之後就講到妻子、丈夫、兒女、僕人——思念上面的人，最會在地上忠心（全卷立場見 ISS00_1）。","檢驗標準：會眾聽完，是更想逃離家裡與職場，還是更知道要帶著天上的眼光回到那裡？","⑧ 把 3:11「在此並不分」講成「差異都不重要、不要談」，用合一的名義叫少數的一方閉嘴；或反過來，把分堂分組講成不合一。","3:18 起保羅照樣分別對妻子、丈夫、兒女、僕人說話，差異沒有消失；不分的是價值與地位——沒有一群人比另一群人更屬靈、更重要。分堂分組可以是牧養的智慧，但不可讓語言、世代、階層變成教會裡的牆。","檢驗標準：教會裡說話最少的那一群人聽完，是覺得自己終於被看見，還是又被要求「為了合一」安靜下來？","⑨ 用 3:6「神的忿怒必臨到」恐嚇會眾，好像信徒一次跌倒，神就會發怒棄絕他。","3:7 說「你們從前也曾這樣行過」，治死是蒙恩的罪人不再回到舊路；神的忿怒是聖潔的神對罪的認真，不是情緒失控，也不是用來嚇走痛悔的人（鐵律六：果效是忍耐，不是恐慌）。","檢驗標準：一位正在和某一個罪掙扎、心裡很痛的人聽完，是更敢回到神面前，還是更想躲起來？","⑩ 講 3:5「貪婪就與拜偶像一樣」只罵別人，卻在同一場聚會講「奉獻越多、蒙福越多」；或反過來，把一切儲蓄、投資、理財都定為拜偶像。","貪婪是要得更多、把錢放在神的位置上，決定我的安全感與價值；成功神學把神當成致富的工具，是把貪婪包上屬靈的外衣。但經文禁止的是貪婪，不是工作、儲蓄或負責任的理財。","檢驗標準：會眾聽完，是更誠實地檢查自己對錢的心，還是更想用奉獻向神換回報、或更看不起努力存錢的人？","⑪ 拿 3:13「主怎樣饒恕了你們，你們也要怎樣饒恕人」要求受害者馬上原諒、馬上和好，甚至與施暴者同桌同工。","饒恕是把討債的權利交給主；和好需要對方真實的悔改與信任的重建，有時需要時間、界線與保護（回指哥林多後書立場四）。把饒恕講成立刻和好，會讓受害者再一次被放進危險裡。","檢驗標準：一位被嚴重傷害、心裡還放不下的人聽完，是覺得自己被理解、可以慢慢走，還是又多一層「不夠屬靈」的罪咎？","⑫ 把 3:9--10「已經脫去」「穿上了新人」講成「真基督徒就不會再犯罪」，或把弗 4:22--24 的「要脫去」說成與這裡矛盾。","已經是身分，還要是生活：歌羅西書著重已經（不定過去式分詞），以弗所書著重還要；3:10「漸漸更新」是現在式被動，新人一直在被神更新（以弗所書講義第 4 章）。只講已經，人會懶散或絕望；只講還要，人會焦慮。","檢驗標準：一位信主多年仍有軟弱的人聽完，是懷疑自己沒有得救，還是知道衣服已經換上、神還在更新他？","⑬ 把 3:15「基督的平安在你們心裡作主」講成「只要感覺平安就是神的旨意」，或硬把本章講成聖靈的章。","本卷聖靈只出現一次（1:8）；3:15 說的是基督的平安，3:16 緊接著是基督的道理——平安要與基督的話一同作裁判，而且「歸為一體」，也要在群體裡被印證。感覺可以是指引的一部分，不能取代經文與群體。","檢驗標準：你講「平安作主」的時候，有沒有同時講到基督的道理與群體的印證？","⑭ 用 3:17「藉著他感謝父神」與 3:15「要存感謝的心」要求正在受苦的人：「你要為這件事感謝神」「不感謝就是沒有信心」。","感謝是奉主耶穌的名、藉著他向父的感謝——在一切事中為父的同在感謝，不是說罪惡、暴力與失落是好的；逼人感謝，會讓受苦的人連眼淚都要藏起來。","檢驗標準：一位剛經歷失落或傷害的人聽完，是覺得可以帶著眼淚來到父面前，還是覺得連難過都不屬靈？","⑮ 把這一章講成 321 的插圖：先講「由內而外五重的改變」「無己」「焦點在耶穌」，再拿 3:1--25 一節一節來印證。","次序是經文先講：位置、心思、治死與穿上、凡事奉主的名、家裡與工作；321 只在末端認出經文自己走出的次序（鐵律五）。把經文當插圖，會讓會眾記住一套術語，卻沒有遇見那位包括一切的基督。","檢驗標準：會眾聽完，記住的是團契的術語，還是「我的生命與基督一同藏在神裡面」？"]},{"n":4,"t":"盡你從主所受的職分","sub":"鹽、門、名","lv":"A","arc":"鹽","sec":[["4:1--1","你們作主人的，要公公平平地待僕人：天上也有一位主"],["4:2--6","你們要恆切禱告：開傳道的門、用鹽調和"],["4:7--9","推基古要將我一切的事都告訴你們：送信的與回家的"],["4:10--14","與我一同坐監的亞里達古問你們安：一同做工的人"],["4:15--18","你們念了這書信：盡你從主所受的職分"]],"serm":{"pts":[["禱告與話語","4:1--6","「你們的言語要常常帶著和氣，好像用鹽調和」——家規的最後一句說主人頭上也有主；然後保羅從家裡轉向外人：禱告開門、智慧交往、話語調和"],["十個名字","4:7--14","「他們要把這裡一切的事都告訴你們」——送信的推基古、回家的阿尼西謀、被接回來的馬可、代禱的以巴弗：福音落成一份名單"],["做滿職分","4:15--18","「務要謹慎，盡你從主所受的職分」——全卷最後一個命令只對一個人說；寫信的人最後說：「你們要記念我的捆鎖」"]]},"q":"你家裡、你公司裡，有沒有一個人，每天替你做事，你卻叫不出他的全名？你上一次為一位不信主的朋友禱告，是甚麼時候？上一次在家族聚會被問「你們信耶穌的，是不是連祖先都不拜」，你回了甚麼——一句帶著鹽的話，還是一句帶著辣椒的話，還是乾脆不說？\n你的教會名冊上，有沒有幾個這兩年忽然不見了的名字？你自己的名字，現在還寫在哪一份服事的名單上？\n這一章要問的是：一個在基督裡已經滿了的人，怎樣在家門口、在餐桌上、在一份名單裡，把主交給他的那一份做滿？","truth":"在基督裡已經滿了的人，不必在他以外再加甚麼，只要回應：「恆切禱告，在此警醒感恩」，向外人開口時「好像用鹽調和」，並且聽見那一句對自己說的話：「盡你從主所受的職分」。\n寫下這一切的，是一個手上有鍊子的人，他最後只求一件事：「記念我的捆鎖」——因為恩惠是有人付了代價送到的；最先付上代價的，是那位在凡事上居首位、把我們的字據釘在十字架上的基督。","mv":{"t":"要對亞基布說：「務要謹慎，盡你從主所受的職分。」","r":"西4:17"},"card":["這一章是一棵樹結果子的地方：家規最後一句把主人放到天上那位主的面前，然後保羅轉向門外——禱告求神開門，用智慧把時機買回來，用帶著恩典、調了鹽的話回答每一個人。接著福音落成一份名單，十個名字裡有送信的、回家的、被接回來的、在遠方禱告的，最後一個命令只對一個人說：把你的職分做滿。","這一章的主詞常常是神：是神開傳道的門（4:3），不是人把門撞開；是主把職分交給亞基布，「從主所受」，不是他自己爭來的；是在天上的那一位主，同時看著主人和奴僕。神把一個逃跑的奴僕改名為「親愛忠心的兄弟」，把一個半途而廢的馬可重新放進名單，把一個被鎖住的使徒變成一扇門——最後，是神的恩惠與他們同在。","4:11 保羅說這幾位同工「是叫我心裡得安慰的」，「安慰」原文是 παρηγορία（parēgoria），新約只出現這一次，是當時醫生與慰問信常用的字，意思接近「舒緩、止痛」。被鎖在屋裡的使徒，需要的不是一篇講道，是幾個肯坐在旁邊的人。今天問自己：我是哪一位同工、哪一位牧者、哪一位家人的止痛藥？還是我常常是他們痛的原因？","這一章照出來的我，在教會裡很溫柔，對家裡請的阿姨、公司的派遣工、送外賣的人卻沒有耐心；我禱告很少感恩，多半是一張清單；我向人傳福音時急著要結果，被拒絕了就不再聯絡；我在網路上回應不同信仰的人，話裡常常是辣椒不是鹽。我記得誰離開了教會，卻不記得自己的那一份服事已經放下多久了。","「求神給我們開傳道的門。」（4:3）一個手上有鍊子的人，不求監獄的門開，只求話語的門開。全章最大的翻轉在這裡：限制不一定是福音的終點，可能是入口。病床、退休、失業、被調到偏遠的分公司、被困在家裡照顧長輩——那裡不是被主擱置的地方，是一扇門可能要開的地方。要做的不是把門撞開，是先禱告。","這一週做一件事：選定你身邊一位「外人」——同事、鄰居、家族裡的一位長輩——每天為他禱告一次，求神開門；同時在這一週內，找一個合宜的時刻多陪他十分鐘，只聽，不急著講道。另外，寫下一位你家裡或公司裡天天替你做事的人的全名，這一週當面謝謝他一次，並且檢查你給他的待遇是否公道。","最終整合：幾個禮拜以後，老底嘉，寧法的家。\n從歌羅西走過來的弟兄，把那封信交到她手裡。信紙的邊已經磨軟了，因為它在另一間屋子裡被讀過、被傳過、被捧過。\n寧法把桌子收乾淨，點上燈。客廳裡坐著織布的、賣羊毛的、一個剛從主人家贖出來的女僕，還有兩個是第一次來的鄰居。\n讀信的人讀到「恆切禱告，在此警醒感恩」，停下來；大家沒有先求甚麼，先一個一個說這個禮拜要感謝的事——連第一次來的鄰居也說了一件。\n讀到「好像用鹽調和」，一位常在市場上跟人吵架的弟兄低下頭，笑了一下，說：我的話，辣椒太多了。\n讀到「盡你從主所受的職分」，屋裡安靜下來。那是寫給亞基布的，可是每一個人都聽成是寫給自己的：點燈的、讀信的、把信送來的、準備餅的。\n最後一行字跡不一樣，歪歪的，大一點。讀信的人把信轉過來，讓大家看：「記念我的捆鎖」。\n沒有人說話。他們忽然明白，手上這封說「使他可以在凡事上居首位」的信，是一隻被鎖住的手簽的名；\n而那位居首位的主，自己也曾經被綁著，被帶到彼拉多面前，為他們付清了帳。\n燈下，他們為羅馬那間屋子裡的人禱告。然後寧法把信摺好，交給明天要去希拉坡里的人。\n原來恩惠就是這樣走路的——\n從一隻戴鎖鍊的手，到一間又一間點了燈的客廳；\n名單越來越長，每一個名字後面，都有一份要做滿的職分，\n和一句沒有動詞、卻從來沒有離開過的祝福：願恩惠常與你們同在。"],"self":"這一章照出來的「有己」，第一個樣子是「我是主人」：我在家裡、在公司、在餐廳裡，習慣被服事，忘了自己頭上也有一位主；我對比我弱的人說話最不客氣，給的待遇也最小氣。第二個樣子是「我來開門」：傳福音變成我的業績、我的口才、我的成果，對方一拒絕，我就受傷、就放棄，因為我其實是在乎自己的面子。\n第三個樣子是「我的名單」：我很會記得誰離開了、誰失敗過，像當年不肯再帶馬可的保羅；卻不太記得主交給我的那一份，我已經放下多久了。有己的人，看別人的職分看得很清楚，看自己的職分卻總是模糊。","t321":{"k":"耶穌是我的榜樣：主耶穌自己就是那位「恆切禱告，在此警醒」的人——在客西馬尼，門徒睡著了，他還醒著禱告（可 14:38）。他對外人說話，總是帶著恩典也帶著鹽：對井旁的撒瑪利亞婦人，他先開口要一口水，再說出她的光景（約 4:7、16--18）；對夜裡來的尼哥底母，對樹上的撒該，每一個人他回答的方式都不一樣。他也把職分做滿了，在十字架上說「成了」（約 19:30）。學他，就是醒著禱告、看著人說話、把父交給我的那一份做完。","g":"讓耶穌作王：這一章要人讓出三個位置。第一個是「主人」的位置：4:1 說你們也有一位主在天上——在公司、在家裡、在請人做事的地方，我不是最後的那一位，對下屬、對移工、對外傭的公道與對等，是交給主看的。第二個是「開門的人」的位置：門是神開的，我禱告、我等候、我回答，不用話術撬門，也不把別人的決定當作我的成績。第三個是「挑職分的人」的位置：職分是「從主所受」的，大小不由我選。可以自己檢查：這一週，我有沒有一件事是因為「這不是我想做的」而推掉的？","p":"建立屬神的體系：第 4 章給教會一份名單，也給教會四件事。第一，教會要有一群在遠處摔跤禱告的人，像以巴弗——把長輩、病人、行動不便的弟兄姊妹組成代禱的團隊，讓他們知道自己在前線上。第二，教會要有接回來的路，像馬可——為曾經離開、曾經失敗的人預備一條被重新接納、也被陪伴負責的路。第三，教會的家要打開，像寧法——家庭聚會、小組、把自己的客廳交給主。第四，領受的要傳下去，像那封念完就交給老底嘉的信——每一份造就人的材料，都要問：下一個讀它的人是誰？321 的「235」不是先畫好的表格，是在這樣的一群人身上長出來的。"},"grp":["【一、破冰】你收過最難忘的一封信、一張卡片或一則訊息是甚麼？是誰寫給你的？你現在還留著它嗎？為甚麼？","【二、扎心】「你們作主人的，要公公平平地待僕人，因為知道你們也有一位主在天上。」（4:1）說出一位天天替你做事、地位比你低的人（家裡的幫傭、公司的助理、大樓的管理員、外送員）。你知道他的全名嗎？你最近一次對他說話，語氣像對一個「與你站在同一位主面前」的人嗎？","【三、福音】「我又打發一位親愛忠心的兄弟阿尼西謀同去；他也是你們那裡的人。」（4:9）一個逃跑的奴僕，被稱為「親愛忠心的兄弟」。說一件事：在你生命裡，哪一次你以為自己會被定罪、被拒絕，卻被主、或被一位弟兄姊妹重新叫回「自己人」？那是在哪一年、甚麼地方？","【四、行動】說出一位你身邊的「外人」的名字或稱呼（同事、鄰居、家族長輩），這一週你要哪一天為他禱告、哪一天找一個時刻陪他坐十分鐘；再說出一位曾經離開教會或小組、你要在這一週聯絡的人，以及你會用甚麼方式（電話、訊息、一起吃飯）聯絡他。","【五、代禱】為四種人指名禱告：一位正在被老闆或主管苛待、在職場被霸凌的弟兄姊妹；一位你們小組想傳福音、卻還沒有開門的朋友，求神開門，也求我們說話有恩典、有鹽；一位曾經在服事裡受傷、放下了職分的同工，求主安慰他，也在合宜的時候重新託付他；以及一間在受逼迫之地、或有肢體為信仰坐監的教會——記念他們的捆鎖。"],"prac":{"main":"這一週，照第四章的次序走一遍：先禱告感恩，再用調了鹽的話說話，再回到主交給我的那一份，並且記念戴鎖鍊的人。","items":["對神：每天晚上用五分鐘恆切禱告：先說三件今天要感謝的事，再為一位「外人」求神開門，最後為一位在受逼迫之地的肢體或一間被限制的教會禱告。七天寫在同一頁，週末讀一次，看神怎樣回應。","對自己：找出你已經放下、卻知道是從主領受的一份服事（一個小組、一個關懷名單、一個代禱的承諾、一份奉獻），寫下你放下它的原因；若是因為受傷，告訴一位牧者；若只是因為懶散或忙碌，這一週做一件小事把它撿回來。","對人：寫下家裡或公司一位天天替你做事的人的全名，這一週當面謝謝他一次；若你是老闆或主管，檢查一次你給員工、移工或外傭的工資、休假、加班費與保險是否按時、按約、按法給足。","對生活：這一週在網路或群組裡回應任何與信仰、政治、社會議題有關的話以前，先停一下問自己：這句話有恩典嗎？是鹽還是辣椒？不確定的，就不按送出。家族聚會若被問到信仰，先問一句「你為甚麼這樣問」，再回答。","對使命：把一份這個月最造就你的屬靈材料（一段經文、一篇講章、一本書），像那封傳到老底嘉的信一樣，交給一位你的「2」；同時聯絡一位曾經離開小組或教會的人，不問他為甚麼離開，只告訴他：我們記得你。"]},"safe":["① 讀 3:22--25 只對員工講「從心裡做」「像是給主做的」，略過 4:1 對主人的那一句；或把順服講成要員工忍受苛扣、霸凌與無償加班。","4:1 是家規的最後一句，主人頭上也有一位主；「公公平平」包括公道與對等。職場的順從不包括配合違法、忍受霸凌、替公司作假（紅線四；全卷立場見 ISS00_5）。","檢驗標準：你有沒有把 3:22 讀到 4:1？一位在職場被主管言語霸凌的弟兄姊妹聽完，是知道可以尋求保護，還是覺得要更忍耐？","② 用處境取消原則：「4:1 是寫給第一世紀奴隸主的，跟今天的老闆無關」；或反過來說「保羅沒有叫腓利門釋放奴隸，所以聖經贊成奴隸制」。","書信三問的第三問要走完：處境是一個可以買賣人的社會，原則是主人與奴僕在同一位主面前、要公道也要對等；福音沒有一夕推翻奴隸制，但把主人和奴僕放在同一張主的桌子上，鬆動了那個制度的根（全卷立場見 ISS00_1、ISS00_5）。","檢驗標準：你有沒有說出，這個原則今天落在誰身上——老闆、主管、僱用移工與外傭的家庭——並說出判斷的理由？","③ 把 4:3--6 講成業績式、施壓式的傳福音：訂人數目標、公開表揚帶最多人決志的人，或教會友抓住人不放、逼他當場禱告。","門是「求神給我們開」的，主詞是神；保羅這位最會傳福音的人，第一個動作是請人為他禱告。「用智慧」「帶著和氣」「回答各人」，每一個人都不一樣；施壓會讓福音的味道變成推銷的味道（紅線八）。","檢驗標準：會眾聽完，是更願意為朋友禱告、更有耐心陪他，還是更焦慮自己這個月還沒有「成果」？","④ 用 4:14 底馬恐嚇會眾：「你若不夠火熱、若太愛工作賺錢，就會像底馬一樣離棄主」，或替底馬下了沉淪的結論。","4:14 的底馬還在名單裡，還問安；他的離開是提後 4:10 的事，本卷只說「這使我們想起」。經文沒有說他後來怎樣，我們不作人身判斷；同一份名單裡也有被接回來的馬可（紅線八；議題頁並陳）。","檢驗標準：一位最近信心冷淡、正在掙扎要不要回教會的人聽完，是更想回來，還是更確定自己沒有希望了？","⑤ 把 4:5「愛惜光陰」講成效率主義：要會友把每一分鐘都排滿事工，把休息、安息、陪家人講成浪費時間。","「愛惜光陰」原文是把 καιρός（kairos）買回來，是看見合宜的時刻，不是把時鐘塞滿；一個被行事曆塞滿的人，反而買不到任何時機。安息不是律法，是恩典，原則仍在（全卷立場見 ISS00_3）。","檢驗標準：一位已經過勞、在教會身兼數職的同工聽完，是更有罪疚感，還是知道可以停下來、看見真正重要的那一個時刻？","⑥ 把 4:6「用鹽調和」講成尖酸、機智、嗆聲：在講台或網路上嘲笑耶和華見證人、其他宗教或不信的人，說這叫「有鹽」。","先有恩典，才有鹽；鹽是保存與提味，不是辣椒。嘲笑與攻擊持不同信仰的人，正違反 4:5--6 用智慧與外人交往的命令（紅線一、八；全卷立場見 ISS00_2）。","檢驗標準：如果那位你提到的外人就坐在會眾席上，他聽完，是感到被尊重，還是被羞辱？","⑦ 把「回答各人」講成一套萬用話術：發一份背好的福音稿，教會友不管對方是剛失去親人、剛失業、還是學者，都照稿念。","4:6 說的是「各人」，原文是一個、一個；而且是「回答」，對方先開口。準備是需要的，但準備的是自己的心與對基督的認識，不是一套操控對話的技巧。","檢驗標準：你教會友的，是怎樣聽懂一個人真正在問甚麼，還是怎樣在三分鐘內把話題轉到決志？","⑧ 用 4:10「你們就接待他」要求受傷的人立刻接納傷害過他的人：「保羅都接待馬可了，你也要馬上和好、不要再提」；或反過來，把曾經失敗的人永遠貼上「靠不住」的標籤。","接納馬可是保羅經過時間、也看見改變後的事；腓利門書裡，保羅願意替阿尼西謀賠償，接納不等於假裝甚麼都沒發生。若涉及暴力、性侵或權勢濫用，先保護受害者，饒恕不等於恢復原職（回指哥林多後書立場四）。","檢驗標準：教會的「接納」，是同時保護了受傷的人、也給了犯錯的人一條負責任的回頭路，還是只要求弱勢的那一方閉嘴？","⑨ 把 4:12 以巴弗「竭力地祈求」講成禱告的功德與比較：誰禱告時數多、誰通宵禁食，誰就比較屬靈、禱告比較會蒙應允。","ἀγωνιζόμενος（agōnizomenos）是摔跤，說的是愛的用力，不是累積點數；以巴弗求的是別人「能站立得穩」，不是自己的屬靈名聲。把禱告變成成績，正是本卷警告的「基督＋」（全卷立場見 ISS00_3）。","檢驗標準：一位只能在病床上斷斷續續禱告的長輩聽完，是知道自己也在前線上，還是覺得自己的禱告不夠格？","⑩ 為了某一種教會體制的立場，把 4:15 的寧法講成男人、跳過「她家裡的教會」；或反過來，只憑這一節就宣告所有關於女性服事的爭論都已解決。","SBLGNT 與和合本作女性「她」，女性讀法也是較難的讀法，寧法是一位姊妹，教會在她家裡聚集；但她在聚會中的角色，經文沒有細說。女性帶領的討論，議題頁另有並陳。","檢驗標準：你有沒有照經文說出「她」，並且把一位打開家門的姊妹當作福音的同工來尊重，又沒有替經文多說它沒有說的話？","⑪ 宣稱「失傳的老底嘉書信」已經被找到，或把後世偽託的《老底嘉書》、某本「祕傳書信」當作與聖經同等的啟示。","「從老底嘉來的書信」在哪裡，我們不知道；有人以為是以弗所書，可能，但不能確定。教會從來沒有接納偽託的《老底嘉書》；遺失的那一封，不使我們手上這一封少一分權威。宣稱握有「另一封祕傳的信」，正是歌羅西異端那種「基督＋祕密知識」。","檢驗標準：會眾聽完，是更珍惜手上的這本聖經、更願意一代一代讀下去，還是更好奇有沒有「更深的祕密」？","⑫ 用 4:17 在聚會中公開點名羞辱一位放下服事的同工：「亞基布失職了，你也一樣」；或把「做滿職分」講成不准休息、不准卸任、做到倒下為止。","經文沒有說亞基布失職，我們也不猜；保羅叫全教會一起對他說，是群體的託付，不是公開審判。職分是「從主所受」的，做滿的標準也在主那裡；過勞與燃盡不是忠心的證明。","檢驗標準：一位剛卸下服事、心裡很累的同工聽完，是知道有人和他一起看著主的託付，還是覺得自己被當眾定罪？","⑬ 用 4:18「記念我的捆鎖」美化受苦，要人留在受虐、被剝削或不安全的處境裡：「保羅都戴著鎖鍊了，你被打一下算甚麼」。","保羅的鎖鍊是為福音受的苦，不是留在虐待中的理由；分清楚「為福音受苦」與「留在暴力裡」。遇到家庭或職場的暴力，先保護安全，協助尋求專業協助（紅線四、五）。","檢驗標準：一位正在家裡或職場受暴的人聽完，是更確知可以求助、可以離開危險，還是覺得受苦越多越屬靈？","⑭ 把 4:7--17 講成 321「235」的插圖：先畫好「2、3、5」的格子，再把十個名字硬塞進去，或用這份名單替教會裡的人排等級。","次序是經文先講：送信的、回家的、坐監的、被接回來的、摔跤禱告的、打開家門的、受職分的；福音先在這些人身上做工，321 才在末端認出那張照片（鐵律五）。名單裡沒有誰比誰高。","檢驗標準：會眾聽完，記住的是一套團契的數字，還是那位把一個逃跑的奴僕改名為「兄弟」的主？"]}],"txt":{"1":["奉神旨意，作基督耶穌使徒的保羅和兄弟提摩太","寫信給歌羅西的聖徒，在基督裡有忠心的弟兄。願恩惠、平安從神我們的父歸與你們！","我們感謝神我們主耶穌基督的父，常常為你們禱告；","因聽見你們在基督耶穌裡的信心，並向眾聖徒的愛心，","是為那給你們存在天上的盼望；這盼望就是你們從前在福音真理的道上所聽見的。","這福音傳到你們那裡，也傳到普天之下，並且結果，增長，如同在你們中間，自從你們聽見福音，真知道神恩惠的日子一樣。","正如你們從我們所親愛、一同作僕人的以巴弗所學的。他為我們作了基督忠心的執事，","也把你們因聖靈所存的愛心告訴了我們。","因此，我們自從聽見的日子，也就為你們不住地禱告祈求，願你們在一切屬靈的智慧悟性上，滿心知道神的旨意；","好叫你們行事為人對得起主，凡事蒙他喜悅，在一切善事上結果子，漸漸地多知道神；","照他榮耀的權能，得以在各樣的力上加力，好叫你們凡事歡歡喜喜地忍耐寬容；","又感謝父，叫我們能與眾聖徒在光明中同得基業。","他救了我們脫離黑暗的權勢，把我們遷到他愛子的國裡；","我們在愛子裡得蒙救贖，罪過得以赦免。","愛子是那不能看見之神的像，是首生的，在一切被造的以先。","因為萬有都是靠他造的，無論是天上的，地上的；能看見的，不能看見的；或是有位的，主治的，執政的，掌權的；一概都是藉著他造的，又是為他造的。","他在萬有之先；萬有也靠他而立。","他也是教會全體之首。他是元始，是從死裡首先復生的，使他可以在凡事上居首位。","因為父喜歡叫一切的豐盛在他裡面居住。","既然藉著他在十字架上所流的血成就了和平，便藉著他叫萬有－無論是地上的、天上的－都與自己和好了。","你們從前與神隔絕，因著惡行，心裡與他為敵。","但如今他藉著基督的肉身受死，叫你們與自己和好，都成了聖潔，沒有瑕疵，無可責備，把你們引到自己面前。","只要你們在所信的道上恆心，根基穩固，堅定不移，不致被引動失去福音的盼望。這福音就是你們所聽過的，也是傳與普天下萬人聽的，我－保羅也作了這福音的執事。","現在我為你們受苦，倒覺歡樂；並且為基督的身體，就是為教會，要在我肉身上補滿基督患難的缺欠。","我照神為你們所賜我的職分作了教會的執事，要把神的道理傳得全備，","這道理就是歷世歷代所隱藏的奧祕；但如今向他的聖徒顯明了。","神願意叫他們知道，這奧祕在外邦人中有何等豐盛的榮耀，就是基督在你們心裡成了有榮耀的盼望。","我們傳揚他，是用諸般的智慧，勸戒各人，教導各人，要把各人在基督裡完完全全地引到神面前。","我也為此勞苦，照著他在我裡面運用的大能盡心竭力。"],"2":["我願意你們曉得，我為你們和老底嘉人，並一切沒有與我親自見面的人，是何等地盡心竭力；","要叫他們的心得安慰，因愛心互相聯絡，以致豐豐足足在悟性中有充足的信心，使他們真知神的奧祕，就是基督；","所積蓄的一切智慧知識，都在他裡面藏著。","我說這話，免得有人用花言巧語迷惑你們。","我身子雖與你們相離，心卻與你們同在，見你們循規蹈矩，信基督的心也堅固，我就歡喜了。","你們既然接受了主基督耶穌，就當遵他而行，","在他裡面生根建造，信心堅固，正如你們所領的教訓，感謝的心也更增長了。","你們要謹慎，恐怕有人用他的理學和虛空的妄言，不照著基督，乃照人間的遺傳和世上的小學就把你們擄去。","因為神本性一切的豐盛都有形有體地居住在基督裡面，","你們在他裡面也得了豐盛。他是各樣執政掌權者的元首。","你們在他裡面也受了不是人手所行的割禮，乃是基督使你們脫去肉體情慾的割禮。","你們既受洗與他一同埋葬，也就在此與他一同復活，都因信那叫他從死裡復活神的功用。","你們從前在過犯和未受割禮的肉體中死了，神赦免了你們一切過犯，便叫你們與基督一同活過來；","又塗抹了在律例上所寫、攻擊我們、有礙於我們的字據，把它撤去，釘在十字架上。","既將一切執政的、掌權的擄來，明顯給眾人看，就仗著十字架誇勝。","所以，不拘在飲食上，或節期、月朔、安息日都不可讓人論斷你們。","這些原是後事的影兒；那形體卻是基督。","不可讓人因著故意謙虛和敬拜天使，就奪去你們的獎賞。這等人拘泥在所見過的，隨著自己的慾心，無故地自高自大，","不持定元首。全身既然靠著他，筋節得以相助聯絡，就因神大得長進。","你們若是與基督同死，脫離了世上的小學，為甚麼仍像在世俗中活著、服從那「不可拿、不可嘗、不可摸」等類的規條呢？","〔和合本與上節合譯，見 2:20〕","這都是照人所吩咐、所教導的。說到這一切，正用的時候就都敗壞了。","這些規條使人徒有智慧之名，用私意崇拜，自表謙卑，苦待己身，其實在克制肉體的情慾上是毫無功效。"],"3":["所以，你們若真與基督一同復活，就當求在上面的事；那裡有基督坐在神的右邊。","你們要思念上面的事，不要思念地上的事。","因為你們已經死了，你們的生命與基督一同藏在神裡面。","基督是我們的生命，他顯現的時候，你們也要與他一同顯現在榮耀裡。","所以，要治死你們在地上的肢體，就如淫亂、污穢、邪情、惡慾，和貪婪（貪婪就與拜偶像一樣）。","因這些事，神的忿怒必臨到那悖逆之子。","當你們在這些事中活著的時候，也曾這樣行過。","但現在你們要棄絕這一切的事，以及惱恨、忿怒、惡毒、毀謗，並口中污穢的言語。","不要彼此說謊；因你們已經脫去舊人和舊人的行為，","穿上了新人。這新人在知識上漸漸更新，正如造他主的形像。","在此並不分希臘人、猶太人，受割禮的、未受割禮的，化外人、西古提人，為奴的、自主的，惟有基督是包括一切，又住在各人之內。","所以，你們既是神的選民，聖潔蒙愛的人，就要存憐憫、恩慈、謙虛、溫柔、忍耐的心。","倘若這人與那人有嫌隙，總要彼此包容，彼此饒恕；主怎樣饒恕了你們，你們也要怎樣饒恕人。","在這一切之外，要存著愛心，愛心就是聯絡全德的。","又要叫基督的平安在你們心裡作主；你們也為此蒙召，歸為一體；且要存感謝的心。","當用各樣的智慧，把基督的道理豐豐富富地存在心裡，用詩章、頌詞、靈歌，彼此教導，互相勸戒，心被恩感，歌頌神。","無論做甚麼，或說話或行事，都要奉主耶穌的名，藉著他感謝父神。","你們作妻子的，當順服自己的丈夫，這在主裡面是相宜的。","你們作丈夫的，要愛你們的妻子，不可苦待她們。","你們作兒女的，要凡事聽從父母，因為這是主所喜悅的。","你們作父親的，不要惹兒女的氣，恐怕他們失了志氣。","你們作僕人的，要凡事聽從你們肉身的主人，不要只在眼前事奉，像是討人喜歡的，總要存心誠實敬畏主。","無論做甚麼，都要從心裡做，像是給主做的，不是給人做的，","因你們知道從主那裡必得著基業為賞賜；你們所事奉的乃是主基督。","那行不義的必受不義的報應；主並不偏待人。"],"4":["你們作主人的，要公公平平地待僕人，因為知道你們也有一位主在天上。","你們要恆切禱告，在此警醒感恩。","也要為我們禱告，求神給我們開傳道的門，能以講基督的奧祕（我為此被捆鎖），","叫我按著所該說的話將這奧祕發明出來。","你們要愛惜光陰，用智慧與外人交往。","你們的言語要常常帶著和氣，好像用鹽調和，就可知道該怎樣回答各人。","有我親愛的兄弟推基古要將我一切的事都告訴你們。他是忠心的執事，和我一同作主的僕人。","我特意打發他到你們那裡去，好叫你們知道我們的光景，又叫他安慰你們的心。","我又打發一位親愛忠心的兄弟阿尼西謀同去；他也是你們那裡的人。他們要把這裡一切的事都告訴你們。","與我一同坐監的亞里達古問你們安。巴拿巴的表弟馬可也問你們安。（說到這馬可，你們已經受了吩咐；他若到了你們那裡，你們就接待他。）","耶數又稱為猶士都，也問你們安。奉割禮的人中，只有這三個人是為神的國與我一同做工的，也是叫我心裡得安慰的。","有你們那裡的人，作基督耶穌僕人的以巴弗問你們安。他在禱告之間，常為你們竭力地祈求，願你們在神一切的旨意上得以完全，信心充足，能站立得穩。","他為你們和老底嘉並希拉坡里的弟兄多多地勞苦，這是我可以給他作見證的。","所親愛的醫生路加和底馬問你們安。","請問老底嘉的弟兄和寧法，並她家裡的教會安。","你們念了這書信，便交給老底嘉的教會，叫他們也念；你們也要念從老底嘉來的書信。","要對亞基布說：「務要謹慎，盡你從主所受的職分。」","我－保羅親筆問你們安。你們要記念我的捆鎖。願恩惠常與你們同在！"]},"blk":{"1":[{"a":1,"z":2,"star":1,"grk":"<p lang=\"grc\">Παῦλος ἀπόστολος Χριστοῦ Ἰησοῦ διὰ θελήματος θεοῦ καὶ Τιμόθεος ὁ ἀδελφὸς</p><p lang=\"grc\">τοῖς ἐν Κολοσσαῖς ἁγίοις καὶ πιστοῖς ἀδελφοῖς ἐν Χριστῷ· χάρις ὑμῖν καὶ εἰρήνη ἀπὸ θεοῦ πατρὸς ἡμῶν</p>","lit":"<p>保羅，基督耶穌的使徒，藉著神的旨意，和提摩太那弟兄，</p><p>給在歌羅西的聖徒，就是在基督裡忠信的弟兄們：恩典給你們，和平安，從神我們的父。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>διὰ θελήματος θεοῦ</td><td>dia thelēmatos theou</td><td>藉著神的旨意</td><td>使徒職分的來源</td></tr><tr><td>Τιμόθεος ὁ ἀδελφὸς</td><td>Timotheos ho adelphos</td><td>那弟兄提摩太</td><td>同署名，不是同作者</td></tr><tr><td>ἁγίοις καὶ πιστοῖς ἀδελφοῖς</td><td>hagiois kai pistois adelphois</td><td>聖徒與忠信的弟兄</td><td>一個冠詞，兩個身分</td></tr><tr><td>ἐν Κολοσσαῖς</td><td>en Kolossais</td><td>在歌羅西</td><td>地上的地址</td></tr><tr><td>ἐν Χριστῷ</td><td>en Christō</td><td>在基督裡</td><td>真正的地址</td></tr></table>","gram":"<p><strong>1:1–2 是希臘書信標準的問安格式，保羅卻在每一格裡都放進了基督。</strong>Παῦλος ἀπόστολος Χριστοῦ Ἰησοῦ（Paulos apostolos Christou Iēsou） 之後緊接 διὰ θελήματος θεοῦ（dia thelēmatos theou）：使徒職分不是自封的，是神旨意的結果。Τιμόθεος ὁ ἀδελφὸς（Timotheos ho adelphos） 同署名，但全信的「我」（1:23「我－保羅」、1:24）是保羅一人，提摩太是同工，不是共同作者。</p><p>τοῖς ἐν Κολοσσαῖς ἁγίοις καὶ πιστοῖς ἀδελφοῖς（tois en Kolossais hagiois kai pistois adelphois） 只用一個冠詞統攝兩個形容詞，讀法有二：一說「聖徒」是名詞，「忠信的弟兄」是同位語；一說兩者都是形容「弟兄」的。本講義跟和合本，讀成同一群人的兩個名字：被神分別出來的，也是對神忠信的。兩個地址並列：ἐν Κολοσσαῖς（en Kolossais） 與 ἐν Χριστῷ（en Christō）。問安只有 ἀπὸ θεοῦ πατρὸς ἡμῶν（apo theou patros hēmōn），沒有「和主耶穌基督」——保羅書信裡少見的短問安；晚期抄本補上，和合本跟批判本。</p>","exp":"<p>歌羅西是呂克斯河谷裡的小城。它在保羅的時代已經沒落，被下游的老底嘉與對岸的希拉坡里比下去；今天連遺址都還沒有完整發掘。保羅一生沒有去過這裡（2:1）。可是一封寫給沒落小城的信，開頭就說：你們有兩個地址，「寫信給歌羅西的聖徒，在基督裡有忠心的弟兄」（1:2）。</p><p>一個地址決定你住在哪裡，另一個地址決定你屬於誰。歌羅西人每天住在第一個地址：市場、神廟、同業公會、各種哲學和規矩。這封信要做的，是讓他們重新住進第二個地址。整封信的問題就藏在這裡——有人想要在「在基督裡」之外，再給他們加一個地址。</p><p>「聖徒」不是少數人的頭銜，是一整間教會的名字；「忠心」不是成績，是方向。保羅還沒有開始責備，先叫他們的名字。牧養一間有問題的教會，第一步不是糾錯，是提醒他們是誰。今天住在小城、小公司、小教會裡的人，也有同一個第二地址：在基督裡。</p>"},{"a":3,"z":5,"star":2,"grk":"<p lang=\"grc\">Εὐχαριστοῦμεν τῷ θεῷ πατρὶ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ πάντοτε περὶ ὑμῶν προσευχόμενοι,</p><p lang=\"grc\">ἀκούσαντες τὴν πίστιν ὑμῶν ἐν Χριστῷ Ἰησοῦ καὶ τὴν ἀγάπην ἣν ἔχετε εἰς πάντας τοὺς ἁγίους</p><p lang=\"grc\">διὰ τὴν ἐλπίδα τὴν ἀποκειμένην ὑμῖν ἐν τοῖς οὐρανοῖς, ἣν προηκούσατε ἐν τῷ λόγῳ τῆς ἀληθείας τοῦ εὐαγγελίου</p>","lit":"<p>我們感謝神，就是我們主耶穌基督的父，總是為你們禱告，</p><p>既聽見了你們在基督耶穌裡的信心，和你們向所有聖徒所存的愛，</p><p>因著那為你們存放在諸天裡的盼望，就是你們先前在福音真理的話語裡聽見的，</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Εὐχαριστοῦμεν</td><td>Eucharistoumen</td><td>我們感謝</td><td>全卷第一個感謝；四章都有</td></tr><tr><td>πάντοτε περὶ ὑμῶν προσευχόμενοι</td><td>pantote peri hymōn proseuchomenoi</td><td>總是為你們禱告</td><td>現在分詞：感謝伴隨禱告</td></tr><tr><td>τὴν πίστιν</td><td>tēn pistin</td><td>信心</td><td>在基督耶穌裡</td></tr><tr><td>τὴν ἀγάπην</td><td>tēn agapēn</td><td>愛心</td><td>向著眾聖徒</td></tr><tr><td>διὰ τὴν ἐλπίδα</td><td>dia tēn elpida</td><td>因著盼望</td><td>盼望是理由</td></tr><tr><td>τὴν ἀποκειμένην</td><td>tēn apokeimenēn</td><td>被存放著的</td><td>像存在庫房裡的東西</td></tr></table>","gram":"<p><strong>1:3–5 把信、望、愛三樣放在一句裡，次序卻不是常見的「信、望、愛」，而是信、愛，然後用 διὰ（dia） 把兩者掛在盼望上。</strong></p><p>主要動詞 Εὐχαριστοῦμεν（Eucharistoumen） 後面跟著兩個分詞：προσευχόμενοι（proseuchomenoi） 是現在分詞，與感謝同時；ἀκούσαντες（akousantes） 是不定過去分詞，交代感謝的起因——聽見了。τὴν πίστιν ὑμῶν ἐν Χριστῷ Ἰησοῦ（tēn pistin hymōn en Christō Iēsou） 是信的對象，τὴν ἀγάπην ἣν ἔχετε εἰς πάντας τοὺς ἁγίους（tēn agapēn hēn echete eis pantas tous hagious） 是愛的方向；πάντας（pantas） 是本章 πᾶς（pas） 的第一次：愛是「眾」聖徒，不挑人。</p><blockquote><p>διὰ τὴν ἐλπίδα（dia tēn elpida） 的 διὰ（dia） 加受格是「因為」。它掛在哪裡？一說掛在 Εὐχαριστοῦμεν（Eucharistoumen） 上（因盼望而感謝）；多數註釋讀作掛在信與愛上：信與愛是因著盼望長出來的。本講義採後者，因為 τὴν ἀποκειμένην（tēn apokeimenēn） 說明盼望已經「存放」在天上，是信與愛的根據。ἐλπίς（elpis） 在這裡不是心理上的期待，是客觀被保存的內容；ἣν προηκούσατε（hēn proēkousate） 的「先前聽見」，暗示在錯謬教訓出現以前，他們已經聽過完整的福音。</p></blockquote>","exp":"<p>保羅坐在監裡，聽到一間沒見過的教會的消息，第一個反應是感謝。「我們感謝神我們主耶穌基督的父，常常為你們禱告」（1:3）。全卷四章都有感謝，第一個就在這裡。歌羅西的問題還沒有提，感謝先說；這不是外交辭令，是保羅看人的次序：先看神在他們身上已經作成的。</p><p>他聽見三件事：「你們在基督耶穌裡的信心，並向眾聖徒的愛心」（1:4），還有「那給你們存在天上的盼望」（1:5）。信向上，愛向旁邊，盼望向前。保羅說信與愛「是為」那盼望——盼望是根，信與愛是從根上長出來的枝子。</p><p>「存在天上」是一個保險庫的畫面。盼望不是一種情緒，今天好、明天壞；它是一筆已經存好、有人看守的產業。一個知道自己在天上有存款的人，在地上就不必搶。這正是歌羅西人需要的：有人告訴他們還缺一樣，保羅卻提醒他們，該有的早就存好了。</p><p>「這盼望就是你們從前在福音真理的道上所聽見的」（1:5）。不是新的消息，是「從前」聽見的。面對任何「進階版」的教導，第一個問題是：它和我最初聽見的福音是同一個嗎？如果它要我覺得從前聽的不夠，它多半不是更深，而是走偏了。</p>"},{"a":6,"z":8,"star":2,"grk":"<p lang=\"grc\">τοῦ παρόντος εἰς ὑμᾶς, καθὼς καὶ ἐν παντὶ τῷ κόσμῳ ἐστὶν καρποφορούμενον καὶ αὐξανόμενον καθὼς καὶ ἐν ὑμῖν, ἀφʼ ἧς ἡμέρας ἠκούσατε καὶ ἐπέγνωτε τὴν χάριν τοῦ θεοῦ ἐν ἀληθείᾳ·</p><p lang=\"grc\">καθὼς ἐμάθετε ἀπὸ Ἐπαφρᾶ τοῦ ἀγαπητοῦ συνδούλου ἡμῶν ὅς ἐστιν πιστὸς ὑπὲρ ἡμῶν διάκονος τοῦ Χριστοῦ,</p><p lang=\"grc\">ὁ καὶ δηλώσας ἡμῖν τὴν ὑμῶν ἀγάπην ἐν πνεύματι.</p>","lit":"<p>那福音來到你們這裡，正如在全世界也是正在結果子並生長，正如在你們中間也是，從你們聽見並在真理中認識了神恩典的那日起；</p><p>正如你們從以巴弗學了的，他是我們親愛的同作奴僕者，他是為著我們、基督忠信的執事，</p><p>他也向我們說明了你們在靈裡的愛。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>καρποφορούμενον καὶ αὐξανόμενον</td><td>karpophoroumenon kai auxanomenon</td><td>結果子並生長</td><td>1:10 同一組字</td></tr><tr><td>ἐν παντὶ τῷ κόσμῳ</td><td>en panti tō kosmō</td><td>在全世界</td><td>福音的範圍</td></tr><tr><td>ἐπέγνωτε</td><td>epegnōte</td><td>真知道了</td><td>認識恩典是起點</td></tr><tr><td>Ἐπαφρᾶ</td><td>Epaphra</td><td>以巴弗</td><td>歌羅西人；教會的建立者</td></tr><tr><td>συνδούλου</td><td>syndoulou</td><td>同作奴僕的</td><td>保羅不說「我的助手」</td></tr><tr><td>ὑπὲρ ἡμῶν</td><td>hyper hēmōn</td><td>為著我們</td><td>代替保羅去的</td></tr><tr><td>ἐν πνεύματι</td><td>en pneumati</td><td>在靈裡</td><td>和合本補「聖」字</td></tr></table>","gram":"<p><strong>1:6 的 καρποφορούμενον καὶ αὐξανόμενον（karpophoroumenon kai auxanomenon） 是本章的一組關鍵字。</strong>主詞是福音：福音自己在結果子、在長。καρποφορούμενον（karpophoroumenon） 是中間語態，「自己結出」；這是新約唯一一次用中間語態，彷彿福音本身就有生命。1:10 同一組字回來（καρποφοροῦντες καὶ αὐξανόμενοι（karpophorountes kai auxanomenoi）），主詞換成信徒——福音在長，也叫人長。</p><p>ἐπέγνωτε τὴν χάριν τοῦ θεοῦ ἐν ἀληθείᾳ（epegnōte tēn charin tou theou en alētheia） 是本章「知道」的第一站：他們一開始認識的就是恩典，不是方法。1:7 的 Ἐπαφρᾶ（Epaphra） 可能是「以巴弗提」一名的縮寫形式，但與腓立比書的以巴弗提（腓 2:25）是不同的人。τοῦ ἀγαπητοῦ συνδούλου ἡμῶν（tou agapētou syndoulou hēmōn）：保羅稱他「同作奴僕的」，把自己放在與他同一個身分上。</p><blockquote><p>◆ 1:7 πιστὸς ὑπὲρ ἡμῶν διάκονος（pistos hyper hēmōn diakonos）：和合本註腳說「為我們」有古卷作「你們」。SBLGNT 作 ἡμῶν（hēmōn），與 WH、Treg 同；NA28、RP 作 ὑμῶν（hymōn）。和合本與 SBLGNT 同。讀「為我們」，意思是以巴弗代替保羅去了歌羅西——保羅沒去過的地方，他的同工替他去了。1:8 ἐν πνεύματι（en pneumati） 只有「在靈裡」，和合本「聖靈」的「聖」是小字補的；這是全卷唯一一次提到靈。</p></blockquote>","exp":"<p>〔背景〕徒 19:10（使徒行傳講義第 19 章）</p><p>使徒行傳講義第 19 章講過以弗所的推喇奴學房：保羅在那裡天天講論，「這樣有兩年之久，叫一切住在亞細亞的……都聽見主的道」（徒 19:10）。保羅沒有走遍亞細亞，是學房裡的人走回自己的城。以巴弗大概就是其中一位：在以弗所聽了福音，回到兩百公里外的家鄉歌羅西，建立了教會（4:12–13）。</p><p>所以保羅說「這福音傳到你們那裡，也傳到普天之下，並且結果，增長」（1:6）。福音像一棵會自己長的樹。保羅沒有種在歌羅西，樹卻長到了歌羅西。這是 321「繁殖」最早的一張照片：一個人在城裡被教，回家去教別人。體系不是從總部向外擴張，是從一個個被福音改變的人向外結果子。</p><p>保羅怎樣稱呼這位建立者？「我們所親愛、一同作僕人的以巴弗」（1:7）。不是「我的學生」，不是「我的分會負責人」，是同作奴僕的。然後他說以巴弗「也把你們因聖靈所存的愛心告訴了我們」（1:8）。以巴弗千里迢迢來到羅馬，帶來的消息一半讓人擔心；可是他先講的，是他們的愛。一個好牧者向別人介紹自己的羊，先說他們的好。</p><p>本卷提到靈只有這一次，而且「聖」字是補的。我們不需要在歌羅西書裡硬找聖靈的教導；保羅要講的是另一件事——基督已經夠了。</p>"},{"a":9,"z":10,"star":2,"grk":"<p lang=\"grc\">Διὰ τοῦτο καὶ ἡμεῖς, ἀφʼ ἧς ἡμέρας ἠκούσαμεν, οὐ παυόμεθα ὑπὲρ ὑμῶν προσευχόμενοι καὶ αἰτούμενοι ἵνα πληρωθῆτε τὴν ἐπίγνωσιν τοῦ θελήματος αὐτοῦ ἐν πάσῃ σοφίᾳ καὶ συνέσει πνευματικῇ,</p><p lang=\"grc\">περιπατῆσαι ἀξίως τοῦ κυρίου εἰς πᾶσαν ἀρεσκείαν ἐν παντὶ ἔργῳ ἀγαθῷ καρποφοροῦντες καὶ αὐξανόμενοι τῇ ἐπιγνώσει τοῦ θεοῦ,</p>","lit":"<p>因此，我們也是，從我們聽見的那日起，不停止為你們禱告並祈求，使你們被充滿，認識他的旨意，在一切屬靈的智慧和悟性裡，</p><p>好行走配得上主，達到一切的討喜，在一切善工上結果子並生長，藉著對神的認識，</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>οὐ παυόμεθα</td><td>ou pauometha</td><td>我們不停止</td><td>持續的禱告</td></tr><tr><td>ἵνα πληρωθῆτε</td><td>hina plērōthēte</td><td>使你們被充滿</td><td>被動：神來充滿</td></tr><tr><td>τὴν ἐπίγνωσιν τοῦ θελήματος αὐτοῦ</td><td>tēn epignōsin tou thelēmatos autou</td><td>對他旨意的認識</td><td>認識，不是猜測</td></tr><tr><td>σοφίᾳ καὶ συνέσει πνευματικῇ</td><td>sophia kai synesei pneumatikē</td><td>屬靈的智慧和悟性</td><td>智慧是禱告的內容</td></tr><tr><td>περιπατῆσαι ἀξίως τοῦ κυρίου</td><td>peripatēsai axiōs tou kyriou</td><td>行走配得上主</td><td>知道是為了走</td></tr><tr><td>καρποφοροῦντες καὶ αὐξανόμενοι</td><td>karpophorountes kai auxanomenoi</td><td>結果子並生長</td><td>1:6 的字回來了</td></tr></table>","gram":"<p><strong>◆ 1:9–20 原文是一條一路接下去的長句，約兩百一十八個字，比弗 1:3–14 還長。</strong>骨架有三層：<strong>禱告</strong>（1:9–12：οὐ παυόμεθα（ou pauometha）……προσευχόμενοι καὶ αἰτούμενοι ἵνα πληρωθῆτε（proseuchomenoi kai aitoumenoi hina plērōthēte），然後四個分詞）→ <strong>救恩</strong>（1:13–14：ὃς ἐρρύσατο（hos errysato），關係代名詞把「父」轉成救恩的主詞）→ <strong>基督之歌</strong>（1:15–20：ὅς ἐστιν（hos estin），又一個關係代名詞，把「愛子」轉成詩的主詞）。禱告一路滑進救恩，救恩一路滑進詩歌——保羅禱告禱到後來，停不下來地讚美基督。</p><p>ἵνα πληρωθῆτε（hina plērōthēte） 是被動：被神充滿。πληρόω（plēroō） 這個字根在全卷很重要：1:19 豐盛住在基督裡，2:9–10 你們在他裡面也得了豐盛。錯謬教師大概說：你們還不夠滿。保羅一開口就禱告：願你們被充滿——但充滿的內容是 τὴν ἐπίγνωσιν τοῦ θελήματος αὐτοῦ（tēn epignōsin tou thelēmatos autou），對神旨意的認識，而且是 ἐν πάσῃ σοφίᾳ καὶ συνέσει πνευματικῇ（en pasē sophia kai synesei pneumatikē）。σοφίᾳ（sophia） 是本章「智慧」的第一次；πνευματικῇ（pneumatikē） 是形容詞「屬靈的」。</p><p>1:10 的不定詞 περιπατῆσαι（peripatēsai） 交代目的：知道是為了走。ἀξίως τοῦ κυρίου（axiōs tou kyriou） 是「配得上主」；接著 καρποφοροῦντες καὶ αὐξανόμενοι（karpophorountes kai auxanomenoi） 是 1:6 那組字從福音轉到信徒身上。τῇ ἐπιγνώσει τοῦ θεοῦ（tē epignōsei tou theou） 是工具與格：藉著認識神而生長。</p>","exp":"<p>「因此，我們自從聽見的日子，也就為你們不住地禱告祈求」（1:9）。保羅聽到歌羅西的消息以後，沒有先寫一篇駁斥異端的論文，他先禱告。而他禱告的內容，正好是錯謬教師兜售的東西：智慧、知識、屬靈的經驗。保羅不是說「不要追求智慧」，他是說：真智慧，我替你們向神求。</p><p>「願你們在一切屬靈的智慧悟性上，滿心知道神的旨意」（1:9）。這一句保護了兩件事。第一，基督教不是反智的（紅線六）；讀書、思考、研究都可以是禱告的一部分。第二，神的旨意可以「知道」——不是靠抽籤、看異象、猜測，而是在智慧悟性裡被充滿。旨意的大方向寫在經上；具體的抉擇，在禱告、聖經、屬靈同伴的印證裡慢慢清楚。</p><p>知道了要做甚麼？「好叫你們行事為人對得起主，凡事蒙他喜悅，在一切善事上結果子，漸漸地多知道神」（1:10）。知識的終點不是腦袋，是腳。真認識神的人，會在辦公室、廚房裡走得不一樣。而且這是一個循環：認識神，就結果子；結果子，又更認識神。</p><p>「漸漸地」三個字很重要。屬靈的長進是樹的速度，不是煙火的速度。有人要給歌羅西人一條捷徑；保羅只給他們一棵慢慢長大的樹。</p>"},{"a":11,"z":12,"star":1,"grk":"<p lang=\"grc\">ἐν πάσῃ δυνάμει δυναμούμενοι κατὰ τὸ κράτος τῆς δόξης αὐτοῦ εἰς πᾶσαν ὑπομονὴν καὶ μακροθυμίαν μετὰ χαρᾶς,</p><p lang=\"grc\">εὐχαριστοῦντες τῷ πατρὶ τῷ ἱκανώσαντι ὑμᾶς εἰς τὴν μερίδα τοῦ κλήρου τῶν ἁγίων ἐν τῷ φωτί,</p>","lit":"<p>在一切能力上被加能力，照著他榮耀的威力，達到一切的忍耐和恆忍，帶著喜樂，</p><p>感謝那父，就是那使你們夠資格分得聖徒在光中產業之份的；</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἐν πάσῃ δυνάμει δυναμούμενοι</td><td>en pasē dynamei dynamoumenoi</td><td>在一切能力上被加能力</td><td>同字源重疊</td></tr><tr><td>ὑπομονὴν καὶ μακροθυμίαν</td><td>hypomonēn kai makrothymian</td><td>忍耐和恆忍</td><td>對處境，也對人</td></tr><tr><td>μετὰ χαρᾶς</td><td>meta charas</td><td>帶著喜樂</td><td>忍耐不是咬牙</td></tr><tr><td>τῷ ἱκανώσαντι ὑμᾶς</td><td>tō hikanōsanti hymas</td><td>那使你們夠資格的</td><td>資格是父給的</td></tr><tr><td>τὴν μερίδα τοῦ κλήρου</td><td>tēn merida tou klērou</td><td>產業的份</td><td>像約書亞分地</td></tr></table>","gram":"<p><strong>1:11 用同字源重疊 ἐν πάσῃ δυνάμει δυναμούμενοι（en pasē dynamei dynamoumenoi），「在一切能力上被加能力」；被動，能力是神加的。</strong>κατὰ τὸ κράτος τῆς δόξης αὐτοῦ（kata to kratos tēs doxēs autou） 交代標準：照他榮耀的威力。然而這股大能的用途，出人意料地是 εἰς πᾶσαν ὑπομονὴν καὶ μακροθυμίαν（eis pasan hypomonēn kai makrothymian）——忍耐與恆忍。ὑπομονὴν（hypomonēn） 多指對處境的承受，μακροθυμίαν（makrothymian） 多指對人的寬容。μετὰ χαρᾶς（meta charas） 可以接前（歡喜地忍耐，和合本），也可以接後（歡喜地感謝）；兩讀意思相近。</p><blockquote><p>◆ 1:12 經文鑑別：SBLGNT 作 τῷ ἱκανώσαντι ὑμᾶς（使你們夠資格），與 WH、NA28 同；Treg、RP 作 ἡμᾶς（我們），和合本「叫我們」跟後者。兩字在希臘文只差一個字母，發音在當時幾乎相同，抄本常常互換。本講義判斷：ὑμᾶς（hymas） 證據稍強，與上文「你們」一貫；但 1:13 立刻轉成 ἡμᾶς（hēmas），保羅自己就在「你們」與「我們」之間來回——兩讀都不改變意思：資格是父給的。</p></blockquote>","exp":"<p>神的大能用來做甚麼？我們以為是做大事、行神蹟。保羅說：「照他榮耀的權能，得以在各樣的力上加力，好叫你們凡事歡歡喜喜地忍耐寬容」（1:11）。神最大的能力，用在人最平凡的處境裡：同一個難搞的同事、同一場拖了三年的病、同一個還沒信主的家人。能撐下去，而且帶著喜樂，這本身就是神蹟。</p><p>接著是全卷的第二個感謝：「又感謝父，叫我們能與眾聖徒在光明中同得基業」（1:12）。「叫我們能」原文是「使我們夠資格」。錯謬教師的手法，常常是讓人覺得自己不夠格——還沒有某種經驗、還沒有守某些規矩、還沒有通過某個階段。保羅說：資格已經給了，給的是父。</p><p>「基業」使我們想起以色列人進迦南時抽籤分地，每一支派都有一份。外邦的歌羅西人，現在和「眾聖徒」同得一份，而且是在「光明中」。你不必再去買一張入場券；你已經坐在裡面了。所以忍耐的盡頭不是苦悶，是感謝。</p>"},{"a":13,"z":14,"star":2,"grk":"<p lang=\"grc\">ὃς ἐρρύσατο ἡμᾶς ἐκ τῆς ἐξουσίας τοῦ σκότους καὶ μετέστησεν εἰς τὴν βασιλείαν τοῦ υἱοῦ τῆς ἀγάπης αὐτοῦ,</p><p lang=\"grc\">ἐν ᾧ ἔχομεν τὴν ἀπολύτρωσιν, τὴν ἄφεσιν τῶν ἁμαρτιῶν·</p>","lit":"<p>他救了我們脫離黑暗的權勢，並且遷移到他愛之子的國裡，</p><p>在他裡面我們有那救贖，就是罪的赦免；</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἐρρύσατο</td><td>errysato</td><td>他救了</td><td>從險境裡拉出來</td></tr><tr><td>ἐκ τῆς ἐξουσίας τοῦ σκότους</td><td>ek tēs exousias tou skotous</td><td>脫離黑暗的權勢</td><td>權勢是真的，卻被打破</td></tr><tr><td>μετέστησεν</td><td>metestēsen</td><td>遷移了</td><td>整批移民</td></tr><tr><td>τοῦ υἱοῦ τῆς ἀγάπης αὐτοῦ</td><td>tou huiou tēs agapēs autou</td><td>他愛的兒子</td><td>希伯來式屬格</td></tr><tr><td>τὴν ἀπολύτρωσιν</td><td>tēn apolytrōsin</td><td>那救贖</td><td>贖價付清的釋放</td></tr><tr><td>τὴν ἄφεσιν τῶν ἁμαρτιῶν</td><td>tēn aphesin tōn hamartiōn</td><td>罪的赦免</td><td>救贖的內容</td></tr></table>","gram":"<p><strong>1:13 以 ὃς（hos） 起頭，主詞從禱告裡的「父」轉成救恩的施行者；兩個不定過去式動詞 ἐρρύσατο（errysato） 與 μετέστησεν（metestēsen），一個是「救出」，一個是「遷入」。</strong></p><p>μετέστησεν（metestēsen） 是 μεθίστημι（methistēmi） 的不定過去式，「從一處挪到另一處」。學者常指出它的歷史背景：古代戰勝的王把一整城的人遷到自己的國土——約瑟夫記載安提阿古三世把兩千個猶太家庭從巴比倫遷到弗呂家與呂底亞，歌羅西所在的地區正是其中之一。保羅的讀者很可能就是那批移民的鄰居。</p><p>τὴν βασιλείαν τοῦ υἱοῦ τῆς ἀγάπης αὐτοῦ（tēn basileian tou huiou tēs agapēs autou） 是「他愛的兒子的國」，屬格是希伯來式說法，也可讀作「他所愛的那一位」。不定過去式說明遷移已經發生：國度不只是將來的，現在已經在其中（將來的完成仍要等 3:4）。1:14 ἐν ᾧ ἔχομεν τὴν ἀπολύτρωσιν（en hō echomen tēn apolytrōsin） 用現在式「我們有」；τὴν ἄφεσιν τῶν ἁμαρτιῶν（tēn aphesin tōn hamartiōn） 是同位語，說明救贖就是罪的赦免。SBLGNT 沒有「藉他的血」，晚期抄本從弗 1:7 補入，和合本跟批判本。</p>","exp":"<p>〔弗〕弗 1:7（以弗所書講義第 1 章）</p><p>以弗所書講義第 1 章已經講過救贖與赦免：「我們藉這愛子的血得蒙救贖，過犯得以赦免」（弗 1:7）。歌羅西書多出來的一筆，是前一節那個動作——遷移。</p><p>「他救了我們脫離黑暗的權勢，把我們遷到他愛子的國裡」（1:13）。這不是一個人偷偷越境，是整批移民。古代戰勝的王會把一整座城的人搬到自己的國土上，讓他們在新的地方落戶、耕種、成為新王的子民。神不是一個一個把我們從黑暗裡撈出來，放在中間地帶自己看著辦；他是把我們整個人、整群人，搬進另一個國，換了國籍。</p><p>這就是 321「讓耶穌作王」的起點：不是我決定讓他作王，是他已經把我搬進他的國。問題不再是「我要不要進國度」，是「我住在新國，卻還照著舊國的規矩生活嗎？」華人基督徒常常身在新國，心在舊國：信了耶穌，看日子、怕犯沖的習慣還在。保羅不是要我們搬家，他說我們已經搬了。</p><p>新國的第一個標記是赦免：「我們在愛子裡得蒙救贖，罪過得以赦免」（1:14）。現在式——不是曾經有過，是此刻擁有。住在這個國裡的人，不必每天重新申請居留。</p>"},{"a":15,"z":15,"star":3,"grk":"<p lang=\"grc\">ὅς ἐστιν εἰκὼν τοῦ θεοῦ τοῦ ἀοράτου, πρωτότοκος πάσης κτίσεως,</p>","lit":"<p>他是那不能看見之神的像，一切受造之物的首生者，</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>εἰκὼν τοῦ θεοῦ τοῦ ἀοράτου</td><td>eikōn tou theou tou aoratou</td><td>那不能看見之神的像</td><td>看不見的神，被看見了</td></tr><tr><td>πρωτότοκος</td><td>prōtotokos</td><td>首生的</td><td>長子名分；地位與承受權</td></tr><tr><td>πάσης κτίσεως</td><td>pasēs ktiseōs</td><td>一切受造的</td><td>比較、從屬屬格</td></tr><tr><td>ὅτι</td><td>hoti</td><td>因為</td><td>1:16 開頭：首生的理由</td></tr><tr><td>πρωτότοκος ἐκ τῶν νεκρῶν</td><td>prōtotokos ek tōn nekrōn</td><td>從死人中的首生者</td><td>1:18 第二次：地位，不是次序</td></tr></table>","gram":"<p><strong>◆ 1:15–20 是基督之歌，分兩節詩：創造（1:15–17）與和好（1:18–20）。</strong>兩節都以 ὅς ἐστιν（hos estin） 起頭（1:15、1:18b），都有 πρωτότοκος（prōtotokos），都以 ὅτι（hoti） 給理由（1:16、1:19）。六節之內 πᾶς（pas） 出現八次：萬有、凡事、一切。許多學者認為這是早期教會的詩歌，保羅引用並加了註（例如 1:18 的 τῆς ἐκκλησίας（tēs ekklēsias）、1:20 的「十字架的血」）；也有學者認為是保羅自己寫的。兩說都不改變它在這封信裡的作用。</p><p>εἰκὼν τοῦ θεοῦ τοῦ ἀοράτου（eikōn tou theou tou aoratou）：「像」不是模糊的影子，是把原型呈現出來的形像。神是 ἀοράτου（aoratou），看不見的；他的 εἰκὼν（eikōn） 卻可以被看見。這使我們想起創 1:26–27 人照神的形像被造，3:10 新人「正如造他主的形像」。</p><blockquote><p><strong>◆ 「首生」三種讀法。</strong>πρωτότοκος πάσης κτίσεως（prōtotokos pasēs ktiseōs） 直譯「一切受造之物的首生者」。<strong>一、受造說</strong>：首生就是第一個生的，πάσης κτίσεως（pasēs ktiseōs） 是部分屬格，基督是受造物中的第一個——第四世紀亞流這樣讀；今天耶和華見證人的《新世界譯本》也這樣讀，並在 1:16–17 加入「其他」二字。<strong>二、地位與承受權說</strong>：舊約的「首生」常指長子名分，不是出生次序。詩 89:27 神說要立大衛為長子，大衛是耶西的第八個兒子；耶 31:9 說以法蓮是長子，以法蓮其實是約瑟的次子。πάσης κτίσεως（pasēs ktiseōs） 是比較或從屬屬格：在一切受造之上、承受一切受造。尼西亞信經以來的正統教會與絕大多數註釋這樣讀。<strong>三、時間說</strong>：和合本譯「在一切被造的以先」，把 πρωτότοκος（prōtotokos） 的時間意義與 1:17「他在萬有之先」連讀。</p><p>決定性的是下一節開頭的 ὅτι（hoti）：「因為萬有都是靠他造的」。保羅給「首生」的理由，正是他是創造者——他不在被造的那一邊。而 1:18 第二次用 πρωτότοκος ἐκ τῶν νεκρῶν（prōtotokos ek tōn nekrōn）：拉撒路比他先從死裡出來，他卻是「首生」；首生是地位，不是次序。本講義站在第二讀，並以第三讀為和合本的合理譯法：首生不是第一個被造的，是一切被造的都歸他承受（立場二）。</p></blockquote>","exp":"<p>〔創〕創 1:26--27（創世記講義第 1 章）</p><p>創世記講義第 1 章講過，人是照神的形像被造的：「神就照著自己的形像造人」（創 1:27）。人是那形像的複本；基督是那形像本身。「愛子是那不能看見之神的像」（1:15）。從來沒有人看見神，可是在拿撒勒人耶穌身上，看不見的神有了一張臉。腓力求主把父顯給他們看，主說：「人看見了我，就是看見了父」（約 14:9）。</p><p>這對歌羅西人很要緊。他們的城裡，看不見的神明靠廟宇、偶像、天使、異象來接近；有人說，要認識神，除了基督，還要加上別的管道。保羅說：你想知道神是甚麼樣子，看基督就夠了。這也是 321「耶穌是我的榜樣」最深的根：神給人的榜樣，就是基督自己。</p><p>接著是全卷最重要的一個詞：「是首生的，在一切被造的以先」（1:15）。有人讀成耶穌是神造的第一個。但首生不是第一個被造的——下一節第一個字就是「因為」：「因為萬有都是靠他造的」（1:16）。保羅說他是首生，理由是萬有都是他造的；造萬有的那一位，不會是萬有中的一個。舊約裡，大衛是么子，神卻說「我也要立他為長子，為世上最高的君王」（詩 89:27）。首生是名分：家業歸他，一切被造的都歸他承受。</p><p>這一節的爭論是真實的，講台上卻要分清楚對象。敲我們家門的耶和華見證人，常常是誠懇、勤勞、願意談聖經的人。我們不嘲笑、不攻擊；我們只是請他和我們一起把 1:16 開頭那兩個字讀出來。保羅在信的末了說：「好像用鹽調和，就可知道該怎樣回答各人」（4:6）——這句話正是為這樣的時刻寫的。首生的爭論，最後的落點不是贏了辯論，是在這一位面前下拜。</p>"},{"a":16,"z":17,"star":3,"grk":"<p lang=\"grc\">ὅτι ἐν αὐτῷ ἐκτίσθη τὰ πάντα ἐν τοῖς οὐρανοῖς καὶ ἐπὶ τῆς γῆς, τὰ ὁρατὰ καὶ τὰ ἀόρατα, εἴτε θρόνοι εἴτε κυριότητες εἴτε ἀρχαὶ εἴτε ἐξουσίαι· τὰ πάντα διʼ αὐτοῦ καὶ εἰς αὐτὸν ἔκτισται·</p><p lang=\"grc\">καὶ αὐτός ἐστιν πρὸ πάντων καὶ τὰ πάντα ἐν αὐτῷ συνέστηκεν,</p>","lit":"<p>因為在他裡面萬有被創造，在諸天裡和在地上，看得見的和看不見的，無論是寶座、無論是主權、無論是執政、無論是掌權；萬有是藉著他並且為著他已經被創造；</p><p>並且他自己是在萬有之先，萬有也在他裡面維繫在一起，</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἐν αὐτῷ ἐκτίσθη</td><td>en autō ektisthē</td><td>在他裡面被造</td><td>不定過去式：創造的那一刻</td></tr><tr><td>θρόνοι κυριότητες ἀρχαὶ ἐξουσίαι</td><td>thronoi kyriotētes archai exousiai</td><td>有位的、主治的、執政的、掌權的</td><td>看不見的權力全在清單上</td></tr><tr><td>διʼ αὐτοῦ</td><td>di' autou</td><td>藉著他</td><td>創造的中介</td></tr><tr><td>εἰς αὐτὸν</td><td>eis auton</td><td>為著他</td><td>創造的目的</td></tr><tr><td>ἔκτισται</td><td>ektistai</td><td>已被造</td><td>完成式：至今仍是他的</td></tr><tr><td>πρὸ πάντων</td><td>pro pantōn</td><td>在萬有之先</td><td>時間與地位都在先</td></tr><tr><td>συνέστηκεν</td><td>synestēken</td><td>維繫在一起</td><td>完成式：至今靠他凝聚</td></tr></table>","gram":"<p><strong>◆ 1:16 開頭的 ὅτι（hoti） 是「首生」的理由：他是首生的，因為萬有都在他裡面被造。</strong>這一節以 ἐν αὐτῷ ἐκτίσθη τὰ πάντα（en autō ektisthē ta panta） 開始，以 τὰ πάντα διʼ αὐτοῦ καὶ εἰς αὐτὸν ἔκτισται（ta panta di' autou kai eis auton ektistai） 結束——首尾兩個 τὰ πάντα（ta panta） 包住整個宇宙。動詞從不定過去式 ἐκτίσθη（創造的那一刻）轉成完成式 ἔκτισται（被造了，至今仍是如此）。</p><p>三個介詞片語是一組：ἐν αὐτῷ（在他裡面——創造的範圍與所在）、διʼ αὐτοῦ（藉著他——創造的中介）、εἰς αὐτόν（為著他——創造的目的）。猶太智慧文學說萬物藉著「智慧」被造；保羅把這些話全部用在基督身上，還多加了一個：εἰς（eis），萬有是「為他」造的。這一點是猶太文獻從來沒有說到智慧的。</p><p>中間是兩組對照：天上／地上、看得見／看不見；然後 εἴτε θρόνοι εἴτε κυριότητες εἴτε ἀρχαὶ εἴτε ἐξουσίαι（eite thronoi eite kyriotētes eite archai eite exousiai） 四個「或是」。這四個詞指甚麼？一說是天使的階級（猶太啟示文學常列出天使的等次），一說也包括地上的政權；本講義判斷：重點在「看不見的」那一邊——歌羅西人在意的天使與靈界權勢（2:15、18）——但四個詞夠寬，地上的權力也都在清單裡。耶和華見證人《新世界譯本》在這裡加入「其他」，讀成「萬有其他一切」；原文沒有這個字。</p><p>1:17 καὶ αὐτός ἐστιν πρὸ πάντων（kai autos estin pro pantōn）：αὐτός（autos） 是強調的「他自己」，ἐστιν（estin） 是現在式——不是「他曾在」，是「他是」在萬有之先。τὰ πάντα ἐν αὐτῷ συνέστηκεν（ta panta en autō synestēken）：συνίστημι（synistēmi） 的完成式，「站在一起、凝聚、維繫」。這使我們想起來 1:3「常用他權能的命令托住萬有」（來 1:3）。</p>","exp":"<p>「因為萬有都是靠他造的，無論是天上的，地上的；能看見的，不能看見的」（1:16）。保羅一口氣說完宇宙的兩半：上面和下面，看得見和看不見。然後他點名看不見的那一半：「或是有位的，主治的，執政的，掌權的」（1:16）。歌羅西人怕的、拜的、想討好的，都在這張清單上，而這張清單的標題是：他造的。</p><p>這對任何一個在拜拜文化裡長大的人都是好消息。你從小被教要怕的那些看不見的權勢，都不在基督之上，也不在基督之外；它們是被造的，而且是為他造的。所以基督徒不需要擇日、看風水、怕沖煞，也不需要另外找一位更近、更靈的中保。造了一切權勢的那一位，就是你所信的那一位（紅線七）。</p><p>「一概都是藉著他造的，又是為他造的」（1:16）。宇宙有起點，也有目的地。萬有「為他」，意思是你的工作、你的天分、你的時間、你的錢，原本就是為他造的。321 說「讓耶穌得著一切的榮耀」，不是額外對神的奉獻，而是讓萬物回到它被造時的方向。</p><p>「他在萬有之先；萬有也靠他而立」（1:17）。「立」原文是凝聚、維繫在一起。宇宙沒有散掉，不是因為它自己夠堅固，是因為有一位在維繫它。你的生活也是這樣：工作、家庭、身體、信仰，若沒有一個中心，就會一塊一塊散開。基督不只是起點的那一位，也是此刻把一切凝聚在一起的那一位。一個早上醒來覺得生命四分五裂的人，可以從這一節開始禱告。</p>"},{"a":18,"z":18,"star":3,"grk":"<p lang=\"grc\">καὶ αὐτός ἐστιν ἡ κεφαλὴ τοῦ σώματος τῆς ἐκκλησίας· ὅς ἐστιν ἀρχή, πρωτότοκος ἐκ τῶν νεκρῶν, ἵνα γένηται ἐν πᾶσιν αὐτὸς πρωτεύων,</p>","lit":"<p>並且他自己是那身體——教會——的頭；他是元始，從死人中的首生者，為要他自己在萬事中成為居首位的，</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἡ κεφαλὴ τοῦ σώματος</td><td>hē kephalē tou sōmatos</td><td>身體的頭</td><td>頭與身體：生命相連</td></tr><tr><td>τῆς ἐκκλησίας</td><td>tēs ekklēsias</td><td>就是教會</td><td>同位語：身體＝教會</td></tr><tr><td>ἀρχή</td><td>archē</td><td>元始</td><td>開端，也是源頭</td></tr><tr><td>πρωτότοκος ἐκ τῶν νεκρῶν</td><td>prōtotokos ek tōn nekrōn</td><td>從死人中的首生者</td><td>第二次「首生」</td></tr><tr><td>ἵνα γένηται</td><td>hina genētai</td><td>為要成為</td><td>目的子句</td></tr><tr><td>ἐν πᾶσιν</td><td>en pasin</td><td>在凡事上</td><td>沒有例外的領域</td></tr><tr><td>πρωτεύων</td><td>prōteuōn</td><td>居首位的</td><td>新約只有這一次</td></tr></table>","gram":"<p><strong>1:18 是基督之歌的轉折，從創造轉到新創造。</strong>καὶ αὐτός ἐστιν（kai autos estin） 呼應 1:17 的 καὶ αὐτός ἐστιν（kai autos estin）：同一位「他自己」，在宇宙之先，也是教會的頭。ἡ κεφαλὴ τοῦ σώματος τῆς ἐκκλησίας（hē kephalē tou sōmatos tēs ekklēsias） 的 τῆς ἐκκλησίας（tēs ekklēsias） 是同位屬格：那身體就是教會。不少學者認為原詩只說「他是身體的頭」（指宇宙），保羅加上「教會」，把宇宙之頭的位置落到一群具體的人身上。</p><p>第二節詩以 ὅς ἐστιν ἀρχή（hos estin archē） 起頭，與 1:15 ὅς ἐστιν εἰκὼν（hos estin eikōn） 平行。ἀρχή（archē） 是開端，也是源頭；這使我們想起創 1:1「起初」。接著是第二次 πρωτότοκος（prōtotokos）：ἐκ τῶν νεκρῶν（ek tōn nekrōn），「從死人中」。舊約與福音書都記載有人在他以前從死裡被叫回來，他仍是首生——因為他是第一個復活進入不再死的生命的，也是眾人復活的保證。這一次的用法清楚說明：首生是地位與先後的開創，不是「受造」。</p><blockquote><p>ἵνα γένηται ἐν πᾶσιν αὐτὸς πρωτεύων（hina genētai en pasin autos prōteuōn） 是目的子句。πρωτεύων（prōteuōn） 是 πρωτεύω（prōteuō） 的現在分詞，「作第一、居首」，新約只出現這一次；αὐτὸς（autos） 又一次強調「他自己」。ἐν πᾶσιν（en pasin） 可以是陽性（在眾人中）或中性（在萬事上）；和合本「在凡事上」取中性，與上下文的 τὰ πάντα（ta panta） 一貫，本講義從之。γένηται（genētai） 是「成為」：在創造裡他本來就居首，在復活裡他「成為」新創造的首——這是本卷「首」的出處。</p></blockquote>","exp":"<p>〔弗〕弗 1:22--23（以弗所書講義第 1 章）</p><p>以弗所書講義第 1 章講過「使他為教會作萬有之首」（弗 1:22）。以弗所書的重點在教會是他的身體；歌羅西書多出來的一筆是：這位身體的頭，就是 1:16 那位創造萬有的。管宇宙的那一位，親自來管一群在歌羅西小城聚會的人。</p><p>「他也是教會全體之首。他是元始，是從死裡首先復生的，使他可以在凡事上居首位」（1:18）。這是全卷地勢圖的頂點，也是本章的章題。創造的時候他是首生的，復活的時候他又是首生的。兩次首生，一次在萬有之先，一次在死人之先；他在舊創造裡居首，也在新創造裡居首。</p><p>「在凡事上居首位」。不是「在大部分的事上」，不是「在屬靈的事上」，是凡事。歌羅西的問題從來不是有人反對基督，是有人要讓基督「在某些事上」居首：救恩給他，智慧給哲學，節期給規條，靈界給天使。華人教會的版本是：主日給基督，平日給成功學；救恩給基督，婚姻給八字，生意給風水。這不是不信，是把基督放在一排神明和方法當中，成為「其中一個」。</p><p>這一節是 321「讓耶穌作王」在歌羅西書的本文。讓他作王，不是在生活中為他保留一個角落，是讓他在每一個角落裡排第一。可以從一個很小的問題開始：今天我做的決定裡，有哪一個，是我從來沒有讓他排第一的？居首位不是一次奉獻大會的決定，是一件一件事情交出來。</p><p>頭與身體的畫面還提醒我們，居首位不是遙控。頭和身體是同一個生命。基督在凡事上居首，不是在天上發命令，是住在他的身體裡、帶著身體活。</p>"},{"a":19,"z":20,"star":3,"grk":"<p lang=\"grc\">ὅτι ἐν αὐτῷ εὐδόκησεν πᾶν τὸ πλήρωμα κατοικῆσαι</p><p lang=\"grc\">καὶ διʼ αὐτοῦ ἀποκαταλλάξαι τὰ πάντα εἰς αὐτόν, εἰρηνοποιήσας διὰ τοῦ αἵματος τοῦ σταυροῦ αὐτοῦ, διʼ αὐτοῦ εἴτε τὰ ἐπὶ τῆς γῆς εἴτε τὰ ἐν τοῖς οὐρανοῖς·</p>","lit":"<p>因為在他裡面，一切的豐盛樂意居住，</p><p>並且藉著他使萬有與他和好，藉著他十字架的血締造了和平——藉著他——無論是地上的，無論是諸天裡的；</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>εὐδόκησεν</td><td>eudokēsen</td><td>樂意</td><td>主詞沒有寫出來</td></tr><tr><td>πᾶν τὸ πλήρωμα</td><td>pan to plērōma</td><td>一切的豐盛</td><td>可作主詞；2:9 的預告</td></tr><tr><td>κατοικῆσαι</td><td>katoikēsai</td><td>居住</td><td>永久定居，不是暫住</td></tr><tr><td>ἀποκαταλλάξαι τὰ πάντα</td><td>apokatallaxai ta panta</td><td>使萬有和好</td><td>加強的「和好」</td></tr><tr><td>εἰρηνοποιήσας</td><td>eirēnopoiēsas</td><td>締造了和平</td><td>新約只有這一次</td></tr><tr><td>διὰ τοῦ αἵματος τοῦ σταυροῦ αὐτοῦ</td><td>dia tou haimatos tou staurou autou</td><td>藉著他十字架的血</td><td>和好的代價</td></tr></table>","gram":"<p><strong>1:19 以 ὅτι（hoti） 起頭，與 1:16 平行：第一節詩的理由是創造，第二節詩的理由是豐盛住在他裡面。</strong></p><blockquote><p><strong>◆ 1:19「父」是和合本補的。</strong>原文 ἐν αὐτῷ εὐδόκησεν πᾶν τὸ πλήρωμα κατοικῆσαι（en autō eudokēsen pan to plērōma katoikēsai） 沒有「父」字，動詞 εὐδόκησεν（eudokēsen） 的主詞沒有明寫。讀法有二：一、主詞是隱含的神（和合本小字補「父」，多數英譯補 God）：父喜歡叫豐盛住在他裡面；二、πᾶν τὸ πλήρωμα（pan to plērōma） 本身就是主詞：一切的豐盛樂意住在他裡面——豐盛幾乎等於神自己。本講義判斷：第二讀較貼近文法，而且正是 2:9 的預告：「因為神本性一切的豐盛都有形有體地居住在基督裡面」（2:9）。兩讀的結論相同：住在基督裡的，是神的全部，不是一部分。</p></blockquote><p>πλήρωμα（plērōma） 可能是錯謬教師的用語（後來諾斯底派用它指神與世界之間層層的屬靈存有）；保羅說：豐盛不分散在天使與層級裡，全部住在一位裡面。κατοικῆσαι（katoikēsai） 是「定居」，不是 παροικέω（paroikeō） 那種寄居。</p><blockquote><p><strong>◆ 1:20 經文鑑別：方括號。</strong>本節有兩個 διʼ αὐτοῦ（di' autou）。第一個在句首，眾抄本都有；第二個在 εἰρηνοποιήσας（eirēnopoiēsas） 那個子句之後，SBLGNT 把它放在方括號裡，表示編者不確定它是否原文。Treg 與 NIV 所據的底本沒有；和合本「便藉著他叫萬有」有。本講義判斷：有方括號的那一個，可能是抄寫時重複，也可能是保羅自己強調；有沒有它，意思都一樣——和好是藉著他。</p></blockquote><p>ἀποκαταλλάξαι（apokatallaxai） 是 καταλλάσσω（katallassō） 前面再加一個表示「徹底、回復」的字首，新約只在西 1:20、22 與弗 2:16 出現。εἰς αὐτόν（eis auton） 的「他」指神還是基督，各家不一；和合本譯「與自己」，讀作神。εἰρηνοποιήσας（eirēnopoiēsas） 是不定過去分詞，新約只有這一次：和平是被「締造」出來的，代價是 διὰ τοῦ αἵματος τοῦ σταυροῦ αὐτοῦ（dia tou haimatos tou staurou autou）。</p>","exp":"<p>「因為父喜歡叫一切的豐盛在他裡面居住」（1:19）。「父」字是和合本補的，原文也可以讀成：一切的豐盛，樂意住在他裡面。不管怎麼讀，意思都一樣：神沒有把自己的一部分放在基督裡，另一部分放在天使、異象、哲學、苦修裡，讓人自己去收集。全部，都在他裡面，而且是定居。</p><p>這就是全卷「不必再加」的根據。到 2:10 保羅會說：「你們在他裡面也得了豐盛」（2:10）。豐盛住在基督裡，基督住在你裡面（1:27）——那麼你還缺甚麼？許多人信主多年，仍覺得自己少一點甚麼：少一次特別的經歷、少一門課、少一個屬靈的等級。這一節說：你要找的豐盛，不在基督以外。</p><p>「既然藉著他在十字架上所流的血成就了和平，便藉著他叫萬有……都與自己和好了」（1:20）。萬有和好，代價是十字架的血。基督之歌的最高點不是寶座，是十字架。宇宙的主，是藉著一個被釘的身體來修復宇宙的。</p><p>那麼，萬有都會得救嗎？這一節常被用來支持普救論。可是保羅在三節之後就說：「只要你們在所信的道上恆心」（1:23）；2:15 也說到被「擄來」、被「明顯給眾人看」的權勢。萬有和好，是說神要讓整個受造界重新歸回秩序、歸在基督底下；不是說每一個人不論信不信都會得救。和好的範圍是宇宙，和好的路徑是十字架，進入和好的方法是信。</p><p>「無論是地上的、天上的」——和好連天上也包括在內。歌羅西人以為天上有一層層要討好的權勢；保羅說，天上的事，十字架也處理好了。</p>"},{"a":21,"z":22,"star":2,"grk":"<p lang=\"grc\">καὶ ὑμᾶς ποτε ὄντας ἀπηλλοτριωμένους καὶ ἐχθροὺς τῇ διανοίᾳ ἐν τοῖς ἔργοις τοῖς πονηροῖς—</p><p lang=\"grc\">νυνὶ δὲ ἀποκατηλλάγητε ἐν τῷ σώματι τῆς σαρκὸς αὐτοῦ διὰ τοῦ θανάτου— παραστῆσαι ὑμᾶς ἁγίους καὶ ἀμώμους καὶ ἀνεγκλήτους κατενώπιον αὐτοῦ,</p>","lit":"<p>並且你們從前是被隔絕的，在心思上是仇敵，在那些邪惡的行為中——</p><p>但如今你們被和好了，在他肉體的身體裡藉著那死——要把你們聖潔、無瑕疵、無可指責地呈獻在他面前，</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ποτε</td><td>pote</td><td>從前</td><td>全卷地勢圖最低點</td></tr><tr><td>ἀπηλλοτριωμένους</td><td>apēllotriōmenous</td><td>被隔絕的</td><td>完成式分詞：成了外人</td></tr><tr><td>ἐχθροὺς τῇ διανοίᾳ</td><td>echthrous tē dianoia</td><td>在心思上是仇敵</td><td>敵意從心思開始</td></tr><tr><td>νυνὶ δὲ</td><td>nyni de</td><td>但如今</td><td>全卷的轉折</td></tr><tr><td>ἀποκατηλλάγητε</td><td>apokatēllagēte</td><td>你們被和好了</td><td>SBLGNT 被動讀法</td></tr><tr><td>ἐν τῷ σώματι τῆς σαρκὸς αὐτοῦ</td><td>en tō sōmati tēs sarkos autou</td><td>在他肉體的身體裡</td><td>真實的肉身</td></tr><tr><td>ἁγίους καὶ ἀμώμους καὶ ἀνεγκλήτους</td><td>hagious kai amōmous kai anenklētous</td><td>聖潔、無瑕疵、無可責備</td><td>三重的呈獻</td></tr></table>","gram":"<p><strong>1:21–22 把基督之歌的宇宙和好，落到「你們」身上。</strong>καὶ ὑμᾶς ποτε（kai hymas pote） 與弗 2:1–2 同一個開頭；ὄντας ἀπηλλοτριωμένους（ontas apēllotriōmenous） 是完成式被動分詞，「處在被隔絕的狀態」。ἐχθροὺς τῇ διανοίᾳ ἐν τοῖς ἔργοις τοῖς πονηροῖς（echthrous tē dianoia en tois ergois tois ponērois）：敵意在心思裡，表現在惡行上；和合本的「與他」是小字補的。</p><p>νυνὶ δὲ（nyni de） 是強調的「但如今」，把整個「從前」翻過去。ἐν τῷ σώματι τῆς σαρκὸς αὐτοῦ διὰ τοῦ θανάτου（en tō sōmati tēs sarkos autou dia tou thanatou） 用了一個重複的說法：「他肉體的身體」——強調基督真實的
