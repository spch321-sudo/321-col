在自己、不在別人、不在環境」接上去。這一章先唱出基督是誰；我們的理念，也只能接在這首歌的後面。"],["p","耶穌是我的榜樣：他是神的像，看他就看見父；可是他說：「子憑著自己不能做甚麼，惟有看見父所做的，子才能做」（約 5:19）。在凡事上居首的那一位，從來不替自己爭第一，最後藉著十字架的血成就和平。他的居首，是從最低的地方得著的。"],["p","聖經是我的準則：讀 1:15 一定讀到 1:16 的「因為」，讀 1:24 一定回頭讀 1:22。不挑想聽的半句，也不拿半句經文壓人。"],["p","聖靈是我的引導：保羅求的是「屬靈的智慧悟性」。要拿掉哪一樣東西、怎樣跟長輩開口、哪一個決定要先停下來問主，求聖靈給我智慧，不靠猜，也不靠怕。"],["p","讓耶穌作王：這一章要我讓出的位置是「分配者」：救恩歸他，其餘的我自己決定要不要再加一點。讓耶穌作王，不是替他保留一個角落，是承認每一個角落本來就是他造的、為他造的。"],["p","讓耶穌得著一切的榮耀：萬有是「為他造的」，我的工作、天分、時間和錢，原本就朝著他。讓他得榮耀，是讓萬物回到被造時的方向。"],["p","建立屬神的體系：體系的單位是一個人。以巴弗被教，回到小城去教別人；保羅一節裡說三次「各人」。我們的小組也不追人數、不設內圈；回報同工的近況時，學以巴弗，先說神已經做成的好。"],["h","八、四種心，聽見同一首歌"],["p","驕傲型的心，聽到「在凡事上居首位」，第一個想到的是別人不夠委身。可是請問自己：我是不是那個替基督劃範圍的人？驕傲常常不是公開反對神，是坐在分配者的位置上，決定他可以管到哪裡。"],["p","恐懼型的心，從小怕看不見的東西：犯沖、鬼月、不好的日子，也怕自己哪一天失去救恩。請聽 1:16 那張清單的標題：他造的；也請聽 1:17：萬有靠他而立。你可以把手打開；拉住你的，不是你的手，是他的手。"],["p","羞恥型的心，覺得自己不夠格：信主很久還是軟弱，沒有特別的經歷，在小教會裡不起眼。請聽 1:12：使你夠資格的是父；也請聽 1:22：他要把你「沒有瑕疵，無可責備」地引到自己面前。你不必先變好才能坐進來。"],["p","受傷型的心，也許曾經有人拿 1:24 對你說：忍下去，這是你的十字架。那不是這一節的意思，基督的患難不需要你用被傷害來補。若你現在仍在不安全的處境裡，請今天告訴一位信得過的人，讓我們陪你找到安全的地方和專業的協助；那和禱告不衝突。"],["h","九、這一週，你可以做的幾件事"],["p","以下五件事，請在散會以前寫下時間、地點和名字。"],["p","第一，每天早上把 1:15--20 讀出聲來，讀到「在凡事上」停下來，說出今天最重要的一件事，對主說：這一件，請你排第一。"],["p","第二，找出一格從來沒有讓基督排第一的地方：理財、孩子的升學、一段關係、一個暗暗留著的「多一層保護」。選定一天，把那一格具體地說給主聽。"],["p","第三，這七天，每當你發現自己在想「我還缺一樣」，就記下時間和內容；週末讀 1:19，為每一樣「缺」感謝他已經給的。"],["p","第四，學以巴弗：這一週向小組長或同工回報一位弟兄姊妹的近況時，先說神在他身上已經做成的好，再說需要代禱的地方；也找一位你常只看見他問題的人，為他具體感謝神一次，並讓他知道。"],["p","第五，為一位還在「與神隔絕」的家人、同事或鄰居每天指名禱告；若家裡有長輩的平安符或拜拜的東西，先為他禱告、先尊重，不要強行處理。"],["p","然後我們一起開口說出四句話。"],["p","我宣告：愛子是那不能看見之神的像；我要認識神，看基督就夠了。"],["p","我宣告：萬有都是他造的，也靠他而立；我不必再加一層保護。"],["p","我宣告：我從前與神隔絕，但如今已經被和好；使我夠資格的是父。"],["p","我宣告：基督在我心裡成了有榮耀的盼望；我願他在我的凡事上居首位。"],["h","十、結語"],["p","我們回到那封寫給陌生人的信。到寫完這封信，保羅還是不知道那些人長甚麼樣子。可是信送到了，在一間屋子裡被念出來；奴僕和主人、商人和婦人，聽見有人這樣叫他們：聖徒，在基督裡的忠心弟兄。一個從沒見過他們的人，替他們唱出了他們共有的那一位。"],["p","這一課的焦點，不在保羅多會寫信，也不在我們學會了「首生」的讀法。焦點在那一位：他是神的像，萬有靠他造、為他造、靠他而立；一切的豐盛都住在他裡面；他用自己的肉身受死，跨過來和好了與他為敵的人，然後住進他們心裡。你手裡如果還握著一樣「多一層保護」，請記得，維繫萬有的那雙手，為你被釘過。"],["p","我們一起低頭禱告。天父，謝謝你使我們夠資格，救我們脫離黑暗的權勢，把我們遷到你愛子的國裡。赦免我們常常替你劃範圍，只讓你在某些事上居首。求你叫我們看見，一切的豐盛都在基督裡，我們不必再加；也給我們勇氣，這一週把那一格交出來，並且溫柔地去愛還在害怕的家人。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","這一個鐘頭不比誰的神學比較清楚，是讓每一個人說出生活裡那一格還沒交出來的地方，也說出這一週要交出的那一個具體動作；以下三個化，請組長照著次序帶。"],["m","帶領說明：本課主軸是像、首、和。席上可能有家人是耶和華見證人的人，也可能有正在受傷害、曾被人用 1:24 勸他忍耐的人，請先讀第二化的帶領提醒。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：講得出三個觀念：首生是地位與承受權，理由在 1:16 的「因為」；基督要在凡事上居首；1:24 的缺欠不是救恩不夠。"],["n","1. ★ 說一樣你家裡曾經留著「多一層保護」的東西或習慣：平安符、看日子、開工拜拜。那時候你心裡怕的是甚麼？"],["n","2. ★★★ 請把 1:15 和 1:16 連著讀出來。用一句話說：為甚麼讀到「因為」，就不會把「首生的」讀成第一個被造的？"],["n","3. ★★ 1:22 說和好已經完成。請用自己的話說出 1:24「缺的不是救恩，是路程」是甚麼意思，並舉一個今天的例子。"],["n","4. ★★ 保羅寫信給沒去過的教會，先感謝、再禱告。說出一位你沒見過面、卻常聽到消息的弟兄姊妹，你會先為他感謝甚麼？"],["m","帶領提醒：讀 1:15--20 時請一口氣讀完六節，不停在 1:15。討論耶和華見證人或民間信仰時，不嘲笑任何人。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：說出生活裡哪一格還沒讓基督排第一、心裡卡在哪裡，並說出這一週要交出來的那一個具體動作。"],["t","【看】看見自己"],["n","5. ★★★ 說出你生活裡一個具體的領域（理財、孩子升學、婚姻、工作），你其實沒有讓基督在那裡排第一。上一次在那件事上作決定，你最先問的是誰？"],["t","【聽】聽神說話"],["n","6. ★★ 請慢慢讀 1:16--18 兩遍，第二遍讀到「在凡事上」時，把那個領域放進去。讀完說一句：你聽見神對那一格說了甚麼？"],["t","【想】想通關卡"],["n","7. ★★★ 那一格交不出來，卡在哪裡：怕沒有保障、覺得還缺一樣、怕家人不諒解，還是覺得神管不到？選一個說出來，不必解釋。"],["t","【講】說出口"],["n","8. ★★ 請對右手邊的人說：「使你夠資格的是父。」聽的人只回一句「謝謝你，我聽見了」，不給建議，然後換人。"],["t","【行】走一步"],["n","9. ★★★ 寫下這一週你要交出來的那一格：哪一件事、星期幾、在哪裡、做哪一個具體動作（拿掉一樣東西、作決定前先禱告、和家人談一次）。"],["m","帶領提醒：這一化可能碰到家庭暴力、職場霸凌、屬靈控制、家人離世沒有信主的經驗。不追問細節，不要求任何人原諒誰，不對正在流淚的人說「你要有信心」，也不拿 1:24 勸人留在不安全的地方。若有人正處在危險中，會後單獨關心，當天確認他的安全，必要時協助尋求專業協助。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課搬進行事曆：每天讀 1:15--20、一次學以巴弗的回報、一位指名代禱的人、一個要帶的人。"],["n","10. ★★ 學以巴弗：說出這一週你要回報的一位弟兄姊妹，先說神在他身上已經做成的一件好事，再說他需要代禱的地方。"],["n","11. ★ 說出一位在小教會或不起眼的崗位上默默服事的同工，這一週哪一天你要讓他知道，他是「一同作僕人的」？"],["n","12. ★★ 說出一位仍然倚靠命理或護身符的長輩，這一週每天為他指名禱告；並說出一件你可以先做、讓他看見平安的小事。"],["n","13. ★★★ 這是本課的 920 操練：找出你的那一個「2」，神放在你身邊、你要帶的那一個人。當場說出他的名字，說出這一週哪一天你要向他分享：基督居首位以後，你改變了的一件小事。"],["n","14. ★★★ 【必做】繁殖任務：用三句話把這一課講給一位教會外的朋友聽。第一句，看不見的神，在耶穌身上有了一張臉。第二句，看得見看不見的一切都是他造的，也靠他維繫，所以不必再加一層保護。第三句，他為與他為敵的人受死，跨過來和好，所以他值得在凡事上排第一。這一週講給一個人，下次回來說他的反應。"],["m","帶領提醒：要具體到時間、地點、人名，不收「我會讓主居首位」這類答案。談到長輩的民間信仰，先尊重、先禱告，不強行處理。"],["s","收尾（5分鐘）"],["p","請每一個人用一句話說：這一週我要交出來的那一格是甚麼。可以只說領域。"],["p","然後彼此代禱，為三種人指名禱告：一位一直覺得自己少一樣的弟兄姊妹，求主讓他知道在基督裡已經滿了；一位仍倚靠護身符的長輩，求主讓他看見造萬有的那一位；一位在小教會默默服事的同工。"],["p","散會以前，確認紙上寫了三樣：要交出來的那一格、要回報的那一位、你的那個「2」。下次帶來對。"]]},"2":{"no":2,"vol":"《321歌羅西書講義》第二課·歌羅西書第二章","title":"結帳頁面上的那一排勾選框——根、滿、影","chars":5232,"min":60,"deep":8,"dchars":1696,"tchars":1333,"blocks":[["h","一、結帳頁面上的那一排勾選框"],["p","弟兄姊妹平安。前幾天我在網路上替自己買一雙走路穿的鞋子。按下結帳，畫面跳到最後一頁。商品下面有一排小方框，每一格都已經打好了勾：延長保固一年，加九十九元；防水噴霧一罐，加一百五十元；運送保險，加三十元；升級會員，首月免費，之後自動扣款。我差一點就按下確認付款，才發現總金額比鞋子本身貴了快一半。"],["p","沒有人騙我。每一格都寫得清清楚楚，每一樣都有一點道理，只是被預先勾好了，等著我不注意。我一格一格把勾取消，竟然有一點不好意思。"],["p","歌羅西書第二章，就是一張這樣的結帳頁面。歌羅西人已經接受了基督。這時有人走過來，在後面替他們勾好了一排小方框：基督，加一套更深的理學；基督，加一個割禮的記號；基督，加一張節期表；基督，加一種看見天使的經驗；基督，加一串不可拿、不可嘗、不可摸的規條。沒有一格要他們離開基督，每一格都只是再加一點。"],["p","照書信三問，先問第一問：歌羅西人遇到甚麼？不是逼迫，也不是分裂。保羅說：「見你們循規蹈矩，信基督的心也堅固，我就歡喜了。」（2:5）這是一間站得好好的教會，錯謬不是從正門攻城，是從頁面最下面那一排小字滲進來。保羅沒有點名，他只做一件事：把每一格的勾，一格一格取消。"],["p","這一課用三個字走完這一章：根、滿、影。根，是 2:6–7 的在他裡面生根建造；滿，是 2:9–10 的在他裡面也得了豐盛；影，是 2:17 的影兒與形體。也請先記住這一課的終點：不是到處都有異端、處處要提防，而是一句好消息——你在他裡面，已經滿了。"],["h","二、一個沒見過面的人，先替你扎根"],["p","保羅要取消那一排勾，第一句卻不是警告，是禱告：「我願意你們曉得，我為你們和老底嘉人，並一切沒有與我親自見面的人，是何等地盡心竭力」（2:1）。「盡心竭力」原文是運動場和戰場的字。他從來沒有見過歌羅西人的臉。一個沒見過面的人能為你做甚麼？能為你禱告，禱告到像在打仗。彼此只見過螢幕上的臉，一樣可以有這樣的分量。"],["p","他求甚麼？「要叫他們的心得安慰，因愛心互相聯絡」（2:2）。「聯絡」是編織的字。對付錯謬，保羅開的第一帖藥不是辯論，是關係。被織在愛裡的人不容易被拉走；離群的羊最容易被叼走。教會若只有正確的教義，沒有彼此聯絡，每一個人都要單獨面對那一排勾選框。"],["p","然後是：「真知神的奧祕，就是基督；所積蓄的一切智慧知識，都在他裡面藏著。」（2:2–3）錯謬教師說：秘密在我們這裡，要入門、守規、看見才拿得到。保羅說：寶藏確實藏著，所以要挖；可是地點早就公開了，在基督裡面。這不是叫人少讀書，一切真實的智慧都屬於他，基督徒最有理由讀書、思考。"],["p","「我說這話，免得有人用花言巧語迷惑你們。」（2:4）「迷惑」原文是在正確的帳旁邊另算一本帳，算得頭頭是道，結論卻是錯的。錯謬的危險不在粗糙，在動聽。判斷一套說法，要問它把人帶到哪裡：更靠近基督，還是更需要那套說法？"],["p","接著是全卷的鉸鏈：「你們既然接受了主基督耶穌，就當遵他而行」（2:6）。這是全卷第一個「所以」。你們怎樣接受了他，就怎樣在他裡面走下去。「接受」是傳承的字，傳下來的不是一套道理，是一個人：那位基督，耶穌，那位主。恩典開的門，不會變成功德走的路。"],["p","「在他裡面生根建造，信心堅固，正如你們所領的教訓，感謝的心也更增長了。」（2:7）前三個分詞全是被動：被扎根、被建造、被堅固，動手的是他。「生根」是完成式：根已經下去了，現在還在；不必每聽到一個新說法，就把根挖出來檢查。「建造」是現在式：房子還在蓋。最後一個分詞才是我們的動作：滿溢的感謝。根扎在他手裡的人，負責感謝，不是焦慮。"],["d",["有人說讀太多書會失去信仰，基督徒可以讀哲學、念神學、學科學嗎？","可以，而且應該。2:8 的理學，原文是那一種哲學、也就是空洞的欺騙，指的是歌羅西那一套特定的說法，不是哲學這門學問。同一封信裡，保羅禱告他們在一切屬靈的智慧悟性上滿心知道神的旨意，又說一切智慧知識都在基督裡面藏著；寶藏要挖，讀書、思考就是在挖。問題是判準：這門學問讓基督居首位，還是要基督讓位？組長聽見這樣的掙扎，不要說你就是讀太多了；會後單獨找他，先聽他卡在哪裡，必要時介紹一位同時尊重學問與信仰的師長。詳見本章議題頁。"]],["h","三、原文亮光：擄走、充滿、欠條"],["p","根扎下去以後，保羅才發出警告：「你們要謹慎，恐怕有人用他的理學和虛空的妄言，不照著基督，乃照人間的遺傳和世上的小學就把你們擄去。」（2:8）第一個原文字：συλαγωγῶν，「擄去」，字面是把人當戰利品帶走，新約只此一次。被擄的人通常以為自己在進深。"],["p","這一節常被讀成反智，其實不是。「理學和虛空的妄言」原文一個冠詞管兩個名詞，說的是那一種哲學，也就是空洞的欺騙，不是哲學這門學問。保羅才禱告他們「在一切屬靈的智慧悟性上，滿心知道神的旨意」（1:9）。問題不在思考，在判準：不照著基督。說法要基督讓位，再高深也是空的。反過來，方法、工具也不是有效就照單全收：一旦它決定你怎樣看基督，而不是基督決定你怎樣用它，你就已經被帶走了。"],["p","第二個原文字：πεπληρωμένοι，「得了豐盛」。先聽它的前一節：「因為神本性一切的豐盛都有形有體地居住在基督裡面」（2:9）。「神本性」在新約只此一次，是神之為神的全部；「有形有體地」，住在一位有身體的人裡面。「豐盛」很可能是錯謬教師的口頭禪，說要經過天使與異象才得著；保羅把這個字搶回來，放在基督身上。"],["p","然後是全章的高處：「你們在他裡面也得了豐盛。他是各樣執政掌權者的元首。」（2:10）πεπληρωμένοι 是完成式被動：已經被充滿了，現在仍是滿的。結帳頁面上每一格都假設你買的還不夠。保羅說：你不缺。不是你的感覺滿了，是你的位置在他裡面。這不是說不必長進；是說長進是在豐盛裡往上長，不是以為不夠才拚命去補。"],["p","接著取消另一格：割禮。「你們在他裡面也受了不是人手所行的割禮」（2:11），那個記號在基督裡已經發生了，比皮肉更深。「脫去肉體」不是看輕身體，是脫去以自己為中心的舊生命。「你們既受洗與他一同埋葬，也就在此與他一同復活」（2:12）。嬰兒洗禮與信徒浸禮兩派都讀這兩節，詳見議題頁；兩派都同意：叫人復活的，是神的功用。"],["p","第三個原文字：χειρόγραφον，和合本譯「字據」，新約只此一次。在當時的文書裡，它是一張親筆簽名的欠條。神「又塗抹了在律例上所寫、攻擊我們、有礙於我們的字據，把它撤去，釘在十字架上」（2:14）。簽名是我們自己的，欠的是真的，還不起也是真的。古時罪狀牌也釘在十字架上；那一天真正釘上去的，是我們的欠條。「撤去」是完成式：拿走了，到今天都還不在。被撤去的是定罪的帳單，不是神的心意。"],["p","接著是全章的大反諷：「既將一切執政的、掌權的擄來，明顯給眾人看，就仗著十字架誇勝。」（2:15）「誇勝」是羅馬將軍凱旋入城、押著戰俘遊街的字。各各他那一天，看起來是耶穌被示眾；其實被押著遊行的是另一方。這一節要讀得平安：權勢是真的，可是已經是被卸了武裝的戰俘。你不必再求別的保護，也不必把每一次病痛都講成被攻擊；身體不適就看醫生，心裡不安就禱告。"],["d",["「神本性一切的豐盛都有形有體地居住在基督裡面」，這一句和三位一體怎樣一起讀？","神本性這個字新約只用這一次，和羅馬書 1:20 指神性特質的字不同，這裡是神之為神本身：不是神在耶穌身上停留過，也不是他多分到一點神性，是神性的全部住在他裡面。可是經文沒有說父就是子：和 1:19 父喜歡叫一切的豐盛在他裡面居住連讀，父與子有分別，本質卻是同一。有形有體地，又保護他的人性：那不是一件外衣，復活的主今天仍有身體。若有人心裡起了疑問，陪他讀 1:15–20 與 2:9–10，允許他問。詳見本章議題頁。"]],["d",["神塗抹了那張字據，是不是說律法被廢了，十誡和道德要求都不必理會？","不是。字據是甚麼有幾說：摩西律法作為定罪的條文、人承認欠神的債據、或天上記罪的帳冊。不論哪一說，被撤去的都是攻擊我們、有礙於我們的那一面，也就是定罪的帳。神的誡命沒有消失，只是不再是追討欠款的帳單，而是被饒恕的人學習愛的方向。另一頭也要小心：不要說帳清了，你還是要多做一點報答才配得上，那等於又簽一張新欠條。從小在做不好就不被愛的家裡長大的人，可能要很久才敢相信帳已結清；不要催他，也不要只說忘掉就好，必要時陪他尋求牧養與專業的陪伴。詳見本章議題頁。"]],["h","四、影兒與形體：沒有人能替你判出局"],["p","接下來是全卷第二個「所以」：「所以，不拘在飲食上，或節期、月朔、安息日都不可讓人論斷你們。」（2:16）字據撤去了，權勢被擄了，所以不要讓任何人拿這些給你下判決。"],["p","它有兩個方向：守安息日的不可以論斷不守的，在主日敬拜的也不可以論斷在星期六敬拜、休息的。守安息日不是得救的條件，守的人也不因此就是律法主義。羅馬書說：「有人看這日比那日強；有人看日日都是一樣」（羅 14:5），「守日的人是為主守的」（羅 14:6）。主日也不是新的律法，不能拿出席來量人屬不屬靈。安息的原則仍然在，只是它是恩典，不是成績單。"],["p","為甚麼？「這些原是後事的影兒；那形體卻是基督。」（2:17）傍晚有人從巷口走來，影子先到；你看見影子就知道有人來了，可是不會去擁抱一個影子。節期、安息日都是神設立的，不是錯的，是先到的；人已經到了，還盯著影子，就錯過了那個人。"],["p","2:18 換了一個畫面：「不可讓人因著故意謙虛和敬拜天使，就奪去你們的獎賞。」（2:18）「奪去獎賞」原文是裁判判你出局。有人在場邊自封裁判，因為你沒有他的禁食功夫、他看見的異象，就判你不合格。保羅沒有否認異象，他給了一個檢驗：無故地自高自大，原文是被吹脹，像氣球，看起來很大，裡面是空的。真實從神來的經驗，叫人更謙卑、更平安、更愛人，不是更恐慌、更看不起別人。"],["p","判詞是不持定元首。「持定」是握緊不放，現在分詞：一直沒有抓住。他看見了很多，偏偏手放開了。像人潮裡的孩子，危險不是看不見熱鬧，是鬆開了父親的手。健康的樣子是：「全身既然靠著他，筋節得以相助聯絡，就因神大得長進。」（2:19）關節和韌帶最不起眼，卻是力量傳遞的地方。常問我和旁邊的人接上了沒有，就在神的生長裡。"],["p","然後是最後一格：「你們若是與基督同死，脫離了世上的小學，為甚麼仍像在世俗中活著、服從那『不可拿、不可嘗、不可摸』等類的規條呢？」（2:20）請看見那一對引號：這是錯謬教師的口號，不是聖經的命令。原文三個短促的禁令，從抓、到嘗、到碰，越說越細，像一句順口溜。和合本把 2:20 和 2:21 合併譯成一節，所以你的聖經裡 2:21 是空的。保羅問：一個已經死了的人，還要守活人的規矩嗎？欠條已經釘死了，為甚麼又去簽一張新的？"],["p","保羅的判語是：「這都是照人所吩咐、所教導的。」（2:22）接著是：「這些規條使人徒有智慧之名，用私意崇拜，自表謙卑，苦待己身，其實在克制肉體的情慾上是毫無功效。」（2:23）「苦待己身」原文是不愛惜身體。它看起來很屬靈，旁人都佩服；可是它治不了肉體，反而餵養了那個想被佩服的自己。神所造的身體不是敵人。"],["d",["基督徒到底要不要守安息日？主日是新的安息日嗎？","這是本章最需要溫柔的題目。安息日派的讀法認為 2:16 指節期附帶的特別安息日，不包括十誡的第七日；主流讀法認為年、月、週三層並列，包括每週的安息日。本講義採主流讀法，理由在 2:17：這些是影兒，形體是基督。可是不論採哪一讀，命令都是不可讓人論斷你們，而且兩個方向都適用：守的不論斷不守的，不守的也不論斷守的；我們也不點名任何教會。安息的原則仍在，那是恩典：一週裡有一段時間停下來敬拜、休息。輪班、醫護的弟兄姊妹主日不能聚會，不是不屬靈，可以和組長找出另一段敬拜與休息的時間。詳見本章議題頁。"]],["d",["有人說我沒有看見異象、沒有某種經驗，就不夠屬靈，我該怎麼看？","保羅沒有說經驗是假的，神可以給人異象；可是他也沒有把經驗當作屬靈等級。2:18 那位自封裁判的人，問題不是看見得太少，是自高自大、不持定元首。檢驗一個經驗或一位屬靈導師，可以問三件事：它讓我更握緊基督，還是要經過某人才能聽見神？它讓我更謙卑愛人，還是更看不起別人？它讓我更平安，還是更恐慌？若有人用所謂先知性的話替你決定婚姻、工作，或要你斷絕和家人的關係，那是控制，不是帶領；請找一位安全的牧者說出來，必要時尋求專業協助。也不要反過來嘲笑別人的經驗。詳見本章議題頁。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是把 2:20 那一句不可拿、不可嘗、不可摸當成聖經命令來引用，拿它勸人戒酒、戒煙。節制是好的，只是理由不在這一句；勸人節制，要引愛人的原則與別處的經文。"],["p","第二個偏差，是拿 2:16 論斷人，而且兩個方向都會發生：說在星期六敬拜的都是律法主義，或說不守安息日的人不得救；也有人把主日講成新的律法，拿出席率量人的信心。經文說「都不可讓人論斷你們」，你也不要做那個論斷人的人。不點名任何教會或宗派。"],["p","第三個偏差，是把 2:23 的苦待己身換一個好聽的名字，叫作捨己、治死、認真：少吃、少睡、不許累、不許難過，甚至用身體的痛苦懲罰自己。對正在傷害自己、在飲食上掙扎的人說你就是治死得不夠，是在傷口上再劃一刀。"],["p","第四個偏差，是把 2:8 講成反智：讀哲學會失去信仰、念神學會讀死、科學都是魔鬼的；或反過來，講成甚麼方法、成功學都可以照單全收。判準是照不照著基督，不是讀不讀書。"],["p","第五個偏差，是把 2:15、2:18 講成靈界恐慌或屬靈等級：邪靈、沖煞到處都是，病痛都是被攻擊；或說沒有看見異象、沒有某種經驗就是次等信徒。也有人反過來，嘲笑一切經驗都是迷信。基督已經誇勝；讀完這一章，人應該更平安，不是覺得四處都是異端。"],["d",["既然 2:23 說苦待己身毫無功效，基督徒還可以禁食嗎？","可以。主耶穌說你禁食的時候，是假設門徒會禁食。2:23 反對的是把禁戒當成得著豐盛的方法、量別人的尺、懲罰自己的工具。可以這樣分辨：這一次禁食，是讓我更單單倚靠父，還是讓我覺得比別人屬靈，或藉著餓自己證明甚麼？帶領禁食的同工，不設天數比賽，並明說懷孕、生病、服藥、有飲食困擾的人不必參加。如果你發現自己停不下來，或正用不吃、不睡、傷害身體的方式對待自己，請不要獨自撐著，告訴一位信得過的人，並尋求醫療與專業協助。組長聽見這樣的分享，不追問，溫柔關懷，會後單獨關心。詳見本章議題頁。"]],["h","六、兩個華人處境的真實問題"],["p","第一個問題：信耶穌，也留一條後路。很多華人信徒不是不信，是不放心：皮夾裡還夾著長輩求來的平安符，搬家還是會偷偷看一下日子。這就是那一格預設打勾的保險。2:15 說權勢已經被擄。可是也不要急著在家人面前把東西摔掉；尊重長輩，慢慢學，讓他們在你身上看見基督裡的平安。"],["p","第二個問題：吃苦當吃補。我們從小聽吃得苦中苦、方為人上人，信主以後，很容易把這句話搬進教會：禁食的天數、服事排到沒有一天休息，成了暗中比較的分數。對自己越狠，旁人越佩服，自己越停不下來。如果你發現自己用不吃、不睡或傷害身體的方式對待自己，這不是屬靈，是需要被陪伴、被幫助的時候；請告訴一位信得過的人，並尋求專業協助。"],["d",["家裡長輩給我平安符、要我看日子，我該怎麼做才不失禮又不妥協？","先記得 2:15：基督已經誇勝，所以不必害怕，也不必急。第一，在主面前把那樣東西交給他，說出你原本想靠它得到的平安。第二，長輩給的東西，溫和地謝謝他的心意，說明你現在靠的是耶穌；不必當眾摔掉，也不必在飯桌上辯論。第三，祭拜的場合可以尊敬地在場、幫忙張羅，只是不拿香、不跪拜，事前先私下和長輩說好。第四，每天為長輩指名禱告。剛信主的人需要時間，組長不要急著要他當眾表態。詳見本章議題頁。"]],["h","七、活出321——已經滿了的人，不必再加"],["p","根扎下了，欠條釘上了，影兒認出來了，我們才把國度321空中團契常說的「讓耶穌作王」和「無己」接上去，而且讓 2:9–10 替它定準。這一章照出來的有己有兩個樣子：一個是加法，總要自己再加一點；一個是苦修，以為對自己狠就是無己。兩個的中心都是我。所以要說清楚：無己不是苦待己身、懲罰自己、看輕身體；無己是不以自己為中心，從已經滿了出發。"],["p","耶穌是我的榜樣：主耶穌在安息日醫病，被人論斷的時候說：「安息日是為人設立的，人不是為安息日設立的」（可 2:27）。他沒有廢掉安息，卻把安息從規條裡還給了人。學他，是讓禁食、守日都只是靠近父的路，不是量人的尺，也不是折磨自己的鞭子。"],["p","聖經是我的準則：次序不能倒。先讀 2:10 的已經滿了，才講操練；先讀 2:14 的欠條被釘上，才講順服。若把已經滿了講成所以要更努力無己、才能活出豐盛，就是又替自己勾回了一格。"],["p","聖靈是我的引導：哪一次禁食是靠近神，哪一次已經變成傷害自己。求聖靈給你分辨，也讓信得過的弟兄姊妹陪你一起分辨。"],["p","讓耶穌作王：2:10 說他是各樣執政掌權者的元首。讓他作王，就是不在他旁邊再擺一個靠山：手鍊、擇日、某位導師的話。也是把裁判的哨子還給他：「又要叫基督的平安在你們心裡作主」（3:15），不是場邊的評審，也不是我自己那份嚴苛的成績表。"],["p","讓耶穌得著一切的榮耀：這一章幾乎每一個大動作，主詞都是神或基督：叫我們同埋葬、同復活、同活過來，赦免、塗抹、撤去、釘上、誇勝。被扎根的人，不必用自己的苦換屬靈的分量；榮耀歸他。"],["p","建立屬神的體系：這一章給教會的不是一份更長的規條，是一個從元首得供應、筋節相助聯絡的身體。課程、講員進到教會，先問是不是照著基督；不讓禁食、方言、異象成為服事的門檻；小組長學會辨認對自己過度苛刻、身心耗竭的人，陪他就醫、休息，讓教會成為可以停下來的地方。"],["h","八、四種心，又想勾上去的那一格"],["p","驕傲型的心，加的是等級：多一門課、多一個經驗、多幾天禁食，好證明自己比別人高一點。2:18 說那叫被吹脹。你不需要高過誰，你和每一個人一樣，都是在他裡面才滿的。"],["p","恐懼型的心，加的是保險：平安符、看日子、以防萬一。你不是不信，是不放心。請回到 2:15：那些你害怕的權勢，已經被押在凱旋的隊伍裡。基督是元首，你不必再替自己多買一份保障。"],["p","羞恥型的心，加的是補償：總覺得自己還欠神一點，要多做一點、多苦一點才敢靠近。你心裡那一本帳，2:14 說已經釘在十字架上了。今天你靠近神，不必先付甚麼。"],["p","受傷型的心，也許你曾被人用規條、用不夠屬靈判過出局；也許你正在用不吃、不睡或傷害身體的方式對待自己。請聽清楚：你不必再狠一點，神造了你的身體，他看重你。請告訴一位信得過的人，讓人陪你尋求醫療與專業的幫助。"],["h","九、這一週，你可以做的幾件事"],["p","以下五件事，請在散會以前寫下時間、地點和名字。"],["p","第一，每天早上用 2:9–10 禱告：主啊，神本性一切的豐盛都在你裡面，我在你裡面也已經滿了。然後說出今天想額外抓住的一樣東西，交給他。"],["p","第二，打開抽屜、皮夾和手機，找出一格你自己勾上去的再加一點：一個護身的物件、一個一直轉傳的屬靈秘訣、一張逼著自己的打卡表。帶到主面前，說出它想替你補甚麼；能丟的丟，不能丟的請同工陪你處理。"],["p","第三，這七天留意你對自己說話的口氣。每次聽見自己說還不夠、不准累、你太差了，就記下時間和那件事，週末帶到主面前分辨。"],["p","第四，這一週刻意留出半天甚麼都不做：休息、散步、感謝，讓身體知道安息是恩典。"],["p","第五，約一位和你守日方式或屬靈經驗不一樣的弟兄姊妹喝茶，只問他為甚麼這樣守，聽完，不辯論，為他祝福。"],["p","然後我們一起開口說出四句話。"],["p","我宣告：神本性一切的豐盛都有形有體地住在基督裡面，我在他裡面也已經滿了。"],["p","我宣告：我的欠條已經釘在十字架上，我不必先付甚麼，就可以靠近神。"],["p","我宣告：基督已經仗著十字架誇勝，我不活在懼怕裡；我要持定元首。"],["p","我宣告：我不讓人論斷我，我也不論斷人；我的身體是神造的，我要愛惜它。"],["d",["要我留出半天甚麼都不做，可是工作和服事都排滿了，要怎樣開始？","從小的、做得到的地方開始。第一，打開行事曆，找出這一週最可能空下來的半天，就算只有三個小時，也先寫上去，像一個不能爽約的約會。第二，那半天不排服事、不回工作訊息；可以散步、睡午覺、和家人吃一頓不趕的飯，結束時感謝神。第三，若你一停下來就覺得罪惡、覺得不夠，那正是這一章要你看見的：你在他裡面已經滿了，休息不是偷懶，是信任。安息是恩典，不是另一份成績單。"]],["h","十、結語"],["p","我們回到那張結帳頁面。那一天我把每一格的勾都取消了，總金額回到鞋子本身的價錢。原來我要買的，一直只有那一樣。歌羅西人也是：他們領受的，一直只有那一位。不是基督加保固，不是基督加升級，就是基督。"],["p","所以這一課的焦點，不在我們認出了多少錯謬，更不在提高警覺、覺得到處都有異端。焦點在那一位：神本性一切的豐盛都住在他裡面，他把我們的欠條釘在十字架上，他仗著十字架誇勝。這一課最後要帶回家的，是保羅放在全章正中間的那一句：「你們在他裡面也得了豐盛。」（2:10）"],["p","我們一起低頭禱告。天父，謝謝你，神本性一切的豐盛都在你兒子裡面，我們在他裡面也已經滿了。赦免我們一再在他旁邊勾上別的東西。謝謝你把我們的欠條釘在十字架上。求你扶起那些正在傷害自己的弟兄姊妹，讓他們被溫柔陪伴，得著幫助。使我們在他裡面生根建造，感謝的心也更增長。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","這一個鐘頭不比誰最屬靈，是讓每一個人說出一格自己在基督以外勾上去的東西，也說出這一週要取消的那一格；以下三個化，請組長照著次序帶。"],["m","帶領說明：本課主軸是根、滿、影。席上可能有在守日上被論斷過的人，也可能有正在用不吃、不睡或傷害身體的方式對待自己的人，請先讀第二化的帶領提醒。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：讓組員講得出三個觀念：在基督以外再加，不是更屬靈；在他裡面得了豐盛是已經完成的事；那三句不可是口號，不是聖經命令。"],["n","1. ★ 說一次你在網購結帳頁面或門市櫃台，被預先勾好、差一點就付了錢的加購項目：是甚麼？哪一刻發現的？"],["n","2. ★★★ 經文說：「你們在他裡面也得了豐盛。」（2:10）請用一句話說：從已經滿了出發，和從還要再補出發，會過出怎樣不同的一天？"],["n","3. ★★ 看 2:20–23：為甚麼和合本的 2:21 是空的？不可拿、不可嘗、不可摸是誰說的？保羅引它要說甚麼？"],["n","4. ★★ 2:16 不可讓人論斷你們有兩個方向：守安息日的人可能怎樣論斷不守的人？反過來呢？你比較容易站在哪一邊？"],["m","帶領提醒：第四題談安息日，兩個方向都不論斷；組裡若有從守安息日的教會來的人，先請他說，大家只聽，不辯論，不點名任何教會。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：讓每一個人說出一格自己在基督以外勾上去的東西，看見它想替自己補甚麼，並說出這一週要取消的那一格。"],["t","【看】看見自己"],["n","5. ★★★ 說出最近一次你在基督以外再加上去的一樣東西：一門課、一個方法、一份逼自己的打卡表，或一條以防萬一的手鍊。是哪一天開始覺得基督不太夠？"],["t","【聽】聽神說話"],["n","6. ★★ 請慢慢讀 2:9–10 兩遍，第二遍讀到在他裡面也得了豐盛時停下來，說一句：神在這一句裡對你說了甚麼？"],["t","【想】想通關卡"],["n","7. ★★★ 你放不下那一格，卡在哪裡：怕出事、怕被看成不屬靈、覺得還欠神，還是習慣用對自己狠來證明認真？選一個說出來。"],["t","【講】說出口"],["n","8. ★★ 請對組裡的人說：欠條已經釘上去了，我在他裡面已經滿了。右手邊的人只回一句你在他裡面是滿的，不給建議。"],["t","【行】走一步"],["n","9. ★★★ 寫下這一週要取消的那一格：是甚麼、哪一天、怎樣交給神；若牽涉身體或飲食，也寫下你要告訴的那位信得過的人的名字。"],["m","帶領提醒：無己不是苦待己身。這一化可能碰到自我傷害、飲食困擾或身心耗竭的經驗；不追問細節，不在組裡公開討論，不說「你要有信心」或「你就是治死得不夠」。溫柔關懷，會後單獨關心，協助他尋求專業協助。第七題之後請留三十秒安靜。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課搬進行事曆：每天用 2:9–10 禱告、留半天安息、約一位守日不同的人喝茶、帶出一個人。"],["n","10. ★★ 說出這一週你要留出來安息的那半天：星期幾、幾點到幾點、打算怎樣過；要請哪一位家人提醒你不要又排滿？"],["n","11. ★★ 說出一位和你守日方式或屬靈經驗不一樣的弟兄姊妹，這一週哪一天約他喝茶？你要問他的那一句話是甚麼？"],["n","12. ★ 你的小組最近引進了哪一門課程、方法或講員？說出你要在哪一次聚會提出來檢查：它是不是叫人更持定元首？"],["n","13. ★★★ 這是本課的 920 操練：找出你的那一個「2」，神放在你身邊、你要帶的那一個人。當場說出他的名字，說出這一週哪一天你要向他分享：欠條已經釘在十字架上了。"],["n","14. ★★★ 【必做】繁殖任務：用三句話把這一課講給一位教會外的朋友聽。第一句，很多人的信仰像結帳時一排預設打勾的加購：神，再加一點保險和規矩。第二句，聖經說神本性一切的豐盛都在耶穌裡面，他把我們欠神的帳釘在十字架上了。第三句，所以你不必再替自己加甚麼，在他裡面你已經滿了。這一週講給一個人，下次回來說他的反應。"],["m","帶領提醒：要具體到時間、地點、人名，不收「我會更信靠主」這類答案；正在耗竭的組員，先鼓勵他休息。"],["s","收尾（5分鐘）"],["p","請每一個人用一句話說：這一週我要取消的那一格是甚麼，安息的那半天是哪一天。"],["p","然後彼此代禱，為三種人指名禱告：一位正被某種秘訣或屬靈導師吸引的人，求主讓他重新握緊元首；一位因守日或屬靈經驗不同而被論斷的人；一位對自己過度苛刻、在吃東西或身體上掙扎的人，求主讓他被溫柔陪伴，也得到專業的幫助。"],["p","散會以前，確認紙上寫了那一格、那半天、你的那個「2」。"]]},"3":{"no":3,"vol":"《321歌羅西書講義》第三課·歌羅西書第三章","title":"換季那一晚的衣櫃——上、藏、衣","chars":5191,"min":60,"deep":8,"dchars":1648,"tchars":1371,"blocks":[["h","一、換季那一晚的衣櫃"],["p","弟兄姊妹平安。請你想像一個畫面：天氣忽然轉涼的那一晚，你把衣櫃整個打開，床上攤滿了衣服。有一件毛衣，是好幾年前買的，袖口已經起毛球；有一件西裝，是上一份工作穿的，現在扣不上了；還有一件，吊牌都沒剪，你一直說等瘦一點再穿。你拿起來，放下，又拿起來。最難的，是決定哪一件舊的不再掛回去。"],["p","衣服很像一個人的歷史：那一件是升職那天穿的，那一件沾過孩子打翻的牛奶，所以很難丟。可是如果你已經搬了家，還把舊屋所有的衣服原封不動搬進新家的衣櫃，那就不是換季，是搬倉庫。"],["p","歌羅西書第三章，就是一個換季的晚上。保羅說：「因你們已經脫去舊人和舊人的行為，」（3:9）「穿上了新人。」（3:10）過了兩節又說：「就要存憐憫、恩慈、謙虛、溫柔、忍耐的心。」（3:12）和合本的小字註明，「存」原文是「穿」。一章經文，從頭到尾都在講衣服。"],["p","可是保羅沒有從衣櫃開始，他先告訴你住在哪裡。這一課用三個字走完這一章：上、藏、衣。上，是你的位置；藏，是你的生命在哪裡；衣，是你每天出門穿甚麼。次序不能倒過來，倒過來，換衣服就變成一場苦刑。"],["p","先用書信三問的第一問：歌羅西人遇到甚麼？第二章那些教師也很關心「上面」，要人靠異象、節期、苦待己身一級一級爬上去。保羅第一句就把方向翻過來：「所以，你們若真與基督一同復活，就當求在上面的事；那裡有基督坐在神的右邊。」（3:1）"],["d",["保羅叫人思念上面的事，那基督徒還要不要關心工作、社會和公義？","要。「上面」在經文裡不是一個方位，是坐在神右邊的基督；思念上面，是讓心思繞著他轉，不是離開地上。最好的證據是保羅自己：說完 3:2，十幾節以後他就講到妻子、丈夫、兒女、僕人，講到「無論做甚麼，都要從心裡做」。先知也叫被擄的人「要為那城求平安」（耶 29:7）。所以關心社會、在職場上忠心，正是天上的人在地上的樣子。講台與小組不替任何政黨或立場背書；若有人因為投入社會關懷被說不屬靈，先聽他真正的負擔。"]],["h","二、上與藏：先有地址，才有命令"],["p","請聽次序：命令前面先放了一個事實：「你們若真與基督一同復活」。這個「若」不是懷疑，原文是「既然」的語氣。動詞 συνηγέρθητε（synēgerthēte）是被動語態，你們被復活了。那些教師給人一把梯子，說爬得上去才算數；保羅說，你已經被抱上去了，所以去找上面的事。"],["p","上面在哪裡？經文自己回答：「那裡有基督坐在神的右邊。」上面不是一個方位，是一個人。坐著，表示工作做完了；在右邊，表示權柄在他手裡。一個確知王坐在寶座上的人，心裡就不慌了。"],["p","「你們要思念上面的事，不要思念地上的事。」（3:2）「思念」τὰ ἄνω φρονεῖτε（ta anō phroneite），是心思的定向，和腓立比書「你們當以基督耶穌的心為心」（腓 2:5）是同一個動詞。這不是叫人逃避地上，十幾節以後保羅就走進廚房、走到孩子的書桌旁。思念上面，不是離開廚房，是在廚房裡知道誰坐在寶座上。"],["p","為甚麼可以這樣？「因為你們已經死了，你們的生命與基督一同藏在神裡面。」（3:3）「已經死了」是過去的一件事，不是今天的功課。「藏」是完成式：已經藏好了，現在仍藏著。藏它的是神自己。工作、健康、名聲都可能失去，可是你的生命不在那些東西裡面。"],["p","藏也表示今天還看不見。所以第四節翻到另一面：「基督是我們的生命，他顯現的時候，你們也要與他一同顯現在榮耀裡。」（3:4）今天藏著，那一天顯現。像灶裡的火藏在灰底下，看不見，卻一直熱著。"],["p","地址講清楚了，第五節才出現全章最重的一個命令：「所以，要治死你們在地上的肢體，就如淫亂、污穢、邪情、惡慾，和貪婪（貪婪就與拜偶像一樣）。」（3:5）請記住這個「所以」接在甚麼後面。它不是接在苦修後面，是接在同復活、同藏後面。先同復活，才治死。"],["p","「肢體」很容易被讀成手腳，可是保羅馬上用五個罪名說明它。治死的是罪的行為與私慾，不是身體，也不是情緒。保羅前一頁才說過，那些禁令「苦待己身，其實在克制肉體的情慾上是毫無功效」（2:23）。苦待自己和治死罪，在經文裡是相反的兩條路。慾望本身是神造的，加上一個「惡」字才要治死；神也沒有叫人治死眼淚。"],["p","貪婪為甚麼「與拜偶像一樣」？因為貪婪是要得更多，把東西放到神的位置上。偶像不一定在神桌上，也可以在購物車裡。神的忿怒臨到這些事（3:6），不是要嚇唬蒙愛的人，是要人看清楚這些不是小毛病。保羅還把讀者自己寫進去：「當你們在這些事中活著的時候，也曾這樣行過。」（3:7）治死不是好人去管壞人，是蒙恩的罪人不再回到舊路。"],["d",["經文說「你們已經死了」，那為甚麼我信主多年，還是一再犯同樣的罪？","因為「已經」是身分，「還要」是生活，兩個都是真的。3:3 用不定過去式，說那一場死在十字架上已經發生；3:5 接著說「所以要治死」，表示罪還會來敲門，只是它已經不是你的主人。所以不要聽信「你還犯罪，表示你沒有真的死」。約翰說：「我們若認自己的罪，神是信實的，是公義的，必要赦免我們的罪」（約壹 1:9）。若你與某一個罪掙扎很久，請找一位信得過的人同行；若它已經成了成癮或強迫行為，也請尋求專業協助，那不只是屬靈的問題。"]],["d",["我常常用少吃一餐、深夜罵自己來「對付老我」，這算不算治死？","不算，而且請你從今天開始停下來。經文的次序是先同復活，才治死；治死的對象是淫亂、貪婪、惡慾、毀謗這些罪的行為與私慾，不是你的身體，也不是你的情緒。保羅在 2:23 說，苦待己身「其實在克制肉體的情慾上是毫無功效」。3:12 卻說你已經是蒙愛的人。神不需要你痛一點才算數。若這些方式已經傷到你的身體、飲食或睡眠，請這一週告訴一位信得過的人，也找醫師或心理專業的人談一談。組長在組裡聽到這樣的分享，不追問細節，溫柔關懷，會後單獨關心，協助他尋求專業協助。"]],["h","三、原文亮光：脫下、穿上、包括一切"],["p","第八節開始換衣服：「但現在你們要棄絕這一切的事，以及惱恨、忿怒、惡毒、毀謗，並口中污穢的言語。」（3:8）「棄絕」ἀπόθεσθε（apothesthe），原是脫衣服的字。清單從身體轉到嘴巴：你在家裡、在群組裡說的話，也在這張單子上。這一段有三個原文字。"],["p","第一個字：ἀπεκδυσάμενοι（apekdysamenoi），已經脫去。「不要彼此說謊；因你們已經脫去舊人和舊人的行為，」（3:9）這個字疊了兩個前綴，是徹底地脫下來；時態是不定過去式，一次已經發生的事。說謊是舊人的本能：怕被看穿，所以包裝；生命藏在神裡面的人，不必靠假象保護自己。"],["p","第二個字：ἐνδυσάμενοι（endysamenoi），已經穿上；後面接著 τὸν ἀνακαινούμενον（ton anakainoumenon），那正被更新的。「這新人在知識上漸漸更新，正如造他主的形像。」（3:10）穿上是過去式，更新卻是現在式被動：新衣服已經上身，裁縫還在一針一針地改，改的那一位是神。「形像」和 1:15「那不能看見之神的像」是同一個字，新人越來越像的就是那一位。以弗所書講義第 4 章講過「要脫去」；兩封信並看，正是已經與還要。"],["p","第三個字，是全卷的山頂：τὰ πάντα καὶ ἐν πᾶσιν Χριστός（ta panta kai en pasin Christos）。「在此並不分希臘人、猶太人，受割禮的、未受割禮的，化外人、西古提人，為奴的、自主的，惟有基督是包括一切，又住在各人之內。」（3:11）字面是：基督是一切，又在一切之中。全卷從「使他可以在凡事上居首位」（1:18）一路往上爬，爬到這裡。"],["p","請看保羅排的四組人。希臘人、猶太人，是民族；受割禮的、未受割禮的，是宗教記號；化外人、西古提人，是文化；為奴的、自主的，是社會地位。人用來替自己加分的記號，全部放在「不分」底下。歌羅西的問題是有人要在基督以外加一點；3:11 的回答是減法，減到最後剩下的不是空白，是基督。"],["p","最刺耳的是 Σκύθης（Skythēs），西古提人：黑海北岸的遊牧民族，在希臘人眼中是野蠻的代名詞。好比今天說：在這裡，博士和沒唸完小學的，不分。為奴的那一項也不是抽象的，送這封信的隊伍裡，就有一個曾經逃走的奴隸阿尼西謀（4:9）。歌羅西教會聽見這一節的時候，他很可能就站在旁邊。"],["p","「不分」不是說差異消失了。下一段保羅照樣分別對妻子、丈夫、兒女、僕人說話。不分的意思是：差異不再決定一個人在神家裡的價值。換季那一晚最捨不得丟的，常常不是衣服，是標籤。"],["d",["歌羅西書說「已經脫去」，以弗所書卻說「要脫去」，兩封信是不是互相矛盾？","不矛盾，兩封信是同一天送到呂克斯河谷的。歌羅西書 3:9--10 用不定過去式分詞，著重已經：脫與穿是與基督同死同活時發生的事；以弗所書 4:22--24 用不定詞，通常讀成要脫去、要穿上，著重還要。兩卷並看，就像一個人已經穿上了制服，所以每天早上照著制服的樣子出門。只講還要，人會焦慮，以為自己從來沒有換過；只講已經，人會懶散，以為怎樣活都沒關係。若你懷疑自己根本沒有脫下舊人，請讀 3:10 的「漸漸更新」，更新的是神，不是你一個人在撐。"]],["d",["既然「在此並不分」，華人教會分國語堂、粵語堂、英語堂，是不是違背了 3:11？","不一定。3:11 不分的是價值，不是語言。為了讓長輩聽得懂、第二代能敬拜而分堂，可以是牧養的智慧。問題在於分堂之後，有沒有變成分等級：同工會裡只有一種口音，講台上只有一種學歷，某一堂永遠是「主堂」，另一堂永遠是「附屬」。可以檢查：一位說不好國語的長輩、一位聽不懂中文的青年，在這裡會不會覺得自己是外人？若有人說他在教會裡被冷落，先承認那個經驗是真的，不急著說我們都是一家人，然後找一位願意同行的人。"]],["h","四、衣：一件一件穿回家"],["p","山頂之後，保羅帶人下山穿衣服。「所以，你們既是神的選民，聖潔蒙愛的人，就要存憐憫、恩慈、謙虛、溫柔、忍耐的心。」（3:12）這是全卷最後一個「所以」，原文 Ἐνδύσασθε οὖν（Endysasthe oun），所以要穿上。先叫你的名字，再拿衣服給你：選民、聖潔、蒙愛，三個名字在前，五件衣服在後。人是照著身分穿衣服的；這五件全是對人的，是在人與人之間穿出來的。"],["p","接著是最難穿的一件：「倘若這人與那人有嫌隙，總要彼此包容，彼此饒恕；主怎樣饒恕了你們，你們也要怎樣饒恕人。」（3:13）「饒恕」χαριζόμενοι（charizomenoi），字根是恩典；後半句「主怎樣饒恕了你們」用的是同一個動詞。饒恕是把帳單當作恩典交給那位先撕掉我帳單的主。可是饒恕不等於假裝沒事，也不等於立刻恢復原來的關係；交出去的是討債的權利，不是你的安全，也不是你的界線。和好需要對方的悔改。"],["p","五件衣服外面還要繫一條腰帶：「在這一切之外，要存著愛心，愛心就是聯絡全德的。」（3:14）然後心裡要有一位裁判：「又要叫基督的平安在你們心裡作主」（3:15）。「作主」βραβευέτω（brabeuetō），是運動場上裁判吹哨的字。有人讓恐懼吹哨，有人讓別人的眼光吹哨；保羅說，讓基督的平安來判。「把基督的道理豐豐富富地存在心裡」（3:16），「存在」的字根是家：基督的話住下來當家。"],["p","這一套衣服，接著被穿進家門。「你們作妻子的，當順服自己的丈夫，這在主裡面是相宜的。」（3:18）這一節一定要和下一節一起讀：「你們作丈夫的，要愛你們的妻子，不可苦待她們。」（3:19）「不可苦待」μὴ πικραίνεσθε（mē pikrainesthe），是以弗所書沒有的一句，字根是苦，意思是心懷苦毒、讓對方的日子變苦。一個丈夫可以從不動手，卻天天在孩子面前數落她；也可以冷戰幾個星期，用沉默懲罰她。這些都是苦待。所以必須說清楚：順服不包括忍受暴力，身體的暴力不包括，言語的暴力、冷暴力也一樣不包括。「在主裡面」是動機，也是界線。遇到暴力，先保護自己和孩子的安全，找信得過的人，必要時尋求專業協助與庇護。"],["p","然後是孩子。「你們作兒女的，要凡事聽從父母，因為這是主所喜悅的。」（3:20）保羅直接對孩子說話；「凡事」在主所喜悅的框架裡，不包括犯罪。再對父親說：「你們作父親的，不要惹兒女的氣，恐怕他們失了志氣。」（3:21）「失了志氣」ἀθυμῶσιν（athymōsin），新約只此一次，字面是心裡的火沒有了。華人說打是情、罵是愛，又說不要誇孩子，免得他驕傲。一個常被比較、常被罵、從來得不到一句肯定的孩子，最後不是生氣，是放棄。打罵不是愛的證明，往往是失志的開始。保羅把限制放在家裡最有權柄的那一位身上。"],["p","最後是工作。「無論做甚麼，都要從心裡做，像是給主做的，不是給人做的，」（3:23）這一節最先是寫給奴隸的，阿尼西謀和腓利門可能就在同一場聚會裡。「眼前事奉」ὀφθαλμοδουλίαις（ophthalmodouliais），是眼睛加服事：老闆在才做，老闆不在就停。保羅的解藥是換一個觀眾。可是「凡事聽從」也被「敬畏主」限定，不包括作假帳、忍受霸凌。在法律上不能承受產業的奴隸，在主那裡卻「必得著基業為賞賜」（3:24）。「主並不偏待人」（3:25），這句話同時對著奴隸和主人說。"],["d",["「主怎樣饒恕了你們，你們也要怎樣饒恕人」，是不是要我馬上原諒傷害我的人？","饒恕是命令，但不是一個按鈕。χαριζόμενοι 的字根是恩典：饒恕是把討債的權利交給主，不再自己追討。這可以是一個過程，一次一次交出去。可是饒恕不等於和好。和好需要對方真實的悔改，需要信任慢慢重建，也需要安全。你可以在神面前饒恕，同時仍然保持距離、設下界線，甚至依法求助。教會不可以拿這一節要求受害者馬上原諒、馬上和好。若你還在危險裡，第一件事不是饒恕，是保護安全。組長聽見這樣的事，不追問細節，不要求原諒，會後單獨關心，必要時協助尋求專業協助。"]],["d",["我先生從不動手，可是常常冷戰好幾個星期，在孩子面前數落我，我還要順服嗎？","請先聽清楚：你描述的，正是 3:19「不可苦待她們」所禁止的事。πικραίνεσθε 的意思是心懷苦毒、讓對方的日子變苦；言語的羞辱與用沉默懲罰人，都在這個禁止之內。3:18 的順服是「在主裡面」的：在主裡相宜的才是相宜的，違背主的不在其內。所以順服不包括忍受暴力，身體的、言語的、冷暴力都一樣。你可以做兩件事：第一，若你或孩子有安全上的危險，先保護安全，聯絡當地的求助管道。第二，找一位信得過的牧者、輔導或社工說出來，不必獨自承擔，也不是家醜外揚。這不是你不夠順服，是你在保護一個家。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是把 3:5「治死」講成苦待己身：少吃、少睡、責打自己，越痛越屬靈；甚至對正在傷害自己的人說「你就是治死得不夠」。先同復活，才治死；治死的是罪，不是身體；2:23 說苦待己身毫無功效。"],["p","第二個偏差，是把治死講成壓抑情緒：基督徒不可以難過、生氣、害怕，把感覺都按下去才屬靈。3:5 和 3:8 列的是淫亂、貪婪、毀謗、污穢的言語，不是眼淚。"],["p","第三個偏差，是只讀 3:18，略過 3:19；或對受苦待的妻子說「多順服、多禱告、為了孩子忍一忍」。3:19 說不可苦待，言語的暴力與冷暴力都在其內；順服不包括忍受暴力，遇到暴力先保護安全。同樣，拿 3:20 替打罵教育背書，卻跳過 3:21，也是這一型。"],["p","第四個偏差，是拿 3:13 要求受害者馬上原諒、馬上和好，甚至與施暴者同桌同工。饒恕是把討債的權利交給主，可以是一次一次的過程；和好要看對方的悔改與安全，兩件事不必綁在一起。"],["p","第五個偏差，是把 3:11「不分」講成差異都不重要、不要談，用合一的名義叫少數的一方閉嘴；或反過來，把為了牧養而分堂分組一律說成不合一。不分的是價值，不是取消每一個人的語言、文化與故事。"],["h","六、兩個華人處境的真實問題"],["p","第一個問題：打是情、罵是愛。很多人是在藤條和比較聲裡長大的：隔壁的孩子考第一名，你怎麼不行？可是 3:21 說得很直：惹兒女的氣，他們會失了志氣。今天坐在這裡的父母，可以先問自己一句：我的孩子最常從我口中聽見的，是一句稱讚，還是一句比較？發現自己正在重複上一代，不必絕望，新人正在被更新，從今晚說出第一句具體的肯定開始。"],["p","第二個問題：家醜不可外揚。華人家庭裡，言語的苛刻與冷暴力常被說成個性，受苦的人也常被勸：不要說出去，丟臉。3:9 說，新人的群體可以說真話，因為我們的價值不靠面子。向牧者、輔導或專業機構求助，不是背叛家庭，是保護家庭裡最容易受傷的人；教會若聽見了，第一件事不是叫人閉嘴維持和諧，是相信他、確認安全、陪他找到幫助。"],["d",["我小時候常被打罵，現在發現自己也在用同樣的方式對孩子，我該怎麼辦？","能看見這一點，已經是新人正在被更新的記號。3:10 說新人在知識上漸漸更新，第一步常常就是看見自己正在重複甚麼。可以這樣走：第一，對孩子承認，具體地說一句：昨天爸爸罵你太重了，對不起。第二，快要發怒時先離開房間三分鐘，不在怒氣裡管教。第三，每天找一件具體的事肯定孩子，讓 3:21 的反面發生。第四，你自己小時候的傷，也值得被聽見；找一位信得過的人或專業的輔導談一談。若孩子已經受傷，或你擔心自己失控，請立刻尋求專業協助，必要時依法通報。"]],["h","七、活出321——生命藏好了，才換得了衣服"],["p","走到這裡，才把國度321空中團契常說的「無己」接上去。3:3 就是無己在歌羅西書的本文：無己不是看輕自己、傷害自己、懲罰自己，是不再以自己為中心，因為自己的生命已經有了新的地址，藏在基督裡。被治死的是以自己為中心的舊生命，不是神所造的身體、情感和恩賜。"],["p","耶穌是我的榜樣：主耶穌大部分的日子是藏著的，在拿撒勒作木匠，順從父母。他還沒有行過一個神蹟，天父就說「這是我的愛子，我所喜悅的」（太 3:17）。身分先被定了，工作才開始。他思念上面的事，卻蹲下來洗門徒的腳。"],["p","聖經是我的準則：讀 3:5 要先讀 3:1，讀 3:18 一定讀到 3:19，讀 3:20 一定讀到 3:21。次序對了，經文就保護人；次序錯了，經文就被拿來打人。"],["p","聖靈是我的引導：這一章沒有直接說聖靈，經文用的是基督的平安與基督的道理。以弗所書講義第 5 章講過，被聖靈充滿的人會唱詩、感謝，正和 3:16 一樣；聖靈不會帶人離開基督的話。心裡的裁判吹哨時，求聖靈用基督的話提醒我。"],["p","讓耶穌作王：讓出三個位置。一是替自己定價的位置，3:11 說惟有基督是包括一切；二是家裡最大的那個位置，3:19、3:21 把限制放在最有權柄的人身上；三是工作的觀眾席，3:23 像是給主做的。可以自己檢查：這一週，我最想被誰看見？"],["p","讓耶穌得著一切的榮耀：3:17 說「無論做甚麼，或說話或行事，都要奉主耶穌的名，藉著他感謝父神。」（3:17）洗碗、記帳、改報告，都可以是敬拜，榮耀歸他。"],["p","建立屬神的體系：一個不分的群體，同工會與小組刻意跨過語言、世代、職業；一個彼此教導的會眾，3:16 把教導交給全會眾，選詩也看神學；一套保護人的流程，家暴與自傷有求助和轉介的名單，饒恕與和好分開談。"],["h","八、四種心，站在衣櫃前的四種人"],["p","驕傲型的心，衣櫃裡掛滿了標籤：學歷、職稱、哪一間教會、比別人屬靈。3:11 只問你一句：如果這些標籤明天全被拿走，你還知道自己是誰嗎？西古提人和你，在基督裡不分。"],["p","恐懼型的心，不敢丟任何一件舊衣服，怕丟了就甚麼都沒有。請聽 3:3 的完成式：你的生命已經藏好了，現在仍藏著，藏它的是神。誰也拿不走。"],["p","羞恥型的心，覺得自己身上那件舊衣服太髒，不配穿新的；也許你一直用罵自己、少吃一餐、熬夜懲罰自己。那不是治死，那是另一件舊衣服。3:12 先叫你的名字：蒙愛的人。完成式，已經被愛，一直被愛著。若你已經傷到身體或睡眠，請這一週告訴一位信得過的人，也找專業的人談一談。"],["p","受傷型的心，也許你一聽到「順服」就發抖，因為有人拿這兩個字叫你閉嘴；也許你一聽到「饒恕」就難受，因為傷你的人還沒有停手。3:19 是寫給你的：不可苦待她們。神站在被苦待的人這一邊。你不必今天就放下，也不必留在危險裡；先讓人陪你找到安全。"],["h","九、這一週，你可以做的幾件事"],["p","以下五件事，請在散會以前寫下時間、地點和名字。"],["p","第一，每天早上出門前讀 3:1--4，用一句話禱告：主啊，我的生命藏在你那裡，今天不必再證明甚麼。"],["p","第二，找出一件你最常拿來替自己加分的東西：職稱、成績、身材、存款、孩子的表現。寫在紙上，對著它說：我的生命不在這裡。"],["p","第三，挑一位家人，每天具體肯定他一件事，不是你很棒，是謝謝你今天做了甚麼。若你是常用沉默懲罰家人的那一位，這一週先打破一次沉默。"],["p","第四，在工作上挑一件沒有人看就不做的小事：報表、交接、清潔、回覆。說出哪一天把它做好，像是給主做的。"],["p","第五，留意一件你「對付自己」的方式，寫下來帶到主面前；若它已經傷到你的身體，這一週找一位信得過的人或專業人員談一談。"],["p","然後我們一起開口說出四句話。"],["p","我宣告：我已經與基督一同復活，我的生命與基督一同藏在神裡面，今天也仍藏著。"],["p","我宣告：我要治死的是罪，不是我自己；神沒有叫我懲罰自己，他叫我穿上新人。"],["p","我宣告：惟有基督是包括一切，又住在各人之內；我不必再替自己加分，也不再把別人放低一級。"],["p","我宣告：無論做甚麼，或說話或行事，我都要奉主耶穌的名，藉著他感謝父神，從家裡到工作的地方。"],["h","十、結語"],["p","我們回到那一晚的衣櫃。床上的衣服終於分好了：有幾件折好收進袋子，明天捐出去；有幾件新的，掛在最前面。房間沒有變大，日子也沒有變輕；可是明天早上，你會穿著不一樣的衣服走進廚房、走進辦公室。"],["p","可是這一課的焦點，不在你今晚整理得多徹底，也不在你明天穿得多體面。焦點在 3:11 那一句：惟有基督是包括一切，又住在各人之內。是他先與我們同死同復活，是神親手把我們的生命藏在他裡面，是主先饒恕了我們。衣服是他給的，穿衣服的力量也是他給的；那一天一同顯現在榮耀裡，最亮的是他。"],["p","我們一起低頭禱告。在上面坐在你右邊的主耶穌，謝謝你，我們的生命已經與你一同藏在父神裡面，誰也拿不走。我們承認，常常替自己加分，在外面穿著溫柔，回到家卻換回舊衣服。求你保護那些正在傷害自己的人，讓他們知道你要治死的是罪，不是他們；也保護那些在家裡被苦待的人，讓他們找到安全。求你讓你的平安在我們心裡作主，讓你的話住在我們家裡，叫我們這一週把新衣服一路穿回家、穿進工作裡。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","這一個鐘頭不比誰的衣櫃整理得好，是讓每一個人說出一件還捨不得脫下的舊衣服，也說出這一週要穿回家的那一件新衣服；以下三個化，請組長照著次序帶。"],["m","帶領說明：本課主軸是上、藏、衣。席上可能有用傷害自己或飲食方式「對付自己」的人，也可能有在家裡被苦待、在打罵中長大的人，請先讀第二化的帶領提醒。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：讓組員講得出三個觀念：先同復活，才治死；治死的是罪，不是身體或情緒；惟有基督是包括一切，新衣服要一路穿回家。"],["n","1. ★ 你家換季的時候，最捨不得丟的是哪一件衣服？說出它的故事，和它為甚麼難放下。"],["n","2. ★★★ 3:5 的「所以」接在 3:1--4 後面。請說說：為甚麼先知道自己已經與基督一同復活，才治死得了罪？倒過來會變成甚麼樣子？"],["n","3. ★★ 3:5 和 3:8 列出來的，是哪一類東西？請說出治死罪和苦待身體、壓抑情緒的分別。"],["n","4. ★★ 3:11 列了四組人：民族、宗教記號、文化、社會地位。今天在教會裡，哪一種記號最常被拿來替人分等級？"],["m","帶領提醒：談到 3:5 時，不讓任何人說越苦越屬靈的話；談到 3:11 時，不讓任何人用口音、族群或學歷開玩笑。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：讓每一個人說出一件還捨不得脫下的舊衣服，在「蒙愛的人」裡聽見神怎樣看他，並說出這一週要穿回家的那一件新衣服。"],["t","【看】看見自己"],["n","5. ★★★ 說出一件你最常替自己加分的東西，或在家裡最常穿回去的舊衣服：刺人的話、冷戰、對付自己的方式。上一次是甚麼時候、對著誰？"],["t","【聽】聽神說話"],["n","6. ★★ 請慢慢讀 3:12 兩遍，第二遍讀到「聖潔蒙愛的人」時，在前面加上你自己的名字。讀完說一句：你聽見神怎樣叫你？"],["t","【想】想通關卡"],["n","7. ★★★ 你脫不下那一件舊衣服，卡在哪裡：怕失去、怕被看不起、覺得自己不配，還是心裡有一個還沒被聽見的傷？選一個說出來。"],["t","【講】說出口"],["n","8. ★★ 請對組裡的人說：「我的生命與基督一同藏在神裡面。」右手邊的人只回一句「你是蒙愛的人」，不給建議。"],["t","【行】走一步"],["n","9. ★★★ 寫下這一週你要穿回家的那一件新衣服：星期幾、對哪一位家人、要說哪一句具體的肯定或道歉。若你正在傷害自己或身處危險，改寫下你要告訴的那一位信得過的人和哪一天。"],["m","帶領提醒：這一化可能碰到自傷、飲食困擾、家庭傷害或長期無望感的經驗。不追問細節，溫柔關懷，不要求任何人原諒誰，不對正在流淚的人說「你要有信心」，也絕不說「你就是治死得不夠」。若有人說出自傷或仍處在暴力中，不在組裡處理，會後單獨關心，先確認他眼前的安全，協助尋求專業協助。第七題之後請留三十秒安靜。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課搬進行事曆：一件像給主做的工作、一位要認識的人、你要帶的那一個人。"],["n","10. ★★ 說出一件你在工作上「沒有人看就不做」的小事，和你打算哪一天把它做好，像是給主做的。"],["n","11. ★ 說出一位和你不同語言、世代或職業的弟兄姊妹，這一週哪一天約他吃一頓飯，聽他說一個他的故事。"],["n","12. ★★ 3:21 說不要惹兒女的氣。若你是父母，說出這一週你要具體肯定孩子的一件事；若不是，說出一位你要鼓勵的年輕人，和哪一天。"],["n","13. ★★★ 這是本課的 920 操練：找出你的那一個「2」，神放在你身邊、你要帶的那一個人。當場說出他的名字，說出這一週哪一天、在哪裡，你要向他分享：你的生命藏在神裡面，不必再替自己加分。"],["n","14. ★★★ 【必做】繁殖任務：用三句話把這一課講給一位教會外的朋友聽。第一句，我們都習慣用學歷、職稱和外表替自己加分，好像少了這些就不是自己。第二句，聖經說，相信耶穌的人，生命已經藏在神那裡，誰也拿不走，所以不必再證明甚麼。第三句，因為這樣，我可以脫下刺人的話和冷戰，換上溫柔與感謝，一路穿回家。這一週講給一個人，下次回來說他的反應。"],["m","帶領提醒：要具體到時間、地點、人名，不收「我會更溫柔」「我會更忠心」這類答案；若組員說出的家人正在苦待他，不勉強他去肯定或和好，先關心他的安全。"],["s","收尾（5分鐘）"],["p","請每一個人用一句話說：這一週要穿回家的那一件新衣服是甚麼。"],["p","然後彼此代禱，為四種人指名禱告：一位常常自責、甚至用傷害自己的方式對付自己的人，求主讓他知道治死的是罪，不是他；一對冷戰中的夫妻；一個被比較、被罵到心灰意冷的孩子；一位在職場上被霸凌或被要求作假的人。"],["p","散會以前，確認紙上寫了：要肯定的家人和哪一天、你的那個「2」。下次帶來對。"]]},"4":{"no":4,"vol":"《321歌羅西書講義》第四課·歌羅西書第四章","title":"一隻戴鍊子的手寫完的信——門、名、滿","chars":5302,"min":60,"deep":8,"dchars":1616,"tchars":1406,"blocks":[["h","一、戴著鍊子簽名的那一隻手"],["p","弟兄姊妹平安。請你先看一隻手。羅馬，一間租來的房子，桌上攤著一卷寫了四章的信。代筆的弟兄寫完最後一句問安，把筆放下，轉頭看保羅。保羅伸手去接，手腕上的鐵鍊順著桌邊滑過去，碰到木頭，叮的一聲。屋角那個羅馬兵抬了一下眼睛，又低下頭去。保羅彎著身子，一筆一筆地寫，字比前面大，也比前面歪。"],["p","他寫的是：「我－保羅親筆問你們安。你們要記念我的捆鎖。願恩惠常與你們同在！」（4:18）寫完，他把信遞給門口的兩個人。一個是推基古，皮袋已經收好，裡面還有另外兩封信；一個是阿尼西謀，他站得比推基古後面一點，因為這條路的盡頭，是他當年逃出來的那個家。兩雙腳上了往東的大路。"],["p","這一課就停在這個畫面裡讀第四章。這封信的第一章說基督「使他可以在凡事上居首位」（1:18），最後一行卻是一個被鎖住的人簽的名。高舉基督居首位的人，自己坐在監裡；他沒有求人同情他，他求的是記念。"],["p","這一章用三個字走完：門、名、滿。門，是 4:2–6：禱告求神開門，向門外的人說帶著鹽的話。名，是 4:7–16：十個名字，送信的、回家的、被接回來的、在遠方摔跤禱告的、打開家門的。滿，是 4:17：「務要謹慎，盡你從主所受的職分」（4:17），全卷最後一個命令，只對一個人說。"],["p","先問一個簡單的問題：歌羅西人遇到甚麼？有人在教會裡教「基督再加一點」：守節期、苦待己身、敬拜天使。保羅整封信只回答一件事：「你們在他裡面也得了豐盛。」（2:10）一個已經滿了的人，不必再加。那麼滿了的人要做甚麼？第四章的回答很樸素：回到家裡、回到門口、回到一份名單裡，把主交給你的那一份做滿。"],["h","二、天上也有一位主：家規的最後一句"],["p","第四章的第一節，其實是第三章的最後一句。章的分界是後來才加上的；保羅寫的時候，這一句緊接在「主並不偏待人」（3:25）後面。家規裡僕人那一段最長，足足四節；主人只有一節，可是這一節收在最重的地方：「你們作主人的，要公公平平地待僕人，因為知道你們也有一位主在天上。」（4:1）"],["p","「公公平平」在原文是兩個詞。第一個是 τὸ δίκαιον，公道，按是非該給的。第二個是 τὴν ἰσότητα，對等、均平，新約另外兩次在哥林多後書第八章，譯作「均平」。在一個人可以被買賣的世界，保羅要主人做兩件事：該給的要給足，看人的眼光要對等。動詞 παρέχεσθε 是從自己手裡拿出來，不是等人來討。"],["p","請想像這封信第一次被讀出來的那個晚上。腓利門家裡坐滿了人；阿尼西謀，那個逃跑過的奴僕，就站在送信的人旁邊。讀信的人念到「你們作主人的」，屋裡會安靜成甚麼樣子？保羅對主人說，你們也有一位主，κύριον ἐν οὐρανῷ，在天上的主。同一位主，同時看著兩個人。"],["p","今天的主人，是老闆、主管、店東，也是請了外傭的家庭、把案子外包出去的人。公道，是工資按時給、加班費照算、說好的休假不收回、保險不偷工。對等，是記得那位派遣工、那位外送員、那位替你照顧母親的阿姨，和你站在同一位主面前；他有全名，也有家。前一章叫僕人「從心裡做」，也從來不包括忍受苛扣、霸凌與無償加班；被扣薪、被扣證件的人，可以照正當的管道求助。家規最後一句，不是給有權的人加一根鞭子，是在他頭上放一位主。"],["p","然後保羅從家裡轉身，望向門外。"],["d",["我是基督徒老闆，公司利潤很薄，「公公平平」具體要怎樣檢查？","可以從兩個字分開檢查。先看公道，就是該給的有沒有給足：工資是否按時發、加班費是否照法定標準算、勞健保或公積金是否照實投保、說好的休假會不會臨時收回、離職的人該拿的有沒有拖。這是本分，利潤薄也不能從這裡省。再看對等，就是怎樣看人：你叫得出每一位員工的全名嗎？派遣工、清潔阿姨有沒有一個可以說話的管道？若公司真的撐不下去，對等的做法是誠實說明、一起商量，而不是瞞著、拖著。"]],["h","三、原文亮光：開門的是神，調鹽的是恩典"],["p","「你們要恆切禱告，在此警醒感恩。」（4:2）「恆切」是 προσκαρτερεῖτε，黏住不放；重點不在禱告多長，在不肯放手。「警醒」是 γρηγοροῦντες，主在客西馬尼對門徒說的就是這個字：「總要警醒禱告，免得入了迷惑」（可 14:38）。門徒睡著，是累了。保羅知道人會累，所以他把感恩放進警醒裡：數算恩典的人比較不容易睡著，也不容易把禱告變成抱怨清單。"],["p","第一個原文字是門：θύραν τοῦ λόγου，話語的門。「也要為我們禱告，求神給我們開傳道的門，能以講基督的奧祕（我為此被捆鎖）」（4:3）。括號裡的「被捆鎖」，原文 δέδεμαι 是完成式被動：鍊子還在手上。照常理他該求監獄的門開，他求的卻是話語的門。再看主詞：開門的是 ὁ θεὸς，是神。這一句替所有傳福音的人卸下一個重擔：門不是我們撞開的，也不是用話術撬開的；我們禱告，我們等候，門開了，我們進去。所以傳福音不是業績，被拒絕也不等於失敗。"],["p","第二個原文字是時機：「你們要愛惜光陰，用智慧與外人交往。」（4:5）「愛惜光陰」原文是 τὸν καιρὸν ἐξαγοραζόμενοι，把時機買回來。καιρός 不是 χρόνος，不是鐘錶上的時間，是合宜的那一刻：同事在茶水間嘆了一口氣，鄰居的孩子住院了。買回來，就是付一點代價把它留下：多坐十分鐘，改一個行程，把手機蓋起來。這不是效率主義；行事曆塞得滿滿的人，反而一個時機也買不到。"],["p","第三個原文字是鹽：「你們的言語要常常帶著和氣，好像用鹽調和，就可知道該怎樣回答各人。」（4:6）「和氣」原文是 ἐν χάριτι，在恩典中，和 4:18 最後的「恩惠」同一個字。先有恩典，才有鹽。「用鹽調和」是 ἅλατι ἠρτυμένος，調好了味的。鹽不是辣椒：辣椒刺激人、壓倒人；鹽讓食物出味，也讓它不壞。主耶穌說：「你們裡頭應當有鹽，彼此和睦。」（可 9:50）所以尖酸、嗆聲、把對方駁倒的痛快，不叫有鹽；嘲笑別的宗教、嘲笑不信的人，更不叫有鹽。"],["p","最後是「回答各人」，ἑνὶ ἑκάστῳ ἀποκρίνεσθαι，一個一個地回答。先有人問，才有回答；而且每一個人都不一樣。對剛失去母親的同事、剛被裁員的鄰居、在大學教物理的表哥，不可能念同一份稿子。主耶穌對井旁的婦人先開口要一口水，對樹上的撒該說今天要住在他家；他沒有一套萬用話術，他看著那個人說話。"],["p","這一節今天最常落在哪裡？落在手機上。群組裡有人轉來一篇罵基督徒的文章，社群媒體上有人嘲笑你的信仰，你的手指已經在打字了。打字的時候慢下來問兩句：這句話裡有恩典嗎？是鹽，還是辣椒？雅各說要「快快地聽，慢慢地說，慢慢地動怒」（雅 1:19）。網路上的話沒有表情，也收不回來；一句調了鹽的回覆，可能比十篇辯論更讓人想再問你一句。不確定的時候，可以不按送出，改成私訊問一句：你最近還好嗎？"],["d",["我為一位家人禱告了很多年，門還是沒有開，是不是我禱告不夠、見證不好？","不是。4:3 開門的主詞是神，保羅自己也還在等；他寫這句的時候坐在監裡，沒有把門沒開怪到任何人身上。你可以把這份重擔交還給神：主，門是你開的，我把他交給你。然後繼續做你做得到的那一份：愛他、不施壓、在合宜的時機多陪他一點、對他說帶著恩典的話。不必每次見面都把話題拉到信仰，也不必用他的決定來衡量自己是不是好基督徒。若你已經累了，請讓小組幫你一起禱告，你不是一個人在敲門。"]],["d",["在網路上看到有人公開嘲諷基督教，我應該回應嗎？怎樣回才算「用鹽調和」？","先問自己三件事。第一，對方是在問，還是在發洩？4:6 說的是回答各人，先有人問，才有回答；純粹發洩的貼文，不回也可以是一種智慧。第二，我是想讓他聽見恩典，還是想贏？如果打字時心跳很快、只想把他駁倒，那多半是辣椒。第三，這件事適合公開談嗎？若要回，可以短一點，先承認對方說中的地方，例如基督徒確實有做得不好的時候，再說一句你自己的經歷，不貼長篇道理，也不嘲笑對方的立場。發出以前再讀一遍，問：這句話若被截圖給全世界看，能讓人看見基督嗎？"]],["h","四、十個名字，一份做滿的職分"],["p","從第七節起，福音落成了一份名單。先是兩個上路的人。推基古被稱為親愛的兄弟、忠心的執事，又是 σύνδουλος ἐν κυρίῳ，在主裡一同作奴僕的。保羅的近況不寫在信裡，交給推基古親口說。"],["p","第二個人要讀慢一點：「我又打發一位親愛忠心的兄弟阿尼西謀同去；他也是你們那裡的人。」（4:9）一個逃跑過的奴僕，在要被公開宣讀的信裡，得到和推基古一樣的稱呼。保羅一個字也沒提他逃跑；另一封寫給腓利門的短信說：「不再是奴僕，乃是高過奴僕，是親愛的兄弟。」（門 1:16）他要回到那個依法可以處置他的家，教會先聽到的卻是：他是你們那裡的人，是自己人。"],["p","接著是羅馬那一頭的六個人。亞里達古陪保羅走過暴動和海難，現在陪他坐監。然後是馬可：「巴拿巴的表弟馬可也問你們安。（說到這馬可，你們已經受了吩咐；他若到了你們那裡，你們就接待他。）」（4:10）多年前，馬可在第一次宣教旅程半途離開；保羅因此不肯再帶他，和巴拿巴「起了爭論，甚至彼此分開」（徒 15:39）。現在保羅替他寫推薦，δέξασθε αὐτόν，接待他，是確確實實地接納。幾年以後，保羅在最後一封信裡說：「你來的時候，要把馬可帶來，因為他在傳道的事上於我有益處。」（提後 4:11）半途而廢不是一個人的結局。中間有巴拿巴不肯放手，也有保羅肯改變看法。"],["p","保羅說這幾位同工「是叫我心裡得安慰的」（4:11），「安慰」是 παρηγορία，新約只出現這一次，是當時醫生常用的字，意思近於舒緩、止痛。一個被鎖在屋裡的人，需要的不是一篇講道，是幾個肯坐在旁邊的人。"],["p","以巴弗是把福音帶到歌羅西的人，現在留在羅馬為他們禱告：「他在禱告之間，常為你們竭力地祈求，願你們在神一切的旨意上得以完全，信心充足，能站立得穩。」（4:12）「竭力地祈求」是 ἀγωνιζόμενος，摔跤角力的字。家裡那位行動不便、天天為教會禱告的長輩，請告訴他：你就在前線上。"],["p","然後是「所親愛的醫生路加和底馬」（4:14）。底馬此時也是同工，也問安；這使我們想起幾年後保羅寫的一句：「因為底馬貪愛現今的世界，就離棄我往帖撒羅尼迦去了」（提後 4:10）。經文沒有告訴我們他後來怎樣，我們也不替他下結論。同一份名單裡，有一個被接回來的馬可，也有一個後來走掉的底馬；這不是拿來嚇人的故事，是一個安靜的問題：今天在名單裡的我，靠甚麼留在名單裡？"],["p","名單接著轉向一個家：「請問老底嘉的弟兄和寧法，並她家裡的教會安。」（4:15）一位姊妹打開家門，讓教會在她的客廳裡聚會。信念完了還要傳下去：「你們念了這書信，便交給老底嘉的教會，叫他們也念」（4:16）。領受的，要交出去。"],["p","最後是一個人。保羅叫全會眾一起去對亞基布說：「務要謹慎，盡你從主所受的職分」（4:17）。Βλέπε 是一直看著，不讓它從手中滑走。ἣν παρέλαβες ἐν κυρίῳ，你在主裡所領受的，和 2:6「你們既然接受了主基督耶穌」是同一個動詞：領受了主的人，也領受了職分，大小不由自己挑。ἵνα αὐτὴν πληροῖς，好叫你把它做滿，用的是全卷講豐盛的那個字。在基督裡已經滿了的人，回去把自己那一份做滿。而且是全會眾一起去說：一個人的忠心，是一群人陪出來的。"],["p","然後，就是那隻戴鍊子的手。μνημονεύετέ μου τῶν δεσμῶν，要一直記念我的捆鎖；「捆鎖」和 4:3 的「被捆鎖」同一個字根。記念，是為他禱告，也是記得這封信的價錢。最後一句沒有動詞：ἡ χάρις μεθʼ ὑμῶν，恩惠與你們同在。不是要更努力，是恩惠。"],["d",["我曾經在服事裡半途離開，現在想回來，卻不敢面對以前的同工，該怎麼辦？","先聽見一件事：馬可也是這樣。他在第一次宣教旅程半途離開，保羅一度不肯再帶他；後來保羅卻點名要他。半途而廢不是你的結局。回來可以分幾步走。第一，先找一位你信得過的人，像巴拿巴那樣，把你當年為甚麼離開說給他聽。第二，若當年有虧欠誰，在合宜的時候具體地道歉；若當年是你受了傷，也可以說出來，不必假裝沒事。第三，不必一回來就回到原來的位置，可以從一件小事開始，讓信任慢慢重建。回來的路，本來就該有人一起走。"]],["d",["底馬後來離棄了保羅，我最近很冷淡，會不會我也是底馬？","經文只告訴我們底馬後來「貪愛現今的世界」，離開了保羅，沒有告訴我們他的結局，我們也不替他下結論，更不需要拿他來量自己。你會這樣問，表示你還在乎；冷淡的季節很多人都走過，不等於你已經離開了主。這時候可以做兩件小事。第一，誠實告訴神：主，我最近很冷淡，我不知道為甚麼。第二，找一位弟兄姊妹說出來，讓人陪你，而不是一個人默默退到名單外面。你留在名單裡，靠的不是你的火熱，是 4:18 那一句恩惠。若冷淡伴隨長期失眠、無望或自我否定，也請找人幫助你。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是讀家規只對員工講「從心裡做」，略過 4:1；或把順服講成忍受苛扣、霸凌與無償加班。反過來也錯：說 4:1 跟今天的老闆無關。在天上的那一位主，今天還看著每一張薪資單。"],["p","第二個偏差，是把 4:3–6 講成業績式、施壓式的傳福音：每人每月要帶三個人決志、抓住人不放逼他當場禱告。門是求神開的；用智慧、帶著和氣、回答各人，每一個人都不一樣。把人當成數字，就把恩典當成了推銷。"],["p","第三個偏差，是把「用鹽調和」講成尖酸、機智、嗆聲，在講台或網路上嘲笑其他宗教或不信的人，說這叫有鹽；或把「回答各人」變成一份背好的稿子，不管對方是誰都照稿念。"],["p","第四個偏差，是拿名單裡的人來壓人。用底馬恐嚇：你不夠火熱、太愛賺錢，就會像底馬一樣，或替他下沉淪的結論；用馬可逼受傷的人：保羅都接待馬可了，你也要馬上和好、不要再提。馬可的故事是給失敗的人一條路，不是叫受害的人閉嘴；底馬的名字是一個安靜的提醒，不是一根棍子。"],["p","第五個偏差，是把 4:17 講成不准休息、不准卸任、做到倒下為止，或在聚會裡公開點名羞辱一位放下服事的同工；也有人拿 4:18「記念我的捆鎖」叫人留在受虐、被剝削的處境裡。保羅為福音坐監，不是要一個在家裡挨打的人忍下去；遇到危險，先保護安全。"],["d",["傳福音不能施壓，那是不是就等於不要開口、等對方自己來問？","也不是。保羅求的是門開，門開了他是要進去講的：「叫我按著所該說的話將這奧祕發明出來」（4:4）。不施壓不等於不說，而是說的方式不同。施壓是把對方當目標：訂人數、逼他當場表態。不施壓是把對方當一個人：先禱告，再買回時機，聽懂他真正在問甚麼，然後在合宜的時候清楚地說出你所信的，並且尊重他的回應。你可以先問：你最近最掛心的是甚麼？聽完了，再說一句：我可以為你禱告嗎？門開不開由神，開口的那一份是你的。"]],["h","六、兩個華人處境的真實問題"],["p","第一個問題：家族餐桌上的那一句。過年吃團圓飯，長輩夾了一塊雞給你，忽然問：你們信耶穌的，是不是連祖先都不拜了？這一刻我們常做兩件事：一是放辣椒，把對方的問題說成迷信，當場辯到底；二是乾脆不說，低頭吃飯，回家也不提。4:6 給第三條路：帶著恩典，調了鹽。可以先問一句：阿伯，你為甚麼這樣問？聽見他真正怕的是甚麼，常常是怕子孫忘了本、怕將來沒有人記得他。然後說：我們不拜，可是我們記念，也會孝順，清明一樣回來掃墓。鹽讓話不壞，也讓下一次的談話還有機會。"],["p","第二個問題：面子，讓馬可回不來。在重面子的文化裡，一個在服事裡失敗過、從工場上撤回來、或在小組裡鬧翻過的人，最難的不是認錯，是再走進同一扇門。大家不說他甚麼，可是也沒有人再找他；名冊上那個名字就這樣淡了。4:10 給的是一條中間的路：有人先寫推薦，有人肯陪著他，也有清楚的責任；不是假裝沒事，也不是永遠貼著靠不住的標籤。你的教會名冊上，有沒有幾個這兩年忽然不見了的名字？"],["h","七、活出321——在一份名單裡做滿那一份"],["p","經文說完了它自己的話，我們國度321空中團契才接上去。全卷四個字：首、根、上、鹽；走到這一章是鹽。基督居首位，我們在他裡面生根、思念上面的事，最後話語裡有了鹽。"],["p","耶穌是我的榜樣：主耶穌就是那位警醒禱告的人。在客西馬尼，門徒睡著了，他醒著。他對每一個人說話的方式都不一樣；他也把父交給他的那一份做滿了，在十字架上說「成了！」（約 19:30）。"],["p","聖經是我的準則：先讀 3:25「主並不偏待人」，才讀 4:1；先讀「求神給我們開」，才談我們怎樣開口。次序對了，經文就不會被拿去替苛刻的老闆、替施壓的傳福音背書。"],["p","聖靈是我的引導：哪一個時機要買回來，哪一句話今天先不說，對眼前這個人該怎樣回答；回答各人靠的不是話術，是求聖靈在那一刻給我們分辨。"],["p","讓耶穌作王：這一章要我讓出三個位子。主人的位子：在公司、在家裡，我不是最後的那一位。開門的人的位子：門是神開的，別人的決定不是我的成績。挑職分的人的位子：職分是從主所受的，大小不由我選。讓耶穌得著一切的榮耀：寫下「使他可以在凡事上居首位」的人，用一隻被鎖住的手簽名；榮耀歸他，鎖鍊歸我。"],["p","建立屬神的體系：這份名單給教會四件事。要有一群像以巴弗的人，讓長輩組成代禱團隊；要有一條像馬可的回頭路，有接納，也有陪伴與責任；要有像寧法那樣打開的家；也要像那封念完就交給老底嘉的信，每一份造就人的材料都問一句：下一個讀它的人是誰？321 的「235」不是先畫好格子再把人塞進去，是在這樣一群人身上長出來的。"],["h","八、四種心，各在名單上看見自己"],["p","驕傲型的心，容易坐在主人的位子上：對比自己弱的人說話最不客氣，傳福音時在乎的是自己的口才和成果。4:1 對你說：你也有一位主在天上；4:3 對你說：門是神開的，不是你。"],["p","恐懼型的心，怕開口，怕被拒絕，怕家族餐桌上那一刻；也怕自己是下一個底馬。4:3 先叫你禱告，不是先叫你衝；你留在名單上，靠的不是你夠不夠火熱，是 4:18 最後那一句恩惠。"],["p","羞恥型的心，像當年的馬可，或像回家路上的阿尼西謀，心裡知道自己曾經半途離開、曾經虧欠過人。請聽保羅怎樣稱呼他們：親愛忠心的兄弟；你們就接待他。你的名字沒有從主的名單上被劃掉。"],["p","受傷型的心，也許曾經被教會用業績壓過，從此不敢再傳福音；也許被一位領袖傷害，卻看見他很快又被恢復。這一章沒有要你立刻原諒、立刻回到原來的位置。你可以先讓人陪你，把經歷說出來；若你身處危險，先保護安全，讓信得過的人陪你找專業的幫助。"],["d",["我被一位教會領袖傷害過，看見他很快又回到台上，「接待馬可」是不是要我也接受？","不是。馬可是半途離開了宣教的工作，經文沒有說他傷害了誰；4:10 不能拿來要求受害的人立刻接納傷害他的人，更不能叫你不要再提。一個人被恢復以前，教會應當先確認傷害有沒有被正視、受傷的人有沒有被保護、事情有沒有經過公平的處理；你可以把你的經歷告訴一位你信得過、而且與這件事沒有利害關係的牧者或輔導，必要時尋求專業協助。饒恕是一段路，不是一個被催出來的動作；在走這段路的時候，你不必勉強自己坐在他的講台下。"]],["h","九、這一週，你可以做的幾件事"],["p","以下五件事，請在散會以前寫下時間、地點和名字。"],["p","第一，寫下家裡或公司一位天天替你做事的人的全名，這一週當面謝謝他一次；若你是老闆或主管，檢查一次工資、休假與加班費是否按時、按約給足。"],["p","第二，每天晚上用五分鐘照 4:2 禱告：先說三件今天要感謝的事，再為一位外人求神開門；七天寫在同一頁。"],["p","第三，這一週在網路或群組裡回應任何與信仰、政治、社會議題有關的話以前，先停十秒問自己：這句話有恩典嗎？是鹽還是辣椒？不確定的，就不按送出。"],["p","第四，聯絡一位曾經離開小組或教會的人，不問他為甚麼離開，只告訴他：我們記得你。"],["p","第五，找出一份你已經放下、卻知道是從主領受的服事，寫下放下它的原因；若是因為受傷，告訴一位牧者；若只是忙碌或懶散，這一週做一件小事把它撿回來。"],["p","然後我們一起開口說出四句話。"],["p","我宣告：我也有一位主在天上；我怎樣待替我做事的人，是交給他看的。"],["p","我宣告：傳道的門是神開的；我禱告、我等候，我說帶著恩典、調了鹽的話。"],["p","我宣告：我的名字在主的名單上，不靠我從來沒有失敗過，靠的是他的恩惠。"],["p","我宣告：我要謹慎，盡我從主所受的職分；不是做到倒下，是一天一天把它做滿。"],["d",["我已經放下一份服事很久了，4:17 是不是在責備我？我可以卸任嗎？","4:17 是一句提醒，不是一張罰單。保羅沒有說亞基布失職了，經文也沒有說他為甚麼需要這句話；他只是叫全會眾一起去提醒他、陪著他。做滿職分也不等於不准休息、不准卸任。所以請先誠實地分辨：你放下，是因為受了傷、身體撐不住，還是只是慢慢淡了？若是前三種，那需要的是被照顧，可以告訴牧者，好好交接、好好休息。若是淡了，可以從一件小事撿回來。職分是從主所受的，所以卸任也可以在主面前好好地卸，而不是悄悄地消失。"]],["h","十、結語"],["p","我們回到那一隻手。推基古把信收進皮袋，阿尼西謀深吸一口氣，兩個人上路了。後來在歌羅西，在老底嘉寧法家的燈下，這封信一次又一次被念出來；讀到最後一行，有人把信轉過來，讓大家看那幾個歪歪的大字。"],["p","這一課的焦點，不在保羅有多堅強，也不在名單上誰比較忠心、誰後來走掉了。焦點在那一位居首位的主：他自己也曾經被綁著，在十字架上把我們的字據撤去，替我們付清了帳。恩惠是有人付了代價送到的，最先付代價的是他。所以你不必更佩服保羅，也不必害怕自己是底馬；你只要回到那一位主面前，領受他交給你的那一份，把它做滿。"],["p","我們一起低頭禱告。在天上的主，謝謝你看著主人，也看著僕人。求你赦免我們對替我們做事的人不公道，赦免我們把傳福音當成業績，把話說成了辣椒。求你給我們開傳道的門，教我們對每一個人說帶著恩典的話。保守在職場被苛待的弟兄姊妹，安慰曾經半途離開、不敢回來的人，也記念今天在各地為信仰被捆鎖的肢體。叫我們每一個人都謹慎，盡我們從你所受的職分。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","這一個鐘頭不比誰最會傳福音，是讓每一個人說出自己待人的公道、門外那一位朋友的名字，以及主交給自己、要做滿的那一份；以下三個化，請組長照著次序帶。"],["m","帶領說明：本課主軸是門、名、滿。席上可能有在職場被苛待的人、曾被教會傷害或從服事裡退下來的人，請先讀第二化的帶領提醒。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：講得出三個觀念：4:1 的公平有公道與對等兩層；門是神開的，話要調鹽；4:17 的職分是從主所受、要做滿的。"],["n","1. ★ 你收過最難忘的一封信、一張卡片或一則訊息是甚麼？是誰寫給你的？你現在還留著它嗎？"],["n","2. ★★★ 請用自己的話說出 4:3–6 的三個原文亮光：門是誰開的？時機和時間差在哪裡？鹽和辣椒又差在哪裡？"],["n","3. ★★ 4:1 的「公公平平」有公道與對等兩層。請舉一個今天職場的例子，分別說出這兩層各是甚麼樣子。"],["n","4. ★★ 名單上的馬可被接回來，底馬後來走掉了，保羅卻都只寫名字和問安。這對我們在教會裡談論離開的人，有甚麼提醒？"],["m","帶領提醒：第一題輕鬆帶；談到 4:1 時不點名任何人的公司或雇主，談到馬可與底馬時，不在組裡評論任何一位離開教會的人。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：看見自己怎樣待比自己弱的人，聽見 4:17 對自己說的話，寫下這一週要走的一步。"],["t","【看】看見自己"],["n","5. ★★★ 說出一位天天替你做事、地位比你低的人：幫傭、助理、管理員或外送員。你知道他的全名嗎？你最近一次對他說話的語氣，像對一位和你站在同一位主面前的人嗎？"],["t","【聽】聽神說話"],["n","6. ★★ 請慢慢讀 4:17 兩遍，第二遍把「亞基布」換成你自己的名字。你聽見主交給你的那一份是甚麼？你心裡先浮起來的是感謝、壓力，還是愧疚？"],["t","【想】想通關卡"],["n","7. ★★★ 那一份你已經放下、或做得很勉強的服事，你為甚麼放下？是受了傷、太累、家裡走不開，還是覺得這不是我想做的？不必說細節。"],["t","【講】說出口"],["n","8. ★★ 請對組裡的人說：我從主領受的那一份是……，這一週我要為它做一件小事。右手邊的人只回一句「主記得你」，不給建議。"],["t","【行】走一步"],["n","9. ★★★ 寫下這一週你要走的一步：哪一天、在哪裡、對誰，做那件把職分撿回來或做滿的小事；若你放下是因為受傷，改寫下你要告訴的那一位牧者或信得過的人的名字。"],["m","帶領提醒：這一化可能碰到職場霸凌、教會傷害或長期無望感。不追問細節，不要求原諒或和好，不對正在流淚的人說「你要有信心」；有人說出被剝削或正處在危險中，會後單獨關心，先確認安全，必要時協助尋求專業協助。第七題之後留三十秒安靜。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課搬進行事曆：一扇門、一句鹽、一個名字、一個「2」。"],["n","10. ★★ 說出一位你身邊外人的名字或稱呼。這一週哪一天你要為他禱告求神開門，哪一天找一個時刻陪他坐十分鐘，只聽，不急著講道？"],["n","11. ★ 說出一則你最近在網路或群組裡想回、卻可能是辣椒的話。現在當場把它改寫成一句帶著恩典、調了鹽的話，念給組裡的人聽。"],["n","12. ★★ 說出一位曾經離開小組或教會、你這一週要聯絡的人，你會打電話、傳訊息，還是約吃飯？哪一天？第一句話要說甚麼？"],["n","13. ★★★ 這是本課的 920 操練：讀 4:7–14 那份名單，像推基古陪阿尼西謀回家、巴拿巴陪馬可重新出發那樣，找出你的那一個「2」，當場說出他的名字，說出這一週哪一天你要向他分享 4:17，並問他：主交給你的那一份是甚麼？我可以怎樣陪你把它做滿？"],["n","14. ★★★ 【必做】繁殖任務：用三句話把這一課講給一位教會外的朋友聽。第一句，我讀到一封兩千年前的信，最後一行是一個戴著鍊子的人親手寫的，他說：願恩惠常與你們同在。第二句，他說連作主人的頭上也有一位主，所以要公平待替我們做事的人，說話也要帶著恩典，像用鹽調味。第三句，他最後對一個普通人說，把主交給你的那一份做滿，我覺得這句話也是對我說的。這一週講給一個人，下次回來說他的反應。"],["m","帶領提醒：要具體到時間、地點、人名，不收「我會多禱告」「我會注意說話」這類答案；不訂傳福音的人數目標。"],["s","收尾（5分鐘）"],["p","請每一個人用一句話說：這一週我要求神開門的那一位是誰，或我要撿回來的那一份職分是甚麼。"],["p","然後彼此代禱，為四種人指名禱告：一位正在被老闆或主管苛待的弟兄姊妹；一位小組想傳福音、門還沒有開的朋友；一位曾經在服事裡受傷、放下了職分的同工；以及一間在受逼迫之地的教會，記念他們的捆鎖。"],["p","散會以前，確認紙上寫了三樣：要謝謝的那一位全名、要聯絡的那一個名字、你的那個「2」。下次帶來對。"]]}}}</script>

   * 寫這些句子的時候想的是：一位牧者站在台上，講到這裡會怎麼開口？
   * 不是「系統提示音」，是一個人在講話。
   * ------------------------------------------------------------------- */

  var T = {
    /* 分段／節標題：{n} 是段序（中文數字），{t} 是標題 */
    section: [
      '第{n}段，{t}。',
      '我們來看第{n}段，{t}。',
      '接下來是第{n}段：{t}。',
      '第{n}段講的是{t}。',
      '我們往下走。第{n}段，{t}。',
      '來到第{n}段，{t}。'
    ],
    /* 沒有段序、只有標題的時候 */
    heading: [
      '{t}。',
      '我們來看{t}。',
      '接下來談{t}。',
      '底下是{t}。',
      '這一段講{t}。'
    ],
    /* 序號題目：{n} 是題序 */
    numbered: [
      '第{n}題。',
      '我們看第{n}題。',
      '接著是第{n}題。',
      '來到第{n}題。',
      '第{n}題這樣問。',
      '我們往下，第{n}題。'
    ],
    /* 條列裡的第幾點 */
    item: [
      '第{n}，',
      '{n}是，',
      '再來，',
      '接著，',
      '還有一點，'
    ],
    /* 想更深：問 */
    deeper: [
      '我們在這裡想更深一點。有人會問，',
      '這裡容我多說一句。可能有人心裡正在問，',
      '我知道有人讀到這裡會停下來問，',
      '讓我們把這一段再往裡走一步。有人問，',
      '這裡有一個問題值得停下來。有人問，',
      '也許你正在想這個問題：'
    ],
    /* 想更深：答 */
    deeperAnswer: [
      '我的回答是這樣。',
      '我是這樣看的。',
      '我們可以這樣想。',
      '這一題我會這樣回答。',
      '讓我這樣說。',
      '答案其實就在經文裡。'
    ],
    /* 五步驟：{k} 是「看」「聽」「想」「講」「行」，{t} 是內容 */
    step: [
      '這一步是「{k}」。{t}',
      '接下來我們「{k}」。{t}',
      '「{k}」這一步：{t}',
      '先來「{k}」。{t}',
      '我們「{k}」。{t}'
    ],
    /* 收尾 */
    wrap: [
      '我們來收尾。',
      '最後，我們把這一段收起來。',
      '到這裡，我們收個尾。',
      '讓我們把這一段收在一起。'
    ],
    /* 表格：畫面上是表，耳朵裡是一段話 */
    table: [
      '這裡有一張表，我用說的帶你看過一遍。',
      '接下來這一段本來是一張表，我把它讀成一段話。',
      '這一段我整理成了表格，用聽的是這樣。',
      '底下是一張對照表，我一列一列說。'
    ],
    /* 條列 */
    list: [
      '這裡有幾點。',
      '底下分成幾點來看。',
      '這一段有幾點。',
      '我列了幾點。'
    ],
    /* 引用經文 */
    quote: [
      '經上說：',
      '聖經這樣說：',
      '我們來讀這一節：',
      '這一節是這樣寫的：'
    ],

    /* ── 開始、暫停、停止、接續 ──────────────────────────────────
     * 這四件事本來沒有聲音：按下去就開始唸，按停就沒聲了。
     * 少了這一句話，聽的人不知道自己在哪裡——尤其是「從書籤繼續」，
     * 冷不防從半路唸起，耳朵會以為前面漏掉了。
     *
     * 一位牧者不會這樣帶人。他會說「我們接著上次停的地方」。
     * ------------------------------------------------------------- */

    /* 開始：{t} 是這一課的名字 */
    start: [
      '我們一起來讀{t}。',
      '{t}。我們開始。',
      '來，我們讀{t}。',
      '我們從{t}開始。',
      '{t}，我們一起聽。'
    ],
    /* 開始，可是不知道叫什麼名字 */
    startBare: [
      '我們開始。',
      '來，我們一起來讀。',
      '我們一起來讀這一段。',
      '好，我們開始讀。'
    ],
    /* 指定從第幾段開始：{n} 段序，{t} 標題 */
    startAt: [
      '我們從第{n}段開始，{t}。',
      '這一次從第{n}段起，{t}。',
      '我們直接來到第{n}段，{t}。',
      '從第{n}段讀起。{t}。',
      '我們從第{n}段往下讀，{t}。'
    ],
    /* 指定從第幾段開始，可是那一段沒有標題 */
    startAtBare: [
      '我們從第{n}段開始。',
      '這一次從第{n}段起。',
      '我們直接來到第{n}段。',
      '從第{n}段讀起。'
    ],
    /* 接著上次停的地方：{n} 段序 */
    resume: [
      '我們接著上次停的地方，從第{n}段繼續。',
      '上一次讀到第{n}段，我們從那裡接下去。',
      '我們回到第{n}段，接著往下讀。',
      '接著剛才停下來的地方，第{n}段。',
      '我們從第{n}段再往下走。'
    ],
    /* 暫停 */
    pause: [
      '我們先停在這裡。',
      '先停一下。',
      '到這裡先歇一口氣。',
      '我們暫時停在這裡。'
    ],
    /* 停止 */
    stop: [
      '今天先讀到這裡。',
      '我們就讀到這裡。',
      '這一段先停在這裡。',
      '好，我們先到這裡。'
    ]
  };

  /* 表格與條列讀出來的零件。
   *
   * 這一組本來寫死在程式裡，英文版於是唸成
   * 「What follows was laid out as a table. 先看「x」，y。」——
   * 一半英文一半中文，而且所有測試都過，因為沒有人驗長相。
   *
   * 凡是會被唸出來或看到的字，一律要能換掉。 */
  var W = {
    rowFirst: ['先看', '我們先看', '第一個'],
    rowMid: ['再看', '接著', '然後', '再來', '接下來'],
    rowLast: ['最後'],
    cols: '這張表有{n}欄：{list}。',
    row2: '{link}「{label}」，{value}。',      // 兩欄表
    rowN: '{link}「{label}」：{parts}。',      // 三欄以上
    pair: '{col}是{value}',
    pairSep: '；',
    listSep: '、',
    itemFirst: '第{n}，',
    itemLast: '最後，',
    end: '。'
  };

  var DEF = {
    seed: 0,             // 換一課就換一個起點，整課的節奏不會跟上一課一樣
    speakUnit: true,
    cls: 'nar',          // HTML 的 class 前綴
    words: null,         // 上面那一組零件；英文版整組換掉
    /* 序號怎麼寫。預設中文數字（第三段）；英文版給 String（Section 3）。
       這一格漏了的話，英文版會唸成「Section 三」——模板全換成英文了，
       塞進去的數字還是中文，而且每一項測試都過，因為沒有人驗長相。 */
    num: null,           // fn(n) -> string
    labels: { col: '欄', row: '列' }
  };

  var C = null;

  function ext(a, b) { for (var k in b) if (b.hasOwnProperty(k)) a[k] = b[k]; return a; }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function cfg() { return C || (C = ext({}, DEF)); }

  /* 中文數字。跟 REF321 的那一份刻意各留一份——
     這兩個模組不互相依賴，要能單獨掛。 */
  function cn(n) {
    n = parseInt(n, 10);
    var d = '零一二三四五六七八九';
    if (isNaN(n)) return '';
    if (n < 10) return d.charAt(n);
    if (n < 20) return '十' + (n % 10 ? d.charAt(n % 10) : '');
    if (n < 100) return d.charAt(Math.floor(n / 10)) + '十' + (n % 10 ? d.charAt(n % 10) : '');
    return String(n);
  }

  /* ── 挑一套 ────────────────────────────────────────────────────────
   * 用位置算，不用亂數。同一課唸兩次要一模一樣——
   * 亂數的話逐句標示與跟讀會對不上，而且使用者會覺得「怎麼跟剛才不一樣」。
   *
   * 各種帶入詞不可以同步：如果每一種都用 i % n，那麼第 0 個分段配第 0 個
   * 題目、第 1 個分段配第 1 個題目，整課的節奏會出現一種說不上來的規律感。
   * 所以混進種類名字的雜湊，讓每一種各走各的。
   * ------------------------------------------------------------------- */

  function hash(kind) {
    var h = 0, i;
    for (i = 0; i < kind.length; i++) h = (h * 31 + kind.charCodeAt(i)) % 9973;
    return h;
  }

  /* 序號：數字才轉，已經是字串的就原樣送出（宿主給「十二」那種） */
  function num(n) {
    if (typeof n !== 'number') return n == null ? '' : String(n);
    var f = cfg().num;
    if (f) { try { return String(f(n)); } catch (e) {} }
    return cn(n);
  }

  function pick(kind, i) {
    var arr = T[kind];
    if (!arr || !arr.length) return '';
    var n = (Math.abs(parseInt(i, 10) || 0) + hash(kind) + (cfg().seed | 0)) % arr.length;
    return arr[n];
  }

  function fill(tpl, vars) {
    return String(tpl).replace(/\{(\w+)\}/g, function (m, k) {
      return vars && vars[k] != null ? String(vars[k]) : '';
    });
  }

  /* ── 對外的幾種帶入 ─────────────────────────────────────────────── */

  function lead(kind, i, vars) { return fill(pick(kind, i), vars || {}); }

  function section(title, n, i) {
    title = String(title == null ? '' : title).replace(/[。．.]$/, '');
    if (n == null || n === '') return fill(pick('heading', i), { t: title });
    return fill(pick('section', i), { n: num(n), t: title });
  }

  function numbered(n, i) {
    return fill(pick('numbered', i), { n: num(n) });
  }

  function step(key, body, i) {
    return fill(pick('step', i), { k: key, t: String(body == null ? '' : body) });
  }

  function deeper(q, i) { return pick('deeper', i) + String(q == null ? '' : q); }
  function deeperAnswer(i) { return pick('deeperAnswer', i); }
  function wrap(i) { return pick('wrap', i); }

  /* ── 開始、暫停、停止、接續 ────────────────────────────────────────
   * `i` 是輪替的位置。分段、題目那些有天然的位置（第幾塊），
   * 這四種沒有——所以慣例是：
   *
   *   · 開始／接續：傳 0（種子已經一課一換，整課的第一句自然就不一樣）
   *   · 暫停／停止：傳「這一課按了第幾次」，同一課連按兩次才不會一樣
   *
   * 標題末尾的句號要去掉，不然會唸成「創世記第一章。。我們開始」。
   * ------------------------------------------------------------------- */

  function title_(t) {
    return String(t == null ? '' : t).replace(/[。．.\s]+$/, '');
  }

  function start(title, i) {
    var t = title_(title);
    if (!t) return pick('startBare', i);
    return fill(pick('start', i), { t: t });
  }

  function startAt(n, title, i) {
    var t = title_(title);
    var v = { n: num(n), t: t };
    if (!t) return fill(pick('startAtBare', i), v);
    return fill(pick('startAt', i), v);
  }

  function resume(n, i) {
    return fill(pick('resume', i), { n: num(n) });
  }

  function pause(i) { return pick('pause', i); }
  function halt(i) { return pick('stop', i); }

  /* ── Markdown ─────────────────────────────────────────────────────
   * 只認小智真的會用到的那幾種：標題、粗體、條列、編號、表格、引用、行內碼。
   * 不做完整的 Markdown——做完整的話要處理巢狀、參考式連結、HTML 混排，
   * 那是一整個函式庫，而且錯了會把整段答案弄亂。
   * ------------------------------------------------------------------- */

  function isTableLine(l) { return /^\s*\|.*\|\s*$/.test(l); }
  function isDivider(l) { return /^\s*\|[\s:|-]*\|\s*$/.test(l) && l.indexOf('-') >= 0; }

  function cells(l) {
    var t = String(l).replace(/^\s*\|/, '').replace(/\|\s*$/, '');
    var out = t.split('|'), i;
    for (i = 0; i < out.length; i++) out[i] = out[i].replace(/^\s+|\s+$/g, '');
    return out;
  }

  /* 把整段切成一塊一塊：段落、標題、條列、編號、表格、引用 */
  function blocks(md) {
    var lines = String(md == null ? '' : md).replace(/\r\n?/g, '\n').split('\n');
    var out = [], i = 0;
    while (i < lines.length) {
      var l = lines[i];
      if (!l.replace(/\s/g, '')) { i++; continue; }

      if (isTableLine(l) && i + 1 < lines.length && isDivider(lines[i + 1])) {
        var head = cells(l), rows = [];
        i += 2;
        while (i < lines.length && isTableLine(lines[i])) { rows.push(cells(lines[i])); i++; }
        out.push({ k: 'table', head: head, rows: rows });
        continue;
      }
      var m = l.match(/^\s*(#{1,6})\s*(.+)$/);
      if (m) { out.push({ k: 'h', n: m[1].length, t: m[2] }); i++; continue; }
      if (/^\s*>/.test(l)) {
        var q = [];
        while (i < lines.length && /^\s*>/.test(lines[i])) {
          q.push(lines[i].replace(/^\s*>\s?/, '')); i++;
        }
        out.push({ k: 'quote', t: q.join('\n') });
        continue;
      }
      if (/^\s*([-*・]|\d+[.、)])\s+/.test(l)) {
        var items = [], ord = /^\s*\d+[.、)]/.test(l);
        while (i < lines.length && /^\s*([-*・]|\d+[.、)])\s+/.test(lines[i])) {
          items.push(lines[i].replace(/^\s*([-*・]|\d+[.、)])\s+/, '')); i++;
        }
        out.push({ k: 'list', ord: ord, items: items });
        continue;
      }
      var p = [];
      while (i < lines.length && lines[i].replace(/\s/g, '') &&
             !isTableLine(lines[i]) && !/^\s*(#{1,6}\s|>|[-*・]\s|\d+[.、)]\s)/.test(lines[i])) {
        p.push(lines[i]); i++;
      }
      /* 一行都沒收進來的話，i 就不會動——那是一個無窮迴圈，而且會把
         陣列撐爆。會走到這裡的是「長得像表格、可是下一行不是分隔線」
         那種行（例如只有一行的 `| 這不是表格 |`）。
         這種行就當成普通一段，硬收一行再往下走。 */
      if (!p.length) { p.push(lines[i]); i++; }
      out.push({ k: 'p', t: p.join('\n') });
    }
    return out;
  }

  /* 行內：粗體、行內碼。斜體不做——`*` 跟條列的記號同一個，
     分不乾淨的時候寧可原樣留著，也不要把句子拆壞。 */
  function inlineHTML(t) {
    return esc(t)
      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\n/g, '<br>');
  }
  function inlineText(t) {
    return String(t == null ? '' : t)
      .replace(/\*\*([^*]+)\*\*/g, '$1')
      .replace(/`([^`]+)`/g, '$1')
      .replace(/^\s+|\s+$/g, '');
  }

  /* ── 給眼睛看的 ──────────────────────────────────────────────────── */

  function html(md) {
    var bs = blocks(md), out = [], i, b, j, c = cfg().cls;
    for (i = 0; i < bs.length; i++) {
      b = bs[i];
      if (b.k === 'h') {
        out.push('<p class="' + c + 'h' + (b.n <= 2 ? '' : ' sm') + '">' + inlineHTML(b.t) + '</p>');
      } else if (b.k === 'quote') {
        out.push('<blockquote class="' + c + 'q">' + inlineHTML(b.t) + '</blockquote>');
      } else if (b.k === 'list') {
        var tag = b.ord ? 'ol' : 'ul';
        var li = '';
        for (j = 0; j < b.items.length; j++) li += '<li>' + inlineHTML(b.items[j]) + '</li>';
        out.push('<' + tag + ' class="' + c + 'l">' + li + '</' + tag + '>');
      } else if (b.k === 'table') {
        var h = '<div class="' + c + 'tw"><table class="' + c + 't"><thead><tr>';
        for (j = 0; j < b.head.length; j++) h += '<th>' + inlineHTML(b.head[j]) + '</th>';
        h += '</tr></thead><tbody>';
        for (j = 0; j < b.rows.length; j++) {
          h += '<tr>';
          for (var k = 0; k < b.head.length; k++) {
            h += '<td>' + inlineHTML(b.rows[j][k] || '') + '</td>';
          }
          h += '</tr>';
        }
        out.push(h + '</tbody></table></div>');
      } else {
        out.push('<p>' + inlineHTML(b.t) + '</p>');
      }
    }
    return out.join('');
  }

  /* ── 給耳朵聽的 ──────────────────────────────────────────────────── */

  /* 一張表讀成一段話。
     第一欄當成那一列在講什麼，其餘各欄是它的內容。
     兩欄表最單純：「甲，是乙。」 */
  function w() { return (cfg().words) || W; }

  function tableSpeech(b, i) {
    var head = b.head || [], rows = b.rows || [], out = [], j, k, ww = w();
    out.push(pick('table', i));
    /* 兩欄表不必報欄數——「這張表有二欄」是廢話，而且拖慢節奏。
       三欄以上才值得先說一聲，不然聽的人跟不上後面的對照。 */
    if (head.length >= 3) {
      out.push(fill(ww.cols, { n: num(head.length), list: head.join(ww.listSep) }));
    }
    for (j = 0; j < rows.length; j++) {
      var r = rows[j], label = inlineText(r[0] || '');
      var link = j === 0 ? ww.rowFirst[(i + j) % ww.rowFirst.length]
               : (j === rows.length - 1 && rows.length > 2 ? ww.rowLast[0]
                  : ww.rowMid[(i + j) % ww.rowMid.length]);
      if (head.length === 2) {
        out.push(fill(ww.row2, { link: link, label: label, value: inlineText(r[1] || '') }));
      } else {
        var parts = [];
        for (k = 1; k < head.length; k++) {
          var v = inlineText(r[k] || '');
          if (v) parts.push(fill(ww.pair, { col: inlineText(head[k]), value: v }));
        }
        out.push(fill(ww.rowN, { link: link, label: label, parts: parts.join(ww.pairSep) }));
      }
    }
    return out.join('');
  }

  function listSpeech(b, i) {
    var out = [], j;
    if (b.items.length > 2) out.push(pick('list', i));
    for (j = 0; j < b.items.length; j++) {
      var t = inlineText(b.items[j]);
      if (!t) continue;
      /* 前兩點說「第一」「第二」，後面換成連接詞——
         十點全部報數，聽的人會累。 */
      var ww = w();
      var head = j < 2 ? fill(ww.itemFirst, { n: num(j + 1) })
               : (j === b.items.length - 1 ? ww.itemLast
                  : fill(pick('item', i + j), { n: num(j + 1) }));
      out.push(head + t + (/[。！？.!?]$/.test(t) ? '' : ww.end));
    }
    return out.join('');
  }

  /* 整段 Markdown → 適合唸出來的純文字。
     opt.drop：一個 fn(text)->text，唸之前還要拿掉的東西
     （例如括號裡的經文出處：REF321.dropParenRefs）。 */
  function speech(md, opt) {
    opt = opt || {};
    var bs = blocks(md), out = [], i, b, t;
    var base = opt.i || 0;
    for (i = 0; i < bs.length; i++) {
      b = bs[i];
      if (b.k === 'table') { out.push(tableSpeech(b, base + i)); continue; }

境、感受或疑問切入，再帶到經文，讓他覺得「這跟我有關」。②用最平常的話說；321理念只是你心裡的方向，不要在回答裡出現「無己、作王、得勝、屬靈」這類內部用語，也不用教會與神學術語；一定要提到的詞（如恩典、罪、救恩），馬上用生活的說法解釋。③誠實、尊重、不說教、不施壓、不要求他現在就相信，也不論斷他；有疑問或質疑很正常，先認真承認那個問題的份量，再誠實回答。④清楚說出聖經在這件事上的真理（神是怎樣的神、耶穌為我們做了什麼），用故事、比喻和日常例子，讓他聽得懂、記得住。⑤一定要有實際有用的幫助：給一兩個他這個星期就能自己試試看的小步驟（一個觀察、一個提問、一個簡單的行動）。⑥合適時，可以溫和邀請他繼續探索（例如讀一小段、問一個問題），不要硬把話題轉到決志。⑦不要說「我們基督徒都知道」這類預設他已經信的話。引用經文用和合本，並用白話解釋它的意思。若寫到禱告，只當作「若你願意，可以這樣對神說」的邀請，不強迫。整個回答要簡明、段落要短。", "write": "\n讀者是還沒信主的朋友：用生活化、親切、不說教的話，不用教會術語，不預設他已經信；不要用表情符號。", "style": "風格：給還沒信主、沒讀過聖經的人。題目要把背景交代清楚（人物、事件的名字直接寫出來），不假設他懂聖經或教會用語；用字平實，解析用一句白話說明這件事對一般人有什麼意義。", "res": ["沒關係，剛接觸這些內容本來就不容易，再看一遍會更清楚。", "不錯喔！你已經抓到這一章的重點了。", "太厲害了！你對這一章的內容很清楚。"], "q": ["這段話跟我現在的生活有什麼關係？", "我還不是基督徒，這段話對我有什麼意義？", "神真的存在嗎？有什麼理由可以相信？", "聖經為什麼說每個人都需要耶穌？", "我壓力很大，聖經能給我什麼實際的幫助？", "這段話裡的「罪」是什麼意思？跟我有關嗎？", "基督徒常說的「恩典」，用白話說是什麼？", "如果我想多了解，可以從哪裡開始？"], "fu": [["🤝", "人際", "剛才說的放在人際關係裡（家人、朋友、同事），對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["💍", "婚姻家庭", "剛才說的放在婚姻與家庭裡，對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["💼", "工作", "剛才說的放在工作與職場裡，對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["😟", "壓力焦慮", "剛才說的放在壓力與焦慮裡，對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["🌍", "人生意義", "剛才說的放在尋找人生的意義與方向裡，對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["❓", "我的疑問", "我心裡還有疑問，請誠實告訴我：信耶穌對一個人的生活到底有什麼實際的幫助？也請告訴我可以怎麼自己去查證。"], ["🌱", "下一步", "如果我想進一步了解，下一步可以做什麼？請給我一兩個不會有壓力的建議。"]]}, "elder": {"sys": " 回答對象：長輩（約65歲以上）。請用尊敬、溫和、慢慢說的口吻，像晚輩敬重地陪長輩讀經；句子清楚、不拐彎，不用網路用語和英文縮寫；比喻取自一生的閱歷（田地、家人、歲月、病痛、孫子、老街坊）。重點先講，分成短段落，不要太長。肯定他們一生走過的路與在主裡的忠心，不說教、不指責、不用「你應該」。可以談健康與軟弱、孤單、放下與交託、把信仰傳給下一代、永恆的盼望與感恩。結尾給一件簡單、容易做到的小事（一句禱告、打電話問候家人、數算一件感謝）。若提到身體不適、孤單或失去親人，要先溫柔安慰，並鼓勵他和家人、教會關懷同工聯絡。", "write": "\n讀者是長輩：用語尊敬、溫和、清楚好懂，不用網路用語；不要用表情符號。", "style": "風格：給長輩，字詞平實、句子清楚，題目不要繞、不要太冷僻，選項簡短；解析用一句溫和的話。", "res": ["沒關係，慢慢來，再讀一遍會更清楚。", "很好！這一章的話您記得不少。", "太好了！神的話已經住在您心裡。"], "q": ["這段經文用最簡單的話，是在說什麼？", "這段經文對年紀大的人有什麼安慰？", "身體漸漸衰弱了，神怎麼看顧我？", "我常常覺得孤單，這段經文能給我什麼？", "我該怎麼把信仰傳給兒孫？", "有些事放不下，這段經文怎麼教我交託？", "我老了，還能為神做什麼？", "請幫我寫一段簡短的禱告，我想念給主聽。"], "fu": [["🩺", "健康", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在身體的軟弱與健康，並給我一個這個星期做得到的具體小步驟。"], ["🤍", "孤單", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在孤單與思念，並給我一個這個星期做得到的具體小步驟。"], ["👨‍👩‍👧‍👦", "兒孫", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在和兒孫、家人的關係，並給我一個這個星期做得到的具體小步驟。"], ["🕊️", "交託", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在放下心中的牽掛、交託給主，並給我一個這個星期做得到的具體小步驟。"], ["🌅", "盼望", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在永恆的盼望與感恩，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，用簡單的話寫成一段短短的禱告，讓我可以慢慢念給主聽。"]]}, "single_parent": {"sys": " 回答對象：單親爸爸或媽媽（一個人撐起一個家）。請先接住他的辛苦：他常常很累、有愧疚、有孤單，也有經濟、時間與教養的壓力。口吻溫暖、接納、不評斷，不追問過去的原因，不說「你應該再找個伴」，也不把單親說成缺憾。引用神的心意：神是孤兒的父、寡婦的伸冤者（詩篇68:5），祂與我們同在。再給盼望與實際：每一個小步驟都要在忙碌中做得到（五分鐘禱告、跟孩子的一個小儀式、開口向弟兄姊妹求助）。內容簡短、段落要短。結尾給一個這個星期做得到的小步驟。若他提到被暴力對待、疲憊到撐不下去或想傷害自己，要溫柔回應，並鼓勵他立刻聯絡信任的人、教會同工或專業協助。", "write": "\n讀者是單親爸媽：口吻溫暖、接納、不評斷，肯定他的辛苦；不要用表情符號。", "style": "風格：給單親爸媽，題目貼近日常的忙碌、教養與盼望；口氣溫暖，解析一句話帶出安慰。", "res": ["沒關係，您已經很努力了，有空再讀一遍就好。", "不錯！在這麼忙的日子裡還記得這麼多。", "太棒了！神的話正在托住您。"], "q": ["這段經文對一個人撐起一個家的我，有什麼安慰？", "我常常覺得累，也覺得對孩子有虧欠，神怎麼看？", "神怎麼看顧孤兒和寡婦？這跟我有什麼關係？", "經濟壓力很大，這段經文能給我什麼？", "孩子在頂嘴、情緒很大，我該怎麼辦？", "我不知道怎麼跟孩子說爸爸（或媽媽）不在身邊的事。", "我真的很孤單，可以怎麼向教會或弟兄姊妹開口求助？", "請幫我寫一段五分鐘內能禱告完的短禱告。"], "fu": [["😮‍💨", "疲累", "請針對你剛才的回答，說明怎麼把它用在一個人撐家的疲累與內疚，並給我一個這個星期做得到的具體小步驟。"], ["👧", "孩子", "請針對你剛才的回答，說明怎麼把它用在陪伴孩子與教養，並給我一個這個星期做得到的具體小步驟。"], ["💰", "經濟", "請針對你剛才的回答，說明怎麼把它用在經濟與時間的壓力，並給我一個這個星期做得到的具體小步驟。"], ["🤝", "求助", "請針對你剛才的回答，說明怎麼把它用在向弟兄姊妹或教會開口求助，並給我一個這個星期做得到的具體小步驟。"], ["🌤️", "盼望", "請針對你剛才的回答，說明怎麼把它用在在這個階段看見神的同在與盼望，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，寫成一段我在忙碌中五分鐘內就能禱告完的短禱告。"]]}, "single": {"sys": " 回答對象：單身的人（可能未婚、離婚、喪偶，或正在等候；不要預設他想結婚或不想結婚）。請不要把單身說成缺憾、「預備期」或「還沒到的人生」，也不要用催婚的口氣。談在基督裡的身分已經完整、被愛；談孤單時怎麼與神、與朋友、與團契連結；談時間、金錢與恩賜的運用與使命；談等待中的信靠；談感情與婚姻的智慧，以及在情感與身體上的聖潔，態度要尊重、不論斷。口吻真誠、平等、輕鬆。結尾給一個這個星期可以做的小步驟。若他提到孤單到想傷害自己，要溫柔回應並鼓勵他立刻聯絡信任的人或專業協助。", "write": "\n讀者是單身朋友：口吻真誠、平等、輕鬆，不催婚、不把單身說成缺憾；不要用表情符號。", "style": "風格：給單身的朋友，題目貼近孤單、身分、等待、友誼與使命；口氣真誠平等，不催婚。", "res": ["沒關係，慢慢來，再讀一遍就會更清楚。", "不錯喔！你把這一章的重點抓到了。", "太棒了！你很認真，神的話正在你裡面扎根。"], "q": ["單身的我，這段經文想對我說什麼？", "我覺得孤單，這段經文能給我什麼？", "在基督裡，我的身分和價值是什麼？", "等待的時候，要怎麼信靠神？", "感情的事，聖經給我什麼智慧？", "單身的時間和精力，可以怎麼為神所用？", "怎樣在教會和朋友中建立好的關係？", "請幫我寫一段單身者的簡短禱告。"], "fu": [["🫶", "孤單", "請針對你剛才的回答，說明怎麼把它用在孤單時怎麼與神、與朋友連結，並給我一個這個星期做得到的具體小步驟。"], ["💝", "身分", "請針對你剛才的回答，說明怎麼把它用在我在基督裡的身分與價值，並給我一個這個星期做得到的具體小步驟。"], ["⏳", "等待", "請針對你剛才的回答，說明怎麼把它用在等待中的信靠，並給我一個這個星期做得到的具體小步驟。"], ["💞", "感情", "請針對你剛才的回答，說明怎麼把它用在感情與交友的智慧，並給我一個這個星期做得到的具體小步驟。"], ["🎯", "使命", "請針對你剛才的回答，說明怎麼把它用在把時間與恩賜用在神的使命上，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，寫成一段簡短、真誠的禱告，讓我可以拿來禱告。"]]}, "parent": {"sys": " 回答對象：正在養育孩子的父母（孩子可能從嬰幼兒到成年）。請站在父母的位置：他們常常疲累、擔心孩子、也常常內疚。口吻溫暖、貼近生活、不評斷；承認每個孩子與每個家庭都不同。談陪伴與榜樣、管教與恩典的平衡、親子溝通（怎麼聽、怎麼說）、為孩子禱告、夫妻同心、面對自己的軟弱與失敗；可用日常場景當比喻（吃飯、功課、手機、睡前）。結尾給一個這個星期可以做的具體小步驟（一句話、一個擁抱、一段睡前禱告）。若提到孩子遭受傷害、家庭暴力或孩子有自傷的念頭，要溫柔回應並鼓勵立刻尋求專業協助與信任的人。", "write": "\n讀者是正在養育孩子的父母：口吻溫暖、貼近生活、不評斷；不要用表情符號。", "style": "風格：給養育孩子的父母，題目貼近親子溝通、管教、陪伴與為孩子禱告；口氣溫暖，解析一句話帶出提醒。", "res": ["沒關係，慢慢來，有空再讀一遍就會更清楚。", "不錯！這一章的重點您已經抓到了。", "太棒了！神的話正在您的家裡扎根。"], "q": ["這段經文對養育孩子的我有什麼提醒？", "孩子不聽話、情緒很大，我該怎麼回應？", "管教和恩典要怎麼拿捏？", "怎麼跟青春期的孩子好好說話？", "我常常對孩子發脾氣，事後很內疚怎麼辦？", "怎麼帶孩子認識神，而不只是去教會？", "夫妻在教養上意見不同，這段經文怎麼說？", "請幫我寫一段為孩子祝福的短禱告。"], "fu": [["🗣️", "溝通", "請針對你剛才的回答，說明怎麼把它用在跟孩子好好溝通（怎麼聽、怎麼說），並給我一個這個星期做得到的具體小步驟。"], ["⚖️", "管教", "請針對你剛才的回答，說明怎麼把它用在管教與恩典的平衡，並給我一個這個星期做得到的具體小步驟。"], ["😔", "內疚", "請針對你剛才的回答，說明怎麼把它用在對孩子發脾氣或覺得虧欠的內疚，並給我一個這個星期做得到的具體小步驟。"], ["💑", "夫妻", "請針對你剛才的回答，說明怎麼把它用在夫妻在教養上同心，並給我一個這個星期做得到的具體小步驟。"], ["📖", "信仰", "請針對你剛才的回答，說明怎麼把它用在帶孩子認識神、一起親近神，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，寫成一段我可以為孩子祝福的短禱告。"]]}, "couple": {"sys": " 回答對象：夫妻（正在經營婚姻的丈夫與妻子，可能是新婚、有孩子的中年夫妻，或相伴多年的伴侶）。請站在夫妻同行的位置：口吻溫暖、真誠、不評斷，不偏袒任何一方；承認每段婚姻都有磨合、疲累與受傷的時候。談愛是決定與付出、彼此饒恕、傾聽與表達（怎麼說、怎麼聽）、尊重與同心、金錢與家務的分工、姻親與孩子的教養、一起禱告與一起讀經、在主裡成為一體；可用日常場景當比喻（飯桌、手牽手、吵完架之後、睡前）。結尾給一個這個星期兩個人就能一起做的具體小步驟（一句感謝的話、一段兩人的禱告、一次不看手機的散步）。不要教導妻子順服或丈夫掌權的單方面要求，要強調彼此相愛、彼此順服。若提到家庭暴力、外遇、對方的威脅或有自傷念頭，要溫柔回應，把安全放在第一位，並鼓勵立刻尋求專業協助與信任的人，不要勸人一味忍耐。", "write": "\n讀者是夫妻：口吻溫暖、貼近生活、不評斷、不偏袒任何一方；不要用表情符號。", "style": "風格：給夫妻，題目貼近溝通、饒恕、同心、共同禱告與彼此相愛；口氣溫暖，解析一句話帶出提醒。", "res": ["沒關係，慢慢來，找個晚上兩個人再一起讀一遍。", "不錯！這一章的重點你們抓到了。", "太棒了！神的話正在你們的婚姻裡扎根。"], "q": ["這段經文對我們夫妻有什麼提醒？", "我們吵架之後總是冷戰，怎麼先伸出手？", "怎麼把心裡的話好好說給另一半聽？", "對方做錯事傷了我，我真的要饒恕嗎？", "我們為金錢與家務的事常常意見不同，怎麼辦？", "夫妻怎麼一起禱告、一起親近神？", "忙碌的日子裡，夫妻感情變淡了，怎麼重新連結？", "請幫我寫一段為我們婚姻祝福的短禱告。"], "fu": [["🗣️", "溝通", "請針對你剛才的回答，說明夫妻怎麼把它用在好好說、好好聽，並給我們一個這個星期兩個人做得到的具體小步驟。"], ["🤝", "饒恕", "請針對你剛才的回答，說明夫妻怎麼把它用在彼此認錯與饒恕，並給我們一個這個星期兩個人做得到的具體小步驟。"], ["💞", "親密", "請針對你剛才的回答，說明夫妻怎麼把它用在重新連結感情、表達愛與感謝，並給我們一個這個星期兩個人做得到的具體小步驟。"], ["👨‍👩‍👧", "同心", "請針對你剛才的回答，說明夫妻怎麼把它用在金錢、家務與教養上同心，並給我們一個這個星期兩個人做得到的具體小步驟。"], ["📖", "同讀", "請針對你剛才的回答，說明夫妻怎麼一起讀經、一起親近神，並給我們一個這個星期兩個人做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，寫成一段夫妻可以一起禱告的短禱告。"]]}, "pastor": {"sys": " 回答對象：牧者與傳道同工（教會的牧師、傳道人、小組長與事奉的同工）。請站在同工的位置：他們常常肩負許多人的重擔，自己也會疲累、孤單、被誤解或灰心。口吻尊重、平等、真誠，像同工之間彼此扶持，不說教、不居高臨下。可以有適度的深度：點出經文脈絡、原文語境與關鍵字詞的意思，談牧養羊群與生命建造、預備講道與教導、帶領小組與門徒訓練、團隊同心與衝突、面對批評與孤單、屬靈爭戰、自己的靈命與家庭，以及不倦怠的安息與依靠；也可提供講章或查經的切入點、段落與應用建議，但要提醒最後仍須自己在神面前領受。結尾給一個這個星期可以做的具體小步驟（一段安靜親近神的時間、一通關心的電話、一次向同工的坦誠分享）。若提到極度疲憊、憂鬱、想放棄或有自傷念頭，要溫柔回應，並鼓勵立刻尋求信任的同工、屬靈長輩與專業協助。", "write": "\n讀者是牧者與傳道同工：口吻尊重、平等、真誠，像同工彼此扶持；不要用表情符號。", "style": "風格：給牧者與傳道同工，題目貼近牧養、講道預備、帶領團隊、面對疲累與屬靈爭戰；口氣尊重真誠，解析一句話帶出提醒。", "res": ["沒關係，慢慢來，有空再讀一遍就會更清楚。", "不錯！這一章的重點您已經抓到了。", "太棒了！神的話先餵養了牧者，也必流向羊群。"], "q": ["這段經文對事奉中的我有什麼提醒？", "請幫我找這段經文的講道架構與切入點。", "事奉很累、快要倦怠了，這段經文怎麼安慰我？", "怎麼面對教會裡的批評與誤解？", "帶領團隊與同工同心，這段經文怎麼說？", "怎麼在忙碌的牧養中保守自己的靈命？", "怎麼牧養軟弱、受傷或離開的羊？", "請幫我寫一段為教會與同工代求的短禱告。"], "fu": [["📖", "講道", "請針對你剛才的回答，提供一個可用於講道或查經的架構（三個要點與一個應用），並提醒我自己先在神面前領受。"], ["🐑", "牧養", "請針對你剛才的回答，說明怎麼把它用在牧養羊群與關心個別的人，並給我一個這個星期做得到的具體小步驟。"], ["🤝", "團隊", "請針對你剛才的回答，說明怎麼把它用在帶領團隊、同工同心與處理衝突，並給我一個這個星期做得到的具體小步驟。"], ["🕊️", "安息", "請針對你剛才的回答，說明怎麼把它用在自己的疲累與靈命保守，並給我一個這個星期做得到的具體小步驟。"], ["⚔️", "爭戰", "請針對你剛才的回答，說明怎麼把它用在面對批評、孤單與屬靈爭戰，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "代禱", "請把你剛才說的重點，寫成一段我可以為教會與同工代求的短禱告。"]]}}};

  async function aiRaw(sys, ask, ms, maxT) {

    for (let a = 0; a <= waits.length; a++) {

      try {
        const r = await fetch(SVC.xz, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ model: SVC.model, max_tokens: maxT || 1600, system: sys, messages: [{ role: 'user', content: ask }] }),
          signal: ac ? ac.signal : undefined
        });
        if (!r.ok) throw new Error('http ' + r.status);
        const d = await r.json().catch(() => null);
        if (d && d.content && d.content.length) out = d.content.map(b => b.text || '').join('');
        else if (d) out = d.reply || d.text || d.message || '';
        if (!out) why = T('回覆是空的', 'empty reply');
        clearTimeout(tm);

      } catch (e) {
        clearTimeout(tm);
        why = (e && e.name === 'AbortError') ? T('逾時', 'timeout') : ((e && e.message) ? String(e.message) : 'network');
        if (a === waits.length) break;
        await new Promise(rs => setTimeout(rs, waits[a]));
      }
    }
    return { out: String(out || '').trim(), why };
  }

${st}請用繁體中文。只回傳 JSON，不要任何說明、不要 markdown 圍欄：{"r":[{"t":"人物","h":["提示1","提示2","提示3"],"a":"答案","alt":["別名"],"v":"3","e":"亮點"}]}`;

  function plParse(text) {
    let s = String(text || '').replace(/```(?:json)?/gi, '').trim();
    const st = s.indexOf('{'); if (st < 0) return null;
    s = s.slice(st);
    try { return JSON.parse(s.slice(0, s.lastIndexOf('}') + 1)); } catch (e) {}
    const m = s.match(/"(q|r)"\s*:\s*\[/); if (!m) return null;
    let i = m.index + m[0].length; const items = [];
    while (i < s.length) {
      while (i < s.length && s[i] !== '{') i++;
      if (i >= s.length) break;
      let depth = 0, inStr = false, es = false, j = i;
      for (; j < s.length; j++) {
        const c = s[j];
        if (inStr) { if (es) es = false; else if (c === '\\') es = true; else if (c === '"') inStr = false; }
        else if (c === '"') inStr = true;

      try { items.push(JSON.parse(s.slice(i, j + 1))); } catch (e) {}

  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; };
  function vOf(v) {

  function normQuiz(list, src, k) {

      const as = String(x.a).trim();
      const ai = /^[A-Da-d]$/.test(as) ? 'abcd'.indexOf(as.toLowerCase()) : (as === '' ? NaN : +x.a);

function mx_u32(b,p){return b[p]*16777216+b[p+1]*65536+b[p+2]*256+b[p+3];}
function mx_i32(b,p){const v=mx_u32(b,p);return v>=2147483648?v-4294967296:v;}
function mx_u64(b,p){return mx_u32(b,p)*4294967296+mx_u32(b,p+4);}
function mx_typ(b,p){return String.fromCharCode(b[p],b[p+1],b[p+2],b[p+3]);}

function mx_boxes(b,start,end){
  const out=[];let p=start;
  while(p+8<=end){
    let size=mx_u32(b,p),hs=8;
    if(size===1){size=mx_u64(b,p+8);hs=16;}
    else if(size===0)size=end-p;
    if(size<8||p+size>end)break;
    out.push({type:mx_typ(b,p+4),start:p,size:size,hs:hs,body:p+hs,end:p+size});
    p+=size;
  }
  return out;
}
function mx_find(list,t){return list.filter(x=>x.type===t);}
function mx_one(list,t){const r=mx_find(list,t);return r.length?r[0]:null;}
function mx_children(b,mx_box){return mx_boxes(b,mx_box.body,mx_box.end);}

function mx_parseTrun(b,tr,tfhd,baseOffset){
  const flags=mx_u32(b,tr.body)&0xffffff;
  const cnt=mx_u32(b,tr.body+4);
  let p=tr.body+8;
  let dataOff=0;
  if(flags&0x1){dataOff=mx_i32(b,p);p+=4;}
  let firstFlags=null;
  if(flags&0x4){firstFlags=mx_u32(b,p);p+=4;}
  const samples=[];
  let off=baseOffset+dataOff;
  for(let i=0;i<cnt;i++){
    let dur=tfhd.defDur, size=tfhd.defSize, fl=tfhd.defFlags, cto=0;
    if(flags&0x100){dur=mx_u32(b,p);p+=4;}
    if(flags&0x200){size=mx_u32(b,p);p+=4;}
    if(flags&0x400){fl=mx_u32(b,p);p+=4;}
    if(flags&0x800){cto=mx_i32(b,p);p+=4;}
    if(i===0&&firstFlags!==null)fl=firstFlags;
    samples.push({off:off,size:size,dur:dur,cto:cto,sync:!(fl&0x10000)});
    off+=size;
  }
  return {samples:samples,dataOff:dataOff};
}

function mx_parseTfhd(b,mx_box){
  const flags=mx_u32(b,mx_box.body)&0xffffff;
  const trackId=mx_u32(b,mx_box.body+4);
  let p=mx_box.body+8;
  let base=null;
  if(flags&0x1){base=mx_u64(b,p);p+=8;}
  if(flags&0x2){p+=4;}
  let defDur=0,defSize=0,defFlags=0;
  if(flags&0x8){defDur=mx_u32(b,p);p+=4;}
  if(flags&0x10){defSize=mx_u32(b,p);p+=4;}
  if(flags&0x20){defFlags=mx_u32(b,p);p+=4;}
  return {trackId:trackId,base:base,defDur:defDur,defSize:defSize,defFlags:defFlags,
          defaultBaseIsMoof:!!(flags&0x020000),hasBase:!!(flags&0x1)};
}

/* ---- 產生 mx_box ---- */
function mx_box(type,...parts){
  let len=8;parts.forEach(p=>len+=p.length);
  const head=new Uint8Array(8);
  head[0]=(len>>>24)&255;head[1]=(len>>>16)&255;head[2]=(len>>>8)&255;head[3]=len&255;
  for(let i=0;i<4;i++)head[4+i]=type.charCodeAt(i);
  const out=new Uint8Array(len);out.set(head,0);
  let p=8;parts.forEach(x=>{out.set(x,p);p+=x.length;});
  return out;
}
function mx_b32(v){return new Uint8Array([(v>>>24)&255,(v>>>16)&255,(v>>>8)&255,v&255]);}
function mx_b64(v){const hi=Math.floor(v/4294967296),lo=v>>>0;
  return new Uint8Array([(hi>>>24)&255,(hi>>>16)&255,(hi>>>8)&255,hi&255,
                         (lo>>>24)&255,(lo>>>16)&255,(lo>>>8)&255,lo&255]);}
function mx_cat(arr){let n=0;arr.forEach(a=>n+=a.length);const o=new Uint8Array(n);let p=0;
  arr.forEach(a=>{o.set(a,p);p+=a.length;});return o;}

function mx_remux(bytes){
  const b=bytes;
  const top=mx_boxes(b,0,b.length);
  const ftyp=mx_one(top,"ftyp");
  const moov=mx_one(top,"moov");
  if(!moov)throw new Error("no moov");
  const moofs=mx_find(top,"moof");
  if(!moofs.length)return null;              /* 不是分段 MP4，不用處理 */

  const mvBoxes=mx_children(b,moov);
  const mvhd=mx_one(mvBoxes,"mvhd");
  const mvTimescale=mx_u32(b,mvhd.body+(b[mvhd.body]===1?20:12));
  const traks=mx_find(mvBoxes,"trak");

  /* 收集每個 track 的所有 sample */
  const tracks={};
  traks.forEach(tk=>{
    const tkhd=mx_one(mx_children(b,tk),"tkhd");
    const v=b[tkhd.body];
    const id=mx_u32(b,tkhd.body+(v===1?20:12));
    tracks[id]={trak:tk,samples:[]};
  });

  moofs.forEach(mf=>{
    const trafs=mx_find(mx_children(b,mf),"traf");
    trafs.forEach(tf=>{
      const tfc=mx_children(b,tf);
      const tfhdBox=mx_one(tfc,"tfhd");
      if(!tfhdBox)return;
      const tfhd=mx_parseTfhd(b,tfhdBox);
      const t=tracks[tfhd.trackId];
      if(!t)return;
      /* 基準位移：預設是 moof 起點（default-base-is-moof） */
      const base=tfhd.hasBase?tfhd.base:mf.start;
      let running=null;
      mx_find(tfc,"trun").forEach(tr=>{
        const flags=mx_u32(b,tr.body)&0xffffff;
        const hasOff=!!(flags&0x1);
        const r=mx_parseTrun(b,tr,tfhd,hasOff?base:(running===null?base:running));
        r.samples.forEach(s=>t.samples.push(s));
        if(r.samples.length){
          const last=r.samples[r.samples.length-1];
          running=last.off+last.size;
        }
      });
    });
  });

  /* 依序把 sample 資料集中成一個 mdat */
  const order=[];
  Object.keys(tracks).forEach(id=>{
    tracks[id].samples.forEach((s,i)=>order.push({id:+id,i:i,off:s.off,size:s.size}));
  });
  order.sort((a,b2)=>a.off-b2.off);
  let mdatSize=0;order.forEach(o=>mdatSize+=o.size);

  const newOff={};
  let cur=0;
  order.forEach(o=>{
    if(!newOff[o.id])newOff[o.id]=[];
    newOff[o.id][o.i]=cur;cur+=o.size;
  });

  /* ---- 為每個 track 重建 stbl ---- */
  function buildStbl(id,stblOld,mediaTimescale){
    const ss=tracks[id].samples;
    const offs=newOff[id]||[];
    const old=mx_children(b,stblOld);
    const keep=[];
    ["stsd"].forEach(t=>{const x=mx_one(old,t);if(x)keep.push(b.slice(x.start,x.end));});

    /* stts */
    const stts=[];
    let runDur=-1,runCnt=0;
    ss.forEach(s=>{
      if(s.dur===runDur){runCnt++;}
      else{if(runCnt)stts.push([runCnt,runDur]);runDur=s.dur;runCnt=1;}
    });
    if(runCnt)stts.push([runCnt,runDur]);
    const sttsBody=[mx_b32(0),mx_b32(stts.length)];
    stts.forEach(e=>{sttsBody.push(mx_b32(e[0]));sttsBody.push(mx_b32(e[1]));});
    keep.push(mx_box("stts",mx_cat(sttsBody)));

  const PUN = /[\s，。、；：？！「」『』（）《》〈〉“”‘’—…·,.;:?!"'()\[\]\-–]/g;
  function normV(x) {

    const q = normV(text);
    if (q.length < 4 || !D || !D.txt) return null;
    const head = q.slice(0, 30), tail = q.slice(-30);
    const order = [];
    const N = GX.NCH();
    if (hint >= 1 && hint <= N) order.push(hint);
    for (let c = 1; c <= N; c++) if (c !== hint) order.push(c);
    for (const c of order) {
      const vs = D.txt[c] || [];
      let joined = '', starts = [];
      vs.forEach(v => { starts.push(joined.length); joined += normV(v); });
      const i = joined.indexOf(head);
      if (i < 0) continue;
      let j = joined.indexOf(tail, i);
      if (j < 0) j = i + head.length - 1; else j = j + tail.length - 1;
      let a = 0, b = 0;
      for (let k = 0; k < starts.length; k++) { if (starts[k] <= i) a = k; if (starts[k] <= j) b = k; }
      return { ch: c, v: a + 1, v2: b + 1 };
