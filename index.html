肉身，也許正是針對輕看肉身的教導；同時與 1:18、24 的「身體」（教會）分開。παραστῆσαι（parastēsai） 是目的不定詞，聖殿獻祭與法庭呈堂的用語都可以。</p><blockquote><p><strong>◆ 1:22 經文鑑別：被動還是主動？</strong>SBLGNT 作 ἀποκατηλλάγητε（apokatēllagēte），第二人稱複數不定過去式被動，「你們被和好了」；這是 SBLGNT 編者 Holmes 的獨家讀法，有梵諦岡抄本與 P46 支持。WH、Treg、NA28、RP 都作 ἀποκατήλλαξεν（apokatēllaxen），第三人稱單數主動，「他使……和好了」；和合本「他……叫你們與自己和好」與眾版本同。被動讀法文法較難（1:21 的受格 ὑμᾶς（hymas） 懸在那裡沒有動詞），正因為難，有人認為是原文，抄寫者把它改順了；主動讀法抄本分佈較廣。本講義照和合本讀主動，並在這裡記下 SBLGNT 的讀法；兩讀的主詞都是神：被動說和好臨到我們，主動說是神作的。這是 SBLGNT 少數與四個主要版本全不同的地方。</p></blockquote>","exp":"<p>基督之歌剛剛唱到最高的地方——萬有、寶座、豐盛、十字架——保羅的鏡頭突然轉到聽信的人身上：「你們從前與神隔絕，因著惡行，心裡與他為敵」（1:21）。全卷地勢圖的最高點（1:18）和最低點（1:21）只隔三節。居首位的那一位，和從前與神為敵的我們，中間是十字架的血。</p><p>「與神隔絕」是一個外人的處境：不是住在神家裡偶爾吵架，是根本不屬於這個家。「心裡與他為敵」更深：敵意先在心思裡，然後才在行為裡。許多人以為自己只是對神不感興趣，但經文說，不感興趣的底下，常常是一個不要神來管的心。</p><p>「但如今他藉著基督的肉身受死，叫你們與自己和好」（1:22）。地勢圖從 8 一下跳到 82，靠的是兩個字：但如今。和好是誰主動的？和合本說「他」——神主動。原文有一個版本讀成被動「你們被和好了」，兩種讀法說的是同一件事：不是我們先伸手，是神先跨過來。保羅在別處說：「我們作仇敵的時候，且藉著神兒子的死，得與神和好」（羅 5:10）。</p><p>和好的目的是：「都成了聖潔，沒有瑕疵，無可責備，把你們引到自己面前」（1:22）。這是一幅呈獻的畫面：神把從前的仇敵帶到自己面前，不是為了審問，是為了展示。這是一個已經完成的和好。所以後面讀到 1:24 的「受苦」時，不要以為還有甚麼要我們補上——基督的肉身受死，已經把和好作成了。</p>"},{"a":23,"z":23,"star":1,"grk":"<p lang=\"grc\">εἴ γε ἐπιμένετε τῇ πίστει τεθεμελιωμένοι καὶ ἑδραῖοι καὶ μὴ μετακινούμενοι ἀπὸ τῆς ἐλπίδος τοῦ εὐαγγελίου οὗ ἠκούσατε, τοῦ κηρυχθέντος ἐν πάσῃ κτίσει τῇ ὑπὸ τὸν οὐρανόν, οὗ ἐγενόμην ἐγὼ Παῦλος διάκονος.</p>","lit":"<p>只要你們確實持續在那信心裡，被立了根基並且穩固，不被挪移離開福音的盼望，就是你們聽見的，那在天下一切受造之物中被傳揚的，我保羅成了它的執事。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>εἴ γε ἐπιμένετε</td><td>ei ge epimenete</td><td>只要你們確實持續</td><td>εἴ γε：帶著信心的條件</td></tr><tr><td>τεθεμελιωμένοι καὶ ἑδραῖοι</td><td>tethemeliōmenoi kai hedraioi</td><td>立了根基又穩固</td><td>建築的語言</td></tr><tr><td>μὴ μετακινούμενοι</td><td>mē metakinoumenoi</td><td>不被挪移</td><td>和合本註腳：失去原文是離開</td></tr><tr><td>ἐν πάσῃ κτίσει</td><td>en pasē ktisei</td><td>在一切受造的中</td><td>與 1:15 同一個字</td></tr><tr><td>διάκονος</td><td>diakonos</td><td>執事</td><td>1:7 以巴弗、1:23 保羅、1:25 教會</td></tr></table>","gram":"<p><strong>1:23 的 εἴ γε（ei ge） 是加強的條件：「只要你們確實……」。</strong>γε（ge） 在這裡帶著把握的語氣，像「既然你們是會持續的」；它不是懷疑，而是提醒。ἐπιμένετε（epimenete） 是現在式：持續地留在信心裡。兩個分詞 τεθεμελιωμένοι καὶ ἑδραῖοι（tethemeliōmenoi kai hedraioi） 是完成式與形容詞，「已經立了根基、穩穩坐著」；對照 μὴ μετακινούμενοι（mē metakinoumenoi） 是現在式被動，「不被挪動」——外面有一股力量在推。和合本註腳：「失去」原文是離開。</p><p>和合本註腳也說「萬人」原文是凡受造的：ἐν πάσῃ κτίσει τῇ ὑπὸ τὸν οὐρανόν（en pasē ktisei tē hypo ton ouranon）。κτίσει（ktisei） 與 1:15 πάσης κτίσεως（pasēs ktiseōs） 是同一個字——基督是一切受造之物的首生，福音也傳給一切受造之物；福音的範圍，就是基督的範圍。句末 οὗ ἐγενόμην ἐγὼ Παῦλος διάκονος（hou egenomēn egō Paulos diakonos） 第一次在信中用「我」，從「我們」轉入 1:24–2:5 保羅自己的事工。</p>","exp":"<p>「只要你們在所信的道上恆心，根基穩固，堅定不移，不致被引動失去福音的盼望」（1:23）。這一節常被拿來爭論：得救的人會失去救恩嗎？這是議題頁的題目；在這裡只看經文的重點。保羅不是在嚇唬他們，他用的語氣是「既然你們會持續」。這是一位牧者的提醒：已經在根基上的人，不要被推離根基。</p><p>歌羅西人沒有離開福音，他們只是被「引動」——一點一點被推。錯謬的教導很少叫人放棄基督，它只是說：基督很好，但你還需要……每加一樣，就離開一點。「堅定不移」不是固執，是知道自己站在哪裡。</p><p>「這福音就是你們所聽過的，也是傳與普天下萬人聽的」（1:23）。「萬人」原文是凡受造的，和 1:15 同一個字。基督是一切受造之物的首生；他的福音也是傳給一切受造之物的。一個這麼大的福音，不需要地方性的補充包。</p><p>最後保羅說：「我－保羅也作了這福音的執事」（1:23）。以巴弗是執事（1:7），保羅也是執事——同一個字。建立教會的同工和寫信的使徒，用的是同一個頭銜：僕人。</p>"},{"a":24,"z":25,"star":3,"grk":"<p lang=\"grc\">Νῦν χαίρω ἐν τοῖς παθήμασιν ὑπὲρ ὑμῶν, καὶ ἀνταναπληρῶ τὰ ὑστερήματα τῶν θλίψεων τοῦ Χριστοῦ ἐν τῇ σαρκί μου ὑπὲρ τοῦ σώματος αὐτοῦ, ὅ ἐστιν ἡ ἐκκλησία,</p><p lang=\"grc\">ἧς ἐγενόμην ἐγὼ διάκονος κατὰ τὴν οἰκονομίαν τοῦ θεοῦ τὴν δοθεῖσάν μοι εἰς ὑμᾶς πληρῶσαι τὸν λόγον τοῦ θεοῦ,</p>","lit":"<p>如今我在為你們的受苦中喜樂，並且在我的肉身上替補基督患難所缺的，為了他的身體，就是教會，</p><p>我成了教會的執事，照著神的管家職分，就是那為你們賜給我的，要使神的話語得以完滿，</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Νῦν χαίρω</td><td>Nyn chairō</td><td>如今我喜樂</td><td>在監獄裡寫的</td></tr><tr><td>ἐν τοῖς παθήμασιν ὑπὲρ ὑμῶν</td><td>en tois pathēmasin hyper hymōn</td><td>在為你們的受苦中</td><td>為教會的苦</td></tr><tr><td>ἀνταναπληρῶ</td><td>antanaplērō</td><td>替補、補滿</td><td>新約只有這一次</td></tr><tr><td>τὰ ὑστερήματα</td><td>ta hysterēmata</td><td>所缺的</td><td>複數：一份一份</td></tr><tr><td>τῶν θλίψεων τοῦ Χριστοῦ</td><td>tōn thlipseōn tou Christou</td><td>基督的患難</td><td>θλῖψις：傳福音者的苦</td></tr><tr><td>τὴν οἰκονομίαν τοῦ θεοῦ</td><td>tēn oikonomian tou theou</td><td>神的管家職分</td><td>受託，不是自封</td></tr><tr><td>πληρῶσαι τὸν λόγον τοῦ θεοῦ</td><td>plērōsai ton logon tou theou</td><td>使神的話完滿</td><td>傳得全備</td></tr></table>","gram":"<p><strong>◆ 1:24 是本章最難的一節：ἀνταναπληρῶ τὰ ὑστερήματα τῶν θλίψεων τοῦ Χριστοῦ（antanaplērō ta hysterēmata tōn thlipseōn tou Christou）。</strong>ἀνταναπληρῶ（antanaplērō） 新約只出現這一次，由 ἀντί（代替、對應）、ἀνά（ana）、πληρόω（plēroō） 組成：「在對應的位置上補滿」。τὰ ὑστερήματα（ta hysterēmata） 是「所缺的」，複數。</p><blockquote><p>「基督患難的缺欠」是甚麼？讀法主要有四：<strong>一、救恩不足說</strong>——基督的贖罪受苦還不夠，要由人補足；這與 1:20、22 直接衝突，歷代正統教會一致拒絕。<strong>二、神秘聯合說</strong>——基督與教會合一，教會受苦就是基督受苦（這使我們想起徒 9:4「掃羅！掃羅！你為甚麼逼迫我？」（徒 9:4））。<strong>三、彌賽亞災難說</strong>——猶太啟示文學認為末日之前有一定份量的「彌賽亞的災難」，保羅多承擔一份，就讓別人少一份。<strong>四、使徒事工說</strong>——基督把傳福音的苦託付給他的使者，保羅在自己的肉身上承擔他那一份。</p><p>關鍵在用字：θλῖψις（thlipsis） 在新約從不用來指基督贖罪的受苦（那用 πάθημα（pathēma）、θάνατος（thanatos）、σταυρός（stauros） 一類的字），而是指信徒與傳道者在世上所受的壓迫。本講義合讀二、四：缺的不是救恩，是福音傳到外邦人那裡的路上必經的苦；保羅為了教會，甘心承擔他那一份。1:22 的和好已經完成，1:24 不能把它變成未完成。</p></blockquote><p>1:25 τὴν οἰκονομίαν τοῦ θεοῦ τὴν δοθεῖσάν μοι（tēn oikonomian tou theou tēn dotheisan moi）：οἰκονομίαν（oikonomian） 是管家的職分，被託付的，不是擁有的。πληρῶσαι τὸν λόγον τοῦ θεοῦ（plērōsai ton logon tou theou） 又是 πληρόω（plēroō）：把神的話「傳滿」，傳到它該到的地方。</p>","exp":"<p>「現在我為你們受苦，倒覺歡樂」（1:24）。寫這句話的人坐在監裡，手上有鎖鍊（4:18）。他不是說受苦本身是好的，他是說：為了你們受的苦，我心裡有喜樂。</p><p>接著是全卷最容易被誤用的一句：「要在我肉身上補滿基督患難的缺欠」（1:24）。有人讀成基督的救恩還不夠，要我們用受苦去補——這不是保羅的意思。兩節以前他才說：「但如今他藉著基督的肉身受死，叫你們與自己和好」（1:22）。和好已經完成，十字架上說的「成了」，不需要任何人補上一筆。</p><p>那麼缺的是甚麼？保羅用的「患難」這個字，在新約裡從來不是指基督贖罪的受苦，而是指傳福音的人在路上所受的苦。基督受苦，完成了救恩；他的使者受苦，把救恩送到人那裡。福音從耶路撒冷到歌羅西，一路上都有人付代價：保羅坐監、以巴弗遠行、推基古送信。缺的不是救恩，是路程；保羅在承擔他那一段路。</p><p>這一節要守住兩條界線（紅線五）。第一，不可說「你要多受苦，才能補足耶穌沒做完的」——那是把恩典變成功課。第二，不可對一個在家裡受暴力、在職場被霸凌的人說「你受的苦就是在補滿基督的患難，要忍耐」。保羅的苦是為福音、為教會受的，他是自願的；被虐待不是為福音受苦，而是需要被保護、被帶離危險的處境。教會的責任是陪他到安全的地方，不是勸他留下。</p><p>「我照神為你們所賜我的職分作了教會的執事，要把神的道理傳得全備」（1:25）。保羅的苦有一個方向：把神的話傳滿。今天為福音付代價的人——為了帶小組少睡了覺、為了探訪少賺了錢——不是在補救恩的不足，是在走自己那一段路。</p>"},{"a":26,"z":27,"star":2,"grk":"<p lang=\"grc\">τὸ μυστήριον τὸ ἀποκεκρυμμένον ἀπὸ τῶν αἰώνων καὶ ἀπὸ τῶν γενεῶν,— νῦν δὲ ἐφανερώθη τοῖς ἁγίοις αὐτοῦ,</p><p lang=\"grc\">οἷς ἠθέλησεν ὁ θεὸς γνωρίσαι τί τὸ πλοῦτος τῆς δόξης τοῦ μυστηρίου τούτου ἐν τοῖς ἔθνεσιν, ὅ ἐστιν Χριστὸς ἐν ὑμῖν, ἡ ἐλπὶς τῆς δόξης·</p>","lit":"<p>就是那從諸世代和從諸世族被隱藏的奧祕——但如今向他的聖徒顯明了，</p><p>神願意使他們知道，這奧祕在外邦人中榮耀的豐富是甚麼，這就是基督在你們裡面，榮耀的盼望；</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>τὸ μυστήριον</td><td>to mystērion</td><td>那奧祕</td><td>隱藏後被啟示的</td></tr><tr><td>τὸ ἀποκεκρυμμένον</td><td>to apokekrymmenon</td><td>被隱藏的</td><td>完成式：長久藏著</td></tr><tr><td>νῦν δὲ ἐφανερώθη</td><td>nyn de ephanerōthē</td><td>但如今被顯明了</td><td>不定過去式被動</td></tr><tr><td>τί τὸ πλοῦτος τῆς δόξης</td><td>ti to ploutos tēs doxēs</td><td>榮耀的豐富是甚麼</td><td>感嘆式的問句</td></tr><tr><td>ἐν τοῖς ἔθνεσιν</td><td>en tois ethnesin</td><td>在外邦人中</td><td>奧祕的範圍</td></tr><tr><td>Χριστὸς ἐν ὑμῖν</td><td>Christos en hymin</td><td>基督在你們裡面</td><td>奧祕的內容</td></tr><tr><td>ἡ ἐλπὶς τῆς δόξης</td><td>hē elpis tēs doxēs</td><td>榮耀的盼望</td><td>和合本補「有」</td></tr></table>","gram":"<p><strong>1:26–27 用了全卷「奧祕」追蹤的頭兩站。</strong>τὸ μυστήριον τὸ ἀποκεκρυμμένον ἀπὸ τῶν αἰώνων καὶ ἀπὸ τῶν γενεῶν（to mystērion to apokekrymmenon apo tōn aiōnōn kai apo tōn geneōn）：完成式分詞，長久以來一直隱藏著。接著句法斷裂——SBLGNT 用破折號標出——轉成 νῦν δὲ ἐφανερώθη τοῖς ἁγίοις αὐτοῦ（nyn de ephanerōthē tois hagiois autou），「但如今向他的聖徒顯明了」。隱藏與顯明，是本卷的一組對照（2:2–3「藏著」，3:3–4「藏在神裡面」「顯現在榮耀裡」）。</p><p>在歌羅西的宗教環境裡，μυστήριον（mystērion） 會讓人想起神秘宗教的入門祕儀：只有少數人知道、要經過儀式才能進入。保羅的用法來自猶太啟示傳統：神的計畫曾經隱藏，如今公開顯明——不是給少數入門者，是給「他的聖徒」，而且「在外邦人中」。</p><p>1:27 τί τὸ πλοῦτος τῆς δόξης（ti to ploutos tēs doxēs） 是感嘆式的問句。奧祕的內容在 ὅ ἐστιν（ho estin） 之後：Χριστὸς ἐν ὑμῖν（Christos en hymin）。ἐν ὑμῖν（en hymin） 可讀作「在你們裡面」（個人的內住），也可讀作「在你們中間」（在外邦人群體當中）；和合本「在你們心裡」取前者。本講義認為兩者都在：基督住進外邦人中間，也住進每一個人裡面。ἡ ἐλπὶς τῆς δόξης（hē elpis tēs doxēs） 是同位語，和合本「成了有榮耀的盼望」的「有」是小字補的；原文是「榮耀的盼望」——盼望的內容就是將來的榮耀（3:4）。</p>","exp":"<p>「這道理就是歷世歷代所隱藏的奧祕；但如今向他的聖徒顯明了」（1:26）。歌羅西人周圍有很多「奧祕」：入會儀式、祕傳的知識、只有進階會員才能看的異象。保羅說：真正的奧祕不是藏起來給少數人的，是已經「顯明」給所有聖徒的。基督教沒有內圈和外圈，沒有只給高階同工知道的祕密。</p><p>這奧祕是甚麼？「就是基督在你們心裡成了有榮耀的盼望」（1:27）。這一句是全卷的第二站：前面講基督是誰（1:15–18），這裡講這位基督住進來了。創造萬有、維繫萬有、在凡事上居首的那一位，不是遠遠地在宇宙之上，是住在歌羅西一個奴隸、一個婦人、一個商人的心裡。</p><p>而且是「在外邦人中」（1:27）。這是舊約先知隱約看見、卻沒有完全說明的事：神不只要拯救外邦人，還要住在他們裡面。對一群在異教小城裡長大、被人看作二等的信徒，這是天大的尊榮。</p><p>「榮耀的盼望」——現在住在裡面的基督，就是將來榮耀的保證。3:4 會說：「他顯現的時候，你們也要與他一同顯現在榮耀裡」（3:4）。盼望不在別處，不需要再去找；他已經在你裡面。這也是 321「讓耶穌得著一切的榮耀」的根：榮耀從裡面那一位開始，最後也歸給他。</p>"},{"a":28,"z":29,"star":2,"grk":"<p lang=\"grc\">ὃν ἡμεῖς καταγγέλλομεν νουθετοῦντες πάντα ἄνθρωπον καὶ διδάσκοντες πάντα ἄνθρωπον ἐν πάσῃ σοφίᾳ, ἵνα παραστήσωμεν πάντα ἄνθρωπον τέλειον ἐν Χριστῷ</p><p lang=\"grc\">εἰς ὃ καὶ κοπιῶ ἀγωνιζόμενος κατὰ τὴν ἐνέργειαν αὐτοῦ τὴν ἐνεργουμένην ἐν ἐμοὶ ἐν δυνάμει.</p>","lit":"<p>我們所宣告的就是他，警戒每一個人，並且教導每一個人，在一切智慧裡，為要把每一個人在基督裡完全地呈獻；</p><p>為此我也勞苦，竭力爭戰，照著他的運作，就是那在我裡面以大能運作的。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ὃν ἡμεῖς καταγγέλλομεν</td><td>hon hēmeis katangellomen</td><td>我們所宣告的就是他</td><td>傳的是一個人</td></tr><tr><td>νουθετοῦντες</td><td>nouthetountes</td><td>勸戒</td><td>把心思放對位置</td></tr><tr><td>διδάσκοντες</td><td>didaskontes</td><td>教導</td><td>把真理說明白</td></tr><tr><td>πάντα ἄνθρωπον</td><td>panta anthrōpon</td><td>每一個人</td><td>一節三次</td></tr><tr><td>τέλειον ἐν Χριστῷ</td><td>teleion en Christō</td><td>在基督裡完全的</td><td>不是在基督以外</td></tr><tr><td>κοπιῶ ἀγωνιζόμενος</td><td>kopiō agōnizomenos</td><td>勞苦、竭力爭戰</td><td>運動場的字</td></tr><tr><td>κατὰ τὴν ἐνέργειαν αὐτοῦ</td><td>kata tēn energeian autou</td><td>照著他的運作</td><td>力量的來源</td></tr></table>","gram":"<p><strong>1:28 以 ὃν（hon） 起頭，宣告的對象是一個人：基督。</strong>ἡμεῖς（hēmeis） 是強調的「我們」，與錯謬教師對照。兩個分詞 νουθετοῦντες（nouthetountes） 與 διδάσκοντες（didaskontes）：前者是勸戒、矯正心思，後者是正面的教導。然後是全卷最醒目的重複：πάντα ἄνθρωπον（panta anthrōpon） 三次——勸戒每一個人、教導每一個人、呈獻每一個人。加上 ἐν πάσῃ σοφίᾳ（en pasē sophia），這一節 πᾶς（pas） 四次。基督之歌的「萬有」（1:16–20），在這裡落成「各人」。</p><p>ἵνα παραστήσωμεν πάντα ἄνθρωπον τέλειον ἐν Χριστῷ（hina parastēsōmen panta anthrōpon teleion en Christō）：παραστήσωμεν（parastēsōmen） 回扣 1:22 的 παραστῆσαι（parastēsai）——神要把我們呈獻在他面前，保羅的事工也是為了這個呈獻。τέλειον（teleion） 在神秘宗教裡指「完成入會儀式的人」；保羅說，完全是「在基督裡」的完全，而且是每一個人都可以的。</p><p>1:29 εἰς ὃ καὶ κοπιῶ ἀγωνιζόμενος（eis ho kai kopiō agōnizomenos）：κοπιάω（kopiaō） 是做到累，ἀγωνίζομαι（agōnizomai） 是運動場上的竭力。可是後半句 κατὰ τὴν ἐνέργειαν αὐτοῦ τὴν ἐνεργουμένην ἐν ἐμοὶ ἐν δυνάμει（kata tēn energeian autou tēn energoumenēn en emoi en dynamei） 把力量的來源交給基督：ἐνέργειαν（energeian） 與 ἐνεργουμένην（energoumenēn） 是同字源重疊，「照著他在我裡面運作的那運作」。人的勞苦與神的大能不是互相排斥的，是同一件事的兩面。</p>","exp":"<p>「我們傳揚他」（1:28）——保羅傳的不是一套方法、一個系統、一種經驗，是一個人。歌羅西的錯謬教師傳的是「基督＋」：基督加哲學、加規條、加異象。保羅傳的只有「他」。</p><p>怎麼傳？「是用諸般的智慧，勸戒各人，教導各人，要把各人在基督裡完完全全地引到神面前」（1:28）。一節裡三次「各人」。保羅剛剛唱完萬有、寶座、宇宙，下一個畫面卻是一個一個的人。這就是 321「建立屬神的體系」最基本的單位：體系不是一張組織圖，不是一場大聚會的人數，是一個人、再一個人。勸戒一個人、教導一個人，把一個人帶到神面前。</p><p>「完完全全」不是完美主義。在神秘宗教裡，「完全的人」是進到最內圈的少數；保羅說，在基督裡，每一個人都可以完全，而且完全的方法不是在基督以外加甚麼，是在基督裡長大。</p><p>「我也為此勞苦，照著他在我裡面運用的大能盡心竭力」（1:29）。保羅很累。他用的字是做到筋疲力盡、像運動員一樣拚。可是他接著說：照著他在我裡面運用的大能。服事的人兩種錯誤最常見：一種是只靠自己，最後燒乾；一種是說「都交給神」，自己甚麼也不做。保羅兩邊都不是：他拚命，力氣卻是基督給的。今天帶小組、跟進新人的人，可以帶著這一節去累——累得有方向，也累得有來源。</p>"}],"2":[{"a":1,"z":3,"star":2,"grk":"<p lang=\"grc\">Θέλω γὰρ ὑμᾶς εἰδέναι ἡλίκον ἀγῶνα ἔχω ὑπὲρ ὑμῶν καὶ τῶν ἐν Λαοδικείᾳ καὶ ὅσοι οὐχ ἑόρακαν τὸ πρόσωπόν μου ἐν σαρκί,</p><p lang=\"grc\">ἵνα παρακληθῶσιν αἱ καρδίαι αὐτῶν, συμβιβασθέντες ἐν ἀγάπῃ καὶ εἰς πᾶν πλοῦτος τῆς πληροφορίας τῆς συνέσεως, εἰς ἐπίγνωσιν τοῦ μυστηρίου τοῦ θεοῦ Χριστοῦ,</p><p lang=\"grc\">ἐν ᾧ εἰσιν πάντες οἱ θησαυροὶ τῆς σοφίας καὶ γνώσεως ἀπόκρυφοι.</p>","lit":"<p>因為我要你們知道，我為你們、為那些在老底嘉的人、並為凡沒有在肉身上見過我面的人，有何等大的爭戰，</p><p>為要使他們的心得著安慰，他們在愛裡被編織在一起，並且進入悟性的充足確信的一切豐富，進入對神的奧祕——基督——的真知；</p><p>在他裡面，智慧和知識的一切寶藏都是隱藏著的。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἡλίκον ἀγῶνα</td><td>hēlikon agōna</td><td>何等大的競技／爭戰</td><td>和合本「盡心竭力」；運動場與戰場的字</td></tr><tr><td>οὐχ ἑόρακαν τὸ πρόσωπόν μου</td><td>ouch heorakan to prosōpon mou</td><td>沒有見過我的臉</td><td>完成式：一直到今天都沒見過</td></tr><tr><td>συμβιβασθέντες ἐν ἀγάπῃ</td><td>symbibasthentes en agapē</td><td>在愛裡被編織在一起</td><td>和合本「因愛心互相聯絡」</td></tr><tr><td>πληροφορίας τῆς συνέσεως</td><td>plērophorias tēs syneseōs</td><td>悟性的充足確信</td><td>不是情緒的高昂，是想得通的篤定</td></tr><tr><td>τοῦ μυστηρίου τοῦ θεοῦ</td><td>tou mystēriou tou theou</td><td>神的奧祕</td><td>奧祕有一個名字：基督</td></tr><tr><td>θησαυροὶ … ἀπόκρυφοι</td><td>thēsauroi … apokryphoi</td><td>寶藏……藏著的</td><td>「藏著」放在句末，壓住全句</td></tr></table>","gram":"<p><strong>2:1 的 ἀγῶνα（agōna） 接著 1:29 的 ἀγωνιζόμενος（agōnizomenos） 說下去。</strong>這是運動場和戰場的字：選手在場上拚到最後一口氣。同一個字根在 4:12 又用在以巴弗身上——他「竭力地祈求」。保羅的「盡心竭力」不是在講台上，是在禱告裡；對象是 ὅσοι οὐχ ἑόρακαν τὸ πρόσωπόν μου ἐν σαρκί（hosoi ouch heorakan to prosōpon mou en sarki）——那些從來沒見過他的人。ἑόρακαν（heorakan） 是完成式：一直到寫信這天，他們都沒見過面。老底嘉被點名，因為這封信念完要轉過去（4:16）。</p><p>2:2 的 ἵνα παρακληθῶσιν αἱ καρδίαι αὐτῶν（hina paraklēthōsin hai kardiai autōn） 是禱告的目的。接下來的分詞 συμβιβασθέντες（symbibasthentes） 是陽性複數主格，照文法應該跟著陰性的 καρδίαι（kardiai），卻跟了「他們」這些人——意義一致式的配合：被編織在一起的不是抽象的心，是一個一個的人。同一個字在 2:19 再出現，形容身體靠筋節「聯絡」。</p><blockquote><p><strong>◆ 經文鑑別 2:2。</strong>SBLGNT 作 τοῦ μυστηρίου τοῦ θεοῦ Χριστοῦ（tou mystēriou tou theou Christou），「神的奧祕——基督」，Χριστοῦ（Christou） 與「奧祕」同位。這是全本新約異文最多的地方之一，抄本有十餘種讀法；多數拜占庭抄本（RP）作 τοῦ θεοῦ καὶ πατρὸς καὶ τοῦ Χριστοῦ（tou theou kai patros kai tou Christou），「神與父與基督的奧祕」。最短、最突兀的讀法，最能解釋其他讀法怎樣產生：抄寫的人嫌同位語太陡，就一路補上「與父」「與」。P46 與梵諦岡抄本支持短讀法。本講義跟 SBLGNT 與和合本：「神的奧祕，就是基督」——奧祕不是一套秘訣，是一位。</p></blockquote><p>2:3 的 ἐν ᾧ（en hō） 可以指「基督」，也可以指「奧祕」；既然奧祕就是基督，兩讀落在同一處。句子把 ἀπόκρυφοι（apokryphoi） 擺到最後，像把寶箱的蓋子最後才蓋上。這使我們想起箴 2:3–4 與賽 45:3「隱密的財寶」的語言。</p>","exp":"<p>保羅從沒見過歌羅西人，卻說他為他們在「爭戰」。一個沒見過面的人能為你做甚麼？能禱告。這是本卷的第一個提醒：屬靈的關係不靠見面次數，靠代禱的分量。空中團契的弟兄姊妹常常只見過螢幕上的臉，2:1 說，這樣的關係一樣可以有「何等地盡心竭力」（2:1）。</p><p>對付錯謬，保羅開的第一帖藥不是辯論，是「要叫他們的心得安慰，因愛心互相聯絡」（2:2）。被編織在愛裡的人不容易被拉走；孤單的羊最容易被叼走。教會若只有正確的教義，沒有彼此聯絡，錯謬來的時候，一個一個人都是單獨面對。</p><p>再來是「真知神的奧祕，就是基督」（2:2）。歌羅西的錯謬教師說：真正的秘密在我們這裡，要入會、要守規、要看見異象才拿得到。保羅回答：「所積蓄的一切智慧知識，都在他裡面藏著」（2:3）。寶藏是「藏著」的，所以要挖；但地點已經公開——在基督裡面，不在別處。這不是反智，正好相反：一切真實的智慧都屬於他，所以基督徒最有理由讀書、思考、研究（紅線六）。今天華人信徒常被各種「秘訣」吸引：一套課程、一個方法、一句先知性的話。2:3 把方向轉回來：不是找到秘訣，是找到他。這就是 321 的「焦點在耶穌」——寶藏的地址只有一個。</p>"},{"a":4,"z":5,"star":1,"grk":"<p lang=\"grc\">τοῦτο λέγω ἵνα μηδεὶς ὑμᾶς παραλογίζηται ἐν πιθανολογίᾳ.</p><p lang=\"grc\">εἰ γὰρ καὶ τῇ σαρκὶ ἄπειμι, ἀλλὰ τῷ πνεύματι σὺν ὑμῖν εἰμι, χαίρων καὶ βλέπων ὑμῶν τὴν τάξιν καὶ τὸ στερέωμα τῆς εἰς Χριστὸν πίστεως ὑμῶν.</p>","lit":"<p>我說這話，是要叫沒有人用似乎有理的話來誤導你們。</p><p>因為我雖然在肉身上不在，然而在靈裡我與你們同在，歡喜並且看見你們的秩序，和你們向著基督之信心的堅固。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>παραλογίζηται</td><td>paralogizētai</td><td>用歪的推論騙</td><td>在正理旁邊另算一套</td></tr><tr><td>ἐν πιθανολογίᾳ</td><td>en pithanologia</td><td>用似乎有理的話</td><td>新約只此一次：說服術</td></tr><tr><td>τὴν τάξιν</td><td>tēn taxin</td><td>隊列、秩序</td><td>軍隊列陣的字；和合本「循規蹈矩」</td></tr><tr><td>τὸ στερέωμα</td><td>to stereōma</td><td>堅固的陣線</td><td>和合本「堅固」</td></tr></table>","gram":"<p>2:4 τοῦτο λέγω ἵνα（touto legō hina） 把前三節收成一個目的：說這些，是「免得」。παραλογίζηται（paralogizētai） 由 παρά（para）「旁邊」和「計算」組成，意思是在正確的帳旁邊另算一本假帳，算得頭頭是道，結論卻是錯的。ἐν πιθανολογίᾳ（en pithanologia） 在新約只出現這一次，希臘修辭學裡指「聽起來可信」的說法，常和真正的證明相對。錯謬的危險不在於粗糙，在於動聽。</p><p>2:5 用 εἰ γὰρ καὶ（ei gar kai）……ἀλλὰ（alla） 作對照：τῇ σαρκὶ ἄπειμι（tē sarki apeimi）「身體不在」，τῷ πνεύματι σὺν ὑμῖν εἰμι（tō pneumati syn hymin eimi）「心卻同在」。這裡的 πνεύματι（pneumati） 是保羅自己的心靈，不是聖靈——本卷提到聖靈只有 1:8 一次，不可在這裡硬講。χαίρων καὶ βλέπων（chairōn kai blepōn） 先「歡喜」後「看見」，語序很溫暖。τὴν τάξιν（tēn taxin） 和 τὸ στερέωμα（to stereōma） 都是軍事用語：隊伍整齊、陣線穩固。</p>","exp":"<p>保羅先誇獎，後警告。他說：「見你們循規蹈矩，信基督的心也堅固，我就歡喜了」（2:5）。可見歌羅西不是一間出了大事的教會，沒有分黨，沒有離開福音。危險正因為一切看起來都還好。敵人不是從正面攻城，是用「花言巧語」（2:4）從旁邊滲進來：不叫你離開基督，只叫你在基督旁邊多放一樣東西。</p><p>「花言巧語」不一定是謊話，常常是一半的真話，包裝得很漂亮。判斷一套說法，不能只問「動不動聽」「有沒有效」，要問它把人帶到哪裡：是更靠近基督，還是更需要那套說法？一支整齊的軍隊，陣線不是靠每個士兵自己聰明，是靠每個人都站在指定的位置上。保羅還沒有開出一條規條，他先肯定他們已經站好的位置。</p><p>這也是牧者的樣式：要提醒人之前，先看見他站得好的地方。一封從誇獎開始的警告，人比較聽得進去；一個先被肯定的人，也比較不會為了證明自己而去追逐新花樣。</p>"},{"a":6,"z":7,"star":3,"grk":"<p lang=\"grc\">Ὡς οὖν παρελάβετε τὸν Χριστὸν Ἰησοῦν τὸν κύριον, ἐν αὐτῷ περιπατεῖτε,</p><p lang=\"grc\">ἐρριζωμένοι καὶ ἐποικοδομούμενοι ἐν αὐτῷ καὶ βεβαιούμενοι τῇ πίστει καθὼς ἐδιδάχθητε, περισσεύοντες ἐν εὐχαριστίᾳ.</p>","lit":"<p>所以，你們怎樣領受了基督耶穌這位主，就要怎樣在他裡面行走，</p><p>已經在他裡面被扎了根，並且正被建造在上面，並且在信心上被堅固，正如你們所受的教導，在感謝裡滿溢。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Ὡς οὖν</td><td>Hōs oun</td><td>所以，正如</td><td>全卷第一個「所以」：樞紐</td></tr><tr><td>παρελάβετε</td><td>parelabete</td><td>你們領受了</td><td>傳承的字：接過一位，不只一套道理</td></tr><tr><td>τὸν Χριστὸν Ἰησοῦν τὸν κύριον</td><td>ton Christon Iēsoun ton kyrion</td><td>那位基督耶穌、那位主</td><td>兩個冠詞：受膏者，也是主</td></tr><tr><td>ἐν αὐτῷ περιπατεῖτε</td><td>en autō peripateite</td><td>在他裡面行走</td><td>現在式命令：一路這樣走</td></tr><tr><td>ἐρριζωμένοι</td><td>errhizōmenoi</td><td>已經被扎了根</td><td>完成式被動：根已下去，仍在那裡</td></tr><tr><td>ἐποικοδομούμενοι</td><td>epoikodomoumenoi</td><td>正被建造在上面</td><td>現在式被動：工程還在進行</td></tr><tr><td>βεβαιούμενοι τῇ πίστει</td><td>bebaioumenoi tē pistei</td><td>在信上被堅固</td><td>現在式被動</td></tr><tr><td>περισσεύοντες ἐν εὐχαριστίᾳ</td><td>perisseuontes en eucharistia</td><td>在感謝裡滿溢</td><td>第 2 章的感謝</td></tr></table>","gram":"<p><strong>2:6 是全卷的樞紐。</strong>Ὡς οὖν（Hōs oun） 是全卷五個 οὖν（oun） 的第一個（2:6、16；3:1、5、12）。第 1 章講「基督是誰」，從這一節起，保羅開始推「所以怎樣活」。句子結構是「正如……就」：你們怎樣領受，就怎樣行。開頭的方式，就是走下去的方式。</p><p>παρελάβετε（parelabete） 是猶太與早期教會傳遞傳統的專門字，保羅在林前 15:3 用同一個字講福音的傳遞。奇特的是受詞：不是「道理」，是 τὸν Χριστὸν Ἰησοῦν τὸν κύριον（ton Christon Iēsoun ton kyrion）——兩個冠詞，「那位基督，耶穌，那位主」。傳統的內容是一個人。這個字也預先對準了 2:8：同一個字根的 τὴν παράδοσιν τῶν ἀνθρώπων（tēn paradosin tōn anthrōpōn），人間的遺傳。兩種傳承正面相對：一種傳下來的是基督，一種傳下來的是人。</p><blockquote><p>2:6 的主動詞 περιπατεῖτε（peripateite） 後面，2:7 掛了四個分詞，時態不同：ἐρριζωμένοι（errhizōmenoi） 是完成式被動——根已經扎下去，而且現在仍扎著；ἐποικοδομούμενοι（epoikodomoumenoi） 是現在式被動——房子一直在往上蓋；βεβαιούμενοι（bebaioumenoi） 也是現在式被動；περισσεύοντες ἐν εὐχαριστίᾳ（perisseuontes en eucharistia） 是現在式主動。植物和建築兩個圖像疊在一起，前三個都是被動：扎根、建造、堅固的是神；滿溢感謝的是人。καθὼς ἐδιδάχθητε（kathōs edidachthēte） 把這一切拴在以巴弗教過他們的內容上（1:7）。WH 與 RP 在 εὐχαριστίᾳ（eucharistia） 前多一個「在其中」，意思不變。</p></blockquote>","exp":"<p>「你們既然接受了主基督耶穌，就當遵他而行」（2:6）。這是全卷的鉸鏈：第 1 章那首基督之歌唱完，保羅說「所以」。倫理不是另起一章的新題目，是從「基督是誰」長出來的。一個人若只聽見 3:5–4:6 的命令，沒有先聽見 1:15–20，他得到的只是一套更嚴的規矩；這正是歌羅西錯謬教師賣的東西。</p><p>你怎樣開始，就怎樣走下去。歌羅西人是靠著接受一位主開始的，不是靠著入會、守節、看見異象。許多華人信徒的屬靈經歷正好相反：信主那天是白白的恩典，信主之後卻一層一層加功課——要守這個、要上那個、要達到某個等級。2:6 說：起點是甚麼，路就是甚麼；恩典開的門，不會變成功德走的路。這也就是 321 改變觀念的兩步：先「信服」，才「實踐」。</p><p>「在他裡面生根建造」（2:7）。本章的標題就在這裡，全卷「首・根・上・鹽」的「根」也在這裡。生根是完成式：你不必每一次聽到新的說法，就把根挖出來檢查一遍；根已經扎在基督裡了。建造卻是現在式：房子還在蓋，每一天都加一層。安全感和成長在同一節裡：根是定的，所以不怕；樓是活的，所以不停。四個字是一棵樹，不是四個階段——根扎下去以後不會被拔起來，還要繼續往深處扎。</p><p>最後一個分詞落在「感謝的心也更增長了」（2:7）。本卷四章每一章都有感謝。感謝是「基督＋」最好的解藥：一個滿溢感謝的人，不覺得自己缺甚麼，就不會去買錯謬教師賣的「再加一點」。反過來，一間教會開始覺得「我們還少一樣」的時候，常常是先少了感謝。</p>"},{"a":8,"z":8,"star":2,"grk":"<p lang=\"grc\">Βλέπετε μή τις ὑμᾶς ἔσται ὁ συλαγωγῶν διὰ τῆς φιλοσοφίας καὶ κενῆς ἀπάτης κατὰ τὴν παράδοσιν τῶν ἀνθρώπων, κατὰ τὰ στοιχεῖα τοῦ κόσμου καὶ οὐ κατὰ Χριστόν·</p>","lit":"<p>你們要看清楚，不要有人成為那藉著哲學和空洞的欺騙把你們擄走的，照著人的傳統，照著世界的基本元素，而不照著基督；</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Βλέπετε</td><td>Blepete</td><td>你們要看清楚</td><td>現在式命令：一直睜著眼</td></tr><tr><td>ὁ συλαγωγῶν</td><td>ho sylagōgōn</td><td>那個把人當戰利品擄走的</td><td>新約只此一次</td></tr><tr><td>διὰ τῆς φιλοσοφίας καὶ κενῆς ἀπάτης</td><td>dia tēs philosophias kai kenēs apatēs</td><td>藉著那哲學，就是空洞的欺騙</td><td>一個冠詞管兩個名詞</td></tr><tr><td>κατὰ τὴν παράδοσιν τῶν ἀνθρώπων</td><td>kata tēn paradosin tōn anthrōpōn</td><td>照著人的傳統</td><td>與 2:6「領受」相對</td></tr><tr><td>κατὰ τὰ στοιχεῖα τοῦ κόσμου</td><td>kata ta stoicheia tou kosmou</td><td>照著世界的基本元素</td><td>和合本「世上的小學」；兩讀</td></tr><tr><td>οὐ κατὰ Χριστόν</td><td>ou kata Christon</td><td>不照著基督</td><td>放在句末：判準</td></tr></table>","gram":"<p>Βλέπετε μή（Blepete mē） 後面接未來直說式 ἔσται（estai），不是常見的假設語氣，語氣更重：這不是理論上的可能，是眼前真的會發生的事。τις（tis） 是不定代名詞，保羅沒有點名，全卷也始終沒有給這套錯謬一個名字。ὁ συλαγωγῶν（ho sylagōgōn） 冠詞加分詞，字面是「把人當戰利品帶走的那一位」，新約只有這一次。</p><p>διὰ τῆς φιλοσοφίας καὶ κενῆς ἀπάτης（dia tēs philosophias kai kenēs apatēs） 只有一個冠詞管兩個名詞，可以讀成二詞一意：「那種哲學，也就是空洞的欺騙」。保羅說的不是哲學這門學問，而是特定的那一套。當時的猶太作者也把猶太教各派稱為「哲學」，這個字在一世紀的範圍很寬。</p><blockquote><p>三個 κατά（kata） 排成一排：κατὰ τὴν παράδοσιν τῶν ἀνθρώπων（kata tēn paradosin tōn anthrōpōn）、κατὰ τὰ στοιχεῖα τοῦ κόσμου（kata ta stoicheia tou kosmou）、οὐ κατὰ Χριστόν（ou kata Christon）。στοιχεῖα（stoicheia） 有兩讀：一讀是「基本原則」，像字母表的 ABC，加 4:3 和合本也譯「世俗小學」；一讀是「宇宙元素與背後的靈界勢力」，古人把地水火風與星宿連在一起，以為它們管著人的命運。本講義的判斷：兩讀不必對立——2:10、15 講執政掌權的，2:20 說與基督同死「脫離了」它們，可見保羅心裡的 στοιχεῖα（stoicheia） 不只是課本，是一套會轄制人的原則；但他對付的方式不是驅趕，是「不照著基督」這把尺。</p></blockquote>","exp":"<p>「你們要謹慎，恐怕有人用他的理學和虛空的妄言……就把你們擄去」（2:8）。這是第 2 章地勢圖的谷底。被擄的人通常不知道自己被擄了；他以為自己是在學習、在進深、在找更好的方法。</p><p>這一節常被誤讀成反智：「讀哲學會失去信仰」「念神學會讀死」「科學都是魔鬼的」。經文不是這樣說的（紅線六）。保羅才禱告他們「在一切屬靈的智慧悟性上，滿心知道神的旨意」（1:9），才說「所積蓄的一切智慧知識，都在他裡面藏著」（2:3）。問題不在思考，在判準：「不照著基督，乃照人間的遺傳和世上的小學」（2:8）。一門學問若讓基督居首位，它就是在挖他裡面的寶藏；一套說法若要基督讓位，再高深也是空的。</p><p>今天的「小學」在哪裡？有時是古老的：擇日、風水、命盤——把人的命運交給星宿與元素。有時是摩登的：一套成功學、一個領導力模型、一種心理技巧，被當成比基督更可靠的保證。工具本身可以用，但一旦它開始決定你怎樣看基督，而不是基督決定你怎樣用它，你就已經被帶走了。2:8 給每一個讀書人、每一個講員的問題只有一個：我所學的，是照著基督，還是照著別的？</p>"},{"a":9,"z":10,"star":3,"grk":"<p lang=\"grc\">ὅτι ἐν αὐτῷ κατοικεῖ πᾶν τὸ πλήρωμα τῆς θεότητος σωματικῶς,</p><p lang=\"grc\">καὶ ἐστὲ ἐν αὐτῷ πεπληρωμένοι, ὅς ἐστιν ἡ κεφαλὴ πάσης ἀρχῆς καὶ ἐξουσίας,</p>","lit":"<p>因為在他裡面，神性的一切豐滿有形體地長住著，</p><p>並且你們是在他裡面已經被充滿的；他是一切執政和掌權的頭。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>κατοικεῖ</td><td>katoikei</td><td>長住著</td><td>現在式：今天仍住著</td></tr><tr><td>πᾶν τὸ πλήρωμα</td><td>pan to plērōma</td><td>全部的豐滿</td><td>1:19 已經預告</td></tr><tr><td>τῆς θεότητος</td><td>tēs theotētos</td><td>神性本身</td><td>新約只此一次；不是「神的特性」</td></tr><tr><td>σωματικῶς</td><td>sōmatikōs</td><td>有形體地</td><td>道成肉身，也是「實體」</td></tr><tr><td>ἐστὲ ἐν αὐτῷ πεπληρωμένοι</td><td>este en autō peplērōmenoi</td><td>你們是在他裡面已經被充滿的</td><td>完成式：不必再加</td></tr><tr><td>ἡ κεφαλὴ πάσης ἀρχῆς καὶ ἐξουσίας</td><td>hē kephalē pasēs archēs kai exousias</td><td>一切執政和掌權的頭</td><td>為 2:15、18 鋪路</td></tr></table>","gram":"<p>2:9 的 ὅτι（hoti） 給 2:8 的警告一個理由：為甚麼不可以照別的？因為一切都已經在他裡面。κατοικεῖ（katoikei） 是現在式，對照 1:19 的不定過去式 κατοικῆσαι（katoikēsai）：那裡說豐盛「樂意」來住，這裡說豐盛「現在一直」住著。πλήρωμα（plērōma） 可能是錯謬教師自己的口頭禪——他們說豐滿要一層一層、經過天使與異象才得著；保羅把這個字搶回來，放在基督身上。</p><p>τῆς θεότητος（tēs theotētos） 在新約只出現這一次。羅 1:20 用的是另一個字 θειότης（theiotēs），指從受造之物看得見的「神性的特質」；這裡的 θεότης（theotēs） 是「神之為神」本身。不是神的一部分、神的影子、神的特徵，是神性的全部。</p><blockquote><p>σωματικῶς（sōmatikōs） 有三讀：①「有形體地」，指道成肉身，而且照 κατοικεῖ（katoikei） 的時態，復活升天的基督今天仍有身體；②「實實在在地」，與 2:17 的「形體」（σῶμα（sōma））相對，不是影子；③「整體地、有機地」，與教會是他的身體連讀。本講義以①為主，同時聽見②的回聲：豐盛有身體，所以不是影子。2:10 的 ἐστὲ（este）……πεπληρωμένοι（peplērōmenoi） 是迂說完成式，與 πλήρωμα（plērōma） 同字根，成了文字遊戲：豐滿住在他裡面，你們在他裡面也被充滿了。</p></blockquote>","exp":"<p>「因為神本性一切的豐盛都有形有體地居住在基督裡面」（2:9）。這是新約講基督神性最直接的一句（立場二）。不是神在他身上停留過一陣子，不是他比別人多分到一點神性；神之為神的全部，都住在這位有身體的人裡面。看見他，就看見了神。這一句的落點不是辯論，是敬拜：你所需要的神，全部在你所認識的這位耶穌裡面。</p><p>「有形有體地」也保護另一邊：不要為了講他是神，就把他的人性講成一件外衣。他今天仍有一個身體。那位明白你餓、累、哭、被出賣的主，就是神本性一切豐盛的居所。</p><p>接著一句是本章的平地高處：「你們在他裡面也得了豐盛」（2:10）。完成式：已經被充滿了，現在仍是滿的。歌羅西的錯謬教師說：你信了基督很好，可是還差一點——差一個儀式、一套知識、一種經驗。保羅說：你不缺。不是因為你的感覺滿了，是因為你的位置在「他裡面」，而他裡面甚麼都不缺。這不是說基督徒不必長進——2:7 的建造還在進行；而是說長進是在豐盛裡長，不是為了得到豐盛而長。</p><p>「他是各樣執政掌權者的元首」（2:10）。這一句先把 2:15 和 2:18 的答案放在桌上：天使、靈界、權勢，都在他之下。既然頭已經是他，就沒有理由去敬拜在他底下的。這正是 321「讓耶穌作王」在第 2 章的形狀：王已經坐在最高處，跟從他的人不必向王底下的任何東西低頭。</p><p>所以 2:9–10 是整段警告的根據：保羅不是先列一張「不可」的清單，是先把基督的豐盛擺出來。人看見基督有多大，那些「再加一點」自然就變小了。講台上若只忙著拆錯謬，會眾學會的是害怕；先讓他們看見豐盛，他們學會的是滿足。</p>"},{"a":11,"z":12,"star":2,"grk":"<p lang=\"grc\">ἐν ᾧ καὶ περιετμήθητε περιτομῇ ἀχειροποιήτῳ ἐν τῇ ἀπεκδύσει τοῦ σώματος τῆς σαρκός, ἐν τῇ περιτομῇ τοῦ Χριστοῦ,</p><p lang=\"grc\">συνταφέντες αὐτῷ ἐν τῷ βαπτισμῷ ἐν ᾧ καὶ συνηγέρθητε διὰ τῆς πίστεως τῆς ἐνεργείας τοῦ θεοῦ τοῦ ἐγείραντος αὐτὸν ἐκ νεκρῶν·</p>","lit":"<p>在他裡面，你們也受了割禮，是不用手做的割禮，在於脫下肉體之身，在於基督的割禮；</p><p>在洗禮中與他一同被埋葬了，在其中你們也一同被叫起來了，是藉著對那叫他從死人中復活之神的運行的信。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>περιετμήθητε</td><td>perietmēthēte</td><td>你們受了割禮</td><td>不定過去式被動：一次完成</td></tr><tr><td>περιτομῇ ἀχειροποιήτῳ</td><td>peritomē acheiropoiētō</td><td>不是手做的割禮</td><td>可 14:58 同字形容新殿</td></tr><tr><td>ἐν τῇ ἀπεκδύσει τοῦ σώματος τῆς σαρκός</td><td>en tē apekdysei tou sōmatos tēs sarkos</td><td>在脫下肉體之身上</td><td>ἀπέκδυσις 新約只此一次</td></tr><tr><td>ἐν τῇ περιτομῇ τοῦ Χριστοῦ</td><td>en tē peritomē tou Christou</td><td>在基督的割禮裡</td><td>屬格兩讀</td></tr><tr><td>συνταφέντες αὐτῷ ἐν τῷ βαπτισμῷ</td><td>syntaphentes autō en tō baptismō</td><td>在洗禮中與他同葬</td><td>第一個「同」</td></tr><tr><td>συνηγέρθητε</td><td>synēgerthēte</td><td>你們一同被叫起來</td><td>3:1 再用</td></tr><tr><td>διὰ τῆς πίστεως τῆς ἐνεργείας τοῦ θεοῦ</td><td>dia tēs pisteōs tēs energeias tou theou</td><td>藉著對神大能運行的信</td><td>受詞屬格：信的對象是神的作為</td></tr></table>","gram":"<p>2:11 的割禮用三個修飾語層層界定：περιτομῇ ἀχειροποιήτῳ（peritomē acheiropoiētō）「不是手做的」、ἐν τῇ ἀπεκδύσει τοῦ σώματος τῆς σαρκός（en tē apekdysei tou sōmatos tēs sarkos）「在脫下肉體之身上」、ἐν τῇ περιτομῇ τοῦ Χριστοῦ（en tē peritomē tou Christou）「在基督的割禮裡」。和合本的「情慾」是小字補的；RP 在「肉體」後加「罪的」，也是想把意思說清楚。ἀπέκδυσις（apekdysis） 新約只此一次，雙重字首，「整個脫下」——和 2:15、3:9 同一組字。</p><p>「基督的割禮」屬格有兩讀：一讀是「基督所施行的割禮」，他在人心裡作的工；一讀是「基督自己所受的割禮」，指他的死——他的肉身在十字架上被「脫下」。兩讀都把割禮從人手移到基督身上。</p><blockquote><p>2:12 SBLGNT 作 βαπτισμῷ（baptismō），WH 與 RP 作較常見的 βάπτισμα（baptisma） 一類字形；意思相同。ἐν ᾧ（en hō） 可以指「在他（基督）裡面」，也可以指「在洗禮裡」。διὰ τῆς πίστεως τῆς ἐνεργείας τοῦ θεοῦ（dia tēs pisteōs tēs energeias tou theou） 的第二個屬格是受詞屬格：信的對象是「神的運行」，就是那位叫基督從死裡復活的神。一句話裡排出三層：洗禮是記號，信心是管道，神的大能是源頭。</p></blockquote>","exp":"<p>歌羅西有人說：外邦信徒要完全，還得受割禮，或至少守某些記號。保羅回答：「你們在他裡面也受了不是人手所行的割禮」（2:11）。你要的那個記號，在基督裡已經發生了，而且發生在比皮肉更深的地方。本系列加拉太書講義第 5 章講過割禮之爭的激烈；歌羅西書多出來的一筆是：割禮不是被廢掉，是在基督裡被成全了。</p><p>「脫去肉體」不是看輕身體。σάρξ（sarx） 在保羅的用法裡常指那個以自己為中心、與神隔絕的舊生命，不是皮膚骨頭。下一節說的「同埋葬、同復活」，處理的是整個舊人，不是叫人跟自己的身體作對（這一點到 2:23 會講得更清楚）。</p><p>「你們既受洗與他一同埋葬，也就在此與他一同復活」（2:12）。這兩節是嬰兒洗禮與信徒浸禮兩派都要讀的經文（立場四）。嬰兒洗禮派看見 2:11–12 把割禮和洗禮並排：割禮施於立約百姓的兒女，洗禮也是新約的立約記號，可以施於信徒的兒女。信徒浸禮派看見「都因信」：洗禮是信的人自己的宣告，「埋葬」的畫面也支持浸入水中。兩派都是福音派，都敬重聖經權威；本講義不替各教會決定洗禮的方式與對象。</p><p>兩派都必須同意的是經文的次序：洗禮不是魔法，受了洗不等於自動得救；洗禮也不是可有可無，它是一個人公開說「我已經與基督同死同活」。真正的力量在句末——「神的功用」。這就是 321「無己」的文法第一筆：不是我努力把自己埋掉，是我已經與他同埋；不是我努力爬出墳墓，是神叫我與他同起來。</p>"},{"a":13,"z":14,"star":2,"grk":"<p lang=\"grc\">καὶ ὑμᾶς νεκροὺς ὄντας ἐν τοῖς παραπτώμασιν καὶ τῇ ἀκροβυστίᾳ τῆς σαρκὸς ὑμῶν, συνεζωοποίησεν ὑμᾶς σὺν αὐτῷ· χαρισάμενος ἡμῖν πάντα τὰ παραπτώματα,</p><p lang=\"grc\">ἐξαλείψας τὸ καθʼ ἡμῶν χειρόγραφον τοῖς δόγμασιν ὃ ἦν ὑπεναντίον ἡμῖν, καὶ αὐτὸ ἦρκεν ἐκ τοῦ μέσου προσηλώσας αὐτὸ τῷ σταυρῷ·</p>","lit":"<p>並且你們，在過犯和你們肉體的未受割禮中是死的，他使你們與他一同活過來了，饒恕了我們一切的過犯，</p><p>塗抹了那用條例寫成、對我們不利的字據，就是與我們敵對的，並且已經把它從中間拿走，把它釘在十字架上；</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>νεκροὺς ὄντας</td><td>nekrous ontas</td><td>是死的</td><td>現在分詞：當時的狀態</td></tr><tr><td>τῇ ἀκροβυστίᾳ τῆς σαρκὸς ὑμῶν</td><td>tē akrobystia tēs sarkos hymōn</td><td>你們肉體的未受割禮</td><td>外邦人的身分，也是屬靈的光景</td></tr><tr><td>συνεζωοποίησεν ὑμᾶς σὺν αὐτῷ</td><td>synezōopoiēsen hymas syn autō</td><td>使你們與他一同活過來</td><td>σύν 用了兩次</td></tr><tr><td>χαρισάμενος</td><td>charisamenos</td><td>白白地饒恕了</td><td>與「恩典」同字根</td></tr><tr><td>χειρόγραφον</td><td>cheirographon</td><td>親筆寫的字據</td><td>欠條；新約只此一次</td></tr><tr><td>τοῖς δόγμασιν</td><td>tois dogmasin</td><td>以種種條例</td><td>2:20 δογματίζεσθε 同字根</td></tr><tr><td>ἦρκεν ἐκ τοῦ μέσου</td><td>ērken ek tou mesou</td><td>已經從中間拿走</td><td>完成式：拿走了，就不在了</td></tr><tr><td>προσηλώσας αὐτὸ τῷ σταυρῷ</td><td>prosēlōsas auto tō staurō</td><td>把它釘在十字架上</td><td>新約只此一次</td></tr></table>","gram":"<p>2:13 句首再一次 καὶ ὑμᾶς（kai hymas），受詞先出來，動詞 συνεζωοποίησεν（synezōopoiēsen） 到後面才出現；主詞是 2:12 末了那位叫基督復活的神。保羅先說 ὑμᾶς（你們），到 χαρισάμενος ἡμῖν πάντα τὰ παραπτώματα（charisamenos hēmin panta ta paraptōmata） 卻換成「我們」：饒恕這件事，他把自己也算進去。和合本在 2:13 的「你們」加了小註「或譯：我們」。</p><p>2:14 是一連串分詞：ἐξαλείψας（exaleipsas）「塗抹」、προσηλώσας（prosēlōsas）「釘上」，中間夾著一個完成式主動詞 ἦρκεν（ērken）。χειρόγραφον（cheirographon） 在蒲草紙文獻裡是親筆簽名的欠條：「我某某欠某某若干，簽名為據」。τὸ καθʼ ἡμῶν（to kath' hēmōn） 與 ὃ ἦν ὑπεναντίον ἡμῖν（ho ēn hypenantion hēmin） 說了兩次「對我們不利」，好像把被告的罪狀念了兩遍。</p><blockquote><p>字據是甚麼？三說：①摩西律法本身，作為定罪的條文；②猶太啟示文學裡天上記錄罪債的冊子；③人自己簽下、承認欠神順服的欠條，τοῖς δόγμασιν（tois dogmasin） 是欠條的條款。本講義的判斷：字據是「律法向我們追討的那一筆債」——被塗抹的不是神良善的心意，是那張定罪的帳（加拉太書立場二）。τοῖς δόγμασιν（tois dogmasin） 和 2:20 的 δογματίζεσθε（dogmatizesthe） 同字根：神已經把條例的欠條釘死，歌羅西人卻又讓人拿條例來約束自己。</p></blockquote>","exp":"<p>〔弗〕弗 2:5--6（以弗所書講義第 2 章）</p><p>「一同活過來」以弗所書講義第 2 章已經詳講；歌羅西書在這裡多出來的一筆，是那張「字據」。保羅說，神「又塗抹了在律例上所寫、攻擊我們、有礙於我們的字據，把它撤去，釘在十字架上」（2:14）。欠條上的簽名是我們自己的；欠的是真的；我們還不起，也是真的。神沒有假裝這筆債不存在，他把它拿來，釘在十字架上。</p><p>古時釘十字架，罪狀牌也釘在上面。耶穌頭上的牌子寫著他的「罪名」；保羅說，那天真正釘上去的，是我們的欠條。ἦρκεν（ērken） 是完成式：拿走了，而且到今天都還不在。沒有任何控告者能再把它找出來念一遍。</p><p>這對華人特別重要。我們的文化很會記帳：人情債、功德簿、還願、補贖。許多信徒信了主，心裡仍有一本帳，常常覺得自己還欠神一點，要多做一點才敢靠近。2:14 說，帳已經結清了，而且是釘死的。律法被廢了嗎？被撤去的是定罪的帳，不是神的心意；神的誡命不再是追討欠款的帳單，是一個被饒恕的人學習愛的方向。</p><p>伏筆也在這裡：既然條例的欠條已經被釘死，為甚麼還要讓人拿新的條例來叫你簽名？這正是 2:20–21 要問的問題。</p>"},{"a":15,"z":15,"star":3,"grk":"<p lang=\"grc\">ἀπεκδυσάμενος τὰς ἀρχὰς καὶ τὰς ἐξουσίας ἐδειγμάτισεν ἐν παρρησίᾳ, θριαμβεύσας αὐτοὺς ἐν αὐτῷ.</p>","lit":"<p>剝除了那些執政的和那些掌權的，公開地把他們示眾，在它裡面押著他們凱旋。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἀπεκδυσάμενος</td><td>apekdysamenos</td><td>脫下／剝除了</td><td>中間語態；與 3:9 同字</td></tr><tr><td>τὰς ἀρχὰς καὶ τὰς ἐξουσίας</td><td>tas archas kai tas exousias</td><td>那些執政的和掌權的</td><td>1:16、2:10 已出現</td></tr><tr><td>ἐδειγμάτισεν ἐν παρρησίᾳ</td><td>edeigmatisen en parrēsia</td><td>公開地示眾</td><td>太 1:19 約瑟「不願意明明地羞辱她」同字根</td></tr><tr><td>θριαμβεύσας αὐτοὺς</td><td>thriambeusas autous</td><td>押著他們遊行凱旋</td><td>羅馬凱旋式的字</td></tr><tr><td>ἐν αὐτῷ</td><td>en autō</td><td>在他／它裡面</td><td>指基督或十字架</td></tr></table>","gram":"<p>ἀπεκδυσάμενος（apekdysamenos） 是中間語態不定過去式分詞，有兩讀。一讀照中間語態的本義：「為自己脫下」——基督把纏著他的權勢像衣服一樣甩掉（部分希臘教父）；另一讀照通用希臘文中間語態常帶主動意思：「剝除了他們」——把敵軍的武裝卸下。本講義取第二讀，因為後面兩個動詞都是對權勢作的事。同一個字在 3:9 用在信徒身上：「已經脫去舊人」。</p><p>ἐδειγμάτισεν（edeigmatisen） 是把人公開示眾、使他蒙羞；太 1:19 約瑟「不願意明明地羞辱她」用的就是同一字根的 δειγματίσαι（deigmatisai）。θριαμβεύσας（thriambeusas） 指羅馬將軍凱旋入城，戰俘被押在隊伍裡給全城觀看；保羅在林後 2:14 用 θριαμβεύοντι（thriambeuonti） 寫同一個畫面。</p><blockquote><p>句末 ἐν αὐτῷ（en autō） 可以譯「在他裡面」（基督），也可以譯「在它裡面」（最近的先行詞是 2:14 的 τῷ σταυρῷ（tō staurō））。和合本譯「仗著十字架」，取後一讀。2:13–15 的主詞是神還是基督，學者也有爭論；神藉著基督、在十字架上，兩讀並不衝突。三個動詞一氣呵成：卸甲、示眾、遊行——這是本章地勢圖的最高點。</p></blockquote>","exp":"<p>「既將一切執政的、掌權的擄來，明顯給眾人看，就仗著十字架誇勝」（2:15）。這一句是全章的大反諷。那一天在各各他，看起來是羅馬和宗教領袖押著耶穌遊街示眾：赤身、受辱、被釘在城外。保羅說，真正被押著遊行的是另一方。十字架不是敗仗，是凱旋式；那個看起來被剝光的，正在剝除權勢的武裝。</p><p>這一節要讀得平安，不讀得恐懼（紅線七）。經文承認靈界權勢是真的，否則不必擄來；可是它們已經是戰俘。華人信徒最常帶著的恐懼是：鬼月不敢搬家，家裡長輩拜拜的東西不敢碰，運氣不好就懷疑被下了符。2:15 不是叫人更怕，是叫人知道仗已經打完了：基督徒不必再去求別的保護，也不必把每一個病痛、每一次衝突都講成靈界的攻擊；身體不適就醫，心裡不安禱告，兩樣都做。</p><p>既然已經勝了，為甚麼世界還有邪惡？凱旋是決定性的，但遊行還沒有走到終點；戰俘還在，卻已經沒有武裝。所以 2:10 先說基督是他們的元首，2:18 才警告不要去敬拜天使：向一個已經被押在凱旋隊伍裡的勢力低頭，是最荒謬的事。</p><p>勝利的方式也值得停下來看：不是用更大的力量壓倒，是藉著被釘、被羞辱、被剝去。這就是 321「謙卑戰勝驕傲、無己戰勝撒但」的經文根基——撒但最怕的不是一個更強的人，是一個肯死在十字架上的人。跟隨這位凱旋者的人，也不靠自己的強，靠的是他已經贏了。</p>"},{"a":16,"z":17,"star":3,"grk":"<p lang=\"grc\">Μὴ οὖν τις ὑμᾶς κρινέτω ἐν βρώσει ἢ ἐν πόσει ἢ ἐν μέρει ἑορτῆς ἢ νουμηνίας ἢ σαββάτων,</p><p lang=\"grc\">ἅ ἐστιν σκιὰ τῶν μελλόντων, τὸ δὲ σῶμα τοῦ Χριστοῦ.</p>","lit":"<p>所以不要讓任何人在吃或在喝上，或在節期、或月朔、或安息日的事上論斷你們，</p><p>這些是將要來之事的影子，但那形體是屬基督的。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Μὴ οὖν τις ὑμᾶς κρινέτω</td><td>Mē oun tis hymas krinetō</td><td>所以不要讓任何人論斷你們</td><td>第二個「所以」；現在式命令</td></tr><tr><td>ἐν βρώσει ἢ ἐν πόσει</td><td>en brōsei ē en posei</td><td>在吃或喝上</td><td>飲食的規條</td></tr><tr><td>ἑορτῆς ἢ νουμηνίας ἢ σαββάτων</td><td>heortēs ē noumēnias ē sabbatōn</td><td>節期、月朔、安息日</td><td>年、月、週三種聖日</td></tr><tr><td>σκιὰ τῶν μελλόντων</td><td>skia tōn mellontōn</td><td>將要來之事的影子</td><td>影子先到，人隨後</td></tr><tr><td>τὸ δὲ σῶμα τοῦ Χριστοῦ</td><td>to de sōma tou Christou</td><td>但那形體是屬基督的</td><td>全卷的鉸鏈</td></tr></table>","gram":"<p>2:16 的 Μὴ οὖν（Mē oun） 是全卷第二個「所以」，接在 2:14–15 後面：字據已經撤去，權勢已經被擄，所以不要讓人拿這些來論斷你們。κρινέτω（krinetō） 是第三人稱現在式命令，「不要讓任何人一直對你們下判決」；命令的對象其實是聽信的人：不要接受那張判決書。</p><p>ἐν μέρει（en merei） 是「在……的事上」。ἑορτῆς ἢ νουμηνίας ἢ σαββάτων（heortēs ē noumēnias ē sabbatōn） 依次是年度的節期、每月的月朔、每週的安息日；這三個並列，這使我們想起代上 23:31 與何 2:11 的同樣排列。σαββάτων（sabbatōn） 是複數，新約常用複數指一個安息日。</p><blockquote><p><strong>安息日的兩種讀法。</strong>安息日派的讀法：2:16 所說的是猶太節期附帶的特別安息日（禮儀性的安息），不包括十誡第四誡的第七日；主流的讀法：年、月、週三層並列，週的那一層就是每週的安息日，保羅說的範圍包括它。決定性的論證在 2:17：ἅ ἐστιν σκιὰ τῶν μελλόντων（ha estin skia tōn mellontōn），τὸ δὲ σῶμα τοῦ Χριστοῦ（to de sōma tou Christou）。ἐστιν（estin） 是現在式：這些「是」影兒——不是壞東西，是指向將來的影子；τὸ δὲ σῶμα τοῦ Χριστοῦ（to de sōma tou Christou） 省略了動詞，字面是「但形體是基督的」。σῶμα（sōma） 一字兩義：影子對實體，也是 2:19 的「全身」，基督的身體。保羅自己在羅 14:5–6 對守日的事作過同樣的連結。本講義的判斷：2:16 的重點不在決定哪一天，而在「不可論斷」——兩個方向都不可。</p></blockquote>","exp":"<p>「所以，不拘在飲食上，或節期、月朔、安息日都不可讓人論斷你們」（2:16）。這節經文在華人教會裡常常被拿來論斷人，正好和它的意思相反。</p><p>守安息日不是得救的條件；守安息日的弟兄姊妹也不因此就是律法主義。選擇在星期六敬拜、休息的，和選擇在主日敬拜、休息的，都不可以被論斷（紅線二）。保羅在羅馬書說得更直接：「有人看這日比那日強；有人看日日都是一樣」（羅 14:5），「守日的人是為主守的」（羅 14:6）。2:16 的命令也是兩面的：不要讓人論斷你，你也不要成為論斷人的那一個。同樣，主日也不是新的律法——主日去探望家人、主日休假出遊，不能拿來當作屬靈不屬靈的記號。</p><p>「這些原是後事的影兒；那形體卻是基督」（2:17）。這是全卷的鉸鏈。影子有形狀，沒有重量；你看見影子，就知道有人來了，但你不會去擁抱一個影子。節期、月朔、安息日，都是神親自設立、指向基督的影子；它們不是錯的，是先到的。人到了，還一直盯著地上的影子，就錯過了那個人。歌羅西的錯不在追求屬靈，在抱著影子不放。</p><p>安息的原則仍在。321 說「先生命」，包括身體的休息；可是這休息不是律法逼出來的，是恩典給的。一個生命藏在神裡面的人，不必靠不停地工作來證明自己——他可以停下來，因為形體已經是他的了。許多華人信徒一週七天都停不下來，連主日也在趕場服事；2:17 提醒的不是一條新規矩，是一個邀請：你可以休息，因為基督已經是你的。</p>"},{"a":18,"z":18,"star":2,"grk":"<p lang=\"grc\">μηδεὶς ὑμᾶς καταβραβευέτω θέλων ἐν ταπεινοφροσύνῃ καὶ θρησκείᾳ τῶν ἀγγέλων, ἃ ἑόρακεν ἐμβατεύων, εἰκῇ φυσιούμενος ὑπὸ τοῦ νοὸς τῆς σαρκὸς αὐτοῦ,</p>","lit":"<p>不要讓任何人判你們失去獎賞，他熱衷於謙卑和天使的敬拜，進入他所看見的，被他肉體的心思白白地吹脹，</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>μηδεὶς ὑμᾶς καταβραβευέτω</td><td>mēdeis hymas katabrabeuetō</td><td>不要讓任何人判你們出局</td><td>裁判的字；3:15 βραβευέτω 同字根</td></tr><tr><td>θέλων ἐν ταπεινοφροσύνῃ</td><td>thelōn en tapeinophrosynē</td><td>熱衷於謙卑</td><td>和合本「故意謙虛」</td></tr><tr><td>θρησκείᾳ τῶν ἀγγέλων</td><td>thrēskeia tōn angelōn</td><td>天使的敬拜</td><td>屬格兩讀</td></tr><tr><td>ἃ ἑόρακεν ἐμβατεύων</td><td>ha heoraken embateuōn</td><td>進入他所看見的</td><td>◆ 經文鑑別</td></tr><tr><td>εἰκῇ φυσιούμενος</td><td>eikē physioumenos</td><td>白白地被吹脹</td><td>林前 4:6、8:1 同字根</td></tr><tr><td>ὑπὸ τοῦ νοὸς τῆς σαρκὸς αὐτοῦ</td><td>hypo tou noos tēs sarkos autou</td><td>被他肉體的心思</td><td>「屬靈」的人其實屬肉體</td></tr></table>","gram":"<p>καταβραβευέτω（katabrabeuetō） 由 κατά（kata）「反對」與「當裁判」組成：裁判判你出局、奪走你的獎牌。3:15 的 βραβευέτω（brabeuetō） 是同一個字根——「基督的平安在你們心裡作主」，真正的裁判是基督的平安，不是那位自封的屬靈評審。</p><p>θέλων ἐν（thelōn en） 可能是七十士譯本的希伯來式說法，「喜愛、熱衷於」。ταπεινοφροσύνῃ（tapeinophrosynē） 在猶太文獻裡常指禁食之類的苦修，同一個字在 3:12 是真正的「謙虛」：同一個字，一個是假的，一個是真的。θρησκείᾳ τῶν ἀγγέλων（thrēskeia tōn angelōn） 的屬格有兩讀：受詞屬格「向天使的敬拜」（弗呂家一帶有呼求天使的民間習俗）；主詞屬格「天使所獻的敬拜」，指神秘經驗者自稱升到天上，加入天使的敬拜行列。</p><blockquote><p><strong>◆ 經文鑑別 2:18。</strong>SBLGNT 作 ἃ ἑόρακεν ἐμβατεύων（ha heoraken embateuōn）「進入他所看見的」；RP 作 ἃ μὴ ἑόρακεν（ha mē heoraken）「他所沒有看見的」，和合本註腳「有古卷作：這等人窺察所沒有見過的」即此。P46、西乃抄本、亞歷山大抄本、梵諦岡抄本都沒有 μὴ（mē）；加上否定詞較可能是抄寫者為了讓句子好懂（那些人看見的必是假的）。本講義跟 SBLGNT 與和合本正文。ἐμβατεύων（embateuōn） 在小亞細亞革拉羅的亞波羅神廟銘文裡，用來指入會者「進入」聖所；學者因此認為它可能是神秘宗教的入門術語。εἰκῇ φυσιούμενος（eikē physioumenos） 是反諷：自稱謙卑的人，其實是被吹脹的；τοῦ νοὸς τῆς σαρκὸς（tou noos tēs sarkos） 更是矛盾語——最「屬靈」的人，用的是肉體的心思。</p></blockquote>","exp":"<p>「不可讓人因著故意謙虛和敬拜天使，就奪去你們的獎賞」（2:18）。這節經文的畫面是一場比賽：有人在場邊自封裁判，宣布你不合格，因為你沒有他的禁食功夫，沒有他看見的異象，沒有走過他走的那一套屬靈階梯。</p><p>神可以給人異象，聖經裡有。保羅沒有否認經驗本身，他給了一個檢驗：「無故地自高自大」（2:18）、「不持定元首」（2:19）。一個經驗、一位屬靈導師，若讓人覺得「我比你屬靈」，若讓人需要經過某人才能聽見神，若讓基督退到後面，就要被察驗（紅線七）。屬靈經驗不分等級，也不是屬靈的勳章；真實從神來的經驗，果效是更謙卑、更平安、更愛人，不是更神秘、更恐慌、更看不起別人。</p><p>反諷也在這裡：最會談謙卑的人，常常最驕傲。「自高自大」原文是被吹脹——像一個氣球，看起來很大，裡面是空的。這就是 321 所說「問題的根源：有己與驕傲」最隱密的一種：用謙卑的樣子抓權力。今天華人教會也有這種場邊裁判：「沒有說方言就是沒有聖靈」「沒有被某某遮蓋就不能服事」。2:18 對被判出局的人說：你的獎賞不在他手裡。</p>"},{"a":19,"z":19,"star":1,"grk":"<p lang=\"grc\">καὶ οὐ κρατῶν τὴν κεφαλήν, ἐξ οὗ πᾶν τὸ σῶμα διὰ τῶν ἁφῶν καὶ συνδέσμων ἐπιχορηγούμενον καὶ συμβιβαζόμενον αὔξει τὴν αὔξησιν τοῦ θεοῦ.</p>","lit":"<p>並且不持守那頭；從他，全身藉著關節和韌帶被供應、被編織在一起，長出神的生長。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>οὐ κρατῶν τὴν κεφαλήν</td><td>ou kratōn tēn kephalēn</td><td>不抓住那頭</td><td>現在分詞：一直沒有抓住</td></tr><tr><td>διὰ τῶν ἁφῶν καὶ συνδέσμων</td><td>dia tōn haphōn kai syndesmōn</td><td>藉著關節和韌帶</td><td>醫學用語</td></tr><tr><td>ἐπιχορηγούμενον καὶ συμβιβαζόμενον</td><td>epichorēgoumenon kai symbibazomenon</td><td>被供應、被編織在一起</td><td>2:2 同字</td></tr><tr><td>αὔξει τὴν αὔξησιν τοῦ θεοῦ</td><td>auxei tēn auxēsin tou theou</td><td>長出神的生長</td><td>同源受詞</td></tr></table>","gram":"<p>2:19 接續 2:18 的分詞鏈：καὶ οὐ κρατῶν τὴν κεφαλήν（kai ou kratōn tēn kephalēn），現在分詞，「一直不持守那頭」。這是對那位自封裁判最重的判詞：他看見了很多，偏偏沒有抓住頭。</p><p>ἐξ οὗ（ex hou） 是陽性關係代名詞，而 κεφαλή（kephalē） 是陰性——保羅的文法跟著人走：「從他」，從基督本人，不是從一個抽象的「頭」。ἁφῶν（haphōn） 和 συνδέσμων（syndesmōn） 是當時醫學作者描寫身體的字：關節與韌帶。兩個現在分詞被動 ἐπιχορηγούμενον καὶ συμβιβαζόμενον（epichorēgoumenon kai symbibazomenon），身體一直在被供應、被編織；後一個字就是 2:2 的「聯絡」。αὔξει τὴν αὔξησιν（auxei tēn auxēsin） 是同源受詞：「長出生長」，τοῦ θεοῦ（tou theou） 標出生長的源頭與性質。弗 4:16 有幾乎相同的句子，以弗所書講義第 4 章已詳講。</p>","exp":"<p>「全身既然靠著他，筋節得以相助聯絡，就因神大得長進」（2:19）。這一節是 2:18 的反面。那位追求異象的人，切斷的不只是自己與頭的連結，也切斷了自己與身體的連結——他高高在上，不需要別的肢體。保羅描寫的健康是另一個畫面：每一個關節都和旁邊的接著，每一條韌帶都在傳遞從頭來的供應。</p><p>這就是 321「建立屬神的體系」的運作方式。體系不是一張組織圖，是一個從頭得供應、彼此聯絡的身體；成長也不是誰的業績，是「神的生長」。一間教會不必靠更神秘的經驗長大，只要每一個肢體持定元首、與旁邊的肢體接得上，神自己會叫它長。</p><p>關節和韌帶是身體裡最不起眼的部分，卻是力量傳遞的地方。教會裡那些默默接電話、排座位、為人代禱的人，常常就是這樣的筋節。一個肢體若常問「我看見了甚麼」，就容易高過別人；若常問「我和旁邊的人接上了沒有」，就在神的生長裡。</p>"},{"a":20,"z":23,"star":3,"grk":"<p lang=\"grc\">Εἰ ἀπεθάνετε σὺν Χριστῷ ἀπὸ τῶν στοιχείων τοῦ κόσμου, τί ὡς ζῶντες ἐν κόσμῳ δογματίζεσθε·</p><p lang=\"grc\">Μὴ ἅψῃ μηδὲ γεύσῃ μηδὲ θίγῃς,</p><p lang=\"grc\">ἅ ἐστιν πάντα εἰς φθορὰν τῇ ἀποχρήσει, κατὰ τὰ ἐντάλματα καὶ διδασκαλίας τῶν ἀνθρώπων;</p><p lang=\"grc\">ἅτινά ἐστιν λόγον μὲν ἔχοντα σοφίας ἐν ἐθελοθρησκίᾳ καὶ ταπεινοφροσύνῃ καὶ ἀφειδίᾳ σώματος, οὐκ ἐν τιμῇ τινι πρὸς πλησμονὴν τῆς σαρκός.</p>","lit":"<p>你們若與基督一同死了，脫離了世界的基本元素，為甚麼還像活在世界裡一樣，受條例的約束：</p><p>「不可抓，也不可嘗，也不可碰」——</p><p>這些都是一用就歸於朽壞的，是照著人的命令和教導？</p><p>這些事固然有智慧的名聲，在於自創的敬拜、謙卑和不愛惜身體，卻沒有任何價值，只為了肉體的飽足。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Εἰ ἀπεθάνετε σὺν Χριστῷ</td><td>Ei apethanete syn Christō</td><td>既然你們與基督同死了</td><td>第一類條件句：事實</td></tr><tr><td>ἀπὸ τῶν στοιχείων τοῦ κόσμου</td><td>apo tōn stoicheiōn tou kosmou</td><td>脫離世界的基本元素</td><td>回指 2:8</td></tr><tr><td>δογματίζεσθε</td><td>dogmatizesthe</td><td>你們受條例的約束</td><td>2:14 δόγμασιν 同字根</td></tr><tr><td>Μὴ ἅψῃ μηδὲ γεύσῃ μηδὲ θίγῃς</td><td>Mē hapsē mēde geusē mēde thigēs</td><td>不可抓、不可嘗、不可碰</td><td>錯謬教師的口號</td></tr><tr><td>εἰς φθορὰν τῇ ἀποχρήσει</td><td>eis phthoran tē apochrēsei</td><td>一用就歸於朽壞</td><td>規條管的是會壞的東西</td></tr><tr><td>ἐθελοθρησκίᾳ</td><td>ethelothrēskia</td><td>自己發明的敬拜</td><td>新約只此一次</td></tr><tr><td>ἀφειδίᾳ σώματος</td><td>apheidia sōmatos</td><td>不愛惜身體</td><td>和合本「苦待己身」</td></tr><tr><td>πρὸς πλησμονὴν τῆς σαρκός</td><td>pros plēsmonēn tēs sarkos</td><td>對於肉體的飽足</td><td>πρός 兩讀</td></tr></table>","gram":"<p><strong>◆ 合併節 2:20–21。</strong>和合本把 2:20 與 2:21 合併成一節譯出，「不可拿、不可嘗、不可摸」併入 2:20 的問句裡，2:21 在和合本是空的；SBLGNT 仍分兩節：2:20 是問句，2:21 是口號。本段把兩節放在同一段，引和合本時出處寫 2:20。Εἰ ἀπεθάνετε（Ei apethanete） 是第一類條件句，說的是事實：「既然你們已經死了」。ἀπὸ τῶν στοιχείων（apo tōn stoicheiōn） 是濃縮的說法：死了，因而脫離了。δογματίζεσθε（dogmatizesthe） 可作中間語態「你們讓自己受條例管」，正是 2:14 τοῖς δόγμασιν（tois dogmasin） 的回聲：欠條已經釘死，為甚麼又簽？</p><p>2:21 Μὴ ἅψῃ μηδὲ γεύσῃ μηδὲ θίγῃς（Mē hapsē mēde geusē mēde thigēs） 是三個不定過去式假設語氣的禁令，短促、押韻，像一句順口溜；三個動詞從「抓」到「嘗」到「碰」，越說越細，連輕輕碰一下都不行。和合本給它加上引號，是對的：保羅在引別人的話。2:22 ἅ ἐστιν πάντα εἰς φθορὰν τῇ ἀποχρήσει（ha estin panta eis phthoran tē apochrēsei） 說，這些東西一用就壞（這使我們想起可 7:19 主耶穌論飲食）；κατὰ τὰ ἐντάλματα καὶ διδασκαλίας τῶν ἀνθρώπων（kata ta entalmata kai didaskalias tōn anthrōpōn） 這使我們想起賽 29:13 的語言。保羅引用口號，是為了否定它。</p><blockquote><p><strong>2:23「苦待己身」是全本新約公認最難譯的一節之一。</strong>λόγον μὲν ἔχοντα σοφίας（logon men echonta sophias） 有 μέν（men） 卻沒有對應的 δέ（de），句子懸著；ἐν ἐθελοθρησκίᾳ καὶ ταπεινοφροσύνῃ καὶ ἀφειδίᾳ σώματος（en ethelothrēskia kai tapeinophrosynē kai apheidia sōmatos） 列出三樣：自創的敬拜（ἐθελοθρησκίᾳ（ethelothrēskia） 新約只此一次）、謙卑的樣子、不愛惜身體。末句 οὐκ ἐν τιμῇ τινι πρὸς πλησμονὴν τῆς σαρκός（ouk en timē tini pros plēsmonēn tēs sarkos） 有兩種讀法：①和合本：πρός（pros） 作「對抗」，「在克制肉體的情慾上是毫無功效」；②πρός（pros） 作「導向」：「毫無價值，只滿足了肉體」——苦修反而餵飽了肉體的驕傲。本講義的判斷：兩種譯法結論一樣，規條與苦待己身不能使人勝過肉體；第二讀更把它的反效果說了出來。ἀφειδίᾳ（apheidia） 這個字的字面是「不顧惜」，與 3:5 的「治死」方向正好相反：一個對付身體，一個對付罪。</p></blockquote>","exp":"<p>「你們若是與基督同死，脫離了世上的小學，為甚麼仍像在世俗中活著、服從那『不可拿、不可嘗、不可摸』等類的規條呢」（2:20）？第四個「同」出現了：與基督同死。保羅的問題很尖銳：一個死人，還要守活人的規矩嗎？你已經從那個世界的管轄裡死出來了，為甚麼又回去排隊領規條？</p><p>「不可拿、不可嘗、不可摸」（2:20）不是聖經的命令，是錯謬教師的口號（紅線三）。講台上若要勸人節制、戒酒、戒賭，要引的是愛人的原則與別處的經文，不是 2:21。保羅的判語寫在下一節：「這都是照人所吩咐、所教導的」（2:22）。這些規條管的是「正用的時候就都敗壞了」（2:22）的東西——食物吃了就沒了；一個用會壞的東西來量屬靈的系統，自己也不會長久。</p><p>「這些規條使人徒有智慧之名，用私意崇拜，自表謙卑，苦待己身，其實在克制肉體的情慾上是毫無功效」（2:23）。全本新約只有這一節直接說「苦待己身」沒有用。它看起來很屬靈：吃得少、睡得少、對自己狠，旁人都佩服；可是它治不了肉體，反而讓人更以自己為中心——我禁了多少、我忍了多少、我比你苦。</p><p>這一節保護 321。321 說「無己」，但無己不是苦待己身：不是不吃不睡、不是看輕自己的身體、不是用痛苦懲罰自己，更不是「你的感受不重要」。無己是不以自己為中心，把中心還給基督。治死的對象是 3:5 列出的罪的行為與私慾，不是身體，也不是情緒；而且次序不能顛倒——先有 3:1「若真與基督一同復活」，才有 3:5「所以，要治死」。活的人才能治死罪，死人不能靠折磨自己活過來。</p><p>若有弟兄姊妹曾經有自我傷害或飲食上的困擾，他需要的是溫柔的陪伴與專業的協助，絕不是被告知「治死得不夠」。禁食與節制仍有它的位置，是尋求神的方法，不是屬靈的成績單。第 2 章停在這裡：影兒都在，形體是基督；抱著影兒不放，就是不持定元首。讀完這一章的人，應該更確知自己在基督裡已經滿了，更會感謝，而不是更會苦待自己。</p>"}],"3":[{"a":1,"z":2,"star":3,"grk":"<p lang=\"grc\">Εἰ οὖν συνηγέρθητε τῷ Χριστῷ, τὰ ἄνω ζητεῖτε, οὗ ὁ Χριστός ἐστιν ἐν δεξιᾷ τοῦ θεοῦ καθήμενος·</p><p lang=\"grc\">τὰ ἄνω φρονεῖτε, μὴ τὰ ἐπὶ τῆς γῆς,</p>","lit":"<p>所以，如果你們已經與基督一同被復活了，就要尋求那在上面的事，那裡基督坐在神的右邊。</p><p>要思念那在上面的事，不要思念那在地上的事；</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Εἰ οὖν</td><td>Ei oun</td><td>所以，若</td><td>全卷第三個「所以」；第一類條件句，意思是「既然」</td></tr><tr><td>συνηγέρθητε τῷ Χριστῷ</td><td>synēgerthēte tō Christō</td><td>你們與基督一同被復活了</td><td>不定過去式被動；2:12 同一個字</td></tr><tr><td>τὰ ἄνω ζητεῖτε</td><td>ta anō zēteite</td><td>要尋求上面的事</td><td>現在命令式：意志的方向，一直去找</td></tr><tr><td>ἐν δεξιᾷ τοῦ θεοῦ καθήμενος</td><td>en dexia tou theou kathēmenos</td><td>坐在神的右邊</td><td>這使我們想起詩 110:1；保羅沒有標明引用</td></tr><tr><td>τὰ ἄνω φρονεῖτε</td><td>ta anō phroneite</td><td>要思念上面的事</td><td>心思的定向；腓 2:5 同一個動詞</td></tr><tr><td>μὴ τὰ ἐπὶ τῆς γῆς</td><td>mē ta epi tēs gēs</td><td>不要地上的事</td><td>3:5 的「地上的肢體」用同一個片語</td></tr></table>","gram":"<p><strong>3:1 的 Εἰ οὖν（Ei oun） 是全卷第三個「所以」。前兩個在 2:6 與 2:16；這一個把 2:12 的「與他一同復活」（2:12）接過來，翻成命令。</strong></p><p>εἰ（ei） 加直說語氣的不定過去式，是第一類條件句：說話的人假設條件為真。和合本「若真」把這個語氣譯出來了——不是「如果有一天你們復活」，是「既然你們已經與基督一同復活」。συνηγέρθητε（synēgerthēte） 是不定過去式被動，與 2:12 同一個字：復活是一件已經發生、而且是被神成就的事。命令跟在後面：τὰ ἄνω ζητεῖτε（ta anō zēteite） 與 τὰ ἄνω φρονεῖτε（ta anō phroneite），兩個現在命令式。前者是意志的尋求，後者是心思的定向，都是持續的動作。φρονεῖτε（phroneite） 的動詞，就是腓立比書「你們當以基督耶穌的心為心」（腓 2:5）的那一個字。</p><p>οὗ ὁ Χριστός ἐστιν ἐν δεξιᾷ τοῦ θεοῦ καθήμενος（hou ho Christos estin en dexia tou theou kathēmenos） 給「上面」一個地址：不是天空，也不是玄想的境界，是基督所在的地方。學者觀察到，「坐在右邊」是詩 110:1 的語言，那是新約最常引用的一節舊約；但保羅在這裡沒有標明引用，這使我們想起詩 110:1，不必說成應驗。3:2 的 μὴ τὰ ἐπὶ τῆς γῆς（mē ta epi tēs gēs） 與 3:5 的 τὰ μέλη τὰ ἐπὶ τῆς γῆς（ta melē ta epi tēs gēs） 是同一個片語：保羅先叫人把心思轉向上面，三節之後才點名地上那些要治死的東西。次序本身就是論證。</p>","exp":"<p><strong>「所以，你們若真與基督一同復活，就當求在上面的事」（3:1）。命令前面先放一個事實：你已經復活了。這是全章的鑰匙。</strong></p><p>第 2 章的錯謬教師也很關心上面。他們談天使、談異象，要人靠規條一級一級爬上去（2:18、21）。保羅也要人向上，方向卻剛好相反：不是爬上去，是已經被帶上去了。他們說的是，守住這些，你才上得去；保羅說的是，你已經與基督一同復活，所以去找上面的事。一個是梯子，一個是被抱上去；一個靠自己的腳，一個靠復活的大能。</p><p>上面在哪裡？經文自己回答：「那裡有基督坐在神的右邊。」（3:1）上面不是一個方位，是一個人；思念上面的事，就是讓心思繞著那一位坐在寶座上的基督轉。坐著，表示工作完成了；在右邊，表示權柄在他手裡。2:15 說他已經仗著十字架誇勝，3:1 說他現在坐著。一個確知王坐在寶座上的人，心裡就不慌了。</p><p>「你們要思念上面的事，不要思念地上的事。」（3:2）這不是叫人逃避地上。保羅說完這一句，十幾節之後就講到妻子、丈夫、兒女、僕人，全是地上的事。分別不在做甚麼事，在從哪裡看。思念地上的事，是讓地上的東西來定義我：房子、成績、別人的眼光。思念上面的事，是讓坐在神右邊的那一位定義我，然後帶著這個身分回到廚房、辦公室和孩子的書桌前。思念上面的事的人，最會在家裡溫柔。</p><p>321 說，要從地上的觀點改變成天上的觀點；這兩節就是它的原文。但次序要看清楚：先有 3:1 的已經復活，才有 3:2 的要思念。觀點的改變不是靠意志硬轉過去，是因為位置已經改變了。一個已經被遷到愛子國裡的人（1:13），才有能力用天上的眼睛看地上的事。</p>"},{"a":3,"z":4,"star":3,"grk":"<p lang=\"grc\">ἀπεθάνετε γάρ, καὶ ἡ ζωὴ ὑμῶν κέκρυπται σὺν τῷ Χριστῷ ἐν τῷ θεῷ·</p><p lang=\"grc\">ὅταν ὁ Χριστὸς φανερωθῇ, ἡ ζωὴ ὑμῶν τότε καὶ ὑμεῖς σὺν αὐτῷ φανερωθήσεσθε ἐν δόξῃ.</p>","lit":"<p>因為你們已經死了，而你們的生命已經與基督一同被藏在神裡面。</p><p>當基督——你們的生命——被顯現的時候，那時你們也要與他一同被顯現在榮耀裡。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἀπεθάνετε γάρ</td><td>apethanete gar</td><td>因為你們已經死了</td><td>不定過去式：一次的事實，接回 2:20</td></tr><tr><td>ἡ ζωὴ ὑμῶν</td><td>hē zōē hymōn</td><td>你們的生命</td><td>生命本身，不是生活方式</td></tr><tr><td>κέκρυπται</td><td>kekryptai</td><td>已經被藏起來</td><td>完成式被動：藏好了，現在仍藏著</td></tr><tr><td>σὺν τῷ Χριστῷ ἐν τῷ θεῷ</td><td>syn tō Christō en tō theō</td><td>與基督一同在神裡面</td><td>兩層保護：同基督，在神裡</td></tr><tr><td>ὅταν ὁ Χριστὸς φανερωθῇ</td><td>hotan ho Christos phanerōthē</td><td>當基督顯現的時候</td><td>隱藏的反面：將來的顯明</td></tr><tr><td>σὺν αὐτῷ φανερωθήσεσθε ἐν δόξῃ</td><td>syn autō phanerōthēsesthe en doxē</td><td>要與他一同顯現在榮耀裡</td><td>將來式被動：是保證，不只是盼望</td></tr></table>","gram":"<p><strong>3:3 用 γάρ（gar） 給 3:1–2 一個理由：要思念上面的事，因為你們已經死了。理由是一個不定過去式，命令是兩個現在式。已經，在前面；還要，在後面。</strong></p><p>ἀπεθάνετε（apethanete） 接回「你們若是與基督同死」（2:20），用的是同一個動詞。接著 κέκρυπται（kekryptai） 換成完成式：過去完成的動作，結果延續到現在，直譯是「已經被藏起來，並且仍藏著」。被動語態沒有說出藏的是誰，但 ἐν τῷ θεῷ（en tō theō） 已經回答：藏在神裡面，是神親手藏的。σὺν τῷ Χριστῷ（syn tō Christō） 與 ἐν τῷ θεῷ（en tō theō） 是兩層：生命與基督在一起，基督又在神裡面。2:3 說一切智慧知識都在基督裡藏著，用的是同字根的形容詞 ἀπόκρυφοι（apokryphoi）；第 3 章說，我們的生命也藏在那裡。藏寶的地方，也是藏生命的地方。</p><p>3:4 的 ὅταν（hotan） 與 φανερωθῇ（phanerōthē）、φανερωθήσεσθε（phanerōthēsesthe） 把「藏」翻到另一面：今天隱藏，那天顯現。ἡ ζωὴ ὑμῶν（hē zōē hymōn） 是 ὁ Χριστὸς（ho Christos） 的同位語——基督就是你們的生命。SBLGNT 作 ὑμῶν（hymōn），即「你們的」；和合本「我們的」跟另一組抄本，意思不變。從 2:12 到 3:4，六個「與基督同」排成一列：同埋、同復活、同活、同死、同藏、同顯現；σὺν αὐτῷ（syn autō） 是這一列的最後一站。</p>","exp":"<p><strong>「因為你們已經死了，你們的生命與基督一同藏在神裡面。」（3:3）這是 321「無己」在歌羅西書的本文。無己不是把自己磨掉，是自己的生命有了一個新地址。</strong></p><p>已經死了，是過去的一件事，不是今天的一項功課。保羅沒有叫人努力去死；他說你們已經死了，死在基督的十字架上（2:20）。這一句讓很多認真的基督徒鬆一口氣：我們常以為無己是一場永遠打不完的仗，要天天把自己按下去。經文說，那一場死已經發生了。今天要做的，是活在那個事實裡面。</p><p>藏是一個安全的字。古時人把最貴重的東西藏起來，免得被偷。保羅用完成式：已經藏好了，現在仍藏著。一個藏在神裡面的生命，誰拿得走？工作可以失去，健康可以失去，名聲可以被人奪走，但你們的生命不在這些東西裡面。321 說「無己戰勝撒但」，力量就在這裡：撒但控告的是那個舊的我，可是那個我已經死了；新的我藏在基督裡，牠找不到。</p><p>藏也表示還看不見。新生命在今天常常不顯眼：一個人照樣上班、照樣疲倦、照樣有軟弱。所以保羅加上第 4 節：「基督是我們的生命，他顯現的時候，你們也要與他一同顯現在榮耀裡。」（3:4）今天藏著，那天顯明。屬天的生命不必在今天急著證明自己；它有一個確定的顯現日子。這使一個人可以安靜地忠心，不必活在別人的掌聲裡。</p><p>還要注意這兩節的語氣：全是直說語氣，沒有一個命令。3:1–4 先講位置，3:5 才講命令。這個次序保護人：先讓藏在神裡面的生命安靜下來，治死與穿上才從那裡長出來。若把次序倒過來，以為要先治死才算數，福音就變成了另一套規條——那正是第 2 章保羅所反對的。</p>"},{"a":5,"z":5,"star":3,"grk":"<p lang=\"grc\">Νεκρώσατε οὖν τὰ μέλη τὰ ἐπὶ τῆς γῆς, πορνείαν, ἀκαθαρσίαν, πάθος, ἐπιθυμίαν κακήν, καὶ τὴν πλεονεξίαν ἥτις ἐστὶν εἰδωλολατρία,</p>","lit":"<p>所以，要治死那在地上的肢體：淫亂、污穢、邪情、惡的私慾，以及那貪婪，這貪婪就是拜偶像；</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Νεκρώσατε οὖν</td><td>Nekrōsate oun</td><td>所以要治死</td><td>全卷第四個「所以」；不定過去式命令：果斷下手</td></tr><tr><td>τὰ μέλη τὰ ἐπὶ τῆς γῆς</td><td>ta melē ta epi tēs gēs</td><td>那在地上的肢體</td><td>接回 3:2 的地上的事；下文五個罪名重新定義它</td></tr><tr><td>πορνείαν</td><td>porneian</td><td>淫亂</td><td>婚姻盟約以外的性</td></tr><tr><td>πάθος</td><td>pathos</td><td>邪情</td><td>被激起、失了控的情慾</td></tr><tr><td>ἐπιθυμίαν κακήν</td><td>epithymian kakēn</td><td>惡的私慾</td><td>慾望本身是神造的；加了「惡」才要治死</td></tr><tr><td>πλεονεξίαν ἥτις ἐστὶν εἰδωλολατρία</td><td>pleonexian hētis estin eidōlolatria</td><td>貪婪，這就是拜偶像</td><td>要得更多：把東西放到神的位置上</td></tr></table>","gram":"<p><strong>3:5 的 Νεκρώσατε οὖν（Nekrōsate oun） 是全卷第四個「所以」。它不接在第 2 章的苦修後面，而是接在 3:1–4 的同復活、同藏後面。先同復活，才治死。</strong></p><p>Νεκρώσατε（Nekrōsate） 是不定過去式命令，語氣果斷：不是慢慢磨，是下手。受詞 τὰ μέλη τὰ ἐπὶ τῆς γῆς（ta melē ta epi tēs gēs） 很容易被誤讀成身體的器官，但保羅馬上用一串同位語說明他的意思：πορνείαν（porneian）、ἀκαθαρσίαν（akatharsian）、πάθος（pathos）、ἐπιθυμίαν κακήν（epithymian kakēn）、πλεονεξίαν（pleonexian）。肢體被五個罪名重新定義——這是修辭上的借喻，治死的是這些行為與私慾，不是手腳。ἐπιθυμίαν κακήν（epithymian kakēn） 特別加上 κακήν（kakēn）：慾望本身是神造的，被扭曲的才要治死。</p><p>最後一項加了關係子句 ἥτις ἐστὶν εἰδωλολατρία（hētis estin eidōlolatria）。ἥτις（hētis） 帶解釋的意味：貪婪本質上就是拜偶像。弗 5:5 有相同的判斷。εἰδωλολατρία（eidōlolatria） 在 SBLGNT 是緊跟異文標記、沒有 Strong 編號的字，字形完好。</p><p>這一節要與 2:23 一起讀。2:23 說那些規條「苦待己身，其實在克制肉體的情慾上是毫無功效」（2:23）；3:5 給的是另一條路。兩節都在處理肉體，方法相反：一個用規條對付身體，一個從復活的生命對付罪。</p>","exp":"<p><strong>「所以，要治死你們在地上的肢體，就如淫亂、污穢、邪情、惡慾，和貪婪（貪婪就與拜偶像一樣）。」（3:5）這是本卷最容易被誤讀的一節。</strong></p><p>誤讀的方向有兩個。一是把它講成苦修：既然要治死，那就少吃、少睡、責打自己，越痛越屬靈。可是保羅前一頁才說，那種方法徒有智慧之名，「其實在克制肉體的情慾上是毫無功效」（2:23）。治死不是苦待己身，更不是懲罰自己、傷害自己；這兩者在經文裡是相反的兩條路。另一個誤讀是把它講成壓抑情緒：不准難過、不准生氣、把一切感覺都按下去。但 3:5 列的不是情緒，是行為與私慾。神沒有叫人治死眼淚。</p><p>那麼怎樣治死？答案在「所以」的前面。3:1 說你們已經與基督一同復活，3:3 說你們的生命藏在神裡面。活人才能治死，死人不能治死自己。治死不是靠意志把罪壓死，是一個已經活在基督裡的人，對那些不屬於新生命的東西說不——像一個已經搬進新家的人，不再把舊屋的垃圾搬進來。保羅在羅馬書說得更清楚：「若靠著聖靈治死身體的惡行，必要活著。」（羅 8:13）治死的對象是惡行，不是身體。</p><p>五個罪名的最後一個最出人意外：貪婪就是拜偶像。淫亂人人知道是罪；貪婪卻常被當成上進。保羅說，貪婪就是把錢、房子、成就放到神的位置上，讓它決定我的安全感和價值。華人社會很看重多賺一點才安心，教會裡也有人把成功神學包裝成信心。3:5 把貪婪和淫亂寫在同一行，還給它一個最重的名字。這使我們想起主耶穌說的：「你們不能又事奉神，又事奉瑪門。」（太 6:24）</p><p>321 的「無己」與 3:5 的治死站在同一邊，與 2:23 的苦待己身站在相反的一邊。無己是不以自己為中心，不是看輕自己的身體；一個藏在神裡面的人，反而更會愛惜這個身體，因為它是主的。若有人讀到治死就開始自責、自傷，那不是治死得不夠，而是需要溫柔的關懷與專業的協助。</p>"},{"a":6,"z":8,"star":1,"grk":"<p lang=\"grc\">διʼ ἃ ἔρχεται ἡ ὀργὴ τοῦ θεοῦ ἐπὶ τοὺς υἱοὺς τῆς ἀπειθείας ·</p><p lang=\"grc\">ἐν οἷς καὶ ὑμεῖς περιεπατήσατέ ποτε ὅτε ἐζῆτε ἐν τούτοις</p><p lang=\"grc\">νυνὶ δὲ ἀπόθεσθε καὶ ὑμεῖς τὰ πάντα, ὀργήν, θυμόν, κακίαν, βλασφημίαν, αἰσχρολογίαν ἐκ τοῦ στόματος ὑμῶν·</p>","lit":"<p>因為這些事，神的忿怒正臨到悖逆的兒子們身上；</p><p>你們從前也曾在其中行走，那時你們活在這些事裡。</p><p>但如今你們也要把這一切都脫下：忿怒、暴怒、惡毒、毀謗、出於你們口中的可恥言語。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἡ ὀργὴ τοῦ θεοῦ</td><td>hē orgē tou theou</td><td>神的忿怒</td><td>ἔρχεται 現在式：正在臨到</td></tr><tr><td>ἐπὶ τοὺς υἱοὺς τῆς ἀπειθείας</td><td>epi tous huious tēs apeitheias</td><td>臨到那悖逆之子</td><td>◆ 經文鑑別：有古卷無此語</td></tr><tr><td>περιεπατήσατέ ποτε</td><td>periepatēsate pote</td><td>你們從前也曾行過</td><td>ποτε 與 3:8 的 νυνὶ 對照：從前與如今</td></tr><tr><td>νυνὶ δὲ ἀπόθεσθε</td><td>nyni de apothesthe</td><td>但如今要脫下</td><td>脫衣服的字；預備 3:9 的脫去</td></tr><tr><td>ὀργήν</td><td>orgēn</td><td>惱恨</td><td>與 3:6 神的忿怒同一個字</td></tr><tr><td>αἰσχρολογίαν</td><td>aischrologian</td><td>污穢的言語</td><td>可恥的話：辱罵與下流話</td></tr></table>","gram":"<p><strong>◆ 經文鑑別 3:6。</strong>SBLGNT 有 ἐπὶ τοὺς υἱοὺς τῆς ἀπειθείας（epi tous huious tēs apeitheias） 這一片語，和合本「必臨到那悖逆之子」跟它；WH、Tregelles 與 NIV 沒有，所據的是 P46 與梵諦岡抄本。一說這是抄寫者從弗 5:6 補進來的：兩卷平行最密，最容易互相同化。另一說原有此語：沒有它，3:7 的 ἐν οἷς（en hois） 只能指「這些事」，與 3:6 開頭的 διʼ ἃ（di' ha） 重複；有它，ἐν οἷς（en hois） 可以指「在他們中間」。判斷：外證兩邊都有分量，較短的讀法略佔上風，但不能定案；無論取哪一種，神的忿怒臨到這些行為，意思不變。</p><p>διʼ ἃ ἔρχεται（di' ha erchetai） 用現在式：忿怒正在臨到，不只是末日的事。3:7–8 用 ποτε（pote） 與 νυνὶ δὲ（nyni de） 排出從前與如今的對照，這是以弗所書第 2 章的招牌句式。ἀπόθεσθε（apothesthe） 是脫衣服的動詞，預備 3:9–10 的脫去與穿上。3:8 清單的第一個字 ὀργήν（orgēn） 與 3:6 的 ἡ ὀργὴ τοῦ θεοῦ（hē orgē tou theou） 是同一個字：神的忿怒所臨到的罪單上，也包括人的忿怒。和合本註腳說「惡毒」或譯陰毒。</p>","exp":"<p><strong>「因這些事，神的忿怒必臨到那悖逆之子。」（3:6）保羅說完治死，立刻說明這些事有多嚴重。</strong></p><p>神的忿怒不是脾氣，是聖潔的神對罪的認真。一個對淫亂、貪婪都無所謂的神，也不會在乎被這些事傷害的人。這一節不是要嚇人，是要人看清楚：3:5 列的那些事，不是小毛病。</p><p>「當你們在這些事中活著的時候，也曾這樣行過。」（3:7）保羅把讀者自己也寫進去：你們從前也是這樣。這句話除掉了屬靈的驕傲；治死不是好人去管壞人，是蒙恩的罪人不再回到舊路。接著是轉折：「但現在你們要棄絕這一切的事」（3:8）。棄絕原文是脫衣服的字：舊衣服脫下來，不再穿回去。</p><p>第 8 節的清單從身體轉到嘴巴：惱恨、忿怒、惡毒、毀謗、污穢的言語。3:5 多半是私下的罪，3:8 多半是人與人之間的罪。有人以為自己沒有犯淫亂、沒有拜偶像，就已經很好了；保羅說，你在家裡、在群組裡、在背後說的話，也在這張單子上。和合本註腳說的陰毒，是那種藏在心裡、等機會傷人的惡意。</p>"},{"a":9,"z":10,"star":2,"grk":"<p lang=\"grc\">μὴ ψεύδεσθε εἰς ἀλλήλους· ἀπεκδυσάμενοι τὸν παλαιὸν ἄνθρωπον σὺν ταῖς πράξεσιν αὐτοῦ,</p><p lang=\"grc\">καὶ ἐνδυσάμενοι τὸν νέον τὸν ἀνακαινούμενον εἰς ἐπίγνωσιν κατʼ εἰκόνα τοῦ κτίσαντος αὐτόν,</p>","lit":"<p>不要彼此說謊，既然你們已經脫下了舊人和他的行為，</p><p>並且已經穿上了那新的，就是那正照著創造他者的形像被更新、以致真認識的。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>μὴ ψεύδεσθε εἰς ἀλλήλους</td><td>mē pseudesthe eis allēlous</td><td>不要彼此說謊</td><td>現在命令式的禁止：停下正在做的事</td></tr><tr><td>ἀπεκδυσάμενοι</td><td>apekdysamenoi</td><td>已經脫去</td><td>不定過去式分詞；雙重前綴：徹底脫下</td></tr><tr><td>τὸν παλαιὸν ἄνθρωπον</td><td>ton palaion anthrōpon</td><td>舊人</td><td>在亞當裡的那個我</td></tr><tr><td>ἐνδυσάμενοι τὸν νέον</td><td>endysamenoi ton neon</td><td>已經穿上新的</td><td>不定過去式分詞；3:12 接著說「要穿」</td></tr><tr><td>τὸν ἀνακαινούμενον</td><td>ton anakainoumenon</td><td>那正被更新的</td><td>現在式被動：持續地被神更新</td></tr><tr><td>κατʼ εἰκόνα τοῦ κτίσαντος αὐτόν</td><td>kat' eikona tou ktisantos auton</td><td>照著創造他者的形像</td><td>與 1:15 的 εἰκὼν 同一個字</td></tr></table>","gram":"<p><strong>3:9 的命令很短：μὴ ψεύδεσθε εἰς ἀλλήλους（mē pseudesthe eis allēlous）。理由卻是兩個不定過去式分詞：ἀπεκδυσάμενοι（apekdysamenoi） 與 ἐνδυσάμενοι（endysamenoi）。命令建立在一次已經發生的換衣服上。</strong></p><p>分詞的功能有兩種讀法：一說是原因分詞，「因為你們已經脫去……穿上」，和合本這樣譯；一說是命令分詞，「要脫去……要穿上」，與 3:8 的 ἀπόθεσθε（apothesthe） 平行。考慮到不定過去式，以及 2:11 已經用過名詞 ἀπεκδύσει（apekdysei） 說「脫去肉體」，本講義採原因分詞：脫與穿是與基督同死同活時已經發生的事。弗 4:22–24 用的是不定詞 ἀποθέσθαι（apothesthai） 與 ἐνδύσασθαι（endysasthai），通常讀成要脫去、要穿上；兩卷並看，正是已經與還要。</p><p>3:10 的 τὸν ἀνακαινούμενον（ton anakainoumenon） 是現在式被動：新人一直在被更新，更新者是神。εἰς ἐπίγνωσιν（eis epignōsin） 是更新的方向——更新到真認識。κατʼ εἰκόνα τοῦ κτίσαντος αὐτόν（kat' eikona tou ktisantos auton） 的 εἰκόνα（eikona），與 1:15 說基督是神的 εἰκὼν（eikōn） 同一個字；κτίσαντος（ktisantos） 是創造的動詞。學者觀察到，這裡用了創世記造人的語言，保羅沒有標明引用。</p>","exp":"<p>〔弗〕弗 4:22--24（以弗所書講義第 4 章）</p><p>〔創〕創 1:26--27（創世記講義第 1 章）</p><p><strong>以弗所書講義第 4 章已經詳講舊人與新人；歌羅西書在這裡多出來的一筆，是時態：已經脫了，已經穿了。</strong></p><p>以弗所書說「就要脫去你們從前行為上的舊人……並且穿上新人」（弗 4:22–24），語氣著重還要。歌羅西書用過去的分詞，著重已經。兩封信同一天送到呂克斯河谷，並不矛盾：一件衣服已經換上了，所以每天早上要照著這件衣服的樣子出門。已經，是身分；還要，是生活。只講還要，人會焦慮；只講已經，人會懶散。兩個一起，人才站得穩。</p><p>為甚麼這個已經帶出的第一個命令是不要說謊？因為說謊是舊人的本能：怕被看穿，所以包裝；想被看好，所以誇大。一個生命藏在神裡面的人，不需要靠假象保護自己。華人很重面子，教會裡也容易報喜不報憂；3:9 說，在新人的群體裡，人可以說真話，因為我們的價值不靠別人的眼光。</p><p>「這新人在知識上漸漸更新，正如造他主的形像。」（3:10）漸漸二字把被動的現在式譯得很好：新人不是一天完工，是一直被神更新。更新的標準是造他主的形像——這使我們想起創 1:27，創世記講義第 1 章講過，人原是照神的形像造的。而「愛子是那不能看見之神的像」（1:15），用的是同一個字。新人被更新的方向，就是越來越像基督。321 說耶穌是我的榜樣；3:10 補上一句：這個榜樣不只在外面讓我們模仿，也在裡面被刻上。</p>"},{"a":11,"z":11,"star":3,"grk":"<p lang=\"grc\">ὅπου οὐκ ἔνι Ἕλλην καὶ Ἰουδαῖος, περιτομὴ καὶ ἀκροβυστία, βάρβαρος, Σκύθης, δοῦλος, ἐλεύθερος, ἀλλὰ τὰ πάντα καὶ ἐν πᾶσιν Χριστός.</p>","lit":"<p>在那裡沒有希臘人和猶太人、割禮和未受割禮、化外人、西古提人、奴隸、自由人，而是基督是一切，也在一切之中。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ὅπου οὐκ ἔνι</td><td>hopou ouk eni</td><td>在此並不分</td><td>在那被更新的新人裡，根本沒有</td></tr><tr><td>Ἕλλην καὶ Ἰουδαῖος</td><td>Hellēn kai Ioudaios</td><td>希臘人、猶太人</td><td>民族與宗教</td></tr><tr><td>περιτομὴ καὶ ἀκροβυστία</td><td>peritomē kai akrobystia</td><td>受割禮的、未受割禮的</td><td>接回 2:11 的割禮</td></tr><tr><td>βάρβαρος, Σκύθης</td><td>barbaros, Skythēs</td><td>化外人、西古提人</td><td>文化：西古提人是野蠻的代名詞</td></tr><tr><td>δοῦλος, ἐλεύθερος</td><td>doulos, eleutheros</td><td>為奴的、自主的</td><td>社會地位：阿尼西謀就在送信的隊伍裡</td></tr><tr><td>τὰ πάντα καὶ ἐν πᾶσιν Χριστός</td><td>ta panta kai en pasin Christos</td><td>基督是一切，又在一切之中</td><td>全卷地勢圖最高點</td></tr></table>","gram":"<p><strong>3:11 以 ὅπου（hopou） 開頭，「在那裡」指的是 3:10 那被更新的新人。四組分別排成兩種節奏：前兩組用 καὶ（kai） 成對，後兩組不用連接詞。最後一個 ἀλλὰ（alla） 把全部推翻：ἀλλὰ τὰ πάντα καὶ ἐν πᾶσιν Χριστός（alla ta panta kai en pasin Christos）。</strong></p><p>οὐκ ἔνι（ouk eni） 是強調的否定：根本沒有。四組分別各有層次：Ἕλλην καὶ Ἰουδαῖος（Hellēn kai Ioudaios） 是民族，περιτομὴ καὶ ἀκροβυστία（peritomē kai akrobystia） 是宗教記號，βάρβαρος（barbaros） 與 Σκύθης（Skythēs） 是文化，δοῦλος（doulos） 與 ἐλεύθερος（eleutheros） 是社會地位。加 3:28 的同類句子有男女一組，這裡沒有，卻多了西古提人一項。在希臘人眼中，化外人已經是不說希臘話的人；西古提人是黑海北岸的遊牧民族，更是野蠻的代名詞。保羅選了最極端的例子。</p><p>結尾 τὰ πάντα καὶ ἐν πᾶσιν Χριστός（ta panta kai en pasin Christos） 沒有動詞，主詞 Χριστός（Christos） 放在最後，像一記定音鼓。τὰ πάντα（ta panta） 接回 1:16–20 基督之歌裡一再出現的萬有；ἐν πᾶσιν（en pasin） 可讀為在一切人裡面，也可讀為在一切事裡面，和合本取前者，譯作「住在各人之內」。兩種讀法可以並存：基督是一切的總和，又在每一個人裡面。這是全卷地勢圖的最高點。</p>","exp":"<p><strong>「惟有基督是包括一切，又住在各人之內。」（3:11）全卷從「使他可以在凡事上居首位」（1:18）一路往上爬，在這裡到達山頂。</strong></p><p>歌羅西人遇到的問題，是有人要在基督之外加一點：加哲學、加節期、加天使、加苦修。3:11 的回答是減法：在新人的群體裡，人用來分高低的一切記號都不算數，剩下的只有基督。猶太人以割禮為榮，希臘人以文化為榮，自由人以身分為榮；保羅把這些全部放在不分底下。不是說差異消失了——3:18 起保羅照樣分別對妻子、丈夫、僕人說話——而是差異不再決定一個人在神家裡的價值。</p><p>西古提人那一項特別刺耳。好比今天在一間講究學歷的教會裡說：在這裡，博士和沒唸完小學的，不分。保羅故意把最被看不起的人放進來，因為福音最能顯出大能的地方，就是把最遠的人帶到最近。為奴的那一項也不是抽象的：送這封信的隊伍裡，就有一個曾經逃走的奴隸阿尼西謀（4:9）。歌羅西教會聽見這一節的時候，他很可能就站在旁邊。</p><p>今天的歌羅西在哪裡？華人教會裡有國語堂、粵語堂、方言堂，有專業人士小組、藍領小組，有老一輩與年輕一代彼此看不慣。分堂分組本身可能是牧養的智慧，但若讓人覺得某一群人比較屬靈、比較重要，3:11 就要說話了。不分的群體，不是每個人都一樣，是每個人都以基督為中心。</p><p>321 說焦點在耶穌，不在自己、不在別人、不在環境；3:11 是這句話在本卷的原型。焦點一旦從基督移到我是哪一種人，教會就開始分；焦點回到基督，人與人之間的牆就變矮了。基督是包括一切的——你在他裡面已經滿了（2:10），不必再靠身分、背景或成績替自己加分。</p>"},{"a":12,"z":14,"star":2,"grk":"<p lang=\"grc\">Ἐνδύσασθε οὖν ὡς ἐκλεκτοὶ τοῦ θεοῦ, ἅγιοι καὶ ἠγαπημένοι, σπλάγχνα οἰκτιρμοῦ, χρηστότητα, ταπεινοφροσύνην, πραΰτητα, μακροθυμίαν,</p><p lang=\"grc\">ἀνεχόμενοι ἀλλήλων καὶ χαριζόμενοι ἑαυτοῖς ἐάν τις πρός τινα ἔχῃ μομφήν· καθὼς καὶ ὁ κύριος ἐχαρίσατο ὑμῖν οὕτως καὶ ὑμεῖς·</p><p lang=\"grc\">ἐπὶ πᾶσιν δὲ τούτοις τὴν ἀγάπην, ὅ ἐστιν σύνδεσμος τῆς τελειότητος.</p>","lit":"<p>所以，你們既是神所揀選、聖潔而蒙愛的人，就要穿上憐憫的心腸、恩慈、謙卑的心思、溫柔、恆忍，</p><p>彼此包容，並且饒恕自己人，若有人對誰有可抱怨的；正如主饒恕了你們，你們也要這樣。</p><p>而在這一切之上，要穿上愛，這愛就是完全的聯繫。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Ἐνδύσασθε οὖν</td><td>Endysasthe oun</td><td>所以要穿上</td><td>全卷第五個「所以」；和合本註腳：「存」原文是穿</td></tr><tr><td>ἐκλεκτοὶ τοῦ θεοῦ</td><td>eklektoi tou theou</td><td>神的選民</td><td>舊約給以色列的名號，給了外邦信徒</td></tr><tr><td>σπλάγχνα οἰκτιρμοῦ</td><td>splanchna oiktirmou</td><td>憐憫的心腸</td><td>從裡面動了慈心</td></tr><tr><td>ταπεινοφροσύνην</td><td>tapeinophrosynēn</td><td>謙虛</td><td>與 2:18、23 的假謙虛同一個字</td></tr><tr><td>χαριζόμενοι ἑαυτοῖς</td><td>charizomenoi heautois</td><td>彼此饒恕</td><td>字根是恩典</td></tr><tr><td>σύνδεσμος τῆς τελειότητος</td><td>syndesmos tēs teleiotētos</td><td>聯絡全德的</td><td>繫住一切的腰帶；2:19 的筋節同字</td></tr></table>","gram":"<p><strong>3:12 的 Ἐνδύσασθε οὖν（Endysasthe oun） 是全卷第五個、也是最後一個「所以」。和合本作「存」，註腳說原文是穿，下同。3:10 說已經穿上新人；3:12 說，所以把新人的衣服一件一件穿上。</strong></p><p>ὡς ἐκλεκτοὶ τοῦ θεοῦ（hōs eklektoi tou theou） 與 ἅγιοι καὶ ἠγαπημένοι（hagioi kai ēgapēmenoi） 三個稱呼，都是舊約給以色列的名號，現在給了外邦的歌羅西人；ἠγαπημένοι（ēgapēmenoi） 是完成式被動分詞：已經被愛，而且一直被愛著。命令之前，先叫你的名字。五件衣服是 σπλάγχνα οἰκτιρμοῦ（splanchna oiktirmou）、χρηστότητα（chrēstotēta）、ταπεινοφροσύνην（tapeinophrosynēn）、πραΰτητα（praytēta）、μακροθυμίαν（makrothymian），全是待人的美德。πραΰτητα（praytēta） 也是緊跟異文標記、沒有 Strong 編號的字。ταπεινοφροσύνην（tapeinophrosynēn） 在 2:18、23 剛出現過，是錯謬教師的故意謙虛、自表謙卑；同一個字，在那裡是假的，在這裡是真的。</p><p>3:13 的兩個分詞 ἀνεχόμενοι（anechomenoi） 與 χαριζόμενοι（charizomenoi） 說明怎樣穿：彼此包容、彼此饒恕。χαριζόμενοι（charizomenoi） 的字根就是恩典 χάρις（charis）。καθὼς καὶ ὁ κύριος ἐχαρίσατο ὑμῖν（kathōs kai ho kyrios echarisato hymin）：SBLGNT 作 κύριος（kyrios），拜占庭傳統作 Χριστός（Christos），和合本的「主」跟批判本。3:14 的 ἐπὶ πᾶσιν δὲ τούτοις（epi pasin de toutois） 可讀為在這一切之上，也可讀為在這一切之外，和合本取後者。σύνδεσμος（syndesmos） 是捆綁、聯繫的東西，2:19 用它指身體的筋節。愛是最外面的那一件，像一條腰帶把所有衣服繫住。</p>","exp":"<p><strong>「所以，你們既是神的選民，聖潔蒙愛的人，就要存憐憫、恩慈、謙虛、溫柔、忍耐的心。」（3:12）保羅先說你是誰，再說你穿甚麼。</strong></p><p>選民、聖潔、蒙愛——三個名字在前，五件衣服在後。這個次序和 3:1–4 一樣：身分先於命令。人穿衣服，是照著自己的身分穿：法官穿法袍，廚師穿圍裙。神的選民穿的是憐憫、恩慈、謙虛、溫柔、忍耐。這五樣全是對人的；它們不是一個人關起門來修出來的成績，是在人與人之間穿出來的。</p><p>最有意思的是謙虛。第 2 章的錯謬教師也很謙虛，他們禁食、守規條、苦待己身，看起來很謙卑，其實是「無故地自高自大」（2:18）。真謙虛不需要表演。假謙虛向內，用苦待自己證明自己；真謙虛向外，它的記號是：「倘若這人與那人有嫌隙，總要彼此包容，彼此饒恕」（3:13）。</p><p>饒恕的標準很高：「主怎樣饒恕了你們，你們也要怎樣饒恕人。」（3:13）但要分清楚，饒恕不等於假裝沒事，也不等於立刻恢復原來的關係。饒恕是把討債的權利交給主；和好需要對方的悔改與信任的重建，有時需要時間，甚至需要保護與界線（饒恕與受害者，回指哥林多後書立場四）。被傷害的人，不必因為心裡還沒有放下而自責。</p><p>最後是愛：「在這一切之外，要存著愛心，愛心就是聯絡全德的。」（3:14）沒有愛的憐憫會變成施捨，沒有愛的忍耐會變成壓抑。愛像腰帶，把其他的衣服繫在一起，叫它們不至於散開。五件衣服加一條腰帶，就是 321 所說人比事重要、關係比東西重要的穿著。</p>"},{"a":15,"z":15,"star":2,"grk":"<p lang=\"grc\">καὶ ἡ εἰρήνη τοῦ Χριστοῦ βραβευέτω ἐν ταῖς καρδίαις ὑμῶν, εἰς ἣν καὶ ἐκλήθητε ἐν ἑνὶ σώματι· καὶ εὐχάριστοι γίνεσθε.</p>","lit":"<p>也要讓基督的平安在你們心裡作裁判，你們也是為此在一個身體裡蒙召的；並且要成為感謝的人。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ἡ εἰρήνη τοῦ Χριστοῦ</td><td>hē eirēnē tou Christou</td><td>基督的平安</td><td>平安有名字；拜占庭傳統作「神的」</td></tr><tr><td>βραβευέτω</td><td>brabeuetō</td><td>作主</td><td>當裁判、吹哨子；第三人稱現在命令式</td></tr><tr><td>ἐν ταῖς καρδίαις ὑμῶν</td><td>en tais kardiais hymōn</td><td>在你們心裡</td><td>裁判坐在心裡</td></tr><tr><td>ἐν ἑνὶ σώματι</td><td>en heni sōmati</td><td>歸為一體</td><td>平安不只是個人的感覺</td></tr><tr><td>εὐχάριστοι γίνεσθε</td><td>eucharistoi ginesthe</td><td>要成為感謝的人</td><td>感謝是一種身分</td></tr></table>","gram":"<p><strong>3:15 的動詞 βραβευέτω（brabeuetō） 原是運動場上的字：裁判判定輸贏、頒發獎賞。名詞 βραβεῖον（brabeion） 就是獎賞（腓 3:14；林前 9:24）。和合本譯作「作主」，意思是讓基督的平安來裁決。</strong></p><p>這個字與 2:18 的 καταβραβευέτω（katabrabeuetō） 同一個字根。2:18 說，不要讓那些人判你們出局，「就奪去你們的獎賞」（2:18）；3:15 說，要讓基督的平安作裁判。兩個裁判，只能二選一。βραβευέτω（brabeuetō） 是第三人稱現在命令式：不是你要去判斷，是讓它來判——主詞是平安，人的責任是讓位。</p><p>ἡ εἰρήνη τοῦ Χριστοῦ（hē eirēnē tou Christou） 一語，拜占庭傳統作 τοῦ θεοῦ（tou theou），和合本跟批判本作基督的。εἰς ἣν καὶ ἐκλήθητε ἐν ἑνὶ σώματι（eis hēn kai eklēthēte en heni sōmati） 把平安從個人的心擴大到群體：你們是為這平安、在一個身體裡蒙召的。這裡被裁判的，不只是我一個人心裡的取捨，也是弟兄姊妹之間的爭執。最後一句 καὶ εὐχάριστοι γίνεσθε（kai eucharistoi ginesthe） 用形容詞配 γίνεσθε（ginesthe）：要成為感謝的人，感謝是一種身分，不只是一個動作。</p>","exp":"<p><strong>「又要叫基督的平安在你們心裡作主」（3:15）。裁判坐在哪裡，比賽就照誰的哨子走。</strong></p><p>每一個人心裡都有一個裁判。有人讓恐懼吹哨：怕失敗、怕被看不起，於是事事求保險。有人讓別人的眼光吹哨：大家怎麼說，就怎麼做。歌羅西的錯謬教師想當裁判，用規條、節期、異象判人合不合格。保羅說：讓基督的平安當裁判。</p><p>這是本卷講聖靈是我的引導的地方。歌羅西書全卷只有 1:8 提到靈，而且「聖」字還是和合本補的；所以這裡不必硬講聖靈，經文自己用的是基督的平安，與下一節基督的道理。基督的平安怎樣作裁判？當一個決定使人越來越不安、越來越需要隱瞞，裁判在吹哨；當一條路雖然艱難，心裡卻有一種安靜的確定，裁判在說可以。這不是取代思考，而是在思考之上，有一個更深的指引。</p><p>但這平安不是一個人的私事。保羅接著說：「你們也為此蒙召，歸為一體」（3:15）。基督的平安也裁判我們之間的關係：兩個人有嫌隙的時候（3:13），問的不是誰贏，是基督的平安有沒有在我們中間作主。教會裡的會議、家裡的爭吵，都可以停下來問一句：現在吹哨的是誰？</p><p>最後一句是：「且要存感謝的心。」（3:15）本卷四章每一章都有感謝。感謝是讓平安作主的人自然的樣子：一個不再需要自己當裁判的人，就有空看見神給了他多少。</p>"},{"a":16,"z":17,"star":2,"grk":"<p lang=\"grc\">ὁ λόγος τοῦ Χριστοῦ ἐνοικείτω ἐν ὑμῖν πλουσίως ἐν πάσῃ σοφίᾳ· διδάσκοντες καὶ νουθετοῦντες ἑαυτοὺς ψαλμοῖς ὕμνοις ᾠδαῖς πνευματικαῖς ἐν χάριτι, ᾄδοντες ἐν ταῖς καρδίαις ὑμῶν τῷ θεῷ</p><p lang=\"grc\">καὶ πᾶν ὅ τι ἐὰν ποιῆτε ἐν λόγῳ ἢ ἐν ἔργῳ, πάντα ἐν ὀνόματι κυρίου Ἰησοῦ, εὐχαριστοῦντες τῷ θεῷ πατρὶ διʼ αὐτοῦ.</p>","lit":"<p>要讓基督的話豐富地住在你們裡面，在一切智慧裡；彼此教導、勸戒，用詩篇、頌歌、屬靈的歌，在恩典中，在你們心裡向神歌唱。</p><p>並且你們無論做甚麼，在言語上或在行為上，一切都要在主耶穌的名裡，藉著他感謝父神。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ὁ λόγος τοῦ Χριστοῦ</td><td>ho logos tou Christou</td><td>基督的道理</td><td>不是「神的道」，是「基督的道」</td></tr><tr><td>ἐνοικείτω ἐν ὑμῖν πλουσίως</td><td>enoikeitō en hymin plousiōs</td><td>豐豐富富地存在心裡</td><td>「住在家裡」：住下來，當家</td></tr><tr><td>διδάσκοντες καὶ νουθετοῦντες ἑαυτοὺς</td><td>didaskontes kai nouthetountes heautous</td><td>彼此教導，互相勸戒</td><td>1:28 是保羅自己的工作，這裡交給全會眾</td></tr><tr><td>ψαλμοῖς ὕμνοις ᾠδαῖς πνευματικαῖς</td><td>psalmois hymnois ōdais pneumatikais</td><td>詩章、頌詞、靈歌</td><td>詩歌也是教導</td></tr><tr><td>ἐν ὀνόματι κυρίου Ἰησοῦ</td><td>en onomati kyriou Iēsou</td><td>奉主耶穌的名</td><td>像他的代表那樣做</td></tr><tr><td>εὐχαριστοῦντες τῷ θεῷ πατρὶ</td><td>eucharistountes tō theō patri</td><td>感謝父神</td><td>全卷的 321 核心二</td></tr></table>","gram":"<p><strong>3:16 的 ὁ λόγος τοῦ Χριστοῦ（ho logos tou Christou） 在保羅書信裡只此一次這樣說：不是神的道，是基督的道。動詞 ἐνοικείτω（enoikeitō） 字根是家：基督的話不是偶爾來訪的客人，是住下來當家的。</strong></p><p>和合本註腳提到另一種斷句：ἐν πάσῃ σοφίᾳ（en pasē sophia） 可以屬上，修飾存在心裡，這是和合本正文的讀法；也可以屬下，修飾彼此教導，這是註腳的讀法。兩種斷句都通，後者使 3:16 的結構更整齊：一個命令 ἐνοικείτω（enoikeitō），三個分詞 διδάσκοντες（didaskontes）、νουθετοῦντες（nouthetountes）、ᾄδοντες（adontes） 說明它怎樣發生。ψαλμοῖς ὕμνοις ᾠδαῖς πνευματικαῖς（psalmois hymnois ōdais pneumatikais） 連用三個名詞，學者對三者有沒有嚴格分別意見不一，多數認為是一組豐富的同義字。SBLGNT 作 τῷ θεῷ（tō theō），拜占庭傳統作「主」，和合本「歌頌神」跟批判本。</p><p>3:17 以 καὶ πᾶν ὅ τι ἐὰν ποιῆτε（kai pan ho ti ean poiēte） 開頭，緊接著 πάντα（panta），與 3:11 的 τὰ πάντα（ta panta） 呼應：基督是一切，所以一切都要奉他的名。ἐν λόγῳ ἢ ἐν ἔργῳ（en logō ē en ergō） 包括了人的全部生活。主要動詞省略了，留下分詞 εὐχαριστοῦντες（eucharistountes）：感謝不是附加的，是做一切事的方式。διʼ αὐτοῦ（di' autou） 說明感謝的管道：藉著基督到父那裡。</p>","exp":"<p>〔弗〕弗 5:19--20（以弗所書講義第 5 章）</p><p><strong>以弗所書講義第 5 章講過「用詩章、頌詞、靈歌彼此對說」（弗 5:19），那裡的源頭是被聖靈充滿；歌羅西書多出來的一筆，是源頭換成了基督的道理。</strong></p><p>兩封信平行得很密：弗 5:18–20 說被聖靈充滿，就會唱詩、感謝；西 3:16–17 說讓基督的話住在心裡，就會唱詩、感謝。學者觀察到，兩處的果子一樣；被聖靈充滿的人，就是被基督的話充滿的人。這也是本卷聖經是我的準則與聖靈是我的引導相遇的地方：聖靈不會帶人離開基督的話。</p><p>「把基督的道理豐豐富富地存在心裡」（3:16），不是背幾節經文應付考試，是讓基督的話在心裡住下來，成為家裡的主人。住下來的話會改變人怎樣說話：彼此教導，互相勸戒。這是全會眾的事，不只是牧者的工作。詩歌在這裡也是一種教導；我們唱甚麼，就在教彼此相信甚麼。教會選詩，不只是選旋律，也是選神學。</p><p>3:17 是全卷 321 核心二的本文：「無論做甚麼，或說話或行事，都要奉主耶穌的名，藉著他感謝父神。」（3:17）讓耶穌得著一切的榮耀，不只發生在聚會裡，也發生在洗碗、開會、回訊息的時候。奉主的名做，意思是像他的代表那樣做，做他會認可的事。凡不能奉他的名做的，就不該做；凡能奉他的名做的，再小也是敬拜。而一切的落點是感謝——這正好把讀者帶進下一段，家裡的事。</p>"},{"a":18,"z":19,"star":3,"grk":"<p lang=\"grc\">Αἱ γυναῖκες, ὑποτάσσεσθε τοῖς ἀνδράσιν, ὡς ἀνῆκεν ἐν κυρίῳ.</p><p lang=\"grc\">οἱ ἄνδρες, ἀγαπᾶτε τὰς γυναῖκας καὶ μὴ πικραίνεσθε πρὸς αὐτάς.</p>","lit":"<p>妻子們，要順服丈夫，正如在主裡是合宜的。</p><p>丈夫們，要愛妻子，並且不要對她們苦毒。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Αἱ γυναῖκες</td><td>Hai gynaikes</td><td>作妻子的</td><td>直接對妻子說話：她是能回應主的人</td></tr><tr><td>ὑποτάσσεσθε</td><td>hypotassesthe</td><td>要順服</td><td>多讀作中間語態：自己甘心擺上</td></tr><tr><td>ὡς ἀνῆκεν ἐν κυρίῳ</td><td>hōs anēken en kyriō</td><td>這在主裡面是相宜的</td><td>動機與界線都在「在主裡」</td></tr><tr><td>ἀγαπᾶτε τὰς γυναῖκας</td><td>agapate tas gynaikas</td><td>要愛你們的妻子</td><td>現在命令式：持續地愛</td></tr><tr><td>μὴ πικραίνεσθε πρὸς αὐτάς</td><td>mē pikrainesthe pros autas</td><td>不可苦待她們</td><td>以弗所書沒有的一句</td></tr></table>","gram":"<p><strong>3:18 起是家規，以弗所書講義第 5 章已詳講；歌羅西書的版本更短，卻多了一句以弗所書沒有的話：μὴ πικραίνεσθε πρὸς αὐτάς（mē pikrainesthe pros autas）。</strong></p><p>Αἱ γυναῖκες（Hai gynaikes） 是主格作呼格用，直接對妻子說話。ὑποτάσσεσθε（hypotassesthe） 是現在命令式，形式可作中間語態或被動語態，多數學者讀作中間語態：自己甘願把自己擺在次序裡，不是被人壓服。與弗 5:22 不同，這裡有明寫的動詞；也沒有弗 5:21 彼此順服那一句作框架，但前面 3:12–17 的五件衣服、愛的腰帶、基督的平安，就是它的框架。ὡς ἀνῆκεν ἐν κυρίῳ（hōs anēken en kyriō） 的 ἀνῆκεν（anēken） 是合宜，ἐν κυρίῳ（en kyriō） 同時是動機與界線：在主裡合宜的，才是相宜的；違背主的，不在其內。</p><p>3:19 對丈夫說兩件事：ἀγαπᾶτε（agapate） 是正面的命令，μὴ πικραίνεσθε（mē pikrainesthe） 是反面的禁止。πικραίνεσθε（pikrainesthe） 的字根是苦，可以讀為不要對她們心懷苦毒，也可以讀為不要讓她們的日子變苦；兩個意思相連：心裡苦毒的丈夫，會讓家裡的人過苦日子。弗 4:31 把同字根的 πικρία（pikria） 放在要除掉的罪單第一位。家規的這一句，是那條罪單搬進了家門。</p>","exp":"<p>〔弗〕弗 5:21--33（以弗所書講義第 5 章）</p><p><strong>「你們作妻子的，當順服自己的丈夫，這在主裡面是相宜的。」（3:18）這一節一定要和下一節一起讀：「你們作丈夫的，要愛你們的妻子，不可苦待她們。」（3:19）</strong></p><p>以弗所書講義第 5 章已經詳講妻子的順服、丈夫的愛，與「頭」的兩派讀法，本講義不重講（全卷立場見 ISS00_5，沿用以弗所書立場三）。歌羅西書多出來的，是 3:19 的後半句。以弗所書對丈夫說了很長的要愛，歌羅西書很短，卻加了一個不可：不可苦待她們。</p><p>苦待不只是動手。原文的意思是心懷苦毒、讓對方的日子變苦。一個丈夫可以從不打人，卻天天用話刺人：嫌她做的菜，在孩子面前數落她，在親戚面前拿她開玩笑；也可以一句話都不說，冷戰幾個星期，用沉默懲罰她。這些都是苦待，都在 3:19 的禁止之內。華人家庭裡，言語的苛刻與冷暴力常被當成個性或脾氣，經文說那是罪。</p><p><strong>所以必須清楚說：順服不包括忍受暴力。</strong>無論是身體的暴力、言語的羞辱或冷暴力，妻子都不必因為 3:18 而默默承受。遇到暴力，第一件事是保護自己和孩子的安全，必要時尋求專業協助、報警或庇護；教會的責任是站在受害者旁邊，不是勸她回家更順服一點，也不是叫她為了孩子忍一忍。一個引用 3:18 卻不行 3:19 的丈夫，已經先離開了這段經文。</p><p>回到上文來看：這兩節緊接在 3:12–17 之後。憐憫、恩慈、謙虛、溫柔、忍耐，是穿給誰看的？最先是穿給家裡的人看。一個思念上面的事的人，最該在廚房裡溫柔。在主裡面是相宜的，意思是夫妻二人都在同一位主之下；丈夫不是妻子的主，主才是兩個人的主。</p>"},{"a":20,"z":21,"star":2,"grk":"<p lang=\"grc\">Τὰ τέκνα, ὑπακούετε τοῖς γονεῦσιν κατὰ πάντα, τοῦτο γὰρ εὐάρεστόν ἐστιν ἐν κυρίῳ.</p><p lang=\"grc\">οἱ πατέρες, μὴ ἐρεθίζετε τὰ τέκνα ὑμῶν, ἵνα μὴ ἀθυμῶσιν.</p>","lit":"<p>兒女們，要在凡事上聽從父母，因為這在主裡是蒙悅納的。</p><p>父親們，不要激怒你們的兒女，免得他們心灰意冷。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>ὑπακούετε τοῖς γονεῦσιν</td><td>hypakouete tois goneusin</td><td>要聽從父母</td><td>直接對兒女說話：孩子也是會眾的一員</td></tr><tr><td>κατὰ πάντα</td><td>kata panta</td><td>凡事</td><td>受「在主裡」限定，不包括犯罪</td></tr><tr><td>εὐάρεστόν ἐστιν ἐν κυρίῳ</td><td>euareston estin en kyriō</td><td>是主所喜悅的</td><td>理由不是父母比你大</td></tr><tr><td>μὴ ἐρεθίζετε</td><td>mē erethizete</td><td>不要惹……的氣</td><td>激動、挑釁；弗 6:4 用另一個字</td></tr><tr><td>ἵνα μὴ ἀθυμῶσιν</td><td>hina mē athymōsin</td><td>恐怕他們失了志氣</td><td>新約只此一次：心灰意冷</td></tr></table>","gram":"<p><strong>3:20 的 Τὰ τέκνα（Ta tekna） 直接對兒女說話：孩子也坐在聚會裡聽這封信，被當成能回應主的人。3:21 換了一個字：以弗所書用 παροργίζετε（parorgizete），這裡用 μὴ ἐρεθίζετε（mē erethizete），理由也不同。</strong></p><p>κατὰ πάντα（kata panta） 與 3:22 對僕人說的 κατὰ πάντα（kata panta） 相同；兩處都被 ἐν κυρίῳ（en kyriō） 與敬畏主限定，不包括犯罪。τοῦτο γὰρ εὐάρεστόν ἐστιν ἐν κυρίῳ（touto gar euareston estin en kyriō） 給的理由，不是父母比你大，而是這是主所喜悅的。ἐρεθίζετε（erethizete） 是激動、挑起的意思；林後 9:2 用同一個動詞說熱心激動了許多人，是正面的。這裡是負面：一再挑起孩子心裡的火氣。</p><p>3:21 的目的子句 ἵνα μὴ ἀθυμῶσιν（hina mē athymōsin） 是本段的重心。這個動詞由否定的前綴，加上 3:8 也出現過的 θυμόν（thymon） 一字的字根（心氣、熱情）組成，字面是沒有了心氣：不是生氣，是洩氣。它在新約只出現這一次。以弗所書擔心的是孩子被激怒，歌羅西書擔心的是孩子放棄。</p>","exp":"<p><strong>「你們作父親的，不要惹兒女的氣，恐怕他們失了志氣。」（3:21）以弗所書講義已講過家規的全貌；歌羅西書在這裡多出來的一筆，是失了志氣。</strong></p><p>先看兒女：「你們作兒女的，要凡事聽從父母，因為這是主所喜悅的。」（3:20）保羅直接對孩子說話，表示孩子不是大人的附屬品，是可以自己回應主的人。凡事不是無限的：它在主所喜悅的框架裡。父母若要孩子說謊、偷竊，或做違背良心的事，那不在主所喜悅的範圍內。</p><p>再看父親。一個常被比較、常被罵、從來得不到一句肯定的孩子，最後不是生氣，是放棄。他不再努力，因為努力了也不夠；他不再說心裡話，因為說了會被罵。華人有打是情、罵是愛的說法，也有不要誇獎、免得孩子驕傲的習慣；3:21 正是寫給我們的。管教是需要的，但若管教只有糾正沒有鼓勵，只有標準沒有擁抱，孩子心裡的那團火就會慢慢熄滅。打罵不是愛的證明，往往是失志的開始。</p><p>保羅特別對父親說，因為當時的父親擁有幾乎絕對的家長權；他把限制放在最有權柄的人身上。今天這句話也適用於母親、祖父母和所有帶孩子的人。天父在山上先稱耶穌為愛子，然後才叫門徒聽他（太 17:5）；一個知道自己被愛的孩子，才有志氣去聽從。</p>"},{"a":22,"z":23,"star":2,"grk":"<p lang=\"grc\">οἱ δοῦλοι, ὑπακούετε κατὰ πάντα τοῖς κατὰ σάρκα κυρίοις, μὴ ἐν ὀφθαλμοδουλίαις ὡς ἀνθρωπάρεσκοι, ἀλλʼ ἐν ἁπλότητι καρδίας, φοβούμενοι τὸν κύριον</p><p lang=\"grc\">ὃ ἐὰν ποιῆτε, ἐκ ψυχῆς ἐργάζεσθε, ὡς τῷ κυρίῳ καὶ οὐκ ἀνθρώποις,</p>","lit":"<p>奴僕們，要在凡事上聽從那些按肉身作主人的，不要用眼前的服事，像討人喜歡的人，而要用單純的心，敬畏主。</p><p>你們無論做甚麼，都要從魂裡去做，像是為主而不是為人，</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>οἱ δοῦλοι</td><td>hoi douloi</td><td>作僕人的</td><td>直接對奴隸說話；阿尼西謀可能就在場</td></tr><tr><td>τοῖς κατὰ σάρκα κυρίοις</td><td>tois kata sarka kyriois</td><td>肉身的主人</td><td>只在肉身這個層面作主</td></tr><tr><td>ὀφθαλμοδουλίαις</td><td>ophthalmodouliais</td><td>只在眼前事奉</td><td>眼睛加服事：主人看著才做</td></tr><tr><td>ἐν ἁπλότητι καρδίας</td><td>en haplotēti kardias</td><td>存心誠實</td><td>單一的心，不是兩副面孔</td></tr><tr><td>ἐκ ψυχῆς ἐργάζεσθε</td><td>ek psychēs ergazesthe</td><td>要從心裡做</td><td>從魂裡：全人投入</td></tr><tr><td>ὡς τῷ κυρίῳ καὶ οὐκ ἀνθρώποις</td><td>hōs tō kyriō kai ouk anthrōpois</td><td>像是給主做的，不是給人做的</td><td>職場基督徒的一節</td></tr></table>","gram":"<p><strong>家規四組中，對僕人的話最長：3:22–25 四節，對主人只有 4:1 一節。比例與以弗所書相似，但歌羅西書更長、更細。學者推想，原因可能就在 4:9：阿尼西謀與推基古同行。</strong></p><p>ὀφθαλμοδουλίαις（ophthalmodouliais） 是複合字，眼睛加服事，新約只見於這裡與弗 6:6；在 SBLGNT 是緊跟異文標記、沒有 Strong 編號的字，字形完好。ἀνθρωπάρεσκοι（anthrōpareskoi） 也是複合字：人加討好。兩個字合起來，描繪一種員工：老闆在就做，老闆走就停；做給人看，不做給神看。與之相對的是 ἐν ἁπλότητι καρδίας（en haplotēti kardias），ἁπλότητι（haplotēti） 的意思是單一，不是兩副面孔。φοβούμενοι τὸν κύριον（phoboumenoi ton kyrion） 把主人的眼睛換成主的眼睛；和合本小寫的主人與大寫的主，原文是同一個字，保羅故意讓兩個主人並排。</p><p>3:23 的 ὃ ἐὰν ποιῆτε（ho ean poiēte） 與 3:17 的 πᾶν ὅ τι ἐὰν ποιῆτε（pan ho ti ean poiēte） 呼應：同一個無論做甚麼，一次對全教會說，一次對奴隸說。ἐκ ψυχῆς（ek psychēs） 字面是從魂裡，指全人的投入。ὡς τῷ κυρίῳ καὶ οὐκ ἀνθρώποις（hōs tō kyriō kai ouk anthrōpois） 是保羅給職場最根本的一句話。</p>","exp":"<p><strong>「無論做甚麼，都要從心裡做，像是給主做的，不是給人做的」（3:23）。這是職場基督徒的一節，而它最先是寫給奴隸的。</strong></p><p>以弗所書講義已講過僕人與主人的原則；歌羅西書多出來的，是一個名字。送這封信的隊伍裡有阿尼西謀，一個曾經從主人腓利門家裡逃走的奴隸（門 1:10–16）。他正要回到歌羅西，而腓利門就在這間教會裡。聚會中念到你們作僕人的那一刻，阿尼西謀與腓利門可能都在場。保羅同時另寫了一封短信給腓利門，請他把阿尼西謀接回來，「不再是奴僕，乃是高過奴僕，是親愛的兄弟」（門 1:16）。</p><p>「不要只在眼前事奉，像是討人喜歡的」（3:22），今天的版本很好認：老闆在線上就回訊息，老闆不在就滑手機；報告做給主管看，沒人看的細節就不做。保羅給的解藥不是更嚴的監督，而是換一個觀眾：「總要存心誠實敬畏主」（3:22）。一個知道主在看的人，在沒有人看的時候也一樣。</p><p>從心裡做，也替很多人卸下重擔。工作不再只是為了薪水或升遷，而是為了主；被老闆忽略的努力，主看見了。但這不是叫人忍受一切。為主做工，不包括配合違法、作假，也不包括默默承受霸凌；正因為我們的主在天上，我們才不必向不義的命令低頭（全卷立場見 ISS00_5）。</p><p>福音沒有在一夜之間推翻奴隸制；保羅在這裡，是對當時處境中的人說話。但他把奴隸和主人放在同一位主的面前，又在 3:11 說為奴的、自主的並不分。這顆種子，後來長成了廢奴的運動。</p>"},{"a":24,"z":25,"star":1,"grk":"<p lang=\"grc\">εἰδότες ὅτι ἀπὸ κυρίου ἀπολήμψεσθε τὴν ἀνταπόδοσιν τῆς κληρονομίας· τῷ κυρίῳ Χριστῷ δουλεύετε·</p><p lang=\"grc\">ὁ γὰρ ἀδικῶν κομίσεται ὃ ἠδίκησεν, καὶ οὐκ ἔστιν προσωπολημψία.</p>","lit":"<p>因為知道你們要從主那裡領受產業的報償；你們是在服事主基督。</p><p>因為那行不義的，必領回他所行的不義，並且沒有看人臉面這回事。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>εἰδότες ὅτι</td><td>eidotes hoti</td><td>因你們知道</td><td>動機在將來</td></tr><tr><td>τὴν ἀνταπόδοσιν τῆς κληρονομίας</td><td>tēn antapodosin tēs klēronomias</td><td>基業為賞賜</td><td>奴隸在法律上不能承受產業</td></tr><tr><td>τῷ κυρίῳ Χριστῷ δουλεύετε</td><td>tō kyriō Christō douleuete</td><td>你們所事奉的乃是主基督</td><td>可讀作直說，也可讀作命令</td></tr><tr><td>ὁ γὰρ ἀδικῶν</td><td>ho gar adikōn</td><td>那行不義的</td><td>對奴隸，也對主人</td></tr><tr><td>οὐκ ἔστιν προσωπολημψία</td><td>ouk estin prosōpolēmpsia</td><td>並不偏待人</td><td>「主」是和合本補的小字</td></tr></table>","gram":"<p><strong>3:24 的 τὴν ἀνταπόδοσιν τῆς κληρονομίας（tēn antapodosin tēs klēronomias） 是一個驚人的組合：在羅馬法律下，奴隸不能承受產業；保羅卻說，你們要從主那裡得著基業作為報償。</strong></p><p>ἀπολήμψεσθε（apolēmpsesthe） 是將來式；它與 3:25 的 κομίσεται（komisetai）、προσωπολημψία（prosōpolēmpsia） 一樣，在 SBLGNT 是緊跟異文標記、沒有 Strong 編號的字，字形完好。τῷ κυρίῳ Χριστῷ δουλεύετε（tō kyriō Christō douleuete） 的 δουλεύετε（douleuete） 可以讀成直說語氣，即和合本「你們所事奉的乃是主基督」；也可以讀成命令語氣，你們要事奉主基督。字形相同，直說較合上下文：它是 3:23 的理由。</p><p>3:25 的 ὁ γὰρ ἀδικῶν κομίσεται ὃ ἠδίκησεν（ho gar adikōn komisetai ho ēdikēsen） 用 γάρ（gar） 收結，ἀδικῶν（adikōn） 與 ἠδίκησεν（ēdikēsen） 同一個字根，有一報還一報的味道。最後 οὐκ ἔστιν προσωπολημψία（ouk estin prosōpolēmpsia） 字面是沒有看臉這回事；和合本加小字「主」，作主並不偏待人。弗 6:9 把這句話放在對主人說的話裡；歌羅西書放在僕人段的結尾，緊接著 4:1 對主人說話——它同時朝向兩邊。</p>","exp":"<p><strong>「因你們知道從主那裡必得著基業為賞賜；你們所事奉的乃是主基督。」（3:24）一個在地上沒有產業的奴隸，在主那裡有基業。</strong></p><p>這句話對第一世紀的奴隸是天大的消息。法律說他是別人的財產，不能繼承任何東西；福音說，他是神的兒女，有一份天上的基業。他今天怎樣被對待，不是他最終的身分。這也回到 3:1–4：生命藏在神裡面的人，有一個將來顯現的日子；在那一天之前，他可以忠心，不必苦毒。</p><p>「那行不義的必受不義的報應；主並不偏待人。」（3:25）這一節同時對兩邊說話。對奴隸說：不要以為受了委屈，就可以偷懶、欺騙，那也是不義。對主人說：不要以為身分高，神就會看你的面子。神不看臉。下一節保羅就轉向主人：「你們也有一位主在天上」（4:1）。家規的最後一句，把所有人——妻子、丈夫、兒女、父親、僕人、主人——都放在同一位主的面前。</p>"}],"4":[{"a":1,"z":1,"star":2,"grk":"<p lang=\"grc\">οἱ κύριοι, τὸ δίκαιον καὶ τὴν ἰσότητα τοῖς δούλοις παρέχεσθε, εἰδότες ὅτι καὶ ὑμεῖς ἔχετε κύριον ἐν οὐρανῷ</p>","lit":"<p>主人們，你們要把公道和對等供給奴僕們，因為知道你們也有一位主在天上。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>οἱ κύριοι</td><td>hoi kyrioi</td><td>主人們</td><td>家規最後一組稱呼；3:22 起同一個字指地上的主人</td></tr><tr><td>τὸ δίκαιον</td><td>to dikaion</td><td>公道</td><td>按是非該給的</td></tr><tr><td>τὴν ἰσότητα</td><td>tēn isotēta</td><td>對等、均平</td><td>林後 8:13–14 的「均平」同一個字</td></tr><tr><td>παρέχεσθε</td><td>parechesthe</td><td>你們要供給</td><td>現在命令式、中間語態：從自己手裡拿出來</td></tr><tr><td>εἰδότες ὅτι</td><td>eidotes hoti</td><td>因為知道</td><td>與 3:24 對僕人說的完全同形</td></tr><tr><td>κύριον ἐν οὐρανῷ</td><td>kyrion en ouranō</td><td>在天上的主</td><td>κύριος 追蹤在這裡翻轉</td></tr></table>","gram":"<p><strong>4:1 是 3:18 起那段家規的最後一句。章的分界是中世紀才加上的；保羅寫信時，這一句緊接在 3:25 後面，中間沒有停頓。</strong></p><p>οἱ κύριοι（hoi kyrioi） 是主格當呼格用，和 3:18–22 每一組的開頭同一個格式。τὸ δίκαιον καὶ τὴν ἰσότητα（to dikaion kai tēn isotēta） 是兩個帶冠詞的受詞：τὸ δίκαιον（to dikaion） 是中性形容詞作名詞，「合乎公義的」；ἰσότης（isotēs） 在新約只出現三次，另外兩次在林後 8:13–14，和合本譯「均平」。學者對這裡的 ἰσότης（isotēs） 有兩種讀法：一派讀成「公平」，與前一個字同義重複，加重語氣；一派讀成「對等」，要主人把奴僕當作與自己同等的人看待——在當時的社會，這幾乎是聽不見的字眼。本講義判斷：兩個字並列，前者講該給的，後者講怎樣看人；和合本「公公平平」用疊字把兩層都收進去了。παρέχεσθε（parechesthe） 是現在命令式中間語態，「從自己這裡拿出來、提供」。</p><p>εἰδότες ὅτι καὶ ὑμεῖς ἔχετε κύριον ἐν οὐρανῷ（eidotes hoti kai hymeis echete kyrion en ouranō）：分詞 εἰδότες（eidotes） 與 3:24 對奴僕說的 εἰδότες ὅτι（eidotes hoti） 完全同形——奴僕知道，主人也知道，兩邊知道的是同一位主。καὶ ὑμεῖς（kai hymeis） 是「你們也」：主人自己也是一個有主人的人。κύριος（kyrios） 在 3:18–4:1 出現九次，地上的主人與天上的主交錯出現，到這裡翻轉：被稱為 κύριοι（kyrioi） 的人，頭上還有一位 κύριον（kyrion）。</p>","exp":"<p>〔弗〕弗 6:9（以弗所書講義第 6 章）</p><p><strong>「你們作主人的，要公公平平地待僕人，因為知道你們也有一位主在天上。」（4:1）家規到這裡才講完。讀 4:1，要把 3:18–25 一起讀進來。</strong></p><p>回頭看 3:18–25：妻子與丈夫、兒女與父親、僕人與主人，每一組都是兩邊各有一句。丈夫那一句說「要愛你們的妻子，不可苦待她們」（3:19），父親那一句說「恐怕他們失了志氣」（3:21）。最長的是僕人那一段，足足四節；主人只有一節。可是這一節收在最重的地方：3:25 剛說「主並不偏待人」（3:25），4:1 就對主人說，你們也有一位主。不偏待人的那一位，不只看著偷懶的奴僕，也看著苛刻的主人。</p><p>以弗所書講義第 6 章已經詳講主人的那一句，本卷多出來的一筆，是「公公平平」的第二個字：對等。在一個人可以被買賣的世界，保羅要主人把該給的給出來，也要他用對等的眼光看那個人。這封信送到歌羅西時，腓利門就坐在家中的聚會裡，阿尼西謀站在送信的人旁邊（4:9）。這一句不是寫給抽象的「主人」，是寫給一個當天就要面對自己逃跑奴僕的主人。</p><p>今天的主人是老闆、主管、店長，是家裡請了幫傭的人。「公道」是工資、工時、加班費、保險，按時、按約、按法給足；「對等」是記得這個人和我站在同一位主面前，一樣被看見。反過來，3:22–25 叫員工「從心裡做」，但職場的順從不包括配合違法、忍受霸凌、替公司作假——那位在天上的主，同時看著兩邊。</p><p>家規收在這裡，保羅下一句立刻轉向禱告與外人（4:2–6）：家，是向外的第一扇門。一個讓員工被公平對待的老闆，已經在替福音開門了。</p>"},{"a":2,"z":4,"star":3,"grk":"<p lang=\"grc\">Τῇ προσευχῇ προσκαρτερεῖτε, γρηγοροῦντες ἐν αὐτῇ ἐν εὐχαριστίᾳ,</p><p lang=\"grc\">προσευχόμενοι ἅμα καὶ περὶ ἡμῶν, ἵνα ὁ θεὸς ἀνοίξῃ ἡμῖν θύραν τοῦ λόγου, λαλῆσαι τὸ μυστήριον τοῦ Χριστοῦ, διʼ ὃ καὶ δέδεμαι,</p><p lang=\"grc\">ἵνα φανερώσω αὐτὸ ὡς δεῖ με λαλῆσαι.</p>","lit":"<p>在禱告上你們要恆切持守，在其中帶著感謝警醒，</p><p>同時也為我們禱告，好叫神為我們開一扇話語的門，去講說基督的奧祕，為了這奧祕我也已經被捆綁，</p><p>好叫我把它顯明出來，照著我必須說的那樣。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Τῇ προσευχῇ προσκαρτερεῖτε</td><td>Tē proseuchē proskartereite</td><td>在禱告上要恆切</td><td>與格放在句首：先說禱告</td></tr><tr><td>γρηγοροῦντες</td><td>grēgorountes</td><td>警醒</td><td>客西馬尼的字（可 14:38）</td></tr><tr><td>ἐν εὐχαριστίᾳ</td><td>en eucharistia</td><td>在感謝中</td><td>全卷第六次感謝</td></tr><tr><td>ἀνοίξῃ ἡμῖν θύραν τοῦ λόγου</td><td>anoixē hēmin thyran tou logou</td><td>給我們開話語的門</td><td>主詞是 ὁ θεὸς：門由神開</td></tr><tr><td>δέδεμαι</td><td>dedemai</td><td>我已被捆綁</td><td>完成式被動：鎖鍊還在手上</td></tr><tr><td>φανερώσω</td><td>phanerōsō</td><td>我要顯明</td><td>1:26 奧祕「顯明了」同一個動詞</td></tr></table>","gram":"<p><strong>4:2 開始新的一段，沒有連接詞，像換了一口氣。Τῇ προσευχῇ（Tē proseuchē） 放在句首，與格帶著強調：在禱告這件事上。</strong></p><p>προσκαρτερεῖτε（proskartereite） 是現在命令式，字根有「堅持、黏住不放」的意思；路加描寫初期教會用的就是這個字：「都同心合意地恆切禱告」（徒 1:14）。分詞 γρηγοροῦντες（grēgorountes） 說明怎樣恆切：醒著。這是主在客西馬尼對門徒說的字：「總要警醒禱告，免得入了迷惑」（可 14:38）。ἐν αὐτῇ（en autē） 指回禱告，ἐν εὐχαριστίᾳ（en eucharistia） 是警醒的氣氛——全卷四章每章都有感謝（1:3、12；2:7；3:15、17），4:2 是第六處，也是最後一處。</p><p>4:3 的 προσευχόμενοι ἅμα καὶ περὶ ἡμῶν（proseuchomenoi hama kai peri hēmōn）：ἅμα（hama） 是「同時」，為自己的事禱告的同時，也把使徒放進去。ἵνα（hina） 帶出禱告的內容：ὁ θεὸς ἀνοίξῃ ἡμῖν θύραν τοῦ λόγου（ho theos anoixē hēmin thyran tou logou），主詞是神，動詞是不定過去式假設語氣；θύραν τοῦ λόγου（thyran tou logou） 是「為話語的門」，所有格說明門的用途，不是監獄的門。λαλῆσαι τὸ μυστήριον τοῦ Χριστοῦ（lalēsai to mystērion tou Christou） 接上追蹤四：1:26 隱藏的奧祕、1:27 基督在你們心裡，到這裡成了一個人要開口說的內容。διʼ ὃ καὶ δέδεμαι（di' ho kai dedemai） 是插入的關係子句，完成式被動：「我已經被捆綁，現在仍然是」。</p><p>4:4 ἵνα φανερώσω αὐτὸ ὡς δεῖ με λαλῆσαι（hina phanerōsō auto hōs dei me lalēsai） 是第二個 ἵνα（hina） 子句。φανερώσω（phanerōsō） 與 1:26 的 ἐφανερώθη（ephanerōthē） 同一個動詞；δεῖ（dei） 是「必須」，4:6 還會再用一次。以弗所書的平行經文求的是 ἐν παρρησίᾳ（en parrēsia），放膽（弗 6:19）；歌羅西書求的是 φανερώσω（phanerōsō），講明白。</p>","exp":"<p>〔弗〕弗 6:18--20（以弗所書講義第 6 章）</p><p><strong>「你們要恆切禱告，在此警醒感恩。」（4:2）家規講完了，保羅沒有接著教方法，先講禱告。</strong></p><p>恆切，是黏住不放。重點不在禱告要多長，在不肯放手。警醒，是醒著禱告：門徒在客西馬尼睡著了，不是因為不愛主，是因為累。保羅知道人會累，所以他把感恩放進警醒裡。一個邊禱告邊數算恩典的人，比較不容易睡著，也比較不容易把禱告變成一張抱怨清單。全卷每一章都有感謝，最後一次感謝落在禱告裡——這正是 321「凡事謝恩，把榮耀歸給耶穌」的地方。</p><p>接著保羅說：「也要為我們禱告，求神給我們開傳道的門。」（4:3）他寫這句時手上有鍊子。照常理，他該求監獄的門打開；他求的卻是話語的門。對他來說，鎖鍊不是福音的終點，反而可能是入口——使徒行傳最後一幕，他在羅馬被兵看守，「凡來見他的人，他全都接待」（徒 28:30）。</p><p>門是誰開的？原文的主詞是神。這一句替所有傳福音的人卸下一個重擔：我們不必把門撞開，也不必用話術撬開。我們禱告，神開門；門開了，我們進去。紅線八在這裡：傳福音不是業績，不是「這個月每人要帶三個人決志」。保羅這位最會傳福音的人，第一個動作是請人為他禱告。</p><p>「叫我按著所該說的話將這奧祕發明出來。」（4:4）以弗所書在同一處求的是放膽，歌羅西書多出來的一筆是講明白。一間被「加一點」的哲學包圍的教會，需要的不只是大聲，是清楚。奧祕不是一套秘密知識，是基督自己；把他講明白，比把話講漂亮重要。</p>"},{"a":5,"z":6,"star":3,"grk":"<p lang=\"grc\">Ἐν σοφίᾳ περιπατεῖτε πρὸς τοὺς ἔξω, τὸν καιρὸν ἐξαγοραζόμενοι.</p><p lang=\"grc\">ὁ λόγος ὑμῶν πάντοτε ἐν χάριτι, ἅλατι ἠρτυμένος, εἰδέναι πῶς δεῖ ὑμᾶς ἑνὶ ἑκάστῳ ἀποκρίνεσθαι.</p>","lit":"<p>你們要在智慧中向著外面的人行走，把時機買回來。</p><p>你們的話語常常在恩典中，用鹽調味過的，好知道你們必須怎樣回答每一個人。</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Ἐν σοφίᾳ περιπατεῖτε</td><td>En sophia peripateite</td><td>要在智慧中行走</td><td>追蹤三：智慧走出教會</td></tr><tr><td>πρὸς τοὺς ἔξω</td><td>pros tous exō</td><td>向著外面的人</td><td>教會以外的鄰舍</td></tr><tr><td>τὸν καιρὸν ἐξαγοραζόμενοι</td><td>ton kairon exagorazomenoi</td><td>把時機買回來</td><td>καιρός 是時機，不是時鐘</td></tr><tr><td>ἐν χάριτι</td><td>en chariti</td><td>在恩典中</td><td>和合本譯「和氣」；4:18 同一個字</td></tr><tr><td>ἅλατι ἠρτυμένος</td><td>halati ērtymenos</td><td>用鹽調味過的</td><td>完成式被動分詞；「好像」是和合本補的</td></tr><tr><td>ἑνὶ ἑκάστῳ ἀποκρίνεσθαι</td><td>heni hekastō apokrinesthai</td><td>回答每一個人</td><td>一個一個地；先有人問，才有回答</td></tr></table>","gram":"<p><strong>4:5 和 4:6 是一對：前一節講行，後一節講說；前一節對著「外人」，後一節對著「各人」。</strong></p><p>Ἐν σοφίᾳ περιπατεῖτε（En sophia peripateite）：περιπατέω（peripateō） 是 2:6「就當遵他而行」的行，σοφία（sophia） 是追蹤三的智慧——1:9 求的智慧、2:3 藏在基督裡的智慧，到這裡走出教會的門，πρὸς τοὺς ἔξω（pros tous exō），向著外面的人（帖前 4:12 同一個說法）。τὸν καιρὸν ἐξαγοραζόμενοι（ton kairon exagorazomenoi） 是現在分詞中間語態：ἐξαγοράζω（exagorazō） 在加 3:13、4:5 指基督把人「贖出來」，這裡是把 καιρός（kairos） 買下來。καιρός（kairos） 不是 χρόνος（chronos）：不是鐘錶上的時間，是合宜的時刻。弗 5:16 用同一個片語，理由是現今的世代邪惡；歌羅西書把它放進與外人的交往裡。</p><p>4:6 ὁ λόγος ὑμῶν πάντοτε ἐν χάριτι（ho logos hymōn pantote en chariti） 沒有動詞，要補 ἔστω（estō），「要是」。ἐν χάριτι（en chariti） 和合本譯「帶著和氣」，字面是「在恩典中」；希臘文的 χάρις（charis） 也有「有風度、討人喜歡」的意思，兩層都在。ἅλατι ἠρτυμένος（halati ērtymenos） 是完成式被動分詞，「已經用鹽調好味的」；和合本的「好像」是小字補的，「調」讀 tiáo，調味的調。學者觀察到，希臘修辭家用「鹽」形容機智、有味道的談吐；猶太傳統的鹽則是保存與盟約（這使我們想起利 2:13）。εἰδέναι（eidenai） 是表結果的不定詞；δεῖ（dei） 回應 4:4：保羅「該怎樣說」，你們「該怎樣回答」。ἑνὶ ἑκάστῳ（heni hekastō） 是「一個、一個」，ἀποκρίνεσθαι（apokrinesthai） 是回答——對方先開口。</p>","exp":"<p><strong>「你們要愛惜光陰，用智慧與外人交往。」（4:5）全卷最後一個意象「鹽」，從這兩節出來。</strong></p><p>「愛惜光陰」原文是把時機買回來。不是把每一分鐘排滿，是看見那一個時刻：同事在茶水間嘆了一口氣，鄰居的孩子住院，老朋友忽然問你最近在忙甚麼。這種時刻不常來，來了也不等人。買回來，是付一點代價把它留下：多坐十分鐘，改一個行程，放下手機。這不是效率主義；一個被行事曆塞滿的人，反而買不到任何時機。</p><p>「用智慧」也不是話術。全卷的智慧都藏在基督裡（2:3），所以向外人的智慧，是帶著基督的心意去看人：他現在聽得進甚麼？他真正在問的是甚麼？</p><p>「你們的言語要常常帶著和氣，好像用鹽調和，就可知道該怎樣回答各人。」（4:6）和氣原文是恩典。先有恩典，才有鹽。鹽不是辣椒：辣是刺激人、壓倒人；鹽是讓食物出味、讓它不壞。鹽放多了，整鍋都不能吃。有鹽的話不尖酸，也不乏味；它讓人想再聽一點，也讓真理不腐壞。主耶穌說：「你們裡頭應當有鹽，彼此和睦。」（可 9:50）鹽與和睦，放在同一句。</p><p>「回答各人」有兩層。一是對方先問，我們才回答；彼得也說：「有人問你們心中盼望的緣由，就要常作準備，以溫柔、敬畏的心回答各人」（彼前 3:15）。二是各人不一樣：對失業的人、對剛失去親人的人、對敲你家門的耶和華見證人，回答都不同。沒有一套背好的稿子可以套在所有人身上。紅線八就在這裡：不施壓，不抓住人逼他當場禱告；尊重每一個人，本身就是福音的味道。今天的網路留言區也是一張餐桌——在那裡，鹽也比辣椒有用。</p>"},{"a":7,"z":8,"star":1,"grk":"<p lang=\"grc\">Τὰ κατʼ ἐμὲ πάντα γνωρίσει ὑμῖν Τυχικὸς ὁ ἀγαπητὸς ἀδελφὸς καὶ πιστὸς διάκονος καὶ σύνδουλος ἐν κυρίῳ,</p><p lang=\"grc\">ὃν ἔπεμψα πρὸς ὑμᾶς εἰς αὐτὸ τοῦτο ἵνα γνῶτε τὰ περὶ ἡμῶν καὶ παρακαλέσῃ τὰς καρδίας ὑμῶν,</p>","lit":"<p>關於我的一切事，推基古要讓你們知道；他是那親愛的弟兄、忠心的執事，也是在主裡一同作奴僕的；</p><p>我差他到你們那裡去，正是為了這件事，好叫你們知道關於我們的事，又叫他鼓勵你們的心；</p>","key":"<table><tr><th>原文</th><th>音譯</th><th>字面</th><th>在這裡</th></tr><tr><td>Τὰ κατʼ ἐμὲ πάντα</td><td>Ta kat' eme panta</td><td>關於我的一切事</td><td>保羅的近況交給人親口說</td></tr><tr><td>ὁ ἀγαπητὸς ἀδελφὸς</td><td>ho agapētos adelphos
