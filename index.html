是保羅的同工，都曾在保羅坐監時陪伴他（腓 2:25；門 23）。若是同一人，這位同工就同時服事了腓立比與歌羅西兩間教會。</p><p><strong>難處：</strong>名字縮寫在當時很常見，不能證明是同一人；腓立比書的以巴弗提是腓立比教會差來的，歌羅西書的以巴弗是「你們那裡的人」，兩人的家鄉相隔很遠。多數學者認為是兩個人。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採以巴弗建立說，並認為以巴弗與以巴弗提是兩個人。</strong>以巴弗在以弗所聽了福音，回到歌羅西建立教會，現在到羅馬向保羅報告，並與保羅一同坐監（門 23）。1:7 照和合本讀「為我們」：保羅去不了的地方，同工替他去了。</p><p>這使整封信有一個溫柔的語氣：保羅稱建立者為「一同作僕人的」，先說他帶來的好消息（1:8），再處理錯謬。書信的處境見全卷立場 ISS00_1，作者與寫作地點見 ISS00_6。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。不論保羅有沒有路過歌羅西，教會的根基都是同一個福音：「從前在福音真理的道上所聽見的」（1:5）。爭的是歷史細節，不是信仰本身。</p><p>對你今天更重要的，是以巴弗這個人：一個在大城市被教的人，回到沒落的小城，教別人。福音就是這樣從一個人長到另一個人那裡去的。</p>"]],"con":[],"say":"本講義的立場：歌羅西教會是以巴弗在以弗所受教之後，回到家鄉建立的；保羅沒有去過，以巴弗是「為我們」去的同工。書信的處境見全卷立場 ISS00_1，作者與寫作地點見 ISS00_6。","care":"會眾席上可能有在小鎮、小教會默默服事多年、覺得自己不如大教會牧者的同工，也可能有被人說「你又不是神學院畢業的」而不敢帶小組的弟兄姊妹。不要把以巴弗講成「次要的人物」，也不要只稱讚有名的使徒。讓他們看見：保羅稱以巴弗為「一同作僕人的」，把他放在和自己同一個身分上；會後可以具體地為一位這樣的同工感謝神，讓他知道他的服事被看見。"},{"id":"ISS01_2","t":"1:9「滿心知道神的旨意」——神的旨意可以「知道」嗎？怎樣分辨？","r":"1:9--10；3:15--16；羅 12:2","ch":[1],"why":"「怎樣知道神的旨意」是信徒最常問的問題之一：該讀哪一科、該不該接這份工作、要不要嫁給他。有人等異象，有人抽經文，有人聽某位屬靈長輩一句話就決定人生；也有人因為怕「錯過神的旨意」而焦慮多年。1:9 是保羅的禱告，它告訴我們神的旨意可以知道，也告訴我們用甚麼方式知道。","pos":[["【一】經文問的是甚麼","","<p>保羅禱告：「願你們在一切屬靈的智慧悟性上，滿心知道神的旨意」（1:9）；目的是「好叫你們行事為人對得起主，凡事蒙他喜悅」（1:10）。「滿心知道」原文 ἵνα πληρωθῆτε τὴν ἐπίγνωσιν（hina plērōthēte tēn epignōsin），是被動的「被充滿認識」。問題是：這裡的「旨意」是神的道德心意，還是神為每個人預定的具體藍圖？要怎樣才「知道」？</p>"],["個別藍圖說","","<p>許多傳統的教導認為：神對每一個人的婚姻、職業、住處都有一個具體的、唯一的計畫，信徒要透過禱告、聖經、內心的感動與環境的印證去「找到」它；找到了就蒙福，錯過了就只能活在「次好」裡。這一說強調神關心生活的每一個細節。</p><p><strong>難處：</strong>聖經很少給人這樣的具體指示；這一說常使人陷入焦慮與癱瘓，也容易讓人把決定權交給某一位「看得見」的屬靈人，或把一次錯誤的決定看成一生的失敗。</p>"],["道德旨意與智慧抉擇說","","<p>另一些學者認為：聖經說的「神的旨意」主要是神已經啟示的道德心意——聖潔、愛人、感謝；在這個範圍裡，信徒有自由用智慧作抉擇，神要的是我們「行事為人對得起主」，而不是猜中一個隱藏的答案。1:9 的「智慧悟性」正是作抉擇的工具。</p><p><strong>難處：</strong>這一說可能低估了神在個人生命中具體的引導；聖經裡也確實有神具體帶領的例子（徒 16:6–10），信徒的經驗中也常常有清楚被引導的時刻。</p>"],["靈恩印證說","","<p>靈恩傳統強調聖靈今天仍然藉著內在的平安、預言、異夢、別人的話語具體地引導信徒；1:9 的「屬靈的」（πνευματικῇ）智慧，就是聖靈所賜的智慧與感動。</p><p><strong>難處：</strong>主觀的感動容易和自己的願望、別人的操控混在一起；若沒有聖經與群體的察驗，「神告訴我」可能變成一句不能被質疑的話，也可能被有心人用來替別人決定婚姻與人生。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的判斷：神的旨意可以知道，而且是在「一切屬靈的智慧悟性上」被充滿而知道的。</strong>旨意的大方向已經寫在經上；具體的抉擇，在禱告、讀經、屬靈同伴的印證與智慧裡慢慢清楚；神也可以具體地引導，但任何感動都要經過聖經與群體的察驗。</p><p>1:10 說知道旨意的目的是「行事為人對得起主」——比起找到唯一正確的答案，神更在意你在選擇裡怎樣走路。不用「先知性的話」替人決定婚姻、工作、搬遷（回指以弗所書立場五）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各派都同意：神願意引導他的兒女，聖經是最終的準則，順服與智慧並不衝突。爭的是神引導的方式與細節。</p><p>你不必因為怕選錯而不敢選。在凡事上居首位的那一位，比你更在乎你走在他裡面；就算走過彎路，他也是「萬有靠他而立」的主，能把你的路維繫在一起。</p>"]],"con":[],"say":"本講義的立場：神的旨意可以知道，是在「一切屬靈的智慧悟性上」被充滿而知道的；大方向寫在經上，具體抉擇在禱告、聖經、同伴印證與智慧中慢慢清楚，任何感動都要經過察驗。不用「先知性的話」替人決定人生（回指以弗所書立場五）。爭議與信心的全卷立場見 ISS00_9。","care":"會眾席上可能有因為怕「錯過神的旨意」而多年不敢作決定的人，也可能有因為一句「神告訴我你們要結婚」而走進痛苦婚姻、至今自責的人。不要對前者說「你禱告不夠」，也不要對後者說「那是你自己沒聽清楚」。陪他們讀 1:9–10，讓他們知道神看重的是同行，不是猜謎；若有人曾在屬靈的名義下被操控，先聽他說完，肯定他離開的勇氣，必要時協助他尋求安全的管道與專業協助。"},{"id":"ISS01_3","t":"1:13「把我們遷到他愛子的國裡」——神的國是現在還是將來？","r":"1:12--14；3:4；路 17:21","ch":[1],"why":"1:13 用不定過去式說神「已經」把我們遷到他愛子的國裡，3:4 卻說基督「顯現的時候」我們才與他一同顯現在榮耀裡。神的國是已經來了，還是要等將來？這一題關係到信徒怎樣看今天的苦難、怎樣看教會在世上的角色，也常被成功神學與避世心態兩頭拉扯。","pos":[["【一】經文問的是甚麼","","<p>「他救了我們脫離黑暗的權勢，把我們遷到他愛子的國裡」（1:13）。兩個動詞 ἐρρύσατο（errysato）、μετέστησεν（metestēsen）都是不定過去式，說的是已經發生的事。可是同一封信也說：「基督是我們的生命，他顯現的時候，你們也要與他一同顯現在榮耀裡」（3:4）。問題是：我們現在就在國裡了嗎？國度的完成在甚麼時候？</p>"],["已然未然說","","<p>多數福音派學者認為：神的國在基督的第一次來臨已經開始，信徒現在就被遷入、在愛子的權柄下生活；但國度的完全顯現要等基督再來。1:13 是「已然」，3:4 是「未然」；兩者之間，教會在世上活出國度的樣式，也同時等候、忍耐。</p><p><strong>難處：</strong>「已然」和「未然」的比重很難拿捏：講得太重「已然」，容易變成凡事順利的應許；講得太重「未然」，又容易讓人以為今天的生活與國度無關。</p>"],["實現的末世論","","<p>二十世紀有學者主張：耶穌所說的國度已經在他的事工中完全實現了，「神的國就在你們心裡」（路 17:21）；1:13 的過去式說明國度是此刻的屬靈實際，不必再等候一個將來的、外在的國度。</p><p><strong>難處：</strong>這一說無法解釋新約大量對將來的盼望——3:4 的「顯現」、1:5「存在天上的盼望」、1:27「榮耀的盼望」；若國度已經完全實現，信徒今天的苦難與世界的不義就沒有一個將來的答案。</p>"],["將來國度說","","<p>另有一些傳統（包括部分時代論的讀法）強調：神的國主要是將來的、可見的國度，要在基督再來時建立；今天的教會時代是另一個階段，1:13 是說我們的身分與歸屬已經轉移，國度本身仍在將來。</p><p><strong>難處：</strong>1:13 的動詞清楚是「已經遷入」，而且是「他愛子的國」，不只是一個將來的身分；若把國度全部推到將來，信徒容易覺得今天的工作、家庭、社會與國度無關。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採已然未然說。</strong>1:13 說我們已經被遷入愛子的國，換了國籍；1:14 說我們此刻「有」救贖與赦免；3:4 說完全的顯現在將來。本講義不套用任何預設的末世時間表，不算日子（鐵律四）。</p><p>對今天的落點是：住在新國的人，照新王的心意生活；可是新國的子民仍會受苦——寫這句話的保羅，正坐在羅馬的監裡。已經遷入，不等於已經沒有眼淚。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各派都同意：基督是王，信徒屬於他，國度最終必定完全顯明。爭的是現在與將來的比重與次序。</p><p>你今天可以確定的是：你不是站在國界外面等候批准的人。父已經把你遷進來了，你在愛子裡已經得蒙救贖、罪過得以赦免。</p>"]],"con":[],"say":"本講義的立場：神的國已然、未然——1:13 說我們已經被遷到愛子的國裡，3:4 說完全的顯現在將來；不套用末世時間表，不算日子。已經遷入，不等於已經沒有苦難。爭議與信心的全卷立場見 ISS00_9。","care":"會眾席上可能有正在重病、失業、婚姻破裂的人，聽到「你已經在神的國裡」會問：那為甚麼我還這麼苦？不要用「國度已經來了，你應該得勝」去壓他，也不要說「等到天上就好了」把他今天的痛苦打發掉。陪他讀 1:11「凡事歡歡喜喜地忍耐寬容」——神榮耀的權能，正是用在忍耐上的；必要時具體地陪他走一段，而不只是給他一句教義。"},{"id":"ISS01_4","t":"1:15「首生的」——基督是第一個被造的嗎？","r":"1:15--17；1:18；詩 89:27","ch":[1],"why":"「是首生的，在一切被造的以先」是基督論史上最重要的爭議經文之一。第四世紀的亞流、今天的耶和華見證人都用它說基督是第一個被造的；尼西亞信經以來的正統教會則用它說基督是創造者。這一條不是次要爭議，它決定我們敬拜的是誰；而且它常常就在我們家門口被討論。","pos":[["【一】經文問的是甚麼","","<p>「愛子是那不能看見之神的像，是首生的，在一切被造的以先」（1:15）。原文 πρωτότοκος πάσης κτίσεως（prōtotokos pasēs ktiseōs），直譯「一切受造之物的首生者」。問題是：「首生」是指他是第一個被生、被造的，還是指他的地位？πάσης κτίσεως（pasēs ktiseōs）是說他屬於受造物的一份子，還是說他在一切受造之上？</p>"],["受造說","","<p>亞流與今日的耶和華見證人：「首生」就是第一個生的，πάσης κτίσεως（pasēs ktiseōs）是部分屬格——基督是受造物中的第一個、最高的一個，神藉著他再造其餘萬物。《新世界譯本》因此在 1:16–17 加入「其他」二字，讀成「萬有其他一切都是靠他造的」。</p><p><strong>難處：</strong>原文沒有「其他」這個字；1:16 開頭的 ὅτι（hoti）說首生的理由是「萬有都是靠他造的」——連「有位的、主治的」都在他所造之列，他就不在被造的那一邊；1:19 與 2:9 又說神一切的豐盛都住在他裡面。</p>"],["地位與承受權說","","<p>尼西亞信經以來的正統教會與絕大多數註釋：舊約的「首生」常指長子的名分，不是出生的次序——大衛是耶西的第八個兒子，神卻說「我也要立他為長子，為世上最高的君王」（詩 89:27）；以法蓮是約瑟的次子，神卻說「以法蓮是我的長子」（耶 31:9）。πάσης κτίσεως（pasēs ktiseōs）是比較或從屬屬格：他在一切受造之上，承受一切受造。</p><p><strong>難處：</strong>這一讀需要讀者熟悉舊約「首生」的用法；單看中文或英文的字面，「首生」很容易被聽成第一個生的。</p>"],["時間在先說","","<p>和合本譯作「在一切被造的以先」，把 πρωτότοκος（prōtotokos）的時間意義與 1:17「他在萬有之先」連讀：基督在萬有存在以前就已經在了。這是一個合理的翻譯，也與約 1:1「太初有道」的信仰一致。</p><p><strong>難處：</strong>只講「在先」，若沒有讀到 1:16 的「因為」，仍然可能被理解成「他是比較早被造的」；時間上的先後本身不足以區分創造者與最早的受造者。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義站在尼西亞信經與歷代正統教會的立場：基督是真神也是真人；1:15 的「首生」是地位與承受權，並以和合本的時間讀法為合理譯法。</strong></p><p>決定性的是兩處經文：1:16 開頭的 ὅτι（hoti）——首生的理由正是他是創造者；1:18 第二次 πρωτότοκος ἐκ τῶν νεκρῶν（prōtotokos ek tōn nekrōn）——拉撒路比他先從墳墓出來，他仍是首生，可見首生是地位，不是次序。講台的落點：首生不是第一個被造的，是一切被造的都歸他承受。本講義的全卷立場見 ISS00_2。</p>"],["【四】這件事該不該影響你的信心","","<p>這一條影響。基督是不是神，是基督教信仰的核心，不是次要的爭議。</p><p>但影響的方式是敬拜，不是辯論：1:15–20 原是一首詩，保羅先唱給我們聽，才講道理。你看見基督，就看見了那不能看見的神；你擁有基督，就擁有了一切。</p>"]],"con":[],"say":"本講義的立場：首生不是第一個被造的，是一切被造的都歸他承受——1:16 開頭的「因為」說他是創造者，1:18 第二次「首生」說的是地位。本講義站在尼西亞信經與歷代正統教會的立場；全卷立場見 ISS00_2。","care":"會眾席上可能有家人是耶和華見證人的弟兄姊妹，也可能有從那裡出來、仍在掙扎的朋友，甚至有正在和他們查經、還沒有決定的人。不要在講台上嘲笑、模仿或攻擊他們，那只會傷害坐在台下、愛著他們的人。陪弟兄姊妹學習 4:6「好像用鹽調和」：先尊重對方的誠懇，再邀請對方一起把 1:16 開頭的「因為」讀出來；對從那裡出來的朋友，給他時間，不催逼他立刻接受另一套答案。"},{"id":"ISS01_5","t":"1:16「有位的、主治的、執政的、掌權的」——是天使階級還是地上政權？","r":"1:16--16；2:10；2:15；弗 1:21","ch":[1],"why":"1:16 一口氣列出四種權勢：有位的、主治的、執政的、掌權的。它們是天上的天使等次、地上的政權，還是靈界的邪惡勢力？這一題影響信徒怎樣看靈界、怎樣看政府，也關係到在拜拜文化裡長大的華人信徒，心裡那些看不見的恐懼該放在哪裡。","pos":[["【一】經文問的是甚麼","","<p>「因為萬有都是靠他造的，無論是天上的，地上的；能看見的，不能看見的；或是有位的，主治的，執政的，掌權的」（1:16）。原文 εἴτε θρόνοι εἴτε κυριότητες εἴτε ἀρχαὶ εἴτε ἐξουσίαι（eite thronoi eite kyriotētes eite archai eite exousiai）。問題是：這四個詞指甚麼？它們是好的、中性的，還是邪惡的？和 2:15「一切執政的、掌權的」是不是同一群？</p>"],["天使階級說","","<p>不少學者指出：猶太啟示文學常列出天使的等次，「寶座」「主權」「執政」「掌權」都是其中的名稱；歌羅西的錯謬教師重視「敬拜天使」（2:18），保羅便把這些天上的等次全部放在基督所造之列，說它們都在他之下。</p><p><strong>難處：</strong>這四個詞在新約別處也用在地上的權柄（例如羅 13:1 的「掌權的」）；若只讀成天使，可能錯過保羅「天上的，地上的」那個全面的視野。</p>"],["地上政權說","","<p>另一些學者認為：「寶座」「主權」是政治語言，這四個詞包括羅馬帝國與各地的權力結構；保羅要說，連凱撒的寶座都是被造的，也是為基督造的。這一讀讓這節經文對今天的政治與社會權力也說話。</p><p><strong>難處：</strong>上下文強調的是「不能看見的」，2:15 說基督在十字架上把執政掌權的「擄來」「誇勝」，2:18 又提到天使，顯示保羅心中首先是靈界的權勢，不只是地上的政府。</p>"],["一切權勢說","","<p>還有學者認為：保羅刻意用一組夠寬的詞，涵蓋看得見與看不見、天上與地上、良善與邪惡的一切權力；重點不在分類，而在全部都是「他造的」、都要歸在他底下。2:10 說基督是「各樣執政掌權者的元首」，2:15 說他在十字架上勝過了它們。</p><p><strong>難處：</strong>這一說較少回答這些權勢的具體性質，容易讓人覺得經文含糊；而且「被造的」與「被勝過的」怎樣並存，需要更多解釋。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的判斷：重點在「不能看見的」那一邊——歌羅西人在意的天使與靈界權勢——但四個詞夠寬，地上的權力也都在清單裡。</strong>這張清單的標題是「他造的」，結論是 2:15 的「誇勝」。</p><p>所以信徒不必恐懼，也不必另找保護：造了一切權勢的那一位，就是我們所信的那一位。屬靈爭戰回指以弗所書立場四，「基督＋天使」的問題見全卷立場 ISS00_3。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各派都同意：不論這些權勢是天上的還是地上的，它們都是被造的，都在基督之下，而且在十字架上已經被勝過。</p><p>這對你今天的意義是平安，不是恐慌：你從小被教要怕的那些看不見的東西，沒有一樣在基督之上，也沒有一樣在基督之外。</p>"]],"con":[],"say":"本講義的立場：四種權勢以看不見的靈界權勢為主，也涵蓋地上的權力；它們都是基督所造、為他而造，並在十字架上被勝過。屬靈爭戰回指以弗所書立場四；「基督＋天使」的全卷立場見 ISS00_3。","care":"會眾席上可能有從小在拜拜、問神、收驚的環境裡長大、至今晚上仍會害怕的人，也可能有正被家人要求「回去拜一下」的新信徒。不要用靈界的恐怖故事嚇他們，也不要嘲笑他們的恐懼。陪他們讀 1:16–17，讓他們知道一切權勢都是他造的；若有人有長期的失眠、驚恐或身心困擾，除了禱告，也要溫柔地鼓勵他尋求醫療與專業協助。"},{"id":"ISS01_6","t":"1:19「父喜歡叫一切的豐盛在他裡面居住」——「父」字是和合本補的：是誰「喜歡」？","r":"1:19--19；2:9--10","ch":[1],"why":"和合本 1:19 的「父」字是小字補的，原文 εὐδόκησεν（eudokēsen）的主詞沒有寫出來。是父喜歡叫豐盛住在基督裡，還是豐盛本身「樂意」住在他裡面？這一題看似只是文法，卻關係到「豐盛」是甚麼，也預告了 2:9「神本性一切的豐盛」；有人第一次發現和合本有補字，還會因此對聖經失去信心。","pos":[["【一】經文問的是甚麼","","<p>「因為父喜歡叫一切的豐盛在他裡面居住」（1:19）。原文 ὅτι ἐν αὐτῷ εὐδόκησεν πᾶν τὸ πλήρωμα κατοικῆσαι（hoti en autō eudokēsen pan to plērōma katoikēsai），沒有「父」字。動詞 εὐδόκησεν（eudokēsen）「樂意、喜歡」需要一個主詞。問題是：主詞是隱含的神，還是 πᾶν τὸ πλήρωμα（pan to plērōma）本身？和合本用小字補上「父」，是替讀者作了一個判斷；這個判斷對不對，會影響我們怎樣理解「豐盛」，也影響我們怎樣把這一節和 2:9 連起來讀。</p>"],["隱含主詞說（神／父）","","<p>和合本與多數英譯（補 God）認為：主詞是隱含的神；1:12–13 的主詞是「父」，一路下來的主角都是他，所以 1:19 也是父喜歡、樂意叫豐盛住在愛子裡面。εὐδόκησεν（eudokēsen）在新約常用在神身上，例如耶穌受洗時天上的聲音。</p><p><strong>難處：</strong>從 1:15 開始，句子的主角已經轉成「愛子」，要再往前找主詞，距離很遠；而且這樣讀，πᾶν τὸ πλήρωμα（pan to plērōma）就成了不定詞的主詞，句子結構較繞。</p>"],["豐盛為主詞說","","<p>另一些學者認為：πᾶν τὸ πλήρωμα（pan to plērōma）本身就是主詞——「一切的豐盛樂意住在他裡面」；這裡的「豐盛」幾乎等於神自己，所以 2:9 會說「神本性一切的豐盛都有形有體地居住在基督裡面」（2:9）。這一讀文法較直接。</p><p><strong>難處：</strong>「豐盛」作為一個會「樂意」的主詞，在中文與英文裡都很不自然；讀者若不熟悉，可能以為「豐盛」是神以外的另一種存在。</p>"],["論戰用語說","","<p>也有學者特別指出：πλήρωμα（plērōma）可能是歌羅西錯謬教師的用語，後來的諾斯底派用它指神與世界之間層層的屬靈存有。保羅借用這個字反過來說：豐盛不分散在天使與層級裡，全部住在一位裡面。這一說補充前兩說，解釋保羅為甚麼選這個字。</p><p><strong>難處：</strong>諾斯底派的系統是第二世紀才成形的，不能直接套回第一世紀的歌羅西；我們只能說保羅可能在回應一種相近的想法。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的判斷：第二讀較貼近文法，而且正是 2:9 的預告；但兩讀的結論相同——住在基督裡的，是神的全部，不是一部分。</strong>κατοικῆσαι（katoikēsai）是定居，不是暫住。</p><p>和合本把「父」字用小字標出，是譯者的誠實，不是錯誤：它讓讀者知道哪些字是原文有的、哪些是為了中文通順補上的。基督神性的全卷立場見 ISS00_2。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。不論主詞怎樣讀，經文的意思都一樣：神沒有把自己的一部分放在基督裡，另一部分放在別處讓人去收集。</p><p>對你今天的意義是：你要找的豐盛，不在基督以外。2:10 說「你們在他裡面也得了豐盛」（2:10）。</p>"]],"con":[],"say":"本講義的立場：「父」字是和合本為中文通順補上的小字；原文較自然的讀法是「一切的豐盛樂意住在他裡面」，正是 2:9 的預告。兩讀結論相同：神的全部都在基督裡。全卷立場見 ISS00_2。","care":"會眾席上可能有第一次發現「和合本有補字」就開始懷疑聖經可不可靠的年輕人，也可能有被人說「你的聖經是改過的」而不知怎樣回答的信徒。不要嘲笑他們的疑問，也不要用「不要想那麼多」打發。陪他們看和合本的小字：那是譯者向讀者交代的誠實；邀請他們一起讀原文的意思，讓疑問變成更深認識經文的入口。"},{"id":"ISS01_7","t":"1:20「叫萬有……都與自己和好了」——萬有都會得救嗎？","r":"1:20--20；1:23；2:15；羅 8:19--21","ch":[1],"why":"「便藉著他叫萬有……都與自己和好了」常被用來支持普救論：既然是「萬有」，豈不是每一個人、甚至連撒但最後都會得救？這一題關係到福音的迫切性，也牽動每一位有未信主離世親人的信徒心裡最深的問題；講錯任何一邊，都會傷人。","pos":[["【一】經文問的是甚麼","","<p>「既然藉著他在十字架上所流的血成就了和平，便藉著他叫萬有－無論是地上的、天上的－都與自己和好了」（1:20）。ἀποκαταλλάξαι τὰ πάντα（apokatallaxai ta panta）是加強的「使萬有和好」。問題是：「萬有」是指每一個人與每一個靈體都會得救，還是指整個受造界重新歸回秩序？三節以後保羅說「只要你們在所信的道上恆心」（1:23），兩節要怎樣一起讀？</p>"],["普救論","","<p>從第三世紀的俄利根到近代一些神學家主張：神的愛最終會勝過一切抗拒，萬有——包括每一個人，甚至墮落的天使——最後都會與神和好；1:20 的「萬有」與林前 15:28「神在萬物之上，為萬物之主」都指向這個終局。</p><p><strong>難處：</strong>1:23 立刻加上條件；2:15 說權勢是被「擄來」「明顯給眾人看」，是被勝過，不是被救贖；新約也多次嚴肅地說到審判。歷代教會（包括第六世紀的大公會議）都拒絕了俄利根式的普救論。</p>"],["宇宙平服說","","<p>許多學者認為：「和好」在這裡有兩層——信的人被和好進入平安；敵對的權勢則被「平服」，被迫歸回神所定的秩序之下。萬有都與神和好，意思是整個宇宙不再有任何一處能與神抗衡，如同 2:15 的凱旋遊行。</p><p><strong>難處：</strong>「和好」一詞本身帶著修復關係的溫暖，用「被迫平服」來解釋其中一部分，似乎改變了字義；這一說需要解釋為甚麼保羅用同一個字描寫教會與權勢。</p>"],["受造界更新說","","<p>另一些學者強調：「萬有」首先是受造界本身——天、地、自然、萬物；如同羅 8:19–21 說受造之物也要脫離敗壞的轄制，基督的十字架不只救人的靈魂，也要更新整個被造的世界。</p><p><strong>難處：</strong>這一說很好地回應了 1:16 的創造視野，但沒有直接回答「人」的問題；若只講受造界的更新，可能讓人忽略個人回應福音的必要。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的判斷：1:20 說的是神要讓整個受造界重新歸回秩序、歸在基督底下——包括受造界的更新與敵對權勢的被勝過；它不是說每一個人不論信不信都會得救。</strong></p><p>和好的範圍是宇宙，和好的路徑是十字架，進入和好的方法是信：「只要你們在所信的道上恆心」（1:23）。這使福音既有宇宙的寬度，也有個人回應的迫切。</p>"],["【四】這件事該不該影響你的信心","","<p>不該動搖你對基督的信靠。各派都同意：和好唯一的根據是十字架的血，宇宙的終局在基督手中。</p><p>對於已經離世、我們不知道他最後怎樣回應神的人，聖經沒有叫我們替神下判斷；我們可以把他交在那位為萬有流血、滿有憐憫的主手中。</p>"]],"con":[],"say":"本講義的立場：萬有和好是受造界歸回秩序、歸在基督底下，不是每一個人不論信不信都得救；和好的範圍是宇宙，路徑是十字架，進入的方法是信（1:23）。爭議與信心的全卷立場見 ISS00_9。","care":"會眾席上一定有父母、配偶或孩子沒有信主就離世的人，這一題會直接碰到他們心裡最痛的地方。不要在講台上判定任何一位已經離世的人的結局，也不要用「他們一定在地獄」來增加福音的迫切。先陪伴、不追問，讓他知道可以把所愛的人交在滿有憐憫的神手中；若他陷在長期的哀傷裡，會後單獨關心，必要時協助尋求哀傷輔導。"},{"id":"ISS01_8","t":"1:23「只要你們在所信的道上恆心」——得救的人會失去救恩嗎？","r":"1:21--23；2:6--7；約 10:28--29","ch":[1],"why":"1:22 說神已經叫我們與自己和好，1:23 卻加上「只要你們在所信的道上恆心」。這是說救恩有條件、可能失去嗎？這是改革宗與阿米念傳統之間由來已久的爭論，也是許多信心軟弱、長期懷疑自己是否得救的信徒心裡反覆出現的問題。","pos":[["【一】經文問的是甚麼","","<p>「只要你們在所信的道上恆心，根基穩固，堅定不移，不致被引動失去福音的盼望」（1:23）。原文 εἴ γε ἐπιμένετε（ei ge epimenete），εἴ γε 是加強的條件，ἐπιμένετε 是現在式「持續留在」。問題是：這是一個真實的、可能不成立的條件，還是帶著把握的提醒？一個已經被和好的人，會不會因為沒有恆心而失去救恩？</p>"],["聖徒恆忍說","","<p>改革宗傳統：真正重生的人必蒙神保守到底，主說「誰也不能從我父手裡把他們奪去」（約 10:29）；1:23 的條件是在描寫真信心的樣子——真信的人必定持續；εἴ γε 帶著把握，近似「既然你們確實持續」。恆心是得救的證據，不是得救的條件。</p><p><strong>難處：</strong>若條件必定成立，經文的警告似乎失去了力量；而且這一說面對「有人信了又離開」的現實時，常要說那些人「原本就沒有真信」，這對當事人與家人是很沉重的判斷。</p>"],["可失去救恩說","","<p>阿米念與衛斯理傳統：神的恩典是真實的，人的回應也是真實的；一個真正得救的人，若持續地、刻意地離棄信仰，是可能失去救恩的。1:23 與來 6:4–6 等經文的警告，正是因為這個危險是真的。</p><p><strong>難處：</strong>這一說容易讓信心軟弱的人活在不安裡，不斷檢查自己是否「還在」；也需要面對 1:22 已經完成的和好、3:3「你們的生命與基督一同藏在神裡面」那種穩固的語言。</p>"],["警告為手段說","","<p>也有學者提出：聖經的警告本身就是神保守信徒的方法——神藉著「只要你們恆心」這樣的提醒，使他的子民真的恆心；警告與應許不是互相矛盾，而是同一份保守的兩面。這一說試圖在前兩說之間找到牧養上的平衡。</p><p><strong>難處：</strong>這一說在邏輯上仍要回答「警告所說的結果是否可能真的發生」；若不可能，警告似乎只是修辭；若可能，又回到第二說的問題。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的判斷：1:23 是一位牧者帶著把握的提醒，不是恐嚇。</strong>保羅的對象是被一點一點「引動」的人——錯謬教師沒有叫他們離開基督，只是要他們加一點；「根基穩固」用的是完成式分詞：根基已經立好，保羅要的是他們不被推離。</p><p>本講義並陳兩大傳統，不在這裡替各教會決定；兩邊都必須同意的落點是：救恩的穩固在於神，不在於我抓得多緊；而真實的信心會持續地留在基督裡。爭議與信心的全卷立場見 ISS00_9。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你活在恐懼裡。各派都同意：得救是本乎恩、因著信；神是信實的；真信的人要持續地留在基督裡。</p><p>如果你常常懷疑自己是否得救，請回到 1:22：和好是神藉著基督的肉身受死作成的，是他把你引到自己面前。恆心不是你緊握不放，是你一次又一次回到他那裡。</p>"]],"con":[],"say":"本講義的立場：1:23 是帶著把握的牧者提醒，不是恐嚇；聖徒恆忍與可失去救恩兩大傳統並陳，兩邊都同意救恩的穩固在神，真信心會持續留在基督裡。爭議與信心的全卷立場見 ISS00_9。","care":"會眾席上可能有長期懷疑自己是否得救、每次犯錯就覺得「我是不是失去救恩了」的人，也可能有孩子或配偶離開了信仰、日夜憂心的家人。不要用 1:23 去嚇他們，也不要輕易說某一位離開的人「原本就沒有真信」。陪前者讀 1:22 與 3:3，讓他知道生命藏在神裡面；陪後者為離開的人持續禱告，不替神下結論；若焦慮已經影響睡眠與生活，溫柔地鼓勵他尋求專業協助。"},{"id":"ISS01_9","t":"1:24「補滿基督患難的缺欠」——基督的救恩不夠嗎？","r":"1:24--25；1:22；林後 1:5","ch":[1],"why":"「要在我肉身上補滿基督患難的缺欠」是全卷最容易被誤用的一句：有人讀成基督的救恩不夠，要靠人的受苦補足；有人用它勸受虐的人「忍下去，這是你的十字架」。這一題必須講清楚，因為它直接關係到恩典是否完全，也關係到受傷的人能不能被保護。","pos":[["【一】經文問的是甚麼","","<p>「現在我為你們受苦，倒覺歡樂；並且為基督的身體，就是為教會，要在我肉身上補滿基督患難的缺欠」（1:24）。ἀνταναπληρῶ τὰ ὑστερήματα τῶν θλίψεων τοῦ Χριστοῦ（antanaplērō ta hysterēmata tōn thlipseōn tou Christou），ἀνταναπληρῶ 新約只出現這一次。問題是：「基督患難的缺欠」是甚麼？基督的受苦還缺了甚麼，要保羅來補？</p>"],["救恩不足說","","<p>有人讀成：基督的贖罪受苦還不完全，要由聖徒的受苦、功德與補贖來補足；中世紀的功德庫觀念，有時也引用這一節。</p><p><strong>難處：</strong>這與上下文直接衝突：1:20 說和平已經藉著十字架的血成就，1:22 說神已經藉著基督的肉身受死叫我們與自己和好；而且這裡的「患難」θλῖψις（thlipsis）在新約從不用來指基督贖罪的受苦。歷代正統教會一致拒絕這種讀法。</p>"],["神秘聯合說","","<p>許多學者認為：基督與教會合一，教會受苦就是基督受苦；復活的主對逼迫教會的掃羅說「掃羅！掃羅！你為甚麼逼迫我？」（徒 9:4）。保羅為教會受的苦，就是基督在他的身體裡繼續受的苦；保羅自己也說「我們既多受基督的苦楚」（林後 1:5）。</p><p><strong>難處：</strong>這一說很好地解釋了「基督的患難」，卻不容易解釋「缺欠」——如果是基督在教會裡受苦，為甚麼說「缺」？需要與下一說合讀。</p>"],["使徒事工說與彌賽亞災難說","","<p>一說認為：基督把傳福音的苦託付給他的使者，福音要傳到外邦人那裡，路上必有一定的苦，保羅在自己的肉身上承擔他那一份。另一說認為：猶太啟示文學相信末日前有一定份量的「彌賽亞的災難」，保羅多承擔一份，就讓別人少一份。</p><p><strong>難處：</strong>使徒事工說要解釋為甚麼稱作「基督的」患難；彌賽亞災難說依賴的猶太背景，在保羅書信裡沒有其他明確的例子，也容易被推成「受苦有固定配額」的計算。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義合讀神秘聯合說與使徒事工說：缺的不是救恩，是福音傳到人那裡的路上必經的苦；保羅為了教會，甘心承擔他那一份。</strong>基督受苦，完成了救恩；他的使者受苦，把救恩送到人那裡。1:22 的和好已經完成，1:24 不能把它變成未完成。</p><p>同時守住一條界線：保羅的苦是為福音、自願承擔的；被虐待不是為福音受苦。這一節不可以被用來把人留在不安全的處境裡。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。各派中凡是正統的讀法都同意：基督的救恩是完全的，不需要任何人補上一筆。爭的是保羅的受苦與基督的關係怎樣描述。</p><p>對今天為福音付代價的人——為了帶小組少睡了覺、為了探訪少賺了錢、因為信主被家人誤解——這一節是安慰：你不是在補救恩的不足，你是在走你那一段路，而且基督與你同在其中。</p>"]],"con":[],"say":"本講義的立場：1:24 不是說基督的救恩不夠——1:22 的和好已經完成；「患難」是傳福音的人在路上所受的苦，保羅甘心承擔他那一份。為福音受苦與留在虐待中是兩件事，這一節不可用來把人留在危險裡。爭議與信心的全卷立場見 ISS00_9。","care":"會眾席上可能有正在家裡受暴力、在職場被霸凌、在教會被屬靈控制的人，他們可能曾被人用這一節勸說「忍下去，這是你的十字架」。不要追問細節，不要要求他立刻原諒，也不要對正在流淚的人說「你要有信心」。明確地告訴他：受虐不是為福音受苦，教會的責任是陪他到安全的地方；會後單獨關心，必要時協助他尋求專業協助與安全的管道。"},{"id":"ISS02_1","t":"2:8「理學和虛空的妄言」——基督徒可以讀哲學、念神學、學科學嗎？","r":"2:8--8；1:9；2:3","ch":[2],"why":"2:8 常被引來勸年輕人不要念哲學、不要讀太多神學、對科學保持戒心，好像讀書與信仰只能二選一。另一面，也有人把各種學說、成功學與心理技巧直接搬進教會，當成屬靈真理。這一題關係到每一位讀書的信徒、每一位講員與教師，也關係到華人教會長久以來「信心與理性」的緊張。","pos":[["【一】經文問的是甚麼","","<p>「你們要謹慎，恐怕有人用他的理學和虛空的妄言，不照著基督，乃照人間的遺傳和世上的小學就把你們擄去。」（2:8）<strong>διὰ τῆς φιλοσοφίας καὶ κενῆς ἀπάτης</strong>（dia tēs philosophias kai kenēs apatēs）只有一個冠詞管兩個名詞，可以讀成「那種哲學，也就是空洞的欺騙」。問題是：保羅反對的是哲學這門學問本身，還是歌羅西那一套「不照著基督」的特定說法？</p>"],["全面戒備說：哲學與世俗學問本身就是危險","","<p>教會歷史上一直有一條聲音（例如特土良「雅典與耶路撒冷有甚麼相干」）：人的理性有限而且受了罪的污染，哲學與世俗學問常常把人帶離單純的信心；2:8 正是一個警告，基督徒應當專心讀聖經，對哲學、某些科學理論保持距離。</p><p><strong>難處：</strong>同一封信裡，保羅禱告信徒「在一切屬靈的智慧悟性上，滿心知道神的旨意」（1:9），又說「所積蓄的一切智慧知識，都在他裡面藏著」（2:3）；保羅自己在亞略巴古引用希臘詩人。全面戒備會叫信仰變成反智，也把思考的年輕人推出教會。</p>"],["全面接納說：一切真理都是神的真理，學問本身沒有立場","","<p>另一種看法認為，一切真理都是神的真理；哲學、科學、心理學與管理學都是神普遍恩典的禮物，教會應當廣泛吸收，2:8 只是針對一世紀某個異端，和今天的學術無關。</p><p><strong>難處：</strong>「一切真理都是神的真理」是對的，但不等於一切學說都是真理；2:8 的判準「不照著基督」今天仍然有效。全面接納常常讓一套成功學、一個心理模型在不知不覺中坐上基督的位置，這正是保羅說的「擄去」。</p>"],["判準說：問題不在思考，在「照不照著基督」","","<p>多數福音派學者：φιλοσοφία（philosophia）在一世紀範圍很寬，猶太作者也把猶太教各派稱為「哲學」；保羅反對的是那一套「照人間的遺傳和世上的小學」、要基督讓位的說法。三個 κατά（kata）排成一排，最後一個「不照著基督」就是判準。學問若讓基督居首位，就是在挖他裡面的寶藏；若要基督讓位，再高深也是虛空。</p><p><strong>難處：</strong>判準清楚，應用卻需要分辨；哪一個理論、哪一套方法已經越界，常常需要群體一起分辨，不能只靠一句口號。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採判準說（紅線六）。</strong>基督徒最有理由讀書、思考、研究，因為一切智慧知識都藏在基督裡；要警惕的不是思考，是一套說法開始決定我們怎樣看基督，而不是基督決定我們怎樣用它。</p><p>所以本講義不把 2:8 講成反智、反科學、反教育，也不把任何學說直接等同於屬靈真理。今天的「理學」可能是一套成功學、一個領導力模型、一種把人的命運交給星宿的命理，判準都是同一把尺（全卷立場見 ISS00_3）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。你不必在書本與信仰之間選邊。你讀得越深，越該發現寶藏的地址只有一個；你讀到不懂的、讀到衝擊的，也不必害怕，因為真理不怕被追問。</p><p>需要問的只有一句：我所學的，是讓我更認識、更敬拜基督，還是讓我覺得自己不再那麼需要他？</p>"]],"con":[],"say":"本講義的立場：2:8 不是反智——一切智慧知識都在基督裡藏著，基督徒最有理由讀書思考；問題是「不照著基督，乃照人間的遺傳」。判準是讓不讓基督居首位。本講義的全卷立場見 ISS00_3。","care":"會眾席上可能有念哲學、念科學、念神學的學生，曾被長輩或同工說「讀太多書會失去信仰」而受傷；也可能有正在讀書中經歷信仰衝擊、不敢說出口的年輕人。不要在講台上嘲笑學者或學問，也不要把他的疑問當成背叛。會後單獨找他，先聽他讀到了甚麼、哪裡卡住，陪他一起讀、一起想；必要時介紹一位能同時尊重學問與信仰的師長陪他。"},{"id":"ISS02_2","t":"2:8、20「世上的小學」——是基本原則，還是星宿與靈界勢力？","r":"2:8--8；2:20；加 4:3；加 4:9","ch":[2],"why":"「世上的小學」在 2:8、2:20 出現兩次，加拉太書也說「懦弱無用的小學」。這個詞決定一個人怎樣讀整段：保羅對付的是一套基礎規則，還是一群會轄制人的靈界勢力？在擇日、風水、算命、星座盛行的華人處境裡，這一題直接關係到信徒怎樣面對這些東西。","pos":[["【一】經文問的是甚麼","","<p>2:8 說不要讓人「照人間的遺傳和世上的小學」把你們擄去；2:20 說「你們若是與基督同死，脫離了世上的小學」。<strong>τὰ στοιχεῖα τοῦ κόσμου</strong>（ta stoicheia tou kosmou）的 στοιχεῖα（stoicheia）字面是「排成一列的基本元素」，可以指字母、基礎課程，也可以指構成宇宙的地水火風，以及古人以為管著這些元素的星宿與靈界勢力。問題是：保羅在這裡用的是哪一個意思？</p>"],["基本原則說：宗教的入門規則","","<p>許多學者認為 στοιχεῖα（stoicheia）在這裡是「基本原則」，像字母表的 ABC；和合本譯「小學」，正是這個意思。加 4:3、9 把猶太律法與外邦宗教的規條都稱為「小學」：還沒有長大的人，要靠這些外在規則過日子。2:20 下一句緊接著「規條」，也支持這一讀法。</p><p><strong>難處：</strong>這一讀法很合上下文，但 2:10、15 同時講到「執政掌權的」，2:18 又講到天使；只讀成「規則」，可能低估了保羅心裡那一層靈界的背景，也不容易解釋 2:20「脫離」這麼強的字。</p>"],["靈界勢力說：星宿與管轄人命運的靈","","<p>另一些學者指出，一世紀的猶太與希臘文獻已經用 στοιχεῖα（stoicheia）指天體、元素與它們背後的靈；弗呂家一帶的民間宗教相信星宿與天使管著人的命運，要用節期、禁戒去討好它們。照這一讀法，2:8 的「小學」就是這些勢力，2:15 基督把它們擄來，所以信徒不必再怕。</p><p><strong>難處：</strong>這個用法在保羅時代是否已經普遍，學者仍有爭論；讀得太重，容易把整段講成靈界恐慌，忽略保羅最後對付它們的方式不是驅趕，而是「不照著基督」這把尺。</p>"],["合併說：一套會轄制人的原則，背後有真實的勢力","","<p>不少註釋者認為兩讀不必對立：在古人的世界觀裡，宗教規條、節期、禁戒與星宿、天使本來就連在一起；保羅說的「小學」，是一整套在基督以外、會轄制人的原則，背後也牽涉靈界。基督已經是一切執政掌權者的元首，與他同死的人就「脫離」了整套體系。</p><p><strong>難處：</strong>合併說涵蓋面最廣，卻也需要講清楚重點落在哪裡，否則講台上容易一下講成規條、一下講成鬼神，叫會眾抓不住方向。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採合併說，重點落在「不照著基督」。</strong>保羅心裡的 στοιχεῖα（stoicheia）不只是課本，是一套會轄制人的原則；但他對付它的方式不是更多的驅趕，是把人帶回已經誇勝的基督。</p><p>所以今天的「小學」，包括擇日、風水、命盤、星座運勢，也包括把人捆在規條裡的宗教系統。基督徒不必怕它們，也不必再靠它們；這不是迷信的對抗，是元首的轉換（全卷立場見 ISS00_3；屬靈爭戰回指以弗所書立場四）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。無論「小學」是規則還是勢力，經文的結論一樣：你已經與基督同死，脫離了它。</p><p>如果你曾經看日子搬家、戴著開運的東西、每天看運勢，不必害怕自己「被沖到」；你只需要把手從那些東西上放開，握緊那一位已經坐在元首位置上的主。</p>"]],"con":[],"say":"本講義的立場：「世上的小學」是一整套在基督以外、會轄制人的原則，背後也牽涉靈界；保羅對付它的方式是「不照著基督」這把尺，不是恐慌。本講義的全卷立場見 ISS00_3；屬靈爭戰回指以弗所書立場四。","care":"會眾席上可能有剛信主、家裡還在擇日拜拜的人，也可能有被長輩說「你不看日子會出事」而害怕的弟兄姊妹。不要在講台上嘲笑家人的民間信仰，也不要用「你會被鬼抓」嚇人。陪害怕的人讀 2:15，讓他知道基督已經誇勝；陪剛信主的人慢慢學習怎樣在家裡尊重長輩、又不參與祭拜，給他時間，不急著要他當眾表態。"},{"id":"ISS02_3","t":"2:9「神本性一切的豐盛都有形有體地居住在基督裡面」——道成肉身與三位一體怎樣一起讀？","r":"2:9--10；1:19；約 1:14","ch":[2],"why":"2:9 是新約講基督神性最直接的一句，也是耶穌見證人、一位論者與正統信仰最常交鋒的經文之一。「神本性」是神的全部，還是神的某些特質？「有形有體」是說道成肉身，還是說「實實在在」？這一題關係到信徒敬拜的是誰，也關係到他在敲門的鄰居、網路上的辯論面前怎樣站立。","pos":[["【一】經文問的是甚麼","","<p>「因為神本性一切的豐盛都有形有體地居住在基督裡面」（2:9）。<strong>τῆς θεότητος</strong>（tēs theotētos）在新約只出現這一次，與羅 1:20 的 θειότης（theiotēs，神的特質）不同，指「神之為神」本身；<strong>σωματικῶς</strong>（sōmatikōs）是「有形體地」；<strong>κατοικεῖ</strong>（katoikei）是現在式。問題是：這節經文是否說基督就是神？「有形有體」又是甚麼意思？</p>"],["尼西亞正統：基督是真神也是真人","","<p>歷代正統教會：θεότης（theotēs）是神性的全部，不是一部分；神的一切豐盛「現在一直」住在這位有身體的人裡面，所以基督是與父同質的真神，也是真人；「道成了肉身，住在我們中間」（約 1:14）。父、子、聖靈是一位神，三個位格；2:9 不是說神性被分了一部分給基督，是說看見他就看見了神。</p><p><strong>難處：</strong>三位一體的奧祕超過人的理解，講解時容易落入比喻的陷阱（水的三態、一人三種身分），這些比喻常常不小心講成了形態論，需要謹慎。</p>"],["亞流派與耶和華見證人：基督是最高的受造者","","<p>亞流派與今天的耶和華見證人認為：基督是神最先、最高的受造者，被神充滿、被賦予神的特質；2:9 的意思是神的特質住在他裡面，正如神的靈住在先知裡面。新世界譯本把這一節譯作「神的特質」。</p><p><strong>難處：</strong>θεότης（theotēs）不是 θειότης（theiotēs），字面就是神性本身；而且「一切的豐盛」「都」住在他裡面，不容易讀成部分的特質。1:16–17 又說萬有是藉著他造的、他在萬有之先，這與受造者的地位對不上。</p>"],["嗣子論與自由派：一個被神充滿的人","","<p>早期的嗣子論與部分現代自由派神學認為，耶穌是一位完全向神開放、被神特別充滿的人，他的「神性」是一種道德與屬靈上的合一；2:9 是早期教會用崇高的語言表達對他的敬仰。</p><p><strong>難處：</strong>κατοικεῖ（katoikei）是長住，不是一時的充滿；保羅也不是在描寫一位聖人，是在說「你們在他裡面也得了豐盛」（2:10）——若基督只是被充滿的人，他就不能成為別人豐盛的來源。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義站在尼西亞信經與歷代正統教會的立場：基督是真神，也是真人。</strong>神之為神的全部，都住在這一位有身體的人裡面；σωματικῶς（sōmatikōs）以「道成肉身」為主，同時聽見實實在在、不是影兒的回聲（參 2:17）。</p><p>這一條影響信心，但影響的方式是敬拜，不是辯論：你所需要的神，全部在你所認識的這位耶穌裡面（全卷立場見 ISS00_2）。</p>"],["【四】這件事該不該影響你的信心","","<p>這一題和其他許多議題不同：它直接關係到你敬拜的是誰，所以值得你清楚地相信。但清楚不等於好鬥。</p><p>如果敲你家門的鄰居和你看法不同，你不必贏過他，只要讓他看見你所敬拜的那一位有多麼豐盛——4:6 說，話要「好像用鹽調和」。</p>"]],"con":[],"say":"本講義的立場：2:9 說神性的全部都有形有體地住在基督裡——基督是真神也是真人，這是尼西亞信經與歷代正統教會的信仰；落點是敬拜，不是辯論。本講義的全卷立場見 ISS00_2。","care":"會眾席上可能有正在和耶和華見證人查經、心裡起了疑問的人，也可能有家人加入了其他團體、正在痛苦的弟兄姊妹。不要在講台上嘲笑或攻擊任何持不同信仰的人，也不要對有疑問的人說「你怎麼連這個都不信」。陪他一起讀 1:15–20 與 2:9–10，允許他問；對家人加入其他團體的人，先陪他哀傷，再陪他學習用愛與溫柔繼續和家人來往。"},{"id":"ISS02_4","t":"2:11--12「不是人手所行的割禮」「受洗與他一同埋葬」——嬰兒洗禮與信徒浸禮怎樣看？","r":"2:11--12；羅 6:4；徒 2:39；徒 16:15","ch":[2],"why":"2:11–12 把割禮與洗禮放在一起，是嬰兒洗禮派與信徒浸禮派都必讀的經文。華人教會裡兩個傳統都有，常有信徒因為轉換教會被要求「重新受洗」，或為孩子該不該受洗而困惑；也有人把洗禮講成自動得救，或講成可有可無。這一題直接碰到每一個家庭的決定。","pos":[["【一】經文問的是甚麼","","<p>「你們在他裡面也受了不是人手所行的割禮」（2:11），「你們既受洗與他一同埋葬，也就在此與他一同復活，都因信那叫他從死裡復活神的功用」（2:12）。<strong>συνταφέντες αὐτῷ ἐν τῷ βαπτισμῷ</strong>（syntaphentes autō en tō baptismō）是「在洗禮中與他同葬」；<strong>διὰ τῆς πίστεως</strong>（dia tēs pisteōs）是「藉著信」。問題是：割禮與洗禮的並列，是否支持嬰孩受洗？「都因信」又是否表示只有能信的人才受洗？</p>"],["嬰兒洗禮派：洗禮是新約的立約記號","","<p>天主教、東正教、信義宗、聖公會、長老會與改革宗：2:11–12 把割禮與洗禮並排，割禮施於立約百姓的兒女，洗禮作為新約的立約記號，也可以施於信徒的兒女；「這應許是給你們和你們的兒女」（徒 2:39），新約也記載全家受洗（徒 16:15）。孩子在立約的群體裡長大，將來以堅信禮公開承認信仰。</p><p><strong>難處：</strong>2:12 明說「都因信」，嬰孩還不能表達信心；新約沒有一處明文記載嬰孩受洗，全家受洗是否包括嬰孩也只是推論。若講得不好，容易讓人以為受過洗就自動得救。</p>"],["信徒浸禮派：洗禮是信的人自己的宣告","","<p>浸信會、許多獨立教會與五旬節派：洗禮是一個人悔改相信之後，公開與基督同死同活的宣告；2:12「都因信」說明受洗的人必須自己有信心，「一同埋葬」的畫面（羅 6:4）也支持浸入水中。割禮在基督裡的成全是「不是人手所行的」，指的是心裡的更新，而不是另一個外在儀式的對象。</p><p><strong>難處：</strong>這一說需要解釋新約全家受洗的記載，也要面對信徒的兒女在教會中的身分問題；若講得不好，容易把洗禮變成個人屬靈成熟的證明，或要求別的傳統受過洗的人一律重浸。</p>"],["共同的根基：記號、管道與源頭","","<p>兩派之外，越來越多福音派學者指出兩邊共同站立的地方：2:12 的次序是洗禮是記號、信心是管道、神的大能是源頭；ἐν ᾧ（en hō）可以指「在他裡面」或「在洗禮裡」，但不論哪一讀，叫人復活的都是「神的功用」。洗禮不是魔法，也不是可有可無；它是神的作為在群體中被看見的記號。</p><p><strong>難處：</strong>這個共同點不能取代各教會在實踐上的決定，孩子要不要受洗、用甚麼方式施洗，每一間教會仍要照自己的傳統與良心作決定。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義並陳兩派，不替各教會決定洗禮的方式與對象。</strong>兩派都是福音派，都敬重聖經權威。兩派都必須同意經文的次序：洗禮不是魔法，受了洗不等於自動得救；洗禮也不是可有可無，它是一個人或一個家庭公開說「我們已經與基督同死同活」。</p><p>這也是 321「無己」的文法第一筆：不是我努力把自己埋掉，是我已經與他同埋；不是我努力爬出墳墓，是神叫我與他一同起來（全卷立場見 ISS00_4）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。不論你是嬰孩時受洗、後來堅信，或是長大後自己受浸，叫你活過來的都是同一位神的大能。</p><p>如果你轉換教會，被問到要不要重新受洗，請和那一間教會的牧者坦誠談，也尊重自己過去的領受；這是一個需要禱告與商量的決定，不是一個證明你是否真信的考試。</p>"]],"con":[],"say":"本講義的立場：嬰兒洗禮派與信徒浸禮派並陳，不替各教會決定洗禮的方式與對象；兩派都要守住 2:12 的次序——洗禮是記號，信心是管道，神的大能是源頭。本講義的全卷立場見 ISS00_4。","care":"會眾席上可能有嬰孩時受洗、如今被要求重浸而覺得被否定的人，也可能有孩子夭折前沒有受洗、一直掛心的父母，還有因為身體狀況不能浸入水中的長者。不要在講台上嘲笑另一個傳統，也不要對喪子的父母說任何關於孩子去處的斷語。陪他們回到 2:12 末句：叫人復活的是神的功用，把孩子交在那位滿有憐憫的神手中；會後單獨關心，必要時協助尋求哀傷輔導。"},{"id":"ISS02_5","t":"2:14「塗抹了……字據」——字據是甚麼？律法被廢了嗎？","r":"2:13--14；加 3:24；羅 8:1；羅 13:10","ch":[2],"why":"2:14 說神「塗抹了在律例上所寫、攻擊我們、有礙於我們的字據」，又「釘在十字架上」。這張字據是摩西律法、天上的罪債冊，還是人自己簽下的欠條？如果律法被塗抹了，十誡還要不要守？華人文化很會記帳，許多信徒心裡仍有一本「還欠神」的帳，這一題直接關係到他們每天怎樣靠近神。","pos":[["【一】經文問的是甚麼","","<p>「又塗抹了在律例上所寫、攻擊我們、有礙於我們的字據，把它撤去，釘在十字架上。」（2:14）<strong>χειρόγραφον</strong>（cheirographon）在蒲草紙文獻裡是親筆簽名的欠條；<strong>τοῖς δόγμασιν</strong>（tois dogmasin）是「以條例」；<strong>ἦρκεν</strong>（ērken）是完成式：已經拿走了。問題是：被塗抹的字據究竟是甚麼？是律法本身被廢掉，還是律法對我們的定罪被撤銷？</p>"],["律法本身說：摩西律法作為定罪的條文被廢","","<p>部分教父與學者認為，字據就是摩西律法，τοῖς δόγμασιν（tois dogmasin）指律法的條文；基督在十字架上把整套律法作為一個制度廢掉，信徒不再在律法之下，這與弗 2:15「廢掉……記在律法上的規條」相合。</p><p><strong>難處：</strong>保羅在別處說律法是聖潔的，「愛就完全了律法」（羅 13:10）；本卷 3:5–4:6 仍然一條一條教導新人的生活。若說律法本身被塗抹，就不容易解釋保羅為甚麼仍用律法的內容教導信徒。</p>"],["天上冊子說：記錄罪債的天上帳簿","","<p>另一些學者引猶太啟示文學的背景：天上有冊子記錄人的罪債，天使在審判時拿出來控告；神把這本控告的冊子塗抹、釘在十字架上，與 2:15 擄來執政掌權的（控告者）正好相連。</p><p><strong>難處：</strong>這一背景有啟發性，但歌羅西人是否熟悉這類文學，學者並無定論；而且 τοῖς δόγμασιν（tois dogmasin）與 2:20 的 δογματίζεσθε（dogmatizesthe）明顯相連，字據似乎和地上的條例有關，不只是天上的帳簿。</p>"],["欠條說：人簽下、承認欠神順服的那筆債","","<p>許多當代註釋：字據是人自己的欠條——「我欠神完全的順服，簽名為據」；條例是欠條的條款。猶太人在律法上簽了名，外邦人在良心上也簽了名；這張欠條「攻擊我們」，因為我們還不起。神沒有假裝債不存在，他把它拿來釘在十字架上。</p><p><strong>難處：</strong>這一讀法與蒲草紙用法最合，但仍需要說明欠條與律法的關係：被撤去的到底是律法，還是律法的追討？</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採欠條說，並界定：字據是「律法向我們追討的那一筆債」。</strong>被塗抹的不是神良善的心意，是那張定罪的帳；誡命不再是追討欠款的帳單，是一個被饒恕的人學習愛的方向。「律法是我們訓蒙的師傅，引我們到基督那裡」（加 3:24）。</p><p>這也是 2:20 的伏筆：既然條例寫成的欠條已經被釘死，就不必再讓人拿新的條例來叫你簽名（回指加拉太書立場二）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。三種讀法都同意：十字架結清了我們還不起的債，「如今，那些在基督耶穌裡的就不定罪了」（羅 8:1）。</p><p>如果你心裡仍有一本帳，總覺得要多做一點才敢靠近神，請聽 ἦρκεν（ērken）的完成式：拿走了，到今天都還不在。你可以空著手來。</p>"]],"con":[],"say":"本講義的立場：字據是律法向我們追討的那一筆債——被釘在十字架上的是定罪的帳，不是神的道德心意；誡命從帳單變成被饒恕之人學習愛的方向。律法與稱義回指加拉太書立場二；爭議與信心的全卷立場見 ISS00_9。","care":"會眾席上可能有從小在「做不好就不被愛」的家裡長大、到今天仍然覺得要先還清才能靠近神的人；也可能有背著一件過去的事、多年不敢領聖餐的弟兄姊妹。不要用「你還欠神很多」去催逼人奉獻或服事，也不要輕描淡寫地叫他「忘掉就好」。陪他讀 2:13–14，讓他慢慢相信帳已經結清；若那件過去的事仍在傷害他，協助他尋求牧養與專業的陪伴。"},{"id":"ISS02_6","t":"2:15「將一切執政的、掌權的擄來」——基督已經勝了，為甚麼世界還有邪惡？","r":"2:15--15；約 16:33；約壹 3:8；啟 21:4","ch":[2],"why":"2:15 說基督已經把一切執政掌權的擄來，仗著十字架誇勝；可是戰爭、疾病、不公義與家裡的苦難仍然天天發生。如果仗已經打完了，為甚麼戰場上還有槍聲？這一題是受苦的人最常問、也最不容易回答的問題，講得不好，不是叫人以為神失敗了，就是叫人以為受苦的人信心不夠。","pos":[["【一】經文問的是甚麼","","<p>「既將一切執政的、掌權的擄來，明顯給眾人看，就仗著十字架誇勝。」（2:15）<strong>ἀπεκδυσάμενος</strong>（apekdysamenos）是卸下武裝，<strong>ἐδειγμάτισεν</strong>（edeigmatisen）是公開示眾，<strong>θριαμβεύσας</strong>（thriambeusas）是羅馬將軍的凱旋遊行；三個動詞都是不定過去式。問題是：既然勝利已經發生，邪惡為甚麼還在？這一節說的勝利是全然的，還是決定性卻尚未完成的？</p>"],["全然勝利說：信徒現在就該活在完全的得勝裡","","<p>部分信心運動認為：既然基督已經完全得勝，信徒只要宣告、只要有信心，就不該再生病、貧窮或受挫；若還有苦難，是因為信徒沒有運用已經得著的權柄。</p><p><strong>難處：</strong>寫這封信的保羅自己在監裡（4:3、18）；耶穌說「在世上，你們有苦難」（約 16:33）。把決定性的勝利講成全然實現，會叫受苦的人以為自己被神擱在一邊，或以為苦難證明了自己信心不足。</p>"],["純屬象徵說：勝利只是屬靈意義上的","","<p>另一些讀法認為，2:15 的勝利只是內心的、象徵性的：信徒在心裡不再被恐懼轄制，但在歷史與世界中，邪惡照常運作，神不一定會在將來真實地終結它。</p><p><strong>難處：</strong>新約一貫盼望一個真實的終局：「神的兒子顯現出來，為要除滅魔鬼的作為」（約壹 3:8），將來神「要擦去他們一切的眼淚」（啟 21:4）。只講象徵，會讓信徒的盼望失去重量，也無法解釋保羅為何把勝利放在一個歷史事件——十字架上。</p>"],["已然未然說：決定性的勝利已經發生，終局還在路上","","<p>多數福音派學者：十字架是決定性的一戰，敵人的武裝已經被卸下，被公開示眾，結局已定；但凱旋的遊行還沒有走到終點，戰俘還在，世界仍在等候最後的更新。所以信徒一面真實地活在勝利裡——不必再怕、不必再求別的保護；一面仍然面對苦難、與邪惡爭戰、等候主再來。</p><p><strong>難處：</strong>這一說最合經文，卻不能回答每一個具體的「為甚麼是我、為甚麼是現在」，需要牧養的陪伴，而不只是神學的解釋。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採已然未然說。</strong>勝利是決定性的：權勢已經被擄，所以信徒不必恐慌、不必迷信；終局還沒有完全顯明：所以苦難不證明神失敗，也不證明受苦的人信心不夠（紅線七）。</p><p>而且勝利的方式本身就是答案的一部分：不是用更大的力量壓倒，是藉著被釘、被羞辱、被剝去。神沒有站在苦難之外解釋苦難，他進到最深的苦難裡，在那裡誇勝（屬靈爭戰回指以弗所書立場四；爭議與信心見 ISS00_9）。</p>"],["【四】這件事該不該影響你的信心","","<p>這個問題可以問，而且應該被允許問。詩篇裡有一半的禱告，都在問「要到幾時」。</p><p>你不必等到想通了才相信；你可以帶著問題，站在那一位被釘、卻已經誇勝的主旁邊。他知道邪惡有多重，因為他親自擔過。</p>"]],"con":[],"say":"本講義的立場：已然未然——十字架是決定性的勝利，權勢已經被擄，所以不必恐慌；終局還在路上，所以苦難不證明神失敗，也不證明信心不夠。屬靈爭戰回指以弗所書立場四；爭議與信心的全卷立場見 ISS00_9。","care":"會眾席上可能有剛失去家人、正在病中、經歷暴力或災難的人，他們聽到「基督已經勝了」可能會覺得被刺痛。不要對正在流淚的人說「你要有信心」「這一切都有美意」，也不要急著給答案。先陪他哭、陪他坐，允許他問「為甚麼」；會後單獨關心，必要時協助他尋求醫療、哀傷輔導或其他專業協助。"},{"id":"ISS02_7","t":"2:16--17「安息日」——基督徒要守安息日嗎？主日是新的安息日嗎？","r":"2:16--17；羅 14:5--6；來 4:9；可 2:27","ch":[2],"why":"2:16 是安息日爭論的核心經文。華人地區有在星期六敬拜的教會，也有把主日當成「基督徒安息日」嚴格守的傳統，還有認為日子都一樣的信徒；彼此之間常常論斷，甚至互相說對方不得救或是律法主義。這一題直接碰到信徒的家庭、工作排班與教會之間的關係，也是本卷紅線二的本文。","pos":[["【一】經文問的是甚麼","","<p>「所以，不拘在飲食上，或節期、月朔、安息日都不可讓人論斷你們。這些原是後事的影兒；那形體卻是基督。」（2:16–17）<strong>ἑορτῆς ἢ νουμηνίας ἢ σαββάτων</strong>（heortēs ē noumēnias ē sabbatōn）依次是年、月、週的聖日；<strong>σκιὰ……τὸ δὲ σῶμα τοῦ Χριστοῦ</strong>（skia … to de sōma tou Christou）是影兒與形體。問題是：2:16 的安息日包不包括每週的第七日？既然是影兒，基督徒今天還要不要守某一天？</p>"],["安息日派：第七日安息仍是神的誡命","","<p>基督復臨安息日會等傳統認為：2:16 所說的是猶太節期附帶的禮儀性安息，不包括十誡第四誡的第七日；第四誡根植於創造（創 2:2–3），是道德律的一部分，不是影兒；新約也說「必另有一安息日的安息為神的子民存留」（來 4:9）。</p><p><strong>難處：</strong>2:16 年、月、週三層並列，這使我們想起代上 23:31 與何 2:11 的同樣排列，週的那一層最自然就是每週的安息日；σαββάτων（sabbatōn）的複數在新約常指一般的安息日。把它限定為禮儀性安息，文法上較吃力。</p>"],["主日安息日派：安息日的原則轉到主日","","<p>清教徒與部分改革宗、長老會傳統認為：安息的誡命是道德性的，但守的日子因基督復活而轉到七日的第一日；主日就是基督徒的安息日，應當停止一般的工作與娛樂，專心敬拜、行善。</p><p><strong>難處：</strong>新約沒有一處明文說安息日轉到主日；初代教會在七日的頭一日聚會，但沒有把它稱為安息日。若講得太嚴，會把主日變成一條新的律法，正落入 2:16 說的「論斷」。</p>"],["新約成全說：安息日是影兒，形體在基督裡","","<p>許多福音派學者：2:17 說節期、月朔、安息日都是「後事的影兒」，指向基督；在基督裡，人得著了真正的安息（太 11:28）。所以基督徒不受某一天的律法約束，主日聚會是因基督復活而有的群體敬拜，不是新的安息日律法；保羅在羅 14:5–6 說「有人看這日比那日強；有人看日日都是一樣」，各人心裡要意見堅定。</p><p><strong>難處：</strong>這一說若講得不平衡，容易讓人以為休息不重要、可以一週七天工作服事，忽略了創造的節奏與身體的需要。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的判斷：2:16 的重點不在決定哪一天，而在「不可論斷」——兩個方向都不可（紅線二）。</strong>守安息日不是得救的條件；在星期六敬拜、休息的弟兄姊妹，也不因此就是律法主義；主日不是新的律法。本講義以新約成全說為主要讀法，同時尊重安息日派與主日安息日派的弟兄姊妹，不點名攻擊任何教會或宗派。</p><p>安息的原則仍在：「安息日是為人設立的，人不是為安息日設立的」（可 2:27）。休息不是律法逼出來的，是恩典給的——形體已經是我們的了（全卷立場見 ISS00_3）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。三種傳統都承認基督是主、救恩是恩典、安息是神的心意；爭的是日子與方式。</p><p>你守哪一天，比不上你是否在基督裡真的安息。如果你因為工作排班不能在主日聚會，不必覺得被神扣分；如果你在星期六敬拜，也不必害怕被弟兄姊妹看輕。「守日的人是為主守的」（羅 14:6）。</p>"]],"con":[],"say":"本講義的立場：2:16 說「不可讓人論斷你們」——兩個方向都不可：不說守安息日的不得救，也不說守安息日的都是律法主義，不把主日講成新的律法；安息日是影兒，形體是基督，安息的原則仍在，不是律法，是恩典。本講義的全卷立場見 ISS00_3。","care":"會眾席上可能有從安息日教會轉來、仍覺得自己「背叛」了的人，也可能有因為輪班、醫護、服務業工作而主日無法聚會、一直覺得自己不屬靈的人，還有家人在不同教會、為這件事爭吵的家庭。不要在講台上點名任何教會，也不要拿出席率量人的信心。陪輪班的人找到可以敬拜與休息的時段，陪轉換教會的人安靜地分辨，對家庭的爭吵先聽雙方，不急著判對錯。"},{"id":"ISS02_8","t":"2:18「敬拜天使」「拘泥在所見過的」——異象、靈界經驗與屬靈導師怎樣分辨？","r":"2:18--19；約壹 4:1；帖前 5:21；林後 12:7","ch":[2],"why":"2:18 描寫一種用「故意謙虛」、天使與異象來奪去別人獎賞的人。今天的華人教會也有類似的場邊裁判：「沒有某種經驗就不夠屬靈」「沒有被某位導師遮蓋就不能服事」；另一面，也有人一概否定一切屬靈經驗。這一題關係到信徒怎樣看待自己與別人的經驗，也關係到屬靈權柄與屬靈控制的界線，是本卷紅線七的本文。","pos":[["【一】經文問的是甚麼","","<p>「不可讓人因著故意謙虛和敬拜天使，就奪去你們的獎賞。這等人拘泥在所見過的，隨著自己的慾心，無故地自高自大」（2:18），「不持定元首」（2:19）。<strong>θρησκείᾳ τῶν ἀγγέλων</strong>（thrēskeia tōn angelōn）可讀成「向天使的敬拜」或「天使所獻的敬拜」；<strong>ἃ ἑόρακεν ἐμβατεύων</strong>（ha heoraken embateuōn）的 ἐμβατεύων（embateuōn）可能是神秘宗教的入門術語；有古卷作「所沒有見過的」。問題是：保羅反對的是一切異象與靈界經驗，還是某種使用經驗的方式？</p>"],["向天使敬拜說：民間呼求天使的習俗","","<p>受詞屬格的讀法：弗呂家一帶確有呼求天使保護、醫治的民間習俗，後來的教會會議也曾禁止向天使祈禱；歌羅西的錯謬教師把天使當成中保或保護者，要人透過禁戒與謙卑的樣子去討它們的喜悅。</p><p><strong>難處：</strong>這一讀法清楚解釋了「敬拜」，卻不容易解釋 ἃ ἑόρακεν ἐμβατεύων（ha heoraken embateuōn）「進入他所看見的」那一層異象經驗，也不容易解釋為甚麼這些人「自高自大」、要判別人出局。</p>"],["加入天使敬拜說：神秘經驗者自稱升天看見","","<p>主詞屬格的讀法：一些猶太神秘主義者藉著長期禁食與苦修，自稱升到天上，看見天使在寶座前的敬拜並加入其中；回來以後，他們以此為屬靈資格，判那些沒有這種經驗的信徒「出局」。καταβραβευέτω（katabrabeuetō）正是裁判的字。</p><p><strong>難處：</strong>這個背景需要依賴較晚的猶太文獻來重建，歌羅西的情況是否完全如此，學者仍有爭論；而且讀得太細，容易讓人以為今天的問題只有「升天異象」一種形式。</p>"],["否定經驗說：今天的異象與靈界經驗都不可信","","<p>部分傳統認為，正典完成以後，異象、異夢與特殊的靈界經驗都已經不再需要，凡是聲稱有這類經驗的人都應當被懷疑；2:18 正是對一切靈恩經驗的警告。</p><p><strong>難處：</strong>保羅自己有過極大的啟示（林後 12:7），他在 2:18 沒有否認經驗本身，而是給了一個檢驗：「無故地自高自大」「不持定元首」。一概否定，可能嘲笑了弟兄姊妹真實的經歷，也和新約「凡事察驗」（帖前 5:21）的教導不合。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義的判斷：兩種屬格讀法都可能，重點在保羅給的檢驗。</strong>經驗本身不是問題，讓人「無故地自高自大」、讓人需要經過某人才能聽見神、讓基督退到後面、讓人「不持定元首」的，就要被察驗；真從神來的經驗，果效是更謙卑、更平安、更愛人（紅線七）。</p><p>屬靈經驗不分等級，不是勳章；任何導師都不可以用頭銜、異象或「遮蓋」要人絕對順服。真正的裁判，是「基督的平安在你們心裡作主」（3:15）（全卷立場見 ISS00_3；屬靈權柄回指以弗所書立場五、哥林多後書立場三）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。你有沒有某一種經驗，不決定你在基督裡是否已經滿了（2:10）；別人有沒有，也不決定他是否屬靈。</p><p>「一切的靈，你們不可都信，總要試驗那些靈是出於神的不是」（約壹 4:1）。試驗的方式很簡單：它讓我更握緊元首，還是更需要某一個人？</p>"]],"con":[],"say":"本講義的立場：保羅沒有否認屬靈經驗，他給了檢驗——讓人自高自大、讓人不持定元首的，就要被察驗；經驗不分屬靈等級，任何導師都不可以異象或頭銜要人絕對順服。本講義的全卷立場見 ISS00_3；屬靈權柄回指以弗所書立場五、哥林多後書立場三。","care":"會眾席上可能有曾被「先知性的話」決定婚姻、工作而受傷的人，有被屬靈導師控制、要求斷絕家人關係的人，也有因為沒有特殊經驗而覺得自己是次等信徒的人。不要嘲笑他們當初的信任，也不要對沒有經驗的人說「你要更追求」。先聽他說完，肯定他願意分辨的勇氣；涉及屬靈控制或其他傷害的，協助他找到安全的牧養管道與專業協助。"},{"id":"ISS02_9","t":"2:21「不可拿、不可嘗、不可摸」——基督徒的禁戒、禁食與苦修，還有價值嗎？","r":"2:20--23；3:5；提前 4:4；太 6:17--18","ch":[2],"why":"「不可拿、不可嘗、不可摸」是華人教會最常被當成聖經命令的一句話，其實是錯謬教師的口號；2:23 更是全本新約唯一直接說「苦待己身……毫無功效」的一節。可是教會歷史上有禁食、守齋、修道的傳統，今天也有斷食禱告與各種節制操練。基督徒還要不要禁戒？321 的「無己」會不會變成苦修？這一題是本卷紅線三的本文。","pos":[["【一】經文問的是甚麼","","<p>「你們若是與基督同死，脫離了世上的小學，為甚麼仍像在世俗中活著、服從那『不可拿、不可嘗、不可摸』等類的規條呢？」（2:20）和合本把 2:20–21 合成一節，原文 2:21 就是那句口號 <strong>Μὴ ἅψῃ μηδὲ γεύσῃ μηδὲ θίγῃς</strong>（Mē hapsē mēde geusē mēde thigēs）。2:23 說這些規條「用私意崇拜，自表謙卑，苦待己身」，<strong>ἀφειδίᾳ σώματος</strong>（apheidia sōmatos）是「不愛惜身體」。問題是：保羅否定的是一切禁戒與禁食，還是把它們當成屬靈資格、用來對付肉體的那一套？</p>"],["苦修傳統說：克己苦身是成聖的道路","","<p>教會歷史上的修道與苦修傳統認為，藉著禁食、守夜、克制飲食與身體的享受，人可以對付肉體的私慾、更專心親近神；許多聖徒在這條路上留下了美好的見證，主耶穌也說「你禁食的時候，要梳頭洗臉」（太 6:17），預設了門徒會禁食。</p><p><strong>難處：</strong>2:23 直接說苦待己身「在克制肉體的情慾上是毫無功效」；另一種譯法更說它「只滿足了肉體」——苦修反而餵飽了驕傲。當苦修被當成成聖的方法，就很容易變成屬靈成績，甚至成為傷害身體的理由。</p>"],["全然自由說：基督徒不需要任何禁戒與操練","","<p>另一端的讀法認為：既然 2:20–23 否定了規條，基督徒就不必禁食、不必節制、不必任何操練；「凡神所造的物都是好的」（提前 4:4），信徒在基督裡完全自由，談節制就是律法主義。</p><p><strong>難處：</strong>保羅在 3:5 緊接著說「要治死你們在地上的肢體」，耶穌也預設門徒會禁食；自由不是放縱。把 2:20–23 讀成否定一切操練，就把保羅對「方法的錯置」講成了對「操練本身」的否定。</p>"],["方向說：同一件事，向著基督是操練，向著自己是苦修","","<p>多數福音派學者：保羅反對的不是禁食或節制本身，是把它們當成屬靈資格、當成對付肉體的方法、當成判別人出局的標準。2:23 的苦待己身與 3:5 的治死方向相反：一個對付身體，一個對付罪；一個出於人的吩咐，一個出於「與基督一同復活」（3:1）。禁食若是尋求神的方法，就有它的位置；若成了屬靈成績單，就是 2:23 說的毫無功效。</p><p><strong>難處：</strong>「方向」在心裡，不容易從外面看出來；同一個人同一次禁食，動機可能混雜，需要誠實與群體的陪伴。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採方向說（紅線三）。</strong>「不可拿、不可嘗、不可摸」不是聖經命令，是錯謬教師的口號；苦待己身毫無功效。321 的「無己」與 3:5「治死」同一邊、與 2:23「苦待己身」相反：無己是不以自己為中心，不是看輕、傷害、懲罰自己；治死的對象是罪，不是身體，也不是情緒；而且次序不能顛倒——先同復活，才治死。</p><p>禁食與節制仍有它的位置，是尋求神的方法，不是屬靈成績（全卷立場見 ISS00_4；無己不是沒有自己，回指腓立比書立場二）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該，反而應當叫你更自由。你不必靠對自己狠來證明自己屬靈，也不必因為沒有禁食多少天而覺得自己不夠。</p><p>你在基督裡已經滿了（2:10）。如果你想禁食，就像主耶穌說的，「梳頭洗臉」，讓它成為你和父之間安靜的事；如果你的身體或心裡不容許，就不必勉強，神看重的是你的心。</p>"]],"con":[],"say":"本講義的立場：「不可拿、不可嘗、不可摸」是錯謬教師的口號，不是聖經命令；苦待己身毫無功效。321 的無己是不以自己為中心，不是傷害或懲罰自己；禁食與節制是尋求神的方法，不是屬靈成績。本講義的全卷立場見 ISS00_4。","care":"會眾席上可能有曾經或正在自我傷害、有厭食或暴食困擾、對身材極度焦慮的人，也可能有在嚴格苦修群體裡身心耗竭的人；他們聽到「捨己」「治死」「無己」，很容易聽成「再狠一點」。不追問細節，不在小組裡公開討論，不對他說「你要有信心」或「你就是治死得不夠」。會後單獨關心，溫柔地陪伴，並協助他尋求醫療與專業的心理協助；同時提醒帶領禁食活動的同工，不設天數比賽，並明說身體不適者不必參加。"},{"id":"ISS03_1","t":"3:1--2「思念上面的事」——太屬天就對地上沒用嗎？基督徒與社會責任要怎樣看？","r":"3:1--2；3:23；耶29:7；太5:13--16","ch":[3],"why":"有人說基督徒「太屬天，對地上沒用」：只顧聚會與天堂，不關心工作、鄰舍、貧窮與公義；也有基督徒真的這樣理解 3:2，把「不要思念地上的事」讀成不必投入職場、社會與公共事務。另一頭，有人把信仰講成社會改造的工具，「上面」只剩下地上的理想。這一題關乎信徒怎樣同時屬天又在地上忠心。","pos":[["【一】經文問的是甚麼","","<p>「所以，你們若真與基督一同復活，就當求在上面的事；那裡有基督坐在神的右邊。」（3:1）「你們要思念上面的事，不要思念地上的事。」（3:2）<strong>τὰ ἄνω φρονεῖτε</strong>（ta anō phroneite）是心思的定向，而「上面」有一個地址：基督坐在神的右邊。問題是：「地上的事」是指地上一切的事務，還是指 3:5 所說「在地上的肢體」那一類東西？思念上面的人，對地上的工作與社會有沒有責任？</p>"],["出世敬虔說（屬靈優先，地上的事是次要的）","","<p>部分敬虔傳統強調靈魂得救與天上的盼望：世界終要過去，基督徒最重要的是傳福音、讀經禱告、預備主再來；社會參與、政治與公共事務容易使人分心，甚至被世俗同化。這個傳統保護了教會不被時代潮流吞沒，也提醒信徒不要把盼望放在地上的制度裡。</p><p><strong>難處：</strong>保羅說完 3:2，緊接著就講到妻子、丈夫、兒女、僕人與主人，全是地上的事；3:23 要人把地上的工作「像是給主做的」。把「地上的事」讀成地上的一切，會讓信徒在家裡與職場缺席，也讓教會對鄰舍的苦難沉默。</p>"],["社會改造說（上面的國度要在地上實現）","","<p>另一些傳統強調神的國要臨到地上：基督徒的信仰應當化成公義、憐憫與制度的改變，照顧窮人、反對壓迫、參與公共事務，是信仰最真實的表達。這個傳統喚醒了教會對社會的責任，也提醒人不要把敬虔講成只在禮拜堂裡發生的事。</p><p><strong>難處：</strong>若「上面」只剩下地上的理想，基督坐在神右邊的那個位置就被淡化了，福音容易變成一套社會綱領；而且把某一種政治立場等同於神的國，會讓教會分裂，也讓持不同立場的弟兄姊妹覺得自己不夠屬靈。</p>"],["天上眼光、地上忠心說（從上面看，回到地上活）","","<p>認為 3:2 的對比不是「天上的事務」與「地上的事務」，而是兩種定義人的來源：地上的事是讓房子、成績、別人的眼光與 3:5 的私慾來定義我；上面的事是讓坐在神右邊的基督定義我。思念上面的人，正因為知道王坐在寶座上，才能在地上安靜地忠心：在家裡溫柔，在職場誠實，為所住的城求平安（這使我們想起耶利米對被擄者說的「你們要為那城求平安」，耶 29:7）。</p><p><strong>難處：</strong>這個說法平衡，但若只講個人的忠心，容易迴避結構性的不義；它需要被具體化：信徒的「地上忠心」也包括為弱勢說話、在制度裡守住誠實。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採天上眼光、地上忠心說。</strong>處境是：歌羅西的錯謬教師用天使、異象與苦修把人往「上面」拉，那是逃離身體與日常的上面；保羅的上面卻有一個地址，是基督。原則是：讓基督定義我，然後帶著這個身分回到地上。3:1--4:6 的次序本身就是答案——從寶座一路走進廚房、工作的地方，最後走到「對外人」（4:5）。</p><p>社會參與的方式，信徒可以有不同的判斷，不必彼此論斷；但沒有一位思念上面的人，可以對身邊的苦難說「那是地上的事」（全卷立場見 ISS00_1）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你覺得信仰與生活是兩件事。你的工作、你的家、你為鄰舍做的小事，都在「上面」的眼光底下有分量；反過來，你也不必把盼望押在任何一個地上的制度或領袖身上，因為王已經坐著。</p><p>可以問自己一句：這一週，我是讓地上的東西定義我，還是讓基督定義我？然後帶著答案回到辦公室與家裡。</p>"]],"con":[],"say":"本講義的立場：3:2 的「上面」有一個地址，就是坐在神右邊的基督；思念上面不是逃離地上，是讓基督定義我，然後在家裡、職場與城市裡忠心。社會參與的方式可以不同，不必彼此論斷。本講義的全卷立場見 ISS00_1。","care":"會眾席上可能有因為投入社會關懷而被批評「不屬靈」的人，也有因為只顧教會而疏忽家人、事後很懊悔的人，還有對政治議題非常焦慮、與家人因立場撕裂的人。講台上不點名任何政黨或立場，也不嘲笑出世或入世的任何一方。陪伴時，先聽他真正的負擔，幫他找到一個在自己崗位上忠心的具體方式，而不是給他一個新的屬靈標籤。"},{"id":"ISS03_2","t":"3:3「你們已經死了」——那為甚麼我還會犯罪？","r":"3:3--4；3:5；3:9--10；羅6:11；約壹1:8","ch":[3],"why":"許多認真的信徒讀到「你們已經死了」，心裡很困惑：如果我已經死了，為甚麼昨天還發脾氣、還看了不該看的、還說了謊？有人因此懷疑自己根本沒有得救；也有人把這一節講成「真基督徒不會再犯罪」，讓軟弱的人不敢承認軟弱。這一題關乎得救的確據，也關乎一個人怎樣面對自己的失敗。","pos":[["【一】經文問的是甚麼","","<p>「因為你們已經死了，你們的生命與基督一同藏在神裡面。」（3:3）<strong>ἀπεθάνετε</strong>（apethanete）是不定過去式：一次的事實；<strong>κέκρυπται</strong>（kekryptai）是完成式：已經藏好了，現在仍藏著。可是緊接著保羅說「所以，要治死你們在地上的肢體」（3:5），又說「不要彼此說謊」（3:9）——如果已經死了，為甚麼還需要這些命令？問題是：「已經死了」說的是甚麼死？它與今天仍然犯罪的經驗怎樣並存？</p>"],["完全成聖說（今生可以達到不再故意犯罪的完全愛）","","<p>衛斯理傳統與部分聖潔運動認為，神的恩典不只赦免罪，也能在今生潔淨人心，使信徒達到「完全的愛」：不再故意違背所知道的神的旨意。「已經死了」不只是地位，也可以在經歷上真實地實現。這個傳統高舉恩典的能力，喚醒信徒不要對罪妥協。</p><p><strong>難處：</strong>約翰說「我們若說自己無罪，便是自欺，真理不在我們心裡了。」（約壹 1:8）；保羅自己也說「這不是說我已經得著了，已經完全了」（腓 3:12）。若把完全講成可以檢驗的標準，會讓還在掙扎的人懷疑自己，也可能讓人用重新定義罪的方式來維持「完全」。</p>"],["已然未然說（地位已經改變，經歷正在被更新）","","<p>多數改革宗與福音派註釋認為，「已經死了」是在基督裡發生的地位與身分的改變：舊人與基督同釘十字架，罪不再是主人；但新人「在知識上漸漸更新」（3:10），經歷上的成聖是一生的過程。所以保羅才能同時說「你們已經死了」與「要治死」。這與羅 6:11 一致：「向罪也當看自己是死的；向神在基督耶穌裡，卻當看自己是活的。」（羅 6:11）</p><p><strong>難處：</strong>若只講「地位已經改變」，容易讓人把它當作不必改變的理由；「已然」需要「未然」的命令來平衡，否則就變成一張沒有生命的證書。</p>"],["兩性並存說（新舊兩種性情在信徒裡交戰）","","<p>部分傳統（包括一些敬虔派與時代論的教導）認為，信徒裡面同時有舊的罪性與新的屬靈生命，兩者終身交戰：順從新性情就得勝，順從舊性情就跌倒。這個說法很貼近許多信徒的經驗，也讓人明白掙扎不等於沒有得救。</p><p><strong>難處：</strong>3:9--10 說舊人已經脫去、新人已經穿上，保羅沒有說兩個人同時住在裡面；若講成「裡面有兩個我」，容易讓人把犯罪推給「舊的那一個」，也削弱了「已經死了」的確定。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採已然未然說。</strong>「已經死了」是一件已經發生、因信發生的事：與基督同死、同復活、同藏（2:12--3:4）；但新人一直在被神更新（3:10 現在式被動）。所以犯罪的經驗不推翻「已經」，卻證明我們需要「還要」；治死不是去完成一場還沒有發生的死，而是活在那場已經發生的死裡面（全卷立場見 ISS00_4）。</p><p>完全成聖與兩性並存說的提醒都寶貴：前者叫我們不向罪妥協，後者叫我們誠實面對掙扎。但兩者都不可以變成懷疑救恩的理由。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你懷疑自己的得救。一個為自己的罪痛心的人，正是新生命還在他裡面的記號；你的生命藏在神裡面，不是藏在你的表現裡面。</p><p>你能做的，是今天就把那件事帶到主面前認罪，也找一位可信的人同行；然後記得：衣服已經換上了，神還在一針一線地更新你。</p>"]],"con":[],"say":"本講義的立場：「你們已經死了」是已經發生、因信發生的身分改變；新人仍在被神漸漸更新，所以仍需要「治死」與「穿上」。信徒的跌倒不推翻「已經」，卻提醒我們活在「已經」裡面。本講義的全卷立場見 ISS00_4。","care":"會眾席上可能有長期與某一個罪掙扎、已經不敢再認罪的人，也有被教導「真基督徒不會再犯罪」、因而深深懷疑自己的人。講台上不要說「你還犯罪，表示你沒有真的死」。會後若有人說出掙扎，先謝謝他的誠實，不追問細節，陪他讀 3:3 與約壹 1:9；若涉及成癮或強迫行為，協助他尋求專業協助，不把它只當成屬靈問題。"},{"id":"ISS03_3","t":"3:5「治死」——怎樣治死？會不會變成壓抑、自責、自我傷害？","r":"3:5--5；2:20--23；3:1--4；羅8:13","ch":[3],"why":"這是本卷最容易被誤讀、也最可能傷人的一節。有人把治死講成禁食到傷身、責打自己、不准有任何情緒；有人一犯錯就在心裡把自己罵到體無完膚，以為那就是治死老我。也有人因為怕苦修，乾脆不談治死。這一題關乎聖潔，也關乎一個人的身體與心靈會不會被宗教的名義傷害。","pos":[["【一】經文問的是甚麼","","<p>「所以，要治死你們在地上的肢體，就如淫亂、污穢、邪情、惡慾，和貪婪（貪婪就與拜偶像一樣）。」（3:5）<strong>Νεκρώσατε οὖν</strong>（Nekrōsate oun）是全卷第四個「所以」，接在 3:1--4 的同復活、同藏之後；「肢體」馬上被五個罪名重新定義。保羅前一頁才說那些規條「苦待己身，其實在克制肉體的情慾上是毫無功效。」（2:23）問題是：治死的對象是甚麼？方法是甚麼？它和苦待己身有甚麼不同？</p>"],["苦修操練說（以節制身體來對付私慾）","","<p>教會歷史上的修道與苦修傳統，用禁食、守夜、簡樸與身體的操練來對付私慾，相信身體的節制能幫助心靈專注於神。這個傳統留下了寶貴的屬靈紀律：禁食、靜默、簡樸，今天仍可以是尋求神的方法。</p><p><strong>難處：</strong>當操練變成對身體的懲罰、變成屬靈的成績，就正好落入 2:21--23 的「不可拿、不可嘗、不可摸」，保羅說那是「照人所吩咐、所教導的」，而且毫無功效。歷史上也有人因此嚴重傷害身體，或發展出飲食與自我價值的困擾。</p>"],["意志克制說（靠決心與方法戒除罪的行為）","","<p>另一些教導把治死理解為意志的決斷：認清罪、立志不再犯、用具體的方法避開試探（刪除軟體、改變路線、找人監督）。這個說法務實，貼近 Νεκρώσατε 不定過去式命令的果斷語氣，也確實幫助許多人遠離具體的罪。</p><p><strong>難處：</strong>若只有意志，治死就變成另一套靠自己的律法；失敗的時候，人只剩下自責，甚至用罵自己、懲罰自己來補償。它也容易把情緒當成罪來壓抑，讓人不敢向神誠實。</p>"],["復活生命說（先同復活，在基督裡對罪說不）","","<p>認為 3:5 的力量在「所以」前面：已經與基督一同復活（3:1）、生命藏在神裡面（3:3）的人，才能治死。活人才能治死，死人不能治死自己。治死是一個已經活在基督裡的人，對不屬於新生命的東西說不；保羅在羅馬書說「若靠著聖靈治死身體的惡行，必要活著。」（羅 8:13）——對象是惡行，不是身體。具體的方法（避開試探、群體同行、禁食禱告）都是恩典的管道，不是功勞。</p><p><strong>難處：</strong>這個說法若講得太抽象，容易讓人不知道今天具體要做甚麼；它需要和實際的操練與群體的陪伴一起落地。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採復活生命說，並保留操練與方法作為恩典的管道。</strong>治死在同復活之後；對象是 3:5、3:8 的罪的行為與私慾，不是身體，也不是情緒；任何時候都不可把治死講成苦待己身、懲罰自己或傷害自己（紅線三）。禁食與節制是尋求神的方法，不是屬靈成績。</p><p>321 的「無己」與 3:5 的治死站在同一邊，與 2:23 的苦待己身站在相反的一邊：無己是不以自己為中心，不是看輕、傷害、懲罰自己（全卷立場見 ISS00_4；回指腓立比書立場二）。</p>"],["【四】這件事該不該影響你的信心","","<p>如果你曾經用傷害自己、不吃飯、不睡覺來「對付罪」，請你聽清楚：那不是你治死得不夠，神沒有要你懲罰自己。你的生命藏在神裡面，神寶貝你這個人，也寶貝你這個身體。</p><p>你需要的是溫柔的照顧：告訴一位信得過的人，也尋求專業的幫助。罪要對付，你這個人要被保護。</p>"]],"con":[],"say":"本講義的立場：3:5 的治死在 3:1 的同復活之後，治死的是罪的行為與私慾，不是身體、不是情緒；不可把治死或「無己」講成苦待己身、懲罰自己、傷害自己。禁食與節制是尋求神的方法，不是屬靈成績。本講義的全卷立場見 ISS00_4。","care":"這是本章最需要保護人的一題。會眾席上可能有正在自我傷害、有飲食困擾、或長期用罵自己來面對失敗的人，也有曾在苦修式教導下傷了身體的人。講台上要明說「治死不是傷害自己」。會後若有人說出自傷或飲食的困擾，不追問細節，不對他說「你要有信心」「你就是不夠屬靈」；先確認他眼前的安全，會後單獨關心，必要時協助他尋求醫療與心理的專業協助，並持續陪伴。"},{"id":"ISS03_4","t":"3:5「貪婪就與拜偶像一樣」——華人的金錢觀、投資理財與成功神學要怎樣看？","r":"3:5--5；弗5:5；提前6:6--10；路12:15","ch":[3],"why":"華人社會很看重「多賺一點才安心」，投資群組、房價與退休規劃是飯桌上最常聊的話題；有些講台把財富講成信心的記號，「奉獻越多、蒙福越多」。也有人反過來覺得基督徒存錢、投資都是貪心。保羅把貪婪和淫亂寫在同一行，還說它就是拜偶像——這一題關乎每一個信徒的帳本與安全感。","pos":[["【一】經文問的是甚麼","","<p>「貪婪就與拜偶像一樣」（3:5）原文是 <strong>πλεονεξίαν ἥτις ἐστὶν εἰδωλολατρία</strong>（pleonexian hētis estin eidōlolatria）：<strong>πλεονεξία</strong>（pleonexia）字面是「要得更多」，關係子句說它本質上就是拜偶像。弗 5:5 有相同的判斷。問題是：貪婪的界線在哪裡？工作、儲蓄、投資理財算不算貪婪？把財富當作蒙福的記號，是不是另一種拜偶像？</p>"],["成功神學說（信心帶來財富，財富是神的祝福）","","<p>成功神學（興盛福音）認為，神願意祂的兒女在物質上豐盛；信心、宣告與奉獻會帶來財富與健康，貧窮是信心不足或沒有領受應許。這個說法在許多華人教會與媒體中很受歡迎，它提醒人神確實供應、也確實賜福勤勞的人。</p><p><strong>難處：</strong>它把神當成致富的工具，正是把「要得更多」包上屬靈的外衣——3:5 稱之為拜偶像；它也讓貧窮、生病的信徒被暗示為信心不夠，造成很深的傷害。主耶穌說「人的生命不在乎家道豐富。」（路 12:15）</p>"],["安貧簡樸說（財富本身危險，基督徒應當簡樸）","","<p>另一些傳統強調財富的危險：「貪財是萬惡之根」（提前 6:10），主耶穌也說財主進神的國難。所以基督徒應當過簡樸的生活，盡量不積蓄，把多餘的分給窮人。這個傳統帶出許多慷慨與見證，也挑戰了消費主義。</p><p><strong>難處：</strong>若把一切儲蓄、保險、投資都定為貪婪，容易讓負責任的父母與照顧長輩的子女背上罪咎；簡樸若變成一種比較與驕傲，也會成為另一種屬靈的加分。經文禁止的是貪婪，不是錢本身。</p>"],["管家說（錢是工具，問題是誰坐在神的位置上）","","<p>認為貪婪的本質是位置的錯置：讓錢、房子、成就坐在神的位置上，決定我的安全感與價值。所以問題不在擁有多少，而在誰作主：工作、儲蓄、理財都可以是忠心的管家職分，但當我為數字焦慮、睡不著、要得更多才安心時，偶像就已經坐上來了。保羅的解藥是知足：「然而，敬虔加上知足的心便是大利了」（提前 6:6）。</p><p><strong>難處：</strong>「心態」很難量化，容易讓人說「我心裡沒有把錢當神」來迴避具體的檢討；管家說需要落在具體的帳本、時間與奉獻上。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採管家說，並拒絕成功神學。</strong>貪婪是「要得更多」、把錢放在神的位置上；成功神學把神變成致富的方法，正是在基督以外加上一套成功學——這就是歌羅西書所說的「基督＋」（全卷立場見 ISS00_3）。</p><p>具體的檢驗可以落在三處：我為錢焦慮的時間，比禱告多嗎？我做財務決定時，有沒有問過主？我的奉獻與慷慨，是出於感謝，還是為了換回報？3:17 的「藉著他感謝父神」，是貪婪最好的解藥。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你覺得有錢就屬靈、沒錢就不屬靈，也不該讓你為負責任的儲蓄而自責。你的生命藏在神裡面，不在帳戶裡面。</p><p>可以從一件小事開始：這一週每一次打開投資或購物軟體以前，先說一句感謝；看看那一句感謝，會不會讓你少想要一點、多給出去一點。</p>"]],"con":[],"say":"本講義的立場：貪婪是要得更多、把錢放在神的位置上；工作、儲蓄與理財可以是忠心的管家職分，成功神學把神當成致富的工具，是在基督以外再加一套成功學，本講義不採。解藥是知足與感謝。本講義的全卷立場見 ISS00_3。","care":"會眾席上可能有正在負債、失業、投資失利而羞於啟齒的家庭，也有被成功神學教導「沒錢是信心不夠」而深深自責的人，還有因為錢與家人撕裂的子女。講台上不用存款或收入來舉例，不暗示經濟狀況與屬靈程度有關。陪伴時，先聽他的壓力，不急著給理財建議；若涉及債務或賭博，協助他尋求財務與專業協助。"},{"id":"ISS03_5","t":"3:6「神的忿怒」——慈愛的神為甚麼發怒？","r":"3:6--7；羅1:18；約3:36；弗5:6","ch":[3],"why":"許多人一聽到「神的忿怒」就退縮：慈愛的神怎麼會發怒？這是不是舊約的神、嚇人的神？也有人在成長過程中被一位常發怒的父親傷害，聽見「神的忿怒」就想起家裡的吼叫。3:6 還有一個經文鑑別的問題：「那悖逆之子」在有些古卷裡沒有。這一題關乎我們怎樣認識神的聖潔與慈愛。","pos":[["【一】經文問的是甚麼","","<p>「因這些事，神的忿怒必臨到那悖逆之子。」（3:6）<strong>ἔρχεται</strong>（erchetai）是現在式：正在臨到。SBLGNT 有 <strong>ἐπὶ τοὺς υἱοὺς τῆς ἀπειθείας</strong>（epi tous huious tēs apeitheias）「那悖逆之子」，WH、Tregelles 與 NIV 沒有；無論取哪一種，神的忿怒臨到這些行為，意思不變。3:8 列的第一個罪是人的「忿怒」，用的是同一個字。問題是：神的忿怒和人的忿怒一樣嗎？它與神的慈愛怎樣並存？</p>"],["位格公義說（神對罪真實而聖潔的反應）","","<p>多數歷代正統的讀法認為，神的忿怒是聖潔的神對罪真實的、位格的反應：神不是對罪無動於衷的一股力量，祂恨惡傷害祂所造之人的事。「原來，神的忿怒從天上顯明在一切不虔不義的人身上」（羅 1:18）。一位對淫亂、貪婪都無所謂的神，也不會在乎被這些事傷害的人。</p><p><strong>難處：</strong>若講得太像人的脾氣，就讓神看起來喜怒無常；對在暴怒家庭長大的人，這個講法若不小心，會把神講成家裡那位令人害怕的父親。</p>"],["自然後果說（忿怒是神任憑人收割罪的後果）","","<p>部分學者著重羅 1:24--28 三次「任憑」：神的忿怒主要不是主動的懲罰，而是神任憑人走自己選的路，罪自己帶來破碎與死亡。3:6 的現在式「正在臨到」，可以理解為罪在今天已經在毀壞人的生命與關係。</p><p><strong>難處：</strong>這個說法說明了忿怒的一個面向，卻容易把它淡化成「因果」，失去神位格的公義；新約也清楚說到將來的審判（約 3:36 說「神的震怒常在他身上」），不只是今天的後果。</p>"],["末世審判說（忿怒主要指將來的審判）","","<p>另一些讀法著重忿怒的將來面向：3:6 的「必臨到」指主再來時的審判，這與 3:4「他顯現的時候」相對——信徒與基督一同顯現在榮耀裡，不信的人面對審判。這個讀法保持了福音的嚴肅與緊迫。</p><p><strong>難處：</strong>ἔρχεται 是現在式，不只是將來；若只講末日的忿怒，容易變成算日子、製造恐慌，或讓人覺得信仰的動機是害怕，而不是愛。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採位格公義說，並承認忿怒有現在與將來兩個面向。</strong>神的忿怒不是脾氣，是聖潔的神對罪的認真；它與神的慈愛不是兩位神，而是同一位神的兩面——正因為愛，所以恨惡毀壞人的罪。而十字架是兩者相遇的地方：「又塗抹了……字據，把它撤去，釘在十字架上」（2:14）。</p><p>3:6 的經文鑑別陳列兩種讀法即可，不影響意思。講台上一句帶過，不算日子、不製造恐慌（爭議的分寸見全卷立場 ISS00_9）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你害怕神會因為你一次跌倒就棄絕你。3:7 說「你們從前也曾這樣行過」——這張清單描寫的，是福音把人救出來的地方。你的生命藏在神裡面，與基督在一起。</p><p>神的忿怒反而是一個安慰：那些傷害你的事，神不是無所謂的。祂在乎公義，也在乎你。</p>"]],"con":[],"say":"本講義的立場：神的忿怒是聖潔的神對罪真實的反應，不是喜怒無常的脾氣；它有現在與將來兩個面向，與神的慈愛在十字架上相遇。3:6「那悖逆之子」有古卷無此語，意思不變。不算日子、不製造恐慌，爭議的分寸見全卷立場 ISS00_9。","care":"會眾席上可能有在暴怒的父親或配偶身邊長大的人，一聽到「神的忿怒」就身體發緊；也有長期活在罪咎與恐懼裡、覺得神一直在生氣的人。講台上不要用吼叫的語氣講這一節，也不要用「神會懲罰你」來推動會眾。會後若有人說出這樣的懼怕，先聽，不急著糾正他的神學；陪他讀 3:3--4 與 3:12「蒙愛的人」，若懼怕與家庭創傷相連，協助他尋求專業協助。"},{"id":"ISS03_6","t":"3:9--10「已經脫去舊人」——與以弗所書 4:22「要脫去」矛盾嗎？","r":"3:9--10；弗4:22--24；羅13:14；加3:27","ch":[3],"why":"歌羅西書說「你們已經脫去舊人……穿上了新人」，以弗所書卻說「就要脫去你們從前行為上的舊人」——同一位作者、同一天送到的兩封信，一個說已經、一個說還要。有人因此說兩封信互相矛盾，也有信徒困惑：我到底脫了沒有？這一題關乎兩封信的關係，也關乎信徒每天怎樣看自己。","pos":[["【一】經文問的是甚麼","","<p>「不要彼此說謊；因你們已經脫去舊人和舊人的行為，」（3:9）「穿上了新人。這新人在知識上漸漸更新，正如造他主的形像。」（3:10）<strong>ἀπεκδυσάμενοι</strong>（apekdysamenoi）與 <strong>ἐνδυσάμενοι</strong>（endysamenoi）是兩個不定過去式分詞；弗 4:22--24 用的是不定詞。問題是：這兩個分詞是說「因為已經」，還是說「要去做」？如果是「已經」，與以弗所書的「要」怎樣並讀？</p>"],["原因分詞說（已經脫了、已經穿了）","","<p>和合本把兩個分詞譯成原因：「因你們已經脫去……穿上了」。理由是不定過去式，以及 2:11 已經用名詞說「脫去肉體情慾」；脫與穿是與基督同死同活時已經發生的事，命令「不要彼此說謊」建立在這個事實上。</p><p><strong>難處：</strong>希臘文分詞的功能常常可以有不同讀法；而且若只講「已經」，容易讓人覺得不需要再努力，忽略了緊接著 3:12「所以……要穿」的命令。</p>"],["命令分詞說（要脫去、要穿上）","","<p>部分學者認為這兩個分詞帶命令的意味，與 3:8 的命令「要棄絕」平行，也與弗 4:22--24 相合：保羅是在吩咐信徒脫去舊人、穿上新人。這個讀法讓兩封信更一致，也強調信徒的責任。</p><p><strong>難處：</strong>不定過去式分詞跟在命令「不要說謊」後面，最自然的讀法是說明理由；而且 3:10 的「漸漸更新」是現在式被動，主詞是神，不是人自己穿上的成果。</p>"],["已經與還要互補說（身分與生活兩面）","","<p>認為兩封信從兩面說同一件事：歌羅西書著重「已經」——在基督裡，舊人已經脫下、新人已經穿上，這是身分；以弗所書著重「還要」——所以每天要照著這件新衣服的樣子生活。羅 13:14「總要披戴主耶穌基督」與加 3:27「你們受洗歸入基督的都是披戴基督了」，正是同一位保羅說的「還要」與「已經」。</p><p><strong>難處：</strong>這個說法需要說明它不是在調和矛盾，而是保羅本來就有的雙重講法；若講得太快，也可能把兩封信的文法差異抹平。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義在 3:9--10 採原因分詞說，並以「已經與還要」並讀兩封信。</strong>歌羅西書說已經，以弗所書說還要（以弗所書講義第 4 章已詳講舊人新人，本卷只講時態這一筆）。兩封信同一天由推基古送到（全卷立場見 ISS00_7），並不矛盾：衣服已經換上了，所以每天早上要照著這件衣服的樣子出門。</p><p>只講還要，人會焦慮；只講已經，人會懶散。兩個一起，人才站得穩——這也保護了「無己」，不讓它變成一場永遠打不完的仗。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。聖經作者常常用不同的角度說同一件真理，這正顯出福音的豐富，不是矛盾。</p><p>你可以每天早上這樣對自己說：「舊衣服已經脫下了；今天，我要照著新衣服的樣子活。」跌倒的時候，不是新衣服不見了，是你需要重新照著它的樣子站起來。</p>"]],"con":[],"say":"本講義的立場：3:9--10 的兩個分詞是原因——已經脫去舊人、已經穿上新人；以弗所書 4:22--24 說「要脫去」「要穿上」。已經是身分，還要是生活，兩封信並不矛盾。本講義的全卷立場見 ISS00_7。","care":"會眾席上可能有信主多年仍有軟弱、心裡懷疑「我是不是根本沒有脫下舊人」的人，也有因為聽到兩封信「矛盾」而對聖經失去信心的慕道友。講台上平靜地說明兩種讀法，不嘲笑提問的人。陪伴時，先讓他說出困惑，陪他讀 3:10 的「漸漸更新」——更新的人是神，不是他自己一個人在撐。"},{"id":"ISS03_7","t":"3:11「在此並不分」——華人教會的族群、方言、階級與世代，要分堂還是不分？","r":"3:11--11；加3:28；弗2:14；啟7:9","ch":[3],"why":"華人教會常有國語堂、粵語堂、台語堂、英語堂，也有專業人士小組、藍領小組、青年與長輩各自的聚會；有人說這是牧養的智慧，有人說這正是 3:11 所反對的分。移民教會裡，第一代與第二代常常彼此看不懂；城市教會裡，學歷與職業悄悄地成了一道牆。這一題關乎教會怎樣在實際的差異裡活出「惟有基督是包括一切」。","pos":[["【一】經文問的是甚麼","","<p>「在此並不分希臘人、猶太人，受割禮的、未受割禮的，化外人、西古提人，為奴的、自主的，惟有基督是包括一切，又住在各人之內。」（3:11）<strong>οὐκ ἔνι</strong>（ouk eni）是強調的否定：根本沒有；結尾 <strong>τὰ πάντα καὶ ἐν πᾶσιν Χριστός</strong>（ta panta kai en pasin Christos）。問題是：「不分」是指差異消失，還是差異不再決定價值？按語言、族群、世代分開聚會，是牧養的智慧，還是違背了 3:11？</p>"],["同質單位說（按語言族群建立教會，福音最容易傳開）","","<p>二十世紀宣教學提出「同質單位原則」：人最容易在不必跨越語言、文化與階層的地方信主，所以按族群、語言建立教會或聚會，是有效的宣教策略。華人教會的方言堂與世代聚會，確實讓許多人第一次用心裡的語言聽見福音。</p><p><strong>難處：</strong>策略若變成教會的本質，就容易讓教會變成一群「跟我一樣的人」，不再操練 3:12--14 的包容與愛；3:11 正是故意把最難相處的人（西古提人、奴隸）放在同一個身體裡。</p>"],["多元一體說（教會應當是一個跨族群的會眾）","","<p>另一些人主張教會應當刻意成為多族群、多世代、多階層的一個會眾：同一場聚會、同一個講台、同一張餐桌，因為福音最能顯出大能的地方，就是把最遠的人帶到最近（弗 2:14「拆毀了中間隔斷的牆」）。啟示錄天上的敬拜，正是「從各國、各族、各民、各方來的」。</p><p><strong>難處：</strong>在實務上，語言不通的長輩、剛移民的家庭可能在一個大會眾裡反而被邊緣化；「合一」若由多數的一方定義，少數的一方常常被要求適應、被要求安靜。</p>"],["分中有合說（分開牧養，刻意合一）","","<p>認為分堂分組可以是牧養的智慧，但教會必須有刻意的合一結構：聯合聚會、跨堂的同工會、不同世代一起服事、資源與權力的共享，讓沒有一群人比另一群人更重要。3:11 不分的不是差異，而是價值與地位；3:18 起保羅照樣分別對不同的人說話。</p><p><strong>難處：</strong>這需要持續的努力與謙卑，否則「分」很快變成「各過各的」；也需要誠實地面對誰掌握決策、誰的語言是預設的這些不容易說出口的問題。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採分中有合說。</strong>處境是：歌羅西的教會裡有猶太人與外邦人、奴隸與主人，阿尼西謀與腓利門坐在同一個聚會裡；原則是：焦點在基督，差異不再決定一個人在神家裡的價值。今天的落點是：分堂分組可以，但若讓人覺得某一群人比較屬靈、比較重要，3:11 就要說話了（全卷立場見 ISS00_1）。</p><p>可以自己檢查：教會的同工會裡，有沒有說話最少那一群人的聲音？講台上的例子，是不是都來自同一種人的生活？</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你覺得自己屬的那一堂比較好或比較差。你在神家裡的位置，不由你的語言、學歷或年齡決定，而由那位包括一切的基督決定。</p><p>這一週可以做一件小事：認識一位和你不同語言、世代或職業的弟兄姊妹，請他吃一頓飯，聽他說一個故事。</p>"]],"con":[],"say":"本講義的立場：3:11 的「不分」不是差異消失，而是差異不再決定價值；分堂分組可以是牧養的智慧，但教會要刻意建立跨語言、世代、階層的合一。焦點在基督，不在我是哪一種人。本講義的全卷立場見 ISS00_1。","care":"會眾席上可能有覺得自己在教會裡永遠是「外人」的新移民、說不好國語的長輩、聽不懂中文的第二代，也有因為職業或學歷被輕看而默默離開小組的人。講台上不用任何族群或方言開玩笑。陪伴時，先承認他被冷落的經驗是真的，不急著說「我們都是一家人」；幫他找到一位願意同行的人，也把他的聲音帶到同工會裡。"},{"id":"ISS03_8","t":"3:16「詩章、頌詞、靈歌，彼此教導」——詩歌也是教導嗎？","r":"3:16--16；弗5:19；林前14:26","ch":[3],"why":"許多教會把唱詩當成講道前的「暖場」，選歌只看旋律好不好聽、氣氛夠不夠熱；也有人認為敬拜是向神說話，不該拿來教導人。可是 3:16 把唱詩放在「彼此教導，互相勸戒」裡面。這一題關乎我們唱甚麼，也關乎會眾在不知不覺中被詩歌教成了甚麼樣的信仰。（傳統與現代曲風之爭，以弗所書講義第 5 章已並陳，本題不重講。）","pos":[["【一】經文問的是甚麼","","<p>「當用各樣的智慧，把基督的道理豐豐富富地存在心裡，用詩章、頌詞、靈歌，彼此教導，互相勸戒，心被恩感，歌頌神。」（3:16）一個命令 <strong>ἐνοικείτω</strong>（enoikeitō，住下來），三個分詞：<strong>διδάσκοντες</strong>（didaskontes）、<strong>νουθετοῦντες</strong>（nouthetountes）、<strong>ᾄδοντες</strong>（adontes）。和合本註腳提到另一種斷句：「用各樣的智慧」可以屬上，也可以屬下（修飾彼此教導）。問題是：詩歌的功能是向神讚美，還是也在彼此教導？</p>"],["垂直敬拜說（詩歌是向神說話，教導屬於講道）","","<p>強調敬拜的對象是神：詩歌是會眾對神的回應與讚美，講道才是神對會眾說話、教導真理的時候。3:16 的結尾「歌頌神」與弗 5:19「讚美主」都指向神。這個說法保護了敬拜的焦點，不讓唱詩變成給人看的表演或另一場訓話。</p><p><strong>難處：</strong>3:16 明明把詩歌放在「彼此教導，互相勸戒」的分詞底下；弗 5:19 也說「彼此對說」。只把詩歌看成垂直的，會忽略它橫向塑造會眾信仰的力量。</p>"],["水平教導說（唱詩就是在教導，歌詞要像講章一樣審查）","","<p>著重 3:16 的分詞結構：基督的話住在心裡，透過詩歌在會眾之間流動，彼此教導、互相勸戒。會眾記得的歌詞往往比講章多，所以詩歌是最有影響力的教導；選詩應當看神學內容，像審查講章一樣審查歌詞。</p><p><strong>難處：</strong>若只看「教導」，容易讓敬拜變得像上課，失去「心被恩感」的情感與向神的讚美；審查若太嚴，也可能讓新歌與不同文化的表達被一律拒絕。</p>"],["雙向並存說（向神歌頌，同時彼此教導）","","<p>認為 3:16 本身就是雙向的：「彼此教導，互相勸戒」是橫向的，「心被恩感，歌頌神」是縱向的；兩者都從「基督的道理住在心裡」流出來。弗 5:19 的平行處說源頭是被聖靈充滿，歌羅西書說源頭是基督的道理——兩處的果子一樣。所以好的詩歌同時讚美神，也把真理唱進彼此心裡。</p><p><strong>難處：</strong>這個說法需要具體的實踐：誰來選詩？用甚麼標準？否則「雙向」可能只是一個好聽的口號。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採雙向並存說。</strong>詩歌向神歌頌，也在彼此教導：我們唱甚麼，就在教彼此相信甚麼。所以教會選詩，不只是選旋律，也是選神學；可以問三個問題：這首歌讓基督居首位嗎？它說的是真的嗎？唱完以後，我們更認識基督，還是只更認識自己的感覺？</p><p>本卷聖靈只出現一次（1:8），3:16 不必硬講聖靈；曲風之爭回指以弗所書講義第 5 章，本題不重講（爭議的分寸見全卷立場 ISS00_9）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你覺得只有某一種詩歌才屬靈。真正要問的是：你常唱的那些歌，在教你相信一位怎樣的神？</p><p>這一週可以挑一首你最常唱的歌，把歌詞慢慢讀一次，找出它說的是哪一節經文；然後在家裡和家人一起唱，讓基督的道理也住進你家。</p>"]],"con":[],"say":"本講義的立場：3:16 的詩歌是雙向的——向神歌頌，也彼此教導；我們唱甚麼，就在教彼此相信甚麼，所以選詩也是選神學。曲風之爭回指以弗所書講義第 5 章；爭議的分寸見全卷立場 ISS00_9。","care":"教會裡可能有敬拜團的同工覺得自己的選歌被批評，也有長輩或年輕人覺得自己愛唱的歌被說成「沒有神學」，還有因為聲音、音準被嘲笑而不敢唱的人。講台上不點名批評任何一首歌或一位作者。陪伴時，先肯定同工的服事，再一起讀歌詞、一起選；讓不會唱的人知道，「心被恩感」比唱得好更重要。"},{"id":"ISS03_9","t":"3:19、21「不可苦待她們」「恐怕他們失了志氣」——言語的苛刻、冷暴力與打罵教育要怎樣看？","r":"3:18--21；弗5:25；弗6:4；箴13:24","ch":[3],"why":"華人家庭裡，言語的苛刻與冷戰常被當作「個性」或「脾氣」，打罵被說成「打是情，罵是愛」，不誇獎被當成「免得孩子驕傲」。許多信徒在這樣的家庭長大，也不知不覺地這樣對待自己的配偶與孩子。3:19 與 3:21 是以弗所書沒有的兩句話，正好寫給我們。這一題關乎家庭的安全，也關乎一代一代的傷會不會停下來。","pos":[["【一】經文問的是甚麼","","<p>「你們作丈夫的，要愛你們的妻子，不可苦待她們。」（3:19）<strong>μὴ πικραίνεσθε πρὸς αὐτάς</strong>（mē pikrainesthe pros autas），字根是苦：不要心懷苦毒，不要讓她們的日子變苦。「你們作父親的，不要惹兒女的氣，恐怕他們失了志氣。」（3:21）<strong>ἵνα μὴ ἀθυμῶσιν</strong>（hina mē athymōsin），新約只此一次：心灰意冷。問題是：言語的苛刻與冷暴力算不算苦待？管教可以包括體罰嗎？甚麼樣的管教會叫孩子失志？</p>"],["傳統體罰說（管教包括適度的體罰）","","<p>部分傳統根據箴言「不忍用杖打兒子的，是恨惡他」（箴 13:24）等經文，主張適度、有節制的體罰是合乎聖經的管教，目的是糾正，不是發洩；許多華人父母也是這樣被養大的，並且認為那使他們成器。這個傳統認真看待管教的責任，不願意放任孩子。</p><p><strong>難處：</strong>體罰很容易越過界線，變成發洩怒氣與羞辱；3:21 正是在警告父親的權柄可能叫孩子失志。箴言的「杖」是否必然指體罰，學者也有不同讀法；而且許多地方的法律已經限制體罰，涉及受虐必須通報。</p>"],["不體罰說（管教要用話語、後果與關係，不用打）","","<p>另一些基督徒父母與學者認為，箴言的「杖」是牧者引導的意象，不必等於打孩子；新約對父親的命令都是負面的限制（3:21；弗 6:4「不要惹兒女的氣」），重點在不傷害。管教可以透過清楚的界線、合理的後果、陪伴與對話來進行，並且大量地肯定。</p><p><strong>難處：</strong>若把「不打」講成唯一合乎聖經的方式，可能讓上一代或其他文化背景的父母覺得被全盤否定；也有人誤以為不體罰就是不管教，結果讓孩子失去界線。</p>"],["以 3:21 為界的管教說（管教必要，但不可叫孩子失志）","","<p>認為無論方式如何，3:21 給了一條清楚的界線：管教的目的是讓孩子更有志氣去聽從，而不是讓他心灰意冷。常被比較、常被罵、只被糾正不被肯定的孩子，最後不是生氣，是放棄。同樣，3:19 給了夫妻一條界線：不只不可動手，言語的苛刻、當眾的數落、冷戰與用沉默懲罰，都是苦待。</p><p><strong>難處：</strong>「失志」與「苦待」的判斷需要智慧與誠實，容易被各自解讀；需要群體的提醒與專業的知識一起幫助家庭看見自己的盲點。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採以 3:21 為界的管教說；體罰的方式各家並陳，但一律不可打罵羞辱、不可叫孩子失志。</strong>言語的苛刻與冷暴力是 3:19 的苦待；順服不包括忍受暴力，遇到暴力，先保護自己和孩子的安全（紅線四）。以弗所書講義第 5 章已詳講家規的全貌，本題只講歌羅西書多出來的這兩筆（全卷立場見 ISS00_5）。</p><p>天父在約旦河先稱耶穌為愛子，然後才是曠野與事工；一個知道自己被愛的孩子，才有志氣去聽從。這句話是對父親說的，也寫給每一位母親、祖父母與帶孩子的人。</p>"],["【四】這件事該不該影響你的信心","","<p>如果你在打罵、比較或冷暴力中長大，請你聽見：那不是神的心意，神不是那樣的父親。你的生命藏在神裡面，你是「蒙愛的人」（3:12）。</p><p>如果你發現自己正在這樣對待配偶或孩子，這不是絕望的理由，是回頭的時候：今天就說一句「對不起」，也找人幫助你學另一種說話與管教的方式。</p>"]],"con":[],"say":"本講義的立場：3:19 的「苦待」包括言語的苛刻與冷暴力，3:21 的「失志」是打罵、比較與不肯定的後果；管教是需要的，但不可羞辱、不可叫孩子心灰意冷；順服不包括忍受暴力。本講義的全卷立場見 ISS00_5。","care":"會眾席上可能有正在被言語或冷暴力折磨的配偶、在打罵中長大到今天仍不相信自己被愛的人，也有發現自己正在重複上一代的父母。講台上不舉會眾家庭的例子，不說「你父母也是為你好，你要感恩」。會後若有人說出家裡的傷害，先相信他、先確認安全，不追問細節，不要求他原諒或和好，不對正在流淚的人說「你要有信心」；會後單獨關心，必要時協助他尋求專業協助、庇護或依法通報兒童受虐。"},{"id":"ISS04_1","t":"3:22--4:1「僕人」與「主人」——為甚麼歌羅西書對奴隸說得比以弗所書還長？","r":"4:1--1；3:22--25；4:9；弗6:5--9；門1:10--16","ch":[4],"why":"歌羅西書和以弗所書的家規幾乎平行，可是對僕人的話，歌羅西書多了好幾句，對主人卻只有一節。有人因此說保羅只會叫弱勢的人忍耐，也有人說聖經贊成奴隸制。這一題要問：這封信為甚麼這樣寫？它和送信隊伍裡那位逃跑的奴僕阿尼西謀有沒有關係？今天讀這一段的人，該把重量放在哪裡？","pos":[["【一】經文問的是甚麼","","<p>3:22--25 對僕人說了四節：「無論做甚麼，都要從心裡做，像是給主做的，不是給人做的」（3:23），最後說「主並不偏待人」（3:25）；4:1 緊接著對主人說「因為知道你們也有一位主在天上」（4:1）。以弗所書的平行段落（弗 6:5--9）對主人說得比較長，歌羅西書卻把重量放在僕人那一邊。問題是：這個比例反映的是保羅的立場，還是這封信的處境？</p>"],["處境說（阿尼西謀就在送信的隊伍裡）","","<p>許多學者注意到，這封信和腓利門書由同一批人同時送到（4:7--9；門 1:10--12）。逃跑的奴僕阿尼西謀正要回到主人腓利門那裡，而腓利門的家就是歌羅西教會聚會的地方（門 1:2）。保羅對僕人說得長，是因為全教會都會看著這一個回家的奴僕；對主人只說一節，是因為他另寫了一整封信給那位主人。</p><p><strong>難處：</strong>這個說法合理，但經文沒有明說；把整段的比例都歸給一個人的故事，可能低估了家規本身的一般性教導。</p>"],["保守秩序說（保羅要教會不被誤會為顛覆）","","<p>另一派認為，早期教會被外人懷疑是破壞家庭與社會的群體，因為奴隸與主人一同敬拜、彼此稱弟兄。保羅因此特別要求僕人忠心，使福音不被毀謗（這使我們想起提前 6:1）。這是在當時的社會裡保護福音的策略。</p><p><strong>難處：</strong>這個讀法若推到底，容易把家規讀成「維持現狀」，而忽略 4:1「對等」這個在當時幾乎聽不見的字，也忽略 3:11「為奴的、自主的」在基督裡並不分。</p>"],["顛覆從內部說（福音把主人放到主的面前）","","<p>第三種讀法看重字面：同一個 κύριος（kyrios）在這幾節裡交錯出現，地上的主人與天上的主並列；僕人被當作能夠自己回應基督、會從主得基業的人（3:24），主人被提醒自己也是有主人的人。福音沒有發動一場奴隸革命，卻從裡面改變了主人與奴僕的關係，日後鬆動了那個制度的根。</p><p><strong>難處：</strong>這個讀法容易被用來替保羅辯護得太快；今天的讀者仍然要誠實面對：保羅沒有直接要求廢除奴隸制。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採處境說與顛覆從內部說合讀。</strong>僕人段之所以長，很可能因為阿尼西謀就在送信的隊伍裡，三封信同一天送到；4:1 雖然只有一節，卻收在最重的地方：主人頭上也有主，要公道，也要對等。福音沒有一夕推翻奴隸制，但把主人和奴僕放在同一張主的桌子上，這就是後來廢奴的種子。本講義的全卷立場見 ISS00_5。</p><p>今天這一段不可只拿來要求員工忍耐，必須讀到 4:1；順從不包括忍受違法、霸凌與作假。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你以為聖經贊成人可以買賣人。經文在一個奴隸制的世界裡說話，卻把奴僕稱為「親愛忠心的兄弟」（4:9），把主人放在天上那位主的面前；腓利門書更請主人把奴僕接回來，「不再是奴僕，乃是高過奴僕，是親愛的兄弟」（門 1:16）。</p><p>你若曾經被人當作工具，這一段要告訴你的是：在主面前，你從來不是一件財產。</p>"]],"con":[],"say":"本講義的立場：歌羅西書的僕人段較長，很可能因為阿尼西謀就在送信的隊伍裡；4:1 把主人放在天上那位主面前，要公道也要對等。福音沒有一夕推翻奴隸制，卻把主人和奴僕放在同一張主的桌子上。本講義的全卷立場見 ISS00_5。","care":"會眾席上可能有正在被雇主苛待的移工、外傭與基層員工，也可能有家族裡曾經是童養媳、長工或被當作勞力使用的長輩。講這一段時不要只對弱勢的一方說忍耐，也不要把聖經講成壓迫者的工具。會後若有人說出自己被剝削、被扣證件、被霸凌，先相信他、不追問細節，協助他找勞工單位、法律或專業協助；不要勸他「為了見證再忍一忍」。"},{"id":"ISS04_2","t":"4:1「公公平平地待僕人」——基督徒老闆的工資、加班與勞動條件該怎樣看？","r":"4:1--1；3:25；雅5:4；申24:14--15；弗6:9","ch":[4],"why":"許多基督徒是老闆、主管、店長，也有許多家庭請了移工或外傭。教會常教員工要忠心、要從心裡做，卻很少具體談老闆該給甚麼：加班費、休假、保險、資遣、證件。有人甚至以「我們是基督徒公司」為由要求員工無償奉獻時間。4:1 的「公公平平」今天落在哪裡，是一個每週都要面對的問題。","pos":[["【一】經文問的是甚麼","","<p>「你們作主人的，要公公平平地待僕人，因為知道你們也有一位主在天上。」（4:1）「公公平平」原文是兩個帶冠詞的受詞：<strong>τὸ δίκαιον</strong>（to dikaion），合乎公義的；<strong>τὴν ἰσότητα</strong>（tēn isotēta），對等、均平，林後 8:13--14 同一個字。動詞 παρέχεσθε（parechesthe）是「從自己手裡拿出來」。問題是：這是一個抽象的態度，還是包括具體的工資與條件？</p>"],["態度說（重點在心，不在制度）","","<p>有人認為 4:1 說的是主人的心態：記得自己也有主，就不會苛刻；至於工資多少、工時多長，是市場與法律的事，聖經沒有給具體數字，教會不宜介入。基督徒老闆只要待人和善、不刻意剝削，就算是「公公平平」。</p><p><strong>難處：</strong>「公道」在舊約有非常具體的內容：「要當日給他工價，不可等到日落」（申 24:15）；雅各書更說「你們虧欠他們的工錢，這工錢有聲音呼叫」（雅 5:4）。只講態度不講工資，正是讓剝削披上和善外衣的方法。</p>"],["法律說（守法就是公道）","","<p>另一派主張，今天的勞動法已經規定了最低工資、工時與保險，基督徒老闆只要合法經營，就盡了 4:1 的本分；超過法律的要求，是恩典與慷慨，不是義務。這個說法給了一條清楚可行的底線。</p><p><strong>難處：</strong>法律是最低標準，而且常常有灰色地帶：責任制、派遣、外傭不適用工時規定。「對等」這個字要求的不只是合法，而是把對方當作與自己站在同一位主面前的人。</p>"],["對等說（公道加上把人當人看）","","<p>著重第二個字 ἰσότης（isotēs）：主人要把該給的給出來，也要用對等的眼光看待那個人——他的時間、身體、家庭與尊嚴，和主人自己的一樣寶貴。這使我們想起利 25:43「不可嚴嚴地轄管他，只要敬畏你的神」。今天落在：按時、按約、按法給足工資與加班費，不扣證件，給休假，不以「教會公司」為由要求無償加班。</p><p><strong>難處：</strong>這個讀法要求高，小本經營的老闆可能覺得做不到；但它提供的是方向，不是一夕達成的標準。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採對等說，以法律說為底線。</strong>4:1 的公道是具體的：工資、工時、加班費、保險、休假按時按約按法給足；對等是記得這個人和我站在同一位主面前。基督徒老闆不可以用「屬靈」的語言要員工犧牲應得的權益；反過來，員工的順從也不包括配合違法、忍受霸凌、替公司作假。本講義的全卷立場見 ISS00_5。</p><p>那位在天上的主，同時看著兩邊。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你懷疑神是否看見。如果你是被虧待的員工，經文說工錢有聲音呼叫，主並不偏待人（3:25）；如果你是老闆，這一節不是要定你的罪，是邀請你把你的公司也交在主的手下。</p><p>信心的落點是：我的工資單、我的排班表，也是在主面前寫的。</p>"]],"con":[],"say":"本講義的立場：4:1 的「公公平平」包括公道與對等——工資、工時、加班費、保險、休假按時按約按法給足，並把員工當作與自己同在主面前的人。員工的順從不包括配合違法、忍受霸凌、作假。本講義的全卷立場見 ISS00_5。","care":"會眾席上有老闆，也有被老闆虧待的人，有時坐在同一排。講台不點名、不舉會眾公司的例子。對正在職場被霸凌、被扣薪、被迫作假的人，牧者要先聽、相信他的處境，協助他了解勞動法規與申訴管道，必要時轉介法律協助；不要對他說「這是神在磨練你」。對感到被定罪的老闆，陪他具體檢查一項制度，而不是只留下罪疚感。"},{"id":"ISS04_3","t":"4:2「警醒感恩」——禱告要多長？「警醒禱告」是甚麼？","r":"4:2--2；可14:38；帖前5:17；腓4:6；路18:1","ch":[4],"why":"有人以禱告時數衡量屬靈，通宵禱告才算恆切；也有人覺得禱告只是形式，一句「主啊幫助我」就夠了。「警醒」又常被講成末世的恐懼或屬靈爭戰的緊張。許多上班族、照顧長輩的人、身體軟弱的人，因此對自己的禱告充滿罪疚。這一題要問：保羅說的恆切與警醒，到底是甚麼？","pos":[["【一】經文問的是甚麼","","<p>「你們要恆切禱告，在此警醒感恩。」（4:2）<strong>προσκαρτερεῖτε</strong>（proskartereite）是現在命令式，有「黏住不放、堅持」的意思（徒 1:14 同一個字）；<strong>γρηγοροῦντες</strong>（grēgorountes）是「醒著」，主在客西馬尼說「總要警醒禱告，免得入了迷惑」（可 14:38）；<strong>ἐν εὐχαριστίᾳ</strong>（en eucharistia）是「在感謝中」，全卷第六次感謝。問題是：恆切是時間長，還是不放手？警醒是甚麼樣子？</p>"],["時數說（恆切就是長時間、定時的禱告）","","<p>這一派強調紀律：每天固定的禱告時間、禁食禱告、通宵禱告會，是教會復興的動力；歷代的復興也常與長時間的禱告連在一起。恆切就是把時間分別出來，不讓忙碌吞掉禱告。這提醒現代人，禱告需要被放進行事曆。</p><p><strong>難處：</strong>主耶穌說「不可像外邦人，用許多重複話，他們以為話多了必蒙垂聽」（太 6:7）。以時數衡量屬靈，容易讓禱告變成功德，也讓輪班工作、照顧病人、身體軟弱的人覺得自己不夠格。</p>"],["持續關係說（不住地禱告，是不離開神的同在）","","<p>另一派讀「不住地禱告」（帖前 5:17）為一種生活的方向：在工作、走路、開車時，心一直向著神；恆切是不放棄，就像主「設一個比喻，是要人常常禱告，不可灰心」（路 18:1）。重點不在一次多長，在不肯放手。</p><p><strong>難處：</strong>若只講「隨時禱告」，容易變成甚麼時候都沒有真正停下來禱告；沒有任何分別出來的時間，「持續」常常只是口號。</p>"],["警醒是末世緊張說","","<p>有人把「警醒」讀成末世的戒備：要時時預備主再來，防備撒但的攻擊，因此禱告帶著緊張與爭戰的氣氛。新約確實常把警醒與主再來連在一起（這使我們想起帖前 5:6）。</p><p><strong>難處：</strong>4:2 把警醒放在「感恩」裡面，而不是放在恐懼裡；本卷的果效是平安，不是恐慌（紅線七）。把警醒講成焦慮，會讓禱告變成擔心的延長。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採持續關係說，並保留分別出來的時間。</strong>恆切是黏住不放，重點不在一次多長；警醒是醒著禱告，而保羅把感恩放進警醒裡——一個邊禱告、邊數算恩典的人，比較不容易睡著，也比較不容易把禱告變成抱怨清單。每天有一段短而固定的禱告時間是好的操練，但不是屬靈的成績（全卷立場見 ISS00_3：禱告不可成為「基督＋」的功德）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你被罪疚壓垮。門徒在客西馬尼睡著了，主說「你們心靈固然願意，肉體卻軟弱了」（太 26:41）——他知道人會累。你若只能在醫院的走廊、在捷運上、在照顧孩子的空檔斷斷續續地禱告，那仍然是恆切。</p><p>今晚就從一件感謝開始。</p>"]],"con":[],"say":"本講義的立場：4:2 的恆切是不放手，不是比時數；警醒是醒著、帶著感恩禱告，不是帶著恐懼。固定的禱告時間是好的操練，但不是屬靈成績。本講義的全卷立場見 ISS00_3。","care":"會眾席上有夜班工作的人、照顧失智長輩的人、慢性病的人、剛生產的母親，他們最常因為「禱告不夠」而自責。不要在講台上用禱告時數比較會友，也不要對正在流淚的人說「你要多禱告就好了」。會後單獨關心那些說自己「已經不會禱告了」的人，陪他用一句話、一首詩歌開始；若他長期無望、失眠，協助他尋求專業協助。"},{"id":"ISS04_4","t":"4:3「開傳道的門」——門是神開的，還是人要去敲的？","r":"4:3--4；4:5--6；徒14:27；林前16:9；啟3:20","ch":[4],"why":"教會常用「主為我們開了門」形容一個新的機會，也常用業績與目標推動傳福音：每人每年帶幾個人決志、幾個人受洗。有人因此等候「門開」而甚麼都不做，也有人覺得門都要靠自己撞開，對朋友施壓。這一題要問：保羅求「開傳道的門」，神與人各做甚麼？","pos":[["【一】經文問的是甚麼","","<p>「也要為我們禱告，求神給我們開傳道的門，能以講基督的奧祕（我為此被捆鎖）」（4:3）。<strong>ἵνα ὁ θεὸς ἀνοίξῃ ἡμῖν θύραν τοῦ λόγου</strong>（hina ho theos anoixē hēmin thyran tou logou），主詞是神；「門」的所有格說明門的用途：為話語的門，不是監獄的門。4:4 接著求「按著所該說的話將這奧祕發明出來」。問題是：人在開門這件事上的角色是甚麼？</p>"],["神主權說（門只由神開，人只要禱告等候）","","<p>這一派強調主詞是神：保羅自己在監中，不能做甚麼，只能請人禱告；使徒行傳也說「神怎樣為外邦人開了信道的門」（徒 14:27）。人的話術、策略、活動都打不開人心，只有神能開導人的心（這使我們想起徒 16:14 呂底亞）。所以教會最重要的事工是禱告。</p><p><strong>難處：</strong>若只講等候，容易成為不作為的藉口；4:5--6 緊接著要人「用智慧與外人交往」「把時機買回來」，門開了，人還是要走進去、要開口。</p>"],["人的責任說（門要人去敲、去推）","","<p>這一派強調主的大使命與人的主動：要有策略、有計畫、有訓練，主動去接觸人；不去敲門，門不會自己打開。許多宣教運動與佈道法因此結出果子，教會也因此不至於只顧自己。</p><p><strong>難處：</strong>推到極端就成了業績式、施壓式的傳福音：人數目標、決志的統計、對朋友的緊迫盯人。這與 4:6「回答各人」——對方先問、每一個人都不一樣——的精神相反，也容易讓人把別人的決定當作自己的成績（紅線八）。</p>"],["合作說（神開門，人禱告、預備、走進去）","","<p>第三種讀法照經文的次序：先禱告求神開門（4:3），再求講得明白（4:4），然後用智慧行事、把時機買回來（4:5），最後是帶著恩典、用鹽調和的話回答每一個人（4:6）。神開門，人預備；神給時機，人看見並付代價留住它。傳福音者的功課是忠心與清楚，結果交在神手裡。</p><p><strong>難處：</strong>這個讀法平衡，但實際上仍需要分辨：甚麼時候是門開了、甚麼時候是自己在硬推，沒有公式可套。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採合作說。</strong>門是神開的，這一句替所有傳福音的人卸下重擔：我們不必把門撞開，也不必用話術撬開；我們禱告、預備、看見時機、用調了鹽的話回答。傳福音不是業績，不訂人頭目標，不公開比較成果，不抓住人逼他當場決志。保羅這位最會傳福音的人，第一個動作是請人為他禱告。</p><p>鎖鍊也可能是一扇門：保羅在羅馬「凡來見他的人，他全都接待」（徒 28:30）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你因為朋友還沒有信主而自責。你為他禱告、陪他、在他問的時候回答，就已經忠心了；開門的是神。反過來，也不必因為自己口才不好而不敢開口——保羅求的是講明白，不是講漂亮。</p><p>今天就從為一個名字禱告開始。</p>"]],"con":[],"say":"本講義的立場：開傳道的門的是神；人的本分是禱告、預備、看見時機，用帶著恩典、用鹽調和的話回答各人。傳福音不是業績，不施壓、不比較成果。","care":"會眾席上有為不信的配偶、父母、兒女禱告了許多年的人，聽到「門開了」的見證，常常更加難過；也有曾被教會用業績壓過、因此不敢再傳福音的人。不要對他們說「是你禱告不夠」「是你見證不好」。會後陪他們把這份重擔交還給神，也陪他們找一個不施壓、可以長久同行的方式，繼續愛那個人。"},{"id":"ISS04_5","t":"4:5「愛惜光陰」——效率主義與安息該怎樣取捨？","r":"4:5--5；弗5:16；可2:27；可6:31；詩127:2","ch":[4],"why":"「愛惜光陰」常被印在時間管理的課程與教會的年度計畫上，用來勉勵人把每一分鐘排滿、不浪費時間。結果許多同工過勞、家庭被犧牲，休息被看成懶惰。也有人反過來覺得談安息就是不夠火熱。這一題要問：保羅說的光陰是甚麼？愛惜光陰的人，可以休息嗎？","pos":[["【一】經文問的是甚麼","","<p>「你們要愛惜光陰，用智慧與外人交往。」（4:5）原文 <strong>τὸν καιρὸν ἐξαγοραζόμενοι</strong>（ton kairon exagorazomenoi）是「把時機買回來」；<strong>καιρός</strong>（kairos）不是時鐘上的 χρόνος（chronos），而是合宜的時刻。弗 5:16 用同一個片語，歌羅西書把它放進與「外人」的交往裡。問題是：這是要人把時間排滿，還是要人看見那一個時刻？</p>"],["效率說（不浪費任何一分鐘）","","<p>這一派把「愛惜光陰」讀為善用時間的總原則：人生短暫，主再來的日子近了，所以要有計畫、有效率，把時間投資在最有永恆價值的事上。這一派的優點是對抗懶散與娛樂成癮，提醒人時間是神的託付。</p><p><strong>難處：</strong>經文用的字是 καιρός（kairos），不是時鐘；把它讀成效率，就把一個關係的命令讀成了管理的口號。主耶穌自己會說「你們來，同我暗暗地到曠野地方去歇一歇」（可 6:31）。效率主義常常讓人連看見一個人嘆氣的空間都沒有。</p>"],["時機說（看見並付代價留住合宜的時刻）","","<p>另一派照上下文讀：4:5 是對「外人」說的，所以「把時機買回來」是看見那些不常來、也不等人的時刻——同事的嘆氣、鄰居的病痛、朋友忽然的提問——並且付一點代價把它留住：多坐一會兒、改一個行程、放下手機。這需要的不是更滿的行事曆，而是更有空間的生活。</p><p><strong>難處：</strong>這個讀法容易被拿來為鬆散的生活辯護；看見時機也需要紀律，不是想到才做。</p>"],["安息說（安息是看見時機的前提）","","<p>第三種讀法把本卷 2:16--17 與這一節連起來：安息日是影兒，形體是基督；守日子不是得救的條件，但安息的原則仍在。主說「安息日是為人設立的，人不是為安息日設立的」（可 2:27）。一個在基督裡已經滿了、不必再證明自己的人，才能停下來；停下來的人，才看得見時機。</p><p><strong>難處：</strong>若把安息講成另一套規條（哪一天、做甚麼不做甚麼），又會回到 2:16 被人論斷的處境。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採時機說，並以安息說為根。</strong>愛惜光陰不是把每一分鐘排滿，是看見合宜的時刻並付代價留住它；一個被行事曆塞滿的人，反而甚麼時機都買不到。安息不是律法，是恩典——在基督裡已經得了豐盛（2:10）的人，不必用忙碌證明自己。守日子的方式，守的與不守的都不可彼此論斷。本講義的全卷立場見 ISS00_3。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你以為休息就是不愛主。如果你已經過勞，這一節不是要你更忙，是邀請你停下來，看見神放在你身邊的那一個人。「惟有耶和華所親愛的，必叫他安然睡覺」（詩 127:2）。</p><p>愛惜光陰的第一步，可能是今晚早一點睡。</p>"]],"con":[],"say":"本講義的立場：4:5「愛惜光陰」原文是把時機買回來，是看見合宜的時刻，不是效率主義；安息不是律法而是恩典，停下來的人才看得見時機。本講義的全卷立場見 ISS00_3。","care":"會眾席上有身兼數職、已經燃盡的同工，也有因為失業、生病、退休而覺得自己「浪費時間」、沒有價值的人。不要用「愛惜光陰」責備休息的人，也不要對正在燃盡的人說「為主擺上是值得的」。會後陪同工檢視一份可以卸下的服事；若有人長期失眠、無望、身心俱疲，協助他尋求專業協助。"},{"id":"ISS04_6","t":"4:6「好像用鹽調和」——基督徒在網路與社群媒體上怎樣說話？","r":"4:6--6；4:5；彼前3:15--16；雅1:19；弗4:29","ch":[4],"why":"今天許多基督徒最常與「外人」交往的地方，是留言區、群組與社群媒體。有人在網路上替信仰辯護，用詞尖酸、嘲諷、截圖羞辱；有人在家族群組轉傳未經查證的訊息；也有人乾脆不說，怕起衝突。這一題要問：4:6 的鹽，在螢幕上是甚麼味道？","pos":[["【一】經文問的是甚麼","","<p>「你們的言語要常常帶著和氣，好像用鹽調和，就可知道該怎樣回答各人。」（4:6）「和氣」原文 <strong>ἐν χάριτι</strong>（en chariti）是「在恩典中」；<strong>ἅλατι ἠρτυμένος</strong>（halati ērtymenos）是「已經用鹽調好味的」，「好像」是和合本補的；<strong>ἑνὶ ἑκάστῳ ἀποκρίνεσθαι</strong>（heni hekastō apokrinesthai）是回答每一個人。問題是：鹽是指機智犀利，還是指保存與提味？在一對多、看不見臉的網路上，「回答各人」怎樣做？</p>"],["機智說（鹽是犀利、有說服力的口才）","","<p>學者觀察到，希臘修辭家用「鹽」形容機智、有味道的談吐。有人因此主張基督徒在公共討論中要有說服力、能一針見血地指出錯謬，甚至用幽默與諷刺吸引注意；護教的文章與影片因此常以「犀利」為賣點。</p><p><strong>難處：</strong>4:6 的鹽是在恩典裡的鹽，先有恩典才有鹽；犀利一旦脫離恩典，就成了辣椒，刺激人、壓倒人。網路上的「贏了辯論」常常輸了那個人。</p>"],["保存說（鹽是使話語不腐壞、合乎真理）","","<p>另一派從猶太傳統讀：鹽是保存與盟約（這使我們想起利 2:13），所以有鹽的話是不腐敗的話——「污穢的言語一句不可出口，只要隨事說造就人的好話，叫聽見的人得益處」（弗 4:29）。在網路上，這意味著不轉傳未經查證的訊息、不散布謠言、不說誇大的話。</p><p><strong>難處：</strong>若只重保存，容易變得乏味、說教，或只在信徒圈內說話，失去與外人交往的能力。</p>"],["回答說（先聽，再一個一個地回答）","","<p>第三種讀法看重「回答各人」：對方先開口，我們才回答，而且每一個人都不一樣。彼得說「有人問你們心中盼望的緣由，就要常作準備，以溫柔、敬畏的心回答各人」（彼前 3:15）；雅各說要「快快地聽，慢慢地說，慢慢地動怒」（雅 1:19）。網路上這意味著：先讀懂對方，不急著回；重要的對話移到私訊、電話或面對面。</p><p><strong>難處：</strong>網路的公開性使「一個一個」很難做到；有時沉默也會被讀成默認，需要智慧分辨何時公開回應。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採保存說與回答說合讀，並保留機智的位置。</strong>先有恩典，才有鹽；鹽讓話有味道、讓真理不腐壞，但鹽不是辣椒，放多了整鍋都不能吃。在網路上：不嘲笑、不截圖羞辱持不同信仰或立場的人，不轉傳未經查證的訊息，先聽懂再回答，把重要的對話帶到看得見臉的地方。今天的留言區也是一張餐桌。</p><p>對耶和華見證人與其他信仰的朋友，4:5--6 正是寫給這種對話的（全卷立場見 ISS00_2）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你以為信仰要靠辯贏來守住。基督在凡事上居首位，不需要我們用尖酸的話替他爭面子；反過來，你在網路上被嘲笑、被攻擊，也不需要以牙還牙。</p><p>你可以關掉螢幕，為那個人禱告，然後找一個機會，好好地回答一個真正在問的人。</p>"]],"con":[],"say":"本講義的立場：4:6 的鹽是在恩典裡的鹽——保存、提味、不腐壞，不是尖酸的辣椒。在網路上先聽再答、不嘲笑、不轉傳未經查證的訊息。與其他信仰朋友的對話，本講義的全卷立場見 ISS00_2。","care":"會眾席上有在網路上被基督徒攻擊過而離開教會的人，也有因為信仰在家族群組裡被嘲笑、被長輩罵的年輕人，還有曾經在網路上說了傷人的話、至今後悔的人。不要在講台上截圖示眾任何人。陪受傷的人整理他們的經歷，不要求他們立刻原諒；陪後悔的人具體地道歉或修補，而不是只停在自責裡。"},{"id":"ISS04_7","t":"4:10「馬可」——一個曾經半途而廢的人，可以再被接納嗎？","r":"4:10--11；徒13:13；徒15:36--39；提後4:11；門1:24","ch":[4],"why":"每一間教會都有半途離開的人：退出團隊的同工、跌倒後消失的領袖、在宣教工場撐不下去回來的人。教會常有兩種極端：有人說「他既然離開過，就不能再信任」，有人說「既然悔改了，就該立刻恢復原職」。馬可的故事與保羅的改變，給這一題一個難得的真實範例。","pos":[["【一】經文問的是甚麼","","<p>「巴拿巴的表弟馬可也問你們安。（說到這馬可，你們已經受了吩咐；他若到了你們那裡，你們就接待他。）」（4:10）<strong>δέξασθε αὐτόν</strong>（dexasthe auton）是不定過去式命令。多年前馬可在第一次宣教旅程中途離開（徒 13:13），保羅因此不肯再帶他，與巴拿巴「起了爭論，甚至彼此分開」（徒 15:39）。問題是：這段關係怎樣修復？接納的條件是甚麼？</p>"],["保羅原本是對的說（使命需要可靠的人）","","<p>有人認為保羅在徒 15 的判斷是合理的：宣教艱險，需要可靠的同工，不能因為情面而冒險；馬可後來成熟，是因為巴拿巴另外帶他、給他時間，而不是保羅當初錯了。接納需要時間與證據，不能只憑一句悔改。</p><p><strong>難處：</strong>這個讀法保護了使命，但容易讓教會把失敗過的人永遠放在觀察名單上；保羅後來說馬可「在傳道的事上於我有益處」（提後 4:11），顯示他自己的看法也改變了。</p>"],["巴拿巴是對的說（恩典給人第二次機會）","","<p>另一派看重巴拿巴——「勸慰子」——不肯放手：他看見馬可裡面神的工作，願意承擔風險。教會應當像巴拿巴，給半途而廢的人第二次機會；歷史證明，馬可後來寫了一卷福音書（依照教會傳統）。</p><p><strong>難處：</strong>若只講恩典不講過程，容易讓真正需要被處理的問題被跳過；特別是涉及傷害他人、權勢濫用的失敗，「第二次機會」不等於立刻恢復原職。</p>"],["雙方都成長說（接納是一段過程）","","<p>第三種讀法認為：兩位都有道理，也都有成長。巴拿巴的堅持給了馬可空間，馬可自己也成熟了，保羅也改變了看法；到了 4:10，保羅不只接納他，還親自替他寫推薦，要教會「接待他」。接納不是一瞬間的決定，是一段有人陪伴、有人負責、也有時間的過程。</p><p><strong>難處：</strong>經文沒有告訴我們修復的細節，我們不能把它講成一套固定的程序。</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採雙方都成長說。</strong>半途而廢不是一個人的結局；被保羅拒絕過的人，後來成了保羅點名要的人。這中間有巴拿巴不肯放手，也有保羅肯改變看法。教會要為曾經離開、曾經失敗的人預備一條回來的路：有人陪伴、有人負責，按著實際的改變逐步恢復託付。若涉及傷害他人，先保護受傷的人，饒恕不等於恢復原職（回指哥林多後書立場四）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你以為自己的失敗就是終點。如果你是那個半途離開的人，馬可的名字寫在這裡，是要告訴你：主的名單上還有你的位置。「我深信那在你們心裡動了善工的，必成全這工」（腓 1:6）。</p><p>如果你是曾經拒絕別人的那一位，保羅也給了你一條路：改變看法，不是軟弱。</p>"]],"con":[],"say":"本講義的立場：半途而廢不是一個人的結局；教會要為曾經失敗的人預備一條有人陪伴、有人負責的回來之路，按實際改變逐步恢復託付。若涉及傷害他人，先保護受傷的人，饒恕不等於恢復原職。","care":"會眾席上有從宣教工場或服事崗位上「敗退」回來、不敢再見人的同工，也有被教會領袖傷害過、看到加害者被「快速恢復」而再次受傷的人。兩種人都需要被看見。不要對失敗的人說「你讓主失望了」，也不要對受害者說「保羅都接納馬可了，你也要接納」。會後單獨關心，必要時協助尋求輔導與專業協助。"},{"id":"ISS04_8","t":"4:14「底馬」——基督徒會「離棄」嗎？","r":"4:14--14；提後4:10；門1:24；約10:28；約壹2:19","ch":[4],"why":"底馬在這裡還是同工、還在問安的名單裡；幾年後保羅寫「底馬貪愛現今的世界，就離棄我」。講台常用底馬嚇人：「你若太愛世界，就會像底馬一樣沉淪」。許多正在信心低谷的人因此更加害怕，也有家長用這個名字指著離開教會的孩子。這一題關乎得救的確據，也關乎我們怎樣談論離開的人。","pos":[["【一】經文問的是甚麼","","<p>「所親愛的醫生路加和底馬問你們安。」（4:14）<strong>καὶ Δημᾶς</strong>（kai Dēmas）只有名字，沒有形容詞；腓利門書稱他為同工（門 1:24）。這使我們想起提後 4:10：「因為底馬貪愛現今的世界，就離棄我往帖撒羅尼迦去了」（提後 4:10）。問題是：底馬離棄的是保羅，還是信仰？一個真基督徒會失去救恩嗎？</p>"],["失去救恩說（亞米念傳統）","","<p>亞米念傳統與衛斯理宗認為，信徒有可能因持續、刻意地離棄信仰而失去救恩；希伯來書的嚴重警告（這使我們想起來 6:4--6）是真實的，不是假設。底馬因此是一個嚴肅的警告：同工也會走掉。</p><p><strong>難處：</strong>經文沒有說底馬離棄了基督，只說「離棄我」，往帖撒羅尼迦去；把他判為沉淪，是替經文說它沒有說的話。這個說法若講得不慎，容易使痛悔、軟弱的人失去確據。</p>"],["蒙保守說（改革宗：真信徒必蒙保守到底）","","<p>改革宗傳統根據「我又賜給他們永生；他們永不滅亡，誰也不能從我手裡把他們奪去」（約 10:28），認為真信徒必蒙神保守；徹底離開的人，可能從來沒有真正屬於基督（這使我們想起約壹 2:19）。底馬若終究離棄信仰，顯明他原不是屬基督的；若只是離開保羅、後來回來，則仍在神手中。</p><p><strong>難處：</strong>這個說法保護了確據，但若用來判斷別人「本來就不是真的」，同樣是在替神下結論；也可能讓人輕看警告。</p>"],["不判斷說（經文沒有說底馬的結局）","","<p>第三種讀法不在底馬身上決定神學爭論：經文只告訴我們他在一個時候還在名單裡，後來離開了保羅。他後來怎樣，經文沒有說；他離棄的是保羅的團隊、羅馬的危險，還是信仰本身，也沒有說清楚。保羅自己在同一章說「但願這罪不歸與他們」（提後 4:16），對離棄他的人留下了寬容。</p><p><strong>難處：</strong>這個讀法謹慎，但仍需要回答會眾的實際問題：我會不會走掉？</p>"],["【三】本講義站在哪裡","","<p><strong>本講義採不判斷說；得救確據的神學爭論兩派並陳，不在本章裁決。</strong>4:14 的底馬還在名單裡，還問安；他後來的離開，本卷只說「這使我們想起」提後 4:10，不作人身判斷、不拿來恐嚇。同一份名單裡也有被接回來的馬可。這一節留給我們的，是一個安靜的問題：今天在名單裡的我，靠甚麼留在名單裡？答案不在我夠不夠火熱，在 4:17 那一句託付和 4:18 最後那一句恩惠。本講義的全卷立場見 ISS00_9（爭議與信心）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你恐慌。如果你正在信心的低谷，擔心自己會像底馬一樣，那份擔心本身就說明你還在乎主。「我們縱然失信，他仍是可信的，因為他不能背乎自己」（提後 2:13）。</p><p>如果你所愛的人離開了教會，不要用底馬的名字定他的罪；繼續為他禱告，門還開著。</p>"]],"con":[],"say":"本講義的立場：4:14 的底馬此時仍在名單裡；他後來的離開（提後 4:10）只說「這使我們想起」，不作人身判斷、不拿來恐嚇。得救確據的兩派並陳，留在名單裡靠的是主的託付與恩惠。本講義的全卷立場見 ISS00_9。","care":"會眾席上有信心冷淡、害怕自己「已經離棄」的人，也有兒女、配偶離開教會而心碎的家人。不要用底馬嚇人，不要對家長說「你的孩子就是底馬」，也不要對正在掙扎的人說「你若真信就不會這樣」。會後單獨關心，陪他把掙扎說出來；若伴隨長期的無望、失眠或自我否定，協助他尋求專業協助。"},{"id":"ISS04_9","t":"4:15--16「寧法並她家裡的教會」「從老底嘉來的書信」——女性能帶領家庭教會嗎？遺失的書信會影響正典嗎？","r":"4:15--16；徒16:15；羅16:1--5；門1:2；帖前5:27","ch":[4],"why":"4:15 有經文鑑別的問題：寧法是男是女？若是一位姊妹，她在家裡的教會扮演甚麼角色？這牽動今天華人教會關於女性服事的爭論。4:16 又提到一封「從老底嘉來的書信」，我們今天找不到；有人因此懷疑聖經不完整，也有人宣稱找到了祕傳的書信。這兩件事都需要被誠實地陳列。","pos":[["【一】經文問的是甚麼","","<p>「請問老底嘉的弟兄和寧法，並她家裡的教會安。你們念了這書信，便交給老底嘉的教會，叫他們也念；你們也要念從老底嘉來的書信。」（4:15--16）SBLGNT 作 <strong>Νύμφαν……κατʼ οἶκον αὐτῆς</strong>（Nymphan … kat' oikon autēs），女性；RP 作男性 Νυμφᾶν……αὐτοῦ（autou）；Tregelles 作 αὐτῶν（autōn）「他們的」。問題有二：寧法的性別與角色；以及那封從老底嘉來的信是甚麼、在哪裡。</p>"],["女性家主說（寧法是一位接待並帶領家庭教會的姊妹）","","<p>多數現代學者與和合本採女性讀法：女性讀法是較難的讀法，抄寫者把女性家主改成男性，比反過來容易理解。初期教會有不少在家中接待教會的女性：呂底亞（徒 16:15）、百基拉（羅 16:3--5），還有「堅革哩教會中的女執事」非比（羅 16:1）。寧法很可能是家主、接待者，也在聚會中有實際的帶領責任。</p><p><strong>難處：</strong>經文沒有說明寧法在聚會中講道、施洗或擔任長老；從「家裡的教會」直接推論出某一種教會職分，超過了經文。</p>"],["男性家主說（寧法是男性，或家主另有其人）","","<p>拜占庭抄本傳統作男性，傳統上也有人讀寧法為男子；另有人認為即使寧法是女性，她只是提供場地的接待者，聚會的帶領另有長老。這一派常以此維持「女性不擔任教導權柄職分」的教會體制。</p><p><strong>難處：</strong>較早、較可靠的抄本支持女性讀法；為了體制立場而改讀性別，是讓結論決定經文。即使不談職分，保羅點名問候一位打開家門的姊妹，這個事實本身就該被尊重。</p>"],["老底嘉書信的三種說法","","<p>關於「從老底嘉來的書信」：一說是一封遺失的保羅書信；一說就是以弗所書——它可能是一封傳閱亞細亞各教會的信，由推基古同一趟帶到，先到老底嘉再轉到歌羅西；另有後世偽託的拉丁文《老底嘉書》，內容多抄自腓立比書，教會從來沒有接納。保羅的信本來就要在聚會中宣讀並傳閱（帖前 5:27「要把這信念給眾弟兄聽」）。</p><p><strong>難處：</strong>以弗所書之說有可能，但缺乏直接證據；遺失書信之說則需要面對「聖經是否完整」的疑問。</p>"],["【三】本講義站在哪裡","","<p><strong>寧法：</strong>本講義從 SBLGNT 與和合本，寧法是一位姊妹，教會在她家裡聚集；她是福音的同工，應當被尊重。至於她在聚會中的具體角色，經文沒有細說，女性服事的教會體制各宗派有不同的立場，本講義並陳、不替各教會決定。</p><p><strong>老底嘉書信：</strong>以弗所書之說有可能，但不能確定。神保守了他的教會所需要的；遺失的那一封，不使我們手上這一封少一分權威。任何宣稱握有「另一封祕傳書信」的說法，都要被 2:8 察驗（全卷立場見 ISS00_3、ISS00_7）。</p>"],["【四】這件事該不該影響你的信心","","<p>不該。寧法的性別與角色之爭，是忠於聖經的弟兄姊妹之間的次要爭議，不影響福音的核心；遺失一封信也不影響正典的權威——新約自己就說，保羅的信「念完了，交給下一間教會」，教會一代一代地辨認、收集、傳下來。</p><p>你手上的這一本，足夠你認識那位在凡事上居首位的主。</p>"]],"con":[],"say":"本講義的立場：寧法是一位姊妹，教會在她家裡聚集；她在聚會中的具體角色經文沒有細說，各宗派立場並陳。「從老底嘉來的書信」可能是以弗所書，不能確定；遺失的書信不減損正典的權威。本講義的全卷立場見 ISS00_3、ISS00_7。","care":"會眾席上有多年默默打開家門接待小組、卻從未被肯定的姊妹，也有因為教會對女性服事的立場而受傷、甚至離開的人。不要在講台上嘲諷其他宗派對女性服事的立場，也不要讓姊妹們覺得自己的服事是「次等的」。會後具體地謝謝那些打開家門的人；對因這個議題受傷的人，先聽他的經歷，不急著辯論。"}],"terrain":{"points":[[1.103,96,18,"使他可以在凡事上居首位","top"],[1.207,8,21,"你們從前與神隔絕","bot"],[1.241,82,22,"叫你們與自己和好",null],[1.826,20,8,"就把你們擄去","bot"],[1.913,90,10,"你們在他裡面也得了豐盛",null],[2.13,92,15,"就仗著十字架誇勝","top"],[2.6,88,3,"你們的生命與基督一同藏在神裡面",null],[2.68,24,5,"要治死你們在地上的肢體","bot"],[2.92,98,11,"惟有基督是包括一切，又住在各人之內","top"],[3.639,40,3,"我為此被捆鎖",null],[4.25,30,14,"底馬問你們安","bot"],[4.417,86,17,"盡你從主所受的職分","top"]]},"tracks":[{"gk":"πᾶς／τὰ πάντα","tr":"pas / ta panta","gl":"萬有、凡事、一切、各人、各樣","code":"G3956","root":"πᾶς——全部、每一個；τὰ πάντα（中性複數加冠詞）是「萬有」，指整個受造的宇宙。本卷 39 次，1:15–20 基督之歌六節之內就有 8 次","ins":"πᾶς 是歌羅西書的主追蹤，一條從宇宙縮到一件小事的線。第一站只是教會的美德：「並向眾聖徒的愛心」（1:4）；接著是禱告裡的「一切」：「凡事蒙他喜悅，在一切善事上結果子」（1:10）。1:16–20 的基督之歌把這個字撐到最大：「因為萬有都是靠他造的」，「萬有也靠他而立」，「使他可以在凡事上居首位」，「叫一切的豐盛在他裡面居住」，「便藉著他叫萬有」與神和好——萬有的來源、維持、目的與和好，全在一個人身上。1:28 宇宙忽然縮成一個一個的人：「勸戒各人，教導各人」，一節之內四次。第 2 章轉成反駁錯謬的根據：「所積蓄的一切智慧知識」都在他裡面，「神本性一切的豐盛」都住在他裡面——所以不必再加。3:11 是全卷頂點：「惟有基督是包括一切，又住在各人之內」。最後一站縮到每一件事：「無論做甚麼，或說話或行事，都要奉主耶穌的名」（3:17）。創造萬有的那一位，要在你今天的每一件小事上居首位。","stops":[["1:4","並向眾聖徒的愛心",""],["1:10","凡事蒙他喜悅，在一切善事上結果子",""],["1:16","因為萬有都是靠他造的","top"],["1:17","萬有也靠他而立",""],["1:18","使他可以在凡事上居首位","top"],["1:19","叫一切的豐盛在他裡面居住",""],["1:20","便藉著他叫萬有",""],["1:28","勸戒各人，教導各人","top"],["2:3","所積蓄的一切智慧知識",""],["2:9","神本性一切的豐盛","top"],["3:11","惟有基督是包括一切，又住在各人之內","top"],["3:17","無論做甚麼，或說話或行事，都要奉主耶穌的名","top"]]},{"gk":"σύν／συν-（與基督同）","tr":"syn","gl":"一同埋葬、一同復活、一同活過來、同死、一同藏、一同顯現","code":"G4862","root":"σύν——和……一起；保羅把它接在動詞前面造出一串「同」字動詞：συνθάπτω（同埋）、συνεγείρω（同復活）、συζωοποιέω（同活過來）。腓立比書的 συν- 是同工與同工的橫線，歌羅西書的 σύν 是我與基督的直線","ins":"這一條追蹤是 321「無己」在歌羅西書的文法。第一站是保羅和教會的「同」：「心卻與你們同在」（2:5）。2:12 換成我和基督的「同」，而且一口氣兩個：「你們既受洗與他一同埋葬，也就在此與他一同復活」——洗禮的兩個動作。2:13 一節之內動詞與介詞各一個「同」：「便叫你們與基督一同活過來」。2:20 從這個「同」推出自由：「你們若是與基督同死」，為甚麼還服從規條？3:1 推出方向：「你們若真與基督一同復活」，就當求在上面的事。3:3 是安全：「你們的生命與基督一同藏在神裡面」，完成式，已經藏好了。3:4 是終點：「你們也要與他一同顯現在榮耀裡」。最後一站回到人：「我又打發一位親愛忠心的兄弟阿尼西謀同去」（4:9）——一個逃跑的奴隸，和送信人一同回家。與基督同死的人，才擠得進彼此的生命裡。","stops":[["2:5","心卻與你們同在",""],["2:12","你們既受洗與他一同埋葬，也就在此與他一同復活","top"],["2:13","便叫你們與基督一同活過來","top"],["2:20","你們若是與基督同死",""],["3:1","你們若真與基督一同復活","top"],["3:3","你們的生命與基督一同藏在神裡面","top"],["3:4","你們也要與他一同顯現在榮耀裡","top"],["4:9","我又打發一位親愛忠心的兄弟阿尼西謀同去",""]]},{"gk":"σοφία／ἐπίγνωσις","tr":"sophia / epignōsis","gl":"智慧、真知道、知識","code":"G4678","root":"σοφία——智慧，懂得怎樣活；ἐπίγνωσις——ἐπί＋γνῶσις，深入、親身的認識，和合本常譯「真知道」。歌羅西的錯謬教師自稱有更高的智慧，保羅說一切智慧都藏在基督裡","ins":"智慧在歌羅西書走了一條從禱告走到街上的路。起點是認識恩典：「真知道神恩惠的日子」（1:6）。1:9–10 是保羅的禱告：「願你們在一切屬靈的智慧悟性上，滿心知道神的旨意」，而且「漸漸地多知道神」——認識是會長大的。1:28 智慧成了傳道的方法：「是用諸般的智慧」勸戒各人。2:2–3 是全卷的樞紐：真知的對象「就是基督」，「所積蓄的一切智慧知識，都在他裡面藏著」——智慧有了地址。2:23 翻轉：錯謬的規條「使人徒有智慧之名」，有名無實。3:10 智慧回到新人身上：「這新人在知識上漸漸更新」。3:16 變成群體的事：「當用各樣的智慧」彼此教導。最後一站走出教會：「用智慧與外人交往」（4:5）。這不是反智，是把一切智慧帶回基督裡，再帶到外人面前。","stops":[["1:6","真知道神恩惠的日子",""],["1:9","願你們在一切屬靈的智慧悟性上，滿心知道神的旨意","top"],["1:10","漸漸地多知道神",""],["1:28","是用諸般的智慧",""],["2:2","使他們真知神的奧祕，就是基督",""],["2:3","所積蓄的一切智慧知識，都在他裡面藏著","top"],["2:23","這些規條使人徒有智慧之名","bot"],["3:10","這新人在知識上漸漸更新","top"],["3:16","當用各樣的智慧",""],["4:5","用智慧與外人交往","top"]]},{"gk":"μυστήριον／κρύπτω／φανερόω","tr":"mystērion / kryptō / phaneroō","gl":"奧祕、隱藏、藏著、顯明、顯現、發明","code":"G3466","root":"μυστήριον——從前隱藏、如今由神顯明的計畫，不是只有少數人懂的秘密知識；κρύπτω／ἀπόκρυφος——藏、藏寶處；φανερόω——顯出來、讓人看見","ins":"這一條追蹤是藏與顯的一齣戲。1:26 一節之內就從藏走到顯：「這道理就是歷世歷代所隱藏的奧祕；但如今向他的聖徒顯明了」。1:27 揭開奧祕的內容：「這奧祕在外邦人中有何等豐盛的榮耀」，就是基督在你們心裡——奧祕不是一套秘密知識，是一個住進來的人。2:2–3 再說一次：神的奧祕「就是基督」，一切智慧知識「都在他裡面藏著」；錯謬的教師說秘密在我們這裡，保羅說秘密都藏在基督裡。3:3 翻轉：藏著的不只是知識，是我們自己——「你們的生命與基督一同藏在神裡面」。3:4 是終點：「他顯現的時候，你們也要與他一同顯現在榮耀裡」。最後兩站，顯明成了一個人的使命：「能以講基督的奧祕」，「叫我按著所該說的話將這奧祕發明出來」（4:3–4）——而他為此被捆鎖。藏著的是我，顯出來的是他。","stops":[["1:26","這道理就是歷世歷代所隱藏的奧祕；但如今向他的聖徒顯明了","top"],["1:27","這奧祕在外邦人中有何等豐盛的榮耀","top"],["2:2","使他們真知神的奧祕，就是基督",""],["2:3","都在他裡面藏著",""],["3:3","你們的生命與基督一同藏在神裡面","top"],["3:4","他顯現的時候，你們也要與他一同顯現在榮耀裡","top"],["4:3","能以講基督的奧祕",""],["4:4","叫我按著所該說的話將這奧祕發明出來","top"]]},{"gk":"κύριος","tr":"kyrios","gl":"主、主人","code":"G2962","root":"κύριος——主人、主；希臘文舊約用它翻譯神的名字。同一個字可以指家裡的主人，也可以指天上的主——歌羅西書的家規 3:18–4:1 就在這個雙關上","ins":"κύριος 在歌羅西書從一個稱號走進廚房和田地。起點是問安裡的稱號：「我們感謝神我們主耶穌基督的父」（1:3）；接著是生活的標準：「好叫你們行事為人對得起主」（1:10）。2:6 是全卷樞紐：「你們既然接受了主基督耶穌」——主不只是被相信的道理，是被接受的人。3:13、17 主成了饒恕和一切言行的源頭：「主怎樣饒恕了你們」，「都要奉主耶穌的名」。然後這個字走進家裡：「這在主裡面是相宜的」（3:18）。3:22–24 是一個雙關：「要凡事聽從你們肉身的主人」——同一個字，馬上又說「像是給主做的，不是給人做的」，「你們所事奉的乃是主基督」；一個奴隸真正的主人在天上。4:1 翻轉給主人聽：「因為知道你們也有一位主在天上」。最後一站是職分的來源：「盡你從主所受的職分」（4:17）。家裡和職場，就是他作王的第一個地方。","stops":[["1:3","我們感謝神我們主耶穌基督的父",""],["1:10","好叫你們行事為人對得起主",""],["2:6","你們既然接受了主基督耶穌","top"],["3:13","主怎樣饒恕了你們",""],["3:17","都要奉主耶穌的名",""],["3:18","這在主裡面是相宜的",""],["3:22","要凡事聽從你們肉身的主人","bot"],["3:23","像是給主做的，不是給人做的","top"],["3:24","你們所事奉的乃是主基督","top"],["4:1","因為知道你們也有一位主在天上","top"],["4:17","盡你從主所受的職分","top"]]}],"lesson":{"1":{"no":1,"vol":"《321歌羅西書講義》第一課·歌羅西書第一章","title":"使他可以在凡事上居首位——像、首、和","chars":5329,"min":60,"deep":8,"dchars":1712,"tchars":1303,"blocks":[["h","一、一封寫給沒見過面的人的信"],["p","弟兄姊妹平安。一封信最難寫的，是寫給從來沒見過面的人。你不知道他們長甚麼樣子，不知道誰會點頭、誰會皺眉；你們之間沒有一起吃過的飯，也沒有一起走過的路。歌羅西書就是這樣一封信。保羅在第二章自己說了：「我願意你們曉得，我為你們和老底嘉人，並一切沒有與我親自見面的人，是何等地盡心竭力」（2:1）。"],["p","寫信的人在捆鎖中，對這間教會知道的一切都是聽來的；帶消息來的是以巴弗，歌羅西本地人，教會就是他建立的。保羅口述，同工一句一句寫下來。請你數一數這一頁有幾次「聽見」：「因聽見你們在基督耶穌裡的信心」（1:4）；盼望是「你們從前在福音真理的道上所聽見的」（1:5）；「我們自從聽見的日子」（1:9）。兩群沒見過面的人，中間連著的只有一樣東西：同一個福音，同一位主。"],["p","寫給陌生人，最自然的是先多介紹自己。保羅卻很快就叫他們的名字：「寫信給歌羅西的聖徒，在基督裡有忠心的弟兄」（1:2）。兩個地址並排放著。歌羅西是呂克斯河谷裡一座已經沒落的小城，地上的地址很小；另一個地址是「在基督裡」，那一個決定他們屬於誰。整封信的問題就藏在這裡：有人想在「在基督裡」之外，再替他們加一個地址。"],["p","保羅還沒有提問題，先感謝（1:3）。他聽見三樣：向上的信心，向著「眾聖徒」、不挑人的愛心，和「那給你們存在天上的盼望」（1:5）。盼望像一筆寫上你名字、鎖在庫房裡的產業；一個知道該有的早已存好的人，在地上就不必搶，也不必再去找一個「進階版」。"],["p","然後是一幅繁殖的照片。使徒行傳講義第 19 章講過，保羅在以弗所的學房裡天天講論，「這樣有兩年之久，叫一切住在亞細亞的……都聽見主的道」（徒 19:10）。是學房裡的人走回了自己的城；以巴弗大概就是其中一位，教會就在他的家鄉長出來。所以保羅說：「這福音傳到你們那裡，也傳到普天之下，並且結果，增長」（1:6）。主詞是福音，福音自己在長。"],["p","保羅稱這位建立者是「我們所親愛、一同作僕人的以巴弗」（1:7），不是我的學生，是同作奴僕的。以巴弗報告的第一件，是他們「因聖靈所存的愛心」（1:8）。照書信三問，先問第一問：歌羅西人遇到甚麼？一間很有愛心的小教會，旁邊有人在說：基督很好，可是還不夠，要再加一點。這一課我們跟著這封寫給陌生人的信，走完第一章：像、首、和。"],["d",["保羅沒去過歌羅西，那間教會是誰建立的？以巴弗和以巴弗提是同一個人嗎？","從 1:7、2:1 和 4:12--13 看，保羅一生沒有到過歌羅西，教會是以巴弗建立的；他大概是在以弗所聽了福音，回到家鄉去傳。他的名字可能是以巴弗提的縮寫，但和腓立比書那一位是不同的人。這個問題對今天很實際：保羅稱他是「一同作僕人的」，把他放在和自己同一個身分上。若你在小鎮、小教會默默服事多年，覺得自己比不上大教會的牧者，請聽這一句：福音能長到歌羅西，靠的正是以巴弗這樣的人。這一週也可以為一位這樣的同工具體感謝神，並讓他知道。"]],["h","二、他先禱告：被充滿、被加力、被遷移"],["p","以巴弗帶來的消息只有一半讓人放心。保羅聽完，沒有先寫一篇駁斥錯謬的論文，他先禱告：「因此，我們自從聽見的日子，也就為你們不住地禱告祈求」（1:9）。他求的，正是那些教師在兜售的東西：智慧、知識、屬靈的長進。真的那一份，他替他們向神求。"],["p","「願你們在一切屬靈的智慧悟性上，滿心知道神的旨意」（1:9）。「滿心知道」是被動語態：充滿你的是神。這一句保護了兩件事。第一，信仰不反對讀書和思考。第二，神的旨意不是一場猜謎，不是怕走錯一步就毀掉一生；大方向寫在經上，具體的抉擇在禱告、聖經和屬靈同伴的印證裡慢慢清楚。"],["p","知道了做甚麼？「好叫你們行事為人對得起主，凡事蒙他喜悅，在一切善事上結果子，漸漸地多知道神」（1:10）。知識的終點不是腦袋，是腳。「結果子」第 6 節用過，主詞是福音；這裡主詞換成了人。福音在長，也叫人長，而且是「漸漸地」，樹的速度，不是煙火的速度。"],["p","神的大能用來做甚麼？保羅說：「好叫你們凡事歡歡喜喜地忍耐寬容」（1:11）。最大的能力，用在最平凡的地方：同一個難相處的同事，同一場拖了三年的病。撐得下去，而且帶著喜樂，這本身就是神蹟。"],["p","接著是第二個感謝：「又感謝父，叫我們能與眾聖徒在光明中同得基業」（1:12）。「叫我們能」原文是「使我們夠資格」。讓人覺得自己不夠格，是錯謬教導最常用的手法：你還沒有某種經歷，還沒有升到某個階段。保羅說：資格已經給了，給的是父。你不必再去買一張入場券，你已經坐在裡面了。"],["p","然後是一個大動作：「他救了我們脫離黑暗的權勢，把我們遷到他愛子的國裡」（1:13）。「遷」是古代戰勝的王把一整座城的人搬到自己的國土上落戶，歌羅西一帶就住著這樣遷來的猶太家庭。神不是把我們撈出來放在中間地帶，他是整批搬家，換了國籍。說到「愛子」，保羅停不下來了：原文從第 9 節到第 20 節是一條長句，禱告滑進救恩，救恩滑進一首詩歌。"],["d",["「滿心知道神的旨意」，是不是表示神對我的婚姻和工作都有一張具體藍圖，找錯就毀了？","1:9 的「滿心知道」是被神充滿，而且是在「一切屬靈的智慧悟性上」，不是靠抽籤或某一位屬靈人的一句話去猜藍圖。神旨意的大方向寫在經上：信靠他、愛人、聖潔、讓基督在凡事上居首。具體的抉擇，像換工作、搬家、跟誰結婚，在禱告、讀經、屬靈同伴的印證和清楚的思考裡慢慢明白；神看重的是與你同行，不是考你猜謎。所以不必因為怕錯過而多年不敢決定。若你曾因為有人說「神告訴我你們要結婚」而受了傷，那不是你沒聽清楚；請說給一位信得過的牧者聽，必要時尋求專業協助（各家討論見本章議題頁）。"]],["h","三、原文亮光：像、首生、居首位"],["p","這首基督之歌有兩節：第一節唱創造（1:15--17），第二節唱和好（1:18--20），兩節都有「首生」，都用「因為」給理由。請先不要急著問「那我要怎樣」，讓這首歌唱完。"],["p","第一個原文字：εἰκὼν（eikōn），像。「愛子是那不能看見之神的像」（1:15）。這個「像」不是模糊的影子，是把原型呈現出來的形像。主對腓力說：「人看見了我，就是看見了父」（約 14:9）。歌羅西城裡，人靠廟宇、天使和異象去接近看不見的神明；保羅說：你想知道神是甚麼樣子，看基督就夠了。"],["p","第二個原文字：πρωτότοκος（prōtotokos），首生的。「是首生的，在一切被造的以先」（1:15）。有人讀成：首生就是第一個生的，所以耶穌是神造的第一個。請不要停在這裡，讀下一節的第一個字，原文 ὅτι（hoti），「因為」：「因為萬有都是靠他造的」（1:16）。保羅說他是首生的，理由是萬有都是他造的；造萬有的那一位，不在受造之物的清單上。首生在聖經裡常常是地位與承受權。詩篇說到大衛：「我也要立他為長子，為世上最高的君王」（詩 89:27）；大衛是家裡最小的，「長子」說的是地位。第 18 節再說一次：他「是從死裡首先復生的」（1:18）；在他以前也有人被叫回來，他仍是首生。兩次首生，說的都是地位，不是次序。"],["p","我知道台下可能有人的家人或朋友是耶和華見證人，他們很認真，在雨天也去按門鈴。請不要把他們當作笑料或敵人。最好的回應不是一句反駁，是邀請：我們一起把第 16 節開頭那兩個字讀出來，好嗎？"],["p","「或是有位的，主治的，執政的，掌權的；一概都是藉著他造的，又是為他造的」（1:16）。歌羅西人怕的、想討好的那些看不見的權勢，都在這張清單上，而清單的標題是：他造的。對在拜拜文化裡長大的人，這是好消息：你從小被教要怕的，不在基督之上，也不在基督之外，不必擇日、怕沖煞，也不必另找一位更靈的中保。「他在萬有之先；萬有也靠他而立」（1:17）。「立」原文 συνέστηκεν（synestēken），完成式：一直到今天，萬有都靠他凝聚在一起。"],["p","第三個原文字：πρωτεύων（prōteuōn），居首位，全本新約只用這一次。「他也是教會全體之首。他是元始，是從死裡首先復生的，使他可以在凡事上居首位」（1:18）。管宇宙的那一位，親自作一群小城信徒的頭。「凡事」原文 ἐν πᾶσιν（en pasin），不是大部分的事，是凡事。歌羅西的問題不是有人反對基督，是有人讓基督只在「某些事」上居首：救恩給他，智慧給哲學，靈界給天使。華人教會的版本是：主日給基督，婚姻給八字，生意給風水，把他擺進一排神明和方法裡，當作其中一個。"],["p","第二節詩的理由是：「因為父喜歡叫一切的豐盛在他裡面居住」（1:19）。「父」字是和合本補的，原文也可以讀成：一切的豐盛樂意住在他裡面。怎麼讀都一樣：神沒有把自己分散在天使、異象和苦修裡讓人去收集，全部都在他裡面，而且是定居。然後歌唱到最高處：「既然藉著他在十字架上所流的血成就了和平」（1:20）。最高點不是寶座，是十字架。這一節不是說人不論信不信都會得救，三節之後保羅就說「只要你們在所信的道上恆心」（1:23）；可是也不要因為怕講錯，就不敢講十字架有這麼大。"],["d",["如果耶和華見證人的朋友說「首生就是第一個被造的」，我可以怎樣回應？","第一，先尊重。他們多半很認真，也願意談聖經；不要嘲笑，也不要一開口就要贏。第二，邀請他一起讀，而不是只講結論：把 1:15 和 1:16 連著讀，留意 1:16 開頭的「因為」。他是首生的，理由是萬有都是靠他造的；如果他也是被造的，「萬有」裡就有一樣不是他造的，就是他自己。第三，翻到詩篇 89:27，大衛是家裡最小的，神卻要立他為長子，可見首生可以是地位。第四，翻到 1:18，在他以前也有人從死裡被叫回來，他仍是首生。說完就停，給他時間，不催逼；言語要「好像用鹽調和」（4:6）。"]],["d",["1:19 的「父」字是和合本補的，這樣是不是表示我們的聖經被人改過？","不是。和合本有些字用特別的記號印出來，表示原文沒有這個字，譯者為了讓中文讀得通而補上。這不是偷偷改，正好相反，是譯者向讀者誠實交代：這個字是我加的。1:19 原文的動詞沒有寫出主詞，可以讀成神喜歡叫豐盛住在他裡面，也可以讀成一切的豐盛樂意住在他裡面；和合本選了第一種。兩種讀法說的是同一件事：神的全部都在基督裡，2:9 也這樣說。如果身邊有年輕人因為發現補字而開始懷疑，不要叫他不要想那麼多，陪他一起看原文，讓疑問變成更認識經文的入口。"]],["d",["1:20 說「叫萬有都與自己和好」，那麼是不是每一個人最後都會得救？","這一節說的是十字架的範圍有多大：受造界因罪而破碎的一切，都要在基督裡被修復，不必因為怕講錯就略過。可是保羅三節之後就說「只要你們在所信的道上恆心」，可見人仍要回應。本講義不採普救論，但也不在講台上判定任何一位已經離世的人的結局。如果你的父母、配偶或孩子沒有信主就離開了，這一題會碰到你心裡最痛的地方。你可以把所愛的人交在滿有憐憫的神手中；若哀傷很久、很重，請讓我們會後陪你，必要時協助尋求哀傷輔導（見本章議題頁）。"]],["h","四、但如今：基督在你們心裡"],["p","歌剛唱到萬有、寶座、豐盛，鏡頭忽然轉到聽信的人身上：「你們從前與神隔絕，因著惡行，心裡與他為敵」（1:21）。全章最高和最低的地方，只隔三節。「隔絕」是外人的處境，根本不屬於這個家；「心裡與他為敵」更深，敵意先在心思裡，然後才在行為裡。不感興趣的底下，常常是一個不要神來管的心。"],["p","然後是兩個字：「但如今他藉著基督的肉身受死，叫你們與自己和好，都成了聖潔，沒有瑕疵，無可責備，把你們引到自己面前」（1:22）。原文 νυνὶ δὲ（nyni de），一個強調的「但如今」，把整個「從前」翻過去。居首位的那一位，沒有站在最高處等我們爬上去；他用自己真實的肉身受死，跨過了最低的那一段距離。不是我們先伸手，是他先跨過來。"],["p","「只要你們在所信的道上恆心，根基穩固，堅定不移」（1:23）。這一句不是恐嚇；原文的語氣近似「既然你們是會持續的」，是牧者的提醒。「引動」是被一點一點推離原地。錯謬的教導很少叫人放棄基督，它只說：基督很好，但你還需要……每加一樣，就離開一點。"],["p","接著是全章最容易被誤用的一句：「要在我肉身上補滿基督患難的缺欠」（1:24）。這不是說基督的救恩還不夠，兩節以前才說和好已經完成了。「患難」原文 θλῖψις（thlipsis），在新約從來不用來指基督贖罪的受苦，而是指傳福音的人在路上所受的苦。基督受苦，完成了救恩；他的使者受苦，把救恩送到人那裡。缺的不是救恩，是路程。所以有兩條界線：不可說「你要多受苦，才能補足耶穌沒做完的」；也不可對一個在家裡挨打、在職場被霸凌、在教會被控制的人說「這是在補滿基督的患難，忍下去」。受虐不是為福音受苦，教會的責任是陪他到安全的地方。"],["p","「這道理就是歷世歷代所隱藏的奧祕；但如今向他的聖徒顯明了」（1:26）。歌羅西城裡有許多祕傳的儀式，只給進階的少數人；保羅說，真正的奧祕已經顯明給所有聖徒，基督教沒有內圈和外圈。內容只有一句：「就是基督在你們心裡成了有榮耀的盼望」（1:27）。原文 Χριστὸς ἐν ὑμῖν（Christos en hymin）。創造萬有的那一位，住進了一個奴僕、一位婦人、一個賣羊毛的商人心裡。"],["p","所以保羅說：「我們傳揚他，是用諸般的智慧，勸戒各人，教導各人」（1:28），一節裡三次「各人」。剛唱完萬有，下一個畫面是一個一個的人。「我也為此勞苦，照著他在我裡面運用的大能盡心竭力」（1:29）。一個被鎖住的人，為一群從沒見過的人勞苦，力氣卻不是自己的。書信三問的第二問到這裡有了答案：一切的豐盛都在基督裡，他已經叫我們和好，而且住進來了；在他以外，不必再加。第三問，落在今天的家、職場和教會。"],["d",["1:23「只要你們在所信的道上恆心」，是不是表示得救的人隨時可能失去救恩？","這一節的語氣不是恐嚇。原文是帶著把握的條件句，接近「既然你們是會持續的」，像牧者看著一群已經站在根基上的人說：不要被推離根基。歷代教會對這一題有不同的理解，改革宗強調神的保守，衛斯理宗強調人要持續回應，各家討論見本章議題頁。可是這一章的次序很清楚：先有 1:22 神作成的和好，然後才有 1:23 的恆心。恆心是對已經得著的回應，不是每天考試。若你每次犯錯就懷疑自己是否得救，請讀 1:22 和 3:3；若焦慮已經影響睡眠與生活，也請尋求專業協助。"]],["d",["有人拿 1:24 勸我：「你在家裡受的苦是在補滿基督的患難，要忍耐，不要離開。」我該怎麼想？","這不是 1:24 的意思。第一，基督的救恩已經完成，1:22 說他藉著肉身受死叫我們與神和好，不需要任何人用被傷害去補。第二，保羅說的「患難」，在新約是指傳福音的人為福音所受的苦；他是「為你們」「為教會」受苦，為了把福音送到人那裡。家庭暴力、職場霸凌、在教會被屬靈控制，不是為福音受苦，那是傷害，需要被制止。若你現在正處在不安全的地方，請先保護自己和孩子的安全，告訴一位信得過的人，聯絡當地的保護專線或專業協助。教會的責任是陪你到安全的地方，不是勸你留下。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是把 1:15「首生的」講成耶穌是神造的第一個受造者，或只講「在一切被造的以先」，卻沒有讀到 1:16 開頭的「因為」。1:18 第二次首生更說明，這是地位與承受權，不是出生次序。"],["p","第二個偏差，是講這一段時嘲笑、模仿或攻擊耶和華見證人，拿他們當講台上的笑料。可以問自己：如果有一位坐在台下，他是覺得被尊重、願意再談，還是被羞辱？"],["p","第三個偏差，是把 1:24 講成基督的救恩不夠，要靠我們的受苦去補足；或拿這一節勸受暴力、被霸凌、被屬靈控制的人留下來忍耐。和好已經完成（1:22）；為福音受苦和留在虐待中是兩件事。"],["p","第四個偏差，是講 1:16 的「執政的，掌權的」時大談靈界層級與邪靈的名字，讓人回家更怕鬼月和沖煞；或反過來嘲笑還在拜拜的長輩。這張清單是要叫人更平安：一切權勢都是他造的。"],["p","第五個偏差，是把「居首位」講成會眾要自己努力達成的目標：你要更委身，耶穌才能在你身上居首；或拿 1:23 嚇人。這一章的動詞幾乎都是神在做：救了、遷了、造了、和好了、住進來了。讓他居首，是回應，不是爬上去。"],["h","六、兩個華人處境的真實問題"],["p","第一個問題：「多一層保護」。孩子考試前，書包裡被塞了一個平安符；公司開工那天，大家一起拜一下，你心想只是禮貌；出門前看一眼今天宜不宜。很少有人說「我不要耶穌」，我們說的是：耶穌很好，可是再加一點比較安心。1:16 給的不是嘲笑，是平安：你怕的那一切都是他造的。若那是長輩的東西，先尊重，先禱告，不要趁他不在就丟掉；讓他從你身上看見，造萬有的那一位比護身符更可靠。"],["p","第二個問題：「我還缺一樣」。很多人信主多年，仍覺得自己少了甚麼：少一次特別的經歷，少一門進階課，少一位更有恩膏的人按手。華人很會補習，也把補習的心帶進信仰。1:12 說資格是父給的，1:19 說一切的豐盛都住在他裡面。上課、被造就都是好的，但不是為了補足欠缺，是在已經滿了的基督裡長大。小教會裡默默服事的同工也一樣，保羅稱以巴弗是「一同作僕人的」。"],["d",["家裡長輩給孩子的平安符，或家中的神明桌，我信主以後應該怎麼處理？","先分清楚自己的和長輩的。你自己留著的「多一層保護」，可以在主面前拿掉，不必嘲笑過去的自己，只要說：萬有靠你而立，我不需要它了。長輩的東西，先尊重，先為他禱告，不要趁他不在就丟掉，也不要在他面前說那是魔鬼。他給孩子平安符，多半是因為愛；先謝謝他的心意，再溫柔地說明。神明桌常牽涉祭祖、孝道和家族關係，最好和家人商量，也請教牧者，一步一步來。1:16 說一切權勢都是他造的，所以你不必怕；4:6 說言語要帶著和氣，所以你也不必急。"]],["h","七、活出321——讓他坐回主位"],["p","走到這裡，我們才把國度321空中團契常說的「焦點在耶穌，不
